<title>기후공시 리딩 클래스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 좁은 읽기 칼럼(종이) + 서재(영역별 선반에 꽂힌 책등). 장식 없이, 책과 문단 번호가 구조를 만든다. */
:root{
  --paper:#f6f1e6; --paper2:#efe8d9; --sheet:#fbf8f1; --ink:#22201b; --ink2:#4b463d; --muted:#857d6f; --rule:#e2d9c6; --rule2:#cfc3aa;
  --accent:#1f4e5a; --accent-ink:#ffffff;
  --a-dis:#2b5c8a; --a-ghg:#b2552c; --a-lca:#3d7a52; --a-law:#6b4f8c; --a-base:#8a7a52; --a-cut:#8a6d1f;
  --hl-y:#f4dd7a; --hl-g:#bfe0b0; --hl-b:#bcd6ef; --ul:#b2552c;
  --good:#2f7a3d; --bad:#b23b2c;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16171a; --paper2:#1d1f23; --sheet:#1b1d21; --ink:#ece6da; --ink2:#c9c2b4; --muted:#938b7d; --rule:#2c2f35; --rule2:#3c4048;
  --accent:#7fb3c0; --accent-ink:#0f1416;
  --a-dis:#6e9cc9; --a-ghg:#d98a62; --a-lca:#7fb48d; --a-law:#a78bc8; --a-base:#bba878; --a-cut:#d4b45c;
  --hl-y:#6b5a18; --hl-g:#2f5230; --hl-b:#24425f; --ul:#e0905f; --good:#7cc489; --bad:#e2806f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16171a; --paper2:#1d1f23; --sheet:#1b1d21; --ink:#ece6da; --ink2:#c9c2b4; --muted:#938b7d; --rule:#2c2f35; --rule2:#3c4048;
  --accent:#7fb3c0; --accent-ink:#0f1416;
  --a-dis:#6e9cc9; --a-ghg:#d98a62; --a-lca:#7fb48d; --a-law:#a78bc8; --a-base:#bba878; --a-cut:#d4b45c;
  --hl-y:#6b5a18; --hl-g:#2f5230; --hl-b:#24425f; --ul:#e0905f; --good:#7cc489; --bad:#e2806f; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:16px}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:720px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:56px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo i{display:flex;gap:2px;height:20px;align-items:flex-end}.logo i b{width:4px;border-radius:1px}
.bar nav{display:flex;gap:2px;margin-left:auto}
.bar nav a{white-space:nowrap;text-decoration:none;padding:7px 12px;border-radius:6px;font-size:14px;color:var(--ink2)}
.bar nav a[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--paper2)}
.theme{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--rule2);border-radius:999px;background:transparent;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2);white-space:nowrap}
.proto{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
/* views */
.view{padding-block:28px 80px;animation:vin .35s ease both}
@keyframes vin{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--rule2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:default}
/* ===== SHELF ===== */
.cont{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px 24px;border-radius:14px;background:var(--sheet);border:1px solid var(--rule);margin:14px 0 34px}
.cover{width:74px;height:100px;border-radius:3px 6px 6px 3px;background:var(--c);color:#fff;position:relative;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 6px 14px -8px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-family:var(--serif);font-weight:700;font-size:13px;line-height:1.25}
.cont .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.cont .meta b{font-family:var(--serif);font-size:21px;line-height:1.35}
.cont .meta span{color:var(--ink2);font-size:14px}
.cont .pb{height:5px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:6px;max-width:320px}.cont .pb i{display:block;height:100%;background:var(--c)}
.side-stats{display:flex;gap:18px;margin:0 0 6px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.side-stats b{font-family:var(--mono);color:var(--ink)}
.shelves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 40px}
.shelf{min-width:0}
.shelf.wide{grid-column:1/-1}
.shelf h3{flex-wrap:wrap}
@media (max-width:900px){.shelves{grid-template-columns:1fr}}
.shelf h3{font-size:14px;font-weight:700;display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.shelf h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.rack{display:flex;align-items:flex-end;gap:6px;padding:0 10px;min-height:236px;border-bottom:7px solid var(--rule2);position:relative;overflow-x:auto;scrollbar-width:thin}
.rack::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:4px;background:var(--rule)}
.spine{flex:none;width:var(--w,46px);height:var(--h,190px);border:0;border-radius:3px 3px 1px 1px;cursor:pointer;position:relative;background:color-mix(in srgb,var(--c) 22%,var(--sheet));color:var(--ink);box-shadow:inset -3px 0 0 rgba(0,0,0,.08),inset 3px 0 0 rgba(255,255,255,.18);transition:transform .25s cubic-bezier(.2,.7,.2,1);overflow:hidden;text-align:left;padding:0}
.spine:hover,.spine:focus-visible{transform:translateY(-10px)}
.spine .fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*100%);background:var(--c);transition:height 1s cubic-bezier(.2,.7,.2,1)}
.spine .t{position:absolute;inset:12px 0 40px;writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:13px;line-height:1.15;overflow:hidden;letter-spacing:.02em;display:flex;align-items:center;justify-content:flex-start;padding:0 0 0 0;color:var(--ink);mix-blend-mode:normal}
.spine.done .t{color:#fff}
.spine.on .t{color:var(--ink)}
.spine .band{position:absolute;left:6px;right:6px;bottom:12px;height:2px;background:currentColor;opacity:.35}
.spine .st{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.spine.on .st,.spine.done .st{color:#fff}
.spine.done .t{inset:12px 0 52px}
.spine .stamp{position:absolute;bottom:30px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:9px;font-weight:800;border:1.5px solid #fff;color:#fff;padding:1px 3px;border-radius:3px;letter-spacing:.04em}
.spine.rec{outline:2px dashed color-mix(in srgb,var(--c) 70%,transparent);outline-offset:3px}
.tip{font-size:12.5px;color:var(--muted);margin-top:14px}
/* ===== CARD GRID ===== */
.hero{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:0;margin:12px 0 18px;border-radius:16px;overflow:hidden;text-decoration:none;background:var(--sheet);border:1px solid var(--rule);transition:transform .25s,box-shadow .25s}
.hero:hover{transform:translateY(-2px);box-shadow:0 18px 40px -26px color-mix(in srgb,var(--c) 80%,transparent)}
.hface{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:22px;min-height:170px;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 92%,#000) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 70%,#fff) 140%)}
.hface::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.07) 23px 24px);pointer-events:none}
.hface .ar{font-family:var(--mono);font-size:11px;letter-spacing:.08em;opacity:.8}
.hface b{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1.2}
.hp{height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.hp i{display:block;height:100%;width:calc(var(--p)*100%);background:#fff;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
.hmeta{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:22px 26px;min-width:0}
.hmeta .k{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.hmeta b{font-family:var(--serif);font-size:24px;line-height:1.35}
.hmeta span{color:var(--ink2);font-size:14px}
.hmeta .go{align-self:flex-start;margin-top:8px;background:var(--c);color:#fff;font-weight:700;padding:9px 16px;border-radius:8px;font-size:14px}
@keyframes grow{from{width:0}}
.row{margin-top:30px}
.rowh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rowh h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}.rowh h3 i{width:4px;height:16px;border-radius:2px}
.rowh span{font-size:12.5px;color:var(--muted)}.rowh small{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:14px}
.bcard{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;text-decoration:none;background:var(--sheet);border:1px solid var(--rule);transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,border-color .22s;animation:vin .45s ease both}
.bcard:hover,.bcard:focus-visible{transform:translateY(-4px);box-shadow:0 16px 30px -22px color-mix(in srgb,var(--c) 90%,transparent);border-color:color-mix(in srgb,var(--c) 45%,var(--rule))}
.face{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;aspect-ratio:16/8;padding:14px 16px;background:color-mix(in srgb,var(--c) 14%,var(--sheet));border-bottom:1px solid var(--rule);overflow:hidden}
.face::after{content:"";position:absolute;right:-20px;top:-30px;width:110px;height:110px;border-radius:50%;border:14px solid color-mix(in srgb,var(--c) 18%,transparent)}
.face .ar{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.face b{font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.25;color:var(--ink);position:relative;z-index:1;text-wrap:balance}
.bcard.on .face,.bcard.done .face{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 88%,#000),var(--c));}
.bcard.on .face b,.bcard.done .face b,.bcard.on .face .ar,.bcard.done .face .ar{color:#fff}
.bcard.on .face::after,.bcard.done .face::after{border-color:rgba(255,255,255,.14)}
.badge{position:absolute;top:10px;left:12px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--c);color:#fff;z-index:1}
.badge.ok{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.6)}
.bcard.rec{border-color:color-mix(in srgb,var(--c) 60%,var(--rule));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
.info{display:flex;flex-direction:column;gap:6px;padding:12px 16px 14px}
.info .sub{font-size:13px;color:var(--ink2);line-height:1.45;min-height:2.9em}
.pr{height:4px;border-radius:2px;background:var(--rule);overflow:hidden}.pr i{display:block;height:100%;width:calc(var(--p)*100%);background:var(--c);animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
.info .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@media (max-width:640px){
  .hero{grid-template-columns:1fr}.hface{min-height:120px}
  .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 0;padding-right:16px;scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .bcard{flex:0 0 72%;scroll-snap-align:start}
}
/* v0.3 shelf */
.ico{width:20px;height:20px;flex:none}
.hface .ico.big{position:absolute;right:18px;top:18px;width:56px;height:56px;opacity:.35}
.hface em{font-style:normal;font-size:13.5px;opacity:.85}
.row{margin-top:34px}
.rowh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:var(--c)}
.rowh h3{color:var(--ink)}
.rbody{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start}
.rbody.nof{grid-template-columns:1fr}
.feat{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;text-decoration:none;border:1px solid color-mix(in srgb,var(--c) 40%,var(--rule));background:var(--sheet);transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s}
.feat:hover{transform:translateY(-3px);box-shadow:0 16px 30px -22px var(--c)}
.fface{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;min-height:150px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 90%,#000),var(--c));color:#fff;overflow:hidden}
.fface .ico{position:absolute;right:14px;top:14px;width:44px;height:44px;opacity:.4}
.fface .lab{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45)}
.fface b{font-family:var(--serif);font-weight:900;font-size:22px;line-height:1.25;margin-top:auto}
.fface em{font-style:normal;font-size:13.5px;opacity:.9}
.finfo{display:flex;flex-direction:column;gap:6px;padding:12px 18px 14px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}.dots i.on{background:var(--c)}
.lines{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.line{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--rule);text-decoration:none;transition:background .15s,padding-left .2s}
.line:hover{background:var(--paper2);padding-left:12px}
.line .lt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;flex:1}
.line b{font-weight:700;font-size:15px}.line em{font-style:normal;font-size:13px;color:var(--muted)}
.line .lr{font-family:var(--mono);font-size:12px;color:var(--muted)}
.line .ok{color:var(--c);font-family:var(--sans);font-weight:700;font-size:12.5px}
.line.done b{color:var(--ink2)}
.line::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rule2);flex:none}
.line.done::before,.line.on::before{background:var(--c)}
.req{border-left:3px solid var(--c);border-radius:0 8px 8px 0}
@media (max-width:640px){.rbody{grid-template-columns:1fr}.fface{min-height:130px}}
/* sentence tap */
.prose .s{cursor:pointer;border-radius:3px;transition:background .15s;-webkit-tap-highlight-color:transparent}
.prose .s:hover{background:color-mix(in srgb,var(--c) 7%,transparent)}
.prose .s.pick{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 14%,transparent)}
.prose .s.hl.y{background:var(--hl-y)}.prose .s.hl.g{background:var(--hl-g)}.prose .s.hl.b{background:var(--hl-b)}
.prose .s.ul{text-decoration:underline;text-decoration-color:var(--ul);text-decoration-thickness:2px;text-underline-offset:5px}
.prose .s.memo::after{content:"✎";font-size:11px;color:var(--c);margin-left:2px;vertical-align:super}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--paper);box-shadow:0 -12px 30px -16px rgba(0,0,0,.5);animation:up .22s cubic-bezier(.2,.7,.2,1) both}
.sbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sbar .lab{font-family:var(--mono);font-size:11.5px;opacity:.7}
.sbar .tools{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.sbar button{border:0;background:transparent;color:inherit;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;min-height:40px}
.sbar button:hover,.sbar button[aria-pressed="true"]{background:rgba(255,255,255,.14)}
.sbar .sw{width:18px;height:18px;border-radius:4px;display:inline-block}
/* ===== BOOK ===== */
.bookhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;margin:10px 0 26px}
.bookhead .cover{width:118px;height:160px;font-size:16px;padding:12px}
.bookhead h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,36px);line-height:1.25}
.bookhead p{color:var(--ink2);margin-top:8px;max-width:58ch}
.bookhead .facts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}.bookhead .facts b{font-family:var(--mono);color:var(--ink)}
.bookhead .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.toc{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.toc .part{font-family:var(--serif);font-weight:700;font-size:15px;padding:18px 0 6px;color:var(--ink2)}
.toc a{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule);text-decoration:none}
.toc a:hover{background:var(--paper2)}
.toc .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.toc .tt{font-size:15px}.toc .tt small{display:block;color:var(--muted);font-size:12.5px}
.toc .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule2)}
.toc a.done .dot{background:var(--c);border-color:var(--c)}
.toc a.cur{background:color-mix(in srgb,var(--c) 8%,transparent)}.toc a.cur .dot{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
/* ===== READ ===== */
.rhead{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.rhead h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,3.6vw,32px);line-height:1.3}
.progress{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh));z-index:15;height:3px;background:var(--rule)}
.progress i{display:block;height:100%;background:var(--c);width:0;transition:width .2s linear}
.draft{font-size:12.5px;color:var(--muted);border:1px dashed var(--rule2);border-radius:8px;padding:8px 12px;margin:14px 0 6px}
.para{display:grid;grid-template-columns:72px minmax(0,1fr);gap:18px;padding:22px 0;border-bottom:1px solid var(--rule);animation:vin .45s ease both}
.para .num{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:4px;line-height:1.4}
.para .num b{display:block;font-size:15px;color:var(--c);font-weight:500}
.para .body{display:flex;flex-direction:column;gap:14px;min-width:0}

function grade(text){
  const W=CUR.write;const t=text.trim();const res=$("#wRes");
  if(t.length<30){res.innerHTML=`<p class="score" style="color:var(--bad)">30자 이상 써 보자. 지금 ${t.length}자.</p>`;return}
  const norm=x=>x.replace(/\s+/g,"").toLowerCase();const T=norm(t);
  const hits=W.must.map(g=>g.some(k=>T.includes(norm(k))));const bon=(W.bonus||[]).filter(g=>g.some(k=>T.includes(norm(k)))).length;const bad=(W.wrong||[]).some(k=>T.includes(norm(k)));
  let pct=Math.round(hits.filter(Boolean).length/hits.length*100)+bon*10-(bad?30:0);pct=Math.max(0,Math.min(100,pct));const ok=pct>=70;
  const prev=WRITES.find(w=>w.sid===CUR.id);const tries=(prev?prev.tries:0)+1;
  const rec={sid:CUR.id,q:W.q,a:t,pct,ok,tries,t:Date.now(),book:BID,lesson:CUR.i};WRITES=WRITES.filter(w=>w.sid!==CUR.id).concat(rec);persist();
  const C=2*Math.PI*14;
  res.innerHTML=`<div class="chips">${W.must.map((g,i)=>`<span class="chip ${hits[i]?"hit":"miss"}" style="--i:${i}">${hits[i]?"✓":"○"} ${esc(g[0])}</span>`).join("")}</div>
   <div class="score"><svg viewBox="0 0 34 34" aria-hidden="true"><circle class="ring" cx="17" cy="17" r="14"/><circle class="val" id="sv" cx="17" cy="17" r="14" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><span>${ok?`<b style="color:var(--good)">통과</b> · 핵심 ${hits.filter(Boolean).length}/${hits.length}개를 담았다.`:`<b>조금 더</b> · ${bad?"원문과 다른 내용이 섞였다. ":"빠진 핵심이 있다. "}${tries<2?"다시 써 보자.":"모범 답안을 보고 비교해 보자."}`}</span></div>
   ${ok||tries>=2?`<div class="model"><span class="k" style="font-family:var(--mono);font-size:11px;color:var(--muted)">모범 답안 · ${esc(W.src||"")}</span>${esc(W.model)}</div>`:""}`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const v=$("#sv");if(v)v.style.strokeDashoffset=C*(1-pct/100)}));
  if(ok||tries>=2)$("#nextBtn").disabled=false;
}

  const tabs=`<nav class="tabs2" aria-label="계보">${[["ghg12","Scope 1·2 배출량 줄기"],["table","KSSB ↔ IFRS S2 대응표"]].map(([k,l])=>`<a href="#map/${k}" ${which===k?'aria-current="page"':""}>${l}</a>`).join("")}</nav>`;

   <p class="rcount">문단을 누르면 이어진 선과 근거가 보인다. 선을 눌러도 된다.</p>

   ${st.branches.map(br=>`<section class="lbr" data-b="${br.id}"><div class="lq"><b>${esc(br.q)}</b><small>${esc(br.sub)}</small></div><div class="lgridw">${cols.map(c=>`<div class="lcell">${br.nodes.filter(n=>n.col===c).map(nodeB).join("")}</div>`).join("")}</div><svg class="ledges" aria-hidden="true"></svg>
     <div class="lchain">${br.edges.map((e,i)=>{const f=br.nodes.find(n=>n.id===e.f),t=br.nodes.find(n=>n.id===e.t);return `<div class="ed"><div class="pair">${nodeB(f).replace("<b>",`<b>${esc(colName(f.col))} `)}<span class="arr ${e.type}">${e.type==="diff"?"≠":"→"} ${ET[e.type].name}</span>${nodeB(t).replace("<b>",`<b>${esc(colName(t.col))} `)}</div><p>${esc(e.note)}</p></div>`}).join("")}</div></section>`).join("")}</div>

function drawEdges(st){
  document.querySelectorAll(".lbr").forEach(sec=>{const br=st.branches.find(x=>x.id===sec.dataset.b);const svg=sec.querySelector(".ledges");if(!svg||getComputedStyle(svg).display==="none")return;
    const R0=sec.getBoundingClientRect();const pos=id=>{const el=sec.querySelector(`.lgridw .lnode[data-n="${id}"]`);const r=el.getBoundingClientRect();return {l:r.left-R0.left,r:r.right-R0.left,y:r.top-R0.top+r.height/2,t:r.top-R0.top,b:r.bottom-R0.top}};
    const P=Object.fromEntries(br.nodes.map(n=>[n.id,pos(n.id)]));const yb=Math.max(...Object.values(P).map(o=>o.b))+16;
    svg.innerHTML=`<defs><marker id="ah-${br.id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--ink2)"/></marker></defs>`+br.edges.map((e,i)=>{const a=P[e.f],b=P[e.t];const x1=a.r,x2=b.l-2;
      // 사이에 있는 노드와 높이가 겹치면 선을 아래로 돌린다
      const lo=Math.min(a.y,b.y)-14,hi=Math.max(a.y,b.y)+14;const block=Object.entries(P).some(([id,o])=>id!==e.f&&id!==e.t&&o.l>x1+4&&o.r<x2-4&&o.b>lo&&o.t<hi);
      let d,mx,my;if(block){d=`M${x1} ${a.y} C${x1+26} ${a.y},${x1+14} ${yb},${x1+40} ${yb} L${x2-40} ${yb} C${x2-14} ${yb},${x2-26} ${b.y},${x2} ${b.y}`;mx=(x1+x2)/2;my=yb}
      else{const dx=Math.max(18,(x2-x1)*.45);d=`M${x1} ${a.y} C${x1+dx} ${a.y},${x2-dx} ${b.y},${x2} ${b.y}`;mx=(x1+x2)/2;my=(a.y+b.y)/2}
      return `<path class="e ${e.type}" data-e="${i}" d="${d}" ${e.type!=="diff"?`marker-end="url(#ah-${br.id})"`:""}/>${e.type==="diff"?`<circle cx="${mx}" cy="${my}" r="9" fill="var(--paper)" stroke="var(--bad)"/><text x="${mx}" y="${my+4}" text-anchor="middle">≠</text>`:""}<path class="hit" data-e="${i}" d="${d}"><title>${esc(ET[e.type].name)}: ${esc(e.note)}</title></path>`}).join("");
    svg.querySelectorAll("path.hit").forEach(h=>h.addEventListener("click",()=>{const e=br.edges[+h.dataset.e];selNode(st,e.t,br.id,+h.dataset.e)}));
  })}
function selNode(st,nid,bid,ei){
  const br=bid?st.branches.find(x=>x.id===bid):st.branches.find(x=>x.nodes.some(n=>n.id===nid));const n=br.nodes.find(x=>x.id===nid);
  const es=br.edges.map((e,i)=>({e,i})).filter(o=>ei!==undefined?o.i===ei:(o.e.f===nid||o.e.t===nid));const nb=new Set(es.flatMap(o=>[o.e.f,o.e.t]));
  $("#lmap").classList.add("sel");document.querySelectorAll(".lnode").forEach(b=>{b.classList.toggle("on",b.dataset.n===nid);b.classList.toggle("nb",nb.has(b.dataset.n))});
  document.querySelectorAll(".lbr").forEach(sec=>sec.querySelectorAll("path.e").forEach(p=>p.classList.toggle("on",sec.dataset.b===br.id&&es.some(o=>o.i===+p.dataset.e))));
  const s=sessOf(n.sid),blk=s.blocks[n.bi];const colN=st.cols.find(c=>c.id===n.col).name;const nm=id=>{const x=br.nodes.find(z=>z.id===id);return st.cols.find(c=>c.id===x.col).name+" "+x.no};
  const d=$("#ldetail");d.hidden=false;
  d.innerHTML=`<button class="x" type="button" aria-label="닫기">✕</button><span class="k">${esc(br.q)} · ${esc(colN)}</span><h3>${esc(n.no)} ${esc(blk.label)}</h3><p class="req2">${esc(blk.req)}</p>
   <ul>${es.map(({e})=>`<li><span class="pill ${e.type==="diff"?"wait":""}">${ET[e.type].name}</span><b>${esc(nm(e.f))} ${e.type==="diff"?"≠":"→"} ${esc(nm(e.t))}</b><br>${esc(e.note)} <a href="#read/${e.at}">근거 회차 →</a></li>`).join("")}</ul>
   <p style="margin-top:10px"><a class="btn sm" href="#read/${n.sid}/${n.bi}">이 문단 읽기 (${esc(bookT(s.book))} ${sn(s)}회차) →</a></p>`;
  d.querySelector(".x").onclick=()=>{d.hidden=true;$("#lmap").classList.remove("sel");document.querySelectorAll(".lnode").forEach(b=>b.classList.remove("on","nb"));document.querySelectorAll("path.e").forEach(p=>p.classList.remove("on"))};
}

const PQ=[
 {k:"role",q:"어떤 일을 하려고 하나?",o:[["dis","기후공시 · KSSB·IFRS 공시를 쓰고 검토한다"],["ghg","온실가스 · 배출량 산정, 명세서, 검증 대응"],["lca","LCA · 제품 탄소발자국, EPD"],["any","아직 모르겠다"]]},

 {k:"eu",q:"EU로 수출하거나 EU 고객사가 있나?",o:[["yes","그렇다"],["no","아니다"],["unk","모른다"]]}];

function buildPath(a){const L=[],soon=[];const add=(bid,why)=>{if(!DATA[bid])return;const x=L.find(z=>z.bid===bid);if(x){if(!x.why.includes(why))x.why+=" · "+why;return}L.push({bid,why})};

  add("b2","어떤 문서가 누구에게 무엇을 요구하는지 전체 지도");
  const R={dis:[["kssb","한국 의무공시의 실제 기준"],["s2","KSSB의 출발점, 국제 기준과 다른 곳"],["ghgp-corp","공시 숫자를 재는 측정 기준(KSSB 29⑴㈏)"],["ghgp-s3","Scope 3는 의무공시 3년 뒤부터 공시한다"],["s1","모든 공시의 공통 규칙"],["envinfo","환경정보 공개·K-택소노미와 공시의 연결"]],
   ghg:[["ghgp-corp","모든 산정 기준의 뿌리"],["mrv","국내 명세서의 산정 규칙"],["ver","숫자를 남이 확인하는 규칙"],["ghgp-s2","전기 배출을 두 방법으로 센다"],["ghgp-s3","회사 밖 배출 15가지"],["kssb","산정한 숫자가 공시로 가는 곳(2호 29⑴)"]],
   lca:[["ghgp-s3","가치사슬 배출, LCA와 가장 가까운 산정 기준"],["ghgp-corp","경계·배출계수의 기본"],["kssb","고객사 공시가 요구하는 Scope 3 숫자"]],
   any:[["kssb","공시의 실제 기준"],["ghgp-corp","산정의 국제 표준"],["mrv","국내 산정 규칙"]]};
  const RR=R[a.role]||R.any;add(...RR[0]);
  if(a.listed==="yes")add("kssb","2028년부터 규모별로 KSSB 의무공시 대상이 된다(금융위 최종안)");
  if(a.ets==="ets"){add("mrv","할당대상업체는 해마다 이 지침으로 명세서를 만든다");add("ver","그 명세서를 검증받는 규칙")}
  if(a.ets==="tms"){add("tms","관리업체의 목표·명세서·검증 규칙");add("mrv","명세서 산정 방법의 기본")}
  if(a.eu==="yes")add("ghgp-s3","EU 고객사·규제는 공급망 배출 자료를 요구하는 경우가 많다");

function pathView(){

    $("#app").innerHTML=`<section class="view wrap narrow"><span class="eyebrow">내 읽기 경로 찾기 ${pq+1}/${PQ.length}</span><div class="dbar"><i style="width:${pq/PQ.length*100}%"></i></div><h2 class="dqh">${esc(x.q)}</h2><div class="check"><div class="opts">${x.o.map(([v,l])=>`<button type="button" data-v="${v}">${esc(l)}</button>`).join("")}</div></div><div class="navrow"><a class="btn line sm" href="#shelf">그만두기</a>${pq?`<button class="btn line sm" type="button" id="pBack">← 앞 문항</button>`:"<span></span>"}</div></section>`;

   <p class="lede">각 책의 <span class="star">★</span>핵심 회차부터 읽고, 필요한 책만 전체로 넓힌다. 강제가 아니라 안내다. 서재 맨 위에 이 경로가 걸린다.</p>
   <div class="pres">${r.L.map(x=>{const b=BOOKS.find(z=>z.id===x.bid);const c=coreOf(x.bid);return `<a class="it" href="#book/${x.bid}" style="--c:${colorOf(b)}"><span><b>${esc(b.t)}</b><p>${esc(x.why)}</p><small><span class="star" style="font-family:var(--sans)">★</span> 핵심 ${c.length}회차 · 약 ${hm(c.reduce((a,y)=>a+y.min,0))} / 전체 ${DATA[x.bid].length}회차 · 약 ${hm(DATA[x.bid].reduce((a,y)=>a+y.min,0))}</small></span></a>`}).join("")}</div>

   ${!DIAGR?`<p class="callout">기초 진단(10문항)을 하면 「온실가스와 Scope」를 건너뛸지 정할 수 있다. <a href="#diag">진단하기 →</a></p>`:""}
   <div class="navrow"><button class="btn line sm" type="button" id="pAgain">다시 찾기</button>${first?`<a class="btn sm" href="#read/${first.id}">첫 핵심 회차부터 →</a>`:`<a class="btn sm" href="#shelf">서재로 →</a>`}</div></section>`;
