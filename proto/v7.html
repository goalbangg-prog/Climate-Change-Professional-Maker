<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원문 독서 기록 · 김수현 (시안)</title>
<meta name="description" content="기후·온실가스 컨설턴트 지원자 김수현이 기준 문서를 원문으로 읽은 기록">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 색: 배경·글자 + 초록(주색·진행) · 노랑(발견) · 빨강(차이·주의). 그 밖의 색은 쓰지 않는다. */
:root{--bg:#FBFAF7;--card:#FFFFFF;--muted:#F3F2EC;--line:#E8E6DF;--fg1:#1C1E1C;--fg2:#414541;--fg3:#767A75;--fg4:#A9ACA6;
 --g:#2E7D32;--gl:#E9F3EA;--y:#F2C230;--yl:#FFF6D8;--r:#C0432E;--rl:#FBEAE6;
 --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141614;--card:#1B1E1B;--muted:#232623;--line:#2D312D;--fg1:#ECEEEA;--fg2:#C9CEC8;--fg3:#959B94;--fg4:#6B716A;--g:#7DC781;--gl:#1E2C1F;--y:#E5B92E;--yl:#30291A;--r:#E8907D;--rl:#36221E;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg1);font-family:var(--font);font-size:16px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
header.top{border-bottom:1px solid var(--line);background:var(--card)}
header.top .wrap{height:60px;display:flex;align-items:center;gap:28px}
.who{font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap}.who span{color:var(--fg3);font-weight:500;margin-left:6px}
nav.menu{display:flex;gap:4px;margin-left:auto}nav.menu a{font-size:14px;color:var(--fg3);text-decoration:none;padding:6px 10px;border-radius:8px}nav.menu a.on{color:var(--fg1);font-weight:700;background:var(--muted)}
.sample{background:var(--yl);color:var(--fg2);font-size:13px;text-align:center;padding:8px 16px}
main.wrap{padding-top:44px;padding-bottom:90px}
.view{animation:in .3s ease both}@keyframes in{from{opacity:0;transform:translateY(5px)}}
.k{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--fg3)}
.h1{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.3;margin:8px 0 10px}
.lead{font-size:17px;color:var(--fg2);max-width:40em}
.sec{margin-top:56px}.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}.sh h2{font-size:20px;font-weight:800}.sh small{color:var(--fg3);font-size:13.5px}.sh a{margin-left:auto;font-size:13.5px;color:var(--g);text-decoration:none;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:34px}
.nums div{padding:20px 0 18px;border-left:1px solid var(--line);padding-left:20px}.nums div:first-child{border-left:0;padding-left:0}
.nums b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2}.nums b small{font-size:15px;color:var(--fg3);font-weight:600;margin-left:3px}.nums span{font-size:13px;color:var(--fg3)}
/* 서가 */
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.doc{display:flex;flex-direction:column;gap:12px;padding:22px 22px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;transition:border-color .2s,transform .2s}
a.doc:hover{border-color:var(--g);transform:translateY(-2px)}
.doc .top2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.st.done{background:var(--g);color:var(--card)}.st.ing{background:var(--gl);color:var(--g)}.st.plan{background:var(--muted);color:var(--fg3)}
.doc h3{font-size:19px;font-weight:800;line-height:1.35}
.doc .ed{font-size:13.5px;color:var(--fg3);line-height:1.5}
.bar{height:5px;border-radius:3px;background:var(--muted);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:3px}
.doc .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--fg3)}.doc .meta b{color:var(--fg1);font-weight:700}
.doc.plan{background:transparent;border-style:dashed}
/* 발견 */
.finds{display:grid;gap:14px}
.find{padding:22px 24px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--y);border-radius:14px}
.find .t{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.find h3{font-size:18px;font-weight:800}
.find p{margin-top:8px;color:var(--fg2);font-size:15.5px;max-width:44em}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-top:14px}
.vs .s{padding:12px 14px;border-radius:10px;background:var(--muted);font-size:14px;line-height:1.6}.vs .s b{display:block;font-size:12.5px;color:var(--fg3);font-weight:700;margin-bottom:2px}
.vs .ne{align-self:center;font-weight:800;color:var(--r);font-size:18px}
.chk{margin-top:12px;font-size:14px;color:var(--fg2)}.chk b{color:var(--g)}
.tag{font-size:12px;color:var(--fg3);background:var(--muted);border-radius:6px;padding:1px 8px}
/* 문서 페이지 */
.crumb{font-size:13.5px;color:var(--fg3)}.crumb a{text-decoration:none}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:30px;align-items:start}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin-top:18px}.facts dt{color:var(--fg3)}.facts dd{margin:0}
.side{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.side .big{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.02em}.side .big small{font-size:16px;color:var(--fg3)}
.side ul{margin:14px 0 0;padding:0;list-style:none;font-size:14px}.side li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.log{display:flex;gap:6px;align-items:flex-end;height:74px;margin-top:10px}
.log div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--fg3)}
.log i{display:block;width:100%;max-width:26px;border-radius:4px 4px 0 0;background:var(--g)}
.part{font-size:13px;font-weight:800;color:var(--fg3);margin:26px 0 8px}
.item{border-top:1px solid var(--line)}
.item>button{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border:0;background:none;text-align:left}
.item .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--card)}
.item.read .ck{background:var(--g);border-color:var(--g)}
.item .tt{font-size:15.5px;font-weight:600}.item .tt small{display:block;font-size:12.5px;color:var(--fg3);font-weight:400}
.item:not(.read) .tt{color:var(--fg3)}
.cnt{display:flex;gap:6px}.cnt span{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--muted);color:var(--fg2);white-space:nowrap}
.cnt span.f{background:var(--yl)}
.recs{padding:2px 4px 18px 46px;display:none;flex-direction:column;gap:10px}
.item.open .recs{display:flex}
.rec{padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.rec .rk{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--fg3)}.rec .rk em{font-style:normal;padding:0 8px;border-radius:999px;background:var(--gl);color:var(--g)}
.rec .rk em.q{background:var(--muted);color:var(--fg2)}.rec .rk em.f{background:var(--yl);color:var(--fg1)}
.rec p{margin-top:6px;font-size:15.5px;line-height:1.75}
.rec .ans{margin-top:8px;padding-left:12px;border-left:2px solid var(--g);color:var(--fg2);font-size:15px}
.rec .src{margin-top:8px;font-size:12.5px;color:var(--fg3)}.rec .src b{color:var(--fg2);font-weight:600}
.rec time{margin-left:auto;font-weight:500;color:var(--fg4)}
/* 기록 방법 */
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.how div{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px}.how b{font-size:16px}.how p{margin-top:6px;color:var(--fg2);font-size:14.5px}
.rules{margin:0;padding-left:20px;font-size:15.5px;line-height:1.9;color:var(--fg2)}
footer{border-top:1px solid var(--line);padding:24px 0;font-size:13px;color:var(--fg3)}
@media (max-width:760px){
 header.top .wrap{gap:12px}.who span{display:none}nav.menu{overflow-x:auto}nav.menu a{padding:6px 8px;font-size:13.5px}
 main.wrap{padding-top:30px;padding-bottom:70px}.h1{font-size:27px}.lead{font-size:16px}
 .nums{grid-template-columns:repeat(2,1fr)}.nums div:nth-child(3){border-left:0;padding-left:0;border-top:1px solid var(--line)}.nums div:nth-child(4){border-top:1px solid var(--line)}
 .sh{flex-wrap:wrap}.sh h2{white-space:nowrap}.sh small{display:none}.shelf,.how{grid-template-columns:1fr}.dhead{grid-template-columns:1fr}.vs{grid-template-columns:1fr}.vs .ne{justify-self:center}
 .recs{padding-left:4px}.wrap{padding:0 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 $$(".item>button").forEach(b=>b.onclick=()=>{const it=b.parentElement;const s=it.dataset.s;OPEN.has(s)?OPEN.delete(s):OPEN.add(s);it.classList.toggle("open");b.setAttribute("aria-expanded",it.classList.contains("open"))});
