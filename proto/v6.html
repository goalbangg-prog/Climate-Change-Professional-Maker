<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기후공시 리딩 클래스 · v6 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 색 규칙: 배경·글자 + 3색. 초록=주색(버튼·링크·현재 위치·진행), 노랑=핵심 강조·골방쥐 포인트, 빨강=경고(오답·차이·조건부·개정 대기). 영역은 색이 아니라 아이콘과 이름으로 구분한다. */
:root{
  --bg:#F6F5F0;--card:#FFFFFF;--muted:#F1F0EA;--line:#E6E4DC;--line2:#EFEDE6;
  --fg1:#1E211F;--fg2:#3B3F3C;--fg3:#6E716C;--fg4:#A3A59F;
  --g:#2E7D32;--g2:#43A047;--gl:#E8F3E9;--gx:#F2F8F2;
  --y:#F6C945;--yl:#FFF5D1;--yx:#FFFAE8;
  --r:#C7442E;--rl:#FBE9E5;
  --sh:0 4px 14px rgba(30,33,31,.06);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --fs:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151714;--card:#1D201C;--muted:#252823;--line:#30342E;--line2:#292C27;--fg1:#ECEEE9;--fg2:#CDD1CA;--fg3:#9CA199;--fg4:#6E736B;--g:#7CC77F;--g2:#5DB362;--gl:#1F2E20;--gx:#1A241B;--y:#E9BE3E;--yl:#3A3220;--yx:#2B2619;--r:#EC8A77;--rl:#3A2420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151714;--card:#1D201C;--muted:#252823;--line:#30342E;--line2:#292C27;--fg1:#ECEEE9;--fg2:#CDD1CA;--fg3:#9CA199;--fg4:#6E736B;--g:#7CC77F;--g2:#5DB362;--gl:#1F2E20;--gx:#1A241B;--y:#E9BE3E;--yl:#3A3220;--yx:#2B2619;--r:#EC8A77;--rl:#3A2420;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg1);font-family:var(--font);font-size:16px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;height:58px;display:flex;align-items:center;gap:20px;padding:0 20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15.5px;text-decoration:none;white-space:nowrap}.brand b{color:var(--g)}.brand svg{width:30px;height:30px}
.nav{display:flex;gap:2px}.nav a{position:relative;padding:18px 10px;font-size:14px;color:var(--fg3);text-decoration:none;white-space:nowrap}
.nav a.on{color:var(--fg1);font-weight:700}.nav a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--g);border-radius:2px}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.ib{height:34px;min-width:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;color:var(--fg2)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--muted);color:var(--fg3)}
.note-bar{background:var(--yx);border-bottom:1px solid var(--yl);font-size:13px;color:var(--fg2);text-align:center;padding:7px 16px}
.tabbar{display:none}
.page{max-width:1120px;margin:0 auto;padding:24px 20px 110px}
.narrow{max-width:760px}
.view{animation:vin .3s ease both}@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--g)}
.h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:4px 0 6px}
.lead{color:var(--fg3);font-size:15px}
.sec{margin-top:30px}.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}.sec-h h2{font-size:19px;font-weight:800}.sec-h a{margin-left:auto;font-size:13px;color:var(--g);text-decoration:none;font-weight:700}.sec-h small{color:var(--fg3);font-size:13px}
.bd{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--gl);color:var(--g);white-space:nowrap}
.bd.n{background:var(--muted);color:var(--fg3)}.bd.y{background:var(--yl);color:#7A5B00}.bd.r{background:var(--rl);color:var(--r)}
:root[data-theme="dark"] .bd.y{color:var(--y)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;border:0;background:var(--g);color:var(--card);font-weight:800;font-size:15.5px;text-decoration:none;box-shadow:0 10px 22px -12px var(--g)}
.cta.ghost{background:var(--card);color:var(--g);border:1.5px solid var(--g);box-shadow:none}
.cta.sm{padding:9px 16px;font-size:14px;border-radius:10px}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg3);flex-wrap:wrap}.crumb a{text-decoration:none}.crumb b{color:var(--fg1)}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--g);border-radius:2px}
mark{background:linear-gradient(transparent 52%,var(--y) 52%);color:inherit;font-weight:650;padding:0 1px}
:root[data-theme="dark"] mark{background:linear-gradient(transparent 52%,#6B5716 52%)}
/* 홈 */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding:26px 28px;background:linear-gradient(135deg,var(--card) 55%,var(--gx));align-items:center}
.bubble{position:relative;background:var(--yx);border:1px solid var(--yl);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.6}
.bubble::after{content:"";position:absolute;right:-9px;top:50%;width:16px;height:16px;background:var(--yx);border-right:1px solid var(--yl);border-top:1px solid var(--yl);transform:translateY(-50%) rotate(45deg)}
.hero h1{font-size:26px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
.hero .ctas{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hm{display:flex;align-items:center;gap:12px}.hm svg{width:120px;height:120px;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.stat{padding:16px 18px}.stat span{font-size:12.5px;color:var(--fg3)}.stat b{display:block;font-size:26px;font-weight:800;color:var(--g);line-height:1.2;margin-top:2px}.stat b small{font-size:13px;color:var(--fg3);font-weight:600;margin-left:3px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.rv{padding:16px 18px}.rv li{list-style:none;display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}.rv ul{margin:6px 0 0;padding:0}.rv li:first-child{border-top:0}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.s4{padding:14px 16px;display:flex;gap:10px}.s4 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--g);color:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}.s4 b{font-size:14.5px;display:block}.s4 span{font-size:12.5px;color:var(--fg3);line-height:1.5;display:block}
/* 지도 */
.metro{padding:18px 18px 8px;overflow-x:auto}
.line{display:grid;grid-template-columns:150px minmax(560px,1fr);gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.line:first-child{border-top:0}
.ln{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;text-decoration:none}.ln svg{width:22px;height:22px;color:var(--g)}.ln small{display:block;font-weight:500;font-size:11.5px;color:var(--fg3)}
.track{position:relative;display:flex;align-items:flex-start;gap:0;padding-top:4px}
.track::before{content:"";position:absolute;left:14px;right:14px;top:15px;height:4px;border-radius:2px;background:var(--line)}
.st{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;min-width:72px;z-index:1}
.st .dot{width:24px;height:24px;border-radius:50%;border:4px solid var(--fg4);background:var(--card)}
.st.av .dot{border-color:var(--g)}
.st.done .dot{background:var(--g);border-color:var(--g)}
.st.cur .dot{border-color:var(--g);box-shadow:0 0 0 0 color-mix(in srgb,var(--g) 50%,transparent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--g) 45%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.st.soon .dot{border-style:dashed;border-color:var(--fg4);background:var(--muted)}
.st span{font-size:12px;text-align:center;line-height:1.35;color:var(--fg2);max-width:96px}
.st.soon span{color:var(--fg4)}
.st .here{position:absolute;top:-22px;font-size:10.5px;font-weight:800;color:var(--card);background:var(--g);padding:0 7px;border-radius:999px;white-space:nowrap}
.st .nx{position:absolute;top:-22px;font-size:10.5px;font-weight:800;color:#7A5B00;background:var(--yl);padding:0 7px;border-radius:999px;white-space:nowrap}
.seg.on-path .track::after{content:"";position:absolute;left:14px;top:15px;height:4px;border-radius:2px;background:var(--g);width:var(--pw,0)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg3);margin:10px 0 0}.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;border:3px solid var(--g);display:inline-block}.legend i.f{background:var(--g)}.legend i.s{border-style:dashed;border-color:var(--fg4);background:var(--muted)}
/* 영역 */
.kw{display:flex;gap:8px;flex-wrap:wrap}
.kw button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.kw button[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--card)}
.hits{margin-top:12px;padding:14px 18px}.hits a{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line2);text-decoration:none;font-size:14px}.hits a:first-of-type{border-top:0}.hits a small{color:var(--fg3);margin-left:auto;white-space:nowrap}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb{padding:8px 14px;border-radius:12px;border:1.5px solid var(--g);font-weight:700;font-size:14px;text-decoration:none;background:var(--card)}
.fb.soon{border-style:dashed;border-color:var(--fg4);color:var(--fg4)}
.fa{color:var(--fg4);font-weight:800}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bcard{display:flex;flex-direction:column;text-decoration:none;overflow:hidden}
.bcard .fig{background:var(--gx);border-bottom:1px solid var(--line);padding:12px;display:grid;place-items:center;height:150px}
.bcard .fig svg{width:100%;height:100%}
.bcard .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}.bcard b{font-size:16.5px}.bcard span{font-size:13px;color:var(--fg3);line-height:1.5}
.bcard.soon{opacity:.6}.bcard.soon .fig{background:var(--muted)}
/* 책 */
.bookhead{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;padding:24px 26px;align-items:center}
.bigfig{background:var(--gx);border-radius:14px;padding:12px}.bigfig svg{width:100%;height:auto;display:block}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.segc button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--fg3)}
.segc button[aria-pressed="true"]{background:var(--g);color:var(--card)}
.stepper{display:flex;flex-direction:column;margin-top:14px}
.sp{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;text-decoration:none;position:relative}
.sp::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--line)}
.sp:first-child::before{top:50%}.sp:last-child::before{bottom:50%}
.sp .c{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--fg3);margin-left:6px}
.sp.done .c{background:var(--g);border-color:var(--g);color:var(--card)}
.sp.cur .c{border-color:var(--g);color:var(--g);box-shadow:0 0 0 4px var(--gl)}
.sp.cur{background:var(--gx);border-radius:12px}
.sp b{font-size:15px;font-weight:700}.sp small{display:block;font-size:12.5px;color:var(--fg3)}
.sp .why{display:block;font-size:12px;color:#7A5B00;margin-top:2px}
:root[data-theme="dark"] .sp .why{color:var(--y)}
.part{font-size:12.5px;font-weight:800;color:var(--fg3);padding:14px 4px 4px 52px}
/* 읽기 */
.rhead{padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.rhead h1{font-size:27px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
.rhead .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--fg3);margin-top:8px}.rhead .meta b{color:var(--fg1)}
.rhead svg{width:96px;height:96px}
.readbar{position:sticky;top:58px;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:8px 0 10px;margin:0 -4px}
.readbar .t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg3);margin-bottom:5px;gap:10px}.readbar .t b{color:var(--fg1);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px 18px;border-radius:14px;background:var(--yx);border:1px solid var(--yl)}
.key p{font-size:16.5px;line-height:1.8}
.three{margin-top:12px;padding:16px 20px}.three ol{margin:6px 0 0;padding-left:20px;font-size:15px;line-height:1.8}.three .k{font-size:12px;font-weight:800;color:var(--g)}
.blk{padding:24px 26px 14px;margin-top:14px;scroll-margin-top:120px}
.bh{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;margin-bottom:8px}
.bn{width:34px;height:34px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-weight:800}
.bh h3{font-size:19px;font-weight:800;line-height:1.4}.bh .ref{font-size:12px;color:var(--fg4)}
.prose2{font-size:var(--fs);line-height:1.8}
.sg{display:grid;grid-template-columns:120px minmax(0,34em);gap:18px;padding:12px 0;border-top:1px solid var(--line2)}
.sg:first-child{border-top:0}
.sl{font-size:13.5px;font-weight:800;color:var(--g);padding-top:3px;line-height:1.5}
.sb{min-width:0}.sb p+p,.sb p+ul,.sb ul+p{margin-top:8px}.sb ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}.sb li{position:relative;padding-left:16px}.sb li::before{content:"";position:absolute;left:2px;top:.75em;width:6px;height:6px;border-radius:50%;background:var(--g2)}
.rf{display:inline-block;font-size:11px;font-weight:700;color:var(--fg4);background:var(--muted);border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.sg.ex{background:var(--muted);border-radius:12px;border-top:0;margin-top:10px;padding:14px 16px;grid-template-columns:104px minmax(0,1fr)}
.sg.ex .sl{color:var(--fg2)}.exs{display:block;font-size:12px;color:var(--fg3);margin-top:4px}
.oq{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--line);color:var(--fg2);font-size:14px;line-height:1.7}.oq .k{display:block;font-size:11px;font-weight:800;color:var(--fg4)}
.tw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{background:var(--gx);color:var(--g);font-size:12.5px;text-align:left;padding:9px 12px}.tbl td{padding:9px 12px;border-top:1px solid var(--line2);vertical-align:top}
.cap{display:block;font-size:12.5px;color:var(--fg3);margin-bottom:6px}
.term{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:1.5px dotted var(--g);cursor:help}
.endbox{margin-top:26px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
/* 문제 */
.qstep{display:flex;gap:6px;margin:14px 0}.qstep span{flex:1;height:6px;border-radius:3px;background:var(--line)}.qstep span.on{background:var(--g)}
.qcard{padding:22px 24px}.qcard .q{font-size:18px;font-weight:700;line-height:1.55;margin:6px 0 14px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15.5px;background:var(--muted);color:var(--fg1);resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.row small{color:var(--fg3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chips span{font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--fg3)}.chips span.hit{border-color:var(--g);color:var(--g);background:var(--gx);font-weight:700}
.model{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--gx);font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:8px}.opts button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;line-height:1.55}
.opts button.right{border-color:var(--g);background:var(--gx);color:var(--g);font-weight:700}.opts button.wrong{border-color:var(--r);background:var(--rl);color:var(--r)}
.why{margin-top:12px;font-size:14.5px;line-height:1.7}
.result{padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.result svg{width:110px;height:110px}
.result .sc{display:flex;gap:10px;justify-content:center;margin:6px 0}
/* 노트 */
.search{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg1)}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}.fl .lab{font-size:12px;color:var(--fg3);font-weight:700;margin-right:2px}
.fc{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}.fc[aria-pressed="true"]{background:var(--fg1);color:var(--bg);border-color:var(--fg1)}
details.acc{margin-top:10px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:800;display:flex;gap:10px;align-items:center}details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▾";margin-left:auto;color:var(--fg3);transition:transform .2s}details.acc[open]>summary::after{transform:rotate(180deg)}
.ni{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 18px;border-top:1px solid var(--line2);text-decoration:none}
.ni .q{font-size:15px;line-height:1.65}.ni .m{font-size:13px;color:var(--fg3);margin-top:3px}.ni .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ni .tags span{font-size:11.5px;background:var(--muted);color:var(--fg2);border-radius:6px;padding:1px 7px}
.ni .go{font-size:12.5px;color:var(--g);font-weight:700;align-self:center;white-space:nowrap}
.empty{padding:30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}.empty svg{width:110px;height:110px}
.bk{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
/* 자료실 */
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lib a{padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:4px}.lib a b{font-size:16px}.lib a span{font-size:13px;color:var(--fg3);line-height:1.5}.lib a i{font-style:normal;font-size:24px}

", "sub": "Scope 1·2·3 총량 · 측정 기준 · 방법이 섞이면 나눠서 · Scope 2는 지역기반", "pages": "18~21쪽", "key": "KSSB 제2호는 온실가스 배출량을 <mark>Scope 1·2·3으로 나눠 tCO2e로<\/mark> 공시하게 한다. 기준은 GHG 프로토콜이고, <mark>재는 방법이 섞였을 때만 방법별로 나누며<\/mark>, Scope 2는 <mark>지역기반이 필수<\/mark>다.", "three": ["배출량은 Scope 1·2·3으로 나눠 tCO2e로, GHG 프로토콜을 기준으로 잰다.", "재는 방법이 섞였을 때만 방법별로 나눈다. Scope 2는 지역기반이 필수, 시장기반은 선택이다.", "Scope 3는 포함한 카테고리를 밝히고, 투자(카테고리 15)는 금융배출량으로 좁힐 수 있다."], "blocks": [{"title": "절대 총배출량을 Scope 1·2·3으로", "ref": "문단 29⑴㈎ · 기준서 18쪽", "own": "", "html": "<div class=\"sg\"><div class=\"sl\">지표는 세 묶음<\/div><div class=\"sb\"><p>지표와 목표 공시는 산업전반 지표(29~31), 산업기반 지표(32), 목표(33~37)로 나뉜다. 그 첫 지표가 온실가스 배출량이다. <span class=\"rf\">27~28<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">무엇을 공시하나<\/div><div class=\"sb\"><p><mark>보고기간의 온실가스 절대 총배출량을 <button type=\"button\" class=\"term\" data-d=\"여러 온실가스를 CO2 기준으로 환산해 합친 단위다.\" data-en=\"tonnes of CO2 equivalent\">이산화탄소환산톤<\/button>(tCO2e)으로, Scope 1·2·3으로 나눠 공시한다.<\/mark> <span class=\"rf\">29⑴㈎<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">Scope 셋의 뜻<\/div><div class=\"sb\"><ul><li>Scope 1: 직접 배출<\/li><li>Scope 2: 사서 쓴 전기·증기·난방·냉각에서 나온 간접 배출<\/li><li>Scope 3: 그 밖의 가치사슬 간접 배출<\/li><\/ul><\/div><\/div><div class=\"sg\"><div class=\"sl\">가스를 어떻게 합치나<\/div><div class=\"sb\"><ul><li>일곱 가지 가스(CO2, CH4, N2O, HFCs, NF3, PFCs, SF6)를 이산화탄소환산량으로 합친다. <span class=\"rf\">B20·B21<\/span><\/li><li>직접 측정할 때는 최신 IPCC 평가보고서의 100년 기준 <button type=\"button\" class=\"term\" data-d=\"CO2 한 단위와 비교해 어떤 온실가스가 대기를 얼마나 더 데우는지 나타낸 지수다.\" data-en=\"global warming potential\">지구온난화지수<\/button>를 쓴다.<\/li><li>관할 당국이나 거래소가 다른 값을 요구하면, 그 범위와 기간 동안 그 값을 써도 된다.<\/li><\/ul><\/div><\/div><div class=\"sg\"><div class=\"sl\">숫자로 보면<\/div><div class=\"sb\"><span class=\"cap\">기아 2025년 온실가스 배출량 (보고서 130쪽)<\/span><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>구분<\/th><th>2025년(천tCO2e)<\/th><\/tr><\/thead><tbody><tr><td>Scope 1<\/td><td>398.5<\/td><\/tr><tr><td>Scope 2<\/td><td>697.9<\/td><\/tr><tr><td>Scope 1+2 합계<\/td><td>1,096.4<\/td><\/tr><tr><td>Scope 3<\/td><td>142,060.7<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div><div class=\"sg ex\"><div class=\"sl\">실무에서는<\/div><div class=\"sb\"><p>현대자동차 보고서의 산정 설명에는 &#x27;6대 온실가스를 대상으로&#x27; 했다는 문장이 있다. 부록 A의 일곱 가지와 범위가 맞는지 검토할 때 확인한다.<\/p><\/div><\/div>"}, {"title": "측정 기준과 접근법, 회사 범위", "ref": "문단 29⑴㈏·㈐·㈑ · 기준서 18쪽", "own": "", "html": "<div class=\"sg\"><div class=\"sl\">기준은 GHG 프로토콜<\/div><div class=\"sb\"><p><mark>배출량은 GHG 프로토콜 기업 회계 및 보고 기준(2004)으로 잰다.<\/mark> <span class=\"rf\">29⑴㈏<\/span><\/p><p>관할 당국이나 거래소가 기업 전체나 일부에 다른 방법을 요구하면, 그 부분은 그 방법을 써도 된다. <span class=\"rf\">B24<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">Scope 3 면제는 없다<\/div><div class=\"sb\"><p>관할권이 Scope 1·2만 보고하게 해도, Scope 1·2·3 공시 의무는 그대로다. <span class=\"rf\">B25<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">함께 밝힐 것<\/div><div class=\"sb\"><ul><li>측정 접근법, 투입변수, 가정, 그리고 그것을 고른 이유 <span class=\"rf\">29⑴㈐<\/span><\/li><li>보고기간 중 바뀐 점과 그 이유 <span class=\"rf\">29⑴㈐<\/span><\/li><li><button type=\"button\" class=\"term\" data-d=\"지분 비율만큼 배출량을 산정 범위에 넣는 방식이다.\" data-en=\"equity share approach\">지분율 접근법<\/button>과 <button type=\"button\" class=\"term\" data-d=\"회사가 통제하는 사업장의 배출을 산정 범위에 넣는 조직 경계 설정 방식이다.\" data-en=\"control approach\">통제 접근법<\/button> 중 무엇을 썼는지, 그리고 이유 <span class=\"rf\">B27<\/span><\/li><\/ul><\/div><\/div><div class=\"sg\"><div class=\"sl\">회사 범위를 둘로<\/div><div class=\"sb\"><p>Scope 1·2를 아래 두 범위로 나눠 공시한다. <span class=\"rf\">29⑴㈑<\/span><\/p><ul><li>회계상 연결실체: 모회사, 그리고 연결재무제표에 함께 묶이는 종속기업<\/li><li>그 밖의 피투자자: 지분은 있지만 연결하지 않는 회사(관계기업, 공동기업 등)<\/li><\/ul><\/div><\/div><div class=\"sg\"><div class=\"sl\">왜 나누나<\/div><div class=\"sb\"><p>배출량 산정 범위는 재무제표 연결 범위와 다를 수 있다. 그 차이를 보완하려는 것이다. <span class=\"rf\">BC99<\/span><\/p><\/div><\/div><div class=\"sg ex\"><div class=\"sl\">실무에서는<\/div><div class=\"sb\"><p>현대자동차는 조직 경계에 통제력 기준 중 운영통제력을 썼다. Scope 1·2는 GHG 프로토콜 기업 기준과 Scope 2 Guidance로 산정하면서, 국내 탄소중립기본법과 배출권거래제 보고·인증 지침도 지켰다고 적었다.<\/p><small class=\"exs\">현대자동차 지속가능성 보고서 38쪽<\/small><\/div><\/div>"}, {"title": "방법이 섞였을 때만 방법별로 나누기", "ref": "문단 29⑴㈒ · 기준서 19쪽", "own": "KSSB에만 있음", "html": "<div class=\"sg\"><div class=\"sl\">무엇을 하나<\/div><div class=\"sb\"><p><mark>Scope 1·2에 GHG 프로토콜로 잰 배출량과 관할 당국·거래소 방법으로 잰 배출량이 섞여 있으면, Scope 1·2를 쓴 방법별로 나눠 공시한다.<\/mark> <span class=\"rf\">29⑴㈒<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">조건이 핵심<\/div><div class=\"sb\"><p>한 가지 방법만 썼다면 적용되지 않는다. 그래서 우리 회사 Scope 1·2를 실제로 몇 가지 방법으로 쟀는지부터 확인한다.<\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">어떤 경우인가<\/div><div class=\"sb\"><p>일부 사업장은 관할 당국이 요구한 방식으로, 나머지는 GHG 프로토콜로 잰 경우다. <span class=\"rf\">BC101<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">왜 나누게 했나<\/div><div class=\"sb\"><ul><li>한 방법만 강요하면, 같은 숫자를 두 번 만드는 보고 비용이 든다.<\/li><li>섞인 숫자를 합쳐만 두면, 규제 환경에 따른 차이가 가려진다. <span class=\"rf\">BC103·104<\/span><\/li><\/ul><\/div><\/div><div class=\"sg\"><div class=\"sl\">다시 잴 필요는 없다<\/div><div class=\"sb\"><p>모든 방법으로 다시 재라는 뜻이 아니다. 이미 쓴 방법별로 나눠 보여 주면 된다. <span class=\"rf\">BC105<\/span><\/p><blockquote class=\"oq\"><span class=\"k\">원문 한 줄 · BC105<\/span>즉, 이는 기업이 사용한 모든 방법으로 기업의 스코프 1 및 스코프 2 온실가스 배출량을 다시 측정해서 공시해야 함을 의미하지 않는다.<\/blockquote><\/div><\/div><div class=\"sg ex\"><div class=\"sl\">실무에서는<\/div><div class=\"sb\"><p>기아 검증의견서는 국내 생산법인과 비생산시설의 Scope 1·2에 한국 배출권거래제(K-ETS)로 별도 검증된 결과가 반영되었다고 밝혔다. 이런 회사는 방법이 실제로 섞였는지부터 확인한다.<\/p><small class=\"exs\">기아 지속가능경영보고서 156쪽<\/small><\/div><\/div>"}, {"title": "Scope 2는 지역기반으로, 시장기반은 선택", "ref": "문단 29⑴㈓ · 기준서 19쪽", "own": "", "html": "<div class=\"sg\"><div class=\"sl\">무엇을 하나<\/div><div class=\"sb\"><p><mark>Scope 2는 <button type=\"button\" class=\"term\" data-d=\"전력을 쓴 지역 전력망의 평균 배출계수로 스코프 2를 계산하는 방식이다.\" data-en=\"location-based\">지역기반<\/button>으로 공시한다. <button type=\"button\" class=\"term\" data-d=\"전력 구매 계약이나 인증서를 반영해 스코프 2를 계산하는 방식이다.\" data-en=\"market-based\">시장기반<\/button>은 공시해도 되고, 안 해도 된다.<\/mark> <span class=\"rf\">29⑴㈓ · B31<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">두 계산법<\/div><div class=\"sb\"><ul><li>지역기반: 전기를 쓴 지역 전력망의 평균 배출계수로 계산한다.<\/li><li>시장기반: 재생에너지 구매계약이나 인증서처럼 회사가 맺은 계약을 반영한다.<\/li><\/ul><\/div><\/div><div class=\"sg\"><div class=\"sl\">계약 상품 정보<\/div><div class=\"sb\"><p>계약 상품이 있고, 그 정보가 이용자 이해에 도움이 될 때만 함께 준다. <span class=\"rf\">B30<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">숫자로 보면<\/div><div class=\"sb\"><span class=\"cap\">두 회사의 Scope 2 (tCO2e) · 기아는 검증의견서의 사업장별 수치를 더한 값<\/span><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>회사<\/th><th>지역기반<\/th><th>시장기반<\/th><th>데이터표에는<\/th><\/tr><\/thead><tbody><tr><td>기아 156쪽<\/td><td>861,732<\/td><td>697,875<\/td><td>697.9천 (시장기반)<\/td><\/tr><tr><td>현대차 38쪽<\/td><td>1,858,897<\/td><td>1,190,442<\/td><td>둘 다 공시<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div><div class=\"sg ex\"><div class=\"sl\">실무에서는<\/div><div class=\"sb\"><p>기아처럼 데이터표의 Scope 2가 시장기반이면, KSSB 제2호 기준으로는 지역기반 수치를 분명히 보여 주는지 확인한다.<\/p><\/div><\/div>"}, {"title": "Scope 3: 포함한 카테고리와 데이터 품질", "ref": "문단 29⑴㈔ · 기준서 19쪽", "own": "", "html": "<div class=\"sg\"><div class=\"sl\">무엇을 하나<\/div><div class=\"sb\"><p><mark>Scope 3에 포함한 카테고리를 GHG 프로토콜 Scope 3 기준(2011)의 15개 카테고리로 밝힌다.<\/mark> <span class=\"rf\">29⑴㈔①<\/span><\/p><p>업스트림과 다운스트림 전체를 보고 15개를 모두 고려하되, 실제로 포함한 것을 공시한다. <span class=\"rf\">B32<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">금융 활동이 있다면<\/div><div class=\"sb\"><p>자산운용·상업은행·보험 활동이 있는 회사는 <button type=\"button\" class=\"term\" data-d=\"피투자자나 거래상대방의 온실가스 총배출량 중 기업의 대여 및 투자에 기인하는 부분이다.\" data-en=\"financed emissions\">금융배출량<\/button>(카테고리 15의 일부) 추가 정보를 낸다. <span class=\"rf\">29⑴㈔② · B58~B63A<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">좋은 데이터의 네 조건<\/div><div class=\"sb\"><p>투입변수는 아래 특성을 가진 것을 우선한다. <span class=\"rf\">B40<\/span><\/p><ul><li>직접 측정한 데이터<\/li><li>특정 활동에서 얻은 <button type=\"button\" class=\"term\" data-d=\"공급업체 등 가치사슬의 특정 활동에서 직접 얻은 데이터다.\" data-en=\"primary data\">일차 데이터<\/button><\/li><li>관할권과 기술을 반영한, 적시성 있는 데이터<\/li><li>검증된 데이터<\/li><\/ul><\/div><\/div><div class=\"sg\"><div class=\"sl\">추정할 수 없다면<\/div><div class=\"sb\"><p>실무적으로 추정할 수 없으면, Scope 3를 어떻게 관리하는지 공시한다. <span class=\"rf\">B57<\/span><\/p><\/div><\/div><div class=\"sg ex\"><div class=\"sl\">실무에서는<\/div><div class=\"sb\"><p>기아는 2025년 Scope 3 142,060.7천tCO2e 중 판매된 제품의 사용이 114,663.1천tCO2e였다. 2025년부터 기준 주행거리를 20만 km에서 22만 km로 올려 사용단계 배출량이 늘었다고 주석에 적었다. 가정 변경 공시(29⑴㈐③)의 예다.<\/p><small class=\"exs\">기아 지속가능경영보고서 130쪽<\/small><\/div><\/div>"}, {"title": "카테고리 15를 금융배출량으로 좁히기", "ref": "문단 29A~29C · 기준서 21쪽", "own": "", "html": "<div class=\"sg\"><div class=\"sl\">좁혀도 된다<\/div><div class=\"sb\"><p><mark>카테고리 15(투자)는 금융배출량으로 좁혀 잴 수 있다.<\/mark> 좁힐 때는 파생상품 관련 배출량도 뺄 수 있다. <span class=\"rf\">29A<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">금융배출량이란<\/div><div class=\"sb\"><p>피투자자나 거래상대방에게 준 대출·투자에 귀속되는 배출량이다.<\/p><ul><li>대상: 대출, 프로젝트 파이낸싱, 채권, 지분투자, 미사용 대출한도약정<\/li><li>자산운용 회사는 운용자산에 귀속되는 몫도 넣는다.<\/li><\/ul><\/div><\/div><div class=\"sg\"><div class=\"sl\">좁혔다면 설명한다<\/div><div class=\"sb\"><p>무엇을 파생상품으로 봤는지, 어떤 금융활동을 뺐는지 밝힌다. <span class=\"rf\">29B<\/span><\/p><p>뺀 규모는 숫자 대신 말로(질적으로) 설명한다. <span class=\"rf\">BC135·136<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">포함했다면 두 숫자<\/div><div class=\"sb\"><p>카테고리 15를 포함하면, 그 총계와 안에 든 금융배출량 소계를 공시한다. <span class=\"rf\">29C<\/span><\/p><blockquote class=\"oq\"><span class=\"k\">원문 한 줄 · 29C<\/span>기업이 문단 29⑴㈎③에 따라 공시되는 스코프 3 온실가스 배출량 측정에 카테고리 15 온실가스 배출량을 포함하는 경우, 기업은 카테고리 15 온실가스 배출량의 총계와 그 총계에 포함된 금융배출량의 소계를 공시하여야 한다.<\/blockquote><\/div><\/div><div class=\"sg\"><div class=\"sl\">어디서 왔나<\/div><div class=\"sb\"><p>2025년 12월 IFRS S2 개정을 반영한 문장이다. <span class=\"rf\">BC125·129<\/span><\/p><\/div><\/div><div class=\"sg\"><div class=\"sl\">한눈에<\/div><div class=\"sb\"><span class=\"cap\">29A~29C 정리<\/span><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>문단<\/th><th>내용<\/th><th>성격<\/th><\/tr><\/thead><tbody><tr><td>29A<\/td><td>카테고리 15를 금융배출량으로 한정, 파생상품 관련 배출량 제외 가능<\/td><td>선택(할 수 있다)<\/td><\/tr><tr><td>29B<\/td><td>파생상품으로 본 항목과 제외된 금융활동 설명<\/td><td>한정했을 때 의무<\/td><\/tr><tr><td>29C<\/td><td>카테고리 15 총계와 그 안의 금융배출량 소계<\/td><td>카테고리 15를 포함하면 의무<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div><div class=\"sg ex\"><div class=\"sl\">실무에서는<\/div><div class=\"sb\"><p>기아는 카테고리 15를 국내외 지분투자 배출량 776.8천tCO2e로, 현대자동차는 1,506,134tCO2e로 공시했다. 현대자동차는 지분율을 투자 대상 기업의 Scope 1·2에 곱하는 지분 기반 접근법으로 산정했다고 설명했다(40쪽).<\/p><small class=\"exs\">현대자동차 지속가능성 보고서 38쪽<\/small><\/div><\/div>"}]}}, "quiz": {"k2-8": {"w": {"q": "문단 29⑴㈒의 측정 방법별 세분화는 언제 적용되는가?", "must": [["섞여", "혼재", "여러 방법"], ["GHG 프로토콜", "온실가스 프로토콜"], ["관할 당국", "거래소"]], "bonus": [["방법별", "세분화"]], "wrong": ["모든 기업이 항상 방법별로 세분화해야 한다", "모든 방법으로 다시 측정해 공시해야 한다"], "model": "스코프 1·2 배출량에 GHG 프로토콜로 측정한 배출량과 관할 당국이나 거래소가 요구하는 방법으로 측정한 배출량이 섞여 있을 때에만 방법별로 세분화한다.", "src": "문단 29⑴㈒"}, "c": {"q": "문단 29C가 요구하는 것은?", "options": ["모든 기업이 카테고리 15를 금융배출량으로 한정해야 한다", "카테고리 15를 포함하면 그 총계와 금융배출량 소계를 공시한다", "파생상품 관련 배출량을 반드시 포함해야 한다"], "ans": 1, "why": "29A의 한정은 선택이고 파생상품은 뺄 수 있다. 29C는 카테고리 15를 포함하는 기업에 총계와 금융배출량 소계 공시를 요구한다(BC136)."}}}, "seedNotes": [{"sid": "k2-8", "kind": "형광펜", "text": "Scope 2는 지역기반으로 공시한다. 시장기반은 공시해도 되고, 안 해도 된다.", "memo": "기아 데이터표는 시장기반 → 지역기반 확인", "tags": ["면접", "보고서검토"]}, {"sid": "k2-8", "kind": "메모", "text": "방법별 세분화는 섞였을 때만. 다시 잴 필요 없음(BC105).", "memo": "", "tags": ["헷갈림"]}, {"sid": "k2-8", "kind": "한 줄 쓰기", "text": "국내는 배출권거래제 지침, 해외는 GHG 프로토콜처럼 재는 방법이 섞여 있을 때만 Scope 1·2를 방법별로 나눠 공시한다.", "memo": "", "tags": []}]};

  QS=0;QA={};
}
/* ---------- 내 노트 ---------- */
let NQ="",NF={kind:"",book:""};
function notesView(){
  const items=S.notes.filter(n=>(!NF.kind||n.kind===NF.kind)&&(!NF.book||sess(n.sid).book===NF.book)&&(!NQ||(n.text+n.memo+n.tags.join(" ")+sess(n.sid).title).toLowerCase().includes(NQ.toLowerCase())));
  const kinds=["형광펜","메모","한 줄 쓰기"];const books=[...new Set(S.notes.map(n=>sess(n.sid).book))];
  const byBook={};items.forEach(n=>{const s=sess(n.sid);(byBook[s.book]=byBook[s.book]||{});(byBook[s.book][s.id]=byBook[s.book][s.id]||[]).push(n)});
  $("#app").innerHTML=`<div class="view narrow" style="margin:0 auto"><span class="eyebrow">내 노트</span><h1 class="h1">읽으며 남긴 것</h1><p class="lead">형광펜, 메모, 한 줄 쓰기가 책 → 회차 순서로 모인다. 노트를 누르면 그 회차로 간다.</p>
   <div class="sec" style="margin-top:18px"><input class="search" id="nq" type="search" placeholder="문장·메모·태그·회차 제목 검색" value="${esc(NQ)}">
   <div class="fl"><span class="lab">종류</span>${["",...kinds].map(k=>`<button class="fc" data-f="kind" data-v="${k}" aria-pressed="${NF.kind===k}">${k||"전체"}</button>`).join("")}${books.length?`<span class="lab" style="margin-left:8px">책</span>${["",...books].map(b=>`<button class="fc" data-f="book" data-v="${b}" aria-pressed="${NF.book===b}">${b?esc(book(b).t):"전체"}</button>`).join("")}`:""}</div></div>
   ${S.notes.length?(items.length?Object.entries(byBook).map(([bid,ss])=>`<details class="acc" open><summary>${esc(book(bid).t)} <span class="bd n">${Object.values(ss).flat().length}</span></summary>${Object.entries(ss).map(([sid,ns])=>{const s=sess(sid);return `<div style="padding:8px 18px 2px;font-size:12.5px;font-weight:800;color:var(--fg3)">${s.i}회차 · ${esc(s.title)}</div>`+ns.map(n=>`<div class="ni"><div><p class="q">${n.kind==="형광펜"?`<mark>${esc(n.text)}</mark>`:esc(n.text)}</p><p class="m">${esc(n.kind)}${n.memo?" · ✎ "+esc(n.memo):""}</p><div class="tags">${n.tags.map(t=>`<span>#${esc(t)}</span>`).join("")}<button type="button" class="fc" data-tag="${n.id}" style="padding:0 8px;font-size:11.5px">+ 태그</button></div></div><a class="go" href="#read/${sid}">회차로 →</a></div>`).join("")}).join("")}</details>`).join(""):`<div class="card empty" style="margin-top:14px">${mouse("think")}<span style="color:var(--fg3)">「${esc(NQ)}」에 맞는 노트가 없어.</span></div>`)
     :`<div class="card empty" style="margin-top:14px">${mouse("base")}<b>아직 노트가 없어</b><span style="color:var(--fg3);font-size:14px">읽기 화면에서 노란 밑줄 문장을 누르면 여기에 담긴다.</span><button class="cta sm ghost" id="seed" type="button">예시 노트 넣어 보기</button></div>`}
   <div class="bk"><button class="cta sm ghost" id="exp" type="button">백업 내보내기 (JSON)</button><label class="cta sm ghost" style="cursor:pointer">백업 가져오기<input type="file" id="imp" accept="application/json" hidden></label></div>
   <p style="font-size:12.5px;color:var(--fg3);margin-top:8px">노트와 진도는 이 브라우저에만 저장된다. 브라우저 기록을 지우기 전에 백업해 두자.</p></div>`;
  const q=$("#nq");q.oninput=()=>{NQ=q.value;const p=q.selectionStart;notesView();const n=$("#nq");n.focus();n.setSelectionRange(p,p)};
  $$(".fc[data-f]").forEach(b=>b.onclick=()=>{NF[b.dataset.f]=b.dataset.v;notesView()});
  $$("[data-tag]").forEach(b=>b.onclick=()=>{const t=prompt("태그 (예: 면접, 헷갈림)");if(!t)return;const n=S.notes.find(x=>x.id===b.dataset.tag);n.tags.push(t.replace(/^#/,"").trim());save();notesView()});
  const sd=$("#seed");if(sd)sd.onclick=()=>{S.notes=D.seedNotes.map((n,i)=>({...n,id:"s"+i,t:Date.now()}));save();notesView();toast("예시 노트 3개를 넣었어.","happy")};
  $("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="reading-class-backup.json";a.click();toast("백업 파일을 내려받았어.")};
  $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!confirm("지금 기록을 백업 파일로 바꿀까?"))return;S=Object.assign(S,o);save();notesView();toast("백업을 불러왔어.","happy")}catch(er){toast("백업 파일을 읽지 못했어.","think")}})};
}
/* ---------- 자료실 ---------- */
function libView(){$("#app").innerHTML=`<div class="view"><span class="eyebrow">자료실</span><h1 class="h1">근거가 필요할 때</h1><p class="lead">읽기 화면에서 뺀 원문 근거는 여기 모여 있다. 지금 사이트(v5.1)의 화면으로 연결된다.</p>
 <div class="lib sec">${[["📜","원본 도감","원문으로 대조한 기준서·법령 20종","../#src/cat"],["🗓️","개정 이력","원본이 바뀌는 날, D-day","../#src/changes"],["🛠️","정정 기록","검수에서 고친 69곳","../#src/fixes"],["🧭","문단 계보","Scope 1·2 배출량이 문서 사이를 흐르는 길","../#map"],["🔤","용어집","용어 438개","../#ref"],["🔁","KSSB ↔ IFRS S2","두 기준의 문단 대응표","../#map/table"]].map(x=>`<a class="card" href="${x[3]}"><i>${x[0]}</i><b>${x[1]}</b><span>${x[2]}</span></a>`).join("")}</div></div>`}
/* ---------- 라우팅·공통 ---------- */
function route(){const [v,a]=(location.hash||"#home").slice(1).split("/");window.onscroll=null;$$(".pop").forEach(p=>p.remove());
  $$("#nav a,#tabbar a").forEach(x=>x.classList.toggle("on",x.dataset.v===v||(x.dataset.v==="area"&&["book","read"].includes(v))));
  if(v!=="quiz"){QS=0;QA={}}
  ({home,map:mapView,area:()=>area(a||"dis"),book:()=>bookView(a||"kssb"),read:()=>readView(a||S.cur),quiz:()=>quizView(a),notes:notesView,lib:libView}[v]||home)();scrollTo(0,0)}
addEventListener("hashchange",route);
document.addEventListener("click",ev=>{$$(".pop").forEach(p=>p.remove());const t=ev.target.closest(".term");if(!t)return;const r=t.getBoundingClientRect();const p=document.createElement("div");p.className="pop";p.innerHTML="<b></b><span></span> <small></small>";p.querySelector("b").textContent=t.textContent;p.querySelector("span").textContent=t.dataset.d;p.querySelector("small").textContent=t.dataset.en||"";document.body.appendChild(p);p.style.left=Math.max(12,Math.min(innerWidth-p.offsetWidth-12,r.left))+"px";p.style.top=(r.bottom+8)+"px"});
let fs=17;try{fs=+(localStorage.getItem("rc6-fs")||17)}catch(e){}const setFs=v=>{fs=Math.max(15,Math.min(21,v));document.documentElement.style.setProperty("--fs",fs+"px");try{localStorage.setItem("rc6-fs",fs)}catch(e){}};setFs(fs);
$("#fsDn").onclick=()=>setFs(fs-1);$("#fsUp").onclick=()=>setFs(fs+1);
try{const t=localStorage.getItem("rc6-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
$("#theme").onclick=()=>{const r=document.documentElement;const c=r.getAttribute("data-theme");const d=c?c==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.setAttribute("data-theme",d?"light":"dark");try{localStorage.setItem("rc6-theme",d?"light":"dark")}catch(e){}};
route();
</script>
</body>
