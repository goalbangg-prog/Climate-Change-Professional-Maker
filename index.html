, 산화율, 탄소함량처럼 배출량을 구하는 데 들어가는 변수를 통틀어 부르는 말이다. 산정등급(22호)은 이런 매개변수와 산정방법의 복잡성 수준, 곧 Tier다.","대상 가스는 31호가 정한다. 탄소중립기본법 제2조제5호의 이산화탄소, 메탄, 아산화질소, 수소불화탄소, 과불화탄소, 육불화황의 여섯 가지다. 「온실가스와 Scope」에서 본 교토의정서 일곱 가지와 달리 삼불화질소(NF3)가 없다. 또 32호는 온실가스 배출을 직접 배출과 외부에서 공급된 전기·열 사용에 따른 간접 배출로 나눈다. Scope 1과 Scope 2에 해당하지만 고시는 '직접'과 '간접'이라는 말을 쓴다."],"req":"명세서, 배출량 인증, 적합성 평가, 활동자료, 배출계수, 매개변수, 산정등급 등 이 고시의 기본 용어와 6대 온실가스 범위를 익힌다.","fig":{"cap":"제2조 정의 가운데 숫자가 들어간 것","head":["용어","뜻","호"],"rows":[["소규모 배출시설","기준기간 연평균 배출량 100 tCO2-eq 미만인 배출시설","45호"],["소량배출사업장","기준기간 연평균 배출량 3,000 tCO2-eq 미만인 사업장","46호"],["온실가스","CO2, CH4, N2O, HFCs, PFCs, SF6의 여섯 가지","31호"]]},"terms":[{"t":"명세서","d":"할당대상업체가 이행연도에 실제 배출한 온실가스를 측정·보고·검증 가능한 방식으로 적은 배출량 보고서다.","en":"emissions statement"},{"t":"매개변수","d":"활동자료, 배출계수, 발열량, 산화율처럼 배출량 계산식에 들어가는 변수를 통틀어 부르는 말이다.","en":"parameter"},{"t":"산정등급(Tier)","d":"활동자료와 배출계수 등 산정방법의 정밀도 수준으로, 1에서 4까지 있다.","en":"tier"}]},{"no":"제3조","label":"다른 규정과 부딪히면","doc":"mrv","pdfPage":5,"prose":["제3조제1항은 할당대상업체의 명세서 제출과 정보 공개, 배출량 인증 기준과 절차에 관해서는 이 고시를 다른 지침보다 우선 적용한다고 한다. 국내에는 탄소중립기본법 아래의 목표관리제 지침도 있어서 비슷한 내용이 겹치는데, 할당대상업체에게는 이 고시가 먼저다. 제2항은 이 고시에 없는 사항은 기본법과 시행령에 따른 지침을 적용하고, 필요하면 ISO 같은 국제 기준을 쓸 수 있다고 한다.","제4조는 환경부장관의 업무 13가지를 나열한다. 인증 총괄, 인증위원회 운영, 산정 계획의 사전검토와 추가검토, 적합성 평가, 보고하지 않은 업체에 대한 제출 명령과 직권산정, 이의신청 처리, 실태조사, 명세서 정보공개 등이다. 이 목록은 뒤에 나올 회차들의 차례이기도 하다. 제5조는 자료제출 협조, 제6조는 비밀 준수다. 산정 계획과 명세서에는 생산량, 연료 사용량 같은 영업 정보가 들어 있으므로 검토·평가에 관여하는 사람 모두에게 보안 의무가 있다."],"req":"명세서 제출·공개와 인증에 관해서는 이 고시가 다른 지침보다 우선하고, 없는 내용은 기본법 지침이나 국제 기준을 보충해 쓴다.","terms":[{"t":"목표관리제","d":"탄소중립기본법 제27조에 따라 관리업체가 배출량 목표를 받고 명세서를 내는 제도로, 배출권거래제와 별도의 지침을 쓴다.","en":"GHG and Energy Target Management Scheme"}]},{"no":"별표 1","label":"산정 계획에서 등록부까지, 세 해에 걸친 흐름","doc":"mrv-full","pdfPage":19,"prose":["제7조제1항은 산정·보고체계를 별표 1에 그려 두었다. 표는 T-1년도, T년도, T+1년도의 세 줄로 되어 있다. T-1년도에 할당대상업체는 검증보고서를 붙여 배출량 산정 계획의 사전검토를 요청하고, 환경부장관은 타당성을 검토해 결과를 통지한다. T년도에는 그 계획대로 배출량을 모니터링하다가 변경이 생기면 추가검토를 요청하고 결과를 확인한다. T+1년도에 T년도 배출량을 산정해 명세서를 쓰고, 제3자 검증기관의 검증을 받아 제출하면 접수·확인을 거쳐 온실가스센터의 등록부(DB)에 등록된다.","이 그림에서 기억할 점은 두 가지다. 첫째, 명세서는 계산이 끝난 뒤가 아니라 1년 전에 미리 낸 '산정 계획'에서 시작한다. 계획에 적은 측정 지점, 측정기기, 계수를 그대로 써서 세어야 하므로 계획 단계가 실제 숫자를 좌우한다. 둘째, 회사 밖의 손이 두 번 들어온다. 검증기관의 검증과 정부의 인증이다. 검증은 숫자가 규칙대로 만들어졌는지 제3자가 확인하는 일이고, 인증은 정부가 그 숫자를 최종 확정하는 일이다.","날짜로 적으면 이렇다. 명세서는 법 제24조와 이 고시 제29조에 따라 이행연도 종료일부터 3개월 이내, 보통 3월 말까지 낸다. 인증 결과는 제37조에 따라 매년 5월 31일까지 통보되고, 법 제25조제4항은 이행연도 종료일부터 5개월 이내에 배출권등록부에 등록하라고 한다. 즉 1월부터 3월까지 산정과 검증, 4월부터 5월까지 적합성 평가와 인증이 이어진다."],"req":"배출량은 T-1년 산정 계획 사전검토, T년 이행, T+1년 산정·명세서·검증·제출·등록의 순서로 다루어진다.","fig":{"cap":"별표 1 산정·보고체계 요약 (mrv-full.pdf 19~20쪽)","head":["시기","할당대상업체","환경부장관"],"rows":[["T-1년도","산정 계획 사전검토 요청(검증보고서 첨부)","타당성 검토 후 결과 통지"],["T년도","계획 이행, 변경 시 추가검토 요청","변경사항 타당성 검토 후 통지"],["T+1년도","배출량 산정, 명세서 작성, 제3자 검증","접수·확인, 온실가스센터 등록부(DB) 등록"]]},"terms":[{"t":"이행연도","d":"배출량을 세고 배출권을 제출하는 1년 단위 기간으로, 보통 역년(1월~12월)이다.","en":"compliance year"},{"t":"검증","d":"회사가 만든 명세서가 규칙대로 작성되었는지 지정된 제3자 검증기관이 확인하는 일이다.","en":"verification"},{"t":"인증","d":"정부가 적합성 평가를 거쳐 할당대상업체의 실제 배출량을 최종 확정하는 일이다.","en":"certification"}]},{"no":"별표 2","label":"산정 7단계를 미리 훑어보기","doc":"mrv-full","pdfPage":21,"prose":["제8조는 산정 절차를 별표 2에 맡긴다. 별표 2는 7단계다. 1단계 조직경계 설정은 사업자등록증, 허가신청서 같은 공식 문서로 사업장의 부지경계를 찾는 일이다. 2단계 배출활동 확인·구분은 별표 3의 배출활동 목록에 따라 사업장 안의 배출활동을 찾고 별표 6의 배출시설을 확인하는 일이다. 3단계는 별표 8을 참고해 활동자료의 모니터링 유형을 고르고, 시료 채취와 분석 주기가 별표 13·14를 만족하는지 확인한다.","4단계는 산정책임자와 담당자를 정하고 별표 19에 따라 누가 어떤 방법으로 감시하고 산정하는지 역할을 정하는 체계 구축이다. 5단계는 별표 5의 최소 Tier에 따라 배출활동별 산정방법론을 고르고 매개변수별 자료 수집 방법을 정한다. 6단계에서 별표 6의 세부 산정방법으로 배출량을 계산하고, 7단계에서 제28조에 따라 별지 제11호 서식으로 명세서를 쓴다. 이 책의 회차 순서가 거의 이 7단계를 따른다. 3회차가 1단계, 2회차가 2단계, 8회차가 3단계, 4~7회차가 5·6단계, 11·12회차가 4·7단계에 해당한다."],"req":"배출량 산정은 조직경계 설정, 배출활동 확인, 모니터링 유형 설정, 체계 구축, 방법론 선택, 산정, 명세서 작성의 7단계로 진행한다.","fig":{"cap":"별표 2 산정절차와 참조 별표","head":["단계","하는 일","참조"],"rows":[["1","조직경계 설정","별표 4"],["2","배출활동 확인·구분","별표 3, 별표 6"],["3","모니터링 유형·방법 설정","별표 8, 13, 14"],["4","산정·모니터링 체계 구축","별표 19"],["5","배출활동별 산정방법론 선택","별표 5, 6"],["6","배출량 산정","별표 6"],["7","명세서 작성","제28조, 별지 제11호"]]}}],"write":{"q":"할당대상업체의 배출량 명세서는 1년 동안 어떤 순서로 만들어져 확정되나?","must":[["산정 계획","산정계획","모니터링 계획"],["검증","검증기관","제3자"],["인증","확정"]],"bonus":[["3개월","3월"],["등록부","5월"]],"wrong":["배출권 구매","탄소세","공시"],"model":"미리 사전검토 받은 산정 계획대로 배출량을 세어 명세서를 쓰고, 검증기관의 검증을 거쳐 이행연도 종료 후 3개월 안에 내면 정부가 적합성 평가를 거쳐 인증한다.","src":"별표 1, 제29조, 제37조"},"check":{"q":"이 고시가 정의하는 온실가스에 들어가지 않는 가스는?","options":["육불화황(SF6)","삼불화질소(NF3)","아산화질소(N2O)"],"ans":1,"why":"제2조제31호는 탄소중립기본법 제2조제5호의 CO2, CH4, N2O, HFCs, PFCs, SF6 여섯 가지를 온실가스로 정의한다. NF3는 교토의정서 7대 가스에는 있지만 이 고시의 대상이 아니다."},"summary":["이 고시는 배출권거래법 제24조(명세서 보고·공개)와 제25조(배출량 인증)의 세부 방법을 정하며, 할당대상업체에게 다른 지침보다 우선한다.","배출량은 T-1년 산정 계획 사전검토, T년 이행, T+1년 산정·명세서·검증·제출·인증의 순서로 다루어지고, 명세서는 이행연도 종료 후 3개월 이내에 낸다.","대상 가스는 CO2, CH4, N2O, HFCs, PFCs, SF6 여섯 가지이며 직접 배출과 간접 배출(외부 전기·열)로 나누어 센다."]},{"id":"m-2","title":"산정 원칙과 절차, 산정 범위","range":"제7~9조, 제18조, 별표 2·3","pages":[7,10],"min":14,"intro":"숫자를 세기 전에 '어떤 태도로, 무엇을' 세야 하는지가 정해져 있다. 이 회차에서는 제7조의 다섯 가지 산정 원칙, 제9조의 산정 범위, 별표 3의 배출활동 목록, 그리고 총배출량에서 빼는 것을 정한 제18조를 읽는다.","blocks":[{"no":"제7조","label":"다섯 가지 산정 원칙","doc":"mrv","pdfPage":7,"prose":["제7조는 배출량을 셀 때 지켜야 할 원칙을 다섯 항에 나누어 적었다. 제1항은 이 고시가 정한 방법과 절차를 따르라는 준수 원칙이다. 제2항은 이 고시의 범위 안에서 모든 배출활동과 배출시설을 세고, 빼는 것이 있으면 그 이유를 분명히 적으라는 완전성 원칙이다. 제3항은 시간에 따른 변화를 비교할 수 있도록 일관된 자료와 방법을 쓰고, 바뀐 것이 있으면 기록하라는 일관성 원칙이다.","제4항은 과대·과소 산정 같은 오류가 없도록 최대한 정확하게 세라는 정확성 원칙이고, 제5항은 쓴 방법론, 자료와 출처, 가정을 분명히 제시할 수 있어야 한다는 투명성 원칙이다. GHG 프로토콜의 다섯 원칙(관련성, 완전성, 일관성, 정확성, 투명성)과 거의 같은데, 관련성 대신 '고시 준수'가 들어 있다. 국내 명세서에서는 회사가 경계나 방법을 고를 여지가 적고 고시가 정한 대로 세기 때문이다.","실무에서 이 원칙은 검증과 적합성 평가의 잣대로 돌아온다. 작년과 다른 배출계수를 썼는데 기록이 없으면 일관성 위반이고, 식당 LPG 보일러를 빼면서 이유를 안 적으면 완전성 위반이다. 그래서 산정 담당자는 계산 시트 옆에 '왜 이 값을 썼는지'를 적는 메모 열을 두는 습관이 필요하다."],"req":"배출량은 고시가 정한 방법으로, 모든 배출활동을 빠짐없이, 해마다 일관되게, 정확하게, 근거를 제시할 수 있게 산정한다.","quote":"할당대상업체는 이 지침에 제시된 범위 내에서 모든 배출활동과 배출시설에서 온실가스 배출량 등을 산정하여야 한다. 온실가스 배출량 등의 산정에서 제외되는 배출활동과 배출시설이 있는 경우에는 그 제외사유를 명확하게 제시하여야 한다.","terms":[{"t":"완전성","d":"조직경계 안의 모든 배출활동과 배출시설을 빠뜨리지 않고 세는 원칙이다.","en":"completeness"},{"t":"일관성","d":"해마다 같은 자료와 방법으로 세어 시간에 따른 비교가 가능하게 하는 원칙이다.","en":"consistency"}]},{"no":"제9조","label":"무엇을, 어떤 단위로 세나","doc":"mrv","pdfPage":8,"prose":["제9조는 산정 범위다. 제1항은 제2조제31호의 여섯 가지 온실가스를 빠짐없이 세라고 한다. 제2항은 직접배출과 간접배출로 배출유형을 나누어 세라고 한다. 제3항은 법인 단위, 사업장 단위, 배출시설 단위, 배출활동별로 세라고 한다. 즉 명세서의 숫자는 회사 전체 합계 하나가 아니라 사업장마다, 그 안의 보일러·소성로·차량 같은 배출시설마다, 그리고 고체연료 연소나 외부 전기 사용 같은 배출활동마다 따로 적힌다.","제4항은 세야 하는 배출활동의 종류를 별표 3에 맡긴다. 제5항은 작은 시설의 부담을 덜어 준다. 기준기간 연평균 배출량이 100 tCO2-eq 미만인 소규모 배출시설이 같은 배출활동과 활동자료를 쓰는 경우, 환경부장관의 확인을 거쳐 시설 하나하나가 아니라 시설군으로 묶어 보고할 수 있다. 공장 곳곳의 소형 난방기나 비상발전기를 생각하면 된다.","배출시설이라는 말은 제2조제14호에서 넓게 정의된다. 원료나 연료가 투입되는 지점, 전기·열이 사용되는 지점부터 해당 공정 전체를 말하고, 같은 목적으로 같은 연료·원료·전기·열을 쓰는 비슷한 설비들을 묶은 설비군 단위로 본다. 그래서 명세서에서는 보일러 1호기, 2호기를 따로 적을 수도 있고 '일반보일러 시설'로 묶을 수도 있다."],"req":"여섯 가지 온실가스를 직접·간접 배출로 나누고, 법인·사업장·배출시설·배출활동 단위로 빠짐없이 산정한다.","fig":{"cap":"명세서 숫자의 단위 층위 (제9조제3항)","head":["층위","예"],"rows":[["법인","○○자동차(주)"],["사업장","울산공장, 아산공장"],["배출시설","도장 건조로, 일반보일러, 업무용 차량"],["배출활동","기체연료 고정연소, 이동연소(도로), 외부 전기 사용"]]},"terms":[{"t":"배출시설","d":"연료·원료가 들어가거나 전기·열이 쓰이는 지점부터의 공정 전체로, 비슷한 설비를 묶은 설비군 단위로 본다.","en":"emission facility"},{"t":"시설군 보고","d":"연평균 100톤 미만 소규모 배출시설을 환경부 확인 아래 묶어서 보고하는 방식이다.","en":"facility-group reporting"}]},{"no":"별표 3","label":"산정 대상 배출활동 목록","doc":"mrv-full","pdfPage":23,"prose":["별표 3은 조직경계 안의 모든 온실가스 배출활동을 아래 구분에 따라 세고, 여기에 없는 배출활동은 '기타 배출활동'으로 보고하라고 한다. 구분은 일곱 가지다. 1 고정 연소시설(고체·기체·액체 연료 연소), 2 이동연소시설(항공, 도로수송, 철도수송, 선박), 3 제품 생산 공정 및 제품 사용(시멘트, 석회, 탄산염 기타 공정사용, 유리, 마그네슘, 인산, 석유정제, 암모니아, 질산, 아디프산, 카바이드, 소다회, 석유화학, 불소화합물, 카프로락탐, 철강, 합금철, 아연, 납, 전자산업, 연료전지, ODS 대체물질 사용, 기타 온실가스 배출·사용의 24가지)이다.","이어서 4 폐기물 처리과정(고형폐기물 매립, 생물학적 처리, 하·폐수 처리, 폐기물 소각), 5 탈루성 배출(석탄 채굴·처리·저장, 원유 산업, 천연가스 산업), 6 외부로부터 공급된 전기·열·증기 사용에 따른 간접 배출, 7 이산화탄소 포집 및 이동에 따른 이동량이다. 1~5가 직접배출, 6이 간접배출이고, 7은 배출량에서 빼 주는 이동량이다. 이 번호는 별표 6의 41개 세부 산정방법 번호와 이어진다.","자동차 공장이라면 어떤 항목이 나올까. 도장 건조로와 보일러의 LNG 연소(1-기체), 비상발전기 경유(1-액체), 지게차와 업무용 차량(2-도로), 에어컨 냉매 충전(3-ODS 대체물질), 폐수처리장(4), 구매 전력과 스팀(6)이 떠오른다. 별표 3은 이렇게 사업장을 한 바퀴 돌며 빠진 배출원이 없는지 점검하는 체크리스트로 쓴다."],"req":"별표 3의 일곱 가지 구분에 따라 조직경계 안의 모든 배출활동을 찾아 세고, 목록에 없는 것은 기타 배출활동으로 보고한다.","fig":{"cap":"별표 3 배출활동 대분류 (mrv-full.pdf 23~26쪽)","head":["번호","구분","Scope"],"rows":[["1","고정 연소시설(고체·기체·액체)","직접"],["2","이동연소시설(항공·도로·철도·선박)","직접"],["3","제품 생산 공정 및 제품 사용(24가지)","직접"],["4","폐기물 처리과정(매립·생물학적 처리·하폐수·소각)","직접"],["5","탈루성 배출(석탄·원유·천연가스)","직접"],["6","외부 공급 전기·열·증기 사용","간접"],["7","이산화탄소 포집 및 이동","이동량(차감)"]]},"terms":[{"t":"공정배출","d":"제품 생산 공정에서 원료의 물리·화학 반응으로 생기는 온실가스 배출로, 연료를 태워서 나오는 연소배출과 구분한다(제2조제8호).","en":"process emissions"},{"t":"탈루성 배출","d":"연소가 아니라 채굴·저장·수송 과정에서 새어 나가는 온실가스 배출이다.","en":"fugitive emissions"}]},{"no":"제18조","label":"총배출량에서 빼는 것","doc":"mrv","pdfPage":10,"prose":["제18조는 세기는 하되 총 온실가스 배출량에서 빼는 항목을 정한다. 제1항제1호는 별표 16의 바이오매스 사용에 따른 이산화탄소 직접배출이다. 목재나 바이오디젤을 태울 때 나오는 CO2는 생물이 자라며 흡수한 탄소가 돌아가는 것으로 보아 총배출량에서 빼되, 메탄과 아산화질소는 넣는다. 바이오매스와 화석연료를 섞어 쓰면 제3항에 따라 혼합비율을 분석해 그 비율만큼만 뺀다. 단, 에너지사용량에는 모두 포함한다.","제2호와 제3호는 외부에서 폐열이용 특례로 인정되는 폐기물 소각시설이나 공정폐열에서 공급받은 열의 간접배출량이다. 버려질 열을 쓰는 것이므로 배출이 없다고 본다. 제4호는 그 열로 생산된 전력 사용분이다. 제5항은 이산화탄소 포집 뒤 순수한 물질이나 제품·원료로 쓰이거나 저장된 경우 뺄 수 있다고 한다. 제6항은 재생에너지 전력을 전력구매계약(PPA), REC 구매, 지분 참여 등으로 쓰고 재생에너지 사용확인서를 받으면 그 전력의 간접배출량을 뺄 수 있다고 한다.","이 조문은 「온실가스와 Scope」에서 본 시장기반 Scope 2와 닿아 있다. 국내 명세서에서도 PPA나 REC로 산 재생에너지 전력은 간접배출에서 뺄 수 있지만, 조건이 있다. 의무이행에 쓰지 않은 REC여야 하고, 확인서를 받아 감축실적으로 쓰려는 경우여야 한다. 그래서 보고서의 시장기반 Scope 2와 명세서의 간접배출량은 계산 규칙이 비슷해도 숫자가 똑같지는 않을 수 있다."],"req":"바이오매스 CO2, 폐열이용 특례 열, 포집 뒤 사용·저장된 CO2, 재생에너지 사용확인서를 받은 전력의 간접배출은 총배출량에서 제외하되 에너지사용량에는 포함한다.","ex":{"k":"현대차 보고서에서는","t":"157쪽 검증의견서는 2025년 Scope 2를 지역기반 1,084,648 tCO2-eq, 시장기반 1,084,521 tCO2-eq로 나누어 적고, 시장기반은 '재생에너지 직접전력구매계약(PPA)을 통한 재생에너지 전력량을 Scope 2 온실가스 배출량에 반영'했다고 밝혔다.","co":"hyundai","page":157},"terms":[{"t":"바이오매스","d":"신재생에너지법에 따라 재생 가능한 에너지로 바뀔 수 있는 생물자원과 그것으로 만든 연료로, 태울 때 나온 CO2는 총배출량에서 뺀다.","en":"biomass"},{"t":"폐열이용 특례","d":"폐기물 소각 등에서 회수한 열을 공급받아 쓰면 그 간접배출을 0으로 보는 제도다(별표 18).","en":"waste-heat utilization exception"}]}],"write":{"q":"제7조가 정한 산정 원칙 가운데 세 가지 이상을 들고, 빼는 배출시설이 있을 때 무엇을 해야 하는지 쓰시오.","must":[["빠짐없이","모든","완전"],["일관","같은 방법","비교"],["제외사유","이유","사유"]],"bonus":[["정확"],["투명","출처","근거"]],"wrong":["추정치로 대체","보고 생략"],"model":"모든 배출활동을 빠짐없이, 해마다 일관된 방법으로, 정확하고 투명하게 세어야 하며, 제외하는 시설이 있으면 그 제외사유를 분명히 적어야 한다.","src":"제7조제2항~제5항"},"check":{"q":"목재 펠릿을 태우는 보일러의 배출을 명세서에서 어떻게 다루나?","options":["CO2, CH4, N2O 모두 총배출량에 넣는다","CO2는 총배출량에서 빼고 CH4·N2O는 넣으며, 에너지사용량에는 모두 넣는다","모두 세지 않는다"],"ans":1,"why":"제18조제1항제1호에 따라 바이오매스 사용에 따른 CO2 직접배출만 총배출량에서 제외하고, 그 밖의 온실가스는 포함하며, 에너지사용량 산정에는 포함한다."},"summary":["제7조의 원칙은 고시 준수, 완전성, 일관성, 정확성, 투명성이며, 빼는 배출시설이 있으면 제외사유를 적어야 한다.","여섯 가지 가스를 직접·간접으로 나누어 법인·사업장·배출시설·배출활동 단위로 세고, 대상 배출활동은 별표 3의 일곱 가지 구분을 따른다.","바이오매스 CO2, 폐열이용 특례 열, 확인서를 받은 재생에너지 전력 등은 총배출량에서 빼지만 에너지사용량에는 넣는다."]},{"id":"m-3","title":"조직경계: 어디까지가 우리 사업장인가","range":"제10조, 별표 4 (별표 21·22 개요)","pages":[8,8],"min":13,"blocks":[{"no":"제10조","label":"누락이 없도록 경계를 긋는다","doc":"mrv","pdfPage":8,"prose":["제10조제1항은 온실가스 배출원이 빠지지 않도록 별표 4에 따라 조직경계를 결정하라고 한다. 조직경계는 제2조제37호에서 '업체의 지배적인 영향력 아래에서 발생되는 활동에 의한 배출량의 산정 및 보고의 기준이 되는 조직의 범위'로 정의된다. 「온실가스와 Scope」에서 본 지분율 기준, 재무통제, 운영통제 가운데 국내 명세서는 운영통제 하나로 정해져 있다. 회사가 고를 수 없다.","제2항은 별표 4에 없는 경우에는 과다·과소 산정이 생기지 않도록 경계를 정하고 그 타당성을 분명히 제시하라고 한다. 제3항은 조직경계 밖의 시설이라도 안쪽 배출량과 연결되어 있어 모니터링이 필요하다면 산정 계획에 포함하라고 한다. 예를 들어 옆 회사 보일러에서 스팀을 받아 쓰는데 스팀 계량기가 옆 회사 안에 있다면, 그 계량기는 우리 경계 밖이지만 산정 계획에는 들어가야 한다.","제4항은 중앙행정기관과 지방자치단체에 적용되는 시설을 가축분뇨공공처리시설, 공공재활용기반시설, 폐기물처리시설, 공공폐수처리시설, 공공하수도·분뇨처리시설, 수도, 전기사업 시설, 집단에너지사업 시설의 여덟 가지로 한정한다. 시청 건물은 빠지고 하수처리장과 소각장이 들어간다는 뜻이다."],"req":"배출원 누락이 없도록 별표 4의 운영통제 기준으로 조직경계를 정하고, 별표 4에 없는 경우는 타당성을 제시한다.","terms":[{"t":"조직경계","d":"업체가 지배적인 영향력을 가진 범위로, 어디까지의 배출을 우리 것으로 세는지 정하는 선이다.","en":"organizational boundary"},{"t":"지배적인 영향력","d":"조직 변경, 투자, 인사, 회계, 녹색경영 등 주요 의사결정이나 감축 업무집행에 필요한 영향력을 행사하는 것이다(제2조제40호).","en":"dominant influence"}]},{"no":"별표 4","label":"운영통제 범위와 여섯 가지 상황","doc":"mrv-full","pdfPage":27,"prose":["별표 4의 1은 결정 원칙이다. 할당대상업체는 지리적 경계, 물리적 경계, 업무활동 경계를 고려한 운영통제 범위를 설정해야 한다. 그러려면 사업장의 지리적 경계, 그 안의 배출시설과 에너지 사용 시설, 감축시설, 조직의 변경, 경계 안에 상주하는 타 법인, 모니터링 관련 시설의 유무를 확인하고, 시설 관리의 주체와 경제적 이익이 누구에게 가는지를 파악한다. 결정한 내용은 산정 계획에 구체적으로 적어야 한다.","2는 다섯 가지 상황별 방법이다. 1) 여러 할당대상업체가 에너지를 연계해 쓰더라도 법인이 다르면 각자 따로 에너지 사용량을 모니터링하도록 경계를 정한다. 2) 타 법인이 우리 경계 안에 상주하는 경우, 그 법인의 운영통제권을 우리가 갖고 있으면 그 배출시설을 우리 조직경계에 넣는다. 반대로 운영통제권이 없고 그 업체의 배출시설 정보와 활동자료를 따로 파악할 수 있으면 제외할 수 있는데, 제외 사유를 산정 계획에 적어야 한다.","3) 건물은 별표 21, 4) 교통부문은 별표 22에 따른다. 5) 소량배출사업장은 주유소, 기지국, 영업점, 마을하수도처럼 같은 목적으로 비슷한 배출활동을 하는 경우 여러 사업장을 하나로 통합해 보고할 수 있다. 다만 환경부장관으로부터 사용가능 여부를 통보받은 뒤에 보고해야 하고, 누락과 중복이 없도록 해당 사업장의 보고 대상 시설 목록을 산정계획서와 명세서에 넣어야 한다. 통신사의 수천 개 기지국을 떠올리면 왜 필요한 규정인지 알 수 있다."],"req":"운영통제 범위로 경계를 정하되, 상주 타 법인은 통제권 유무로 넣고 빼며, 소량배출사업장은 환경부 통보를 받아 통합 보고할 수 있다.","fig":{"cap":"별표 4의 상황별 조직경계 결정 (mrv-full.pdf 27~28쪽)","head":["상황","결정 방법"],"rows":[["여러 업체가 에너지 연계 사용","법인별로 따로 모니터링하도록 경계 설정"],["타 법인이 경계 안에 상주","우리가 운영통제권을 가지면 포함, 없고 자료 분리 가능하면 제외(사유 기재)"],["건물","별표 21"],["교통부문","별표 22"],["소량배출사업장(주유소·기지국 등)","환경부 통보 후 하나의 사업장으로 통합 보고 가능"]]},"quote":"타 법인의 운영통제권을 할당대상업체가 가지고 있는 경우 할당대상업체는 상주하고 있는 타 법인의 온실가스 배출시설 및 에너지 사용시설을 조직경계에 포함하여야 한다.","terms":[{"t":"운영통제 범위","d":"조직이 배출과 관련해 지배적인 영향력을 행사할 수 있는 지리적·물리적·업무활동 경계다(제2조제34호).","en":"operational control boundary"}]},{"no":"별표 21","label":"건물과 교통의 경계 (별표 21·22 개요)","doc":"mrv-full","pdfPage":396,"prose":["별표 21은 건축물의 조직경계다. 할당업체의 건물은 업체 내 사업장과 떨어져 있어도 할당업체에 포함된 것으로 본다. 기준 문서는 건축물대장과 부동산 등기부다. 인접한 땅에 같은 법인이 여러 건물을 가지면 한 건물로 보고, 에너지 관리의 연계성이 있는 복수의 건물도 한 건물로 본다. 에너지 관리의 연계성은 제2조제28호에서 연료·열·전기의 공급점을 공유하는 상태로 정의된다. 소유가 지분으로 나뉘어 있으면 최대 지분 법인을 소유자로 보고, 한 건물에 구분 소유자와 임차인이 있어도 하나의 건물로 본다.","별표 22는 교통부문이다. 여객자동차운수사업자로부터 차량을 임대해 실질적으로 지배·통제하면 그 법인의 소유로 본다. 일반화물자동차 운송사업 법인이 허가받은 차량은 소유 여부와 상관없이 그 법인이 지배적 영향력을 미치는 차량으로 본다. 할당대상업체 지정을 위해 배출량을 셀 때 항공과 선박의 국제 항공·국제 해운 부문은 제외한다. 연간 화물운송량 3천만 톤-km 이상인 화주기업의 물류부문은 국토교통부가 자료 제출을 요청할 수 있다.","이 두 별표는 제조업 실무자에게는 자주 쓰이지 않지만, 건물의 경우 본사 사옥이나 연구소가 '어느 사업장에 속하나'를 정할 때 돌아온다. 명세서에서 본사 건물은 별도 사업장으로 잡히기도 하고, 공장 안 사무동은 공장 사업장에 포함된다. 어느 쪽이든 건축물대장과 등기부를 근거로 삼아 산정 계획에 적어 두면 검증 때 설명이 쉽다."],"req":"건물은 건축물대장·등기부를 기준으로 인접·연계된 건물을 한 건물로 보고, 교통은 임대·허가 차량도 실질 통제하는 법인의 것으로 본다.","terms":[{"t":"에너지 관리의 연계성","d":"연료·열·전기의 공급점을 공유해 한 건물에서 받은 에너지를 바꾸지 않고 다른 건물에 공급하는 상태다.","en":"energy management linkage"},{"t":"구분 소유자","d":"집합건물에서 건물의 한 부분을 목적으로 하는 소유권을 가진 사람이다(제2조제9호).","en":"sectional owner"}]}],"write":{"q":"우리 공장 안에 협력사가 상주하며 자기 설비를 운영한다. 그 설비의 배출을 우리 명세서에 넣어야 하나?","must":[["운영통제","통제권","지배"],["포함","넣"],["제외","빼","사유"]],"bonus":[["산정 계획","산정계획"],["활동자료","자료"]],"wrong":["지분율","매출"],"model":"그 설비의 운영통제권을 우리가 갖고 있으면 조직경계에 포함하고, 통제권이 없고 활동자료를 따로 파악할 수 있으면 제외할 수 있되 제외 사유를 산정 계획에 적는다.","src":"별표 4의 2-2)"},"check":{"q":"국내 명세서의 조직경계 결정 기준으로 맞는 것은?","options":["지분율, 재무통제, 운영통제 중 회사가 선택","운영통제 범위로 정해져 있음","매출액 비중으로 안분"],"ans":1,"why":"별표 4의 1은 지리적·물리적·업무활동 경계를 고려한 운영통제 범위를 설정하라고 한다. GHG 프로토콜과 달리 접근법을 고를 수 없다."},"summary":["국내 명세서의 조직경계는 운영통제 범위 하나로 정해져 있고, 배출원이 빠지지 않도록 별표 4에 따라 정한 뒤 산정 계획에 적는다.","경계 안의 상주 타 법인은 운영통제권이 있으면 포함하고, 없고 자료를 분리할 수 있으면 사유를 적고 제외한다.","소량배출사업장은 환경부 통보를 받아 통합 보고할 수 있고, 건물은 별표 21, 교통은 별표 22를 따른다."],"intro":"배출량 계산의 첫 단계는 어디까지가 우리 배출인지 선을 긋는 일이다. 이 회차에서는 제10조와 별표 4를 읽으며 국내 명세서가 운영통제 기준 하나로 경계를 정한다는 점과, 상주 타 법인·건물·교통·소량배출사업장 같은 까다로운 경우를 어떻게 다루는지 본다."},{"id":"m-4","title":"산정등급(Tier): 시설규모와 최소 등급","range":"제11조, 제14조, 제17조, 별표 5","pages":[8,9],"min":16,"intro":"같은 보일러라도 큰 시설은 더 정밀하게 세야 한다. 이 회차에서는 Tier 1부터 4까지가 무엇인지, 시설규모 A·B·C그룹을 어떻게 정하는지, 배출활동마다 최소 Tier가 어떻게 정해져 있는지를 별표 5에서 읽는다.","blocks":[{"no":"제11조","label":"최소 Tier를 지키고, 더 정밀하게는 자유","doc":"mrv","pdfPage":8,"prose":["제11조제1항은 배출시설의 규모와 세부 배출활동의 종류에 따라 별표 5의 최소산정등급(Tier)을 지켜 배출량을 세라고 한다. 세부 산정방법과 매개변수별 관리기준은 별표 6에 있다. 제2항은 별표 6에 산정방법이 없는 배출활동은 할당대상업체가 스스로 방법을 개발하라고 하고, 제3항은 별표 6보다 더 정확한 방법을 자체 개발해 쓸 수 있다고 한다. 즉 최소 기준은 강제이고 그 위로는 열려 있다.","제4항과 제5항은 자체 개발의 절차다. 배출활동 개요, 대상 배출시설, 대상 가스, 산정방법론, 매개변수별 관리기준이 들어간 산정 계획을 내야 하고, 개발 결과와 근거자료는 다음 연도 명세서에 포함해야 한다. 그리고 별표 7의 절차에 따라 환경부장관으로부터 사용 가능 여부를 통보받은 뒤에 써야 한다. 회사가 더 좋은 방법을 쓰겠다고 해도 정부 확인 없이 바로 쓸 수는 없다.","제17조는 연속측정방법(CEM)을 쓰면 그 배출시설의 산정등급을 Tier 4로 본다고 한다. 굴뚝에 자동측정기를 달아 농도와 유량을 재는 방식이다. 환경부장관은 대규모 연소시설과 폐기물 소각시설에 CEM 적용 확산을 권고할 수 있다. 제14조는 중소기업 특례다. 중소기업인 할당대상업체가 최소 Tier와 불확도 기준을 어쩔 수 없이 못 지키면 최초 지정 후 2회 이내의 명세서에서 적용하지 않을 수 있는데, 기준을 지키기 위한 조치와 일정을 산정 계획에 담아 내야 한다."],"req":"별표 5의 최소 Tier는 반드시 지키고, 더 정밀한 자체 방법은 별표 7 절차로 환경부 통보를 받은 뒤 쓴다.","terms":[{"t":"연속측정방법(CEM)","d":"굴뚝 등 고정 지점에 설치한 측정 장비로 배출가스 성분을 연속 측정하는 방법으로, Tier 4로 본다.","en":"continuous emission monitoring"},{"t":"중소기업 특례","d":"중소기업인 할당대상업체가 최초 지정 후 2회 이내 명세서에서 최소 Tier·불확도 기준을 적용하지 않을 수 있는 제도다(제14조).","en":"SME exemption"}]},{"no":"별표 5","label":"Tier 1~4의 뜻과 시설규모 A·B·C","doc":"mrv-full","pdfPage":29,"prose":["별표 5의 1은 Tier 분류체계다. Tier 1은 활동자료에 IPCC 기본 배출계수(기본 산화계수, 발열량 포함)를 곱하는 기본 방법론이다. Tier 2는 Tier 1보다 정확도가 높은 활동자료와 국가 고유 배출계수·발열량처럼 일정 부분 시험·분석을 거친 값을 쓰는 방법이다. Tier 3은 사업자가 사업장·배출시설 단위에서 상당 부분 시험·분석으로 개발하거나 공급자로부터 받은 값을 쓰는 방법이고, Tier 4는 굴뚝자동측정기 같은 연속측정방법이다. 숫자가 커질수록 '남이 준 평균값'에서 '우리 시설에서 직접 잰 값'으로 간다.","2는 배출량에 따른 시설규모 분류다. A그룹은 연간 5만 톤 미만, B그룹은 5만 톤 이상 50만 톤 미만, C그룹은 50만 톤 이상의 배출시설이다. 업체나 사업장이 아니라 배출시설 하나의 배출량으로 나눈다는 점이 중요하다. 비고 1)은 외부 전기·열 사용에 따른 간접배출을 뺀 모든 배출활동의 최소 Tier는 간접배출량을 제외한 직접배출량만을 기준으로 적용한다고 한다. 비고 2)는 한 시설이 여러 연료를 쓰면 연료별 배출량의 합으로 규모와 Tier를 정하되, C그룹 시설에서 초기가동·착화연료 같은 보조연료의 배출이 시설 총배출량의 5% 미만이면 차하위 Tier를 쓸 수 있고 이때 보조연료 배출량 합은 25,000 tCO2-eq 미만이어야 한다고 한다.","3은 시설규모를 언제 어떻게 정하는지다. 최초 결정은 기준연도 기간 중 해당 시설의 최근 연도 배출량으로 하되, 기준연도 평균이 최근 연도보다 크면 평균으로 한다. 최초 결정 이후에는 매년 1월 1일 기준으로 가장 최근에 제출된 명세서의 배출량으로 정하되, 최근 3개년도 명세서 평균이 더 크면 평균으로 한다. 두 경우 모두 큰 쪽을 택하게 되어 있어서 규모가 쉽게 내려가지 않는다. 신설 시설은 예상 배출량으로 정한다. 5는 가동률·생산량·설비 변경 등으로 규모가 바뀌어도 최소 Tier를 만족해야 하고 변경 내용을 산정 계획에 담으라고 한다."],"req":"Tier 1~4는 기본계수, 국가 고유계수, 사업장 고유계수, 연속측정의 순서이고, 시설규모는 배출시설별 직접배출량으로 A(5만 미만)·B(5만~50만)·C(50만 이상)를 나눈다.","fig":{"cap":"별표 5 산정등급과 시설규모 (mrv-full.pdf 29쪽)","head":["구분","내용"],"rows":[["Tier 1","활동자료 × IPCC 기본 배출계수(기본 산화계수·발열량 포함)"],["Tier 2","더 정확한 활동자료, 국가 고유 배출계수·발열량"],["Tier 3","사업장·배출시설 단위로 시험·분석해 개발하거나 공급자가 제공한 매개변수"],["Tier 4","굴뚝자동측정기 등 연속측정방법"],["A그룹","연간 5만 톤 미만 배출시설"],["B그룹","연간 5만 톤 이상 50만 톤 미만 배출시설"],["C그룹","연간 50만 톤 이상 배출시설"]]},"terms":[{"t":"시설규모","d":"배출시설 하나의 연간 직접배출량으로 나눈 A·B·C 그룹으로, 최소 Tier를 정하는 기준이다.","en":"facility size class"},{"t":"기준연도","d":"할당량을 정할 때 배출 실적의 기준이 되는 과거 연도 기간으로, 시설규모의 최초 결정에도 쓴다.","en":"base year"}]},{"no":"별표 5-4","label":"배출활동별 최소 Tier 표 읽기","doc":"mrv-full","pdfPage":32,"prose":["별표 5의 4는 배출활동별·시설규모별 최소 Tier 표다. 표의 열은 산정방법론, 연료사용량(활동자료), 순발열량, 배출계수, 산화계수이고 각각 A·B·C 세 칸이 있다. 고정연소의 고체·기체·액체 연료는 모든 매개변수가 A그룹 1, B그룹 2, C그룹 3으로 같다. 즉 연간 5만 톤 미만의 보일러는 Tier 1로 세어도 되지만, 50만 톤 이상 발전 보일러는 연료사용량 불확도, 발열량, 배출계수, 산화계수를 모두 Tier 3, 곧 자체 분석값으로 세야 한다.","이동연소는 다르다. 항공과 도로는 산정방법론·연료사용량·배출계수가 A·B 1, C 2이고, 철도와 선박은 모두 1이며, 순발열량은 A·B 2, C 2다. 산화계수는 이동연소에 적용하지 않는다. 운수업체는 해당 부문(항공·도로·철도·선박)의 배출량 합계로 A·B·C를 나누고, 항공은 제트연료를 쓰면서 이착륙(LTO)과 순항을 구분해 세는 경우 Tier 2를 적용해야 한다. 공정배출 표에서는 시멘트 생산이 1·2·3, 석회·유리는 1·2·2, 암모니아·질산은 산정방법론 1·1·1에 활동자료와 배출계수 1·2·2로 활동마다 다르다.","외부 전기·열은 표 6에 따로 있다. 외부 전기 사용은 산정방법론 1·1·1, 외부에너지 사용량 2·2·2, 간접배출계수 2·2·2이고, 외부 열·증기 사용은 산정방법론 1·1·1, 사용량 2·2·2, 간접배출계수 3·3·3이다. 전기는 규모와 관계없이 법정계량기 사용량에 국가 전력배출계수를 곱하고, 열은 공급자가 개발한 계수를 받아 쓰라는 뜻이다. 이 표를 읽을 때는 '시설이 몇 그룹인가'를 먼저 정하고 그 열을 세로로 내려가며 매개변수마다 필요한 Tier를 적어 두면 산정 계획의 Tier 적용계획 항목이 된다. 표의 주요 가스 외의 가스는 별표 6 각 활동의 '보고 대상 온실가스' 표를 따른다."],"req":"배출활동과 시설규모에 따라 매개변수마다 최소 Tier가 다르며, 고정연소는 A·B·C가 1·2·3, 외부 전기는 사용량·계수 모두 2, 외부 열의 계수는 3이다.","fig":{"cap":"별표 5-4 최소 Tier 일부 (mrv-full.pdf 32~35쪽)","head":["배출활동","산정방법론 A/B/C","활동자료 A/B/C","발열량 A/B/C","배출계수 A/B/C","산화계수 A/B/C"],"rows":[["고정연소(고체·기체·액체)","1/2/3","1/2/3","2/2/3","1/2/3","1/2/3"],["이동연소(도로)","1/1/2","1/1/2","2/2/2","1/1/2","-"],["시멘트 생산","1/2/3","1/2/3","-","1/2/3","-"],["외부 전기 사용","1/1/1","2/2/2","-","2/2/2","-"],["외부 열·증기 사용","1/1/1","2/2/2","-","3/3/3","-"]]},"ex":{"k":"현대차 보고서에서는","t":"157쪽 검증의견서는 DNV가 명세서를 '합리적 보증수준 하에서' 검증하고 '중요성 평가 기준 2.5%'를 적용해 2025년 국내 Scope 1 479,697 tCO2-eq, 지역기반 Scope 2 1,084,648 tCO2-eq에 적정 의견을 냈다고 적었다. 명세서 숫자는 이 Tier 규칙대로 만들어진 뒤 검증을 거친 값이다.","co":"hyundai","page":157}}],"write":{"q":"연간 30만 톤을 배출하는 LNG 보일러(단일 시설)는 별표 5에서 어떤 그룹이고, 연료사용량과 배출계수는 최소 몇 Tier로 세야 하나?","must":[["B그룹","B 그룹","B"],["Tier 2","2등급","2"],["5만","50만"]],"bonus":[["국가 고유","국가고유"],["5.0%","5%"]],"wrong":["A그룹","Tier 3","C그룹"],"model":"연간 5만 톤 이상 50만 톤 미만이므로 B그룹이고, 기체연료 고정연소의 연료사용량과 배출계수는 최소 Tier 2(국가 고유 배출계수, 불확도 ±5.0% 이내)로 세야 한다.","src":"별표 5의 2, 4"},"check":{"q":"시설규모를 최초 결정한 뒤 해마다 다시 정할 때 기준은?","options":["가장 최근 명세서 배출량과 최근 3개년 평균 중 큰 값","회사가 편한 쪽을 선택","항상 최근 3개년 평균"],"ans":0,"why":"별표 5의 3-2)는 매년 1월 1일 기준 최근 제출 명세서의 배출량으로 정하되, 최근 3개년 명세서 평균이 더 크면 평균으로 정한다고 한다. 큰 쪽을 택하므로 규모가 쉽게 내려가지 않는다."},"summary":["Tier 1은 IPCC 기본계수, Tier 2는 국가 고유계수, Tier 3은 사업장 고유계수, Tier 4는 연속측정이며 별표 5의 최소 Tier는 강제다.","시설규모는 배출시설별 직접배출량으로 A(5만 미만)·B(5만~50만)·C(50만 이상)를 나누고, 최근 명세서와 3개년 평균 중 큰 값으로 해마다 다시 정한다.","고정연소는 A·B·C가 1·2·3, 외부 전기는 사용량·계수 Tier 2, 외부 열의 계수는 Tier 3이며, 중소기업은 최초 지정 후 2회까지 특례가 있다."]},{"id":"m-5","title":"산정식 읽기 ① 고정연소","range":"별표 6의 1~3 (고체·기체·액체 연료)","pages":[36,54],"min":18,"intro":"명세서 숫자의 대부분은 보일러와 가열로에서 연료를 태운 배출이다. 이 회차에서는 별표 6의 고정연소 세 항목을 읽으며 기본 산정식, 매개변수별 Tier 관리기준, 산화계수 값을 익히고, 도시가스 보일러 예제 하나를 끝까지 계산해 본다.","blocks":[{"no":"별표 6","label":"별표 6 들어가며: 보고값의 자릿수와 기준 상태","doc":"mrv-full","pdfPage":36,"prose":["별표 6은 41가지 배출활동의 세부 산정방법을 300쪽 가까이 모아 둔 이 고시의 몸통이다. 첫 쪽에 공통 규칙이 있다. 사업장별 배출량은 정수로 보고한다. 활동자료의 보고값은 소수점 넷째 자리에서 반올림해 셋째 자리까지 쓰고, 각 산정방법론의 단위를 따른다. 활동자료를 제외한 매개변수의 수치 맺음은 센터가 공표하는 바에 따르고, Tier 4 연속측정의 수치 맺음은 별표 15를 따른다.","기준 상태도 정해져 있다. 석유제품의 기체연료는 특별한 언급이 없으면 0℃ 1기압 상태의 체적이고, 액체연료는 15℃를 기준으로 한 체적을 쓴다. 연료의 비중과 밀도는 공급업체나 사업자가 자체 개발한 값이 없으면 산업통상자원부 고시와 한국석유공사 자료를 인용한다. 사업장 고유 배출계수를 개발할 때는 활동자료 측정주기와 조성분석주기를 기준으로 가중평균한다. 별표 6에 방법이 없는 배출활동은 할당대상업체가 스스로 산정방법을 개발해야 한다.","각 배출활동 항목은 같은 틀로 쓰여 있다. 1 배출활동 개요, 2 보고 대상 배출시설, 3 보고 대상 온실가스(가스별로 가능한 Tier), 4 배출량 산정방법론(Tier별 식), 5 매개변수별 관리기준(Tier별로 활동자료·발열량·배출계수·산화계수 값을 어디서 가져오는지)이다. 이 틀을 알면 처음 보는 배출활동도 빠르게 읽을 수 있다."],"req":"사업장별 배출량은 정수로, 활동자료는 소수 셋째 자리까지 보고하며 기체연료는 0℃ 1기압, 액체연료는 15℃ 체적을 기준으로 한다.","terms":[{"t":"수치 맺음","d":"계산 결과를 몇째 자리까지 쓰고 어떻게 반올림할지 정한 규칙이다.","en":"rounding rule"}]},{"no":"별표 6-1","label":"고체연료: 기본 산정식과 보고 대상 시설","doc":"mrv-full","pdfPage":37,"prose":["별표 6의 1은 고정연소 고체연료다. 무연탄, 유연탄, 갈탄, 코크스 같은 고체 화석연료를 의도적으로 태워 열이나 기계적 일을 얻을 때 나오는 CO2, CH4, N2O를 다룬다. 보고 대상 배출시설은 화력발전시설, 열병합 발전시설, 발전용 내연기관, 일반보일러 시설, 공정연소시설(건조시설, 가열시설, 용융·용해시설, 소둔로, 기타로), 대기오염물질 방지시설(배연탈황·배연탈질), 고형연료제품 사용시설이다. 배연탈황시설은 석회석을 쓰므로 그 배출은 '탄산염의 기타 공정 사용'에서 보고하라는 주의가 붙어 있다.","보고 대상 온실가스 표는 CO2는 Tier 1·2·3·4, CH4와 N2O는 Tier 1만 가능하다고 한다. 메탄과 아산화질소는 양이 작아 기본계수로 충분하다는 뜻이다. Tier 1~3의 산정식은 하나다. 배출량(tGHG) = 연료 사용량(ton) × 열량계수(순발열량, MJ/kg) × 배출계수(kgGHG/TJ) × 산화계수 × 10⁻⁶이다. 산화계수는 CH4와 N2O에는 적용하지 않는다. 고체연료는 탄소함량, 회분, 수분, 휘발분이 연료마다 다르고 보관 중에도 변하기 때문에 연료 분석이 특히 중요하다고 적혀 있다.","10⁻⁶이 왜 붙는지 단위를 따라가 보자. ton × MJ/kg은 10³ kg × MJ/kg = 10³ MJ = GJ다. GJ × kgGHG/TJ는 GJ를 TJ로 바꾸려면 10⁻³, kg을 t로 바꾸려면 다시 10⁻³이 필요하다. 둘을 합친 것이 10⁻⁶이다. 기체연료는 사용량이 천m³, 발열량이 MJ/m³이고 액체연료는 KL과 MJ/L이라 같은 10⁻⁶이 붙는다. 단위만 맞으면 세 연료의 식은 글자 하나 다르지 않다."],"req":"고정연소 배출량은 연료 사용량 × 순발열량 × 배출계수 × 산화계수 × 10⁻⁶으로 구하고, CH4·N2O는 Tier 1만 쓰며 산화계수를 적용하지 않는다.","fig":{"cap":"별표 6 고정연소 산정식의 단위 (mrv-full.pdf 40, 47, 52쪽)","head":["연료","사용량 Q","순발열량 EC","배출계수 EF","결과"],"rows":[["고체","ton","MJ/kg","kgGHG/TJ","tGHG"],["기체","천m³","MJ/m³","kgGHG/TJ","tGHG"],["액체","KL","MJ/L","kgGHG/TJ","tGHG"]]},"terms":[{"t":"순발열량","d":"연료가 완전 연소할 때 생기는 열량에서 수증기의 잠열을 뺀 값으로, 배출량 산정에 쓴다(제2조제24호). 총발열량은 에너지사용량 집계에 쓴다.","en":"net calorific value"},{"t":"산화계수","d":"연료 속 탄소 가운데 실제로 타서 CO2가 된 비율로, CO2에만 곱한다.","en":"oxidation factor"}]},{"no":"별표 6-1-5","label":"매개변수별 관리기준: Tier마다 값을 어디서 가져오나","doc":"mrv-full","pdfPage":42,"prose":["별표 6의 각 항목 5는 매개변수마다 Tier별 관리기준을 적는다. 고체연료의 활동자료(연료사용량)는 Tier 1이 사업자 또는 연료공급자가 측정한 측정불확도 ±7.5% 이내, Tier 2가 ±5.0% 이내, Tier 3이 ±2.5% 이내의 자료이고 Tier 4는 연속측정이다. 열량계수(순발열량)는 Tier 1이 별표 11의 IPCC 기본 발열량, Tier 2가 별표 12의 국가 고유 발열량(센터가 별도 계수를 공표해 수록되면 그 값), Tier 3이 제16조에 따라 사업자가 자체 개발하거나 연료공급자가 분석해 제공한 값이다.","배출계수는 Tier 1이 별표 10의 IPCC 기본 배출계수, Tier 2가 제15조제2항의 국가 고유 배출계수, Tier 3이 제16조에 따라 자체 개발하거나 공급자가 제공한 고유 배출계수다. Tier 3 배출계수의 개발식도 적혀 있다. CO2 배출계수(kgCO2/TJ) = 탄소 배출계수(kgC/GJ) × 3.664 × 10³이고, 탄소 배출계수 = 연료 중 탄소의 질량분율 ÷ 순발열량(MJ/kg) × 10³이다. 3.664는 CO2 분자량 44.010을 탄소 원자량 12.011로 나눈 값이다. 즉 연료의 탄소 함량과 발열량을 분석하면 배출계수를 직접 만들 수 있다.","산화계수는 고체연료에서 Tier 1이 기본값 1.0, Tier 2가 발전 부문 0.99·기타 부문 0.98, Tier 3이 자체 개발값이다. Tier 3 개발식은 재 중 탄소 질량분율과 연료 중 재의 질량분율, 연료 중 탄소 질량분율로 산화되지 않고 재에 남은 탄소를 빼는 식이다. 기체연료의 산화계수는 Tier 1이 1.0, Tier 2와 Tier 3이 0.995이고, 액체연료는 Tier 1이 1.0, Tier 2와 Tier 3이 0.99다(55쪽). 기체연료의 Tier 3 배출계수는 가스 성분별 몰질량과 탄소 원자수로, 액체연료는 탄소 질량분율과 밀도, 발열량으로 환산하는 식이 따로 있다."],"req":"Tier 1은 별표 10·11의 IPCC 기본값, Tier 2는 별표 12와 국가 고유값, Tier 3은 제16조에 따라 분석한 자체값을 쓰고, 활동자료 불확도는 Tier별로 ±7.5·5.0·2.5% 이내여야 한다.","fig":{"cap":"고정연소 매개변수별 Tier 관리기준 (mrv-full.pdf 42~45, 50쪽)","head":["매개변수","Tier 1","Tier 2","Tier 3"],"rows":[["연료사용량 불확도","±7.5% 이내","±5.0% 이내","±2.5% 이내"],["순발열량","별표 11 IPCC 기본값","별표 12 국가 고유값","자체 분석 또는 공급자 제공"],["배출계수","별표 10 IPCC 기본값","국가 고유 배출계수","자체 개발(탄소함량 ÷ 발열량 × 3.664)"],["산화계수(고체)","1.0","발전 0.99, 기타 0.98","자체 개발"],["산화계수(기체)","1.0","0.995","0.995"],["산화계수(액체)","1.0","0.99","0.99"]]},"terms":[{"t":"측정불확도","d":"측정값이 참값에서 얼마나 벗어날 수 있는지를 ± 퍼센트로 나타낸 값이다.","en":"measurement uncertainty"},{"t":"3.664","d":"CO2 분자량(44.010)을 탄소 원자량(12.011)으로 나눈 값으로, 탄소 양을 CO2 양으로 바꿀 때 곱한다.","en":"carbon-to-CO2 ratio"}]},{"no":"별표 6-2","label":"예제: 도시가스 보일러 한 대를 Tier 2로 계산하기","doc":"mrv-full","pdfPage":47,"prose":["가상의 사용량으로 한 번 계산해 보자. B그룹 사업장의 일반보일러가 한 해 도시가스(LNG) 1,000천m³를 썼다고 하자(가상의 수치다). 기체연료의 식은 배출량 = 사용량(천m³) × 순발열량(MJ/m³) × 배출계수(kgGHG/TJ) × 산화계수 × 10⁻⁶이다. B그룹이므로 발열량과 배출계수는 Tier 2다. 별표 12의 국가 고유 발열량에서 도시가스(LNG)의 순발열량은 38.9 MJ/Nm³(361쪽), 국가 고유 배출계수에서 도시가스(LNG)의 CO2 배출계수는 56,100 kgCO2/TJ(363쪽), 기체연료 Tier 2 산화계수는 0.995(50쪽)다.","CO2 = 1,000 × 38.9 × 56,100 × 0.995 × 10⁻⁶ = 약 2,171.4 tCO2다. 중간값을 보면 1,000천m³ × 38.9 MJ/m³ = 38,900 GJ = 38.9 TJ의 열이 나왔고, 여기에 TJ당 56.1톤의 CO2 계수를 곱하면 2,182.3톤, 산화계수 0.995를 곱해 2,171.4톤이 된다. CH4와 N2O는 Tier 1만 쓰므로 별표 10에서 천연가스의 제조업 기본계수 CH4 1 kgCH4/TJ, N2O 0.1 kgN2O/TJ(349쪽)를 가져온다. CH4 = 38.9 TJ × 1 = 38.9 kg = 0.0389 t, N2O = 3.89 kg = 0.00389 t이고 산화계수는 곱하지 않는다.","마지막으로 가스별 값에 GWP를 곱해 더한다. 이 고시의 GWP는 참고 3의 SAR 값(456쪽)이므로 CH4 21, N2O 310이다. CH4 0.0389 × 21 = 0.82 tCO2-eq, N2O 0.00389 × 310 = 1.21 tCO2-eq다. 합계는 2,171.4 + 0.8 + 1.2 = 약 2,173.4 tCO2-eq이고 명세서에는 정수로 2,173이 적힌다. 메탄과 아산화질소가 전체의 0.1%도 안 된다는 것을 눈으로 확인할 수 있다. 연료 연소에서는 CO2 배출계수와 발열량이 숫자를 거의 결정한다."],"req":"기체연료 배출량은 사용량(천m³) × 순발열량(MJ/m³) × 배출계수(kgGHG/TJ) × 산화계수 × 10⁻⁶으로 구하고 가스별 값에 GWP를 곱해 더한다.","fig":{"cap":"예제 계산: 도시가스(LNG) 1,000천m³, Tier 2 (사용량은 가상, 계수는 원문 값)","head":["항목","값","출처 쪽"],"rows":[["순발열량","38.9 MJ/Nm³","별표 12, p361"],["CO2 배출계수","56,100 kgCO2/TJ","별표 12, p363"],["산화계수(기체 Tier 2)","0.995","별표 6-2, p50"],["CO2","1,000 × 38.9 × 56,100 × 0.995 × 10⁻⁶ = 2,171.4 t",""],["CH4 (1 kg/TJ, GWP 21)","38.9 kg → 0.82 tCO2-eq","별표 10 p349, 참고3 p456"],["N2O (0.1 kg/TJ, GWP 310)","3.89 kg → 1.21 tCO2-eq","별표 10 p349, 참고3 p456"],["합계","약 2,173 tCO2-eq",""]]},"terms":[{"t":"Nm³","d":"0℃, 1기압 상태의 기체 1세제곱미터로, 도시가스 사용량의 기준 단위다.","en":"normal cubic metre"}]}],"write":{"q":"고정연소 배출량의 기본 산정식을 말로 풀어 쓰시오.","must":[["연료 사용량","사용량","활동자료"],["발열량","열량계수"],["배출계수"]],"bonus":[["산화계수"],["10⁻⁶","10^-6","단위 환산"]],"wrong":["전력 배출계수","생산량"],"model":"배출량은 연료 사용량에 순발열량과 배출계수, 산화계수를 곱하고 10⁻⁶으로 단위를 맞춰 구한다.","src":"별표 6의 1~3, 4. 배출량 산정방법론"},"check":{"q":"기체연료 고정연소에서 Tier 2 산화계수 값은?","options":["1.0","0.995","0.98"],"ans":1,"why":"별표 6의 2(기체연료) 5-④는 Tier 1이 1.0, Tier 2와 Tier 3이 0.995라고 한다(50쪽). 0.98은 고체연료 Tier 2의 기타 부문 값이다."},"summary":["고정연소 배출량 = 연료 사용량 × 순발열량 × 배출계수 × 산화계수 × 10⁻⁶이며 CO2는 Tier 1~4, CH4·N2O는 Tier 1만 쓴다.","Tier 1은 별표 10·11 IPCC 기본값, Tier 2는 별표 12 국가 고유값, Tier 3은 제16조 자체 분석값이고 활동자료 불확도는 ±7.5·5.0·2.5% 이내다.","도시가스 1,000천m³는 Tier 2로 약 2,173 tCO2-eq이며, CH4·N2O는 SAR GWP(21, 310)를 곱해도 전체의 0.1% 수준이다."]},{"id":"m-6","title":"산정식 읽기 ② 이동연소와 외부 전기·열","range":"별표 6의 5(도로), 39(외부 전기), 40(외부 열)","pages":[62,72],"min":17,"intro":"차량과 구매 전력은 거의 모든 사업장에 있는 배출원이다. 이 회차에서는 도로 이동연소의 Tier별 식과 기본 배출계수, 외부 전기와 열(스팀) 사용의 간접배출 산정식과 국가 고유 계수를 읽고 전력 예제를 계산한다.","blocks":[{"no":"별표 6-5","label":"도로 이동연소: 차량 종류와 Tier별 식","doc":"mrv-full","pdfPage":62,"prose":["별표 6의 5는 이동연소(도로)다. 도로 차량의 연료 사용에서 나오는 모든 연소 배출을 포함하고, 건설기계와 농기계 같은 비도로 차량도 따로 구분하지 않고 이 장의 방법으로 센다. 보고 대상 배출시설은 승용·승합·화물·특수·이륜 자동차를 경형·소형·중형·대형으로 나눈 표와 비도로 및 기타 자동차다. 보고 대상 온실가스는 CO2가 Tier 1·2, CH4와 N2O가 Tier 1·2·3이다. 고정연소와 달리 CH4·N2O에 Tier 3이 있는 것은 메탄과 아산화질소가 차종과 연식에 따라 크게 달라지기 때문이다.","Tier 1 식은 배출량(tGHG) = 연료 사용량(KL) × 순발열량(MJ/L) × 배출계수(kgGHG/TJ) × 10⁻⁶이다. 고정연소와 달리 산화계수가 없다. Tier 2는 연료 종류별, 차종별, 제어기술별 연료사용량을 활동자료로 하고 국가 고유 계수를 적용한다. Tier 3은 차량의 주행거리(km)를 활동자료로 하고 차종·연료·배출제어기술별 고유 배출계수(g/km)를 곱하는데, CH4와 N2O에만 유효하다. 식은 배출량 = 주행거리 × 배출계수(g/km) × 10⁻⁶이다.","활동자료 관리기준은 Tier 1이 연료 종류별 사용량으로 측정불확도 ±7.5%, Tier 2가 ±5.0%, Tier 3이 주행거리로 ±2.5%다. 사업장 차량의 연료량은 주유 영수증으로 모이는데, 별표 8의 C-5(구매비용 ÷ 단가)와 C-6(주행거리 ÷ 연비)이 이 활동자료를 만드는 근사법이다. 별표 5에서 도로는 A·B그룹이 Tier 1이라 대부분의 제조업 사업장은 Tier 1로 센다."],"req":"도로 이동연소는 연료 사용량(KL) × 순발열량(MJ/L) × 배출계수 × 10⁻⁶으로 구하며 산화계수가 없고, CH4·N2O는 주행거리 × g/km 계수의 Tier 3도 가능하다.","terms":[{"t":"비도로 차량","d":"건설기계, 농기계처럼 도로를 달리지 않는 차량으로, 도로 이동연소와 같은 방법으로 센다.","en":"non-road vehicle"},{"t":"배출제어기술","d":"삼원촉매 같은 배기가스 저감 장치로, 연식에 따라 달라 CH4·N2O 계수를 가른다.","en":"emission control technology"}]},{"no":"별표 6-5-5","label":"도로 연료별 기본 배출계수 표","doc":"mrv-full","pdfPage":68,"prose":["Tier 1 배출계수는 표-4에 있다. 단위는 kg/TJ이고 출처는 2006 IPCC 가이드라인이다. 휘발유는 CO2 69,300, CH4 25, N2O 8.0이다. 경유는 CO2 74,100, CH4 3.9, N2O 3.9이고 LPG는 CO2 63,100, CH4 62, N2O 0.2다. CNG와 LNG는 CO2 56,100, CH4 92, N2O 3으로 같다. 경유의 CO2 계수는 고정연소 별표 10과 같지만 CH4·N2O는 고정연소(3, 0.6)와 도로(3.9, 3.9)가 다르다. 연소 조건이 다르기 때문이다.","Tier 2는 제15조제2항의 연료별·가스별 국가 고유 배출계수를 쓰고, 센터가 별도 계수를 공표하면 그 값을 적용한다. Tier 3은 표-5(CH4)와 표-6(N2O)의 국내 차종별 산출식을 쓴다. 산출식은 y = a × x^b 꼴로 y가 배출량(g/km), x가 차속(km/h)이며 차종, 연료, 연식 구분마다 다른 계수가 있다. 예를 들어 승용 휘발유 2009년 이후는 y = 0.0432x^-1.0208이다. 출처는 2001~2009년의 국내 수송부문 배출계수 연구들이다. 계수가 없는 차종은 차종과 연식을 고려해 유사 항목 값을 쓴다.","가상의 예로 경유 10 KL를 쓴 지게차·트럭을 Tier 1로 세어 보자. 별표 12 국가 고유 발열량의 경유 순발열량 35.2 TJ/1000m³(= 35.2 MJ/L)를 쓰면 10 KL × 35.2 MJ/L = 352 GJ = 0.352 TJ다. CO2 = 0.352 × 74,100 kg = 26.1 t, CH4 = 0.352 × 3.9 = 1.37 kg, N2O = 1.37 kg이다. GWP를 곱하면 CH4 0.03, N2O 0.43 tCO2-eq로 합계 약 26.5 tCO2-eq다. 경유 1 KL당 약 2.6톤이라는 감각을 기억해 두면 좋다."],"req":"도로 Tier 1 기본 배출계수(kg/TJ)는 휘발유 69,300·25·8.0, 경유 74,100·3.9·3.9, LPG 63,100·62·0.2, CNG·LNG 56,100·92·3이다.","fig":{"cap":"표-4 도로 연료별 기본 배출계수, kg/TJ (mrv-full.pdf 68쪽, 2006 IPCC)","head":["연료","CO2","CH4","N2O"],"rows":[["휘발유","69,300","25","8.0"],["경유","74,100","3.9","3.9"],["LPG","63,100","62","0.2"],["등유","71,900","-","-"],["윤활유","73,300","-","-"],["CNG","56,100","92","3"],["LNG","56,100","92","3"]]},"terms":[{"t":"차속 기반 산출식","d":"평균 차속(km/h)을 넣으면 g/km 배출계수가 나오는 y = a·x^b 꼴의 국내 연구식으로, 도로 Tier 3 CH4·N2O에 쓴다.","en":"speed-dependent emission factor equation"}]},{"no":"별표 6-39","label":"외부 전기 사용: 사업장 단위 Q × EF","doc":"mrv-full","pdfPage":316,"prose":["별표 6의 39는 외부에서 공급된 전기 사용이다. 개요는 구입전력이 대부분의 할당대상업체에서 큰 비중을 차지하는 배출원이자 감축 기회라고 적는다. 조직경계 안의 발전설비에서 만든 전기를 스스로 쓰는 경우는 간접배출에서 제외한다. 그 발전설비의 연료 연소가 이미 직접배출로 잡혔기 때문에 다시 세면 중복이다. 그림 46은 A사업장 발전설비의 직접배출, A사업장 자체 공급분의 간접배출 제외, B사업장에 공급한 분의 B 간접배출 보고라는 세 경로로 그린다.","산정·보고 범위는 배출시설 단위가 아니라 사업장 단위다. 다만 업무용 건물, 폐기물처리시설, 전기로는 전기사용량과 간접배출량을 구분해 세고, 전력량계가 붙은 배출시설은 시설별로 구분 보고할 수 있되 합계가 사업장 총사용량과 같아야 한다. 재생에너지 전력을 당해연도에 생산해 쓰면 별도 배출시설로 구분한다. 보고 대상 온실가스는 CO2, CH4, N2O 모두 Tier 1이고, 식은 배출량(tGHG) = 외부에서 공급받은 전력 사용량(MWh) × 전력 배출계수(tGHG/MWh)다.","활동자료는 Tier 2로 전력량계 등 법정계량기로 측정한 사업장별 총량이다. 배출계수는 Tier 2로 표-69의 국가 고유 전력배출계수를 쓴다. 2014~2016년 3개년 평균값으로 CO2 0.4567 tCO2/MWh, CH4 0.0036 kgCH4/MWh, N2O 0.0085 kgN2O/MWh이고 출처는 온실가스종합정보센터 2018년 국가 온실가스 배출계수다. 이후 한국전력거래소가 제공하는 계수를 센터가 확인해 지침에 수록하면 그 값을 적용한다. 신재생에너지법 제27조에 따른 태양광·풍력·수력 재생에너지 전력과 폐열이용 특례 시설의 열·공정폐열로 만든 전력을 쓰는 경우 전력배출계수는 '0'이다."],"req":"외부 전기 간접배출은 사업장 단위로 법정계량기 사용량(MWh)에 국가 고유 전력배출계수(CO2 0.4567 tCO2/MWh 등)를 곱해 구하고, 자가발전 자체 사용분은 제외한다.","fig":{"cap":"예제 계산: 구매 전력 10,000 MWh (사용량은 가상, 계수는 표-69, mrv-full.pdf 319쪽)","head":["가스","계수","배출량","GWP(SAR)","tCO2-eq"],"rows":[["CO2","0.4567 tCO2/MWh","4,567 t","1","4,567.0"],["CH4","0.0036 kgCH4/MWh","36 kg = 0.036 t","21","0.8"],["N2O","0.0085 kgN2O/MWh","85 kg = 0.085 t","310","26.4"],["합계","","","","약 4,594"]]},"ex":{"k":"현대차 보고서에서는","t":"158쪽 각주는 '전력의 경우 한국 배출권거래제(K-ETS) 기준 순발열량인 9.6 TJ/GWh를 적용'했다고 적었다. 이 값은 별표 12의 전기(소비기준) 9.6 TJ/GWh로, 명세서의 에너지사용량(TJ)을 만들 때 쓰는 환산계수다.","co":"hyundai","page":158},"terms":[{"t":"전력 배출계수","d":"전기 1 MWh를 쓸 때 발전 과정에서 나온 것으로 보는 온실가스 양으로, 국가 전력망 평균값이다.","en":"grid electricity emission factor"},{"t":"법정계량기","d":"계량에 관한 법률에 따라 상거래·증명에 쓰는 계량기로, 한전 전력량계가 대표적이다(별표 8의 WH).","en":"legal measuring instrument"}]},{"no":"별표 6-40","label":"외부 열(스팀) 사용: 공급자 계수가 먼저","doc":"mrv-full","pdfPage":320,"prose":["별표 6의 40은 외부에서 공급된 열(스팀)의 사용이다. 조직경계 안에서 생산한 열을 스스로 쓰면 간접배출에서 제외한다. 열 사용 배출량은 열 공급자로부터 배출계수를 받아 쓰고, 받지 못하면 근거자료를 받아 별표 17에 따라 개발할 수 있으며, 공급자가 계수도 근거도 줄 수 없는 경우에만 센터가 지침에 수록한 계수를 쓴다. 제19조는 열 공급자인 할당대상업체에게 별표 17로 계수를 개발해 사용자에게 제공할 의무를 지우고, 못 하면 활동자료·배출량·열 생산량을 제공하라고 한다.","산정·보고 범위는 전기와 같이 사업장 단위다. 보고 대상 온실가스는 CO2·CH4·N2O 모두 Tier 1이고, 식은 배출량(tGHG) = 외부에서 공급받은 열 사용량(TJ) × 열 배출계수(tGHG/TJ)다. 활동자료는 Tier 2로 측정불확도 ±5.0% 이내의 배출시설별 열 공급량 또는 사용량이다. 배출계수는 Tier 2가 표-70의 센터 수록값, Tier 3이 열 공급자가 개발해 제공한 값이다. 별표 5에서 외부 열의 간접배출계수가 모든 규모에서 Tier 3인 이유가 여기 있다. 공급자 계수가 원칙이고 표-70은 예외다.","표-70의 열(스팀) 배출계수는 2013년 국가 온실가스 배출계수 기준으로 열전용 시설이 CO2 56,373 kgCO2/TJ, CH4 1.278 kgCH4/TJ, N2O 0.166 kgN2O/TJ로 합계 56,452 kgCO2-eq/TJ, 열병합이 60,760·2.053·0.549로 60,974, 평균이 59,510·1.832·0.440으로 59,685다. 열전용과 열병합을 구분할 수 없으면 평균값을 쓰고, 벤치마크 할당을 위한 사업장 내·업체 내 폐열 이동 보고에도 평균값을 쓸 수 있다. 표의 단위는 kg/TJ이므로 식의 tGHG/TJ로 바꾸려면 1,000으로 나눈다. 가상의 사용량으로 스팀 100 TJ를 평균 계수로 세면 CO2 5,951 t, 합계 약 5,969 tCO2-eq다."],"req":"외부 열 간접배출은 열 사용량(TJ)에 공급자가 제공한 배출계수를 곱해 구하고, 공급자 계수가 없을 때만 표-70(평균 59,685 kgCO2-eq/TJ 등)을 쓴다.","fig":{"cap":"표-70 열(스팀) 배출계수 (mrv-full.pdf 322쪽, 2013년 국가 배출계수)","head":["시설 종류","CO2 kgCO2/TJ","CH4 kgCH4/TJ","N2O kgN2O/TJ","합계 kgCO2-eq/TJ"],"rows":[["열전용","56,373","1.278","0.166","56,452"],["열병합","60,760","2.053","0.549","60,974"],["평균","59,510","1.832","0.440","59,685"]]},"terms":[{"t":"열병합 발전","d":"연료를 태워 전기와 열(스팀·온수)을 함께 만드는 설비로, 열에 배출을 얼마나 나눌지 별표 17의 식으로 정한다.","en":"combined heat and power (CHP)"},{"t":"벤치마크 할당","d":"제품 단위당 배출량 기준으로 배출권을 할당하는 방식으로, 폐열 이동 보고에 평균 열 계수를 허용한다.","en":"benchmark allocation"}]}],"write":{"q":"사업장이 외부에서 전기 10,000 MWh를 샀다. 명세서의 간접배출 CO2는 어떻게 구하나?","must":[["사용량","MWh","전력량"],["전력 배출계수","배출계수","0.4567"],["곱"]],"bonus":[["사업장 단위"],["4,567"]],"wrong":["발열량","산화계수","자가발전 포함"],"model":"법정계량기로 잰 사업장 전력 사용량 10,000 MWh에 국가 고유 전력 배출계수 0.4567 tCO2/MWh를 곱해 4,567 tCO2를 구한다.","src":"별표 6의 39, 표-69"},"check":{"q":"공장 안 열병합 설비에서 만든 스팀을 그 공장이 직접 쓸 때 명세서 처리로 맞는 것은?","options":["간접배출로 표-70 평균 계수를 곱해 더한다","간접배출에서 제외한다(연료 연소가 이미 직접배출로 잡힘)","직접배출에서 뺀다"],"ans":1,"why":"별표 6의 39·40 개요는 조직경계 안에서 생산한 전기·열을 자체 사용하는 경우 간접배출 산정에서 제외한다고 한다. 연료 연소가 이미 직접배출로 산정되어 다시 세면 중복이기 때문이다."},"summary":["도로 이동연소는 연료 사용량 × 순발열량 × 배출계수 × 10⁻⁶으로 산화계수 없이 구하고, Tier 1 계수는 경유 CO2 74,100 kg/TJ 등 표-4를 쓴다.","외부 전기는 사업장 단위로 법정계량기 사용량(MWh) × 전력배출계수(CO2 0.4567 tCO2/MWh, 2014~2016 평균)로 구하며 자가발전 자체 사용과 재생에너지 전력은 계수 0이다.","외부 열은 사용량(TJ) × 공급자 제공 계수가 원칙이고, 없을 때만 표-70(열전용 56,452·열병합 60,974·평균 59,685 kgCO2-eq/TJ)을 쓴다."]},{"id":"m-7","title":"산정식 읽기 ③ 공정배출 한 가지 깊게 (시멘트)","range":"별표 6의 8 (시멘트 생산)","pages":[82,90],"min":16,"intro":"연료를 태우지 않아도 원료가 반응하며 CO2가 나오는 것이 공정배출이다. 이 회차에서는 국내 공정배출의 대표인 시멘트 생산을 별표 6의 8에서 읽는다. 클링커 생산량에 계수를 곱하는 Tier 1·2 식, 킬른먼지 보정, CaO·MgO 분석으로 계수를 만드는 Tier 2·3 식을 익히고 예제를 계산한다.","blocks":[{"no":"별표 6-8","label":"석회석이 구워지며 CO2가 나온다","doc":"mrv-full","pdfPage":82,"prose":["별표 6의 8 개요는 시멘트 공정의 온실가스가 클링커를 만드는 소성 공정에서 탄산칼슘의 탈탄산 반응으로 나온다고 설명한다. 반응식은 CaCO3 + 열 → CaO + CO2다. 석회석(CaCO3)을 1,400℃ 넘게 구우면 생석회(CaO)가 되고 나머지가 CO2로 날아간다. 그래서 배출량은 소성시설(kiln)의 생석회 생성량, 연료 사용량, 폐기물 소각량과 점토 같은 부원료 사용량에 따라 달라진다. 연료 가운데 목재 같은 바이오매스는 제외하지만 합성수지와 폐타이어 같은 폐연료는 포함한다.","개요는 CKD도 설명한다. Cement Kiln Dust는 소성로에서 나오는 비산먼지로, 회수되어 다시 소성로에 들어간다. 회수되지 못하고 빠져나간 CKD 속 탄산염은 탈탄산 반응에 들어가지 않았으므로 보정이 필요하다. CKD가 완전히 소성되거나 전부 회수되면 보정이 필요 없지만, 소성되지 못한 CKD를 무시하면 배출량이 과다 산정된다. 반대로 수입 클링커를 분쇄만 하는 공장은 소성 공정 CO2가 0이고, 벽돌용 시멘트에 석회석을 섞는 것은 석회 생산에서 이미 센 것으로 보아 추가 배출이 없다.","보고 대상 배출시설은 소성시설(kiln) 하나다. 원형·각형·통형, 연속식의 수직형·회전형·링형·터널형 등 종류가 많지만 대부분 회전형을 쓴다고 설명한다. 보고 대상 온실가스 표는 CO2만 Tier 1·2·3·4이고 CH4와 N2O는 '-'다. 연료 연소에서 나오는 CH4·N2O는 별도의 고정연소 항목에서 세고, 공정배출 자체는 CO2만 센다는 뜻이다. 별표 5에서 시멘트 생산은 A·B·C그룹이 산정방법론·활동자료·배출계수 모두 1·2·3이다."],"req":"시멘트 공정배출은 소성시설에서 CaCO3가 CaO와 CO2로 분해되며 나오는 CO2이며, 소성되지 않고 빠져나간 킬른먼지(CKD)를 보정해야 한다.","quote":"CKD가 완전히 소성되거나 모두가 킬른으로 회수된다면 CKD에 의한 보정은 필요 없으나 소성되지 못한 CKD를 고려하지 않을 경우 배출량이 과다 산정될 것이다.","terms":[{"t":"클링커","d":"석회석과 점토를 소성로에서 구워 만든 시멘트의 중간 제품으로, 여기에 석고를 섞어 갈면 시멘트가 된다.","en":"clinker"},{"t":"시멘트 킬른먼지(CKD)","d":"소성로에서 날리는 먼지로, 회수되지 않은 양은 소성되지 않은 탄산염을 포함하므로 배출량 계산에서 보정한다.","en":"cement kiln dust"},{"t":"탈탄산 반응","d":"탄산염(CaCO3, MgCO3)이 열을 받아 산화물과 CO2로 나뉘는 반응이다.","en":"calcination"}]},{"no":"별표 6-8-4","label":"Tier 1~2 식과 Tier 3 식","doc":"mrv-full","pdfPage":84,"prose":["Tier 1~2의 식은 배출량(tCO2) = (EF_i + EF_toc) × (Q_i + Q_CKD × F_CKD)다. Q_i는 클링커 생산량(ton), EF_i는 클링커 1톤당 CO2 배출계수(tCO2/t-clinker)다. EF_toc는 투입원료(탄산염, 제강슬래그 등) 가운데 탄산염이 아닌 기타 탄소 성분에서 나오는 CO2 계수로 기본값 0.010 tCO2/t-clinker를 쓴다. Q_CKD는 킬른에서 반출된 CKD의 양(ton), F_CKD는 유실된 CKD의 하소율(0~1)이다. 괄호 안은 '클링커가 된 원료 + 클링커가 되지 못하고 빠져나간 원료'를 클링커 환산 톤으로 더한 것이고, 괄호 밖은 톤당 계수다.","Tier 3 식은 항을 셋으로 나눈다. 배출량 = (Q_i × EF_i) + (Q_CKD × EF_CKD) + (Q_toc × EF_toc)다. 클링커 생산량에 클링커 계수를, CKD 반출량에 CKD 고유 계수(tCO2/t-CKD)를, 원료 투입량(ton)에 기타 탄소 계수를 각각 곱해 더한다. 여기서 EF_toc 기본값은 원료 톤당 0.0073 tCO2/t-원료로 Tier 1~2의 클링커 톤당 0.010과 다른 값이다. Tier 4는 연속측정이다. 활동자료 관리기준은 클링커 생산량 등의 측정불확도가 Tier 1 ±7.5%, Tier 2 ±5.0%, Tier 3 ±2.5% 이내이고, Tier 3은 원료 투입량(toc)도 포함한다.","식의 구조를 말로 옮기면 이렇다. 시멘트 공장의 CO2는 '얼마나 많은 탄산염을 구웠나'에 비례한다. 구운 탄산염의 양은 공장 밖으로 나간 클링커로 대부분 설명되지만, 먼지로 날아간 탄산염과 원료 속 유기탄소도 조금 보탠다. Tier가 올라갈수록 이 세 부분을 각각 따로 재서 각각의 계수를 곱한다."],"req":"Tier 1~2는 (클링커 계수 + 0.010) × (클링커 생산량 + CKD 반출량 × 하소율), Tier 3은 클링커·CKD·원료 투입량에 각각의 계수를 곱해 더한다.","fig":{"cap":"시멘트 산정식의 기호 (mrv-full.pdf 84~85쪽)","head":["기호","뜻","단위·기본값"],"rows":[["Q_i","클링커 생산량","ton"],["EF_i","클링커 톤당 CO2 배출계수","tCO2/t-clinker"],["EF_toc(Tier 1~2)","원료 중 비탄산염 탄소 성분의 CO2 계수","기본값 0.010 tCO2/t-clinker"],["Q_CKD","킬른에서 반출된 CKD 양","ton"],["F_CKD","유실 CKD의 하소율","0~1, 측정값 없으면 1.0"],["EF_CKD(Tier 3)","CKD 배출계수","tCO2/t-CKD"],["Q_toc, EF_toc(Tier 3)","원료 투입량, 비탄산염 탄소 계수","ton, 기본값 0.0073 tCO2/t-원료"]]},"terms":[{"t":"하소율","d":"CKD 속 탄산염 가운데 이미 소성되어 CO2를 내보낸 비율로, 0에서 1 사이의 값이다.","en":"degree of calcination"}]},{"no":"별표 6-8-5","label":"배출계수: 0.510에서 CaO·MgO 분석값으로","doc":"mrv-full","pdfPage":86,"prose":["클링커 배출계수의 관리기준은 Tier별로 다르다. Tier 1은 IPCC 가이드라인 기본 배출계수 0.510 tCO2/t-clinker를 쓴다. CKD 하소율 F_CKD는 공장 내 측정값이 있으면 쓰고 없으면 1.0(100% 하소 가정)을 쓴다. Tier 2는 제15조제2항의 클링커 톤당 국가 고유 배출계수를 쓰되, 그 값이 없으면 사업자가 제16조에 따라 클링커의 CaO와 MgO 성분을 분석해 EF_i = F_CaO × 0.785 + F_MgO × 1.092로 개발한다. F_CaO와 F_MgO는 생산된 클링커 중 CaO와 MgO의 질량분율(0~1)이다.","0.785와 1.092는 화학량론에서 나온다. CaCO3 1몰이 분해되면 CaO 1몰과 CO2 1몰이 나오므로 CaO 56.08g당 CO2 44.01g, 비율 0.785다. MgO는 40.30g당 44.01g이라 1.092다. 즉 클링커에 CaO가 65% 들어 있으면 석회석에서 온 CO2가 0.65 × 0.785 = 0.510톤이고, 이것이 Tier 1 기본값 0.510의 뿌리다. Tier 3은 같은 식에서 소성되지 않고 남은 CaO·MgO와 비탄산염 원료에서 온 CaO·MgO를 빼 준다. EF_i = (Cli_CaO − Cli_nCaO) × 0.785 + (Cli_MgO − Cli_nMgO) × 1.092이고, 측정값이 없으면 n 항은 0이다. CKD 계수 EF_CKD도 같은 꼴로 CKD 속 CaO·MgO 분율로 만든다.","폐기물 연료도 다룬다. 소성로에서 폐타이어나 폐플라스틱을 태운 배출은 별표 6의 고정연소(고체연료)에서 세는데, 이때 시멘트 업종에서 쓰는 표-9의 폐기물 연료 기본 CO2 배출계수(kgCO2/TJ)를 쓸 수 있다. 폐유 74,000, 폐타이어·폐합성고무 85,000, 폐플라스틱·폐합성수지 75,000, 기타 화석연료 기원 폐기물 80,000, 폐용제 74,000, 폐목재·톱밥 75,000, 혼합된 산업폐기물 83,000이며 출처는 WBCSD 시멘트 지속가능성 이니셔티브(CSI)다. 국가 고유 계수가 고시되지 않으면 Tier 2에서도 이 값을 쓴다."],"req":"클링커 배출계수는 Tier 1이 0.510 tCO2/t-clinker, Tier 2가 국가 고유값 또는 CaO×0.785 + MgO×1.092, Tier 3이 미소성·비탄산염 CaO·MgO를 뺀 분석값이다.","fig":{"cap":"예제 계산: 클링커 1,000,000 t, CKD 반출 10,000 t, Tier 1 (생산량은 가상, 계수는 원문 값, mrv-full.pdf 84·86쪽)","head":["항목","값"],"rows":[["EF_i (Tier 1)","0.510 tCO2/t-clinker"],["EF_toc","0.010 tCO2/t-clinker"],["F_CKD","측정값 없음 → 1.0"],["괄호 안","1,000,000 + 10,000 × 1.0 = 1,010,000 t"],["배출량","(0.510 + 0.010) × 1,010,000 = 525,200 tCO2"]]},"terms":[{"t":"0.785 / 1.092","d":"CaO와 MgO 1톤이 만들어질 때 나온 CO2 톤수로, 분자량 비(44.01/56.08, 44.01/40.30)에서 나온 값이다.","en":"stoichiometric CO2 ratios"},{"t":"비탄산염 원료","d":"제강슬래그, 비산재처럼 탄산염 형태가 아닌 CaO·MgO를 가진 원료로, 소성해도 CO2가 나오지 않아 Tier 3에서 빼 준다.","en":"non-carbonate raw material"}]}],"write":{"q":"시멘트 공장의 소성 공정 CO2를 Tier 1로 구하는 식을 말로 쓰시오.","must":[["클링커","클링커 생산량"],["0.510","배출계수"],["CKD","킬른먼지","먼지"]],"bonus":[["0.010","기타 탄소"],["하소율","1.0"]],"wrong":["연료 사용량","발열량","전력"],"model":"클링커 생산량에 반출된 CKD 양 × 하소율을 더한 뒤, 클링커 배출계수 0.510에 기타 탄소 계수 0.010을 더한 값을 곱한다.","src":"별표 6의 8, 4-① 및 5-②"},"check":{"q":"클링커 배출계수를 CaO·MgO 분석으로 만들 때 쓰는 계수 0.785의 뜻은?","options":["CaO 1톤이 생길 때 나온 CO2 톤수(44.01/56.08)","클링커 중 CaO 비율의 기본값","CKD 하소율 기본값"],"ans":0,"why":"CaCO3가 분해되면 CaO와 CO2가 1:1 몰로 나오므로 CaO 질량당 CO2 질량은 44.01/56.08 = 0.785다. MgO는 44.01/40.30 = 1.092다."},"summary":["시멘트 공정배출은 소성시설에서 CaCO3 → CaO + CO2 반응으로 나오는 CO2만 세고, 연료 연소는 고정연소 항목에서 따로 센다.","Tier 1~2 식은 (EF_i + 0.010) × (클링커 생산량 + CKD 반출량 × 하소율)이고, Tier 1 EF_i는 0.510 tCO2/t-clinker다.","Tier 2·3 계수는 클링커의 CaO × 0.785 + MgO × 1.092로 만들며, Tier 3은 미소성·비탄산염분을 빼고 CKD와 원료 투입량 항을 따로 둔다."]},{"id":"m-8","title":"활동자료 수집과 모니터링 유형","range":"제12조, 별표 8","pages":[326,339],"min":17,"intro":"배출량의 정확도는 결국 연료와 전기를 '얼마나 썼는지'를 어떻게 재느냐에 달려 있다. 이 회차에서는 별표 8의 측정기기 기호(WH, FL), 모니터링 유형 A·B·C·D와 그 세부 유형, 결측 보정과 차량 연료 추정 같은 근사법을 읽는다.","blocks":[{"no":"별표 8-1","label":"가장 정확한 유형을 고르고, 지점을 맞춘다","doc":"mrv-full","pdfPage":326,"prose":["제12조는 활동자료 수집방법론을 별표 8에 맡긴다. 별표 8의 1은 결정 원칙이다. 할당대상업체는 배출시설별로 모니터링 유형을 타당하게 정해야 하고, 측정지점과 수집방법은 사업장과 일치해야 한다. 판매·구매되는 부생가스, 부생연료, 스팀의 수집방법도 산정 계획에 넣는다. 활동자료의 오류를 최소화할 수 있어야 하며, 적용할 수 있는 유형 가운데 가장 정확성이 높은 유형을 골라야 한다. 두 가지 이상 유형을 섞어 쓰면 모니터링 계획에 도식화하고 구체적 방법을 적는다.","2는 측정기기의 기호다. 표-1에서 WH는 상거래나 증명에 쓰기 위해 계량에 관한 법률 제2조에 따른 법정계량기로, 가스미터, 오일미터, 주유기, LPG 미터, 눈새김탱크, 적산열량계, 전력량계가 예다. FL(실선)은 할당대상업체가 스스로 설치한 계량기로서 국가표준기본법 제14조에 따른 시험·교정·검사기관에서 주기적 정도검사를 받는 측정기기이고, FL(점선)은 자체 설치했지만 주기적 정도검사를 하지 않는 측정기기다. 비고는 정도검사를 받지 않은 기기는 그 정도검사 일정을 산정 계획에 포함하라고 한다.","3은 정도검사 주기다. 자체 설치 기기의 정도검사 주기는 계량에 관한 법률 시행령 제21조의 검정 유효기간과 환경분야 시험·검사법 제11조의 정도검사 주기를 준용할 수 있고, 정기보수 기간 등을 고려해 주기적 검사일정을 세운다. 쉽게 말해 한전이나 도시가스 회사의 계량기는 WH, 공장이 공정별로 단 유량계 가운데 교정을 받는 것은 FL, 안 받는 것은 점선 FL이다. 이 세 기호의 조합이 다음 유형을 결정한다."],"req":"배출시설별로 가장 정확한 모니터링 유형을 고르고, 법정계량기(WH), 교정받는 자체 계량기(FL), 교정받지 않는 자체 계량기(점선 FL)를 구분해 산정 계획에 적는다.","fig":{"cap":"표-1 측정기기 기호 (mrv-full.pdf 327쪽)","head":["기호","뜻","예"],"rows":[["WH","상거래·증명용 법정계량기","가스미터, 주유기, 전력량계, 적산열량계"],["FL (실선)","자체 설치, 주기적 정도검사 받음","교정받는 공정 유량계"],["FL (점선)","자체 설치, 정도검사 받지 않음","교정 이력 없는 내부 계량기"]]},"terms":[{"t":"정도검사","d":"측정기기가 정해진 오차 안에서 재고 있는지 시험·교정기관이 주기적으로 확인하는 검사다.","en":"accuracy inspection / calibration"},{"t":"모니터링 유형","d":"활동자료를 어떤 계량기와 자료로 결정하는지 나눈 분류로 A(구매량), B(직접계량), C(근사법), D(기타)가 있다.","en":"monitoring type"}]},{"no":"별표 8-4","label":"A유형: 구매량 기반 (A-1~A-4)","doc":"mrv-full","pdfPage":328,"prose":["표-2는 모니터링 유형 네 가지를 정리한다. A유형은 구매량 기반이다. 연료·원료 공급자가 상거래 목적으로 설치·관리하는 측정기기(WH)를 이용하거나, WH와 주기적 정도검사를 받는 내부 측정기기(FL)를 함께 써서 활동자료를 정한다. B유형은 구매량 기준과 무관하게 배출시설별로 교정된 자체 측정기기(FL)로 직접 계량하는 방법이다. C유형은 근사법으로, 메인 측정기기(WH)의 활동자료를 타당한 배분방식으로 나누거나 구매단가, 설계 사양 등 정부가 인정하는 방법으로 정한다. D유형은 그 밖의 방법이다.","A-1은 WH 하나로 단일 배출시설에 공급하는 경우다. 전기, 열(증기), 도시가스를 사거나 화석연료를 사서 한 시설에 넣을 때 쓰며, 관련 자료는 한국전력의 전력요금청구서, 열에너지 공급자의 요금청구서와 사용 증빙문서, 도시가스 요금청구서, 연료 구입량이 적힌 청구서나 Invoice다. A-2는 WH 뒤에 여러 FL이 병렬로 달린 경우다. 배출시설별 교정 계량기 값을 쓰는 것이 원칙이되, 전체 합계를 구매거래용 WH 값과 교차 분석해 관리한다.","A-3은 저장탱크가 있는 경우다. 연료를 사서 탱크에 일부 저장하거나 일부를 팔거나 다른 곳으로 보낼 때, 구매량·재고량·판매량의 물질수지로 활동자료를 정한다. 식은 활동자료 = 신규구매량 + (회계연도 시작일 재고량 − 차기연도 시작일 재고량) − 기타용도(판매·이송 등) 사용량이다. 재고는 정도관리되는 모니터링 기기로 잰 탱크 수위 자료로 잡는다. A-4는 WH와 FL을 쓰면서 연료 일부를 파이프로 외부 사업장이나 배출시설에 계속 공급하는 경우로, 외부 공급 측정기기는 정도검사를 받는 기기여야 하고 밖으로 판 양을 빼서 활동자료를 정한다."],"req":"A유형은 공급자 법정계량기(WH) 기반으로, A-1 단일 시설, A-2 WH+FL 병렬 교차확인, A-3 재고 물질수지, A-4 외부 공급분 차감으로 나뉜다.","fig":{"cap":"A유형 세부 (mrv-full.pdf 328~332쪽)","head":["유형","상황","활동자료 결정"],"rows":[["A-1","WH → 배출시설 하나","요금청구서, Invoice"],["A-2","WH → FL 여러 개 → 시설들","FL 값 사용, 합계를 WH와 교차 분석"],["A-3","WH → 저장탱크(FL) → 시설, 일부 판매","신규구매량 + (기초재고 − 기말재고) − 기타용도 사용량"],["A-4","WH → FL 시설, FL로 외부 사업장 공급","외부 공급·판매량을 빼고 결정"]]},"terms":[{"t":"물질수지","d":"들어온 양 = 나간 양 + 남은 양이라는 관계로 측정하지 못한 양을 계산하는 방법이다.","en":"mass balance"},{"t":"교차 분석","d":"두 계량기 값을 서로 견주어 큰 차이가 없는지 확인하는 일이다.","en":"cross-check"}]},{"no":"별표 8-5","label":"B유형 직접계량과 C유형 근사법","doc":"mrv-full","pdfPage":332,"prose":["B유형은 배출시설별로 정도검사를 받는 내부 측정기기(FL)가 있을 때 그 기기로 활동자료를 정하는 방법이다. 구매 기준처럼 비교·확인할 기준 활동량 없이 내부 교정 기기만으로 모니터링한다. 관련 자료는 내부 모니터링 기기의 데이터 기록일지, 곧 연료 종류와 사용량 등 기기 운용 상세를 적은 log sheet다. 자체 발전소에서 만든 스팀을 공정에 보내는 것처럼 구매 거래가 없는 흐름에 쓰인다.","6의 C유형은 A나 B를 적용할 수 없을 때의 근사법이다. 근사법을 쓸 수밖에 없는 합당한 이유와 배출시설 단위 측정기기 신규설치·정도검사 일정을 산정 계획에 담아야 한다. 적용 대상은 식당 LPG, 비상발전기, 소방펌프 같은 저배출원, 개별 차량별로 세는 이동연소배출원, 수급계약서 근거로 시설별 활동자료를 나누는 경우, 그 밖에 모니터링이 불가능하다고 환경부장관이 인정하는 경우다. C-1은 정도검사를 받지 않은 내부 기기 값으로 WH 총량을 배분한다. 예시가 있다. 시멘트회사가 중유 1,000톤을 사서 소성로와 보일러에 썼는데 정도검사를 안 받은 기기가 800톤과 400톤을 가리켰다면, 총량 1,000톤을 800:400으로 나눠 667톤과 333톤으로 정한다.","C-2는 기기가 없거나 일부에만 있을 때 운전기록일지, 물 사용량, 근무일지, 생산일지 같은 간접자료로 배분하는 방법이고, C-3은 WH, FL, 점선 FL이 섞여 있거나 기기가 없을 때 쓴다. C-4는 결측 보정이다. 기기 고장이나 시험 불합격으로 자료가 빠지면 '연료 사용량'과 상관관계가 가장 높은 자료로 추정하는데, 식은 결측기간 사용량 = (정상기간 사용량 ÷ 정상기간 생산량) × 결측기간 총생산량이다. C-5는 차량 연료를 주유 영수증의 구매비용 ÷ 연료별 구매단가로, C-6은 주행거리(km) ÷ 연비(km/L)로 구하는 방법이다. D유형은 A~C 외의 방법으로 산정 계획에 세부사항을 적어야 한다."],"req":"B유형은 교정된 자체 계량기로 직접 계량하고, C유형은 A·B가 불가능할 때 WH 총량 배분, 간접자료 배분, 생산량 비례 결측 보정, 구매비용÷단가, 주행거리÷연비 같은 근사법을 사유와 함께 쓴다.","fig":{"cap":"C유형 세부와 식 (mrv-full.pdf 334~338쪽)","head":["유형","방법"],"rows":[["C-1","정도검사 안 받은 내부 기기 값 비율로 WH 총량 배분 (예: 1,000t → 667t / 333t)"],["C-2","운전기록·근무일지·생산일지 등 간접자료로 배분"],["C-3","WH·FL·점선 FL 혼재 또는 기기 없음"],["C-4","결측기간 사용량 = 정상기간 사용량 ÷ 정상기간 생산량 × 결측기간 생산량"],["C-5","차량 연료 = Σ 연료 구매비용 ÷ 구매단가"],["C-6","차량 연료 = Σ 주행거리(km) ÷ 연비(km/L)"]]},"terms":[{"t":"결측","d":"측정기기 고장 등으로 일정 기간 자료가 비는 것으로, 생산량 같은 대리 자료로 추정해 채운다.","en":"missing data"},{"t":"근사법","d":"직접 재지 못한 양을 비율 배분이나 대리 자료로 어림잡아 정하는 방법이다.","en":"approximation method"}]}],"write":{"q":"공장 안 두 보일러가 한 도시가스 계량기(WH) 뒤에 달려 있고, 보일러마다 교정받는 유량계(FL)가 있다. 어떤 모니터링 유형이고 활동자료는 어떻게 정하나?","must":[["A-2","A유형","A-2 유형"],["FL","유량계","자체 측정기기"],["교차","합계","WH"]],"bonus":[["정도검사","교정"],["청구서"]],"wrong":["C-1","근사법","생산량 비례"],"model":"WH와 교정된 FL이 함께 있는 A-2 유형이며, 보일러별 FL 값을 활동자료로 쓰되 FL 합계를 WH 청구서 값과 교차 분석해 관리한다.","src":"별표 8의 4, 모니터링 유형 A-2"},"check":{"q":"유량계가 석 달 고장나 자료가 빠졌다. 별표 8이 제시하는 보정 방법은?","options":["빠진 기간은 0으로 보고한다","정상기간의 연료 사용량 ÷ 생산량 비율에 결측기간 생산량을 곱한다","전년도 같은 기간 값을 그대로 쓴다"],"ans":1,"why":"C-4 유형은 연료 사용량과 상관관계가 가장 높은 자료(제품생산량)로 추정하며, 식은 결측기간 사용량 = 정상기간 사용량 ÷ 정상기간 생산량 × 결측기간 총생산량이다."},"summary":["활동자료는 배출시설별로 가장 정확한 모니터링 유형을 고르고, 법정계량기 WH와 자체 계량기 FL(교정 여부로 실선·점선)을 구분해 산정 계획에 적는다.","A유형은 구매량 기반(A-1 단일, A-2 병렬 교차확인, A-3 재고 물질수지, A-4 외부 공급 차감), B유형은 교정된 자체 계량기 직접계량이다.","C유형 근사법은 저배출원·차량 등에 사유를 적고 쓰며, WH 총량 배분(C-1), 간접자료 배분(C-2), 생산량 비례 결측 보정(C-4), 구매비용÷단가(C-5), 주행거리÷연비(C-6)가 있다."]},{"id":"m-9","title":"불확도와 데이터 품질","range":"제13~14조, 별표 9","pages":[340,347],"min":16,"intro":"Tier 표에 적힌 ±7.5%, ±5.0%, ±2.5%는 '불확도'다. 이 회차에서는 별표 9를 읽으며 불확도가 무엇이고 어떤 종류가 있는지, 할당대상업체는 어디까지 계산해 보고해야 하는지, 표준불확도에서 상대불확도까지 가는 다섯 개의 식을 숫자 예와 함께 익힌다.","blocks":[{"no":"제13조","label":"불확도 관리기준을 지키고, 방법은 별표 9로","doc":"mrv","pdfPage":8,"prose":["제13조제1항은 별표 5의 최소 Tier와 별표 6의 산정방법론에 적힌 불확도 관리기준을 지키라고 한다. 앞 회차에서 본 활동자료의 ±7.5·5.0·2.5%가 바로 그것이다. 제2항은 불확도 산정의 세부 방법을 별표 9에 맡긴다. 제2조제19호는 불확도를 '산정결과와 관련하여 정량화된 양을 합리적으로 추정한 값의 분산특성을 나타내는 정도'로 정의한다. 쉽게 말해 재거나 계산한 값이 참값에서 얼마나 흩어져 있을 수 있는지를 숫자로 나타낸 것이다.","별표 9의 1-1)은 불확도의 개념을 설명한다. 계측기 자체의 불확실성, 측정 당시 환경이 표준 조건과 다른 데서 오는 불확실성, 산정식의 불확실성 등 여러 요인이 추정치에 영향을 준다. 그래서 추정치는 참값과 편차(bias)를 보이고, 반복 측정하면 평균을 중심으로 무작위(random)로 흩어진다. 이 편차와 분산을 정량화한 것이 불확도다. 1-2)는 불확도를 관리하는 목적이 배출량의 신뢰도 관리와 방법 변경의 타당성 입증이라고 하고, 배출량 불확도는 활동자료와 배출계수의 불확도를 합성해 정한다고 한다.","제14조는 앞서 본 중소기업 특례다. 중소기업인 할당대상업체가 최소 Tier, 매개변수별 관리기준, 활동자료 불확도 기준을 불가피하게 못 지키면 최초 지정 후 2회 이내의 명세서에서 적용하지 않을 수 있고, 지키기 위한 조치와 일정을 산정 계획에 담아야 한다. 불확도 기준이 계량기 교체 같은 투자를 요구하기 때문에 시간을 주는 것이다."],"req":"별표 5·6의 불확도 관리기준(활동자료 ±7.5·5.0·2.5%)을 지키고, 불확도는 별표 9의 방법으로 산정하며 중소기업은 2회까지 유예할 수 있다.","terms":[{"t":"불확도","d":"측정하거나 계산한 값이 참값에서 얼마나 흩어져 있을 수 있는지를 ± 비율로 나타낸 정도다.","en":"uncertainty"},{"t":"편차(bias)와 분산","d":"편차는 참값에서 한쪽으로 치우친 정도, 분산은 반복 측정값이 평균 주위로 흩어진 정도다.","en":"bias and dispersion"}]},{"no":"별표 9-1","label":"불확도의 네 종류와 보고할 값","doc":"mrv-full","pdfPage":340,"prose":["별표 9의 1-3)은 불확도를 표준불확도, 합성불확도, 확장불확도, 상대불확도로 나눈다. 표준불확도는 반복 측정값의 표준오차다. 합성불확도는 여러 불확도 요인이 있을 때 각 요인의 표준불확도를 합성한 값이다. 확장불확도는 합성불확도에 신뢰구간을 특정하는 포함인자를 곱한 값으로, 포함인자는 어떤 신뢰구간을 택하느냐에 따라 달라진다. 상대불확도는 불확도를 최적 추정값(평균)으로 나누고 100을 곱해 백분율로 나타낸 것으로, 여러 배출원을 비교할 때 많이 쓴다.","온실가스 배출량 불확도 산정에서는 일반적으로 t-분포에서 95% 신뢰수준의 포함인자를 합성불확도에 곱한 확장불확도를 쓴다. 그리고 할당대상업체가 보고해야 할 불확도는 확장불확도를 평균으로 나누고 100을 곱한 상대불확도(%)다. 즉 Tier 표의 ±7.5%는 '95% 신뢰수준에서 참값이 측정값의 ±7.5% 안에 있다'는 뜻이다.","2의 산정절차는 표-1의 4단계다. 1단계 사전검토는 매개변수를 분류하고 불확도 평가 대상과 체계를 정한다. 2단계는 활동자료·배출계수 등 매개변수의 확장불확도 또는 상대불확도를 구한다. 3단계는 배출시설별 배출량의 상대불확도, 4단계는 배출시설별 불확도를 합성해 사업장 또는 업체의 총배출량 상대불확도를 구한다. 할당대상업체는 2단계까지의 불확도를 산정해 보고하고, 측정을 외부 기관에 맡기면 성적서에 불확도가 함께 오므로 2단계를 생략할 수 있다. 우선순위도 있다. ① 시험성적서상의 불확도, ② 측정기 성적서, 제작사 규격, 핸드북의 오차율 같은 입증된 자료를 √3으로 나눈 값, ③ 이 고시의 불확도인 Tier 1 7.5%, Tier 2 5%, Tier 3 2.5% 순이다."],"req":"보고할 불확도는 95% 신뢰수준 확장불확도를 평균으로 나눈 상대불확도(%)이며, 할당대상업체는 4단계 중 매개변수 단계(2단계)까지 산정해 보고한다.","fig":{"cap":"불확도 값의 우선순위 (mrv-full.pdf 341쪽)","head":["순위","출처"],"rows":[["①","시험성적서상의 불확도"],["②","측정기 성적서·제작사 규격·핸드북의 오차율 등 입증 자료를 √3으로 나눈 값"],["③","이 고시의 불확도: Tier 1 7.5%, Tier 2 5%, Tier 3 2.5%"]]},"terms":[{"t":"포함인자(t)","d":"표준불확도에 곱해 원하는 신뢰구간을 만드는 배수로, 표본 수와 신뢰수준에 따라 t-분포표에서 찾는다.","en":"coverage factor"},{"t":"상대불확도","d":"확장불확도를 평균값으로 나누어 백분율로 나타낸 불확도로, 명세서에 보고하는 값이다.","en":"relative uncertainty"}]},{"no":"별표 9-2","label":"식 1~5와 t-분포표로 직접 계산하기","doc":"mrv-full","pdfPage":343,"prose":["2단계의 반복측정 불확도는 다섯 식으로 구한다. 식-1은 표본평균 x̄ = 측정값의 합 ÷ n, 식-2는 표본표준편차 s = √[Σ(x_k − x̄)² ÷ (n−1)]이다. 식-3은 표준불확도 U_s = s ÷ √n으로, 평균의 표준편차다. 식-4는 확장불확도 U_p = t × s ÷ √n으로, 95% 신뢰수준의 포함인자 t를 곱한다. 식-5는 상대불확도 U_r,p = U_p ÷ x̄ × 100(%)이다. 여러 요인이 있으면 요인별 표준불확도를 구해 합성한 뒤 확장·상대불확도를 구한다.","t는 참고자료 표-2의 t-분포표에서 찾는다. 95% 신뢰구간 열에서 측정 횟수 n이 2면 12.71, 3이면 4.30, 5면 2.78, 10이면 2.26, 20이면 2.09, 무한대면 1.96이다. 측정 횟수가 적을수록 t가 커져 불확도가 커진다는 점이 핵심이다. 가상의 예로 연료 분석을 10회 해서 발열량 평균 1,000, 표준편차 20이 나왔다고 하자. U_s = 20 ÷ √10 = 6.32, U_p = 2.26 × 6.32 = 14.3, U_r = 14.3 ÷ 1,000 × 100 = 1.43%다. 같은 자료로 3회만 쟀다면 t가 4.30이라 U_r = 4.30 × 20 ÷ √3 ÷ 1,000 × 100 = 4.97%로 세 배 넘게 커진다.","3단계는 배출량이 여러 매개변수의 곱일 때 승산법으로 합성한다. 식은 U_r,E = √(U_r,A² + U_r,B² + U_r,C² + …)로, 활동자료 A와 배출계수 B 등의 상대불확도를 제곱해 더한 뒤 제곱근을 취한다. 매개변수가 서로 독립일 때 유효하다. 4단계는 사업장 총배출량처럼 여러 배출원의 합일 때 가감법으로, U_r,ET = √Σ(E_i × U_r,Ei ÷ 100)² ÷ E_T × 100이다. 배출량이 큰 시설의 불확도가 전체에 더 크게 반영된다. 활동자료 불확도 5%, 배출계수 불확도 3%인 시설이라면 배출량 상대불확도는 √(25 + 9) = 5.83%가 된다."],"req":"표준불확도 s/√n에 95% 포함인자 t를 곱해 확장불확도를 구하고 평균으로 나눠 상대불확도(%)를 얻으며, 곱으로 된 배출량은 제곱합의 제곱근으로 합성한다.","fig":{"cap":"표-2 95% 신뢰수준 포함인자 t (mrv-full.pdf 347쪽, 일부)","head":["측정 횟수 n","t (95%)"],"rows":[["2","12.71"],["3","4.30"],["5","2.78"],["10","2.26"],["20","2.09"],["30","2.05"],["∞","1.96"]]},"terms":[{"t":"승산법 합성","d":"곱으로 이어진 변수들의 상대불확도를 제곱해 더한 뒤 제곱근을 취해 전체 불확도를 구하는 방법이다.","en":"multiplicative combination (root sum of squares)"},{"t":"표준오차","d":"표본 평균이 얼마나 흔들릴 수 있는지 나타낸 값으로, 표준편차를 √n으로 나눈 것이다.","en":"standard error"}]}],"write":{"q":"연료 분석을 n회 해서 평균과 표준편차를 얻었다. 명세서에 보고할 상대불확도는 어떻게 구하나?","must":[["표준편차","s"],["√n","루트 n","제곱근","n"],["t","포함인자","95%"]],"bonus":[["평균으로 나누","÷ 평균","백분율","100"]],"wrong":["최댓값","Tier 1 7.5%를 그대로"],"model":"표준편차를 √n으로 나눈 표준불확도에 95% 신뢰수준 포함인자 t를 곱해 확장불확도를 구하고, 이를 평균으로 나누어 100을 곱한 상대불확도(%)로 보고한다.","src":"별표 9의 2, 식-3~식-5"},"check":{"q":"같은 표준편차라면 측정 횟수가 3회일 때와 10회일 때 상대불확도는?","options":["같다","3회가 더 크다(t 4.30, 10회는 2.26)","10회가 더 크다"],"ans":1,"why":"확장불확도는 t × s ÷ √n이다. n이 작으면 t가 커지고(3회 4.30, 10회 2.26) √n은 작아지므로 두 효과가 겹쳐 3회의 불확도가 훨씬 크다."},"summary":["불확도는 측정·계산값이 참값에서 흩어질 수 있는 정도이며, 명세서에는 95% 신뢰수준 확장불확도를 평균으로 나눈 상대불확도(%)를 보고한다.","할당대상업체는 4단계 절차 중 매개변수 단계까지 산정하고, 값은 시험성적서 → 입증자료÷√3 → 고시 기본값(7.5·5·2.5%) 순으로 택한다.","표준불확도 s/√n에 t-분포표의 포함인자를 곱해 확장불확도를 구하며, 곱으로 된 배출량은 상대불확도의 제곱합 제곱근으로 합성한다."]},{"id":"m-10","title":"배출계수: 기본값·국가 고유값·사업장 고유값, GWP","range":"제15~16·22조, 별표 7·10~13, 참고 3","pages":[9,9],"min":18,"intro":"Tier 1·2·3의 차이는 결국 '어느 표에서 계수를 가져오느냐'다. 이 회차에서는 제15·16·22조와 별표 10(IPCC 기본 배출계수), 별표 11(IPCC 기본 발열량), 별표 12(국가 고유 발열량·배출계수), 별표 13(시료 분석 주기), 별표 7(고유계수 승인 절차)을 읽고, 참고 3의 GWP가 IPCC 2차 평가보고서(SAR) 값임을 확인한다.","blocks":[{"no":"제15조","label":"Tier별로 계수를 가져오는 곳","doc":"mrv","pdfPage":9,"prose":["제15조는 Tier별 배출계수 출처를 정한다. 제1항은 Tier 1로 셀 때 별표 10의 기본 배출계수와 별표 11의 기본 발열량을 쓰고, 별표 10에 없는 원료 등의 계수는 별표 6의 각 배출활동별 산정방법론을 참조하라고 한다. 제2항은 Tier 2로 셀 때 온실가스종합정보센터가 확인·검증해 공표하는 국가 고유 배출계수를 쓰되, 연료별 국가 고유 발열량은 별표 12를 우선 활용하라고 한다. 제3항은 Tier 3으로 셀 때 별표 7의 절차에 따라 환경부장관으로부터 배출시설 또는 공정 단위 고유 배출계수의 사용 가능 여부를 통보받은 뒤 쓰라고 한다.","제22조는 적용 특례다. Tier 2로 세야 하는 할당대상업체라도 국가 고유 배출계수가 이 지침에 고시되지 않은 경우에 한해 Tier 1 배출계수를 쓸 수 있다. 별표 12의 국가 고유 배출계수 표에는 석유 16종, 가스 3종, 석탄 6종만 있으므로, 고로가스나 폐기물 연료처럼 표에 없는 연료는 B그룹 시설이라도 별표 10의 IPCC 값을 쓰게 된다. 이때는 산정 계획의 '최소 산정등급 미충족 사유'에 적어 둔다.","별표 7은 자체 개발 산정방법론과 사업장 고유 배출계수의 승인·통보 절차 6단계다. 1단계 업체가 개발계획이 든 산정 계획을 주무관청에 제출, 2단계 주무관청이 국가 배출계수 개발방법과의 정합성 검토, 3단계 계획의 사용가능 여부 통보, 4단계 업체가 개발 결과를 다음 연도 명세서에 포함해 제출, 5단계 주무관청이 국가 계수와의 정합성과 유사시설 계수의 등가성·정확성 검토, 6단계 결과의 사용가능 여부 통보다. 계획과 결과를 두 번 검토받는 구조다."],"req":"Tier 1은 별표 10·11, Tier 2는 국가 고유 배출계수와 별표 12 발열량, Tier 3은 별표 7 절차로 환경부 통보를 받은 고유계수를 쓰며, 국가 고유계수가 없으면 Tier 1 계수를 쓸 수 있다.","fig":{"cap":"별표 7 고유계수 승인·통보 6단계 (mrv-full.pdf 325쪽)","head":["단계","누가","무엇을"],"rows":[["1","업체","개발계획이 든 산정 계획 제출"],["2","주무관청","계획 검토(국가 계수 개발방법과의 정합성)"],["3","주무관청","계획의 사용가능 여부 통보"],["4","업체","개발 결과를 다음 연도 명세서에 포함 제출"],["5","주무관청","결과 검토(정합성, 유사시설 계수의 등가성·정확성)"],["6","주무관청","결과의 사용가능 여부 통보"]]},"terms":[{"t":"국가 고유 배출계수","d":"온실가스종합정보센터가 국내 연료 분석 자료로 확인·검증해 공표한 배출계수로, Tier 2에 쓴다.","en":"country-specific emission factor"},{"t":"온실가스종합정보센터","d":"국가 온실가스 통계와 배출계수를 관리하는 기관으로, 이 고시에서 '센터'라고 줄여 부른다.","en":"Greenhouse Gas Inventory and Research Center (GIR)"}]},{"no":"별표 10","label":"IPCC 기본 배출계수와 기본 발열량 읽기","doc":"mrv-full","pdfPage":348,"prose":["별표 10은 2006 IPCC 국가 인벤토리 가이드라인의 기본 배출계수를 kgGHG/TJ 단위로 모았다. CO2는 한 칸, CH4는 에너지산업·제조업건설업·상업공공·가정기타 네 칸, N2O는 두 칸이다. 경유(가스/디젤 오일)는 CO2 74,100, CH4 3·3·10·10, N2O 0.6·0.6이고 B-C유는 77,400, LPG는 63,100에 CH4 1·1·5·5, N2O 0.1·0.1이다. 무연탄은 98,300에 CH4 1·10·10·300, N2O 1.5·1.5이고, 천연가스(LNG)는 56,100에 CH4 1·1·5·5, N2O 0.1·0.1이다. 고로가스는 260,000으로 유독 크다. 목재는 112,000이지만 제18조에 따라 CO2는 총배출량에서 뺀다.","CH4·N2O 칸이 업종별로 나뉘므로 어느 열을 쓸지는 사업장 지정업종의 한국표준산업분류 중분류 코드로 정한다. 에너지 산업은 코드 35, 제조업·건설업은 10~33 등, 상업·공공은 45~47, 55~56 등, 가정·기타는 01~03, 98이다. 주2)는 국내 B-A유와 B-B유의 CO2 계수를 경유와 B-C유 혼합비로 만든 75,100과 76,400으로 적는다.","별표 11은 같은 가이드라인의 연료별 기본 순발열량이다. 단위가 모두 TJ/Gg, 즉 1,000톤당 TJ다. 경유 43.0, 휘발유 44.3, B-C유 40.4, LPG 47.3, 무연탄 26.7, 천연가스 48, 코크스 28.2, 고로가스 2.47이다. 주1)의 [순발열량/총발열량] 비율은 고체 0.97, 액체 0.94, 기체 0.91이다. 별표 11은 무게 기준이라 부피로 사는 액체·기체 연료에는 밀도 환산이 필요하고, 그래서 실무에서는 부피 단위가 함께 있는 별표 12를 더 자주 편다."],"req":"별표 10은 2006 IPCC 기본 배출계수(kgGHG/TJ)로 CH4·N2O는 업종 열을 골라 쓰고, 별표 11은 IPCC 기본 순발열량(TJ/Gg)이다.","fig":{"cap":"별표 10·11 주요 연료 기본값 (mrv-full.pdf 348~349, 359~360쪽)","head":["연료","CO2 kg/TJ","CH4 제조업 kg/TJ","N2O kg/TJ","순발열량 TJ/Gg"],"rows":[["경유","74,100","3","0.6","43.0"],["B-C유","77,400","3","0.6","40.4"],["LPG","63,100","1","0.1","47.3"],["천연가스(LNG)","56,100","1","0.1","48"],["무연탄","98,300","10","1.5","26.7"],["코크스로 코크스","107,000","10","1.5","28.2"],["고로가스","260,000","1","0.1","2.47"]]},"terms":[{"t":"TJ/Gg","d":"연료 1,000톤(기가그램)이 내는 열량을 테라줄로 나타낸 발열량 단위로, MJ/kg과 숫자가 같다.","en":"terajoule per gigagram"}]},{"no":"별표 12","label":"국가 고유 발열량·배출계수와 시료 분석 주기","doc":"mrv-full","pdfPage":361,"prose":["별표 12의 1은 에너지법 시행규칙 별표의 연료별 국가 고유 발열량이다. 총발열량과 순발열량이 나란히 있고 단위가 에너지법 기준(MJ/kg, MJ/L, MJ/Nm³)과 TJ 환산 기준으로 둘 다 적혀 있다. 경유는 총 37.8, 순 35.2 TJ/1000m³, B-C유 41.7과 39.2, 천연가스(LNG) 54.7과 49.4 TJ/Gg, 도시가스(LNG) 43.1과 38.9 TJ/1,000,000Nm³, 국내무연탄 19.8과 19.4 TJ/Gg다. 전기는 발전기준 8.9, 소비기준 9.6 TJ/GWh다. 비고는 배출량 산정에는 순발열량, 에너지사용량 집계에는 총발열량을 쓰고 1 kWh = 860 kcal을 적용하라고 한다.","2는 연료별 국가 고유 배출계수로 탄소 배출계수(kgC/TJ)와 CO2 배출계수(kgCO2/TJ)가 함께 있다. 석유 16종 가운데 휘발유 71,600, 등유·경유 73,200, B-C유 80,300, 나프타 70,200, 석유코크스 95,600, 프로판 64,600, 부탄 66,300이다. 가스 3종은 천연가스(LNG)와 도시가스(LNG) 56,100, 도시가스(LPG) 64,000이다. 석탄 6종은 국내무연탄 110,600, 연료용 수입무연탄 100,400, 유연탄 95,100, 아역청탄 97,000이다. 경유는 IPCC 74,100과 국가 고유 73,200으로 1% 남짓 차이가 나고, 국내무연탄은 98,300과 110,600으로 12% 넘게 차이가 난다.","제16조는 Tier 3을 위해 시료를 채취·분석할 때의 규칙이다. 분석 기관은 환경분야 시험·검사법의 측정대행업자, KS Q ISO/IEC 17025 공인 시험·교정기관, 그 기준에 맞는 자체 실험실을 갖춘 할당대상업체다. 시료는 대표성을 가질 만큼 충분히 채취하고 연료는 별표 13의 최소 분석주기를 지켜야 한다. 별표 13은 고체연료 월 1회, 액체연료 분기 1회, 천연가스·도시가스 반기 1회, 공정 부생가스와 탄산염 원료 월 1회이며 연 반입량이 많으면 횟수를 더한다. 고체연료는 연 24만 톤을 넘으면 2만 톤 초과마다 1회를 더한다. 분석방법은 별표 14의 KS, ISO, ASTM 표준을 쓴다."],"req":"Tier 2 발열량은 별표 12(경유 순 35.2 TJ/1000m³, 전기 소비기준 9.6 TJ/GWh 등), Tier 2 배출계수는 국가 고유값(경유 73,200, LNG 56,100 kgCO2/TJ 등)을 쓰고, Tier 3 시료 분석은 별표 13 주기와 공인기관 규칙을 지킨다.","fig":{"cap":"별표 12 국가 고유 발열량·배출계수 일부 (mrv-full.pdf 361~363쪽)","head":["연료","총발열량","순발열량","CO2 배출계수 kgCO2/TJ"],"rows":[["휘발유","32.7 TJ/1000m³","30.4","71,600"],["경유","37.8 TJ/1000m³","35.2","73,200"],["B-C유","41.7 TJ/1000m³","39.2","80,300"],["천연가스(LNG)","54.7 TJ/Gg","49.4","56,100"],["도시가스(LNG)","43.1 TJ/10⁶Nm³","38.9","56,100"],["국내무연탄","19.8 TJ/Gg","19.4","110,600"],["전기(소비기준)","9.6 TJ/GWh","9.6","-"]]},"terms":[{"t":"총발열량","d":"연료가 완전 연소할 때 생기는 열량에 수증기 잠열까지 포함한 값으로, 에너지사용량 집계에 쓴다(제2조제41호).","en":"gross calorific value"},{"t":"KS Q ISO/IEC 17025","d":"시험·교정기관의 능력에 관한 국제 표준으로, 이 기준으로 공인된 기관이 Tier 3 시료를 분석할 수 있다.","en":"ISO/IEC 17025"}]},{"no":"참고 3","label":"GWP: 국내 명세서는 SAR 값을 쓴다","doc":"mrv-full","pdfPage":456,"prose":["별지 11 명세서 서식 뒤의 참고 3은 온실가스별 지구온난화지수(GWP) 표다. 이산화탄소 1, 메탄 21, 아산화질소 310, HFC-23 11,700, HFC-32 650, HFC-125 2,800, HFC-134a 1,300, HFC-143a 3,800, PFC-14(CF4) 6,500, PFC-116(C2F6) 9,200, 육불화황(SF6) 23,900이다. 표 아래에 출처가 IPCC 2차 평가보고서라고 적혀 있다. 1995년에 나온 SAR 값이다. 제2조제35호의 이산화탄소 상당량은 가스 양에 이 지구온난화지수를 곱한 값이다.","「온실가스와 Scope」에서 본 GHG 프로토콜 정리표의 AR5 값은 메탄 28(비화석), 아산화질소 265, SF6 23,500이고 AR6은 27.0·273·24,300이었다. 국내 명세서의 메탄 21과 아산화질소 310은 그보다 오래된 값이다. 어떤 GWP를 곱하느냐에 따라 tCO2-eq가 달라지므로, 명세서 숫자와 지속가능성 보고서의 Scope 1을 그대로 비교하면 메탄·아산화질소 몫만큼 어긋난다. 연료 연소에서는 그 몫이 작지만, 냉매(HFCs)나 반도체 공정가스(PFCs, SF6)가 많은 사업장에서는 차이가 눈에 띈다.","그래서 실무에서는 명세서용 계산 시트와 보고서용 계산 시트의 GWP 열을 분리해 두고 어느 값을 썼는지 적는다. 보고서에 '국내 Scope 1·2는 K-ETS 기준'이라고 적힌 숫자는 SAR GWP와 이 고시의 계수로 만들어진 값이라는 점도 함께 이해한다."],"req":"국내 명세서의 tCO2-eq는 IPCC 2차 평가보고서(SAR)의 GWP(CH4 21, N2O 310, SF6 23,900 등)를 곱한 값이며, AR5·AR6을 쓰는 공시 숫자와 그대로 비교하면 어긋날 수 있다.","fig":{"cap":"참고 3 GWP (mrv-full.pdf 456쪽, 출처 IPCC 2차 평가보고서) 와 GHG 프로토콜 정리표 비교","head":["가스","이 고시(SAR)","AR5","AR6"],"rows":[["CO2","1","1","1"],["CH4","21","28(비화석)","27.0"],["N2O","310","265","273"],["HFC-134a","1,300","1,300","1,530"],["SF6","23,900","23,500","24,300"]]},"ex":{"k":"기아 보고서에서는","t":"156쪽 주석 1은 '국내 생산법인 및 비생산시설의 Scope1 및 Scope2 배출량은 한국 배출권거래제(K-ETS)에 따라 로이드인증원에 의해 별도 검증된 결과가 반영됨'이라고 적었다. 국내 사업장 숫자는 이 고시의 계수와 SAR GWP로 만들어진 명세서 값이다.","co":"kia","page":156},"terms":[{"t":"IPCC 2차 평가보고서(SAR)","d":"1995년 IPCC 보고서로, 교토의정서 1차 공약기간과 국내 명세서가 쓰는 GWP의 출처다.","en":"IPCC Second Assessment Report"},{"t":"이산화탄소 상당량","d":"온실가스의 양에 지구온난화지수를 곱해 이산화탄소 기준으로 바꾼 값이다(제2조제35호).","en":"CO2 equivalent"}]}],"write":{"q":"국내 명세서에서 메탄 10톤은 몇 tCO2-eq로 적히고, 그 GWP의 출처는 무엇인가?","must":[["210"],["21"],["2차 평가보고서","SAR","IPCC 2차"]],"bonus":[["AR5","AR6","265","28"]],"wrong":["280","273","AR6 값"],"model":"참고 3의 GWP는 IPCC 2차 평가보고서(SAR) 값이라 메탄 GWP가 21이므로 10톤 × 21 = 210 tCO2-eq로 적힌다.","src":"참고 3, 제2조제35호"},"check":{"q":"B그룹 시설이 쓰는 연료의 국가 고유 배출계수가 이 지침에 고시되어 있지 않다. 어떻게 하나?","options":["Tier 3 고유계수를 개발할 때까지 보고를 미룬다","제22조에 따라 Tier 1(별표 10 IPCC) 계수를 쓸 수 있다","유사 연료의 국가 고유계수를 임의로 쓴다"],"ans":1,"why":"제22조는 Tier 2로 세야 하는 업체라도 국가 고유 배출계수가 고시되지 않은 경우에 한해 Tier 1 배출계수를 적용할 수 있다고 한다."},"summary":["Tier 1은 별표 10·11의 2006 IPCC 기본값, Tier 2는 센터가 공표한 국가 고유 배출계수와 별표 12 발열량, Tier 3은 별표 7 절차로 통보받은 사업장 고유계수를 쓴다.","국가 고유값은 IPCC 값과 다르며(경유 73,200 vs 74,100, 국내무연탄 110,600 vs 98,300 kgCO2/TJ), 고시되지 않은 연료는 Tier 1 계수를 쓸 수 있다.","명세서의 tCO2-eq는 IPCC 2차 평가보고서(SAR) GWP(CH4 21, N2O 310)를 곱한 값이라 AR5·AR6 기준 공시 숫자와 그대로 비교하면 어긋난다."]},{"id":"m-11","title":"배출량 산정 계획(모니터링 계획)과 QC/QA","range":"제23~27조, 별표 19·20, 별지 제10호","pages":[11,13],"min":17,"intro":"명세서보다 1년 먼저 내는 문서가 배출량 산정 계획이다. 이 회차에서는 산정 계획에 무엇이 들어가고(제24조, 별표 20, 별지 제10호), 언제 사전검토와 추가검토를 받으며(제25·26조), 숫자의 품질을 지키는 QC/QA 활동(제23조, 별표 19)이 무엇인지 읽는다.","blocks":[{"no":"제24조","label":"산정 계획의 아홉 가지 내용","doc":"mrv","pdfPage":12,"prose":["제24조는 배출량 산정의 정확성과 신뢰성을 높이기 위해 아홉 가지가 들어간 배출량 산정 계획을 별표 20과 별지 제10호 서식에 따라 작성하라고 한다. 1 업체 일반정보(법인명, 대표자, 계획기간, 담당자), 2 사업장 일반정보와 조직경계(업종, BM 적용시설 포함 여부, 사업장 사진, 시설배치도, 공정도, 온실가스·에너지 흐름도), 3 배출시설별 모니터링 방법(배출시설 정보, 산정등급 분류기준, 예상 신·증설 시설, 활동자료 측정지점), 4 활동자료의 모니터링 방법(측정기기 정보, 개선·설치 계획)이다.","이어 5 배출시설별 배출활동의 산정등급 적용계획(산정방법론 Tier, 매개변수별 Tier, 최소 Tier 미충족 사유), 6 에너지 외부유입 및 구매계획, 7 사업장 고유 배출계수(Tier 3) 등 개발계획(계수 종류, 시험·분석 정보, 산정식, 예상 불확도), 8 사업장별 QC/QA 활동계획(품질관리 문서, 담당자), 9 기타 특이사항이다. 앞 회차들에서 읽은 조직경계(3회차), Tier(4회차), 모니터링 유형(8회차), 불확도(9회차), 고유계수(10회차)가 모두 이 문서의 항목으로 모인다.","제2조제12호는 산정 계획을 '자료의 연속적 또는 주기적인 수집·감시·측정·평가 및 매개변수 결정에 관한 세부적인 방법, 절차, 일정 등을 규정한 계획'으로 정의한다. 흔히 모니터링 계획이라고 부른다. 법 제24조제1항이 명세서를 '배출량 산정계획서를 기준으로' 작성하라고 하므로, 계획에 없는 방법으로 센 숫자는 명세서에 들어갈 수 없다. 별지 제10호 서식은 1 할당대상업체 총괄 정보(법인 일반정보, 사업장 목록), 2 사업장 일반정보와 조직경계 입력(사진, 시설배치도, 공정도)으로 시작한다."],"req":"산정 계획에는 업체·사업장 정보와 조직경계, 배출시설별 모니터링 방법과 측정기기, Tier 적용계획, 에너지 구매계획, 고유계수 개발계획, QC/QA 계획을 별지 제10호 서식으로 담는다.","fig":{"cap":"제24조 산정 계획 9항목과 이 책의 회차","head":["항목","내용","회차"],"rows":[["1·2","업체·사업장 정보, 조직경계(사진·배치도·공정도)","m-3"],["3·4","배출시설별 모니터링 방법, 측정기기 정보","m-8"],["5","배출활동·매개변수별 Tier 적용계획, 미충족 사유","m-4"],["6","에너지 외부유입·구매계획","m-6"],["7","사업장 고유 배출계수(Tier 3) 개발계획, 예상 불확도","m-9, m-10"],["8","QC/QA 활동계획","m-11"],["9","기타 특이사항","-"]]},"terms":[{"t":"배출량 산정 계획","d":"활동자료 수집과 매개변수 결정의 방법·절차·일정을 미리 정한 계획으로, 모니터링 계획이라고도 부른다(제2조제12호).","en":"monitoring plan"},{"t":"BM 적용시설","d":"벤치마크(제품 단위당 배출량) 방식으로 할당받는 시설이다.","en":"benchmark facility"}]},{"no":"별표 20","label":"일곱 가지 작성 원칙","doc":"mrv-full","pdfPage":393,"prose":["별표 20의 1은 산정 계획 작성 원칙이다. 산정 계획은 이 고시의 배출활동별 산정방법론을 지키고, 활동자료·매개변수·고유 배출계수의 정확성과 신뢰성이 높아지도록 써야 하며, 관리자와 실무자가 그 계획만 보고 바로 산정·보고할 수 있게 써야 한다. 그리고 일곱 가지 원칙을 적용한다. 1) 준수성은 산정과 계획 작성 기준을 지키는 것, 2) 완전성은 조직경계 안 모든 배출시설의 배출활동에 대해 계획을 세우는 것으로 신·증설, 중단, 폐쇄, 긴급 상황 같은 특수상황의 시설과 활동도 포함한다.","3) 일관성은 같은 배출시설·배출활동의 데이터를 서로 비교할 수 있게 시설 구분을 가능한 한 유지하는 것, 4) 투명성은 산정 원칙을 지키고 데이터와 정보관리 과정을 투명하게 알 수 있게 쓰는 것, 5) 정확성은 배출량의 정확성을 높이도록 세우는 것, 6) 일치성 및 관련성은 계획이 현장과 일치하고 각 배출시설·배출활동·산정방법과 연결되어야 한다는 것, 7) 지속적 개선은 계획을 계속 개선해 나가는 것이다. 제7조의 산정 원칙에 '현장과 일치'와 '지속 개선'이 더해진 셈이다.","2는 작성 방법 일곱 가지로, 별표 4에 따른 조직경계 결정, 기존·신증설·폐쇄·경계 제외 시설로 나눈 배출활동·배출시설 파악, 별표 6에 따른 배출시설별 모니터링 방법, 별표 8에 따른 모니터링 대상·측정지점 결정, 측정기기·정도검사 주기·불확도를 담은 활동자료 모니터링 방법, 별표 5에 따른 Tier 적용계획, 별표 19에 따른 QC/QA 활동계획이다. 별표 2의 산정 7단계와 같은 순서다."],"req":"산정 계획은 준수성, 완전성, 일관성, 투명성, 정확성, 일치성·관련성, 지속적 개선의 일곱 원칙에 따라 관리자와 실무자가 그것만 보고 산정할 수 있게 쓴다.","terms":[{"t":"일치성 및 관련성","d":"산정 계획이 실제 현장과 같고 각 배출시설·배출활동·산정방법과 연결되어 있어야 한다는 원칙이다.","en":"consistency with site and relevance"}]},{"no":"제25조","label":"사전검토, 변경과 추가검토, 일시적 적용 불가","doc":"mrv","pdfPage":12,"prose":["제25조제1항은 검증기관의 검증을 받은 산정 계획에 대해 매 계획기간 4개월 전까지 환경부장관에게 전자적 방식으로 사전검토를 요청하라고 한다. 신규진입자는 할당대상업체로 지정된 연도의 종료 4개월 전까지이고, 권리·의무 승계로 지정된 경우는 승계 통보 시점부터 1개월 이내에 요청할 수 있다. 환경부장관은 타당성을 검토해 결과를 전자적으로 통지하고, 사전검토를 마친 계획을 이력 관리하며, 필요하면 추가 자료를 요청하거나 현장 조사를 할 수 있다. 산정 계획도 검증을 받는다는 점에 주의한다. 명세서만 검증 대상이 아니다.","제26조는 변경이다. 계획기간 중 업종 변경, 조직경계 변경, 배출활동·배출시설 변경, 산정방법 변경(배출계수, 매개변수, 시료 채취·분석 절차 포함), 활동자료 수집·측정 방법 변경(측정기기 포함), 시정·보완 명령에 따른 변경, 기타 배출량에 영향을 미치는 변경 같은 중대한 변경이 생기면 매 이행연도 10월 31일까지 검증을 거쳐 계획을 변경한 뒤 추가검토를 요청해야 한다. 추가검토 결과를 통지받으면 이행연도 종료일까지 다시 검증을 거쳐 수정 계획을 제출한다. 중대하지 않은 변경은 10월 31일까지 변경 후 통지하고, 변경이 없으면 기존 계획을 쓴다. 신·증설이 할당량과 관련되면 실제 배출 전에 추가검토를 요청해야 하고, 결과를 받을 때까지 기존 계획과 변경 계획을 병행 이행한다.","제27조는 일시적 적용 불가다. 기술적 이유나 불가항력으로 사전검토된 계획을 일시적으로 적용할 수 없으면 즉시 전자적으로 통지하고, 당해연도 명세서에 적용 불가 사유, 기존 계획을 대체하는 임시 모니터링 방법, 원상 복귀 시점과 조치 사항이 담긴 소명자료를 첨부한다. 유량계가 고장나 별표 8의 C-4 결측 보정을 쓴 경우가 전형적인 예다. 통지 없이 명세서에서 갑자기 다른 방법이 나오면 검증과 적합성 평가에서 문제가 된다."],"req":"검증받은 산정 계획은 계획기간 4개월 전까지 사전검토를 요청하고, 중대한 변경은 이행연도 10월 31일까지 검증을 거쳐 추가검토를 요청하며, 일시적 적용 불가는 즉시 통지하고 명세서에 소명자료를 붙인다.","fig":{"cap":"산정 계획 관련 기한 (제25~27조)","head":["상황","기한"],"rows":[["사전검토 요청","매 계획기간 4개월 전까지(신규진입자는 지정연도 종료 4개월 전)"],["권리·의무 승계","승계 통보 시점부터 1개월 이내"],["중대한 변경의 추가검토 요청","매 이행연도 10월 31일까지(검증 거쳐)"],["추가검토 결과 반영 제출","매 이행연도 종료일까지(검증 거쳐)"],["할당 관련 신·증설","실제 배출 발생 전"],["일시적 적용 불가","즉시 통지, 당해연도 명세서에 소명자료"]]},"terms":[{"t":"계획기간","d":"배출권 할당의 단위가 되는 여러 해의 기간으로, 산정 계획은 계획기간 단위로 사전검토를 받는다.","en":"commitment period"},{"t":"추가검토","d":"사전검토가 끝난 산정 계획에 중대한 변경이 생겼을 때 그 타당성을 다시 확인하는 절차다(제2조제4호).","en":"supplementary review"}]},{"no":"별표 19","label":"QC는 담당자가, QA는 관여하지 않은 사람이","doc":"mrv-full","pdfPage":388,"prose":["제23조는 할당대상업체에 측정기기 관리, 활동자료 수집, 배출량 산정, 불확도 관리, 정보보관, 보고에 대한 품질관리(QC) 활동과, 자료 품질을 계속 개선하는 체제를 갖추는 품질보증(QA) 활동을 요구하고 세부는 별표 19에 맡긴다. 별표 19의 1은 QC를 산정 결과의 품질을 평가·유지하기 위한 일상적 기술 활동의 시스템으로 정의하며 산정담당자가 수행한다. 목적은 자료의 무결성·정확성·완전성을 위한 일상적 검사, 오류와 누락의 확인·설명, 산정자료의 문서화·보관과 모든 QC 활동의 기록이다.","QC의 세부 내용은 네 묶음이다. 기초자료의 수집·정리에서는 측정자료의 정확한 취합·보관, 측정기기의 주기적 검·교정, 측정지점에서 산정담당자까지의 자료 수집 체계, 산정방법론·발열량·배출계수의 출처 기록이다. 산정 과정의 적절성에서는 단위 확인, 매개변수 활용의 적절성, 재현가능성 확인이다. 산정 결과의 적절성에서는 모든 배출활동 포함 여부(누락·제외 사유 기재), 하위 활동자료 합과 사업장 단위 활동자료의 일치, 시계열 일관성, 불확도 결과의 적절성, 내부감사 실시다. 보고의 적절성에서는 조직경계의 적절성, 담당자 책임·권한의 문서화, 서식에 맞는 보고다.","2의 QA는 산정 과정에 직접 관여하지 않은 사람이 수행하는 검토 절차의 계획된 시스템이다. 고유 위험, 통제 위험, 오류·누락을 막지 못할 위험에 대한 자체평가 절차를 문서화하고, 이 위험을 완화하는 활동을 내부감사라 하며 매년 실시해 평가하고 개선한다. QA 요소는 내부감사 담당자·책임자 지정(산정업무를 맡을 수 없도록 업무를 나눔), 품질감리(검·교정 이력 문서화, 정보화시스템의 통제와 백업·보안), 배출량 정보 자체 검증(서류검토·현장점검), 산정업무 위탁 시 감독 절차, 미비점 발견 시 수정·보완 절차다. 요약하면 QC는 '만드는 사람의 점검', QA는 '만들지 않은 사람의 검토'다."],"req":"QC는 산정담당자가 자료 수집·산정 과정·결과·보고를 일상적으로 점검·기록하는 일이고, QA는 산정에 관여하지 않은 내부감사 담당자가 매년 위험평가와 자체 검증으로 그 체계를 검토·개선하는 일이다.","fig":{"cap":"별표 19 QC와 QA (mrv-full.pdf 388~392쪽)","head":["구분","누가","무엇을"],"rows":[["QC(품질관리)","배출량 산정담당자","기초자료 수집·정리, 산정 과정, 산정 결과, 보고의 적절성을 일상적으로 검사하고 기록"],["QA(품질보증)","산정에 관여하지 않은 내부감사 담당자","위험 자체평가 문서화, 품질감리, 자체 검증(서류·현장), 위탁 감독, 수정·보완 절차를 매년 수행"]]},"terms":[{"t":"품질관리(QC)","d":"산정담당자가 자료와 계산의 정확성을 일상적으로 검사하고 기록하는 활동이다.","en":"quality control"},{"t":"품질보증(QA)","d":"산정에 관여하지 않은 사람이 계획된 절차로 산정 결과와 체계를 검토하는 활동으로, 내부감사가 핵심이다.","en":"quality assurance"},{"t":"내부감사","d":"배출량 보고의 고유 위험·통제 위험·오류 누락을 완화하기 위해 회사 안에서 매년 하는 독립적 검토다.","en":"internal audit"}]}],"write":{"q":"계획기간 중 보일러 연료를 B-C유에서 LNG로 바꿨다. 산정 계획은 언제까지 어떻게 해야 하나?","must":[["10월 31일","10.31","10월"],["검증","검증기관"],["추가검토"]],"bonus":[["중대한 변경","배출활동 변경","산정방법 변경"],["병행"]],"wrong":["명세서 제출 때 함께","변경 불필요"],"model":"배출활동과 산정방법이 바뀐 중대한 변경이므로 이행연도 10월 31일까지 검증기관의 검증을 거쳐 산정 계획을 변경하고 환경부장관에게 추가검토를 요청한다.","src":"제26조제1항"},"check":{"q":"별표 19에서 품질보증(QA)의 내부감사 담당자로 맞는 사람은?","options":["배출량 산정을 직접 맡은 담당자","산정업무를 맡지 않은 별도 담당자","검증기관 심사원"],"ans":1,"why":"별표 19의 2는 QA를 산정 과정에 직접 관여하지 않은 사람이 수행하는 검토 절차로 정의하고, 내부감사 담당자가 산정업무를 담당할 수 없도록 업무분장을 하라고 한다."},"summary":["산정 계획은 업체·사업장 정보와 조직경계, 모니터링 방법, Tier 적용계획, 고유계수 개발계획, QC/QA 계획 등 9항목을 별지 제10호 서식에 담고, 명세서는 이 계획을 기준으로 작성된다.","검증받은 계획은 계획기간 4개월 전까지 사전검토를, 중대한 변경은 이행연도 10월 31일까지 추가검토를 요청하며, 일시적 적용 불가는 즉시 통지하고 소명자료를 붙인다.","QC는 산정담당자의 일상 점검·기록, QA는 산정에 관여하지 않은 내부감사 담당자의 연 1회 위험평가·자체검증이다."]},{"id":"m-12","title":"명세서 제출, 인증, 이의신청, 공개","range":"제28~41조, 별표 23, 별지 제11호","pages":[13,16],"min":18,"intro":"마지막 회차는 숫자가 회사 밖으로 나간 뒤의 일이다. 명세서를 어떤 서식으로 언제 내는지(제28·29조), 정부가 어떻게 확인하고 적합성을 평가해 인증하는지(제31~37조), 불복하면 어떻게 하는지(제38조), 공개는 어디까지인지(제41조)를 읽고 기아·현대차의 검증의견서와 연결한다.","blocks":[{"no":"제28조","label":"명세서 서식과 제출 기한, 수정 명세서","doc":"mrv","pdfPage":13,"prose":["제28조는 이 고시로 산정한 배출량이 담긴 명세서를 별지 제11호 서식에 따라, 할당량이 결정된 사업장 단위로 작성하라고 한다. 별지 제11호 '온실가스 배출량 및 에너지 사용량 명세서'는 1 할당대상업체 총괄 정보(법인 일반정보, 사업장 목록, 업체의 배출량·에너지사용량 총괄), 2 사업장 일반정보(일반정보, 조직경계 사진)로 시작해 사업장별 배출시설과 배출활동 자료로 이어진다. 1-3 총괄표는 사업장마다 연간 온실가스 배출량을 직접배출(Scope 1), 간접배출(Scope 2), 총량으로, 연간 에너지사용량(TJ)을 연료·전기·스팀·총량으로 적고 소량배출사업장 여부를 표시한다. 사업장 단위 절사 배출량을 더하므로 업체 합계와 사업장 합이 다를 수 있다는 주석이 있다.","제29조제1항은 모든 사업장에 대해 검증기관의 검증을 거친 명세서를 매 이행연도 종료일부터 3개월 이내에 전자적 방식으로 제출하라고 한다. 명세서의 산정방법이 할당 때 적용한 산정방법과 달라져 배출량 차이가 생기면 할당 시 방법을 적용한 명세서와 변경된 방법을 적용한 명세서를 함께 낸다. 할당량과 실제 배출량을 같은 잣대로 비교하기 위해서다.","제2항은 수정 명세서다. 권리·의무 승계 통보, 조직경계 안팎으로 배출원·흡수원 변경, 산정방법론 변경으로 배출량에 상당한 변경 유발, 환경부장관의 고유 배출계수 검토·확인이나 값 변경, 시정·보완 명령의 다섯 사유가 생기면 해당 사유가 적용되는 계획기간의 과거 4년부터 이미 낸 명세서를 수정해 검증을 거쳐 사유 발생 시점부터 1개월 이내에 제출한다. 「온실가스와 Scope」에서 본 기준연도 재산정과 같은 생각이다. 과거 숫자도 같은 규칙으로 다시 세어야 비교가 된다."],"req":"명세서는 별지 제11호 서식으로 할당 사업장 단위로 작성해 검증을 거쳐 이행연도 종료 후 3개월 이내에 내고, 승계·경계 변경·방법론 변경 등이 있으면 과거 4년치를 수정해 1개월 이내에 다시 낸다.","fig":{"cap":"별지 제11호 1-3 업체 총괄표의 열 (mrv-full.pdf 468쪽)","head":["구분","열"],"rows":[["연간 온실가스 배출량(tCO2-eq)","직접배출(Scope 1), 간접배출(Scope 2), 총량"],["연간 에너지사용량(TJ)","연료 사용량, 전기 사용량, 스팀 사용량, 총량"],["기타","소량배출사업장 여부, 할당대상업체 합계"]]},"ex":{"k":"현대차 보고서에서는","t":"157쪽 검증의견서는 2025년 국내 사업장의 직접배출(Scope 1) 479,697 tCO2-eq, 간접배출(Scope 2) 지역기반 1,084,648 tCO2-eq, 총 배출량 1,564,345 tCO2-eq와 총 에너지 사용량 32,378 TJ를 적고, 총배출량은 '소수점 처리로 인해 직접 및 간접 배출량 합산 값과 차이가 발생할 수 있음'이라고 밝혔다. 명세서 총괄표의 열과 절사 주석이 그대로 보인다.","co":"hyundai","page":157},"terms":[{"t":"수정 명세서","d":"승계·경계 변경·방법론 변경 등 다섯 사유가 생겼을 때 과거 4년치 명세서를 다시 세어 1개월 이내에 내는 것이다(제29조제2항).","en":"revised emissions statement"}]},{"no":"제31조","label":"확인, 시정명령, 과태료, 실태조사","doc":"mrv","pdfPage":14,"prose":["제31조는 명세서를 받은 뒤 환경부장관이 하는 확인이다. 영 제39조제1항 각 호 사항의 누락과 검증기관 검증 여부 등을 확인하고, 누락되거나 부적절한 사항이 있으면 14일 이내의 기한을 정해 시정명령을 내릴 수 있다. 할당대상업체는 기한 안에 반영해 제출해야 하고, 따르지 않으면 법 제43조제4호의 과태료 부과 기준인 별표 23이 적용되며 환경부장관이 명세서를 직권으로 수정할 수 있다.","별표 23은 두 줄이다. 법 제24조제1항의 보고를 하지 않거나 거짓으로 한 경우, 기한 경과 1개월 초과 3개월 이내 300만원, 3개월 초과 6개월 이내 500만원, 6개월 초과 700만원, 거짓 보고 1,000만원이다. 법 제24조제2항의 시정·보완 명령을 이행하지 않은 경우 2차 위반 300만원, 3차 600만원, 4차 이상 1,000만원이며 횟수 기준은 최근 1년간 같은 위반으로 처분받은 경우에 적용한다. 금액은 크지 않지만 거짓 보고는 과태료에 그치지 않고 배출량이 직권 산정될 수 있다. 제32조는 법 제37조에 따라 제출 자료의 사실 여부와 적정성 확인에 필요하면 실태조사를 할 수 있다고 하고, 제39조는 업체나 검증기관이 근거자료를 내지 않으면 제3의 기관이나 사업자에게 자료를 요청할 수 있다고 한다."],"req":"환경부장관은 명세서의 누락과 검증 여부를 확인해 14일 이내 시정명령을 내릴 수 있고, 불이행 시 별표 23 과태료와 직권 수정, 필요하면 실태조사가 뒤따른다.","fig":{"cap":"별표 23 과태료 부과기준 (mrv-full.pdf 399쪽)","head":["위반 행위","금액"],"rows":[["미보고, 기한 경과 1개월 초과 3개월 이내","300만원"],["미보고, 3개월 초과 6개월 이내","500만원"],["미보고, 6개월 초과","700만원"],["거짓 보고","1,000만원"],["시정·보완 명령 불이행 2차 / 3차 / 4차 이상","300 / 600 / 1,000만원"]]},"terms":[{"t":"직권 수정","d":"시정명령을 따르지 않는 업체의 명세서를 환경부장관이 스스로 고치는 것이다(제31조제5항).","en":"ex officio correction"},{"t":"실태조사","d":"법 제37조에 따라 제출 자료가 사실인지 현장에서 확인하는 조사다.","en":"on-site investigation"}]},{"no":"제33조","label":"인증 기준과 적합성 평가 9항목","doc":"mrv","pdfPage":14,"prose":["제33조는 인증 기준이다. 제1항은 보고 내용이 적합하다고 평가되면 할당대상업체가 산정·보고한 배출량을 그대로 실제 배출량으로 인증한다고 한다. 제2항은 부적합이면 명세서의 해당 배출활동과 배출계수 등을 재평가해 적합한 배출량을 도출하고, 재산정한 배출량을 실제 배출량으로 인증한다고 한다. 제2조제5호의 재산정은 단순 계산 오류를 바로잡는 재계산과, 과소 산정되지 않았음을 보증하기 위해 보수적 가정·값·절차를 쓰는 보수적 계산을 포함한다. 제3항은 보고가 아예 없어 직권 산정할 때 과거 보고 실적 중 최대값, 과거 실적의 추세분석값, 과거 배출원단위 최대값에 생산량을 곱한 값, 동일 업종 유사 규모 업체 참고값 가운데 가장 큰 값을 인증한다고 한다. 보고하지 않으면 가장 불리한 숫자를 받는 구조다.","제34조는 적합성 평가의 내용이다. 환경부장관은 영 제57조제3항에 따라 평가 업무를 적합성 평가기관에 위탁할 수 있고, 평가기관은 아홉 가지를 전자적 방식으로 검토한다. 명세서상 산정방법으로 배출량 산정의 재현 가능성(계산으로 오류를 점검하고 오류가 있으면 재산정), 배출계수(고유계수 포함)와 활동자료의 적절성, 검증보고서의 검증의견과 명세서 반영 여부, 과거 실적 대비 급격한 증감이나 시설 누락, 조직경계 안팎 배출원 변경, 산정방법론 변경, 타당한 산정 계획에 따른 측정·보고 여부, 직권산정 해당 시 배출량, 기타 필요한 사항이다. 제2항은 적합성 평가를 모든 할당대상업체에 대해 수행한다고 한다. 표본이 아니라 전수다.","제35조는 평가 결과 보고다. 평가기관은 결과를 지체 없이 보고하고, 적합 또는 부적합을 판정해 별지 제6호 서식으로 배출량과 검토의견을 제시한다. 부적합 판정은 시정·보완 조치 불이행, 자료 미비로 평가 불가, 제34조제1항 각 호 사항이 부적합한 경우에 내리고 제33조제2항 기준으로 배출량을 산정해 보고한다. 산정 담당자 입장에서 9항목은 그대로 자체 점검표가 된다. 특히 '재현 가능성'은 평가기관이 명세서의 활동자료와 계수만으로 같은 숫자를 다시 계산할 수 있어야 한다는 뜻이므로, 시트에 숨은 보정값이 있으면 안 된다."],"req":"적합하면 보고한 배출량을, 부적합하면 재산정(재계산·보수적 계산)한 배출량을 인증하며, 적합성 평가는 모든 업체에 대해 재현 가능성·계수·검증의견 반영 등 9항목을 검토한다.","fig":{"cap":"제34조제1항 적합성 평가 9항목","head":["번호","검토 사항"],"rows":[["1","명세서상 산정방법으로 배출량 재현 가능성(오류 시 재산정)"],["2","배출계수(고유계수 포함)와 활동자료의 적절성"],["3","검증보고서 검증의견과 명세서 반영 여부"],["4","과거 실적 대비 급격한 증감, 배출시설 누락"],["5","조직경계 안팎 배출원 변경"],["6","산정방법론 변경"],["7","타당한 산정 계획에 따른 측정·보고 여부"],["8","직권산정 해당 시 배출량"],["9","기타 필요한 사항"]]},"terms":[{"t":"재산정","d":"부적합 판정 시 해당 배출활동과 계수를 재평가해 적합한 배출량을 내는 절차로, 재계산과 보수적 계산을 포함한다(제2조제5호).","en":"recalculation / re-determination"},{"t":"보수적 계산","d":"배출량이 과소 산정되지 않았음을 보증하기 위해 보수적인 가정·값·절차를 적용하는 것이다(제2조제52호).","en":"conservative calculation"},{"t":"적합성 평가기관","d":"환경부장관이 영 제57조제3항에 따라 적합성 평가 업무를 위탁한 기관이다.","en":"conformity assessment body"}]},{"no":"제37조","label":"인증 통보, 이의신청, 공개","doc":"mrv","pdfPage":15,"prose":["제37조는 환경부장관이 평가기관 자료를 바탕으로 인증위원회에 심의를 요청하고, 심의 결과를 매년 5월 31일까지 별지 제7호 서식으로 할당대상업체에 통보한다고 한다. 법 제25조제4항은 이행연도 종료일부터 5개월 이내에 배출권등록부에 등록하라고 하니 3월 말 제출, 4~5월 평가·심의, 5월 말 통보·등록의 일정이 된다. 인증된 배출량은 그 해 제출해야 할 배출권의 양이 되므로, 회사 입장에서는 이 숫자가 곧 비용이다.","제38조는 이의신청이다. 인증 결과에 이의가 있으면 통지받은 날부터 30일 이내에 별지 제8호 서식으로 전자적 이의신청을 할 수 있다. 환경부장관은 받은 날부터 30일 이내에 별지 제9호 서식으로 결과를 통보하되, 부득이하면 30일 범위에서 연장하고 알려야 한다. 이의가 타당하면 배출량을 재산정해 다시 인증·통보한다. 별지 서식의 첨부 2 '배출량 재산정 내역서'는 사업장·배출시설별로 재산정 방법, 사유, 보수적 계산방법, 이의신청 전후 배출량을 적게 되어 있다.","제41조는 공개다. 명세서 공개에 관해 영에서 정하지 않은 사항은 탄소중립기본법 시행령 제21조제11항에 따른 고시를 준용하고, 그 고시의 '온실가스배출관리업체'는 '할당대상업체'로 본다. 제2조제38호의 주요정보 공개는 명세서의 주요 정보를 전자적 방식 등으로 국민에게 공개하는 것이고, 제11호의 온실가스정보공개심사위원회는 업체가 낸 비공개 신청서를 심사해 공개 여부를 정하는 위원회다. 즉 명세서는 원칙적으로 공개 대상이며, 영업비밀 등을 이유로 비공개를 신청하면 위원회가 판단한다.","마지막으로 이 책이 다루지 않은 것을 적어 둔다. 제출 전에 명세서를 확인하는 검증기관과 검증심사원, 검증 절차와 중요성 기준은 별도 고시인 「온실가스 배출권거래제 운영을 위한 검증지침」에 있고 다음 책에서 읽는다. 현대차 157쪽 검증의견서의 '합리적 보증수준'과 '중요성 평가 기준 2.5%'가 그 검증지침의 말이다. 이 책의 규칙으로 숫자를 만들고, 다음 책의 규칙으로 그 숫자가 확인된다."],"req":"인증 결과는 매년 5월 31일까지 통보되고 이행연도 종료 후 5개월 이내에 등록부에 등록되며, 이의신청은 30일 이내에 하고 30일 이내(30일 연장 가능)에 결과를 받으며, 명세서 주요정보는 원칙적으로 공개된다.","fig":{"cap":"명세서 제출 이후의 일정 (제29·37·38조, 법 제25조)","head":["단계","기한"],"rows":[["명세서 제출","이행연도 종료일부터 3개월 이내"],["시정명령 이행","명령일부터 14일 이내 기한"],["인증 결과 통보","매년 5월 31일까지(별지 제7호)"],["배출권등록부 등록","이행연도 종료일부터 5개월 이내(법 제25조제4항)"],["이의신청","통지받은 날부터 30일 이내(별지 제8호)"],["이의신청 결과 통보","신청받은 날부터 30일 이내, 30일 연장 가능(별지 제9호)"]]},"ex":{"k":"기아 보고서에서는","t":"155쪽 검증의견서에서 로이드인증원은 'ISO14064-3:2019 … 검증 절차를 활용하여 제한적 보증 수준 및 5%의 중요성 기준으로' 2025년도 온실가스 인벤토리를 검증했다고 적고, 156쪽 주석에서 국내 생산법인과 비생산시설의 Scope 1·2는 K-ETS에 따라 별도 검증된 결과를 반영했다고 밝혔다.","co":"kia","page":155},"terms":[{"t":"배출량 인증위원회","d":"적합성 평가 결과를 심의해 실제 배출량 인증을 결정하는 위원회다(법 제26조, 제4조제3호).","en":"Emissions Certification Committee"},{"t":"주요정보 공개","d":"할당대상업체 명세서의 주요 정보를 전자적 방식 등으로 국민에게 공개하는 것이다(제2조제38호).","en":"public disclosure of key information"},{"t":"배출권등록부","d":"배출권의 할당·거래·제출과 인증 배출량을 기록하는 전자 장부다.","en":"emissions trading registry"}]}],"write":{"q":"명세서가 부적합으로 평가되면 인증 배출량은 어떻게 정해지나?","must":[["재산정","재평가","다시"],["배출활동","배출계수"],["보수적","과소"]],"bonus":[["재계산","계산 오류"],["인증"]],"wrong":["보고한 값 그대로","전년도 값"],"model":"해당 배출활동과 배출계수 등을 재평가해 적합한 배출량을 재산정하되, 단순 오류는 재계산하고 필요하면 과소 산정되지 않도록 보수적 계산을 적용해 그 값을 인증한다.","src":"제33조제2항, 제2조제5호"},"check":{"q":"적합성 평가는 어느 할당대상업체에 대해 수행하나?","options":["표본으로 뽑힌 업체","배출량이 급증한 업체만","모든 할당대상업체"],"ans":2,"why":"제34조제2항은 적합성 평가를 모든 할당대상업체에 대하여 수행한다고 한다. 검증기관의 검증을 거친 명세서라도 전수로 다시 본다."},"summary":["명세서는 별지 제11호 서식으로 할당 사업장 단위로 작성해 검증을 거쳐 이행연도 종료 후 3개월 이내에 내며, 총괄표는 직접배출(Scope 1)·간접배출(Scope 2)과 에너지사용량(TJ)으로 구성된다.","적합성 평가는 모든 업체에 대해 재현 가능성 등 9항목으로 수행되고, 적합하면 보고량을, 부적합하면 재산정량을 인증하며 결과는 5월 31일까지 통보된다.","인증에 이의가 있으면 30일 이내에 신청하고, 미보고·거짓 보고는 별표 23 과태료와 직권산정 대상이며, 명세서 주요정보는 원칙적으로 공개된다."]}],"ver":[{"id":"v-1","title":"검증이란 무엇이고 누가 하나","range":"제1~8조, 별표 1","pages":[1,15],"min":15,"intro":"이 책은 「온실가스 배출권거래제 운영을 위한 검증지침」(기후에너지환경부 고시 제2025-165호, 2025년 10월 7일 시행)을 조문 순서대로 읽는다. 첫 회차에서는 검증이 무엇인지, 누가 관리하고 어떤 원칙으로 하는지, 그리고 전체 절차가 세 단계로 어떻게 이어지는지를 본다.","blocks":[{"no":"제1조","label":"이 지침은 무엇을 정하나","doc":"ver","pdfPage":1,"prose":["앞 책 「배출량 보고·인증 지침」은 할당대상업체가 명세서를 어떻게 만드는지를 정했다. 이 지침은 그 명세서를 남이 확인하는 규칙이다. 제1조는 이 지침이 배출권거래법 제24조와 제24조의2, 제24조의3 등에 근거해 검증기관의 지정·관리, 검증심사원의 관리, 검증업무의 세부사항을 정한다고 밝힌다. 즉 '누가 검증할 수 있나'와 '어떻게 검증하나'를 한 고시에 담았다.","배출권거래법 제24조 제1항은 할당대상업체가 매 이행연도 종료일부터 3개월 이내에 명세서를 주무관청에 보고하도록 한다. 그 명세서에는 검증기관의 검증보고서가 따라붙는다. 명세서 숫자는 그대로 배출권 제출 의무가 되므로, 숫자가 틀리면 돈이 틀린다. 그래서 회사가 스스로 낸 숫자를 외부가 한 번 더 확인하게 만든 것이다.","제1조에는 국제항공 탄소 배출량 관리에 관한 법률도 함께 적혀 있다. 부칙(제2024-169호)의 경과조치에서 보듯 국제항공 탄소 배출량(CORSIA) 검증도 이 지침이 함께 다루기 때문이다. 이 책은 할당대상업체의 명세서 검증에 집중하고, 외부사업 감축량 검증(별표 4·5)과 국제항공 부분은 다르다는 점만 짚고 넘어간다."],"req":"이 지침은 명세서를 외부가 확인하는 검증의 절차와, 검증기관·검증심사원의 자격과 관리를 정한다.","terms":[{"t":"할당대상업체","d":"배출권거래제에 들어와 배출권을 할당받고 배출량만큼 제출해야 하는 업체다.","en":"allocated entity"},{"t":"명세서","d":"할당대상업체가 1년 동안 실제 배출한 온실가스 양을 산정계획서 기준으로 정리해 주무관청에 내는 보고서다.","en":"emissions report (statement)"}]},{"no":"제2조","label":"검증, 리스크, 중요성, 합리적 보증","doc":"ver","pdfPage":1,"prose":["제2조 제1호는 검증을 '온실가스 배출량의 산정이 이 지침에서 정하는 절차와 기준에 적합하게 이루어졌는지를 검토·확인하는 체계적이고 문서화된 일련의 활동'이라고 정한다. 핵심은 두 단어다. '체계적'은 정해진 절차를 따른다는 뜻이고, '문서화된'은 무엇을 보고 어떻게 판단했는지 기록을 남긴다는 뜻이다. 검증받는 쪽은 피검증자(제14호)라고 부른다.","제8호 리스크는 검증기관이 오류를 놓쳐 잘못된 검증의견을 낼 위험이다. 제13호 중요성은 배출량 최종 확정에 영향을 미치는 오류·누락·허위 기록의 정도다. 이 둘이 검증의 뼈대다. 검증팀은 리스크가 큰 곳을 더 꼼꼼히 보고, 발견한 오류를 모아 중요성 기준(5회차)과 비교해 의견을 정한다. 작은 오류가 있어도 중요성 기준 미만이면 '적정'이 나올 수 있다.","제15호 합리적 보증은 검증기관이 결론을 적극적인 형태로 표명하면서 관련 리스크가 수용 가능한 수준 이하임을 보증하는 것이다. '잘못된 점을 발견하지 못했다'(소극적)가 아니라 '적절하게 산정되었다'(적극적)라고 말하는 수준이다. 공통 기초 책에서 본 제한적 보증보다 한 단계 높은 보증이며, 국내 명세서 검증은 이 수준을 요구한다."],"req":"검증은 절차에 따라 기록을 남기며 확인하는 활동이고, 명세서 검증은 합리적 보증 수준으로 한다.","quote":"\"합리적 보증\"이란 검증기관(검증심사원을 포함한다)이 검증결론을 적극적인 형태로 표명함에 있어 검증과정에서 이와 관련된 리스크가 수용 가능한 수준 이하임을 보증하는 것을 말한다.","terms":[{"t":"리스크","d":"검증기관이 오류를 놓쳐 잘못된 검증의견을 낼 위험의 정도다.","en":"risk"},{"t":"중요성","d":"배출량 최종 확정에 영향을 미치는 오류·누락·허위 기록의 정도로, 총배출량 대비 비율로 기준을 정한다.","en":"materiality"},{"t":"합리적 보증","d":"리스크를 수용 가능한 수준 이하로 낮춘 뒤 적극적인 형태로 결론을 표명하는 보증 수준이다.","en":"reasonable assurance"}]},{"no":"제4조","label":"누가 관리하나: 기후에너지환경부, 국립환경과학원, 국립환경인재개발원","doc":"ver","pdfPage":2,"prose":["제4조는 주무관청인 기후에너지환경부장관이 검증기관 지정·관리와 검증심사원 교육·양성·관리를 맡고, 이 일을 국립환경과학원장과 국립환경인재개발원장에게 위탁할 수 있다고 정한다. 실제로 뒤 조문을 보면 검증기관 지정·변경·평가는 국립환경과학원장이 하고(제21~26조), 검증심사원 교육은 국립환경인재개발원이 한다는 것이 제32조에 적혀 있다. 실무에서 검증기관 명단이나 심사원 교육 일정을 찾을 때 어느 기관 홈페이지를 봐야 하는지가 여기서 갈린다.","제3조는 이 지침에 없는 사항은 국제표준화기구(ISO)가 승인한 국제규격 등 국제적으로 통용되는 기준을 준용한다고 정한다. 별표 6에서 보듯 ISO 14064-3(온실가스 검증 규칙)과 ISO 14065(검증기관 요구사항)가 그 바탕이다. 제5조는 검증 과정에서 얻은 정보를 다른 용도로 쓰거나 밖으로 내보내면 안 된다는 비밀 준수 의무를, 제6조는 주무관청이 검증기관에 자료 제출을 요청할 수 있음을 정한다."],"req":"검증기관 지정·관리는 국립환경과학원, 검증심사원 교육은 국립환경인재개발원이 맡고, 지침에 없는 것은 ISO 기준을 준용한다.","terms":[{"t":"주무관청","d":"배출권거래제를 총괄하는 행정기관으로, 이 지침에서는 기후에너지환경부장관이다.","en":"competent authority"}]},{"no":"제7조","label":"검증의 네 가지 기본원칙","doc":"ver","pdfPage":3,"prose":["제7조는 검증기관이 지켜야 할 원칙 네 가지를 든다. 첫째, 객관적인 자료와 증거, 관련 규정에 따라 사실에 근거해 검증하고 그 내용을 정확하게 기록한다. 둘째, 피검증자나 관계인의 의견을 충분히 듣는다. 셋째, 외부사업 감축량 검증은 보수적인 관점으로 평가한다. 넷째, 합리적 보증이 가능한 수준으로 검증한다.","첫째 원칙이 실무에서 가장 크게 느껴진다. 검증팀은 담당자의 말만으로는 넘어가지 않고 고지서, 계량 기록, 분석 성적서 같은 증거를 요구한다. 제8조는 검증기관이 필요한 자료 제출을 요구할 수 있고 피검증자는 특별한 사정이 없는 한 따라야 한다고 못 박는다. 둘째 원칙은 그 반대편의 균형이다. 검증팀이 일방적으로 결론을 내리지 않고 회사의 설명을 들어야 한다.","셋째 원칙의 '보수적'은 감축량을 의심스러울 때 적게 잡는다는 뜻이다. 감축량은 많이 인정될수록 사업자에게 이익이므로 과대 산정을 막기 위해서다. 명세서 검증에는 이 원칙이 따로 적용되지 않는데, 배출량은 많게도 적게도 틀리면 안 되는 숫자이기 때문이다. 넷째 원칙은 앞 블록에서 본 합리적 보증을 모든 검증의 기본 수준으로 못 박은 것이다."],"req":"검증은 증거에 근거해 기록하고, 피검증자 의견을 듣고, 감축량은 보수적으로, 합리적 보증 수준으로 수행한다.","terms":[{"t":"외부사업","d":"할당대상업체의 조직경계 밖에서 온실가스를 줄이거나 흡수하는 사업으로, 감축량을 인증받아 상쇄배출권으로 바꿀 수 있다.","en":"offset project"}]},{"no":"별표 1","label":"검증절차 3단계 한눈에 보기","doc":"ver","pdfPage":15,"prose":["별표 1은 검증 전체를 3단계 7절차로 그린 표다. 1단계는 검증개요 파악과 검증계획 수립이다. 회사 현황과 검증 범위를 알고, 리스크를 분석해 어디를 얼마나 볼지 계획을 세운다. 2단계는 문서검토와 현장검증이다. 명세서와 산정계획을 책상에서 뜯어보고, 사업장에 가서 데이터와 측정기기를 확인한다. 3단계는 검증결과 정리 및 평가, 내부심의, 검증보고서 제출이다.","표의 오른쪽 열 '수행주체'를 보면 1·2단계는 모두 '검증팀 + 피검증자'다. 검증은 검증팀이 혼자 하는 일이 아니라 회사가 자료를 내고 설명하며 함께 진행하는 일이라는 뜻이다. 반면 3단계의 내부심의는 내부심의팀, 즉 검증에 참여하지 않은 검증기관 소속 심사원이 한다. 이 3단계 구조는 산정계획서 검증(별표 2)과 명세서 검증(별표 3)에 똑같이 적용된다.","컨설턴트가 이 표를 외워야 하는 이유가 있다. 검증기관이 지금 어느 단계에 있는지 알면 무엇을 준비해야 하는지가 정해진다. 1단계면 조직도·공정도·전년 명세서, 2단계 문서검토면 산정 시트와 근거 자료, 현장검증이면 계량기 검교정 성적서와 담당자 인터뷰 일정이다. 3회차부터 각 단계를 자세
