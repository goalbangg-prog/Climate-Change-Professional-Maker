],"rows":[["물리적 위험(급성)","기상 사건으로 갑자기 생기는 위험","태풍, 홍수, 가뭄, 폭염"],["물리적 위험(만성)","기후 패턴의 장기 변화로 생기는 위험","해수면 상승, 수자원 감소"],["전환 위험","저탄소 경제로 바뀌는 과정의 위험","정책·법률·기술·시장·평판"],["기회","기후 대응 노력에서 생기는 긍정적 영향","저탄소 제품 수요 증가"]]},"ex":{"k":"기아 보고서에서는","t":"태풍·폭우(급성 물리적 위험), 국내·유럽 배출권거래제 강화와 자동차 연비 규제 강화(전환 위험), 전동화 차량 관련 수요 증가와 재생에너지 조달 확대(기회)를 한 표로 분류했다.","co":"kia","page":25},"terms":[{"t":"전환 위험","d":"저탄소 경제로 전환하려는 노력에서 생기는 위험이다.","en":"transition risk"},{"t":"물리적 위험","d":"기상 사건이나 기후 패턴의 장기 변화로 생기는 위험이다.","en":"physical risk"}]},{"no":"3A","label":"공시할 중요한 정보가 없을 때: 사실과 근거 공시 (KSSB 고유)","pdfPage":5,"prose":["문단 3A는 IFRS S2에 없고 KSSB가 직접 넣은 문단이다. 기후 위험·기회에 대한 중요한 정보가 없다고 판단해 제2호에 따른 공시를 생략한다면, 생략한다는 사실과 그 근거를 밝혀야 한다. 결론도출근거 BC179의 'IFRS S2와의 차이' 표도 이 항목을 첫 줄에 두었다. 결론도출근거는 위원회가 무엇을 왜 그렇게 정했는지 설명한 부분이다.","BC27은 '공시할 정보가 없는 것'과 '공시를 빠뜨린 것'을 구분할 필요가 있다고 설명한다. BC30은 KSSB 제1호가 기후 정보는 공시하게 하면서 기후 외 주제는 기업이 선택하게 했다는 점을 든다. 기후는 기본으로 요구되는 주제이므로, 아무것도 공시하지 않는다면 단순 누락이 아님을 이용자와 규제당국에 알려야 한다는 논리다.","BC29는 근거를 쓸 때 판단 과정을 구체적이고 상세하게 설명하라는 뜻은 아니라고 밝히고, 기후 위험에 취약한 유의적인 자산이나 사업이 없는 소수 기업에만 적용될 것으로 보았다. 그러니 3A는 빈 공시를 허용하는 문이라기보다 빈 공시에도 설명을 붙이라는 규칙으로 이해하면 된다. 다만 왜 중요하지 않다고 보았는지를 짧게라도 설명할 수 있어야 한다는 점은 변하지 않는다."],"req":"기후 위험·기회에 대한 중요한 정보가 없어 공시를 생략하면, 생략한다는 사실과 그 근거를 공시해야 한다.","quote":"기업이 기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 있는 기후 관련 위험 및 기회에 대한 중요한 정보가 없어 이 기준서에 따른 공시를 생략하는 경우, 기업은 그러한 사실 및 근거를 공시한다.","terms":[{"t":"결론도출근거","d":"기준서를 만들 때 위원회가 고려한 사항을 요약한 부분으로, 기준서의 일부를 구성하지는 않는다.","en":"Basis for Conclusions"}]}],"write":{"q":"문단 3A가 요구하는 것을 한 문장으로 쓰라.","must":[["생략","공시하지 않"],["사실","그런 점"],["근거","이유"]],"bonus":[["중요한 정보","중요성"]],"wrong":["IFRS S2에도 같은 문단이 있다","근거로 판단 과정을 상세히 모두 적어야 한다"],"model":"기후 관련 위험·기회에 대한 중요한 정보가 없어 공시를 생략하는 경우 그 사실과 근거를 공시해야 한다.","src":"문단 3A"},"check":{"q":"문단 3A에 대한 설명으로 맞는 것은?","options":["IFRS S2 문단을 그대로 옮긴 것이다","공시를 생략하는 기업은 그 사실과 근거를 밝혀야 한다","기후 정보가 중요하지 않으면 아무것도 쓰지 않아도 된다"],"ans":1,"why":"3A는 KSSB가 추가한 문단으로(BC179 표), 공시를 생략할 때도 사실과 근거를 공시하게 한다."},"summary":["제2호의 목적은 투자자·대여자·채권자의 자원 제공 판단에 쓸모 있는 기후 정보를 공시하게 하는 것이다.","대상은 현금흐름·자금조달 접근성·자본비용에 영향을 줄 것으로 합리적으로 예상되는 물리적 위험·전환 위험·기회다.","KSSB 고유 문단 3A에 따라 공시를 생략할 때도 그 사실과 근거를 밝혀야 한다."]},{"id":"k2-2","title":"거버넌스","range":"문단 5~7","pages":[6,7],"min":13,"intro":"기후 위험과 기회를 누가 감독하고 경영진이 어떤 역할을 하는지 공시하는 문단을 읽는다. 위원회 이름만 적는 것이 아니라 책임이 규정에 어떻게 반영되는지, 얼마나 자주 보고받는지까지 묻는다는 점이 중요하다.","blocks":[{"no":"5","label":"거버넌스 공시의 목적","pdfPage":6,"prose":["문단 5는 거버넌스 공시의 목적을 정한다. 이용자가 기업이 기후 위험과 기회를 모니터링·관리·감독하는 데 쓰는 거버넌스 프로세스, 통제, 절차를 이해하게 하는 것이다. 거버넌스는 쉽게 말해 '누가 책임지고, 누가 결정하고, 누가 점검하는가'의 체계다. 투자자는 이 체계를 보고 회사가 기후 문제를 일회성 행사로 다루는지, 경영의 정규 업무로 다루는지 가늠한다.","기후 공시가 거버넌스부터 시작하는 이유는 나머지 공시의 신뢰도가 여기에 달려 있기 때문이다. 멋진 감축 목표가 있어도 그것을 감독하는 기구가 없다면 목표가 지켜질지 알 수 없다. 그래서 제2호는 제1호와 같은 순서로 거버넌스, 전략, 위험관리, 지표 및 목표의 네 핵심요소를 차례로 다룬다. BC33은 일관되고 비교가능한 공시를 위해 제1호와 제2호 양쪽 모두에 거버넌스 요구사항을 적어 두었다고 설명한다.","신입이 거버넌스 공시를 검토할 때는 세 가지를 먼저 확인하면 된다. 첫째, 감독 기구의 이름과 책임의 근거 규정이 있는지 본다. 둘째, 보고 주기가 '반기 1회'처럼 구체적으로 적혀 있는지 본다. 셋째, 경영진의 실행 조직과 이사회의 감독이 어떻게 이어지는지 그림이나 문장으로 나와 있는지 본다. 이 셋은 문단 6⑴㈎·㈐와 6⑵에 바로 대응하므로, 빠진 칸이 있으면 보완 대상이다."],"req":"이용자가 기후 위험·기회를 감독·관리하는 거버넌스 프로세스, 통제, 절차를 이해할 수 있게 공시한다.","terms":[{"t":"거버넌스","d":"기업 안에서 책임과 결정, 감독이 이루어지는 체계다.","en":"governance"}]},{"no":"6⑴","label":"감독 기구(이사회 등)에 대한 다섯 가지 질문","pdfPage":6,"prose":["문단 6⑴은 기후 위험·기회를 감독할 책임이 있는 의사결정기구나 개인을 밝히라고 한다. 이사회나 이사회 안의 위원회가 대표적이다. 그리고 다섯 가지를 묻는다. ㈎ 그 책임이 운영규정·위임권한·직무기술서 같은 문서에 어떻게 반영되는지, ㈏ 감독에 필요한 기량과 역량이 있는지 또는 키울 것인지 어떻게 판단하는지, ㈐ 기후 정보를 어떻게, 얼마나 자주 보고받는지다.","나머지는 ㈑ 전략, 주요 거래, 위험관리 정책을 감독할 때 기후 위험·기회를 어떻게 고려하는지(서로 부딪치는 선택지 사이의 절충 포함), ㈒ 기후 목표 설정을 어떻게 감독하고 진척도를 어떻게 모니터링하는지다. ㈒에는 관련 성과지표가 보상정책에 포함되는지와 그 방식도 들어가며, 지표 문단 29⑺ 보상과 연결된다. 목표를 누가 정했는지뿐 아니라 그 목표가 경영진 평가와 보상에 이어지는지까지 묻는 셈이다.","현대자동차 보고서는 기후 위험·기회를 감독하는 최상위 의사결정기구를 이사회 산하 지속가능경영위원회로 밝히고, 위원회 규정과 환경경영 정책에 명시된 위임권한을 근거로 들었으며, 기후변화를 포함한 ESG 현안을 반기마다 논의한다고 적었다. ㈎와 ㈐에 함께 답하는 문장이다. 또 2025년 지속가능경영위원회와 이사회의 주요 안건을 표로 정리하고 안건마다 기후 관련 위험·기회 고려 사항을 함께 적어 ㈑를 보여 주었다."],"req":"기후 감독 기구나 개인을 밝히고, 책임의 문서화·역량 판단·보고 방식과 빈도·전략 감독 시 고려·목표 감독과 보상 연계를 공시한다.","fig":{"cap":"문단 6⑴이 감독 기구에 묻는 것","head":["항목","질문"],"rows":[["㈎","책임이 규정·위임권한·직무기술서에 어떻게 반영되는가"],["㈏","감독할 기량과 역량이 있는지 어떻게 판단하는가"],["㈐","기후 정보를 어떻게, 얼마나 자주 보고받는가"],["㈑","전략·주요 거래·위험관리 감독 때 기후를 어떻게 고려하는가(절충 포함)"],["㈒","목표 설정을 어떻게 감독하고 진척도를 어떻게 보는가(보상 연계 포함)"]]},"ex":{"k":"현대자동차 보고서에서는","t":"최상위 감독 기구를 이사회 산하 지속가능경영위원회로 밝히고, ‘지속가능경영위원회 규정’ 제3조와 ‘환경경영 정책’의 위임권한을 근거로 들며, 기후변화를 포함한 ESG 주요 현안을 반기마다 논의한다고 적었다.","co":"hyundai","page":22},"terms":[{"t":"절충","d":"한쪽을 얻으려면 다른 쪽을 일부 포기해야 하는 관계다.","en":"trade-off"},{"t":"위임권한","d":"위원회나 사람이 공식적으로 넘겨받은 권한이다.","en":"mandates"}]},{"no":"6⑵","label":"경영진의 역할","pdfPage":7,"prose":["문단 6⑵는 이사회 아래에서 실제로 일을 굴리는 경영진의 역할을 묻는다. ㈎ 그 역할이 특정 경영진 직책이나 경영진 위원회에 맡겨져 있는지와 그 직책이나 위원회가 어떻게 감독받는지, ㈏ 경영진이 감독을 돕기 위해 통제와 절차를 쓰는지와 그것이 다른 내부 기능과 어떻게 이어지는지를 공시한다. ㈏의 통제와 절차는 경영진이 실행을 확인하는 장치를 말하며, 기아 보고서가 적은 생산사업장 대상 연 4회 정기 점검이 그런 예다.","이사회는 방향을 정하고 점검하는 곳이고, 경영진은 실행을 책임지는 곳이다. 투자자는 두 층이 끊기지 않고 연결되는지를 보고 싶어 한다. 기아 보고서는 기업전략실장이 기후변화 대응 전략의 수립과 실행을 총괄해 주요 사항을 CEO에게 보고하고, CEO가 지속가능경영위원회 위원으로 참여해 경영진의 실행과 이사회의 감독을 잇는다고 설명했다. ㈎의 '어느 직책에 맡겼는가'에 대한 답의 예다."],"req":"기후 관련 경영진 역할이 어떤 직책·위원회에 위임되는지, 어떤 통제와 절차를 쓰며 다른 기능과 어떻게 통합되는지 공시한다.","ex":{"k":"기아 보고서에서는","t":"기업전략실장이 기후변화 대응 전략의 수립과 실행을 총괄해 CEO에게 보고하고, CEO가 지속가능경영위원회 위원으로 참여해 경영진 실행과 이사회 감독을 연계한다고 적었다.","co":"kia","page":24}},{"no":"7","label":"제1호와 겹치는 내용은 한 번만","pdfPage":7,"prose":["문단 7은 불필요한 중복을 피하라고 한다. 기업이 기후뿐 아니라 여러 지속가능성 주제를 하나의 위원회가 통합해 감독한다면, 주제마다 같은 설명을 되풀이하지 않고 통합된 거버넌스를 한 번에 공시해도 된다. 근거는 제1호 문단 B42⑵다. BC33도 많은 기업이 기후를 다른 지속가능성 주제와 묶어 거버넌스를 구성한다는 점을 든다.","같은 위원회 설명이 기후 장, 인권 장, 공급망 장에 조금씩 다르게 반복되면 독자는 오히려 헷갈린다. 다만 통합해 쓰더라도 문단 6이 묻는 항목, 예를 들어 기후 정보를 얼마나 자주 보고받는지는 빠짐없이 들어가야 한다는 점을 잊지 않는다. 통합해 쓸 때는 독자가 기후에 해당하는 감독 내용을 찾을 수 있도록 위치를 분명히 해 두면 이해가 쉬워진다."],"req":"지속가능성 감독을 통합 관리하면 주제별로 반복하지 않고 통합된 거버넌스를 공시해 중복을 피한다."}],"write":{"q":"문단 6⑴㈐는 감독 기구에 대해 무엇을 공시하라고 하는가?","must":[["보고","안내"],["어떻게","방식","방법"],["얼마나 자주","빈도","주기"]],"bonus":[["기후 관련 위험","기후 위험"]],"wrong":["위원회 이름만 적으면 된다"],"model":"감독 기구가 기후 위험·기회에 대한 정보를 어떻게 보고받는지와 얼마나 자주 보고받는지를 공시해야 한다.","src":"문단 6⑴㈐"},"check":{"q":"다음 중 문단 6⑵(경영진의 역할)에 해당하는 것은?","options":["이사회 위원의 기후 역량을 어떻게 판단하는지","기후 역할이 특정 경영진 직책이나 위원회에 위임되었는지","보고기간의 스코프 1 배출량"],"ans":1,"why":"6⑵㈎는 경영진 수준 직책이나 위원회에 대한 위임과 그 감독 방식을 묻는다. 첫째는 6⑴㈏, 셋째는 문단 29의 내용이다."},"summary":["거버넌스 공시는 기후 위험·기회를 누가 어떻게 감독하는지 이해하게 하는 것이 목적이다.","감독 기구에 대해 책임의 문서화, 역량, 보고 방식과 빈도, 전략 감독 시 고려, 목표 감독과 보상 연계를 공시한다.","경영진 역할의 위임과 통제 절차도 공시하며, 통합 감독이라면 중복 없이 한 번에 쓸 수 있다."]},{"id":"k2-3","title":"전략 ① 위험·기회와 기간범위","range":"문단 8~10B","pages":[8,9],"min":14,"intro":"전략 공시의 큰 틀(문단 9)과 위험·기회를 기술하는 방법(문단 10)을 읽는다. KSSB만의 문단 10A·10B는 단기·중기·장기를 어떻게 정할지 다루며, 기준서가 제시한 기본 기간을 골라 쓸 수 있게 했다.","blocks":[{"no":"9","label":"전략 공시의 다섯 갈래","pdfPage":8,"prose":["문단 8은 전략 공시의 목적을 기후 위험·기회를 관리하는 기업의 전략을 이해하게 하는 것으로 정하고, 문단 9는 내용을 다섯 갈래로 나눈다. ⑴ 어떤 위험·기회가 있는지, ⑵ 사업모형과 가치사슬에 주는 영향, ⑶ 전략과 의사결정에 주는 영향(전환 계획 포함), ⑷ 재무상태·재무성과·현금흐름에 주는 영향, ⑸ 전략과 사업모형의 기후 회복력이다. 다섯 갈래는 서로 이어져 있어서, 앞에서 찾은 위험이 뒤의 재무 영향과 회복력 평가에서도 같은 이름으로 다시 나와야 읽기 쉽다.","이 다섯 칸은 공시의 빈칸을 찾는 체크리스트로 쓰기 좋다. 위험 목록은 있는데 매출이나 자산에 주는 영향이 없다면 ⑷가 비어 있는 것이다. 재무 영향 숫자는 있는데 회사가 어떻게 대응할지가 없다면 ⑶이 약한 것이다. 이 교재의 k2-3부터 k2-6까지도 이 순서를 따른다. 문단 9는 목차 역할을 하므로, 각 갈래의 세부 요구는 괄호 안에 적힌 문단에서 확인한다."],"req":"위험·기회, 사업모형·가치사슬 영향, 전략·의사결정 영향, 재무적 영향, 기후 회복력을 이해할 수 있는 정보를 공시한다.","fig":{"cap":"문단 9의 다섯 갈래와 세부 문단","head":["갈래","내용","세부 문단"],"rows":[["⑴","위험·기회","10~12"],["⑵","사업모형·가치사슬 영향","13"],["⑶","전략·의사결정 영향(전환 계획)","14"],["⑷","재무적 영향","15~21"],["⑸","기후 회복력","22"]]}},{"no":"10","label":"위험·기회를 기술하는 네 가지 방법","pdfPage":8,"prose":["문단 10은 위험·기회를 어떻게 적을지 정한다. ⑴ 기업 전망에 영향을 줄 것으로 합리적으로 예상되는 위험·기회를 기술하고, ⑵ 각 위험을 물리적 위험과 전환 위험 중 무엇으로 보았는지 설명하며, ⑶ 각 위험·기회의 영향이 단기·중기·장기 중 언제 나타날 것으로 예상하는지 명시한다. ⑷ 그리고 단기·중기·장기를 어떻게 정의했는지, 그 정의가 전략적 의사결정에 쓰는 계획기간과 어떻게 이어지는지 설명한다.","⑶과 ⑷가 핵심이다. 내년에 닥칠 수 있는 태풍 위험과 20년 뒤에 커질 위험은 투자자에게 다른 의미다. 또 회사가 말하는 '중기'가 3년인지 10년인지 모르면 숫자를 비교할 수 없다. 기아와 현대자동차 보고서는 모두 위험·기회 표에 항목마다 단기·중기·장기 칸을 두어 영향 예상 시점을 표시했다. 표 하나로 ⑴~⑶을 함께 보여 주는 방식이다.","실무에서 흔한 빈칸은 위험 표에 '중기'라고만 표시하고 중기가 몇 년인지는 정의하지 않는 경우다. 이러면 ⑶은 채웠지만 ⑷는 비어 있다. 또 사업계획은 3년 단위로 세우면서 기후 위험의 중기를 10년으로 정했다면 둘이 어떻게 연결되는지 설명이 필요하다. ⑷가 계획기간과의 연계를 따로 묻는 이유가 여기에 있다. 검토할 때는 표의 기간 칸과 기간 정의 문장을 나란히 놓고 확인한다."],"req":"각 위험·기회를 기술하고, 물리적·전환 구분, 영향 시기(단·중·장기), 기간 정의와 계획기간의 연계를 설명한다.","ex":{"k":"기아 보고서에서는","t":"물리적·전환 위험과 기회를 한 표에 정리하고, 항목마다 영향 예상 시점을 단기·중기·장기 칸에 표시했다.","co":"kia","page":25}},{"no":"10A","label":"기간범위는 기업마다 다를 수 있다 (KSSB 고유)","pdfPage":9,"prose":["문단 10A는 KSSB가 더한 설명 문단이다. 단기·중기·장기의 길이는 기업마다 다를 수 있고, 산업의 특징을 비롯한 여러 요소에 따라 달라질 수 있다고 적는다. 예로 든 요소는 현금흐름, 투자 및 사업주기, 산업에서 통용되는 전략·자본할당 계획기간, 그리고 투자자가 그 산업의 기업을 평가하는 기간범위다. 투자자가 그 산업의 기업을 평가하는 기간까지 고려 요소로 든 점이 눈에 띈다.","발전소처럼 설비를 수십 년 쓰는 산업과 해마다 신제품을 내는 산업은 '장기'의 감각이 다르다. 현대자동차 보고서는 기후 위험·기회 관리에 적용하는 기간을 단기 0-3년, 중기 3-10년, 장기 10-25년으로 정했다. 이렇게 스스로 정한 경우에는 문단 10⑷에 따라 그 정의가 회사의 계획기간과 어떻게 연계되는지를 설명해야 한다. 자체 정의는 다른 회사와 비교하기 어렵다는 단점이 있지만 회사의 실제 계획과 맞출 수 있다는 장점이 있다."],"req":"단기·중기·장기의 길이는 산업 특성과 투자·계획 주기 등에 따라 기업마다 다를 수 있다.","ex":{"k":"현대자동차 보고서에서는","t":"기후 위험·기회의 식별·평가·관리에 적용하는 기간을 단기(0-3년), 중기(3-10년), 장기(10-25년)로 정했다.","co":"hyundai","page":23}},{"no":"10B","label":"기본 기간범위를 골라 쓸 수 있다 (KSSB 고유)","pdfPage":9,"prose":["문단 10B는 10⑷와 10A에도 불구하고, 기업이 보고기간 말 이후 단기 1년 이내, 중기 1년 초과 5년 이내, 장기 5년 초과를 기간범위로 사용할 수 있다고 정한다. '사용할 수 있다'이므로 의무가 아니라 선택이다. 이 기본 기간을 쓰면 10⑷의 정의 설명 대신 기준서에서 정의한 기간범위를 사용했다는 사실을 공시한다. 즉 기업은 10B의 기본값을 쓰거나, 스스로 정의하고 10⑷의 설명을 붙이는 두 길 중 하나를 고른다.","IFRS S2는 단기·중기·장기를 정의하지 않는다. BC40에 따르면 KSSB는 기준서가 기간을 제시하면 기업들이 같은 기간에 대한 정보를 내게 되어 비교가능성이 좋아질 수 있다고 보았고, 동시에 기업 사정을 고려해 자체 정의도 쓸 수 있게 했다. 비교가능성은 서로 다른 회사의 숫자를 나란히 놓고 비교할 수 있는 정도를 말한다.","기아 보고서는 단기를 1년 이내(2025~2026년), 중기를 1년 초과 5년 이내(2027~2031년), 장기를 5년 초과(2032~2045년)로 정의했다. 같은 그룹의 두 회사가 서로 다른 기간을 쓴 셈이어서, 기본 기간이 있으면 비교가 얼마나 쉬워지는지를 보여 준다. BC179의 비교표도 기간범위 정의를 IFRS S2와의 차이 중 하나로 적고 있다."],"req":"단기 1년 이내·중기 1~5년·장기 5년 초과를 선택해 쓸 수 있으며, 그렇게 하면 기준서의 기간범위를 사용했다는 사실을 공시한다.","quote":"기업이 정의된 기간범위를 사용하는 경우, 문단 10⑷에 대한 공시 요구사항 대신 이 기준서에서 정의한 기간범위를 사용하였음을 공시한다.","fig":{"cap":"기간범위 비교","head":["구분","10B 기본값(선택)","기아(25쪽)","현대자동차(23쪽)"],"rows":[["단기","1년 이내","1년 이내(2025~2026년)","0-3년"],["중기","1년 초과 5년 이내","1년 초과 5년 이내(2027~2031년)","3-10년"],["장기","5년 초과","5년 초과(2032~2045년)","10-25년"]]},"ex":{"k":"기아 보고서에서는","t":"단기·중기·장기를 1년 이내, 1년 초과 5년 이내, 5년 초과로 정의하고, 단기 정의의 근거로 ‘KSSB 1호 기준서에서 정의하는 단기 기간 차용’이라고 적었다.","co":"kia","page":25},"terms":[{"t":"비교가능성","d":"서로 다른 기업이나 기간의 정보를 나란히 놓고 비교할 수 있는 정도다.","en":"comparability"}]}],"write":{"q":"문단 10B의 기본 기간범위를 쓰는 기업은 무엇을 공시하면 되는가?","must":[["1년","단기"],["5년","장기"],["사용하였음","사용했다는 사실","사용한 사실"]],"bonus":[["10⑷","정의 설명 대신"]],"wrong":["모든 기업이 10B의 기간을 반드시 써야 한다","IFRS S2도 같은 기간을 정의한다"],"model":"단기 1년 이내, 중기 1년 초과 5년 이내, 장기 5년 초과의 기준서 기간범위를 사용하였음을 공시하면 된다.","src":"문단 10B"},"check":{"q":"문단 10B에 대한 설명으로 맞는 것은?","options":["모든 기업이 반드시 1년·5년 기준을 써야 한다","기업은 기본 기간을 선택해 쓸 수 있고 자체 정의를 써도 된다","IFRS S2에 있는 정의를 옮겨 온 것이다"],"ans":1,"why":"10B는 '사용할 수 있다'로 끝나는 선택 규정이고(BC40), IFRS S2는 기간을 정의하지 않는다(BC179 표)."},"summary":["문단 9는 전략 공시를 위험·기회, 사업모형·가치사슬, 전략·의사결정, 재무 영향, 회복력의 다섯 갈래로 나눈다.","문단 10은 각 위험·기회의 성격과 영향 시기, 그리고 단기·중기·장기의 정의와 계획기간의 연계를 묻는다.","KSSB는 10A·10B를 더해 기간이 기업마다 다를 수 있음을 인정하면서, 1년·5년 기준의 기본 기간을 선택해 쓸 수 있게 했다."]},{"id":"k2-4","title":"전략 ② 사업모형·가치사슬, 전략과 의사결정(전환계획)","range":"문단 11~14","pages":[9,11],"min":15,"intro":"위험·기회를 찾을 때 어떤 정보를 쓰는지(11~12), 그 위험·기회가 사업모형과 가치사슬, 전략과 의사결정에 어떤 영향을 주는지(13~14)를 읽는다. 문단 14에는 기후 관련 전환 계획이 들어 있다.","blocks":[{"no":"11","label":"식별할 때 쓰는 정보: 과도한 원가나 노력 없이","pdfPage":9,"prose":["문단 11은 위험·기회를 식별할 때 '보고일에 과도한 원가나 노력 없이 이용할 수 있는 합리적이고 뒷받침될 수 있는 모든 정보'를 쓰라고 한다. 뜻은 두 가지다. 근거를 보여 줄 수 있는 정보를 쓰되, 그 정보를 얻으려고 끝없이 비용을 들일 필요는 없다는 것이다. 과거 사건, 현재 상황, 미래 예측 정보가 모두 포함된다. 이미 가진 사업장 피해 기록, 권위 있는 기관이 공개한 기후 시나리오, 외부 자료가 모두 여기에 들 수 있다.","이 표현은 문단 18, 30, B8 등 제2호 곳곳에 반복된다. 기업 규모와 상관없이 같은 잣대를 쓰되, 각자 합리적으로 구할 수 있는 수준에서 작성하라는 안전장치다. '합리적이고 뒷받침될 수 있는'은 '근거를 들 수 있는', '과도한 원가나 노력 없이'는 '무리한 추가 조사 없이'로 바꿔 읽으면 된다. BC42는 가치사슬 범위를 정할 때도 같은 기준을 써서 기업이 고려할 정보의 범위와 노력에 한도를 두었다고 설명한다."],"req":"위험·기회 식별에는 보고일에 과도한 원가나 노력 없이 구할 수 있는 근거 있는 모든 정보(과거·현재·미래 예측)를 쓴다.","terms":[{"t":"합리적이고 뒷받침될 수 있는 정보","d":"근거를 들어 설명할 수 있는 정보다.","en":"reasonable and supportable information"},{"t":"과도한 원가나 노력 없이","d":"무리하게 큰 비용이나 추가 조사를 들이지 않고라는 뜻이다.","en":"without undue cost or effort"}]},{"no":"12","label":"산업기반 지침은 '참고할 수 있다'","pdfPage":10,"prose":["문단 12는 위험·기회를 식별할 때 ISSB가 발표한 'IFRS S2 이행에 관한 산업기반 지침'의 산업기반 공시 주제를 참고할 수 있다고 한다. 이 지침은 SASB 기준에서 나온 것으로(BC153), 자동차·은행·전력처럼 산업별로 흔히 중요한 기후 주제를 정리해 둔 자료다. 비슷한 회사들이 무엇을 위험으로 보는지 확인하는 체크리스트로 쓰기 좋다.","주의할 점은 표현의 강도다. BC179의 비교표는 IFRS S2가 산업기반 지침의 '적용가능성을 고려'하게 하는 것과 달리 KSSB는 '참고할 수 있음'으로 한다고 정리한다. KSSB에서는 이 지침을 쓰지 않았다고 기준 위반이 되지 않는다. 기아 보고서는 위험·기회 식별 때 이 지침의 공시 주제 중 'Automobiles' 주제를 참고했다고 밝혀 식별 범위를 가늠하게 해 주었다."],"req":"위험·기회 식별 시 IFRS S2 산업기반 지침의 공시 주제를 참고할 수 있다(선택).","ex":{"k":"기아 보고서에서는","t":"위험·기회를 식별할 때 IFRS S2 이행에 관한 산업기반 지침의 산업기반 공시 주제 중 ‘Automobiles’ 주제를 참고했다고 밝혔다.","co":"kia","page":25}},{"no":"13","label":"사업모형과 가치사슬에 주는 영향","pdfPage":10,"prose":["문단 13은 기후 위험·기회가 사업모형과 가치사슬에 주는 현재 영향과 예상 영향을 기술하고, 위험·기회가 집중된 부분을 밝히라고 한다. 사업모형은 회사가 원료와 사람, 돈을 넣어 제품과 이익을 만들어 내는 방식이다. 가치사슬은 그보다 넓게 원재료 공급부터 판매, 사용, 폐기까지 회사가 기대고 있는 모든 관계를 말한다. 사업모형이 '무엇으로 돈을 버는가'라면 가치사슬은 '누구와 어디에 기대어 버는가'에 가깝다.","'집중된 부분'의 예로 기준서는 지리적 영역, 시설 및 자산의 유형을 든다. 같은 폭우라도 공장이 침수 위험 지역에 몰려 있는지에 따라 영향이 크게 다르다. 기아 보고서는 국내에서는 AutoLand광주와 AutoLand화성의 태풍·폭우 노출도가 상대적으로 높고, 해외에서는 기아중국과 기아멕시코가 장기 시점에 높은 폭우 위험에 노출된다고 분석했다. 위험이 어디에 몰려 있는지를 사업장 단위로 보여 준 예다.","BC41은 가치사슬을 넓게 정의하더라도 가치사슬에 닿는 모든 위험·기회를 공시하라는 뜻은 아니며, 요구되는 정보는 중요한 정보로 제한된다고 설명한다. 예로 제품 제조에 필수적인 자원의 공급에 영향을 주는 특정 지역에 물리적 위험이 집중된 경우를 든다. 공장만이 아니라 핵심 원자재를 공급하는 지역까지 시야를 넓히되, 중요한 것만 골라 쓰라는 것이다."],"req":"기후 위험·기회가 사업모형·가치사슬에 주는 현재·예상 영향과, 위험·기회가 집중된 지역·시설·자산을 기술한다.","ex":{"k":"기아 보고서에서는","t":"국내 AutoLand광주·AutoLand화성의 태풍·폭우 노출도가 상대적으로 높고, 해외 KCN(기아중국)·KMX(기아멕시코)가 장기 시점에 High~Highest 수준의 폭우 위험에 노출된다고 적었다.","co":"kia","page":27},"terms":[{"t":"가치사슬","d":"기획부터 배송, 소비, 수명 종료까지 기업이 제품·서비스를 위해 쓰고 의존하는 상호작용, 자원, 관계의 전체 범위다.","en":"value chain"}]},{"no":"14","label":"전략·의사결정과 전환 계획","pdfPage":10,"prose":["문단 14⑴은 기업이 전략과 의사결정에서 기후 위험·기회에 어떻게 대응했고 대응할지 묻는다. ㈎ 사업모형 변화와 자원배분(탄소집약적 사업의 관리·중단 계획, 연구개발 지출, 인수·매각 등), ㈏ 생산 공정·설비 변경 같은 직접적 완화·적응 노력, ㈐ 고객·공급망 협력 같은 간접적 노력, ㈑ 기후 관련 전환 계획, ㈒ 기후 목표를 어떻게 달성할지가 들어간다.","전환 계획은 저탄소 경제로 가기 위한 목표, 조치, 자원을 담은 전략의 한 부분이다. 14⑴㈑는 계획을 만들 때 쓴 주요 가정과 계획이 의존하는 요소도 밝히라고 한다. BC50은 가정의 예로 규제에 대한 기대를, 의존 요소의 예로 목표 달성에 필요한 배출량 제거 기술을 든다. 가정이 무너지면 계획도 흔들리므로 투자자는 이 부분을 꼼꼼히 본다.","14⑵는 이런 활동의 자원을 어떻게 조달하는지, 14⑶은 과거에 공시한 계획의 진척도를 양적·질적으로 밝히라고 한다. 현대자동차 보고서는 사업장 탄소 배출 감축을 위해 2026년부터 2035년까지 약 3.5조 원 규모의 투자계획을 세웠다고 밝혔다. 계획에 돈이 얼마나 붙어 있는지를 보여 주는 문장이다. BC43에 따르면 진척도 정보에는 이번 기간의 진척뿐 아니라 누적된 진척도 포함될 수 있다."],"req":"대응 전략(사업모형 변화, 직접·간접 완화와 적응, 전환 계획과 가정, 목표 달성 계획), 자원 조달, 과거 계획의 진척도를 공시한다.","ex":{"k":"현대자동차 보고서에서는","t":"사업장 탄소 배출 감축을 위해 2026년부터 2035년까지 약 3.5조 원 규모의 투자계획을 수립했다고 밝혔다.","co":"hyundai","page":41},"terms":[{"t":"기후 관련 전환 계획","d":"저탄소 경제로의 전환을 위한 기업의 목표, 조치, 자원을 제시하는 전략의 한 측면이다.","en":"climate-related transition plan"}]}],"write":{"q":"문단 14⑴㈑는 전환 계획에 대해 무엇을 함께 공시하라고 하는가?","must":[["가정","전제"],["의존","의존하는 요소"],["전환 계획","전환계획"]],"bonus":[["주요","핵심"]],"wrong":["전환 계획은 목표 숫자만 적으면 된다"],"model":"기후 관련 전환 계획을 공시할 때 계획을 개발하는 데 사용한 주요 가정과 계획이 의존하는 요소를 함께 공시해야 한다.","src":"문단 14⑴㈑"},"check":{"q":"다음 중 문단 14⑴㈐ '간접적인 완화 및 적응' 노력의 예는?","options":["생산 설비 변경","고객 및 공급망과의 협력","시설 재배치"],"ans":1,"why":"기준서는 간접적 노력의 예로 고객 및 공급망과의 협력을 든다. 설비 변경과 시설 재배치는 직접적 노력(㈏)의 예다."},"summary":["위험·기회 식별에는 과도한 원가나 노력 없이 구할 수 있는 근거 있는 정보를 쓰며, KSSB에서 산업기반 지침은 참고할 수 있는 자료다.","문단 13은 위험·기회가 사업모형과 가치사슬에 주는 영향과 집중된 지역·시설을 묻는다.","문단 14는 대응 전략, 전환 계획과 그 가정·의존 요소, 자원 조달, 과거 계획의 진척도를 묻는다."]},{"id":"k2-5","title":"전략 ③ 재무적 영향","range":"문단 15~21","pages":[11,14],"min":15,"intro":"기후 위험·기회가 재무상태·재무성과·현금흐름에 이미 준 영향과 앞으로 줄 영향을 공시하는 문단을 읽는다. 숫자로 쓰기 어려울 때 어떤 예외가 있고, 그 예외를 쓰면 무엇을 대신 공시해야 하는지가 핵심이다.","blocks":[{"no":"15","label":"현재 재무적 영향과 예상 재무적 영향","pdfPage":11,"prose":["문단 15는 두 가지를 구분한다. 보고기간 동안 이미 재무상태·재무성과·현금흐름에 준 영향은 '현재 재무적 영향', 단기·중기·장기에 걸쳐 줄 것으로 예상하는 영향은 '예상 재무적 영향'이다. 재무상태는 자산과 부채, 재무성과는 매출과 이익, 현금흐름은 실제 돈의 흐름이다. 예상 영향을 쓸 때는 기후 위험·기회가 재무계획에 어떻게 반영되는지도 고려한다.","BC52는 재무적 영향 정보가 기후 위험·기회와 재무제표 사이의 연결을 보여 주고 재무제표 정보를 보완한다고 설명한다. 기후 공시가 환경 보고에 머물지 않고 재무 보고의 일부가 되는 지점이 여기다. 그래서 이 부분은 회계팀, 재무팀과 함께 작성하는 경우가 많다. 예상 영향을 쓸 때 재무계획을 고려하라는 말은, 회사가 이미 세운 투자·예산 계획과 기후 공시의 숫자가 따로 놀지 않게 하라는 뜻이다."],"req":"기후 위험·기회가 보고기간에 준 재무 영향(현재)과 단·중·장기에 줄 재무 영향(예상)을 이해할 수 있게 공시한다.","terms":[{"t":"현재 재무적 영향","d":"보고기간에 이미 재무상태·재무성과·현금흐름에 나타난 영향이다.","en":"current financial effects"},{"t":"예상 재무적 영향","d":"단기·중기·장기에 걸쳐 나타날 것으로 예상하는 영향이다.","en":"anticipated financial effects"}]},{"no":"16","label":"구체적으로 공시할 네 가지","pdfPage":12,"prose":["문단 16은 양적·질적 정보로 네 가지를 공시하라고 한다. ⑴ 보고기간에 재무에 어떤 영향을 줬는지, ⑵ 그중 다음 회계연도에 자산·부채 장부금액을 크게 조정하게 만들 유의적 위험이 있는 것, ⑶ 전략을 감안할 때 재무상태가 단·중·장기에 어떻게 바뀔지(투자·처분 계획과 자금조달 원천 고려), ⑷ 재무성과와 현금흐름이 어떻게 바뀔지다. ⑶의 투자 계획에는 아직 계약하지 않은 계획도 포함된다.","⑵는 회계와 직접 맞닿아 있다. 탄소 규제 때문에 내년에 어떤 설비의 가치를 크게 깎아야 할 수 있다면 그 사실을 기후 공시에서도 짚으라는 뜻이다. ⑷의 예로 기준서는 저탄소 제품의 수익 증가, 기후 사건으로 인한 자산 손상 비용, 적응·완화 비용을 든다. 기아 보고서는 태풍으로 인한 유형자산 손상·복구 비용이 5년 내 536억 원, 재고자산 피해가 장기적으로 최대 1,834억 원 생길 수 있다고 추정했다."],"req":"보고기간의 재무 영향, 다음 연도 장부금액 조정 위험이 큰 항목, 단·중·장기 재무상태와 재무성과·현금흐름의 예상 변화를 양적·질적으로 공시한다.","ex":{"k":"기아 보고서에서는","t":"태풍으로 인한 유형자산 물리적 손상과 복구·교체 비용이 단·중기간(5년) 내 536억 원, 재고자산 피해는 장기적(5년 초과)으로 최대 1,834억 원의 누적 재무영향이 발생할 수 있다고 적었다.","co":"kia","page":28},"terms":[{"t":"장부금액","d":"재무제표에 기록된 자산이나 부채의 금액이다.","en":"carrying amount"}]},{"no":"17","label":"단일값 또는 범위, 그리고 작성 방식","pdfPage":12,"prose":["문단 17은 양적 정보를 하나의 숫자(단일값)로 써도 되고 범위로 써도 된다고 한다. 미래 영향은 불확실하므로 범위로 보여 주는 편이 정직할 때가 많다. 문단 18은 예상 재무적 영향을 작성할 때 근거 있는 정보를 과도한 원가나 노력 없이 구해 쓰고, 기업이 가진 기량·역량·자원 수준에 맞는 접근법을 쓰라고 한다. 하나의 숫자를 고집하면 실제보다 정확해 보이는 착시를 줄 수 있기 때문이다.","BC54는 이 규정 덕분에 기업이 광범위한 조사를 할 필요가 없고 보고일 이후 정보를 쓸 필요도 없다고 설명한다. 처음 공시하는 기업은 간단한 방법으로 시작해 점차 다듬으면 된다. 현대자동차 보고서는 물리적 위험의 2030년 연간 손실 금액을 약 2,200억 원(SSP1-2.6)~3,000억 원(SSP5-8.5) 수준으로 시나리오별 범위를 들어 제시했다."],"req":"양적 정보는 단일값이나 범위로 쓸 수 있고, 예상 재무 영향은 근거 있는 정보와 기업 역량에 맞는 접근법으로 작성한다(문단 18).","ex":{"k":"현대자동차 보고서에서는","t":"분석 대상 매출 및 자산의 2030년 연간 손실 금액을 약 2,200억 원(SSP1-2.6)~3,000억 원(SSP5-8.5) 수준으로 예측했다.","co":"hyundai","page":35}},{"no":"19","label":"양적 정보를 안 써도 되는 경우 (19~20)","pdfPage":13,"prose":["문단 19는 두 경우에 양적 정보를 주지 않아도 된다고 한다. ⑴ 그 영향을 따로 떼어 식별할 수 없을 때, ⑵ 추정에 따르는 측정불확실성이 너무 높아 숫자가 쓸모없을 때다. 문단 20은 하나를 더한다. 기업이 양적 정보를 낼 기량·역량·자원을 갖추지 못했다면 예상 재무적 영향의 양적 정보를 주지 않아도 된다. 예외를 쓸지는 기업이 판단하지만, 그 판단을 하면 문단 21의 대체 공시가 따라온다.","⑴의 예를 들면 전기차 판매 증가에는 기후 규제뿐 아니라 가격, 디자인, 보조금이 섞여 있어 기후 몫만 떼기 어렵다. ⑵는 수십 년 뒤 피해처럼 숫자를 내도 오차가 너무 커 의미가 없는 경우다. 문단 20의 역량 예외는 현재 영향이 아니라 예상 영향에만 적용된다는 점을 구분해 둔다. BC53에 따르면 일부 작성자는 예상 재무적 영향을 측정하기 어렵다는 우려를 냈고, BC54는 이런 규정들이 그 부담을 덜어 준다고 설명한다."],"req":"영향을 따로 식별할 수 없거나 측정불확실성이 너무 높으면 양적 정보를 생략할 수 있고, 예상 영향은 역량이 없을 때도 생략할 수 있다(문단 20).","terms":[{"t":"측정불확실성","d":"추정한 숫자가 실제와 얼마나 달라질 수 있는지의 정도다.","en":"measurement uncertainty"}]},{"no":"21","label":"생략했다면 대신 해야 할 세 가지","pdfPage":13,"prose":["문단 21은 19~20의 예외를 쓴 기업에게 의무를 지운다. ⑴ 양적 정보를 주지 않은 이유를 설명하고, ⑵ 질적 정보를 주되 영향을 받았거나 받을 수 있는 재무제표의 계정과목·총계·소계를 짚으며, ⑶ 해당 위험·기회를 다른 위험·기회나 요인과 결합한 재무적 영향의 양적 정보를 준다. 결합한 정보도 유용하지 않다고 판단하면 ⑶은 빠질 수 있다.","'숫자를 못 쓴다'로 끝나지 않는다는 뜻이다. 적어도 '이 위험은 유형자산과 매출원가에 영향을 줄 수 있다'처럼 재무제표 어디를 보면 되는지 알려 주어야 한다. 기아 보고서는 전환 위험·기회의 정량적 재무 영향은 앞으로 분석할 예정이라고 적고, 대신 직접 운영비용 증가, 매출 증가 같은 영향 항목을 표로 정리했다. 이유 설명과 질적 정보가 어떤 모습인지 볼 수 있는 예다."],"req":"양적 정보를 생략하면 그 이유를 설명하고, 영향받는 재무제표 항목을 포함한 질적 정보와 (유용하다면) 결합된 영향의 양적 정보를 제공한다.","quote":"양적 정보를 제공하지 않은 이유를 설명한다.","ex":{"k":"기아 보고서에서는","t":"향후 시나리오와 기후 전환 관련 계획 등을 고려해 각 위험·기회의 정량적 재무 영향을 분석할 예정이라고 적고, 직접 운영비용 증가·매출 증가 등 재무 영향 항목을 표로 제시했다.","co":"kia","page":30}}],"write":{"q":"문단 19~20을 적용해 양적 정보를 생략한 기업이 문단 21에 따라 해야 하는 일을 한 문장으로 쓰라.","must":[["이유","까닭"],["질적 정보","질적"],["계정과목","재무제표"]],"bonus":[["결합","다른 요인과 합친"]],"wrong":["생략 사실만 밝히면 된다"],"model":"양적 정보를 제공하지 않은 이유를 설명하고, 영향을 받는 재무제표의 계정과목을 포함한 질적 정보를 제공해야 한다.","src":"문단 21"},"check":{"q":"문단 20의 '기량·역량·자원 부족' 예외가 적용되는 것은?","options":["현재와 예상 재무적 영향 모두","예상 재무적 영향만","현재 재무적 영향만"],"ans":1,"why":"문단 20은 예상 재무적 영향의 양적 정보에 대해서만 이 예외를 둔다. 현재 영향에는 문단 19의 두 예외만 적용된다."},"summary":["재무적 영향은 보고기간에 이미 나타난 현재 영향과 단·중·장기의 예상 영향으로 나뉜다.","양적 정보는 단일값이나 범위로 쓸 수 있고, 식별 불가·불확실성 과다 때(예상 영향은 역량 부족 때도) 생략할 수 있다.","생략하면 이유, 영향받는 재무제표 항목을 담은 질적 정보, 가능하면 결합된 영향의 숫자를 대신 공시한다."]},{"id":"k2-6","title":"전략 ④ 기후 회복력과 시나리오 분석","range":"문단 22~23 (+B1~B18)","pages":[14,37],"min":16,"intro":"기업의 전략과 사업모형이 기후 변화에 얼마나 버틸 수 있는지(회복력)를 시나리오 분석으로 평가해 공시하는 문단을 읽는다. 부록 B의 B1~B18은 '자기 상황에 맞는' 시나리오 분석이 무엇인지 풀어 준다.","blocks":[{"no":"22","label":"기후 회복력과 시나리오 분석의 요구","pdfPage":14,"prose":["문단 22는 식별한 위험·기회를 고려해 기후 관련 변화와 불확실성에 대한 전략·사업모형의 회복력을 이해할 수 있는 정보를 공시하라고 한다. 회복력은 기후 관련 변화에 적응할 수 있는 기업의 역량이다. 이 평가를 위해 기업은 '자신의 상황에 상응하는 방식으로' 시나리오 분석을 수행한다. '상응하는 방식'은 회사의 노출 정도와 역량에 맞는 깊이로 분석하라는 뜻이며, 구체적인 설명은 부록 B에 있다.","시나리오 분석은 '세상이 이렇게 바뀐다면'이라는 여러 미래 그림을 놓고 회사가 각각에서 어떻게 될지 따져 보는 방법이다. 탄소 규제가 빠르게 강해지는 미래와 기온이 크게 오르는 미래를 나란히 놓고 비교한다. 미래를 하나로 맞히려는 것이 아니라 여러 미래에서 버틸 수 있는지를 본다. BC67은 시나리오 분석이 다른 공시에도 쓰일 수 있지만 그 사용이 요구되는 것은 회복력 평가의 맥락뿐이라고 밝힌다."],"req":"자기 상황에 맞는 시나리오 분석으로 전략과 사업모형의 기후 회복력을 평가하고, 그 결과와 분석 방법을 공시한다.","terms":[{"t":"기후 회복력","d":"기후 관련 변화, 전개 상황, 불확실성에 적응할 수 있는 기업의 역량이다.","en":"climate resilience"},{"t":"시나리오 분석","d":"여러 가능한 미래를 가정하고 각 미래에서 회사가 받을 영향을 따져 보는 방법이다.","en":"scenario analysis"}]},{"no":"22⑴","label":"회복력 평가 결과: 시사점, 불확실성, 조정 역량","pdfPage":14,"prose":["문단 22⑴은 보고일 현재 회복력 평가를 공시하라고 한다. ㈎ 평가가 전략과 사업모형에 주는 시사점과 대응 방법, ㈏ 평가에서 고려한 유의적 불확실성의 영역, ㈐ 단·중·장기에 전략과 사업모형을 조정할 역량이다. ㈐에는 기존 재무자원의 가용성과 유연성, 기존 자산을 재배치·용도변경·개선·해체할 능력, 완화·적응을 위한 투자의 영향이 들어간다.","㈐는 쉽게 말해 '위기가 오면 쓸 돈과 바꿀 수 있는 설비가 있는가'를 묻는다. 문단 23은 13~22의 공시를 작성할 때 문단 29의 산업전반 지표를 참조해 적용가능성을 고려하고, 산업기반 지표는 참고할 수 있다고 덧붙인다. B18은 회복력 평가를 매년 해야 하므로 22⑴의 공시는 매 보고기간 갱신된다고 분명히 한다. 따라서 시나리오 분석을 새로 하지 않은 해에도 회복력에 대한 판단은 그해 상황에 맞게 다시 적어야 한다."],"req":"보고일 현재 회복력 평가의 시사점, 유의적 불확실성, 재무자원·자산 조정·투자를 통한 적응 역량을 공시한다."},{"no":"22⑵","label":"시나리오 분석을 어떻게, 언제 했는가","pdfPage":15,"prose":["문단 22⑵는 분석 방법과 시점을 묻는다. ㈎ 투입변수로 사용한 시나리오와 출처, 여러 시나리오를 썼는지, 전환·물리적 위험 중 무엇과 연관되는지, 최신 국제 협약에 부합하는 시나리오를 썼는지, 그 시나리오를 고른 이유, 분석 기간, 분석한 사업 범위를 적는다. ㈏ 주요 가정으로 관할권의 기후 정책, 거시경제 동향, 지역 변수, 에너지 믹스, 기술 개발을 적는다. ㈐는 분석을 수행한 보고기간이다.","B18에 따르면 3~5년 같은 전략 계획 주기에 맞춰 시나리오 분석을 할 수 있어서, 다시 분석하지 않은 해에는 22⑵의 공시가 직전과 같을 수 있다. 기아 보고서는 전환 위험 분석에 IEA의 STEPS·APS·NZE 2050과 NGFS Phase 5 시나리오를 쓰고, 분석 기간을 단기 2025~2026년, 중기 2027~2031년, 장기 2032~2045년, 대상을 국내외 주요 생산법인으로 밝혔다."],"req":"사용한 시나리오와 출처·연관 위험·기간·사업 범위 등 투입변수, 정책·거시경제·에너지·기술 등 주요 가정, 분석 수행 시점을 공시한다.","ex":{"k":"기아 보고서에서는","t":"전환 위험·기회 분석에 IEA Net Zero Emissions(NZE) 등 IEA 시나리오와 NGFS Phase 5 시나리오를 적용하고, 분석 기간(2025~2045년)과 분석 대상 생산법인을 함께 밝혔다.","co":"kia","page":29}},{"no":"B4","label":"자기 상황에 맞는 접근법: 익스포저와 역량 (B1~B7)","pdfPage":32,"prose":["B2에 따르면 기업은 두 가지로 자기 상황을 평가한다. 기후 위험·기회에 얼마나 노출되어 있는가(익스포저)와 시나리오 분석에 쓸 수 있는 기량·역량·자원이 얼마나 되는가다. B3은 시나리오 분석을 할 때마다 이 평가를 다시 하라고 한다. B4는 노출이 클수록 더 양적이고 기술적으로 정교한 분석이 이용자에게 큰 이점을 준다고 설명한다.","반대로 B6·B7은 시나리오 분석을 이제 막 시작한 기업은 과도한 원가나 노력 없이 정교한 양적 분석을 하지 못할 수 있으며, 반복하면서 역량을 키울 수 있다고 본다. 자원이 있다면 역량을 확보하는 데 투자할 수도 있다. B7은 추출물·광물 처리처럼 시나리오 분석이 이미 관행인 산업은 경험이 쌓여 있을 것으로 예상한다. 결국 처음부터 완벽하게가 아니라 해마다 조금씩 정교하게가 기준서의 기대다."],"req":"시나리오 분석 접근법은 기후 익스포저와 이용 가능한 기량·역량·자원을 평가해 정한다.","quote":"즉, 다른 모든 조건이 동일할 때, 기후 관련 위험 또는 기회에 대한 기업의 익스포저가 클수록 기업은 기술적으로 더욱 정교한 형태의 기후 관련 시나리오 분석이 필요하다고 판단할 가능성이 높아진다.","terms":[{"t":"익스포저","d":"위험이나 기회에 노출된 정도다.","en":"exposure"}]},{"no":"B17","label":"질적 분석으로 시작해도 된다 (B8~B18)","pdfPage":37,"prose":["B8~B15는 투입변수와 분석 방식을 고르는 방법을 다룬다. B11은 권위 있는 원천에서 공개적으로 이용 가능한 시나리오는 과도한 원가나 노력 없이 이용할 수 있다고 본다. B12는 배출 규제가 강한 지역에 사업장이 모인 기업은 저탄소 전환 시나리오를, 물리적 위험이 커지는 기업은 현지화된 시나리오를 쓰는 것이 적절할 수 있다고 예를 든다. B15는 질적 정보도 합리적 근거가 될 수 있다고 본다.","B17은 질적 시나리오 분석처럼 간단한 접근법이 상황에 맞으면 그것을 써도 된다고 한다. 노출은 크지만 양적 분석 역량이 아직 없는 기업은 간단히 시작해 점차 양적 접근으로 옮겨 갈 수 있다. 다만 노출이 크고 필요한 역량에 접근할 수 있는 기업은 더 발전된 양적 접근법을 적용한다. 정교함의 수준은 노출과 역량에 비례한다고 기억하면 된다."],"req":"상황에 맞으면 질적 분석 같은 간단한 접근법을 쓸 수 있으나, 노출이 크고 역량이 있으면 발전된 양적 접근법을 적용한다.","quote":"질적 시나리오 분석과 같이 보다 간단한 접근법이 기업의 상황에 적합한 경우, 기업은 이러한 접근법을 사용할 수 있다.","ex":{"k":"현대자동차 보고서에서는","t":"물리적 리스크의 재무 영향 분석에 IPCC 제6차 평가보고서의 SSP1-2.6과 SSP5-8.5 시나리오를 활용하고, 기후 리스크 분석 툴인 Jupiter Intelligence로 32개 사업장을 분석했다고 적었다.","co":"hyundai","page":35}}],"write":{"q":"B18에 따르면 시나리오 분석 공시(22⑵)와 회복력 평가 공시(22⑴)의 갱신 주기는 어떻게 다른가?","must":[["매년","매 보고기간"],["전략 계획 주기","계획 주기","3~5년"],["시나리오 분석","시나리오"]],"bonus":[["직전","같을 수"]],"wrong":["둘 다 매년 새로 분석해야 한다"],"model":"시나리오 분석은 전략 계획 주기에 맞춰 수행할 수 있어 22⑵가 직전과 같을 수 있지만, 회복력 평가는 매년 해야 하므로 22⑴은 매 보고기간 갱신된다.","src":"문단 B18"},"check":{"q":"B17에 대한 설명으로 맞는 것은?","options":["모든 기업은 처음부터 양적 시나리오 분석을 해야 한다","상황에 맞으면 질적 시나리오 분석처럼 간단한 접근법을 쓸 수 있다","시나리오 분석 자체가 선택 사항이다"],"ans":1,"why":"B17은 간단한 접근법을 허용한다. 다만 문단 22는 회복력 평가를 위한 시나리오 분석 자체는 요구하므로 '선택 사항'은 틀린 설명이다."},"summary":["문단 22는 자기 상황에 맞는 시나리오 분석으로 전략·사업모형의 기후 회복력을 평가해 공시하게 한다.","공시는 회복력 평가 결과(22⑴, 매년 갱신)와 분석 방법·투입변수·가정·시점(22⑵, 계획 주기에 맞출 수 있음)으로 나뉜다.","분석의 정교함은 기후 익스포저와 기량·역량·자원에 맞추며, 상황에 맞으면 질적 분석으로 시작할 수 있다."]},{"id":"k2-7","title":"위험관리","range":"문단 24~26","pages":[16,17],"min":12,"intro":"기업이 기후 위험·기회를 찾고, 평가하고, 순위를 매기고, 지켜보는 과정을 공시하는 문단을 읽는다. 그 과정이 회사 전체 위험관리와 얼마나 통합되어 있는지도 함께 묻는다.","blocks":[{"no":"24","label":"위험관리 공시의 목적","pdfPage":16,"prose":["문단 24는 위험관리 공시의 목적을 정한다. 이용자가 기업이 기후 위험·기회를 식별, 평가, 우선순위 설정, 모니터링하는 프로세스를 이해하게 하는 것이고, 그 프로세스가 전사 위험관리에 통합되어 작동하는지와 그 방식도 포함한다. 거버넌스가 '누가'를 묻는다면 위험관리는 '어떤 절차로'를 묻는다고 보면 된다. 제1호에도 같은 위험관리 요구가 있고, BC72는 일관된 공시를 위해 두 기준서 모두에 이를 적어 두었다고 설명한다.","투자자가 이 정보를 원하는 이유는 공시된 위험 목록이 얼마나 믿을 만한지 판단하기 위해서다. 체계적인 절차를 거친 목록이라면 빠진 위험이 적을 가능성이 높고, 해마다 같은 방식으로 갱신된다면 비교도 가능하다. 그래서 결과(위험 목록)보다 과정(절차)을 설명하는 데 초점이 있다. 특히 위험 목록이 작년과 달라졌다면 절차가 바뀐 탓인지 실제 위험이 바뀐 탓인지 알 수 있어야 한다.","위험관리 공시를 검토할 때는 네 단계 동사를 기억하면 된다. 식별(찾기), 평가(크기 재기), 우선순위 설정(순서 정하기), 모니터링(지켜보기)이다. 문단 25는 이 네 단계를 위험과 기회 각각에 대해 묻고, 마지막으로 이 과정이 회사 전체 위험관리와 어떻게 묶여 있는지를 묻는다. 보고서의 절차도에 네 단계가 모두 보이는지 먼저 확인하면 된다."],"req":"기후 위험·기회를 식별·평가·우선순위 설정·모니터링하는 프로세스와 그 전사 위험관리 통합 여부·방식을 이해하게 한다."},{"no":"25⑴","label":"위험에 대한 프로세스: 여섯 가지 질문","pdfPage":16,"prose":["문단 25⑴은 기후 위험을 다루는 프로세스와 관련 정책을 공시하라고 하며 여섯 가지를 담게 한다. ㈎ 투입변수와 매개변수(데이터 원천, 사업 범위 등), ㈏ 위험 식별에 시나리오 분석을 쓰는지와 그 방법, ㈐ 위험의 성격·발생가능성·영향의 크기를 어떻게 평가하는지, ㈑ 다른 위험과 비교해 기후 위험을 우선시하는지와 그 방법, ㈒ 모니터링 방법, ㈓ 직전 보고기간과 비교한 프로세스 변경이다.","㈐의 예로 기준서는 질적 요소, 양적 임계치 같은 판단기준을 든다. 양적 임계치는 '예상 손실이 일정 금액 이상이면 중요 위험으로 본다' 같은 기준선이다. ㈓는 절차가 바뀌었다면 알려서 연도 비교 때 오해가 없게 하려는 요구다. 기아 보고서는 식별, 평가, 우선순위화, 관리방안 수립, 모니터링, 승인의 6단계 절차를 표로 보여 주고, 규모는 재무적 영향을 정성·정량 기준으로 평가한다고 적었다.","현대자동차 보고서는 기후변화 시나리오 분석을 활용해 위험·기회를 식별·평가하며, STEEP(사회·기술·경제·환경·정치) 구분별 동력요인을 식별한 뒤 영향도, 불확실성, 적합성 등을 평가해 핵심 동력요인을 도출했다고 적었다. 영향도는 사업 모델과 가치사슬에 미치는 영향과 자원 배분에 미치는 영향을 기준으로 평가했다. ㈏(시나리오 분석 사용)와 ㈐(평가 방법)를 함께 보여 주는 예다."],"req":"기후 위험 프로세스의 투입변수, 시나리오 분석 사용, 평가 방법, 우선순위 설정, 모니터링, 직전 기간 대비 변경을 공시한다.","ex":{"k":"기아 보고서에서는","t":"식별·평가·우선순위화·관리방안 수립·모니터링·승인의 6단계 절차를 제시하고, 평가 단계에서 규모는 재무적 영향을 정성·정량 기준으로, 발생 가능성은 과거 데이터와 현업부서·외부 전문가 의견을 기반으로 평가한다고 적었다.","co":"kia","page":41},"terms":[{"t":"양적 임계치","d":"어떤 위험을 중요하다고 볼지 정하는 숫자 기준선이다.","en":"quantitative thresholds"}]},{"no":"25⑵","label":"기회에 대한 프로세스와 전사 통합 (25⑵·⑶)","pdfPage":17,"prose":["문단 25⑵는 기회에 대해서도 식별·평가·우선순위 설정·모니터링 프로세스를 공시하라고 하고, 기회 식별에 시나리오 분석을 쓰는지와 그 방법도 포함한다. 위험만 관리하는 회사보다 기회를 체계적으로 찾는 회사가 저탄소 전환에서 앞설 수 있기 때문이다. 문단 25⑶은 이런 프로세스가 전반적인 위험관리 프로세스에 통합되고 작용하는 범위와 방식을 묻는다.","통합 여부는 실무에서 큰 차이를 만든다. 기후 위험을 환경팀만 따로 관리하면 재무·운영 위험과 비교되지 않아 경영 판단에 반영되기 어렵다. 기아 보고서는 기후 관련 리스크를 재무·비재무 리스크를 함께 다루는 통합 리스크 관리 프로세스에 포함해 전사 관점으로 관리하고, 주요 사항은 매년 이사회에 정기 보고된다고 적었다. 통합되어 있으면 기후 위험도 다른 위험과 같은 기준으로 크기를 비교받는다."],"req":"기후 기회의 식별·평가·우선순위·모니터링 프로세스와, 이 프로세스들이 전사 위험관리에 통합된 범위·방식을 공시한다.","ex":{"k":"기아 보고서에서는","t":"기후 관련 리스크를 재무·비재무 리스크를 통합 관리하는 프로세스에 포함해 전사 관점으로 관리하며, 기후변화 리스크 분석의 계획·결과·대응방안은 매년 이사회에 정기 보고된다고 밝혔다.","co":"kia","page":41}},{"no":"26","label":"중복 피하기","pdfPage":17,"prose":["문단 26은 문단 7과 같은 논리로 중복을 피하라고 한다. 여러 지속가능성 위험·기회를 통합 관리한다면 주제마다 따로 쓰지 않고 통합된 위험관리를 한 번에 공시해도 된다. BC72는 전반적인 위험관리 접근법을 설명한 뒤 기후에 해당하는 세부 사항을 덧붙이는 방식이 적절할 수 있다고 예를 든다. 위험관리 요구사항이 제1호와 제2호 양쪽에 있기 때문에 이런 중복 회피 문장이 필요하다.","현대자동차 보고서는 각 권역·조직이 파악한 기후 이슈를 경영전략담당이 위험·기회 요인으로 도출·평가하고, 중대성에 따라 CEO나 C-level 경영위원회를 거쳐 이사회에 보고하는 흐름을 그림으로 보여 주었다. 전사 절차 안에 기후가 들어가 있음을 보여 주는 방식이다. 다만 통합해 쓰더라도 25⑴의 여섯 항목, 특히 직전 기간 대비 변경 여부는 기후에 대해 확인할 수 있어야 한다."],"req":"위험관리를 통합 운영하면 주제별 반복 대신 통합된 위험관리를 공시해 중복을 피한다.","ex":{"k":"현대자동차 보고서에서는","t":"권역·조직별로 파악한 기후 이슈를 경영전략담당이 평가해 중대성에 따라 CEO 또는 C-level 경영위원회를 거쳐 이사회에 보고하는 절차를 설명했다.","co":"hyundai","page":37}}],"write":{"q":"문단 25⑴㈓는 무엇을 공시하라고 하는가?","must":[["직전 보고기간","전기","작년"],["변경","바뀌"],["프로세스","절차"]],"bonus":[["어떻게","방식"]],"wrong":["올해 새로 찾은 위험 목록만 쓰면 된다"],"model":"기업이 사용하는 프로세스가 직전 보고기간과 비교해 변경되었는지와 어떻게 변경되었는지를 공시해야 한다.","src":"문단 25⑴㈓"},"check":{"q":"문단 25⑶이 묻는 것은?","options":["기후 위험별 예상 손실 금액","기후 위험·기회 프로세스가 전사 위험관리에 통합되고 작용하는 범위와 방식","위험관리 담당 임원의 보상"],"ans":1,"why":"25⑶은 통합의 범위와 방식을 묻는다. 손실 금액은 문단 16, 보상은 문단 29⑺의 영역이다."},"summary":["위험관리 공시는 기후 위험·기회를 찾고 평가하고 순위를 매기고 지켜보는 절차를 보여 주는 것이다.","위험에 대해서는 투입변수, 시나리오 분석 사용, 평가 기준, 우선순위, 모니터링, 전년 대비 변경을 공시한다.","기회 프로세스와 전사 위험관리 통합 정도도 공시하며, 통합 관리라면 중복 없이 쓴다."]},{"id":"k2-8","title":"지표 ① 온실가스 배출량","range":"문단 27~29⑴, 29A~29C (+B19~B57)","pages":[17,50],"min":18,"intro":"지표 공시의 구성과 산업전반 지표 중 가장 중요한 온실가스 배출량(문단 29⑴)을 읽는다. KSSB는 측정 방법이 섞여 있을 때의 세분화(29⑴㈒)와 카테고리 15 범위 한정(29A~29C)에서 고유한 문장을 갖고 있다.","blocks":[{"no":"29⑴㈎","label":"절대 총배출량을 스코프 1·2·3으로","pdfPage":18,"prose":["문단 27~28은 지표 및 목표 공시를 산업전반 지표(29~31), 산업기반 지표(32), 목표(33~37)로 나눈다. 그 첫 지표인 29⑴㈎는 보고기간의 온실가스 절대 총배출량을 이산화탄소환산톤으로, 스코프 1·2·3으로 나누어 공시하라고 한다. 스코프 1은 직접 배출, 스코프 2는 사서 쓴 전기·증기·난방·냉각에서 나온 간접 배출, 스코프 3은 그 밖의 가치사슬 간접 배출이다.","B20·B21은 일곱 가지 온실가스(CO2, CH4, N2O, HFCs, NF3, PFCs, SF6)를 이산화탄소환산량으로 합치고, 직접 측정할 때는 최신 IPCC 평가보고서의 100년 기준 지구온난화지수를 쓰라고 한다. 관할 당국이나 거래소가 다른 값을 요구하면 그 범위와 기간 동안 그 값을 쓸 수 있다. 현대자동차 보고서의 산정 설명에는 '6대 온실가스를 대상으로' 했다는 문장이 있어, 부록 A의 일곱 가지와 범위가 맞는지 검토 때 확인할 거리다."],"req":"보고기간 온실가스 절대 총배출량을 tCO2e로, 스코프 1·2·3으로 구분해 공시한다.","fig":{"cap":"기아 2025년 온실가스 배출량(보고서 130쪽)","head":["구분","2025년(천tCO2e)"],"rows":[["스코프 1","398.5"],["스코프 2","697.9"],["스코프 1+2 합계","1,096.4"],["스코프 3","142,060.7"]]},"ex":{"k":"기아 보고서에서는","t":"2025년 스코프 1 398.5천tCO2e, 스코프 2 697.9천tCO2e, 합계 1,096.4천tCO2e, 스코프 3 142,060.7천tCO2e를 공시했다.","co":"kia","page":130},"terms":[{"t":"이산화탄소환산톤","d":"여러 온실가스를 CO2 기준으로 환산해 합친 단위다.","en":"tonnes of CO2 equivalent"},{"t":"지구온난화지수","d":"CO2 한 단위와 비교해 어떤 온실가스가 대기를 얼마나 더 데우는지 나타낸 지수다.","en":"global warming potential"}]},{"no":"29⑴㈏","label":"측정 기준과 접근법, 연결실체 구분 (㈏·㈐·㈑)","pdfPage":18,"prose":["29⑴㈏는 배출량을 '온실가스 프로토콜 기업 회계 및 보고 기준(2004)'(GHG 프로토콜)에 따라 측정하되, 관할 당국이나 거래소가 기업 전체나 일부에 다른 방법을 요구하면 그 부분은 그 방법을 쓸 수 있게 한다(B24). B25는 관할권이 스코프 1·2만 보고하게 해도 스코프 1·2·3 공시 의무가 면제되지 않는다고 한다. ㈐는 측정 접근법·투입변수·가정과 선택 이유, 보고기간 중 변경 사항과 이유를 묻는다.","B27에 따라 GHG 프로토콜을 쓰는 기업은 지분율 접근법과 통제 접근법 중 무엇을 썼는지와 이유를 밝힌다. ㈑는 스코프 1·2를 회계상 연결실체와 그 밖의 피투자자(관계기업, 공동기업 등)로 나누라고 한다. 회계상 연결실체는 모회사와 연결재무제표에 함께 묶이는 종속기업이고, 피투자자는 지분은 가졌지만 연결하지 않는 회사다. BC99는 배출량 산정 범위가 재무제표 연결 범위와 다를 수 있어 이를 보완하려는 것이라고 설명한다. 현대자동차 보고서는 조직 경계에 운영통제력 기준을 썼다고 밝혔다."],"req":"GHG 프로토콜(2004)로 측정하되 관할 당국·거래소 요구 방법을 쓸 수 있고, 측정 접근법·가정과 변경, 연결실체·피투자자별 스코프 1·2를 공시한다.","ex":{"k":"현대자동차 보고서에서는","t":"조직 경계 설정에 통제력 기준 중 운영통제력을 사용했고, 스코프 1·2를 GHG 프로토콜 기업 기준과 Scope 2 Guidance를 근거로 산정하면서 국내 탄소중립기본법과 배출권거래제 보고·인증 지침도 준수했다고 적었다.","co":"hyundai","page":38},"terms":[{"t":"통제 접근법","d":"회사가 통제하는 사업장의 배출을 산정 범위에 넣는 조직 경계 설정 방식이다.","en":"control approach"},{"t":"지분율 접근법","d":"지분 비율만큼 배출량을 산정 범위에 넣는 방식이다.","en":"equity share approach"}]},{"no":"29⑴㈒","label":"측정 방법이 섞였을 때만 방법별로 세분화 (KSSB 고유)","pdfPage":19,"prose":["29⑴㈒는 KSSB가 더한 요구다. 스코프 1·2 배출량에 GHG 프로토콜로 측정한 배출량과 관할 당국이나 거래소가 요구하는 방법으로 측정한 배출량이 섞여 있는 경우, 스코프 1·2를 사용한 방법별로 나누어 공시한다. 조건이 붙어 있다는 점이 핵심이다. 한 가지 방법만 썼다면 이 세분화는 적용되지 않는다. 그래서 먼저 우리 회사의 스코프 1·2가 실제로 몇 가지 방법으로 측정되었는지를 확인하는 것이 출발점이다.","BC101은 일부 사업장은 관할 당국이 요구한 방식으로, 나머지는 GHG 프로토콜로 측정한 경우를 예로 든다. BC103·BC104는 한 방법만 강제하면 중복 보고 비용이 생기고, 섞인 숫자를 합쳐만 두면 규제 환경에 따른 차이가 가려질 수 있다고 보았다. 기아 검증의견서는 국내 사업장 스코프 1·2에 배출권거래제(K-ETS)에 따라 검증된 결과가 반영되었다고 적었다. 이런 기업은 방법이 실제로 섞였는지부터 확인한다. BC105는 이 세분화가 모든 방법으로 배출량을 다시 측정하라는 뜻이 아니라고 분명히 한다."],"req":"스코프 1·2에 GHG 프로토콜 측정분과 관할 당국·거래소 요구 방법 측정분이 섞여 있을 때에만, 사용한 방법별로 세분화해 공시한다.","quote":"즉, 이는 기업이 사용한 모든 방법으로 기업의 스코프 1 및 스코프 2 온실가스 배출량을 다시 측정해서 공시해야 함을 의미하지 않는다.","ex":{"k":"기아 보고서에서는","t":"검증의견서에서 국내 생산법인 및 비생산시설의 스코프 1·2 배출량은 한국 배출권거래제(K-ETS)에 따라 별도 검증된 결과가 반영되었다고 밝혔다.","co":"kia","page":156},"qno":"BC105"},{"no":"29⑴㈓","label":"스코프 2는 지역기반으로, 시장기반은 선택","pdfPage":19,"prose":["29⑴㈓는 스코프 2를 지역기반으로 공시하고, 이용자 이해에 필요한 계약 상품 정보를 함께 주라고 한다. 지역기반은 그 지역 전력망의 평균 배출계수로 계산하는 방식이고, 시장기반은 재생에너지 구매계약이나 인증서처럼 회사가 맺은 계약을 반영하는 방식이다. B30은 계약 상품이 있고 그 정보가 이해에 도움이 될 때만 계약 상품 정보를 주면 된다고 정리하고, B31은 시장기반 배출량을 공시할 수 있다고 한다.","즉 지역기반은 필수, 시장기반은 선택이다. 기아 검증의견서의 사업장별 수치를 더하면 지역기반 861,732tCO2e, 시장기반 697,875tCO2e이고, 데이터표의 스코프 2 697.9천tCO2e는 시장기반 합계와 같다. 제2호 기준으로는 지역기반 수치를 분명히 보여 주는지 확인해야 한다. 현대자동차 보고서는 2025년 스코프 2를 지역 기반 1,858,897tCO2e, 시장 기반 1,190,442tCO2e로 함께 표시했다."],"req":"스코프 2는 지역기반 배출량을 공시하고, 이해에 필요하면 계약 상품 정보를 제공한다(시장기반 공시는 선택).","ex":{"k":"현대자동차 보고서에서는","t":"2025년 스코프 2를 지역 기반 1,858,897tCO2-eq, 시장 기반 1,190,442tCO2-eq로 나란히 공시했다.","co":"hyundai","page":38},"terms":[{"t":"지역기반","d":"전력을 쓴 지역 전력망의 평균 배출계수로 스코프 2를 계산하는 방식이다.","en":"location-based"},{"t":"시장기반","d":"전력 구매 계약이나 인증서를 반영해 스코프 2를 계산하는 방식이다.","en":"market-based"}]},{"no":"29⑴㈔","label":"스코프 3: 포함한 카테고리와 데이터 품질","pdfPage":19,"prose":["29⑴㈔①은 스코프 3 측정에 포함한 카테고리를 GHG 프로토콜 스코프 3 기준(2011)의 15개 카테고리에 따라 밝히라고 한다. B32는 업스트림과 다운스트림 전체를 보고 15개를 모두 고려하라고 한다. 모두 '고려'하되 실제 포함한 것을 공시하는 구조다. ②는 B58~B63A와 함께 읽으며, 자산운용·상업은행·보험 활동이 있는 기업에 카테고리 15의 일부인 금융배출량 추가 정보를 요구한다.","B40은 투입변수 우선순위의 네 특성으로 직접 측정, 특정 활동에서 얻은 일차 데이터, 관할권과 기술을 반영한 적시성 있는 데이터, 검증된 데이터를 든다. B57은 실무적으로 추정할 수 없다면 스코프 3를 어떻게 관리하는지 공시하게 한다. 기아 보고서는 판매된 제품의 사용 배출이 114,663.1천tCO2e이며 기준 주행거리를 20만 km에서 22만 km로 올려 늘었다고 주석에 밝혔다. 가정 변경 공시(㈐③)의 예다."],"req":"스코프 3 측정에 포함한 카테고리를 밝히고, 금융 활동 기업은 금융배출량 추가 정보를 공시하며, 데이터 품질 우선순위에 따른 투입변수 정보를 제공한다.","ex":{"k":"기아 보고서에서는","t":"2025년 스코프 3 142,060.7천tCO2e 중 판매된 제품의 사용이 114,663.1천tCO2e였고, 2025년부터 기준 주행거리를 22만 km로 상향해 사용단계 배출량이 증가했다고 주석에 적었다.","co":"kia","page":130},"terms":[{"t":"일차 데이터","d":"공급업체 등 가치사슬의 특정 활동에서 직접 얻은 데이터다.","en":"primary data"}]},{"no":"29A","label":"카테고리 15를 금융배출량으로 한정 (29A~29C)","pdfPage":21,"prose":["29A는 카테고리 15(투자)의 측정 범위를 금융배출량으로 한정할 수 있게 한다. 금융배출량은 피투자자나 거래상대방에게 준 대출 및 투자(대출, 프로젝트 파이낸싱, 채권, 지분투자, 미사용 대출한도약정)에 귀속되는 배출량이며, 자산운용 기업은 운용자산 귀속분도 포함한다. 한정할 때는 파생상품 관련 배출량도 뺄 수 있다. BC125·BC129에 따르면 이는 2025년 12월 IFRS S2 개정을 반영한 것이다.","29B는 한정한 기업에 무엇을 파생상품으로 보았는지와 제외된 금융활동이 무엇인지 설명하게 한다. BC135·BC136에 따르면 KSSB는 제외 규모를 숫자 대신 질적으로 설명하게 했다. 29C는 카테고리 15를 포함하면 총계와 그 안의 금융배출량 소계를 공시하게 한다. 기아는 카테고리 15를 국내외 지분투자 배출량 776.8천tCO2e로, 현대자동차는 지분 기반 접근법으로 1,506,134tCO2e로 공시했다."],"req":"카테고리 15를 금융배출량으로 한정할 수 있고(파생상품 제외 가능), 한정하면 파생상품 판단과 제외 활동을 설명하며, 카테고리 15를 포함하면 총계와 금융배출량 소계를 공시한다.","quote":"기업이 문단 29⑴㈎③에 따라 공시되는 스코프 3 온실가스 배출량 측정에 카테고리 15 온실가스 배출량을 포함하는 경우, 기업은 카테고리 15 온실가스 배출량의 총계와 그 총계에 포함된 금융배출량의 소계를 공시하여야 한다.","fig":{"cap":"29A~29C 정리","head":["문단","내용","성격"],"rows":[["29A","카테고리 15를 금융배출량으로 한정, 파생상품 관련 배출량 제외 가능","선택(할 수 있다)"],["29B","파생상품으로 본 항목과 제외된 금융활동 설명","한정했을 때 의무"],["29C","카테고리 15 총계와 그 안의 금융배출량 소계","카테고리 15를 포함하면 의무"]]},"ex":{"k":"현대자동차 보고서에서는","t":"2025년 카테고리 15(투자) 배출량을 1,506,134tCO2-eq로 공시했고, 40쪽에서 지분율을 투자 대상 기업의 스코프 1·2 배출량에 적용하는 지분 기반 접근법으로 산정했다고 설명했다.","co":"hyundai","page":38},"terms":[{"t":"금융배출량","d":"피투자자나 거래상대방의 온실가스 총배출량 중 기업의 대여 및 투자에 기인하는 부분이다.","en":"financed emissions"}]}],"write":{"q":"문단 29⑴㈒의 측정 방법별 세분화는 언제 적용되는가?","must":[["섞여","혼재","여러 방법"],["GHG 프로토콜","온실가스 프로토콜"],["관할 당국","거래소"]],"bonus":[["방법별","세분화"]],"wrong":["모든 기업이 항상 방법별로 세분화해야 한다","모든 방법으로 다시 측정해 공시해야 한다"],"model":"스코프 1·2 배출량에 GHG 프로토콜로 측정한 배출량과 관할 당국이나 거래소가 요구하는 방법으로 측정한 배출량이 섞여 있을 때에만 방법별로 세분화한다.","src":"문단 29⑴㈒"},"check":{"q":"문단 29C가 요구하는 것은?","options":["모든 기업이 카테고리 15를 금융배출량으로 한정해야 한다","카테고리 15를 포함하면 그 총계와 금융배출량 소계를 공시한다","파생상품 관련 배출량을 반드시 포함해야 한다"],"ans":1,"why":"29A의 한정은 선택이고 파생상품은 뺄 수 있다. 29C는 카테고리 15를 포함하는 기업에 총계와 금융배출량 소계 공시를 요구한다(BC136)."},"summary":["온실가스는 tCO2e로 스코프 1·2·3 절대 총배출량을 공시하고, GHG 프로토콜(2004)을 기본으로 하되 관할권 요구 방법을 쓸 수 있다.","KSSB 29⑴㈒는 측정 방법이 섞인 경우에만 스코프 1·2를 방법별로 나누게 하며, 스코프 2는 지역기반이 필수이고 시장기반은 선택이다.","스코프 3는 포함한 카테고리를 밝히고, 카테고리 15는 금융배출량으로 한정할 수 있으며 포함하면 총계와 금융배출량 소계를 공시한다."]},{"id":"k2-9","title":"지표 ② 나머지 산업전반 지표와 산업기반 지표","range":"문단 29⑵~⑺, 30~32 (+B64~B65)","pages":[17,22],"min":15,"intro":"온실가스를 뺀 나머지 산업전반 지표 여섯 범주와 산업기반 지표를 읽는다. KSSB는 내부 탄소 가격의 톤당 가격과 산업기반 지표를 기업이 공시 여부를 선택할 수 있게 했다.","blocks":[{"no":"29⑵","label":"위험·기회에 노출된 자산과 사업활동 (29⑵~⑷, 30·31)","pdfPage":20,"prose":["29⑵~⑷는 금액과 백분율을 묻는다. ⑵ 전환 위험에 취약한 자산이나 사업활동, ⑶ 물리적 위험에 취약한 자산이나 사업활동, ⑷ 기후 관련 기회에 부합하는 자산이나 사업활동이다. 침수 위험 지역 공장의 장부금액과 그것이 전체 유형자산에서 차지하는 비율이 ⑶의 답이 될 수 있다. BC76은 이런 범주를 일부러 구체적으로 적지 않아 기업이 적절한 지표를 스스로 찾게 했다고 설명한다.","문단 30은 근거 있는 정보를 과도한 원가나 노력 없이 구해 쓰라고 하고, 문단 31은 B64~B65를 참조하라고 한다. B65는 기간범위(10~10B), 위험이 집중된 부분(13), 재무 영향 공시(16)를 고려하고, 재무제표 금액과의 연계를 살피라고 한다. 기아 보고서는 전동화 차량 매출 비중을 2025년 31.0%로 공시했는데, 올해부터 HEV·PHEV를 포함했다고 적어 연도 비교 때 범위 변경을 함께 봐야 한다."],"req":"전환 위험·물리적 위험에 취약한 자산·사업활동과 기회에 부합하는 자산·사업활동의 금액과 백분율을 공시하고, 재무제표와의 연계를 고려한다.","ex":{"k":"기아 보고서에서는","t":"전동화 차량 매출 비중을 2023년 26.3%, 2024년 27.0%, 2025년 31.0%로 공시하고(내부관리회계 기준), 전년도까지는 EV만 포함하다가 금년부터 HEV·PHEV를 범위에 추가했다고 밝혔다.","co":"kia","page":130}},{"no":"29⑸","label":"자본 배치","pdfPage":20,"prose":["29⑸는 기후 위험·기회에 대비해 배치한 자본적 지출, 자금조달, 투자 금액을 공시하라고 한다. 자본적 지출(CAPEX)은 설비나 건물처럼 오래 쓰는 자산에 들이는 돈이다. 회사가 말로만 전환을 이야기하는지, 실제로 돈을 쓰고 있는지를 숫자로 확인하게 해 주는 지표다. 다른 기업과 비교할 때는 같은 기준의 금액인지, 예를 들어 계획 금액인지 실제 집행액인지도 함께 봐야 한다.","이 지표는 전략 문단 14⑵와 짝을 이룬다. 14⑵가 자원을 어떻게 마련하는지를 서술로 보여 준다면, 29⑸는 얼마를 배치했는지를 숫자로 보여 준다. 기아 보고서는 탄소감축투자의 연간 예산과 주요 자본지출 계획을 세워 관리하며, 주요 항목은 RE100(사용 전력을 모두 재생에너지로 바꾸겠다는 약속) 이행과 사업장 에너지 효율화 투자라고 적었다. 그 금액까지 제시되는지가 29⑸ 관점의 확인 포인트다."],"req":"기후 위험·기회에 대비해 배치한 자본적 지출, 자금조달, 투자 금액을 공시한다.","ex":{"k":"기아 보고서에서는","t":"탄소감축투자의 성과를 위해 연간 예산과 주요 자본지출 계획을 수립해 관리하며, 주요 예산 항목은 RE100 이행(태양광 자체발전, PPA 계약 등)과 사업장 에너지 효율화 투자라고 밝혔다.","co":"kia","page":24},"terms":[{"t":"자본적 지출","d":"설비나 건물처럼 오래 쓰는 자산을 사거나 개선하는 데 쓰는 돈이다.","en":"capital expenditure"}]},{"no":"29⑹","label":"내부 탄소 가격: 적용 방식은 의무, 톤당 가격은 선택 (KSSB)","pdfPage":20,"prose":["29⑹㈎는 기업이 탄소 가격을 의사결정(투자 의사결정, 이전가격, 시나리오 분석 등)에 적용하는지와 어떻게 적용하는지를 설명하라고 한다. ㈏는 배출량 원가를 평가하는 데 쓰는 톤당 가격을 묻지만, 그 공시 여부는 기업이 선택할 수 있다고 덧붙인다. IFRS S2는 톤당 가격도 공시하게 하지만 KSSB는 선택으로 두었다(BC179). 부록 A는 내부 탄소 가격의 유형으로 잠재 가격과 내부 탄소세를 든다.","BC149·BC151은 결정 방법과 실무가 아직 성숙하지 않아 이제 막 도입한 기업에 톤당 가격을 요구하면 불필요한 부담이 될 수 있다고 보았고, 적용 여부와 방식은 전환 의지를 보여 주므로 의무로 남겼다. BC152는 내부 탄소 가격을 운영하지 않는 기업은 그 사실을 공시할 것이라고 적는다. 기아는 적용 방식만, 현대자동차는 USD 7~84/tCO2-eq라는 가격 범위까지 밝혔다."],"req":"탄소 가격을 의사결정에 적용하는지와 그 방법을 설명하고, 톤당 가격은 공시 여부를 선택할 수 있다.","quote":"다만, 기업은 이러한 온실가스 배출량 톤당 가격의 공시 여부를 선택할 수 있다.","fig":{"cap":"내부 탄소 가격 공시 비교","head":["회사","적용 여부·방식(29⑹㈎, 의무)","톤당 가격(29⑹㈏, 선택)"],"rows":[["기아(33쪽)","생산공장 투자 의사결정에 Shadow Price 기반 적용, 매년 HMG 경영연구원 전망 탄소가격으로 설정","수치 없음"],["현대자동차(41쪽)","스코프 1·2 대상 Shadow Price 방식, 에너지 효율 개선·저탄소 투자 검토 등에 활용","USD 7~84/tCO2-eq 범위에서 지역별 차등"]]},"ex":{"k":"현대자동차 보고서에서는","t":"2025년 기준 내부 탄소 가격을 사업장이 위치한 지역의 배출권거래제 거래 가격을 바탕으로 USD 7~84/tCO2-eq 범위 내에서 차등 적용한다고 밝혔다.","co":"hyundai","page":41},"terms":[{"t":"잠재 가격","d":"실제로 부과하지 않고 판단에만 쓰는 가상의 탄소 비용이다.","en":"shadow price"},{"t":"내부 탄소 가격","d":"투자나 생산 결정의 재무적 영향을 평가하려고 기업이 스스로 쓰는 탄소 가격이다.","en":"internal carbon price"}]},{"no":"29⑺","label":"보상","pdfPage":20,"prose":["29⑺은 ㈎ 기후 관련 사항이 경영진 보상에 고려되는지와 어떻게 고려되는지, ㈏ 당기에 인식된 경영진 보상 중 기후 관련 고려사항과 연계된 보상의 백분율을 공시하라고 한다. ㈎는 거버넌스 문단 6⑴㈒와 이어진다. 보상은 경영진이 실제로 무엇에 움직이는지를 보여 주므로 투자자가 눈여겨본다. 경영진 평가에 기후 항목이 들어 있으면 목표가 실제 경영 행동으로 이어질 가능성이 커진다고 보는 것이다.","주의할 점은 ㈏가 '보상의 백분율'이라는 것이다. 기아 보고서는 CEO KPI가 지속경영지표 20%, 재무지표 35%, 사업 및 전략지표 45%로 구성되고 지속경영지표 안에 탄소배출 감축 성과 등이 들어간다고 적었다. 현대자동차 보고서도 CEO 등의 KPI에 기후 항목을 넣어 상여금 산정에 반영한다고 밝혔다. ㈎에 대한 좋은 답이지만, KPI 비중이 곧 '기후 연계 보상의 백분율'과 같은지는 따로 확인해야 한다."],"req":"기후 사항이 경영진 보상에 반영되는지와 방식, 당기 경영진 보상 중 기후 연계 보상의 백분율을 공시한다.","ex":{"k":"기아 보고서에서는","t":"CEO KPI가 지속경영지표(20%), 재무지표(35%), 사업 및 전략지표(45%)로 구성되며, 지속경영지표 내에 탄소배출 감축 성과 등의 ESG 과제가 포함된다고 적었다.","co":"kia","page":24}},{"no":"32","label":"산업기반 지표는 선택 (KSSB 고유)","pdfPage":22,"prose":["문단 32는 기업이 산업의 특징을 반영한 사업모형·활동과 연관된 산업기반 지표를 공시할 수 있다고 하고, 무엇을 공시할지 정할 때 IFRS S2 산업기반 지침의 지표를 참고할 수 있다고 한다. 문단 28⑵도 산업기반 지표의 공시 여부를 선택할 수 있다고 적는다. BC179가 정리하듯 IFRS S2가 산업기반 지표를 공시하게 하는 것과 다른 점이다.","BC155는 이유를 든다. 지금은 공통으로 쓸 만한 산업별 기준이 없고, 지침의 바탕인 SASB 기준을 ISSB가 개선하는 중이며, 지침 자체가 비강제라는 점이다. 그래서 KSSB는 선택하게 하고, 국제적으로 통용되는 산업별 기준이 마련되면 의무화를 다시 검토하기로 했다. BC154에 따르면 일부 이용자는 같은 산업 안의 비교가능성을 위해 의무화를 요구했다. 산업기반 지표를 공시하지 않더라도 산업전반 지표 일곱 범주는 모든 기업이 공시해야 한다는 점은 변하지 않는다."],"req":"산업기반 지표는 공시 여부를 선택할 수 있으며, 공시한다면 IFRS S2 산업기반 지침의 지표를 참고할 수 있다.","quote":"다만, 기업은 이러한 산업기반 지표의 공시 여부를 선택할 수 있다.","terms":[{"t":"산업기반 지표","d":"특정 산업의 사업모형이나 활동의 특징을 반영한 지표다.","en":"industry-based metrics"}],"qno":"28⑵"}],"write":{"q":"KSSB 제2호에서 내부 탄소 가격과 관련해 의무인 것과 선택인 것을 한 문장으로 구분하라.","must":[["적용","적용 여부"],["톤당 가격","톤당"],["선택","선택할 수"]],"bonus":[["의사결정","투자"]],"wrong":["내부 탄소 가격 공시 전체가 선택이다","톤당 가격은 반드시 공시해야 한다"],"model":"탄소 가격을 의사결정에 적용하는지와 어떻게 적용하는지는 공시해야 하지만, 톤당 가격은 공시 여부를 선택할 수 있다.","src":"문단 29⑹"},"check":{"q":"KSSB 제2호에서 공시 여부를 기업이 선택할 수 있는 것은?","options":["산업기반 지표","경영진 보상 중 기후 연계 보상의 백분율","물리적 위험에 취약한 자산의 금액과 백분율"],"ans":0,"why":"문단 28⑵와 32에 따라 산업기반 지표는 선택이다. 나머지 둘은 산업전반 지표로 모든 기업이 공시한다."},"summary":["온실가스 외 산업전반 지표는 전환·물리적 위험 취약 자산, 기회 부합 자산, 자본 배치, 내부 탄소 가격, 보상의 여섯 범주다.","이 지표들은 근거 있는 정보로 작성하고 재무제표 금액과의 연계를 고려한다(문단 30·31, B65).","KSSB는 내부 탄소 가격의 톤당 가격(29⑹㈏)과 산업기반 지표(28⑵·32)를 기업이 공시 여부를 선택하게 했다."]},{"id":"k2-10","title":"목표","range":"문단 33~37","pages":[22,24],"min":14,"intro":"기업이 세운 기후 목표와 법규로 지켜야 하는 목표를 어떻게 공시하는지 읽는다. 온실가스 목표에는 총량·순량 구분과 탄소 크레딧 사용 계획 같은 추가 요구가 붙는다.","blocks":[{"no":"33","label":"목표마다 밝힐 여덟 가지 특성","pdfPage":22,"prose":["문단 33은 기업이 세운 기후 관련 양적·질적 목표와 법률이나 규제로 충족해야 하는 목표를 공시하라고 한다. 목표마다 ⑴ 사용한 지표, ⑵ 목적(완화, 적응, 과학기반 이니셔티브 부합 등), ⑶ 적용되는 기업의 부분, ⑷ 적용 기간, ⑸ 진척도의 기준기간, ⑹ 주요 단계와 중간 목표, ⑺ 절대량인지 집약도인지, ⑻ 최신 국제 협약과 관할권의 약속이 목표에 어떻게 작용하는지를 밝힌다.","B66에 따르면 절대량 목표는 총량이나 그 변화, 집약도 목표는 사업 지표 대비 비율이나 그 변화다. BC49는 제2호가 목표를 세우라고 요구하지는 않으며 목표가 있을 때 공시하라는 것이라고 밝힌다. 현대자동차 보고서는 스코프 1+2를 기준연도 2024년 대비 2030년까지 약 42% 감축하는 목표를 1.5℃ 시나리오에 부합하는 목표로 SBTi 승인을 받았다고 적었다. ⑵·⑷·⑸·⑺이 한 문장에 담긴 예다."],"req":"기후 목표(법규상 목표 포함)마다 지표, 목적, 적용 범위, 기간, 기준기간, 중간 목표, 절대량·집약도 여부, 국제 협약의 영향을 공시한다.","ex":{"k":"현대자동차 보고서에서는","t":"스코프 1+2 배출량을 기준연도 2024년 대비 2030년까지 약 42% 감축하는 목표를 세웠고, 이는 1.5℃ 감축 시나리오에 부합하는 목표로 SBTi 승인을 받았다고 밝혔다.","co":"hyundai","page":40},"terms":[{"t":"절대량 목표","d":"배출 총량이나 총량의 변화로 정한 목표다.","en":"absolute target"},{"t":"집약도 목표","d":"생산량이나 매출 같은 사업 지표 대비 비율로 정한 목표다.","en":"intensity target"}]},{"no":"34","label":"목표 설정·검토 방법과 성과 (34~35)","pdfPage":23,"prose":["문단 34는 목표를 세우고 검토하는 접근법과 진척도 모니터링 방법을 공시하라고 하며, ⑴ 목표와 설정 방법의 제삼자 검증 여부, ⑵ 목표 검토 프로세스, ⑶ 진척도 모니터링 지표, ⑷ 목표 수정과 그 설명을 포함한다. 문단 35는 각 목표 대비 성과와 추세·변화 분석을 공시하라고 한다. 목표를 내걸기만 하고 결과는 보여 주지 않는 공시를 막으려는 문단이다.","⑴의 제삼자 검증은 SBTi 같은 외부 기관이 목표의 타당성을 확인했는지를 말한다. 기아 보고서는 SBTi로부터 단기 감축목표 승인을 2025년 10월에 받았고, 2024년 대비 스코프 1·2와 스코프 3 사용 단계 모두 2035년까지 63% 감축하는 목표를 세웠다고 적었다. 또 2025년 스코프 1&2 배출량 집약도 목표 0.34tCO2e/대와 실적 0.39tCO2e/대를 나란히 보여 주었는데, 이것이 문단 35가 말하는 목표 대비 성과다."],"req":"목표 설정·검토 접근법(제삼자 검증, 검토 프로세스, 모니터링 지표, 수정 내역)과 목표 대비 성과·추세 분석을 공시한다.","ex":{"k":"기아 보고서에서는","t":"2025년 온실가스 배출량 집약도(스코프 1&2) 목표 0.34tCO2e/대, 실적 0.39tCO2e/대, 2026년 목표 0.36tCO2e/대를 한 표에 제시했다.","co":"kia","page":42}},{"no":"36","label":"온실가스 목표의 추가 요구: 가스, 스코프, 총량·순량","pdfPage":23,"prose":["문단 36은 온실가스 배출량 목표에 다섯 가지를 더 묻는다. ⑴ 어떤 온실가스를 다루는지, ⑵ 스코프 1·2·3 중 무엇을 다루는지, ⑶ 총배출량 목표인지 순배출량 목표인지, ⑷ 부문별 탈탄소화 접근법으로 도출했는지, ⑸ 순배출량 목표 달성을 위한 탄소 크레딧의 계획된 사용이다. ⑶에서 순배출량 목표를 공시하면 연관된 총배출량 목표도 따로 공시해야 한다. 부문별 탈탄소화 접근법은 업종별로 정해진 감축 경로에 맞춰 목표를 정하는 방법이다.","B68은 총배출량 목표가 가치사슬 안에서 계획한 배출의 총변화량이고, 순배출량 목표는 거기에 탄소 크레딧 같은 상쇄 노력을 반영한 것이라고 설명한다. B69는 순배출량 목표가 총배출량 목표 정보를 흐리게 해서는 안 된다고 못 박는다. '탄소중립' 같은 순배출 개념의 목표만 내세우면 실제로 얼마나 줄이고 얼마나 상쇄할지 보이지 않기 때문이다. 그래서 순배출량 목표가 있다면 감축분과 상쇄분이 각각 얼마인지 읽을 수 있어야 한다."],"req":"온실가스 목표는 대상 가스, 스코프, 총량·순량 여부(순량이면 총량 목표 별도 공시), 부문별 탈탄소화 접근 여부, 탄소 크레딧 계획을 공시한다.","terms":[{"t":"순배출량 목표","d":"총배출량에서 탄소 크레딧 같은 상쇄를 반영해 정한 목표다.","en":"net greenhouse gas emissions target"},{"t":"부문별 탈탄소화 접근법","d":"업종별 감축 경로에 맞춰 목표를 도출하는 방법이다.","en":"sectoral decarbonisation approach"}]},{"no":"36⑸","label":"탄소 크레딧 사용 계획","pdfPage":23,"prose":["36⑸는 탄소 크레딧을 쓸 계획이라면 ㈎ 순배출량 목표 달성에 크레딧을 얼마나 쓰고 의존하는지, ㈏ 크레딧을 검증하거나 인증하는 제삼자 제도, ㈐ 크레딧의 유형(자연 기반인지 기술적 탄소제거인지, 감축인지 제거인지), ㈑ 신뢰성과 무결성을 이해하는 데 필요한 기타 요소(예: 상쇄의 영구성 가정)를 공시하라고 한다. 탄소 크레딧은 감축이나 제거를 나타내는 배출량 단위다.","B71은 요구되는 것은 '계획된 사용'이지만 이미 사 둔 크레딧 정보가 이해에 도움이 되면 포함할 수도 있다고 한다. 현대자동차 보고서는 2045년 잔여 배출을 처리하기 위해 CCUS(탄소 포집·활용·저장)에 투자하고 해조류 기반 블루카본 바다숲 조성 같은 상쇄 활동을 추진한다고 밝혔다. 이런 계획이 순배출 목표에서 차지하는 정도와 유형을 ㈎·㈐ 관점에서 확인하면 된다."],"req":"순배출량 목표에 쓸 탄소 크레딧의 사용 정도와 의존도, 검증·인증 제도, 유형, 신뢰성·무결성 관련 요소를 공시한다.","ex":{"k":"현대자동차 보고서에서는","t":"2045년 잔여 탄소 배출을 처리하기 위해 CCUS에 투자하고, 폐배터리 재활용과 해양 생태계 복원 등 탄소 상쇄 활동을 지속 추진하겠다고 밝혔다.","co":"hyundai","page":40},"terms":[{"t":"탄소 크레딧","d":"탄소 크레딧 프로그램이 발행하는, 온실가스 감축이나 제거를 나타내는 배출량 단위다.","en":"carbon credits"}]},{"no":"37","label":"목표 지표는 공시 지표와 같은 언어로","pdfPage":24,"prose":["문단 37은 목표 설정과 진척도 모니터링에 쓸 지표를 고를 때 산업전반 지표(29)를 참조해 적용가능성을 고려하고, 산업기반 지표(32)는 참고할 수 있다고 한다. 적용 가능한 지속가능성 공시기준서의 지표나 제1호 요구사항을 충족하는 지표도 포함된다. B67은 기업이 자체 개발한 지표라면 제1호 문단 50에 따라 그 지표 정보를 공시하라고 한다.","실무에서는 '목표 지표와 공시 지표를 같은 언어로 쓰라'는 뜻으로 읽으면 된다. 스코프 1·2 감축 목표를 세웠다면 문단 29⑴의 스코프 1·2 수치로 진척도를 보여 주는 것이 가장 자연스럽다. 목표만 다른 기준으로 계산하면 투자자는 성과를 확인하기 어렵다. 자체 지표를 쓴다면 그 정의와 계산 방법을 함께 밝혀야 다른 기업과 비교할 수 있다."],"req":"목표 지표는 산업전반 지표를 참조해 적용가능성을 고려하고 산업기반 지표는 참고할 수 있으며, 자체 개발 지표는 제1호 문단 50에 따라 공시한다."}],"write":{"q":"문단 36⑶에 따라 순배출량 목표를 공시하는 기업이 추가로 해야 할 일은?","must":[["총배출량 목표","총량 목표","총배출량"],["별도","따로"],["공시","밝"]],"bonus":[["흐리게","불분명"]],"wrong":["순배출량 목표만 쓰면 된다"],"model":"순배출량 목표를 공시하는 경우 그와 연관된 총배출량 목표를 별도로 공시해야 한다.","src":"문단 36⑶"},"check":{"q":"B69가 금지하는 것은?","options":["순배출량 목표를 세우는 것","순배출량 목표가 총배출량 목표 정보를 불분명하게 하는 것","탄소 크레딧을 구입하는 것"],"ans":1,"why":"B69는 순배출량 목표를 공시하더라도 총배출량 목표 정보를 흐리게 해서는 안 된다고 한다. 순배출량 목표나 크레딧 구입 자체를 금지하지는 않는다."},"summary":["기후 목표는 기업이 세운 목표와 법규상 목표 모두이며, 목표마다 지표·목적·범위·기간·기준기간·중간 목표·절대량/집약도·국제 협약 영향을 밝힌다.","목표의 제삼자 검증, 검토 과정, 수정 내역과 목표 대비 성과·추세를 함께 공시한다.","온실가스 목표는 가스·스코프·총량/순량을 밝히고, 순량 목표면 총량 목표를 따로 쓰며 탄소 크레딧 계획을 설명한다."]},{"id":"k2-11","title":"시행일·경과규정과 IFRS와의 차이 정리","range":"부록 C·D, 결론도출근거 BC171~BC179","pages":[59,163],"min":15,"intro":"제2호가 언제부터 적용되는지, 처음 적용할 때 어떤 완화가 있는지(부록 C·D)를 읽는다. 그리고 결론도출근거 BC179가 정리한 IFRS S2와의 차이를 한 표로 복습한다.","blocks":[{"no":"C1","label":"시행일과 최초 적용일 (C1~C2)","pdfPage":59,"prose":["C1은 제2호를 최초 공표일이 포함되는 회계연도부터 적용한다고 정하면서, 관련 법률이나 규정이 이 기준에 따른 공시를 요구해 적용하는 경우에는 그 법규가 정한 시행일을 따른다고 한다. 기업은 법정 시행일 전에 자발적으로 적용할 수도 있다. 실제 의무 시기는 기준서가 아니라 정부의 제도화 일정에서 정해진다는 뜻이다. 금융위원회가 발표한 제도화 일정은 이 교재의 k0에서 따로 다룬다.","C2는 경과규정을 적용하기 위한 '최초 적용일'을 기업이 이 기준서를 처음 적용하는 회계연도의 개시일로 정의한다. 12월 결산 기업이 2026 회계연도에 처음 적용하면 최초 적용일은 2026년 1월 1일이다. 아래의 완화 기간은 모두 이 날짜에서부터 센다. 회계연도가 1월에 시작하지 않는 기업이라면 그 회계연도의 첫날이 최초 적용일이 된다."],"req":"제2호는 공표일이 포함된 회계연도부터(법규가 요구하면 법규상 시행일부터) 적용하며, 최초 적용일은 처음 적용하는 회계연도의 개시일이다.","terms":[{"t":"최초 적용일","d":"기업이 기준서를 처음 적용하는 회계연도의 개시일이다.","en":"date of initial application"}]},{"no":"C4","label":"경과 완화: 비교정보, 측정 방법, 스코프 3 3년 (C3~C5)","pdfPage":59,"prose":["C3에 따라 처음 적용하는 회계연도에는 비교정보(전년도 수치)를 공시하지 않아도 된다. C4는 두 완화를 하나 또는 둘 다 쓸 수 있게 한다. ⑴ 최초 적용일 직전 회계연도에 GHG 프로토콜 외의 방법으로 배출량을 측정했다면 처음 적용하는 회계연도에는 그 방법을 계속 써도 된다. ⑵ 최초 적용일 이후 3년간 스코프 3를 공시하지 않을 수 있고, 금융 활동 기업은 같은 기간 금융배출량 추가 정보도 공시하지 않을 수 있다.","IFRS S2의 스코프 3 완화는 적용 첫해 면제이지만 KSSB는 3년으로 늘렸다(BC179). BC175는 한국이 제조업 중심이라 가치사슬이 복잡하고 협력업체가 많아 스코프 3 데이터를 모으는 데 현실적 제약이 있다는 점을 이유로 든다. C5와 BC176에 따라 최초 적용일이 2026년 1월 1일이고 2028년까지 스코프 3를 공시하지 않았다면 2029년 공시에서 스코프 3 비교정보를 내지 않아도 된다.","BC177은 완화를 반드시 써야 하는 것은 아니라고 한다. 처음부터 비교정보를 내거나, GHG 프로토콜로 측정하거나, 스코프 3를 공시하는 것이 금지되지 않는다. 이미 스코프 3를 공시하고 있는 기아와 현대자동차 같은 기업은 완화를 쓰지 않고 계속 공시하는 선택을 할 수 있다. 아직 스코프 3를 산정해 본 적이 없는 기업은 3년을 준비 기간으로 쓰되, BC175가 조기 공시도 가능하다고 본 점을 기억해 둔다."],"req":"첫해 비교정보 면제, 첫해 기존 측정 방법 유지, 최초 적용일 이후 3년간 스코프 3(금융배출량 추가 정보 포함) 공시 면제를 쓸 수 있다.","fig":{"cap":"최초 적용일이 2026년 1월 1일인 기업의 예(BC173·BC176)","head":["회계연도","스코프 3(C4⑵ 사용 시)","측정 방법(C4⑴ 사용 시)"],"rows":[["2026","공시하지 않을 수 있음","기존 방법 계속 사용 가능"],["2027","공시하지 않을 수 있음","GHG 프로토콜로 측정(2026년 비교정보는 기존 방법 수치)"],["2028","공시하지 않을 수 있음","GHG 프로토콜"],["2029","공시(2028년 비교정보는 요구되지 않음)","GHG 프로토콜"]]}},{"no":"D1","label":"자발적 적용 기업의 경과규정 재적용 (D1)","pdfPage":61,"prose":["부록 D의 D1은 기업이 이 기준서를 자발적으로 적용하다가 나중에 법률이나 규정으로 적용을 요구받으면, 그 법규에 따라 처음 적용하는 회계연도의 개시일을 최초 적용일로 본다고 정한다. 자발적으로 먼저 시작한 기업도 의무 공시로 넘어갈 때 3년 스코프 3 완화 같은 경과규정을 다시 쓸 수 있다는 뜻이다. 최초 적용일이 뒤로 옮겨지므로 완화 기간도 그 날짜부터 다시 센다.","BC178은 자발적 적용 기업이 의무 체계로 넘어갈 때 경과규정을 못 쓰는 부담을 피하고 실무 체계를 다시 정비할 기회를 주려는 것이라고 설명한다. 먼저 시작한 기업이 손해를 보지 않게 해서 자발적 공시를 장려하는 장치다. BC179 표도 이 항목을 IFRS S2에 없는 차이로 적었다. BC178은 또 법정 시행일 이전에도 이 기준서를 자발적으로 적용할 수 있다는 점을 명확히 했다고 적는다."],"req":"자발적 적용 기업이 이후 법규로 적용을 요구받으면 법규상 첫 적용 회계연도 개시일을 최초 적용일로 보아 경과규정을 다시 적용할 수 있다."},{"no":"BC179","label":"IFRS S2와의 차이 한눈에","pdfPage":162,"prose":["BC179는 제2호가 IFRS S2를 바탕으로 만들어졌지만 국내 산업 특성과 기업의 준비 상황을 고려해 몇 가지 차이를 두었다고 정리한다. 차이는 크게 세 방향이다. 3A(미공시 사실·근거)와 29⑴㈒(측정 방법별 세분화)는 더 요구하는 것, 스코프 3 3년 유예와 톤당 가격·산업기반 지표 선택은 부담을 덜어 주는 것, 10B(기간범위 정의)와 D1은 선택지를 더한 것이다.","카테고리 15를 금융배출량으로 한정하는 29A~29C는 ISSB의 2025년 IFRS S2 개정을 반영한 것이어서 BC179 표에 차이로 오르지 않았다. 29B에서 제외한 금융활동을 수치 대신 질적으로 설명하게 한 점도 같다. KSSB는 국내 의견을 반영해 이렇게 정했고(BC131·BC135·BC136), ISSB도 최종 개정에서 공개초안의 수치 공시 대신 질적 설명을 택했다(IFRS S2 BC121J). 또 BC155는 산업기반 지표 의무화를 나중에 다시 검토하겠다고 했으므로, 지금의 선택 항목이 계속 선택으로 남는다고 단정하지 말고 개정 소식을 확인해야 한다.","이 표를 기억할 때는 '두 개 더, 셋 덜고, 둘 열어 줌'으로 묶으면 쉽다. 더 요구하는 것은 3A와 29⑴㈒, 덜어 주는 것은 스코프 3 3년 유예, 톤당 가격 선택, 산업기반 지표 선택이다. 선택지를 열어 준 것은 10B의 기본 기간과 D1의 자발적 적용 기업 완화다. 산업기반 지침을 '참고할 수 있다'로 둔 것은 산업기반 지표 선택과 같은 흐름으로 이해하면 된다."],"req":"BC179가 정리한 IFRS S2와의 차이를 추가 요구, 부담 완화, 선택지 추가로 구분해 이해한다.","quote":"KSSB는 작성자의 지속가능성 공시기준 적용 상황, 투자자의 요구, 국제 동향 등을 종합적으로 고려하여, 국제 정합성을 점진적으로 강화해 나갈 예정이다.","fig":{"cap":"BC179 표 요약: IFRS S2와 무엇이 다른가","head":["구분","KSSB 제2호","IFRS S2","관련 문단"],"rows":[["미공시 사실·근거","중요한 정보가 없어 생략하면 사실과 근거 기술","해당 규정 없음","3A"],["스코프 3 유예","최초 적용일 이후 3년간 공시하지 않을 수 있음","적용 첫해 면제","C4⑵"],["측정 방법별 세분화","여러 방법으로 스코프 1·2를 측정한 경우 방법별 구분 공시","해당 규정 없음","29⑴㈒"],["내부 탄소 가격","적용 여부와 방법 공시, 톤당 가격은 선택","적용 여부와 방법, 톤당 가격 공시","29⑹"],["산업기반 지표","공시할 수 있음","공시","28⑵, 32"],["산업기반 지침","참고할 수 있음","적용가능성을 고려","12, 23, 32, 37"],["기간범위 정의","단기 1년, 중기 1~5년, 장기 5년 이후로 정의(다른 정의도 가능)","정의하지 않음","10B"],["자발적 적용 기업","법규상 첫 적용 연도 개시일에 경과규정 재적용 가능","해당 규정 없음","D1"]]}}],"write":{"q":"IFRS S2와 비교해 KSSB 제2호의 스코프 3 경과규정은 어떻게 다른가?","must":[["3년","세 해"],["첫해","적용 첫해","1년"],["스코프 3","Scope 3"]],"bonus":[["최초 적용일","제조업"]],"wrong":["KSSB도 첫해만 면제한다","3년간 스코프 1·2도 면제된다"],"model":"IFRS S2는 적용 첫해에만 스코프 3 공시를 면제하지만, KSSB 제2호는 최초 적용일 이후 3년간 스코프 3를 공시하지 않을 수 있게 했다.","src":"문단 C4⑵, BC179"},"check":{"q":"BC179 표의 차이 중 'KSSB가 IFRS S2보다 더 요구하는 것'은?","options":["산업기반 지표 선택 공시","측정 방법이 섞인 경우 스코프 1·2의 방법별 세분화","스코프 3 3년 유예"],"ans":1,"why":"29⑴㈒의 방법별 세분화와 3A는 IFRS S2에 없는 추가 요구다. 나머지 둘은 부담을 덜어 주는 차이다."},"summary":["제2호는 공표일이 포함된 회계연도부터, 법규가 정하면 그 시행일부터 적용하며 자발적 조기 적용도 가능하다.","첫해 비교정보 면제, 첫해 기존 측정 방법 유지, 3년간 스코프 3 공시 면제를 쓸 수 있고, 자발적 적용 기업은 의무 전환 때 이를 다시 쓸 수 있다.","BC179는 3A·29⑴㈒(추가 요구), 스코프 3 유예·톤당 가격·산업기반 지표(부담 완화), 10B·D1(선택지 추가) 등 IFRS S2와의 차이를 정리한다."]}],"s2":[{"id":"s2-0","title":"들어가며: ISSB, IFRS S2, 그리고 KSSB","range":"머리말, 문단 C1, 2025년 개정 문단 C1A~C1B","pages":[3,45],"min":12,"intro":"이 책은 KSSB 제2호의 바탕이 된 국제 기준 IFRS S2를 문단 순서대로 읽으며, KSSB 제2호와 같은 점은 짧게, 다른 점은 자세히 확인한다. 본문에 앞서 IFRS S2를 누가 만들었고 IFRS S1·KSSB와 어떤 관계인지, 2025년 12월 개정이 무엇을 바꿨는지 정리한다. KSSB에서는 k0와 k2-1에서 읽었다.","blocks":[{"no":"ISSB","label":"IFRS S2는 누가, 어떤 모양으로 만들었나","pdfPage":5,"kssb":"제2호 머리말(문단 1~37, 부록 A~D)","diff":"differs","prose":["IFRS S2 '기후 관련 공시'는 국제지속가능성기준위원회(ISSB)가 2023년 6월에 발행한 기준서다. ISSB는 IFRS 재단 아래에서 국제 지속가능성 공시기준을 만드는 위원회이고, IFRS S2는 당시 위원 14명 전원의 찬성으로 승인되었다. 함께 나온 IFRS S1이 지속가능성 공시 전반의 일반 요구사항을 정하고, IFRS S2는 그중 기후라는 한 주제를 자세히 다룬다.","머리말은 IFRS S2가 문단 1~37과 부록 A~C로 이루어지며 모든 문단이 같은 권위를 가진다고 밝힌다. 부록 A는 용어 정의, 부록 B는 적용지침, 부록 C는 시행일과 경과규정이고, 세 부록 모두 기준서의 일부를 이룬다고 적혀 있다. 굵은 글씨 문단은 주요 원칙이다. KSSB 제2호는 같은 뼈대에 부록 D(자발적 적용)를 하나 더 두었다는 점만 다르다.","이 책이 읽는 원문은 2023년 6월 발행본 영문이다. 결론도출근거(BC)와 예시 지침은 이 원문 파일에 들어 있지 않아서, 다른 점의 이유는 주로 KSSB 결론도출근거와 2025년 개정 문서의 결론도출근거에서 찾는다. 영문 인용은 원문 그대로 두고, 해설은 우리말로 풀어 쓴다. 같은 문장이라도 영어 원문과 KSSB 한국어 문장을 나란히 놓고 보면 표현 차이가 잘 보인다."],"req":"IFRS S2의 발행 주체와 구성(문단 1~37, 부록 A~C), 모든 문단이 같은 권위를 가진다는 점을 안다.","quote":"All paragraphs have equal authority.","terms":[{"t":"ISSB","d":"IFRS 재단 아래에서 IFRS S1·S2 같은 국제 지속가능성 공시기준을 만드는 위원회다.","en":"International Sustainability Standards Board"}]},{"no":"IFRS S1","label":"IFRS S1과 함께 읽는다, KSSB는 S2에서 출발했다","pdfPage":5,"kssb":"제2호 머리말","diff":"same","prose":["머리말은 IFRS S2를 그 목적, 결론도출근거, 그리고 IFRS S1의 맥락에서 읽어야 한다고 적는다. 중요성, 보고기업, 연계된 정보, 비교정보 같은 공통 규칙은 S1에 있고, S2는 그 위에 기후 공시 내용을 얹는 구조다. 부록 C의 문단 C1도 S2를 일찍 적용하는 기업은 그 사실을 밝히고 S1을 같은 때 적용하라고 한다. 둘을 떼어 쓸 수 없다는 뜻이다.","KSSB도 같은 구조다. 제2호 머리말은 제1호의 맥락에서 이해하라고 하고, KSSB 결론도출근거 BC2는 국제 정합성과 기업 수용가능성을 균형 있게 고려하는 원칙을 세우고 IFRS S2를 기반으로 제2호를 제정했다고 밝힌다. 그래서 두 기준서는 문단 번호가 대부분 같다. 이 책은 같은 문단은 짧게 확인하고, 다른 문단은 왜 다른지를 자세히 본다.","번호 읽는 법은 다르다. IFRS S2는 문단 29(a)(vi)(2)처럼 영문자와 로마 숫자를 쓰고, KSSB는 29⑴㈔②처럼 괄호 숫자와 한글 기호를 쓴다. 이 책은 IFRS S2 문단을 영문 표기 그대로, KSSB 문단은 'KSSB 문단 29⑴㈒'처럼 KSSB 표기로 적는다. 두 표기를 섞지 않으면 원문을 오가며 대조하기 쉽다."],"req":"IFRS S2는 IFRS S1과 함께 적용하며, KSSB 제2호는 IFRS S2를 기반으로 제정되었다.","quote":"If an entity applies this Standard earlier, it shall disclose that fact and apply IFRS S1 General Requirements for Disclosure of Sustainability-related Financial Information at the same time.","terms":[{"t":"IFRS S1","d":"지속가능성 관련 재무정보 공시의 일반 요구사항을 정한 ISSB 기준서로, KSSB 제1호의 바탕이다.","en":"General Requirements for Disclosure of Sustainability-related Financial Information"}],"qno":"C1"},{"no":"C1A","label":"2025년 12월 개정: 온실가스 공시 네 가지 손질 (2025년 개정)","pdfPage":13,"doc":"amend","amend2025":true,"src":"https://www.ifrs.org/content/dam/ifrs/publications/amendments/english/2025/issb-2025-1-amendments-ifrs-s2.pdf","kssb":"없음","diff":"s2only","prose":["ISSB는 2025년 12월 '온실가스 배출량 공시 개정'(Amendments to Greenhouse Gas Emissions Disclosures)을 발행했다. 개정 결론도출근거 BC80A는 기업들이 이행 과정에서 겪은 어려움 네 가지를 든다. 카테고리 15(투자) 배출량의 측정과 공시, 금융배출량을 산업별로 나눌 때의 GICS 사용, 관할권이 요구하는 측정 방법을 쓰는 완화, 최신 IPCC 지구온난화지수 사용 요구다.","문단 C1A는 개정이 손댄 문단을 열거한다. 문단 29(a)(ii), 29(a)(vi)(2), B21~B22, B24, B28, B37, B59, B62(a), B63(a), C4(b)를 고치고, 문단 29A~29C, B62A, B63A, C1B, C6을 새로 넣었다. 문단 C1B에 따라 2027년 1월 1일 이후 시작하는 연차 보고기간부터 적용하며, 일찍 적용할 수 있고 그렇게 하면 그 사실을 밝힌다.","KSSB 제2호는 2026년 2월 의결되면서 이 개정을 미리 담았다. KSSB BC125~BC129는 ISSB의 2025년 4월 공개초안으로 국내 의견을 모은 뒤, 12월 최종 개정과 유의적인 차이가 없음을 확인하고 추가 절차 없이 반영했다고 설명한다. 그래서 KSSB 29A~29C, B21~B22, B24, B62A, B63A는 개정된 IFRS S2와 거의 같은 문장이다. 이 책은 개정 내용을 '2025년 개정'으로 따로 표시한다."],"req":"2025년 개정은 온실가스 공시 네 가지를 손질했고 2027-01-01 이후 시작 보고기간부터 적용하며(조기 적용 가능), KSSB 제2호는 이를 이미 반영했다.","quote":"An entity shall apply the amendments listed in paragraph C1A for annual reporting periods beginning on or after 1 January 2027. Earlier application is permitted.","fig":{"cap":"2025년 개정 네 가지와 KSSB 대응 (개정 문단 C1A, BC80A / KSSB BC125)","head":["사안","IFRS S2 개정 문단","KSSB 제2호"],"rows":[["카테고리 15를 금융배출량으로 한정","29A~29C (추가)","29A~29C"],["금융배출량 산업 분류(GICS 의무 대신 분류체계 선택)","B62A, B63A (추가)","B62A, B63A"],["관할권 요구 측정 방법(기업 전체 또는 일부)","29(a)(ii), B24, B28","29⑴㈏, B24, B28"],["관할권 요구 지구온난화지수 값","B21~B22","B21~B22"]]}}],"write":{"q":"IFRS S2 2025년 개정은 언제부터 적용되고, KSSB 제2호와는 어떤 관계인가?","must":[["2027"],["조기","일찍"],["반영","담았"]],"bonus":[["C1B"],["BC129","BC125"]],"wrong":["2024년부터 적용된다","KSSB는 이 개정을 반영하지 않았다"],"model":"2025년 개정은 2027년 1월 1일 이후 시작하는 보고기간부터 적용되고 조기 적용도 할 수 있으며, KSSB 제2호는 이 개정을 이미 반영했다.","src":"문단 C1A~C1B(2025년 개정), KSSB BC129"},"check":{"q":"IFRS S2를 일찍 적용하는 기업에 문단 C1이 함께 요구하는 것은?","options":["조기 적용 사실을 밝히고 IFRS S1을 같은 때 적용한다","KSSB 기준을 함께 적용한다","첫해부터 스코프 3를 공시한다"],"ans":0,"why":"문단 C1은 조기 적용하면 그 사실을 공시하고 IFRS S1을 동시에 적용하라고 한다. 두 기준서는 함께 쓰도록 짜여 있다."},"summary":["IFRS S2는 ISSB가 2023년 6월 발행한 기후 공시 기준서로, 문단 1~37과 부록 A~C가 같은 권위를 가진다.","IFRS S2는 IFRS S1과 함께 적용하며, KSSB 제2호는 IFRS S2를 기반으로 만들어져 문단 번호가 대부분 같다.","2025년 12월 개정은 온실가스 공시 네 가지를 손질해 2027년부터 적용되며, KSSB 제2호는 이를 미리 반영했다."]},{"id":"s2-1","title":"목적과 적용범위","range":"문단 1~4","pages":[6,6],"min":10,"intro":"IFRS S2가 어떤 정보를 누구를 위해 요구하는지, 어떤 위험과 기회가 대상인지 읽는다. 문장은 KSSB와 거의 같지만, KSSB에 있는 문단 3A가 IFRS S2에는 없다. KSSB에서는 k2-1에서 읽었다.","blocks":[{"no":"1","label":"목적과 '기업 전망' (문단 1~2)","pdfPage":6,"kssb":"1","diff":"same","prose":["문단 1은 IFRS S2의 목적을 일반목적재무보고서의 주요이용자, 곧 투자자·대여자·채권자가 기업에 돈을 댈지 판단할 때 쓸모 있는 기후 관련 위험과 기회 정보를 공시하게 하는 것이라고 한다. 각주는 '주요이용자'와 '이용자'를 같은 뜻으로 쓴다고 밝힌다. KSSB 문단 1과 각주까지 같은 내용이다. 이 독자 설정이 이후 모든 문단에서 '무엇을 공시할지'를 가르는 기준이 된다.","문단 2는 대상을 단기·중기·장기에 걸쳐 현금흐름, 자금조달 접근성, 자본비용에 영향을 줄 것으로 합리적으로 예상할 수 있는 위험과 기회로 좁히고, 이를 '기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 있는 기후 관련 위험 및 기회'라고 부른다. 영문으로는 'could reasonably be expected to affect the entity's prospects'이고, 이 긴 이름은 이후 문단마다 반복된다."],"req":"주요이용자의 자원 제공 결정에 유용한, 기업 전망에 영향을 줄 것으로 합리적으로 예상되는 기후 관련 위험·기회 정보를 공시한다.","quote":"Throughout this Standard, the terms ‘primary users’ and ‘users’ are used interchangeably, with the same meaning.","terms":[{"t":"주요이용자","d":"현재 및 잠재적 투자자, 대여자와 그 밖의 채권자다.","en":"primary users"}]},{"no":"3","label":"적용범위: 물리적 위험, 전환 위험, 기회","pdfPage":6,"kssb":"3","diff":"same","prose":["문단 3은 기준서의 대상을 기업이 노출된 기후 관련 물리적 위험과 전환 위험, 그리고 기업이 이용할 수 있는 기후 관련 기회로 정한다. 부록 A는 물리적 위험을 폭풍·홍수·가뭄·폭염 같은 사건에서 오는 급성 위험과 강수·기온의 장기 변화에서 오는 만성 위험으로 나누고, 전환 위험에는 정책·법률·기술·시장·평판 위험이 들어간다고 정의한다.","부록 A의 정의는 위험이 돈으로 이어지는 길도 함께 적는다. 물리적 위험은 자산의 직접 손상이나 공급망 차질 같은 간접 영향으로, 전환 위험은 새 규제로 늘어난 운영비나 자산 손상으로 재무적 영향을 줄 수 있다고 한다. 기회는 기후변화가 기업에 줄 수 있는 긍정적 영향이며 완화와 적응 노력에서 생길 수 있다. 이 분류와 정의는 KSSB 부록 A와 같다."],"req":"기업이 노출된 물리적·전환 위험과 이용할 수 있는 기후 관련 기회에 적용한다.","terms":[{"t":"급성 물리적 위험","d":"폭풍·홍수·폭염처럼 사건으로 생기는 물리적 위험이다.","en":"acute physical risk"},{"t":"만성 물리적 위험","d":"기온·강수 패턴의 장기 변화에서 생기는 물리적 위험이다.","en":"chronic physical risk"}]},{"no":"4","label":"적용범위 밖, 그리고 KSSB 3A가 없다는 점","pdfPage":6,"kssb":"3A","diff":"differs","prose":["문단 4는 기업 전망에 영향을 줄 것으로 합리적으로 예상할 수 없는 위험과 기회는 적용범위 밖이라고 한다. 여기까지는 KSSB 문단 4와 같다. 차이는 그 앞에 있다. KSSB는 문단 3A를 두어, 중요한 정보가 없어 제2호에 따른 공시를 생략하는 기업도 그 사실과 근거를 공시하게 한다. IFRS S2의 문단 3과 4 사이에는 이런 문단이 없다.","IFRS S2에서는 중요한 정보가 없으면 공시하지 않으면 되고, 정보가 없다는 사실과 근거를 따로 적으라는 요구가 본문에 없다. KSSB BC179 표도 이 항목의 IFRS S2 칸을 비워 두었다. KSSB BC7에 따르면 공개초안 단계에서 일부 작성자가 ISSB 기준에 없는 요구라며 부담을 제기했지만, KSSB는 이 요구를 그대로 두었다.","실무에서 이 차이는 보고서의 빈칸에서 드러난다. IFRS S2만 적용한 보고서에 기후 공시가 아예 없다면, 독자는 중요하지 않다고 판단한 것인지 빠뜨린 것인지 구분하기 어렵다. KSSB를 적용하는 기업이 기후 공시 전체를 생략한다면 그 사실과 근거가 적혀 있어야 한다. 해외 보고서를 KSSB 기준으로 검토할 때 먼저 확인할 거리다."],"req":"기업 전망에 영향을 줄 것으로 합리적으로 예상할 수 없는 위험·기회는 적용범위 밖이다(KSSB 3A 같은 미공시 사실·근거 공시 요구는 없다).","quote":"Climate-related risks and opportunities that could not reasonably be expected to affect an entity’s prospects are outside the scope of this Standard."}],"write":{"q":"KSSB 문단 3A와 비교할 때 IFRS S2의 목적·적용범위 문단은 무엇이 다른가?","must":[["3A"],["사실","근거"],["없다","없음","요구하지 않"]],"bonus":[["생략"],["BC179"]],"wrong":["IFRS S2도 공시를 생략한 근거를 적게 한다","KSSB 3A는 IFRS S2 문단 4와 같은 내용이다"],"model":"IFRS S2에는 KSSB 3A처럼 중요한 정보가 없어 공시를 생략할 때 그 사실과 근거를 공시하라는 요구가 없다.","src":"문단 3~4, KSSB 문단 3A·BC179"},"check":{"q":"IFRS S2 문단 3의 적용 대상이 아닌 것은?","options":["기업이 노출된 기후 관련 물리적 위험","기업이 이용할 수 있는 기후 관련 기회","기업 전망에 영향을 줄 것으로 합리적으로 예상할 수 없는 기후 관련 위험"],"ans":2,"why":"문단 3은 물리적·전환 위험과 기회를 대상으로 하고, 문단 4는 기업 전망에 영향을 줄 것으로 합리적으로 예상할 수 없는 위험과 기회를 적용범위 밖으로 둔다."},"summary":["IFRS S2의 목적과 '기업 전망' 개념(문단 1~2)은 KSSB 제2호와 같다.","적용 대상은 물리적 위험(급성·만성), 전환 위험, 기후 관련 기회다.","KSSB 3A의 미공시 사실·근거 공시 요구는 IFRS S2에 없다."]},{"id":"s2-2","title":"거버넌스","range":"문단 5~7","pages":[6,7],"min":10,"intro":"기후 위험과 기회를 누가 어떻게 감독하는지 묻는 거버넌스 문단을 읽는다. 이 부분은 KSSB 제2호와 같은 문장이므로 요점과 영문 용어, TPT 매핑만 짚는다. KSSB에서는 k2-2에서 읽었다.","blocks":[{"no":"6(a)","label":"감독 기구 또는 개인 (문단 5, 6(a))","pdfPage":6,"kssb":"6⑴","diff":"same","prose":["문단 5는 거버넌스 공시의 목적을 이용자가 기후 위험과 기회를 모니터링·관리·감독하는 거버넌스 프로세스, 통제, 절차를 이해하게 하는 것이라고 한다. 문단 6(a)는 이사회나 위원회 같은 감독 기구 또는 개인을 밝히고, (i) 운영규정·위임권한 등에 책임이 어떻게 반영되는지, (ii) 필요한 기량과 역량을 어떻게 판단하는지를 묻는다.","이어서 (iii) 얼마나 자주 어떻게 보고받는지, (iv) 전략·주요 거래·위험관리를 감독할 때 기후를 어떻게 고려하고 절충(trade-offs)을 따졌는지, (v) 기후 목표 설정을 어떻게 감독하고 진척을 어떻게 모니터링하는지를 묻는다. (v)는 관련 성과지표가 보상정책에 포함되는지까지 묻고 문단 29(g)와 이어진다. KSSB 6⑴㈎~㈒와 순서와 내용이 같다.","영국 전환계획 태스크포스(TPT)의 기술 매핑은 문단 5와 6(a)에 TPT 권고 5.1, 5.3, 5.4, 5.5의 거버넌스 항목을 대응시킨다. 전환계획을 가진 기업이라면 이사회의 감독 내용을 쓸 때 TPT 권고를 보조 자료로 참고할 수 있다는 뜻이다. 다만 TPT 권고는 IFRS S2의 요구사항이 아니다. 그래서 TPT 권고를 따르지 않았다고 IFRS S2 위반이 되는 것은 아니다."],"req":"기후 위험·기회를 감독하는 기구나 개인을 밝히고, 책임 반영, 역량, 보고 빈도, 전략 감독 시 고려, 목표 감독과 보상 연계를 공시한다.","quote":"The objective of climate-related financial disclosures on governance is to enable users of general purpose financial reports to understand the governance processes, controls and procedures an entity uses to monitor, manage and oversee climate-related risks and opportunities.","terms":[{"t":"운영규정","d":"위원회 등이 맡은 역할과 권한을 적은 규정이다.","en":"terms of reference"}]},{"no":"6(b)","label":"경영진의 역할","pdfPage":7,"kssb":"6⑵","diff":"same","prose":["문단 6(b)는 기후 위험과 기회를 다루는 거버넌스 프로세스에서 경영진이 맡는 역할을 묻는다. (i) 그 역할이 특정 경영진 직책이나 경영진 위원회에 위임되는지와 그 직책이나 위원회를 어떻게 감독하는지, (ii) 경영진이 감독을 돕기 위해 통제와 절차를 쓰는지와 그것이 다른 내부 기능과 어떻게 통합되는지다. 영문 'management-level position'은 KSSB에서 '경영진 수준의 직책'으로 옮겼다.","이사회 감독(6(a))과 경영진 실행(6(b))을 나눠 묻는 이유는 이용자가 '누가 결정하고 누가 실행하는가'를 함께 보아야 하기 때문이다. TPT 매핑은 문단 6(b)에 TPT 권고 5.2를 대응시킨다. KSSB 6⑵㈎·㈏와 같은 문장이므로, KSSB 교재에서 본 실무 예시를 그대로 적용해도 된다. 검토할 때는 이사회 보고 주기와 경영진 위원회의 실무 점검이 서로 이어지는지를 함께 본다."],"req":"경영진 수준 직책·위원회로의 위임과 그 감독 방식, 통제·절차의 사용과 내부 기능 통합을 공시한다."},{"no":"7","label":"중복을 피하는 통합 공시","pdfPage":7,"kssb":"7","diff":"same","prose":["문단 7은 거버넌스 공시를 준비할 때 IFRS S1(문단 B42(b))에 따라 불필요한 중복을 피하라고 한다. 지속가능성 위험과 기회 전체를 하나의 거버넌스로 관리한다면, 위험마다 따로 쓰는 대신 통합된 거버넌스 공시를 할 수 있다. 다만 문단 6이 요구하는 정보 자체는 빠짐없이 제공해야 한다. 중복을 피하는 것은 쓰는 방식의 문제이지, 공시할 내용을 줄이는 근거가 아니다.","KSSB 문단 7도 제1호 문단 B42⑵를 가리키며 같은 내용을 담는다. 실무에서는 지속가능경영위원회 하나가 기후와 다른 주제를 함께 다루는 경우가 많아, 통합 공시가 흔하다. 이때 독자가 기후에 해당하는 감독 내용을 찾을 수 있도록 위치와 연결을 분명히 해 두는 것이 좋다. 예를 들어 통합 거버넌스 표 안에 기후 안건을 따로 표시해 두면 독자가 찾기 쉽고, 문단 6의 항목을 빠짐없이 채웠는지도 검토하기 쉬워진다."],"req":"IFRS S1에 따라 불필요한 중복을 피하고, 통합 관리하는 경우 통합된 거버넌스 공시를 할 수 있다.","quote":"In preparing disclosures to fulfil the requirements in paragraph 6, an entity shall avoid unnecessary duplication in accordance with IFRS S1 General Requirements for Disclosure of Sustainability-related Financial Information (IFRS S1) (see paragraph B42(b) of IFRS S1)."}],"write":{"q":"IFRS S2 문단 6(a)(v)는 기후 목표와 관련해 무엇까지 묻는가?","must":[["목표"],["진척","모니터링"],["보상"]],"bonus":[["29(g)"]],"wrong":["목표 수치만 공시하면 된다","보상과의 연계는 거버넌스와 무관하다"],"model":"문단 6(a)(v)는 거버넌스 기구가 기후 목표 설정을 어떻게 감독하고 진척을 어떻게 모니터링하는지, 관련 성과지표가 보상정책에 포함되는지까지 묻는다.","src":"문단 6(a)(v)"},"check":{"q":"IFRS S2의 거버넌스 문단(5~7)과 KSSB 제2호 문단 5~7의 관계로 옳은 것은?","options":["IFRS S2가 경영진 역할을 묻지 않는다","내용이 같다","KSSB만 중복 회피를 허용한다"],"ans":1,"why":"두 기준서의 거버넌스 문단은 감독 기구(6(a)), 경영진 역할(6(b)), 중복 회피(7)까지 같은 내용이다."},"summary":["문단 6(a)는 감독 기구나 개인의 책임, 역량, 보고, 전략 감독, 목표 감독과 보상 연계를 묻는다.","문단 6(b)는 경영진에게 위임된 역할과 통제·절차를 묻는다.","거버넌스 문단은 KSSB 제2호와 같고, TPT 매핑은 이를 TPT 권고 5.x에 대응시킨다."]},{"id":"s2-3","title":"전략 ① 위험·기회와 기간범위","range":"문단 8~12","pages":[8,9],"min":13,"intro":"전략 공시의 구성과 기후 위험·기회를 식별하는 문단을 읽는다. IFRS S2는 단기·중기·장기를 정의하지 않고, 산업기반 공시 주제를 '고려해야 한다'고 해서 KSSB와 두 군데가 다르다. KSSB에서는 k2-3에서 읽었다.","blocks":[{"no":"10","label":"위험과 기회를 설명하고 분류하기 (문단 8~10(c))","pdfPage":8,"kssb":"10","diff":"same","prose":["문단 8은 전략 공시의 목적을 기후 위험과 기회를 관리하는 기업의 전략을 이해하게 하는 것이라고 하고, 문단 9는 그 내용을 다섯 가지로 나눈다. 위험과 기회(문단 10~12), 사업모형과 가치사슬(13), 전략과 의사결정(14), 재무적 영향(15~21), 기후 회복력(22)이다. 이후 회차가 이 순서를 따른다. 각 부분은 따로 떨어진 것이 아니라 한 이야기로 이어져야 한다.","문단 10은 (a) 기업 전망에 영향을 줄 위험과 기회를 기술하고, (b) 위험마다 물리적 위험인지 전환 위험인지 설명하고, (c) 위험과 기회마다 영향이 나타날 기간이 단기·중기·장기 중 어디인지 밝히라고 한다. 여기까지 KSSB 10⑴~⑶과 같다. 하나의 위험이 두 성격을 함께 가질 수 있어도 기업이 어떻게 보았는지는 밝혀야 한다."],"req":"기업 전망에 영향을 줄 위험·기회를 기술하고, 위험마다 물리적·전환 구분과 영향이 나타날 기간범위를 밝힌다.","terms":[{"t":"기간범위","d":"위험이나 기회의 영향이 나타날 것으로 보는 단기·중기·장기 구간이다.","en":"time horizon"}]},{"no":"10(d)","label":"단기·중기·장기는 기업이 정한다 (KSSB 10A·10B 없음)","pdfPage":8,"kssb":"10B","diff":"differs","prose":["문단 10(d)는 기업이 '단기', '중기', '장기'를 어떻게 정의하는지와 그 정의가 전략적 의사결정에 쓰는 계획기간과 어떻게 이어지는지 설명하라고 한다. IFRS S2는 기본값을 주지 않는다. 몇 년을 단기로 볼지는 기업이 정하고, 그 이유를 계획기간과 묶어 설명하는 구조다. 그래서 같은 산업 안에서도 회사마다 단기가 1년일 수도, 3년일 수도 있다.","KSSB는 여기에 두 문단을 더했다. 10A는 기간범위가 산업과 기업에 따라 다를 수 있다고 설명하고, 10B는 보고기간 말 이후 1년 이내를 단기, 1년 초과 5년 이내를 중기, 5년 초과를 장기로 쓸 수 있게 한다. 10B를 쓰면 10⑷의 설명 대신 정의된 기간을 썼다고 밝히면 된다. KSSB BC179 표는 IFRS S2를 '단·중·장기를 정의하지 않음'으로 적었다.","BMW 그룹 2025 보고서는 IFRS S2가 아니라 유럽 지속가능성 보고 기준(ESRS)으로 작성되었지만, 기간을 스스로 정의한 예로 볼 수 있다. 기후 시나리오 분석에 쓴 기간이 중요성 평가의 기간인 2036년까지(중기)와 2050년까지(장기)를 덮는다고 적었다. IFRS S2 관점에서는 이런 정의가 전략 계획기간과 어떻게 이어지는지까지 설명되었는지를 본다."],"req":"단기·중기·장기의 정의와 그 정의가 전략적 의사결정 계획기간과 어떻게 연계되는지 설명한다(IFRS S2에는 기본 기간 정의가 없다).","quote":"explain how the entity defines ‘short term’, ‘medium term’ and ‘long term’ and how these definitions are linked to the planning horizons used by the entity for strategic decision-making.","ex":{"k":"BMW 보고서(ESRS 기준)에서는","t":"2025년 기후 위험·기회를 세 가지 기후 시나리오로 분석하면서, 사용한 기간이 중요성 평가 기간인 2036년까지(중기)와 2050년까지(장기)를 모두 포함한다고 밝혔다.","co":"bmw","page":99}},{"no":"11","label":"합리적이고 뒷받침될 수 있는 정보","pdfPage":9,"kssb":"11","diff":"same","prose":["문단 11은 위험과 기회를 식별할 때 보고일에 과도한 원가나 노력 없이 이용할 수 있는 합리적이고 뒷받침될 수 있는 모든 정보를 쓰라고 한다. 과거 사건, 현재 상황, 미래 예측 정보가 모두 들어간다. 영문 'reasonable and supportable information that is available to the entity at the reporting date without undue cost or effort'는 IFRS S2 곳곳에 반복된다.","쉽게 말해 근거 있는 정보를 지나친 비용 없이 구할 수 있는 만큼은 다 쓰라는 뜻이다. 완벽한 자료를 기다리라는 것도, 손에 있는 자료만 쓰라는 것도 아니다. 이 표현은 재무적 영향(문단 18), 시나리오 분석(B1), 스코프 3 측정(B39)에서도 같은 기준으로 쓰인다. KSSB 문단 11과 같다. 정보가 부족하다는 이유만으로 식별을 멈추지 말라는 경고이기도 하다."],"req":"보고일에 과도한 원가나 노력 없이 이용할 수 있는 합리적이고 뒷받침될 수 있는 모든 정보를 써서 위험과 기회를 식별한다.","terms":[{"t":"합리적이고 뒷받침될 수 있는 정보","d":"근거가 있고 설명할 수 있는 정보로, 과거·현재·미래 예측 정보를 포함한다.","en":"reasonable and supportable information"}]},{"no":"12","label":"산업기반 공시 주제를 '고려해야 한다'","pdfPage":9,"kssb":"12","diff":"differs","prose":["문단 12는 위험과 기회를 식별할 때 'IFRS S2 이행에 관한 산업기반 지침'에 정의된 산업기반 공시 주제를 참조하고 그 적용가능성을 고려해야 한다(shall refer to and consider the applicability)고 한다. 지침의 모든 주제를 공시하라는 뜻은 아니지만, 우리 산업 주제를 들여다보고 해당 여부를 판단하는 일 자체는 의무다.","KSSB 문단 12는 같은 자리에서 산업기반 공시 주제를 '참고할 수 있다'고 쓴다. 검토 자체가 선택이 된 것이다. KSSB BC179 표도 산업기반 지침을 IFRS S2는 '적용가능성을 고려', KSSB는 '참고할 수 있음'으로 나눠 적었다. 같은 차이가 문단 23, 32, 37에서도 반복되니 이 문장을 기억해 두면 뒤 회차가 쉬워진다.","실무에서 IFRS S2 기준이라면 자동차 회사는 산업기반 지침에서 자기 산업 항목의 공시 주제를 찾아 하나씩 해당 여부를 판단하고, 그 결과를 위험 식별에 반영했다는 흔적을 남겨야 한다. KSSB 기준이라면 검토하지 않아도 기준 위반은 아니지만, 해외 투자자가 IFRS S2와 비교해 읽는다면 검토 여부를 묻게 될 수 있다."],"req":"위험과 기회를 식별할 때 산업기반 지침의 산업기반 공시 주제를 참조하고 적용가능성을 고려한다(KSSB는 참고할 수 있다).","quote":"In identifying the climate-related risks and opportunities that could reasonably be expected to affect an entity’s prospects, the entity shall refer to and consider the applicability of the industry-based disclosure topics defined in the Industry-based Guidance on Implementing IFRS S2."}],"write":{"q":"IFRS S2 문단 10(d)와 KSSB 문단 10B는 기간범위에서 어떻게 다른가?","must":[["정의하지","정의가 없"],["설명"],["1년","5년"]],"bonus":[["계획기간"]],"wrong":["IFRS S2도 단기를 1년으로 정의한다","KSSB 10B의 기본 기간을 쓰는 기업도 10⑷의 정의 설명을 따로 해야 한다"],"model":"IFRS S2는 단기·중기·장기를 정의하지 않고 기업이 정의와 계획기간과의 연계를 설명하게 하지만, KSSB 10B는 1년·5년을 기준으로 한 기간범위를 쓸 수 있게 한다.","src":"문단 10(d), KSSB 문단 10B"},"check":{"q":"IFRS S2 문단 12가 산업기반 공시 주제에 대해 요구하는 것은?","options":["참조하고 적용가능성을 고려한다","원하면 참고할 수 있다","지침의 모든 주제를 공시한다"],"ans":0,"why":"문단 12는 'shall refer to and consider the applicability'라고 써서 검토를 의무로 둔다. '참고할 수 있다'는 KSSB 문단 12의 표현이다."},"summary":["문단 10(a)~(c)의 위험·기회 기술, 물리적·전환 구분, 기간범위 명시는 KSSB와 같다.","IFRS S2는 단기·중기·장기를 정의하지 않고 기업이 정의와 계획기간 연계를 설명하게 하며, KSSB 10A·10B는 IFRS S2에 없다.","IFRS S2 문단 12는 산업기반 공시 주제의 적용가능성 고려를 의무로 두지만, KSSB는 '참고할 수 있다'로 완화했다."]},{"id":"s2-4","title":"전략 ② 사업모형·가치사슬과 전환계획","range":"문단 13~14 (+TPT 기술 매핑)","pages":[9,10],"min":12,"intro":"기후 위험·기회가 사업모형과 가치사슬, 전략과 의사결정에 미치는 영향, 그리고 전환계획 공시를 읽는다. 문장은 KSSB와 같으므로, TPT 기술 매핑으로 전환계획을 어떻게 더 충실히 쓸 수 있는지에 무게를 둔다. KSSB에서는 k2-4에서 읽었다.","blocks":[{"no":"13","label":"사업모형과 가치사슬, 위험이 몰린 곳","pdfPage":9,"kssb":"13","diff":"same","prose":["문단 13은 기후 위험과 기회가 사업모형과 가치사슬에 미치는 현재 영향과 예상 영향을 기술하고(13(a)), 위험과 기회가 어디에 몰려 있는지 지리적 영역, 시설, 자산 유형 등으로 기술하라고 한다(13(b)). 부록 A는 가치사슬을 제품이 기획부터 폐기까지 가는 동안 기업이 쓰고 의존하는 상호작용, 자원, 관계 전체로 정의한다.","13(b)의 '집중된 곳'은 뒤의 지표 회차와 이어진다. 문단 B65(b)는 산업전반 지표(문단 29(b)~(g))를 준비할 때 이 집중 지점을 고려하라고 한다. 예를 들어 홍수 위험이 특정 지역 공장에 몰려 있다고 썼다면, 물리적 위험에 취약한 자산 금액도 그 공장과 맞아떨어져야 한다. KSSB 13과 같은 문장이다. 숫자와 서술이 따로 놀지 않게 하라는 뜻이다."],"req":"위험·기회가 사업모형과 가치사슬에 미치는 현재·예상 영향과, 위험·기회가 집중된 지역·시설·자산 유형을 기술한다.","terms":[{"t":"가치사슬","d":"기업의 사업모형과 관련된 상호작용, 자원, 관계의 전체 범위다.","en":"value chain"}]},{"no":"14(a)","label":"전략과 의사결정에서 어떻게 대응하나","pdfPage":9,"kssb":"14⑴","diff":"same","prose":["문단 14(a)는 기후 위험과 기회에 전략과 의사결정에서 어떻게 대응했고 대응할 계획인지, 스스로 세운 목표와 법규상 목표를 어떻게 달성할지를 묻는다. (i) 자원배분을 포함한 사업모형 변화, (ii) 공정·설비 변경이나 제품 사양 변경 같은 직접적인 완화·적응 노력, (iii) 고객·공급망과의 협력 같은 간접적인 노력, (v) 목표 달성 계획이 들어간다.","TPT 매핑은 문단 13과 14(a)(i)~(ii)에 TPT 권고 1.2, 2.1, 2.2, 2.3을, 14(a)(iii)의 간접적인 노력에 TPT 권고 3.1~3.3을 대응시킨다. IFRS S2는 무엇을 공시할지 정하고, TPT 권고는 그 내용을 어떤 항목으로 채우면 좋은지 더 자세히 안내하는 관계로 보면 된다. 두 자료를 함께 보면 빠진 항목을 찾기 쉽다."],"req":"전략·의사결정에서의 대응과 계획(사업모형 변화와 자원배분, 직접·간접 완화·적응 노력, 목표 달성 계획)을 공시한다.","quote":"current and anticipated indirect mitigation and adaptation efforts (for example, through working with customers and supply chains);"},{"no":"14(a)(iv)","label":"전환계획: 가진 계획을 공시한다","pdfPage":10,"kssb":"14⑴㈑","diff":"same","prose":["문단 14(a)(iv)는 기업이 가진 기후 관련 전환계획을, 계획을 세울 때 쓴 주요 가정과 계획이 의존하는 요소와 함께 공시하라고 한다. 부록 A는 전환계획을 저탄소 경제로 옮겨 가기 위한 목표, 조치, 자원을 담은 전략의 한 부분으로 정의한다. 문장은 '전환계획이 있다면'의 형태이며 KSSB 14⑴㈑와 같다. 계획이 없다면 이 항목에서 쓸 내용도 없다.","TPT 매핑의 머리말은 IFRS S2가 전환계획을 갖도록 요구하지는 않지만, 기업이 만든 전환계획은 공시하도록 요구한다고 정리한다. 매핑은 문단 9(c)와 14(a)(iv)~(v)에 TPT 권고 1.1.a, 1.1.b, 1.1.c.i, 1.3을 대응시킨다. 매핑은 TPT 프레임워크가 다루지 않는 IFRS S2 요구사항도 있어 그런 문단은 표에 넣지 않았다고 밝힌다.","'의존하는 요소(dependencies)'는 실무에서 자주 빠지는 칸이다. 재생에너지 공급 확대, 충전 인프라, 정부 보조금처럼 회사가 통제할 수 없는데 계획이 기대는 조건을 적는 곳이다. 이 조건이 바뀌면 계획이 흔들린다는 점을 이용자가 알 수 있게 하는 것이 목적이다. 검토할 때는 가정과 의존 요소가 구체적인 조건으로 적혀 있는지, 막연한 표현에 그치는지를 구분해서 본다."],"req":"기업이 가진 전환계획을 주요 가정과 의존 요소와 함께 공시한다(전환계획 보유 자체를 요구하지는 않는다).","quote":"any climate-related transition plan the entity has, including information about key assumptions used in developing its transition plan, and dependencies on which the entity’s transition plan relies; and","fig":{"cap":"IFRS S2와 TPT 권고 대응 (TPT 기술 매핑, 2023년 10월)","head":["IFRS S2 문단","TPT 권고","IFRS S2에서 묻는 내용"],"rows":[["13, 14(a)(i)~(ii)","1.2.a-b, 2.1.a-c, 2.2.a-c, 2.3.a-b","사업모형·가치사슬 영향, 사업모형 변화와 직접 노력"],["14(a)(iii)","3.1.a–d, 3.2.a–e, 3.3.a–c","고객·공급망과 함께하는 간접 노력"],["9(c), 14(a)(iv)~(v)","1.1.a, 1.1.b, 1.1.c.i, 1.3","전환계획(주요 가정·의존 요소)과 목표 달성 계획"],["14(b)","2.4.a","활동의 재원 조달"],["16(c)","2.4.b","예상 재무상태 변화(투자·처분 계획)"]]},"terms":[{"t":"전환계획","d":"저탄소 경제로 옮겨 가기 위한 목표, 조치, 자원을 담은 기업 전략의 한 부분이다.","en":"climate-related transition plan"}]},{"no":"14(c)","label":"재원과 지난 계획의 진척 (14(b)~(c))","pdfPage":10,"kssb":"14⑶","diff":"same","prose":["문단 14(b)는 14(a)의 활동에 필요한 자원을 어떻게 마련하고 있고 마련할 계획인지 묻고, 14(c)는 과거 보고기간에 공시한 계획이 얼마나 진척되었는지 양적·질적 정보를 요구한다. 계획을 한 번 쓰고 끝내지 말고 매년 약속 대비 실적을 보여 주라는 뜻이다. KSSB 14⑵·⑶과 같다. 계획과 실적을 이어 보게 하는 장치다.","TPT 매핑은 14(b)에 TPT 권고 2.4.a를 대응시킨다. 실무에서 14(c)는 작년 보고서의 문장과 올해 수치를 나란히 놓고 검토하면 확인하기 쉽다. 예를 들어 작년에 '재생에너지 전환율을 높이겠다'고 썼다면, 올해는 실제 전환율과 남은 과제를 적어야 14(c)의 진척 정보가 된다. 계획이 늦어졌다면 그 이유도 함께 적는 것이 이용자에게 도움이 된다."],"req":"전략 대응 활동의 재원 조달 현황·계획과, 과거에 공시한 계획의 진척을 양적·질적으로 공시한다."}],"write":{"q":"IFRS S2는 전환계획에 대해 무엇을 요구하고 무엇은 요구하지 않는가?","must":[["전환계획"],["가정","의존"],["요구하지","갖도록 요구하지","의무는 아니"]],"bonus":[["TPT"],["14(a)(iv)"]],"wrong":["모든 기업이 전환계획을 새로 만들어야 한다","전환계획은 공시하지 않아도 된다"],"model":"IFRS S2는 전환계획을 갖도록 요구하지는 않지만, 기업이 가진 전환계획은 주요 가정과 의존 요소와 함께 공시하게 한다.","src":"문단 14(a)(iv), TPT 기술 매핑"},"check":{"q":"문단 14(c)가 요구하는 정보는?","options":["다음 해 계획만","과거에 공시한 계획의 진척에 대한 양적·질적 정보","경쟁사 계획과의 비교"],"ans":1,"why":"14(c)는 과거 보고기간에 14(a)에 따라 공시한 계획의 진척에 대한 양적·질적 정보를 요구한다."},"summary":["문단 13은 사업모형·가치사슬에 미치는 영향과 위험·기회가 집중된 곳을 기술하게 한다.","문단 14는 전략 대응, 전환계획(주요 가정과 의존 요소), 재원, 과거 계획의 진척을 묻고 KSSB 14와 같다.","TPT 기술 매핑은 IFRS S2 문단마다 참고할 TPT 권고를 대응시킨 보조 자료이며 요구사항은 아니다."]},{"id":"s2-5","title":"전략 ③ 재무적 영향","range":"문단 15~21","pages":[10,12],"min":12,"intro":"기후 위험·기회가 재무상태, 재무성과, 현금흐름에 미친 영향과 미칠 영향을 읽는다. 양적 정보를 생략할 수 있는 조건(문단 19~21)까지 KSSB 제2호와 같은 구조다. KSSB에서는 k2-5에서 읽었다.","blocks":[{"no":"16","label":"현재 재무적 영향과 다음 해 조정 위험 (문단 15, 16(a)~(b))","pdfPage":10,"kssb":"16","diff":"same","prose":["문단 15는 재무적 영향을 둘로 나눈다. 보고기간에 이미 나타난 현재 재무적 영향과, 단기·중기·장기에 나타날 예상 재무적 영향이다. 문단 16(a)는 기후 위험과 기회가 이번 보고기간의 재무상태·재무성과·현금흐름에 어떻게 영향을 주었는지 양적·질적 정보로 공시하라고 한다. 이미 일어난 일을 숫자와 설명으로 보여 주라는 요구다.","문단 16(b)는 그 가운데 다음 연차 보고기간에 재무제표의 자산·부채 장부금액이 중요하게 조정될 유의적인 위험이 있는 것을 따로 밝히라고 한다. 예를 들어 탄소 규제로 내년에 설비 손상을 인식할 가능성이 크다면 여기에 해당한다. 재무제표 주석과 숫자가 이어지는지가 검토 포인트이며 KSSB 16⑴·⑵와 같다. 재무제표에서 손상 검토를 했다면 그 내용과 기후 공시가 같은 이야기를 하는지 확인한다."],"req":"보고기간의 재무적 영향과, 다음 연차 보고기간에 자산·부채 장부금액이 중요하게 조정될 유의적 위험이 있는 위험·기회를 공시한다.","quote":"the climate-related risks and opportunities identified in paragraph 16(a) for which there is a significant risk of a material adjustment within the next annual reporting period to the carrying amounts of assets and liabilities reported in the related financial statements;"},{"no":"16(c)","label":"예상 재무적 영향과 작성 방법 (16(c)~(d), 17~18)","pdfPage":11,"kssb":"16⑶","diff":"same","prose":["문단 16(c)는 기후 전략을 감안할 때 재무상태가 어떻게 바뀔 것으로 예상하는지 묻고, 투자·처분 계획(계약으로 약정하지 않은 계획 포함)과 자금조달 원천을 고려하라고 한다. 16(d)는 재무성과와 현금흐름의 예상 변화를 묻고, 저탄소 제품 매출 증가, 기후 사건으로 인한 자산 손상 비용, 완화·적응 비용을 예로 든다.","문단 17은 양적 정보를 단일 금액이나 범위로 줄 수 있게 하고, 문단 18은 예상 영향을 준비할 때 합리적이고 뒷받침될 수 있는 정보를 쓰고 기업의 기량·역량·자원에 걸맞은 방법을 쓰라고 한다. 작은 기업에 대형 금융회사 수준의 모델을 요구하지 않는다는 뜻이다. TPT 매핑은 16(c)를 TPT 권고 2.4.b에 대응시킨다."],"req":"전략을 감안한 재무상태·재무성과·현금흐름의 예상 변화를 공시하되, 단일 금액이나 범위를 쓸 수 있고 기업 역량에 걸맞은 방법을 쓴다.","quote":"In providing quantitative information, an entity may disclose a single amount or a range."},{"no":"19","label":"양적 정보를 생략할 수 있는 경우 (문단 19~20)","pdfPage":11,"kssb":"19","diff":"same","prose":["문단 19는 현재 또는 예상 재무적 영향에 대해 양적 정보를 주지 않아도 되는 두 경우를 든다. 영향을 따로 떼어 식별할 수 없는 경우와, 추정에 따르는 측정불확실성이 너무 커서 숫자가 쓸모없는 경우다. 문단 20은 예상 재무적 영향에 한해, 양적 정보를 만들 기량·역량·자원이 없는 경우도 더한다. 문단 19는 '기업이 판단한 경우'라고 쓰고 문단 21은 그렇게 판단한 기업에 설명을 요구하므로, 생략은 기업이 판단하고 설명할 책임을 진다.","주의할 점은 문단 20의 사유가 '예상' 영향에만 적용된다는 것이다. 이미 나타난 현재 영향은 역량이 없다는 이유로 숫자를 빼지 못한다. 이 구조는 KSSB 19·20과 같다. 검토할 때는 회사가 생략 사유를 19(a), 19(b), 20 중 무엇으로 들었는지와 그 사유가 현재 영향인지 예상 영향인지를 맞춰 본다. 사유가 맞지 않으면 생략 자체가 문제가 된다."],"req":"영향을 별도로 식별할 수 없거나 측정불확실성이 너무 크면 양적 정보를 생략할 수 있고, 예상 영향은 역량이 없을 때도 생략할 수 있다.","terms":[{"t":"측정불확실성","d":"숫자를 추정할 때 결과가 얼마나 넓게 달라질 수 있는지를 뜻한다.","en":"measurement uncertainty"}]},{"no":"21","label":"생략했다면 해야 할 세 가지","pdfPage":11,"kssb":"21","diff":"same","prose":["문단 21은 19~20에 따라 양적 정보를 주지 않기로 했다면 (a) 그 이유를 설명하고, (b) 영향을 받았거나 받을 가능성이 있는 재무제표 계정과목, 총계, 소계를 밝히는 질적 정보를 주고, (c) 다른 기후 위험·기회와 기타 요인을 합친 결합 영향의 양적 정보를 주라고 한다. 결합 정보가 쓸모없다고 판단하면 (c)는 빼도 된다.","KSSB 21도 같은 구조다. KSSB 21⑶의 한국어 문장은 '지속가능성 관련 위험'이라고 적었는데, 영문 21(c)는 'climate-related risks or opportunities'로 기후에 한정해 쓴다. 기후 기준서 안의 문장이므로 같은 요구로 읽으면 된다. 생략이 곧 침묵은 아니라는 것이 이 문단의 핵심이다."],"req":"양적 정보를 생략하면 이유를 설명하고, 영향받는 재무제표 항목을 밝히는 질적 정보와, 쓸모없지 않다면 결합 영향의 양적 정보를 준다."}],"write":{"q":"IFRS S2에서 예상 재무적 영향의 양적 정보를 생략할 수 있는 사유 세 가지는?","must":[["식별할 수 없","별도로 식별"],["불확실성"],["역량","기량","자원"]],"bonus":[["21"],["질적"]],"wrong":["현재 영향도 역량이 없으면 생략할 수 있다","생략하면 아무것도 쓰지 않아도 된다"],"model":"영향을 별도로 식별할 수 없는 경우, 측정불확실성이 너무 커서 숫자가 유용하지 않은 경우, 그리고 양적 정보를 만들 기량·역량·자원이 없는 경우다.","src":"문단 19~20"},"check":{"q":"문단 20의 '기량·역량·자원이 없음' 사유를 쓸 수 있는 정보는?","options":["현재 재무적 영향","예상 재무적 영향","현재와 예상 모두"],"ans":1,"why":"문단 20은 예상 재무적 영향에 대해서만 이 사유를 허용한다. 현재 영향은 문단 19의 두 사유만 쓸 수 있다."},"summary":["재무적 영향은 보고기간의 현재 영향과 단기·중기·장기 예상 영향으로 나눠 양적·질적 정보로 공시한다.","양적 정보는 식별 불가, 과도한 측정불확실성, (예상 영향에 한해) 역량 부족일 때 생략할 수 있다.","생략하면 이유, 영향받는 재무제표 항목, 결합 영향을 공시하며, 이 구조는 KSSB 제2호와 같다."]},{"id":"s2-6","title":"전략 ④ 기후 회복력","range":"문단 22~23 (+B1~B18)","pages":[12,29],"min":14,"intro":"기후 관련 시나리오 분석으로 전략과 사업모형의 회복력을 평가하는 문단과 적용지침 B1~B18을 읽는다. 회복력 요구는 KSSB와 같고, 문단 23의 산업기반 지표 문장만 다르다. KSSB에서는 k2-6에서 읽었다.","blocks":[{"no":"22(a)","label":"보고일 현재의 회복력 평가","pdfPage":12,"kssb":"22⑴","diff":"same","prose":["문단 22는 기후 관련 시나리오 분석으로 회복력을 평가하되, 기업 상황에 걸맞은 방법을 쓰라고 한다. 22(a)는 보고일 현재의 평가 결과를 묻는다. (i) 평가가 전략과 사업모형에 주는 시사점과 대응 방법, (ii) 평가에서 고려한 유의적인 불확실성 영역, (iii) 단기·중기·장기에 전략과 사업모형을 조정하거나 적응시킬 수 있는 능력이다.","(iii)은 다시 세 가지로 나뉜다. 기존 재무자원이 얼마나 있고 얼마나 유연한지, 기존 자산을 재배치·용도 변경·개선·해체할 수 있는지, 완화·적응·기회를 위한 현재와 계획된 투자의 효과다. 부록 A는 기후 회복력을 기후 관련 변화와 불확실성에 적응하는 능력으로 정의하고, 전략적 회복력과 운영상 회복력을 함께 포함한다고 적는다. KSSB 22⑴과 같다."],"req":"보고일 현재의 기후 회복력 평가(전략 시사점, 유의적 불확실성, 재무자원·자산·투자를 통한 조정 능력)를 공시한다.","terms":[{"t":"기후 회복력","d":"기후 관련 변화, 전개 상황, 불확실성에 맞춰 조정하는 기업의 능력이다.","en":"climate resilience"}]},{"no":"22(b)","label":"시나리오 분석을 어떻게, 언제 했나","pdfPage":12,"kssb":"22⑵","diff":"same","prose":["문단 22(b)는 분석 방법과 시점을 묻는다. (i) 투입변수에는 사용한 시나리오와 출처, 다양한 시나리오를 포함했는지, 전환 위험과 물리적 위험 중 어디와 연관되는지, 기후변화에 관한 최신 국제 협약에 부합하는 시나리오를 썼는지, 선택 이유, 분석 기간, 분석한 사업 범위가 들어간다. 이 정보가 있어야 이용자가 결과를 얼마나 믿을지 판단할 수 있다.","(ii) 주요 가정에는 관할권의 기후 정책, 거시경제 동향, 국가·지역 수준 변수(날씨 패턴, 인구, 토지 이용, 기반시설, 천연자원), 에너지 사용과 믹스, 기술 발전이 들어간다. (iii)은 분석을 수행한 보고기간이다. 목록이 길지만 KSSB 22⑵㈎~㈐와 항목 순서까지 같아서, KSSB 교재에서 만든 점검표를 그대로 쓸 수 있다."],"req":"시나리오 분석의 투입변수(시나리오, 출처, 다양성, 최신 국제 협약 부합 여부, 기간, 범위), 주요 가정, 수행한 보고기간을 공시한다.","quote":"whether the entity used, among its scenarios, a climate-related scenario aligned with the latest international agreement on climate change;"},{"no":"B4","label":"상황에 걸맞은 방법: 노출 정도와 역량 (B1~B17)","pdfPage":26,"kssb":"B4","diff":"same","prose":["B2는 기업이 상황에 걸맞은 방법을 고를 때 두 가지를 보라고 한다. 기후 위험과 기회에 얼마나 노출되었는지(B4~B5), 그리고 쓸 수 있는 기량·역량·자원(B6~B7)이다. B4는 다른 조건이 같다면 노출이 클수록 더 정량적이고 정교한 분석이 필요하다고 판단할 가능성이 크다고 설명한다. 노출이 적으면 정교한 분석의 이득도 적다.","B6은 이제 막 시나리오 분석을 시작한 기업은 과도한 원가 없이 정량 분석을 하기 어려울 수 있다고 인정하고, B7은 반복하면서 역량이 쌓인다고 본다. B17은 정성적 시나리오 서술 같은 단순한 방법도 상황에 맞으면 쓸 수 있지만, 노출이 크고 필요한 역량에 접근할 수 있는 기업은 더 발전된 정량 방법을 적용해야 한다고 못 박는다. KSSB B1~B17과 같다."],"req":"시나리오 분석 방법은 기후 위험·기회 노출 정도와 이용 가능한 기량·역량·자원을 고려해 정하고, 노출이 크고 역량이 있으면 정량적 방법을 쓴다.","quote":"An entity with a high degree of exposure to climate-related risks and opportunities, and with access to the necessary skills, capabilities or resources, is required to apply a more advanced quantitative approach to climate-related scenario analysis.","qno":"B17"},{"no":"B18","label":"분석은 계획 주기마다, 평가는 매년","pdfPage":29,"kssb":"B18","diff":"same","prose":["B18은 시나리오 분석을 매년 새로 할 필요는 없다고 한다. 3~5년 같은 전략 계획 주기에 맞춰 할 수 있고, 그 사이 보고기간에는 22(b)의 분석 방법 공시가 전년과 같을 수 있다. 다만 최소한 전략 계획 주기에 맞춰 분석을 새로 해야 한다. 예를 들어 3년마다 전략을 새로 짜는 회사는 3년마다 시나리오 분석을 새로 하고, 그 사이 해에는 이전 분석을 바탕으로 쓸 수 있다.","반면 회복력 평가 자체는 매년 해야 하고, 22(a)의 평가 결과는 보고기간마다 갱신해야 한다. 분석 도구는 몇 년에 한 번 돌려도 되지만, 그 결과가 올해 사업에 어떤 의미인지는 매년 다시 판단하라는 뜻이다. 검토할 때는 22(b)가 작년과 같더라도 22(a)가 올해 기준으로 다시 쓰였는지를 확인한다. KSSB B18과 같다."],"req":"시나리오 분석은 전략 계획 주기에 맞춰 할 수 있으나, 회복력 평가 결과(22(a))는 매 보고기간 갱신한다.","quote":"As such, an entity’s disclosure in accordance with paragraph 22(a)—that is, the results of the entity’s resilience assessment—shall be updated at each reporting period."},{"no":"23","label":"전략 공시에서도 지표를 '고려해야 한다'","pdfPage":13,"kssb":"23","diff":"differs","prose":["문단 23은 문단 13~22의 전략 공시를 준비할 때 문단 29의 산업전반 지표 범주와, 산업기반 지침의 공시 주제에 연관된 산업기반 지표(문단 32)를 모두 참조하고 적용가능성을 고려하라고 한다. 전략에서 쓴 이야기와 지표 숫자가 서로 맞아야 한다는 요구다. 예를 들어 전략에서 전환 위험이 크다고 썼다면, 전환 위험에 취약한 자산 지표도 그 설명과 맞는 규모로 나와야 한다.","KSSB 문단 23은 산업전반 지표는 똑같이 '참조하고 적용가능성을 고려한다'고 하지만, 산업기반 지표는 '참고할 수 있다'로 바꿨다. 문단 12에서 본 차이가 전략 공시 전체로 이어지는 것이다. IFRS S2 기준 보고서를 검토할 때는 전략 설명에 산업기반 지표가 연결되어 있는지도 확인 대상이 된다. KSSB 기준 보고서에서는 같은 연결이 없어도 기준 위반은 아니다."],"req":"전략 공시(13~22)를 준비할 때 산업전반 지표 범주와 산업기반 지표의 적용가능성을 모두 참조·고려한다(KSSB는 산업기반 지표를 참고할 수 있다).","quote":"In preparing disclosures to meet the requirements in paragraphs 13–22, an entity shall refer to and consider the applicability of cross-industry metric categories, as described in paragraph 29, and industry-based metrics associated with disclosure topics defined in the Industry-based Guidance on Implementing IFRS S2 as described in paragraph 32."}],"write":{"q":"B18에 따르면 시나리오 분석과 회복력 평가는 각각 얼마나 자주 해야 하나?","must":[["계획 주기","전략 계획"],["매년","보고
