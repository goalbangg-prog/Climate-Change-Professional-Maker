   ${it.map(n=>`<div class="nitem"><span class="num">${sn(sessOf(n.sid))}회차 · ${esc(n.num)}<br><span class="kind">${n.kind==="ul"?"밑줄":"형광펜"}</span></span><div><p class="q">${n.kind==="ul"?`<mark class="ul">${esc(n.text)}</mark>`:`<mark class="hl ${n.color}">${esc(n.text)}</mark>`}</p>${n.memo?`<p class="memo">✎ ${esc(n.memo)}</p>`:""}</div><button class="del" type="button" data-n="${n.id}" aria-label="지우기">✕</button></div>`).join("")}
   ${w.map(x=>`<div class="nitem w"><span class="num">${sn(sessOf(x.sid))}회차<br><span class="kind">한 줄 쓰기</span></span><div><p class="memo" style="margin:0 0 4px">${esc(x.q)}</p><p class="q">${esc(x.a)}</p><span class="tag">${x.ok?"통과":"재도전"} · 핵심 ${x.pct}%</span></div><span></span></div>`).join("")}</div>`};
  const body=Object.keys(DATA).map(bk).join("");
  $("#app").innerHTML=`<section class="view wrap narrow"><div class="nhead"><span class="eyebrow">내 노트</span><h1>읽으며 남긴 것</h1><p>탭해서 표시한 문장, 메모, 직접 쓴 한 줄이 책별로 모인다. 한 권을 다 읽으면 이 노트가 그 기준서의 요약 노트가 되고, 포트폴리오 첫 장이 된다.</p></div>
   <div class="ntabs" role="group">${[["all","전체"],["hl","형광펜"],["ul","밑줄"],["memo","메모 있는 것"],["w","쓴 한 줄"]].map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${nf===k}">${l}</button>`).join("")}</div>
   ${body||`<div class="empty">아직 남긴 것이 없다. <a href="#shelf">서재</a>에서 책을 골라 읽으며 문장을 탭해 보자.</div>`}</section>`;
  document.querySelectorAll(".ntabs button").forEach(b=>b.onclick=()=>{nf=b.dataset.f;notes()});
  document.querySelectorAll(".nitem .del").forEach(b=>b.onclick=()=>{const n=NOTES.find(x=>x.id===b.dataset.n);NOTES=NOTES.filter(x=>x!==n);persist();notes();toast("지웠다",()=>{NOTES.push(n);persist();notes()})});
}
let dq=0,dans=[];
function diag(){
  if(dq>=DIAG.length){const score=dans.filter((a,i)=>a===DIAG[i].ans).length;DIAGR={score,n:DIAG.length,t:Date.now()};persist();
    $("#app").innerHTML=`<section class="view wrap narrow"><span class="eyebrow">진단 결과</span><h1 class="ph">${score}/${DIAG.length}점</h1>
    <p class="lede">${score>=8?"기초는 충분하다. 바로 KSSB 제1·2호부터 읽자.":(DATA.b1?"Scope, 기준연도 같은 기초가 아직 흔들린다. 공통 기초 「온실가스와 Scope」부터 읽고 KSSB로 가자.":"Scope, 기준연도 같은 기초가 아직 흔들린다. 공통 기초 책이 준비되기 전까지는, KSSB를 읽으면서 밑줄 친 용어를 눌러 뜻을 확인하며 천천히 가자.")}</p>
    <div class="dlist">${DIAG.map((x,i)=>`<div class="ditem"><p class="dq"><span class="dn">${dans[i]===x.ans?"✓":"✕"}</span>${esc(x.q)}</p><p class="why"><b>${esc(x.options[x.ans])}</b> — ${esc(x.why)}</p></div>`).join("")}</div>
    <div class="navrow"><button class="btn line sm" type="button" id="dAgain">다시 풀기</button>${score<8&&DATA.b1?`<a class="btn sm" href="#read/${curS(DATA.b1).id}">기초부터 읽기 →</a>`:`<a class="btn sm" href="#read/${curS(DATA.kssb).id}">KSSB 읽기 →</a>`}</div></section>`;
    $("#dAgain").onclick=()=>{dq=0;dans=[];diag()};dq=0;dans=[];return}
  const x=DIAG[dq];
  $("#app").innerHTML=`<section class="view wrap narrow"><span class="eyebrow">진단 ${dq+1}/${DIAG.length}${x.area?" · "+esc(x.area):""}</span><div class="dbar"><i style="width:${dq/DIAG.length*100}%"></i></div>
   <h2 class="dqh">${esc(x.q)}</h2><div class="check"><div class="opts">${x.options.map((o,i)=>`<button type="button" data-i="${i}">${esc(o)}</button>`).join("")}<button type="button" data-i="-1" class="skip">모르겠다</button></div></div>
   <div class="navrow"><a class="btn line sm" href="#shelf">그만두기</a><span></span></div></section>`;
  document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{dans[dq]=+b.dataset.i;dq++;diag()});
}
let rq="",rt="terms";
function ref(){
  const terms=Object.entries(TERMS).map(([t,v])=>({t,d:v.d,en:v.en}));
  const q=rq.trim().toLowerCase();
  const AL={"스코프":"scope","scope":"스코프","온실가스":"ghg","ghg":"온실가스"};const qs=[q,...Object.keys(AL).filter(k=>q.includes(k)).map(k=>q.replace(k,AL[k]))];
  const scored=q?terms.map(x=>{const t=x.t.toLowerCase(),en=(x.en||"").toLowerCase();const sc=Math.max(...qs.map(q=>t===q?100:t.startsWith(q)?80:t.includes(q)?60:en.includes(q)?40:x.d.toLowerCase().includes(q)?10:0));return {x,sc}}).filter(o=>o.sc).sort((a,b)=>b.sc-a.sc||a.x.t.localeCompare(b.x.t,"ko")).map(o=>o.x):terms.sort((a,b)=>a.t.localeCompare(b.t,"ko"));
  const map=DATA.s2.flatMap(s=>s.blocks.filter(b=>b.kssb).map(b=>({s,b})));
  $("#app").innerHTML=`<section class="view wrap narrow"><span class="eyebrow">참고</span><h1 class="ph">참고</h1>
   <div class="ntabs" role="group">${[["terms","용어집"],["map","KSSB ↔ IFRS S2"],["about","만든 방법"]].map(([k,l])=>`<button type="button" data-t="${k}" aria-pressed="${rt===k}">${l}</button>`).join("")}</div>
   ${rt==="terms"?`<input class="search" id="rq" type="search" placeholder="용어 검색 (예: 스코프 3, 중요성)" value="${esc(rq)}"><p class="rcount">${scored.length}개 · 제목이 맞는 항목이 먼저 나온다</p><dl class="glos">${scored.map(x=>`<div><dt>${esc(x.t)}${x.en?`<small>${esc(x.en)}</small>`:""}</dt><dd>${esc(x.d)}</dd></div>`).join("")}</dl>`:""}
   ${rt==="map"?`<p class="rcount">IFRS S2 교재의 블록마다 대응하는 KSSB 문단. 색이 있는 줄이 두 기준이 다른 곳이다.</p><div class="tw"><table class="mapt"><thead><tr><th>IFRS S2</th><th>KSSB</th><th>관계</th><th>내용</th></tr></thead><tbody>${map.map(({s,b})=>`<tr class="${b.diff}"><td><a href="#read/${s.id}">${esc(b.no)}</a></td><td>${esc(b.kssb)}</td><td>${esc(DIFF[b.diff]||"")}</td><td>${esc(b.label)}</td></tr>`).join("")}</tbody></table></div>`:""}
   ${rt==="about"?`<div class="about"><p>본문은 각 기준서 원문(KSSB 2025 공표본, IFRS S2 2023년 6월판과 2025년 12월 개정 문서)을 문단 순서대로 읽고 쉬운 말로 풀어 썼다. 원문 인용은 블록마다 두 문장 이하로 줄였다.</p><p>예시는 기아·현대자동차 보고서에 실제로 있는 문장과 숫자만 썼고, 쪽수를 달았다.</p><p>검토 단계: 원문 대조까지 마쳤다. 전문가 검토는 아직이다. 틀린 곳을 찾으면 알려 달라.</p><p>예전 문제 풀이 버전(v4.5)은 <a href="legacy.html">여기</a>에 남겨 두었다.</p><p class="srcl">빌드 2026-10-24</p></div>`:""}</section>`;
  document.querySelectorAll(".ntabs button").forEach(b=>b.onclick=()=>{rt=b.dataset.t;ref()});
  const inp=$("#rq");if(inp){inp.oninput=()=>{rq=inp.value;const p=inp.selectionStart;ref();const n=$("#rq");n.focus();n.setSelectionRange(p,p)}}
}

let view="shelf";
function route(){const [h,arg]=(location.hash||"#shelf").slice(1).split("/");view=["shelf","book","read","notes","ref","diag"].includes(h)?h:"shelf";hideSel();closeSheet();$("#progress").hidden=view!=="read";$("#progressBar").style.width="0";
  document.querySelectorAll(".bar nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===view||(a.dataset.v==="shelf"&&["book","read"].includes(view))?"page":"false"));
  if(h==="soon"){toast("이 책은 아직 준비 중이다");history.replaceState(null,"","#shelf");view="shelf"}
  if(view==="read"){CUR=null;read(arg)}else if(view==="book")book(arg||BID);else if(view==="diag"){dq=0;dans=[];diag()}else ({shelf,notes,ref})[view]();window.scrollTo(0,0)}
addEventListener("hashchange",route);
function themeLabel(){const r=document.documentElement.getAttribute("data-theme");const dark=r?r==="dark":matchMedia("(prefers-color-scheme: dark)").matches;$("#themeL").textContent=dark?"밤":"종이"}
$("#theme").onclick=()=>{const r=document.documentElement,cur=r.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.setAttribute("data-theme",dark?"light":"dark");try{localStorage.setItem("proto-theme",dark?"light":"dark")}catch(e){}themeLabel()};
try{const t=localStorage.getItem("proto-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
initData();Object.keys(DATA).forEach(k=>kb(k));themeLabel();route();
</script>
