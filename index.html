<title>기후공시 리딩 클래스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 좁은 읽기 칼럼(종이) + 서재(영역별 선반에 꽂힌 책등). 장식 없이, 책과 문단 번호가 구조를 만든다. */
:root{
  --paper:#f6f1e6; --paper2:#efe8d9; --sheet:#fbf8f1; --ink:#22201b; --ink2:#4b463d; --muted:#857d6f; --rule:#e2d9c6; --rule2:#cfc3aa;
  --accent:#1f4e5a; --accent-ink:#ffffff;
  --a-dis:#2b5c8a; --a-ghg:#b2552c; --a-lca:#3d7a52; --a-law:#6b4f8c; --a-base:#8a7a52; --a-cut:#8a6d1f;
  --hl-y:#f4dd7a; --hl-g:#bfe0b0; --hl-b:#bcd6ef; --ul:#b2552c;
  --good:#2f7a3d; --bad:#b23b2c;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16171a; --paper2:#1d1f23; --sheet:#1b1d21; --ink:#ece6da; --ink2:#c9c2b4; --muted:#938b7d; --rule:#2c2f35; --rule2:#3c4048;
  --accent:#7fb3c0; --accent-ink:#0f1416;
  --a-dis:#6e9cc9; --a-ghg:#d98a62; --a-lca:#7fb48d; --a-law:#a78bc8; --a-base:#bba878; --a-cut:#d4b45c;
  --hl-y:#6b5a18; --hl-g:#2f5230; --hl-b:#24425f; --ul:#e0905f; --good:#7cc489; --bad:#e2806f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16171a; --paper2:#1d1f23; --sheet:#1b1d21; --ink:#ece6da; --ink2:#c9c2b4; --muted:#938b7d; --rule:#2c2f35; --rule2:#3c4048;
  --accent:#7fb3c0; --accent-ink:#0f1416;
  --a-dis:#6e9cc9; --a-ghg:#d98a62; --a-lca:#7fb48d; --a-law:#a78bc8; --a-base:#bba878; --a-cut:#d4b45c;
  --hl-y:#6b5a18; --hl-g:#2f5230; --hl-b:#24425f; --ul:#e0905f; --good:#7cc489; --bad:#e2806f; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:16px}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:720px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:56px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo i{display:flex;gap:2px;height:20px;align-items:flex-end}.logo i b{width:4px;border-radius:1px}
.bar nav{display:flex;gap:2px;margin-left:auto}
.bar nav a{white-space:nowrap;text-decoration:none;padding:7px 12px;border-radius:6px;font-size:14px;color:var(--ink2)}
.bar nav a[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--paper2)}
.theme{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--rule2);border-radius:999px;background:transparent;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2);white-space:nowrap}
.proto{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
/* views */
.view{padding-block:28px 80px;animation:vin .35s ease both}
@keyframes vin{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--rule2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:default}
/* ===== SHELF ===== */
.cont{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px 24px;border-radius:14px;background:var(--sheet);border:1px solid var(--rule);margin:14px 0 34px}
.cover{width:74px;height:100px;border-radius:3px 6px 6px 3px;background:var(--c);color:#fff;position:relative;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 6px 14px -8px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-family:var(--serif);font-weight:700;font-size:13px;line-height:1.25}
.cont .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.cont .meta b{font-family:var(--serif);font-size:21px;line-height:1.35}
.cont .meta span{color:var(--ink2);font-size:14px}
.cont .pb{height:5px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:6px;max-width:320px}.cont .pb i{display:block;height:100%;background:var(--c)}
.side-stats{display:flex;gap:18px;margin:0 0 6px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.side-stats b{font-family:var(--mono);color:var(--ink)}
.shelves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 40px}
.shelf{min-width:0}
.shelf.wide{grid-column:1/-1}
.shelf h3{flex-wrap:wrap}
@media (max-width:900px){.shelves{grid-template-columns:1fr}}
.shelf h3{font-size:14px;font-weight:700;display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.shelf h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.rack{display:flex;align-items:flex-end;gap:6px;padding:0 10px;min-height:236px;border-bottom:7px solid var(--rule2);position:relative;overflow-x:auto;scrollbar-width:thin}
.rack::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:4px;background:var(--rule)}
.spine{flex:none;width:var(--w,46px);height:var(--h,190px);border:0;border-radius:3px 3px 1px 1px;cursor:pointer;position:relative;background:color-mix(in srgb,var(--c) 22%,var(--sheet));color:var(--ink);box-shadow:inset -3px 0 0 rgba(0,0,0,.08),inset 3px 0 0 rgba(255,255,255,.18);transition:transform .25s cubic-bezier(.2,.7,.2,1);overflow:hidden;text-align:left;padding:0}
.spine:hover,.spine:focus-visible{transform:translateY(-10px)}
.spine .fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*100%);background:var(--c);transition:height 1s cubic-bezier(.2,.7,.2,1)}
.spine .t{position:absolute;inset:12px 0 40px;writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:13px;line-height:1.15;overflow:hidden;letter-spacing:.02em;display:flex;align-items:center;justify-content:flex-start;padding:0 0 0 0;color:var(--ink);mix-blend-mode:normal}
.spine.done .t{color:#fff}
.spine.on .t{color:var(--ink)}
.spine .band{position:absolute;left:6px;right:6px;bottom:12px;height:2px;background:currentColor;opacity:.35}
.spine .st{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.spine.on .st,.spine.done .st{color:#fff}
.spine.done .t{inset:12px 0 52px}
.spine .stamp{position:absolute;bottom:30px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:9px;font-weight:800;border:1.5px solid #fff;color:#fff;padding:1px 3px;border-radius:3px;letter-spacing:.04em}
.spine.rec{outline:2px dashed color-mix(in srgb,var(--c) 70%,transparent);outline-offset:3px}
.tip{font-size:12.5px;color:var(--muted);margin-top:14px}
/* ===== CARD GRID ===== */
.hero{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:0;margin:12px 0 18px;border-radius:16px;overflow:hidden;text-decoration:none;background:var(--sheet);border:1px solid var(--rule);transition:transform .25s,box-shadow .25s}
.hero:hover{transform:translateY(-2px);box-shadow:0 18px 40px -26px color-mix(in srgb,var(--c) 80%,transparent)}
.hface{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:22px;min-height:170px;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 92%,#000) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 70%,#fff) 140%)}
.hface::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.07) 23px 24px);pointer-events:none}
.hface .ar{font-family:var(--mono);font-size:11px;letter-spacing:.08em;opacity:.8}
.hface b{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1.2}
.hp{height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.hp i{display:block;height:100%;width:calc(var(--p)*100%);background:#fff;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
.hmeta{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:22px 26px;min-width:0}
.hmeta .k{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.hmeta b{font-family:var(--serif);font-size:24px;line-height:1.35}
.hmeta span{color:var(--ink2);font-size:14px}
.hmeta .go{align-self:flex-start;margin-top:8px;background:var(--c);color:#fff;font-weight:700;padding:9px 16px;border-radius:8px;font-size:14px}
@keyframes grow{from{width:0}}
.row{margin-top:30px}
.rowh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rowh h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}.rowh h3 i{width:4px;height:16px;border-radius:2px}
.rowh span{font-size:12.5px;color:var(--muted)}.rowh small{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:14px}
.bcard{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;text-decoration:none;background:var(--sheet);border:1px solid var(--rule);transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,border-color .22s;animation:vin .45s ease both}
.bcard:hover,.bcard:focus-visible{transform:translateY(-4px);box-shadow:0 16px 30px -22px color-mix(in srgb,var(--c) 90%,transparent);border-color:color-mix(in srgb,var(--c) 45%,var(--rule))}
.face{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;aspect-ratio:16/8;padding:14px 16px;background:color-mix(in srgb,var(--c) 14%,var(--sheet));border-bottom:1px solid var(--rule);overflow:hidden}
.face::after{content:"";position:absolute;right:-20px;top:-30px;width:110px;height:110px;border-radius:50%;border:14px solid color-mix(in srgb,var(--c) 18%,transparent)}
.face .ar{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.face b{font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.25;color:var(--ink);position:relative;z-index:1;text-wrap:balance}
.bcard.on .face,.bcard.done .face{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 88%,#000),var(--c));}
.bcard.on .face b,.bcard.done .face b,.bcard.on .face .ar,.bcard.done .face .ar{color:#fff}
.bcard.on .face::after,.bcard.done .face::after{border-color:rgba(255,255,255,.14)}
.badge{position:absolute;top:10px;left:12px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--c);color:#fff;z-index:1}
.badge.ok{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.6)}
.bcard.rec{border-color:color-mix(in srgb,var(--c) 60%,var(--rule));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
.info{display:flex;flex-direction:column;gap:6px;padding:12px 16px 14px}
.info .sub{font-size:13px;color:var(--ink2);line-height:1.45;min-height:2.9em}
.pr{height:4px;border-radius:2px;background:var(--rule);overflow:hidden}.pr i{display:block;height:100%;width:calc(var(--p)*100%);background:var(--c);animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
.info .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@media (max-width:640px){
  .hero{grid-template-columns:1fr}.hface{min-height:120px}
  .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 0;padding-right:16px;scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .bcard{flex:0 0 72%;scroll-snap-align:start}
}
/* v0.3 shelf */
.ico{width:20px;height:20px;flex:none}
.hface .ico.big{position:absolute;right:18px;top:18px;width:56px;height:56px;opacity:.35}
.hface em{font-style:normal;font-size:13.5px;opacity:.85}
.row{margin-top:34px}
.rowh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:var(--c)}
.rowh h3{color:var(--ink)}
.rbody{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start}
.rbody.nof{grid-template-columns:1fr}
.feat{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;text-decoration:none;border:1px solid color-mix(in srgb,var(--c) 40%,var(--rule));background:var(--sheet);transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s}
.feat:hover{transform:translateY(-3px);box-shadow:0 16px 30px -22px var(--c)}
.fface{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;min-height:150px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 90%,#000),var(--c));color:#fff;overflow:hidden}
.fface .ico{position:absolute;right:14px;top:14px;width:44px;height:44px;opacity:.4}
.fface .lab{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45)}
.fface b{font-family:var(--serif);font-weight:900;font-size:22px;line-height:1.25;margin-top:auto}
.fface em{font-style:normal;font-size:13.5px;opacity:.9}
.finfo{display:flex;flex-direction:column;gap:6px;padding:12px 18px 14px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}.dots i.on{background:var(--c)}
.lines{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.line{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--rule);text-decoration:none;transition:background .15s,padding-left .2s}
.line:hover{background:var(--paper2);padding-left:12px}
.line .lt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;flex:1}
.line b{font-weight:700;font-size:15px}.line em{font-style:normal;font-size:13px;color:var(--muted)}
.line .lr{font-family:var(--mono);font-size:12px;color:var(--muted)}
.line .ok{color:var(--c);font-family:var(--sans);font-weight:700;font-size:12.5px}
.line.done b{color:var(--ink2)}
.line::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rule2);flex:none}
.line.done::before,.line.on::before{background:var(--c)}
.req{border-left:3px solid var(--c);border-radius:0 8px 8px 0}
@media (max-width:640px){.rbody{grid-template-columns:1fr}.fface{min-height:130px}}
/* sentence tap */
.prose .s{cursor:pointer;border-radius:3px;transition:background .15s;-webkit-tap-highlight-color:transparent}
.prose .s:hover{background:color-mix(in srgb,var(--c) 7%,transparent)}
.prose .s.pick{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 14%,transparent)}
.prose .s.hl.y{background:var(--hl-y)}.prose .s.hl.g{background:var(--hl-g)}.prose .s.hl.b{background:var(--hl-b)}
.prose .s.ul{text-decoration:underline;text-decoration-color:var(--ul);text-decoration-thickness:2px;text-underline-offset:5px}
.prose .s.memo::after{content:"✎";font-size:11px;color:var(--c);margin-left:2px;vertical-align:super}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--paper);box-shadow:0 -12px 30px -16px rgba(0,0,0,.5);animation:up .22s cubic-bezier(.2,.7,.2,1) both}
.sbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sbar .lab{font-family:var(--mono);font-size:11.5px;opacity:.7}
.sbar .tools{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.sbar button{border:0;background:transparent;color:inherit;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;min-height:40px}
.sbar button:hover,.sbar button[aria-pressed="true"]{background:rgba(255,255,255,.14)}
.sbar .sw{width:18px;height:18px;border-radius:4px;display:inline-block}
/* ===== BOOK ===== */
.bookhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;margin:10px 0 26px}
.bookhead .cover{width:118px;height:160px;font-size:16px;padding:12px}
.bookhead h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,36px);line-height:1.25}
.bookhead p{color:var(--ink2);margin-top:8px;max-width:58ch}
.bookhead .facts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}.bookhead .facts b{font-family:var(--mono);color:var(--ink)}
.bookhead .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.toc{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.toc .part{font-family:var(--serif);font-weight:700;font-size:15px;padding:18px 0 6px;color:var(--ink2)}
.toc a{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule);text-decoration:none}
.toc a:hover{background:var(--paper2)}
.toc .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.toc .tt{font-size:15px}.toc .tt small{display:block;color:var(--muted);font-size:12.5px}
.toc .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule2)}
.toc a.done .dot{background:var(--c);border-color:var(--c)}
.toc a.cur{background:color-mix(in srgb,var(--c) 8%,transparent)}.toc a.cur .dot{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
/* ===== READ ===== */
.rhead{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.rhead h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,3.6vw,32px);line-height:1.3}
.progress{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;height:3px;background:var(--rule)}
.progress i{display:block;height:100%;background:var(--c);width:0;transition:width .2s linear}
.draft{font-size:12.5px;color:var(--muted);border:1px dashed var(--rule2);border-radius:8px;padding:8px 12px;margin:14px 0 6px}
.para{display:grid;grid-template-columns:72px minmax(0,1fr);gap:18px;padding:22px 0;border-bottom:1px solid var(--rule);animation:vin .45s ease both}
.para .num{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:4px;line-height:1.4}
.para .num b{display:block;font-size:15px;color:var(--c);font-weight:500}

const DATA={"kssb":[{"id":"k0","title":"들어가며: KSSB와 의무공시 일정","range":"기준서 밖 (금융위원회 2026-07-08 최종안) + 문단 E1","pages":[59,62],"min":14,"intro":"이 책은 한국 지속가능성 공시기준(KSSB 기준) 제1호를 문단 순서대로 함께 읽는다. 본문에 들어가기 전에, 이 기준이 언제 누구에게 의무가 되는지 금융위원회가 2026년 7월 8일 발표한 최종안으로 정리한다.","blocks":[{"no":"KSSB","label":"KSSB는 누가 만들었나","pdfPage":85,"prose":["KSSB는 지속가능성기준위원회(Korea Sustainability Standards Board)의 줄임말이다. 결론도출근거 BC1에 따르면 금융위원회는 2022년 11월 회계기준원 안에 KSSB를 세웠다. 회계기준을 만드는 곳에 지속가능성 기준을 맡긴 것인데, 이는 이 기준이 환경 홍보물이 아니라 재무보고의 한 부분이라는 뜻을 담고 있다. KSSB는 2024년 4월 공개초안을 내고 의견을 받은 뒤 기준을 확정했다.","결론도출근거 BC3에 따르면 KSSB는 국제지속가능성기준위원회(ISSB)가 만든 IFRS S1·S2를 출발점으로 삼았다. 해외 규제로 이미 공시를 요구받는 국내 기업이 두 번 보고하는 부담을 줄이고, 국제적으로 비교할 수 있게 하려는 것이다. 동시에 BC4가 밝히듯 국내 산업의 특성과 기업의 준비 상황을 고려해 일부 요구를 고쳤다. 그래서 이 책은 IFRS와 같은 부분보다 다른 부분을 더 꼼꼼히 짚는다.","제1호 ‘지속가능성 관련 재무정보 공시를 위한 일반 요구사항’의 제정은 2026년 2월 26일 위원 9명의 찬성으로 의결되었다. 제1호는 모든 공시에 공통으로 쓰는 규칙이고, 제2호는 기후라는 주제에 대한 구체적 요구사항이다. BC16은 제2호를 적용하는 기업이 제1호도 함께 적용해야 한다고 정리한다. 이 책이 제1호부터 읽는 이유가 여기에 있다."],"req":"KSSB 기준이 어디서 왔고 제1호와 제2호가 어떤 관계인지 안다.","terms":[{"t":"KSSB","d":"회계기준원 안에 설치된 지속가능성기준위원회로, 한국 지속가능성 공시기준을 만든다.","en":"Korea Sustainability Standards Board"},{"t":"ISSB","d":"IFRS 재단 산하에서 국제 지속가능성 공시기준(IFRS S1·S2)을 만드는 위원회다.","en":"International Sustainability Standards Board"}]},{"no":"대상·시기","label":"누가, 언제부터 공시하나","src":"https://www.fsc.go.kr/po010101/87280","prose":["금융위원회는 2026년 7월 8일 「지속가능성(ESG) 공시 제도화 방안(최종안)」을 발표했다. 핵심은 2028년(2027 회계연도분)부터 연결자산총액 10조원 이상 코스피 상장사가 공시를 시작한다는 것이다. 2029년에는 5조원 이상으로 넓히고, 2030년에는 2028~2029년 공시 상황을 평가해 2조원까지 확대를 검토한다. 2026년 초 의견수렴안에서는 첫 대상이 30조원 이상이었는데, 최종안에서 10조원으로 넓어졌다.","공시는 자본시장법상 사업보고서를 통해 한다. 금융위원회는 이를 위해 연내 자본시장법 개정을 추진한다고 밝혔다. 공시 범위에 포함되는 기업은 종속회사를 포함해 2028년 291개사로 예상되었다. 다만 공시 첫해에 한해 자산과 매출이 모두 연결 기준 10% 미만인 종속회사는 범위에서 뺀다. 의무 대상이 아닌 상장기업도 KSSB 기준을 적용해 거래소를 통해 자율공시할 수 있다."],"req":"의무공시는 2028년(FY27) 연결자산총액 10조원 이상 코스피 상장사부터 사업보고서로 시작한다.","fig":{"cap":"의무공시 단계 (금융위원회 2026-07-08 최종안)","head":["공시 연도","대상(코스피 상장사, 연결자산총액)","Scope 3 공시"],"rows":[["2028년(FY27)","10조원 이상","2031년부터"],["2029년","5조원 이상","2032년부터"],["2030년","2조원 이상(확대 검토)","2033년부터(잠정)"]]},"terms":[{"t":"연결자산총액","d":"지배회사와 종속회사를 하나의 회사로 보고 합친 자산 총액이다.","en":"consolidated total assets"}]},{"no":"Scope 3","label":"Scope 3는 3년 늦게","src":"https://www.fsc.go.kr/po010101/87280","prose":["온실가스 배출량은 보통 세 범위로 나눈다. Scope 1은 회사가 직접 연료를 태우는 등에서 나온 배출, Scope 2는 사 온 전기와 열을 만들 때 나온 배출이다. Scope 3는 그 밖에 원료를 만드는 협력사, 제품을 쓰는 고객 등 가치사슬 전체에서 나온 배출이다. 자동차 회사라면 고객이 차를 몰며 내는 배출도 Scope 3에 들어간다.","최종안은 Scope 3를 공시대상별로 3년 유예했다. 배출량 산정 인프라를 갖출 준비기간이 필요하다는 이유다. 그래서 10조원 이상 기업은 2031년, 5조원 이상은 2032년, 2조원 이상은 2033년(잠정)부터 Scope 3를 공시한다. 또한 중소기업기본법상 소기업으로서 고탄소 배출 업종이 아닌 기업은 공시를 면제하는 의견수렴안을 그대로 유지했다."],"req":"Scope 3 배출량은 공시대상별로 의무공시 시작 3년 뒤부터 공시한다.","terms":[{"t":"Scope 3","d":"회사가 직접 내거나 사 온 에너지에서 나온 것이 아닌, 가치사슬 전반에서 생기는 간접 배출이다.","en":"Scope 3 GHG emissions"}]},{"no":"인증·면책","label":"제3자 인증과 면책","src":"https://www.fsc.go.kr/po010101/87280","prose":["인증은 회사가 공시한 정보를 외부 전문기관이 확인해 주는 절차다. 최종안은 국내외 인증 실무가 충분히 쌓이지 않았다는 점을 들어, 공시 의무화 2년 후인 2030년부터 인증을 의무화하기로 했다. 인증의 범위와 수준, 인증업자 진입 규제 같은 세부 설계는 자본시장법령 개정 과정에서 정한다. 따라서 어떤 수준의 인증을 받아야 하는지는 이 책을 쓰는 지금 아직 정해지지 않았다.","면책은 공시가 틀렸을 때 법적 책임을 덜어 주는 장치다. 도입 초기 3년간은 공시정보 전체에 대해 자본시장법상 손해배상, 행정제재, 형사처벌을 면제한다. 다만 고의적인 그린워싱에는 손해배상과 행정책임을 묻는다. 그 뒤에는 미래 예측, 온실가스 추정, 통제할 수 없는 제3자 정보처럼 불확실성이 큰 정보에 면책제도(Safe harbor)를 적용할 예정이다."],"req":"인증은 2030년부터 의무화되고, 초기 3년은 고의적 그린워싱을 빼고 법적 책임을 면제한다.","terms":[{"t":"그린워싱","d":"친환경 경영을 하지 않으면서 하는 것처럼 꾸미는 것이다(BC65).","en":"greenwashing"}]},{"no":"E1","label":"기준서 시행일과 의무공시는 다르다","pdfPage":59,"prose":["제1호 부록 E의 문단 E1은 이 기준서를 최초 공표일이 포함되는 회계연도부터 적용한다고 정한다. 그런데 이것이 곧 모든 기업이 그해부터 공시해야 한다는 뜻은 아니다. 같은 문단은 법률이나 규정이 이 기준에 따른 공시를 요구하는 경우 그 법률이 정한 시행일을 따른다고 덧붙인다. 즉 기준서는 ‘어떻게 쓰는가’를 정하고, ‘누가 언제 써야 하는가’는 법령이 정한다.","KSSB도 결론도출근거 BC136에서 시행일을 의무 공시 시작 시기로 오해하지 않도록 이 점을 분명히 했다고 설명한다. 실무에서 ‘언제부터 의무냐’는 질문을 받으면 기준서가 아니라 금융위원회 방안과 자본시장법 개정을 확인해야 한다. 아직 확인되지 않은 것도 있다. 최종안 보도자료에서 사업보고서 안의 세부 제출 기한과 인증 수준은 확인하지 못했으므로, 이 책은 그 부분을 추측해 쓰지 않는다."],"req":"기준서 시행일과 법령이 정하는 의무공시 시작 시기를 구분한다.","quote":"이 기준서는 최초 공표일이 포함되는 회계연도부터 적용한다."}],"write":{"q":"금융위원회 최종안에 따르면 의무공시는 언제, 누구부터, 어디에 하나?","must":[["2028","28년","FY27"],["10조","10조원"],["사업보고서","사업 보고서"]],"bonus":[["코스피","유가증권시장"],["연결자산총액","연결 자산"]],"wrong":["30조","2026년부터 의무"],"model":"2028년(FY27)부터 연결자산총액 10조원 이상 코스피 상장사가 사업보고서를 통해 공시한다.","src":"금융위원회 2026-07-08 보도자료"},"check":{"q":"제1호 문단 E1의 시행일과 의무공시 시작 시기의 관계로 옳은 것은?","options":["같다. 기준서가 공표된 해부터 모든 상장사가 의무로 공시한다","다르다. 의무공시 시작 시기는 관련 법률이나 규정이 정한다","다르다. 의무공시 시작 시기는 KSSB가 매년 따로 공지한다"],"ans":1,"why":"E1은 법령이 공시를 요구하면 법령의 시행일을 따른다고 정하고, BC136은 시행일과 의무공시 시작 시기가 별개라고 설명한다."},"summary":["KSSB는 IFRS S1·S2를 출발점으로 삼되 국내 사정을 반영해 일부 요구를 고쳤다.","의무공시는 2028년(FY27) 연결자산총액 10조원 이상 코스피 상장사부터 사업보고서로 시작하고, Scope 3는 3년 유예된다.","인증은 2030년부터 의무화되고 초기 3년은 법적 책임이 면제되며, 기준서 시행일과 의무공시 시점은 따로 본다."]},{"id":"k1-1","title":"제1호 목적과 적용범위","range":"문단 1~9","pages":[6,7],"min":14,"intro":"제1호의 첫 문단들은 이 기준이 누구를 위해, 어떤 정보를 공시하게 하는지 정한다. 여기서 정한 ‘투자자에게 유용한 정보’라는 잣대가 뒤에 나오는 모든 요구사항을 해석하는 기준이 된다.","blocks":[{"no":"1","label":"목적: 투자자의 결정에 쓸모 있는 정보","pdfPage":6,"prose":["문단 1은 제1호의 목적을 한 문장으로 말한다. 일반목적재무보고서의 주요이용자가 기업에 자원을 제공할지 결정할 때 쓸모 있는 지속가능성 위험과 기회 정보를 공시하게 하는 것이다. 일반목적재무보고서는 특정한 한 사람이 아니라 투자자 모두가 보도록 내는 보고서로, 부록 A에 따르면 재무제표와 지속가능성 관련 재무공시가 여기에 들어간다. BC2는 주요이용자의 예로 현재와 잠재적 투자자, 대여자와 그 밖의 채권자를 든다.","B14에 따르면 자원 제공 결정이란 주식이나 채권을 사고팔거나 보유하는 것, 돈을 빌려주는 것, 주주로서 의결권을 행사하는 것 등을 말한다. 즉 제1호가 상정하는 독자는 돈을 대는 사람이다. BC25는 이 기준이 지속가능한 발전에 대한 기여를 알리는 더 넓은 다중 이해관계자 보고와 구분된다고 설명한다. 회사가 사람과 환경에 미치는 영향 보고를 대체하는 것이 아니라 보완한다는 뜻이다.","실무에서 이 차이는 보고서 첫머리에서 바로 보인다. 지금까지 국내 기업의 지속가능경영보고서는 GRI 기준에 따라 이해관계자 전체를 독자로 삼는 경우가 많았다. KSSB 공시는 같은 주제를 다루더라도 ‘이것이 회사의 돈에 어떤 영향을 주는가’를 중심으로 다시 정리해야 한다. 같은 온실가스 숫자라도 배출권 비용이나 규제 대응 투자와 연결해 설명해야 투자자에게 쓸모가 생긴다."],"req":"주요이용자(투자자·대여자·채권자)의 자원 제공 결정에 유용한 지속가능성 위험·기회 정보를 공시한다.","quote":"지속가능성 공시기준서 제1호 ‘지속가능성 관련 재무정보 공시를 위한 일반 요구사항’의 목적은 일반목적재무보고서의 주요이용자가 기업에 대한 자원 제공과 관련된 의사결정을 할 때 유용한, 기업의 지속가능성 관련 위험 및 기회에 대한 정보를 기업이 공시하도록 요구하는 것이다.","ex":{"k":"기아 보고서에서는","t":"기아 2026 보고서는 사업활동이 외부 환경 및 사회에 미치는 영향과 대응 노력을 이해관계자에게 투명하게 공개하기 위해 발간했다고 밝히고, GRI Standards 2021에 부합하게 작성했다고 적었다. 투자자를 독자로 하는 KSSB 공시와 출발점이 다르다는 것을 보여 준다.","co":"kia","page":2},"terms":[{"t":"일반목적재무보고서","d":"특정인이 아니라 투자자와 채권자 모두가 보도록 내는 재무보고서로, 재무제표와 지속가능성 관련 재무공시를 포함한다.","en":"general purpose financial reports"},{"t":"주요이용자","d":"기업에 돈을 대는 현재·잠재적 투자자, 대여자, 그 밖의 채권자다.","en":"primary users"}]},{"no":"2","label":"왜 지속가능성이 돈과 이어지나","pdfPage":6,"prose":["문단 2는 지속가능성 정보가 왜 투자자에게 쓸모 있는지 설명한다. 회사가 돈을 버는 능력은 가치사슬 전반에서 이해관계자, 사회, 경제, 자연환경과 주고받는 관계와 떼어 놓을 수 없다는 것이다. 부록 A는 가치사슬을 기획부터 생산, 배송, 소비, 수명종료까지 회사 제품과 관련된 모든 상호작용과 자원, 관계로 정의한다. 공장 담장 안만 보는 개념이 아니라는 점이 중요하다.","이 관계는 두 방향이다. 회사는 물, 전기, 숙련 인력, 협력사 같은 자원과 관계에 기대는데 이것이 의존성이다. 동시에 회사는 그 자원을 쓰거나 바꾸며 영향을 주는데 이것이 임팩트다. 부록 B3은 물에 기대는 회사가 물 부족을 겪으면 운영에 지장이 생겨 결국 재무성과가 나빠질 수 있다고 예를 든다. 이렇게 의존성과 임팩트가 위험과 기회를 낳는다.","가치사슬은 회사 담장 밖까지 간다. KSSB는 가치사슬 범위를 1차 공급망 등으로 줄여 달라는 의견을 받았지만, BC35~BC36에서 보듯 범위를 제한하지 않기로 했다. 그 이유의 예로, 기업의 스코프 3 배출량에는 제품의 최종 소비자가 가장 크게 기여할 수 있고 공급업체의 고용 관행이 기업 평판에 영향을 줄 수 있다는 점을 든다."],"req":"기업과 가치사슬의 자원·관계에 대한 의존성과 임팩트가 지속가능성 위험·기회를 만든다는 점을 이해한다.","terms":[{"t":"가치사슬","d":"회사가 제품을 기획해 만들고 팔고 소비되어 버려질 때까지 쓰고 기대는 모든 상호작용, 자원, 관계다.","en":"value chain"},{"t":"의존성과 임팩트","d":"의존성은 회사가 자원과 관계에 기대는 것이고, 임팩트는 회사 활동이 그 자원과 관계에 주는 영향이다.","en":"dependencies and impacts"}]},{"no":"3","label":"공시 대상: 기업 전망에 영향을 줄 위험과 기회","pdfPage":6,"prose":["문단 3은 공시 대상을 정한다. 단기, 중기, 장기에 걸쳐 회사의 현금흐름, 자금조달 접근성, 자본비용에 영향을 줄 것으로 합리적으로 예상할 수 있는 모든 지속가능성 위험과 기회다. 현금흐름은 실제로 들어오고 나가는 돈, 자금조달 접근성은 필요할 때 돈을 빌리거나 투자받을 수 있는지, 자본비용은 그 돈을 쓰는 대가다. 세 가지 모두 결국 회사의 돈 이야기다.","기준서는 이 긴 표현을 ‘기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 있는 지속가능성 관련 위험 및 기회’라고 줄여 부르며, 이 말은 책 끝까지 계속 나온다. 반대로 문단 6에 따라 그렇게 예상할 수 없는 위험과 기회는 적용범위에서 빠진다. 예를 들어 배출량이 많은 회사에게 배출권 가격 상승은 현금흐름에 영향을 주는 위험이 될 수 있다.","‘합리적으로 예상’이라는 말에는 한계가 있다. B6과 B10에 따르면 회사는 보고일에 과도한 원가나 노력 없이 구할 수 있는, 근거 있는 정보를 모두 써서 위험과 기회를 찾으면 된다. 모든 위험을 찾아내려고 끝없이 조사할 필요는 없다. 그러나 BC26이 밝히듯 근거 없는 정보로 위험이나 기회를 부풀리거나 줄여서는 안 되고, 이미 가진 정보는 써야 한다."],"req":"현금흐름·자금조달 접근성·자본비용에 영향을 줄 것으로 합리적으로 예상되는 위험·기회를 모두 공시한다.","quote":"기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 없는 지속가능성 관련 위험 및 기회는 이 기준서의 적용범위에서 제외된다.","terms":[{"t":"자본비용","d":"회사가 빌리거나 투자받은 돈에 대해 치르는 대가로, 이자율이나 투자자가 요구하는 수익률이다.","en":"cost of capital"},{"t":"합리적이고 뒷받침될 수 있는 정보","d":"근거가 있고 말이 되는 정보로, 회사가 이미 갖고 있거나 큰 비용 없이 구할 수 있는 과거·현재·미래 예측 정보다.","en":"reasonable and supportable information"}],"qno":"6"},{"no":"7","label":"제1호와 다른 기준서의 역할 나누기","pdfPage":7,"prose":["문단 4는 제1호가 공시를 ‘어떻게’ 작성하고 보고하는지도 정한다고 말한다. 공시의 내용과 표시에 관한 일반 규칙, 예를 들어 보고기업의 범위, 보고 시기, 비교정보, 오류 수정 같은 것이 제1호에 들어 있다. 문단 5는 한국 지속가능성 공시기준에 따라 공시를 작성하고 보고할 때 이 기준서를 적용한다고 정한다. 그래서 제1호는 모든 KSSB 공시의 바탕이 된다.","문단 7은 특정 위험과 기회에 대해 무엇을 공시할지는 다른 기준서가 정한다고 말한다. 지금은 기후를 다루는 제2호가 그 역할을 한다. 그래서 기후 공시를 하는 회사는 ‘무엇을’은 제2호에서, ‘어떻게’는 제1호에서 찾는다. 실무에서 제2호만 읽고 제1호를 건너뛰면 보고기업 범위나 비교정보, 준수 문구 같은 기본 규칙을 놓치게 된다."],"req":"제1호는 작성·보고의 일반 규칙을, 다른 기준서는 주제별로 공시할 정보를 정한다."},{"no":"8","label":"어떤 회계기준을 쓰든, 비영리 조직이라도","pdfPage":7,"prose":["문단 8은 회사의 재무제표가 한국채택국제회계기준(K-IFRS)으로 작성되든 다른 일반적으로 인정된 회계원칙(GAAP)으로 작성되든 지속가능성 공시기준을 적용할 수 있다고 정한다. BC15에 따르면 국내에서는 상장법인 등은 K-IFRS를, 그 밖의 외부감사 대상 회사는 일반기업회계기준을 쓴다. 어느 쪽 회계기준을 쓰는 회사라도 이 기준을 적용할 수 있다는 뜻이다.","문단 9는 기준서가 공기업을 포함한 영리기업에 맞는 용어를 쓴다고 밝힌다. 민간이든 공공부문이든 비영리활동을 하는 조직이 이 기준을 적용하려면 일부 항목의 설명을 고쳐야 할 수 있다. 예를 들어 ‘투자자’나 ‘자본비용’ 같은 말은 비영리 조직의 상황에 그대로 맞지 않을 수 있기 때문이다. 다만 기준의 원칙 자체는 같이 쓸 수 있다."],"req":"재무제표에 쓰는 회계기준과 관계없이 적용할 수 있고, 비영리 조직은 설명을 고쳐 적용할 수 있다."}],"write":{"q":"제1호가 공시하라고 하는 ‘지속가능성 관련 위험 및 기회’는 어떤 것인지 한 문장으로 써 보자.","must":[["현금흐름","현금 흐름"],["자금조달","자금 조달","돈을 빌리"],["자본비용","자본 비용"]],"bonus":[["단기","중기","장기"],["합리적으로 예상","합리적으로"]],"wrong":["모든 이해관계자","환경에 미치는 모든 영향"],"model":"단기·중기·장기에 걸쳐 기업의 현금흐름, 자금조달 접근성 또는 자본비용에 영향을 줄 것으로 합리적으로 예상할 수 있는 위험과 기회다.","src":"문단 3"},"check":{"q":"다음 중 제1호가 말하는 주요이용자에 해당하지 않는 사람은?","options":["회사 주식을 사려고 검토하는 투자자","회사에 돈을 빌려준 은행","투자나 대여 관계가 없는 공장 인근 주민"],"ans":2,"why":"주요이용자는 자원 제공을 결정하는 투자자, 대여자, 채권자다(B14, BC2). 지역 주민은 회사 임팩트의 대상이지만 이 기준의 주 독자는 아니다(BC25)."},"summary":["제1호의 목적은 투자자·대여자·채권자의 자원 제공 결정에 유용한 지속가능성 위험·기회 정보를 공시하게 하는 것이다.","공시 대상은 현금흐름, 자금조달 접근성, 자본비용에 영향을 줄 것으로 합리적으로 예상되는 위험과 기회다.","제1호는 작성·보고의 일반 규칙이고, 기후처럼 주제별로 공시할 내용은 제2호 같은 다른 기준서가 정한다."]},{"id":"k1-2","title":"공정한 표시","range":"문단 10~16","pages":[8,9],"min":13,"intro":"공정한 표시는 지속가능성 공시 전체가 회사의 위험과 기회를 있는 그대로 보여 주어야 한다는 원칙이다. 이 회차에서는 유용한 정보의 조건(질적특성)과, 기준을 지키는 것만으로는 부족할 때 무엇을 더 해야 하는지 읽는다.","blocks":[{"no":"10","label":"유용한 정보의 조건","pdfPage":8,"prose":["문단 10은 지속가능성 정보가 쓸모 있으려면 갖춰야 할 성질을 두 단계로 나눈다. 꼭 있어야 하는 근본적 질적특성은 목적적합성과 표현충실성이다. 목적적합성은 투자자의 결정을 바꿀 수 있을 만큼 관련 있는 정보라는 뜻이고, 표현충실성은 나타내려는 현실을 있는 그대로 담았다는 뜻이다. 둘 중 하나라도 빠지면 정보는 쓸모가 없어진다.","여기에 비교가능성, 검증가능성, 적시성, 이해가능성이 더해지면 정보가 더 쓸모 있어진다. 이를 보강적 질적특성이라 하며 자세한 설명은 부록 D에 있다. BC47~BC48에 따르면 이 틀은 재무제표에 쓰는 ‘재무보고를 위한 개념체계’를 지속가능성 정보에 맞게 조정한 것이다. BC48은 설명이나 미래전망 진술 형태의 정보도 여전히 검증가능하다고 밝힌다."],"req":"목적적합성과 표현충실성을 갖추고, 비교가능성·검증가능성·적시성·이해가능성으로 유용성을 높인다.","fig":{"cap":"유용한 지속가능성 관련 재무정보의 질적특성(문단 10, 부록 D)","head":["구분","특성","쉬운 말"],"rows":[["근본적","목적적합성","투자자 결정에 관련이 있다"],["근본적","표현충실성","현실을 있는 그대로 담았다"],["보강적","비교가능성","다른 해, 다른 회사와 견줄 수 있다"],["보강적","검증가능성","다른 사람이 확인할 수 있다"],["보강적","적시성","결정에 늦지 않게 나온다"],["보강적","이해가능성","명확하고 간결해서 읽힌다"]]},"terms":[{"t":"질적특성","d":"정보가 쓸모 있으려면 갖춰야 할 성질로, 근본적 특성과 보강적 특성으로 나뉜다.","en":"qualitative characteristics"}]},{"no":"11","label":"공시 전체가 공정해야 한다","pdfPage":8,"prose":["문단 11은 전체 지속가능성 관련 재무공시가 기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 있는 위험과 기회를 공정하게 표시해야 한다고 정한다. 여기서 ‘전체’라는 말이 중요하다. 문장 하나하나가 틀리지 않았더라도, 불리한 위험은 짧게 쓰고 유리한 기회만 길게 쓰면 전체 그림은 공정하지 않을 수 있다. 공정성은 공시 전체를 놓고 판단한다.","공정하게 표시하려면 먼저 어떤 위험과 기회가 있는지 찾아야 한다. 문단 12는 이를 위해 부록 B의 B1~B12를 적용하라고 한다. 그 내용은 앞 회차에서 본 의존성과 임팩트, 합리적이고 뒷받침될 수 있는 정보, 가치사슬 범위 재평가다. BC46에 따르면 공정한 표시는 재무제표 표시 기준인 K-IFRS 제1001호에서 잘 알려진 개념을 지속가능성 공시에 맞게 가져온 것이다.","가치사슬 범위는 매년 다시 정할 필요는 없다. B11에 따르면 공급업체의 큰 변화, 합병이나 인수, 예상치 못한 새 규제처럼 유의적인 사건이나 상황 변화가 생겼을 때 영향을 받는 범위를 다시 평가한다. B12는 더 자주 재평가해도 되지만 반드시 요구되는 것은 아니라고 덧붙인다. BC38에 따르면 KSSB는 매 보고일마다 재평가하는 원가가 이용자가 얻는 효익보다 크다고 보았다."],"req":"공시 전체가 위험·기회를 공정하게 보여 주도록 하고, 위험·기회 식별에 B1~B12를 적용한다.","quote":"전체 지속가능성 관련 재무공시는 기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 있는 모든 지속가능성 관련 위험 및 기회를 공정하게 표시해야 한다."},{"no":"13","label":"완전하고 중립적이며 정확하게","pdfPage":8,"prose":["문단 13은 공정한 표시의 핵심을 표현충실성으로 설명한다. 위험과 기회를 완전하고, 중립적이며, 정확하게 서술해야 한다. 완전하다는 것은 이해에 필요한 내용을 빠뜨리지 않는 것이고, 중립적이라는 것은 회사에 유리하게 골라 쓰거나 강조하지 않는 것이다. 정확하다는 것은 오류가 없고 근거가 있다는 뜻이다. 셋은 따로가 아니라 함께 갖춰야 한다.","BC26은 회사가 뒷받침될 수 없거나 불합리한 정보를 전제로 위험이나 기회를 과대하거나 과소하게 기술하는 것이 금지된다고 밝힌다. 실무에서 흔한 실수는 ‘기회’ 부분은 구체적 숫자로 자랑하고 ‘위험’ 부분은 일반론으로 넘어가는 것이다. 검토할 때는 위험과 기회의 서술 깊이가 균형을 이루는지, 불리한 숫자도 같은 무게로 다루는지 확인한다.","문단 14는 중요성을 회사 특유의 목적적합성이라고 정의한다. 같은 정보라도 그 회사에서 해당 항목의 성격이나 규모가 어떠냐에 따라 중요하기도 하고 아니기도 하다. 예를 들어 물을 거의 쓰지 않는 회사와 물을 많이 쓰는 회사에게 물 사용 정보의 무게는 다르다. 중요성 판단은 회사 사정을 가장 잘 아는 작성자의 몫이다. 중요성은 다음 회차에서 자세히 읽는다."],"req":"위험과 기회를 완전하고 중립적이며 정확하게 서술한다.","terms":[{"t":"표현충실성","d":"나타내려는 현실을 빠짐없이, 치우침 없이, 틀림없이 담은 성질이다.","en":"faithful representation"}]},{"no":"15","label":"기준을 지켜도 부족하면 더 쓴다","pdfPage":8,"prose":["문단 15는 공정한 표시를 위해 두 가지를 더 요구한다. 하나는 비교가능하고 검증가능하며 적시성 있고 이해가능한 정보를 공시하는 것이다. 다른 하나는 기준서의 구체적 요구사항을 모두 지켰더라도, 투자자가 위험과 기회가 회사의 현금흐름, 자금조달 접근성, 자본비용에 미치는 영향을 이해하기에 부족하면 추가 정보를 공시하는 것이다.","두 번째 요구가 이 문단의 핵심이다. 기준서의 목록은 최소한의 출발점일 뿐, 체크리스트를 채웠다고 끝나지 않는다는 뜻이다. 어떤 회사에 특수한 위험이 있는데 기준서에 맞는 항목이 없다면, 그 영향을 이해하는 데 필요한 정보를 스스로 더해야 한다. 부록 B의 B26도 같은 내용을 다시 강조하며, 이 원칙이 중요성 판단과도 이어진다는 점을 보여 준다.","문단 16은 필요한 추가 정보까지 포함해 지속가능성 공시기준을 적용했다면 공정하게 표시된 것으로 본다고 정한다. 즉 기준 적용과 공정한 표시는 따로 노는 것이 아니며, 추가 정보 공시는 기준 적용의 일부다. 실무에서는 공시 초안을 다 쓴 뒤 ‘투자자가 이것만 보고 영향을 이해할 수 있는가’를 마지막으로 묻는 것이 좋다. 이 질문에 ‘아니요’라는 답이 나오면 추가 정보가 필요하다는 신호다."],"req":"구체적 요구사항을 지켜도 투자자가 영향을 이해하기에 부족하면 추가 정보를 공시한다."}],"write":{"q":"표현충실성을 갖추려면 위험과 기회를 어떻게 서술해야 하나?","must":[["완전","빠짐없이","빠뜨리지"],["중립","치우치지","치우침"],["정확","오류 없이","틀림없이"]],"bonus":[["과대","과소","부풀리"]],"wrong":["유리한 것만","기회를 강조"],"model":"위험과 기회를 빠짐없이 완전하게, 한쪽으로 치우치지 않게 중립적으로, 그리고 정확하게 서술해야 한다.","src":"문단 13"},"check":{"q":"기준서의 구체적 요구사항을 모두 지켰는데도 투자자가 위험의 영향을 이해하기에 부족하다면?","options":["요구사항을 지켰으므로 그대로 둔다","이해에 필요한 추가 정보를 공시한다","이해하기 어려운 위험은 공시에서 뺀다"],"ans":1,"why":"문단 15⑵와 B26은 구체적 요구사항을 지켜도 이해에 부족하면 추가 정보를 공시하라고 요구한다."},"summary":["유용한 정보의 근본적 질적특성은 목적적합성과 표현충실성이고, 비교가능성·검증가능성·적시성·이해가능성이 이를 보강한다.","공정한 표시는 공시 전체가 위험과 기회를 완전하고 중립적이며 정확하게 보여 주는 것이다.","기준서 요구사항을 지켜도 이해에 부족하면 추가 정보를 공시해야 하며, 이것까지가 기준 적용이다."]},{"id":"k1-3","title":"중요성과 보고기업","range":"문단 17~20 (+B13~B38)","pages":[9,43],"min":17,"intro":"중요성은 무엇을 공시하고 무엇을 뺄지 정하는 거름망이고, 보고기업은 누구에 대해 공시할지 정하는 울타리다. 이 회차에서는 문단 17~20과 부록 B의 핵심 문단을 함께 읽는다.","blocks":[{"no":"18","label":"중요한 정보란","pdfPage":9,"prose":["문단 17은 회사가 기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 있는 위험과 기회에 대한 중요한 정보를 공시한다고 정한다. 무엇이 중요한지는 문단 18이 정한다. 그 정보를 빠뜨리거나, 잘못 적거나, 알아보기 어렵게 했을 때 이를 근거로 내리는 주요이용자의 의사결정에 영향을 줄 것으로 합리적으로 예상할 수 있다면 중요한 정보다.","판단 기준은 ‘투자자의 결정이 달라질 수 있는가’다. BC50에 따르면 이 정의는 재무보고 개념체계와 K-IFRS 제1001호의 중요성 정의에 기초한다. 다만 BC51은 지속가능성 공시와 재무제표의 중요성 판단이 다를 수밖에 없다고 설명한다. 지속가능성 공시는 더 긴 기간과 가치사슬 전반을 보고, 측정 기준도 재무제표와 다를 수 있기 때문이다.","B25에 따르면 중요하지 않은 정보는 기준서가 요구하더라도 공시할 필요가 없다. 반대로 B32는 법률이 중요한 정보를 빼도 된다고 허용하더라도 회사가 그 정보를 공시한다고 정한다. B33은 법률이 공시를 아예 금지하면 공시하지 않아도 되지만, 그 경우 공시하지 않은 정보의 유형을 식별하고 제약의 원천을 설명하게 한다. 빠진 이유를 밝혀야 투자자가 공백을 오해하지 않기 때문이다."],"req":"누락·오기·불분명하게 하면 주요이용자 의사결정에 영향을 줄 정보를 중요한 정보로 보고 공시한다.","quote":"기업은 기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 있는 지속가능성 관련 위험 및 기회에 대한 중요한 정보를 공시한다.","terms":[{"t":"중요성","d":"정보를 빼거나 틀리게 적었을 때 투자자의 결정이 달라질 수 있는지로 판단하는, 회사마다 다른 기준이다.","en":"materiality"}],"qno":"17"},{"no":"B19","label":"중요성 판단은 회사마다 다르다","pdfPage":38,"prose":["B19는 중요성 판단이 기업 특유의 사항이라서 기준서가 임계치, 즉 몇 % 이상이면 중요하다는 식의 선을 정하지 않는다고 밝힌다. B20에 따르면 회사는 해당 주제에 적용되는 기준서 요구사항을 출발점으로 삼는다. 그리고 B21에 따라 그 정보가 홀로 또는 다른 정보와 합쳐 중요한지를 양적 요소와 질적 요소를 함께 보며 판단한다.","B22에 따르면 미래 사건은 잠재적 영향의 크기와 발생가능성을 함께 본다. 영향이 크고 발생 가능성이 높으면 중요할 가능성이 크지만, B23은 발생 가능성은 낮아도 영향이 큰 결과도 따져 보라고 한다. 여러 위험 원천이 각각은 드물어도 모두 공급망 붕괴로 이어진다면 합친 위험에 대한 정보는 중요할 수 있다. B28에 따라 이 판단은 매 보고일에 다시 한다.","실무에서는 이를 ‘중대성 평가’라는 절차로 운영한다. 다만 국내 보고서의 중대성 평가는 GRI나 ESRS에 맞춘 이중 중대성인 경우가 많다. 이중 중대성은 회사가 사회와 환경에 주는 영향과 회사 재무에 미치는 영향을 함께 보는 방식이다. KSSB 공시에 필요한 것은 그중 회사 재무에 미치는 위험과 기회 쪽 판단이다. 따라서 중대성 평가 결과를 KSSB 공시에 옮기기 전에 재무 관점의 결과를 따로 확인해야 한다."],"req":"임계치 없이 회사 상황에 맞춰 양적·질적 요소, 발생가능성과 영향 크기를 고려해 매 보고일 중요성을 판단한다.","ex":{"k":"현대차 보고서에서는","t":"현대차는 이중 중대성 평가에서 위험 및 기회 관점의 잠재적 재무 영향 크기와 발생가능성을 1~5점으로 정량화하고 임계값을 정해, 2026년 위험 및 기회 측면 6개 주제를 중대 주제로 선정했다고 밝혔다.","co":"hyundai","page":16}},{"no":"B27","label":"중요한 정보를 묻히게 하지 않기","pdfPage":40,"prose":["B27은 중요한 정보를 불분명하게 해서는 안 된다고 정한다. 정보가 빠지거나 틀린 것과 비슷한 효과를 내는 방식으로 전달되면 불분명한 것이다. 예로는 중요하지 않은 정보와 섞여 구분되지 않는 경우, 표현이 모호한 경우, 같은 주제가 공시 여기저기 흩어진 경우, 다른 항목을 부적절하게 합치거나 비슷한 항목을 부적절하게 쪼갠 경우가 있다.","B29~B30에 따르면 통합과 세분화는 공유되는 특성을 기준으로 한다. 특성이 같으면 합치고, 다르면 나눈다. B30은 물이 풍부한 곳에서 취수한 물과 물 스트레스가 높은 지역에서 취수한 물을 구분해 공시할 필요가 있을 수 있다고 예를 든다. BC54는 디지털 태깅, 글상자나 음영 배경, 보고서 분할 같은 구분 방법도 소개한다.","실무에서 이 문단은 두꺼운 지속가능경영보고서에 KSSB 공시를 섞을 때 특히 중요하다. 사회공헌 사례와 수상 내역 사이에 기후 위험의 재무 영향이 묻혀 있으면, 문장이 정확해도 이 요구에 어긋날 수 있다. 그래서 KSSB 공시 부분은 따로 묶고, 같은 위험에 대한 거버넌스, 전략, 지표 정보를 찾아가기 쉽게 연결해 두는 것이 좋다."],"req":"중요한 정보가 중요하지 않은 정보에 묻히거나 흩어지지 않게 구분하고, 공유 특성에 따라 통합·세분화한다."},{"no":"B34","label":"상업적으로 민감한 기회 정보","pdfPage":42,"prose":["B34는 지속가능성 관련 ‘기회’에 대한 정보가 상업적으로 민감하면 중요하더라도 생략할 수 있게 한다. 다만 B35의 세 조건이 모두 맞아야 한다. 아직 공개되지 않은 정보여야 하고, 공시하면 그 기회로 얻을 경제적 효익이 크게 줄 것으로 합리적으로 예상되어야 하며, 합친 수준으로 공시하는 등 다른 방법으로도 피해 없이 목적을 채울 수 없어야 한다.","B36에 따르면 면제를 쓰면 생략한 항목마다 면제를 썼다는 사실을 공시하고, 매 보고일에 계속 쓸 수 있는지 다시 평가한다. BC56은 KSSB가 IFRS S1의 이 선별적 면제를 그대로 가져왔다고 밝힌다. BC59는 공시로 경쟁력이 약해질 수 있다는 일반적인 위험만으로는 공시를 피할 충분한 이유가 되지 않는다고 못 박는다. 이미 공개된 정보에도 쓸 수 없다."],"req":"기회 정보에 한해, 세 조건을 모두 충족할 때만 생략하고 면제 사용 사실을 공시한다.","quote":"기업은 지속가능성 관련 위험과 관련하여, 또는 지속가능성 관련 재무정보의 광범위한 미공시의 근거로서 문단 B34에서 정한 면제규정을 사용할 수 없다.","terms":[{"t":"상업적으로 민감한 정보","d":"아직 공개되지 않았고 공시하면 회사가 기회로 얻을 이익을 크게 해칠 정보다.","en":"commercially sensitive information"}],"qno":"B37"},{"no":"20","label":"보고기업은 재무제표와 같다","pdfPage":10,"prose":["문단 20은 지속가능성 공시의 보고기업이 관련 재무제표의 보고기업과 같아야 한다고 정한다. B38에 따르면 연결재무제표를 쓰는 회사라면 지배기업과 종속기업 전체가 하나의 보고기업이다. BC14와 BC62는 재무제표와 같은 울타리를 써야 두 정보를 한 세트로 읽고 서로 연결할 수 있다고 설명한다. 재무 숫자와 배출량 숫자의 범위가 다르면 비교가 어렵기 때문이다.","BC63에 따르면 작성자들은 종속기업 데이터를 모으기 어렵다며 범위를 주요 종속기업이나 국내 종속기업으로 줄여 달라고 했다. KSSB는 BC65에서 범위를 특정하게 줄이면 일부 종속기업 공시를 피하는 데 쓰여 그린워싱을 부를 수 있다며 받아들이지 않았다. 대신 BC66은 중요성을 적용하면 모든 종속기업 정보를 반드시 넣을 필요는 없다고 설명한다. 금융위원회 최종안은 공시 첫해에 자산과 매출이 모두 연결 기준 10% 미만인 종속회사를 범위에서 빼기로 했다."],"req":"지속가능성 공시의 보고기업을 관련 재무제표(연결이면 지배기업과 종속기업)의 보고기업과 같게 한다.","ex":{"k":"기아 보고서에서는","t":"기아는 보고서의 재무정보가 K-IFRS에 따른 연결재무제표 기준과 일치한다고 밝히고, 환경·사회 정보는 연결재무제표 범위에 포함되는 완성차 및 부품의 제조·판매 부문을 대상으로 한다고 적었다. 데이터 취합 한계로 국내 사업장이나 해외 일부만 포함한 경우에는 커버리지를 따로 표기했다.","co":"kia","page":2},"terms":[{"t":"보고기업","d":"일반목적재무제표를 작성하도록 요구되거나 작성을 선택한 기업으로, 공시의 울타리가 된다.","en":"reporting entity"}]}],"write":{"q":"지속가능성 관련 재무공시에서 어떤 정보가 ‘중요한’ 정보인지 한 문장으로 써 보자.","must":[["누락","빠뜨리","빠뜨"],["잘못 기재","잘못 적","불분명"],["의사결정","결정"]],"bonus":[["주요이용자","투자자"],["합리적으로 예상","합리적으로"]],"wrong":["매출의 5%","금액이 크면"],"model":"정보를 누락하거나 잘못 기재하거나 불분명하게 했을 때 주요이용자의 의사결정에 영향을 줄 것으로 합리적으로 예상할 수 있다면 그 정보는 중요하다.","src":"문단 18"},"check":{"q":"상업적으로 민감한 정보에 대한 면제(B34)를 쓸 수 있는 것은?","options":["지속가능성 관련 위험에 대한 정보","지속가능성 관련 기회에 대한 정보","위험과 기회 모두"],"ans":1,"why":"B34는 기회에 대한 정보에만 적용되며, B37은 위험 정보나 광범위한 미공시의 근거로 쓸 수 없다고 정한다."},"summary":["중요한 정보는 빠뜨리거나 틀리거나 불분명하게 하면 투자자의 결정에 영향을 줄 것으로 합리적으로 예상되는 정보다.","중요성에는 정해진 임계치가 없고, 회사는 양적·질적 요소를 보며 매 보고일 다시 판단하고 중요한 정보가 묻히지 않게 한다.","보고기업은 재무제표의 보고기업과 같아야 하며, 연결재무제표라면 지배기업과 종속기업 전체다."]},{"id":"k1-4","title":"연계된 정보","range":"문단 21~24 (+B39~B44)","pages":[10,46],"min":13,"intro":"연계된 정보는 지속가능성 공시의 여러 부분이 서로, 그리고 재무제표와 어떻게 이어지는지 보여 주라는 요구다. 숫자와 설명이 따로 놀지 않게 하는 원칙이라 실무 검토에서 자주 문제가 된다.","blocks":[{"no":"21","label":"두 종류의 연결","pdfPage":10,"prose":["문단 21은 투자자가 두 종류의 연결을 이해할 수 있게 정보를 제공하라고 한다. 첫째는 정보가 다루는 항목 사이의 연결로, 예를 들어 서로 다른 위험과 기회가 어떻게 얽혀 있는지다. 둘째는 공시 사이의 연결로, 지속가능성 공시 안에서 거버넌스·전략·위험관리·지표 및 목표가 이어지는지, 그리고 지속가능성 공시와 재무제표가 이어지는지다.","B40은 예를 든다. 회사가 어떤 기회를 추구해 수익이 늘었다면 전략과 재무성과의 관계를 설명한다. 두 위험 사이에서 절충을 하고 조치를 취했다면 그 위험들과 전략의 관계를 설명한다. 목표를 약속했지만 회계상 인식기준을 아직 충족하지 못해 재무제표에 영향이 없다면 그 관계도 설명한다. 숫자가 없는 이유도 연결 정보가 될 수 있다는 뜻이다.","BC70에는 디젤 차량을 전기 차량으로 바꾸는 계획을 가진 회사 예가 있다. 이 회사는 차량이 아직 손상되지 않아(회계상 가치가 크게 떨어지지 않아) 감가상각(설비 값을 쓰는 기간에 나누어 비용으로 반영하는 것)이나 내용연수(쓸 수 있는 기간) 추정을 바꿀 필요가 없다고 결론 내린다. 그러면서 전환 계획이 미래현금흐름에 영향을 주고 재무제표 회계처리가 그 계획과 일관된다는 점을 설명할 필요가 있을 수 있다. 전략과 재무제표를 한 줄로 이어 주는 설명이다."],"req":"항목 간의 연결과 공시 간의 연결(공시 내부, 재무제표와의 연결)을 이용자가 이해할 수 있게 정보를 제공한다.","terms":[{"t":"절충(trade-off)","d":"하나를 얻으려고 다른 것을 일부 포기하는 선택이다.","en":"trade-off"}]},{"no":"B42","label":"연결을 만드는 방법","pdfPage":45,"prose":["B42는 연결을 보여 주는 구체적 방법을 정한다. 필요한 설명과 상호참조(다른 곳에 있는 내용을 정확한 위치로 가리키는 것)를 제공하고, 일관된 데이터·가정·측정 단위를 쓰는 것이다. 연결은 명확하고 간결하게 설명하고, 여러 기준서가 같은 항목을 요구하면 불필요한 중복을 피한다. 그리고 지속가능성 공시와 재무제표에 쓴 데이터·가정 사이에 유의적인 차이가 있으면 그 차이에 대한 정보를 공시한다. 설명이 길 필요는 없고, 어디를 보면 되는지 정확히 가리키는 것이 더 중요하다.","B41은 같은 감독 체계가 여러 위험과 기회를 함께 다룬다면 위험마다 거버넌스를 따로 쓰지 말고 통합해서 공시하라고 한다. 실무에서는 기후, 인권, 안전 각 장에 이사회 설명을 반복하는 대신 한곳에 쓰고 나머지에서 가리키는 방식이다. B43은 전략이 재무계획과 목표 지표에 어떻게 연결되는지 설명할 필요가 있을 수 있다고 덧붙인다. 반복을 줄이고 연결을 드러내는 것이 이 문단의 핵심이다."],"req":"설명·상호참조와 일관된 데이터·가정·단위로 연결을 보여 주고, 재무제표와의 유의적 차이는 공시한다."},{"no":"22","label":"관련 재무제표를 밝힌다","pdfPage":10,"prose":["문단 22는 지속가능성 공시가 어떤 재무제표와 관련되는지 식별하라고 한다. 짧은 문단이지만, 앞에서 본 보고기업 일치(문단 20)와 함께 두 보고서를 한 쌍으로 묶는 출발점이다. 실무에서는 공시가 어느 회계연도의 어떤 연결재무제표와 관련되는지 첫머리에 밝힌다. 연결재무제표와 별도재무제표를 모두 내는 회사라면 어느 쪽인지 분명히 해야 한다. 관련 재무제표가 분명해야 문단 23의 데이터·가정 일관성도 점검할 수 있다.","재무제표를 특정해야 재무적 영향 숫자를 어디서 확인할지, 보고기간이 같은지 투자자가 따라갈 수 있다. 뒤에서 볼 공시의 위치(문단 60)와 보고시기(문단 64) 규정도 이 연결을 전제로 한다. 결국 투자자가 지속가능성 공시와 재무제표를 나란히 펴 놓고 읽을 수 있게 하는 것이 목적이다. 이 문단이 빠지면 뒤의 연결 요구도 힘을 잃는다."],"req":"지속가능성 공시와 관련된 재무제표를 식별한다.","quote":"기업은 지속가능성 관련 재무공시와 관련된 재무제표를 식별한다."},{"no":"23","label":"데이터와 가정은 가능한 한 일관되게","pdfPage":10,"prose":["문단 23은 지속가능성 공시에 쓴 데이터와 가정이 재무제표 작성에 쓴 것과 가능한 범위 내에서 일관되어야 한다고 정한다. 예를 들어 기후 분석에서 쓴 탄소가격이나 설비 사용 기간이 재무제표의 자산 손상 검토에 쓴 가정과 크게 다르면 투자자는 어느 쪽을 믿어야 할지 알 수 없다. 두 보고서가 같은 회사의 같은 미래를 말해야 한다는 뜻이다.","‘가능한 범위 내에서’라는 단서가 붙은 데는 이유가 있다. BC72에 따르면 회계기준의 요구 때문에 두 보고서의 데이터와 가정이 달라질 타당한 이유가 있을 수 있다. 그래서 기준서는 완전한 일치를 요구하는 대신, B42⑶에 따라 유의적인 차이가 있으면 그 정보를 공시하게 했다. 차이가 있다는 사실과 이유를 숨기지 않는 것이 핵심이다.","문단 24는 측정 단위로 통화를 쓸 때는 관련 재무제표의 표시통화를 쓰라고 정한다. 국내 회사라면 재무제표가 원화로 표시되므로 재무적 영향도 원화로 적는 것이 기본이다. 해외 법인의 영향을 달러나 유로로 계산했더라도 공시에서는 재무제표와 같은 통화로 바꿔 보여 주어야 비교가 된다. 통화가 섞이면 투자자가 재무제표 숫자와 바로 견주어 볼 수 없게 된다. 환산에 쓴 환율 같은 가정도 재무제표와 일관되게 쓰는 것이 좋다."],"req":"데이터·가정은 재무제표와 가능한 범위에서 일관되게 하고, 통화는 재무제표 표시통화를 쓴다.","ex":{"k":"기아 보고서에서는","t":"기아는 물리적 위험의 재무영향을 추정할 때 매출액, 인건비, 유형·재고자산 가액 등 재무 데이터와 물가상승률 같은 경제지표를 활용했다고 밝히고, 결과를 억 원 단위로 제시했다.","co":"kia","page":28}}],"write":{"q":"지속가능성 공시와 재무제표의 데이터·가정에 대해 회사는 무엇을 해야 하나?","must":[["일관","일치","맞추"],["유의적인 차이","차이"],["공시","밝히","설명"]],"bonus":[["가능한 범위","가능한 한"],["표시통화","통화"]],"wrong":["완전히 같아야","따로 작성"],"model":"데이터와 가정은 재무제표와 가능한 범위에서 일관되게 하고, 유의적인 차이가 있으면 그 차이에 대한 정보를 공시한다.","src":"문단 23, B42⑶"},"check":{"q":"기후, 인권 등 여러 위험을 같은 이사회 위원회가 감독한다면 거버넌스 공시는 어떻게 하나?","options":["위험마다 같은 설명을 반복한다","통합해서 한 번 공시한다","거버넌스는 공시하지 않아도 된다"],"ans":1,"why":"B41⑵는 감독이 통합되어 있으면 위험·기회별로 따로 쓰지 말고 거버넌스 공시를 통합하라고 한다."},"summary":["연계된 정보는 항목 사이의 연결과 공시 사이의 연결(공시 내부, 재무제표와의 연결)을 보여 준다.","연결은 설명, 상호참조, 일관된 데이터·가정·단위로 만들고 불필요한 중복은 피한다.","데이터와 가정은 재무제표와 가능한 범위에서 일관되게 하고, 유의적인 차이는 공시한다."]},{"id":"k1-5","title":"핵심요소 ① 거버넌스와 전략의 틀","range":"문단 25~33 (31A·31B 포함)","pages":[11,15],"min":18,"intro":"제1호는 공시 내용을 거버넌스, 전략, 위험관리, 지표 및 목표라는 네 기둥(핵심요소)으로 짠다. 이 회차는 거버넌스와 전략의 앞부분을 읽고, KSSB에만 있는 기간범위 정의(문단 31A·31B)를 꼭 짚는다.","blocks":[{"no":"25","label":"네 가지 핵심요소","pdfPage":11,"prose":["문단 25는 다른 기준서가 달리 정하지 않는 한 네 가지 정보를 공시하라고 한다. 거버넌스는 위험과 기회를 감독하고 관리하는 체계와 절차, 전략은 위험과 기회에 대응하는 접근법, 위험관리는 위험과 기회를 찾고 평가하고 순위를 매기고 지켜보는 과정, 지표 및 목표는 그와 관련된 성과와 목표 진척도다. 이 네 기둥은 제2호 기후 공시에서도 그대로 쓰인다.","BC74는 핵심요소 공시가 회사가 어떻게 해야 하는지 정하는 것이 아니라, 회사가 실제로 무엇을 하고 있는지 설명하게 하는 것이라고 강조한다. 그래서 BC128이 밝히듯 체계가 없는 회사도 그 사실을 설명하면 기준 준수를 주장할 수 있고, 체계가 없다는 사실 자체가 투자자에게 중요한 정보일 수 있다. 꾸며 쓰기보다 있는 그대로 쓰는 것이 원칙이다."],"req":"거버넌스, 전략, 위험관리, 지표 및 목표의 네 가지 핵심요소를 공시한다.","fig":{"cap":"네 가지 핵심요소(문단 25)","head":["핵심요소","무엇을 보여 주나","문단"],"rows":[["거버넌스","누가 어떻게 감독하고 관리하나","26~27"],["전략","위험·기회에 어떻게 대응하나","28~42"],["위험관리","위험·기회를 어떤 과정으로 찾고 관리하나","43~44"],["지표 및 목표","성과와 목표 진척도는 어떤가","45~53"]]},"terms":[{"t":"핵심요소","d":"지속가능성 공시를 짜는 네 기둥인 거버넌스, 전략, 위험관리, 지표 및 목표다.","en":"core content"}]},{"no":"27","label":"거버넌스: 누가, 어떻게 감독하나","pdfPage":11,"prose":["문단 26~27은 거버넌스 공시를 두 층으로 나눈다. 첫째는 감독 책임이 있는 의사결정기구나 개인이다. 회사는 그 책임이 운영규정과 직무기술서 등에 어떻게 반영되는지, 필요한 기량과 역량을 갖췄는지 어떻게 판단하는지, 얼마나 자주 보고받는지, 전략과 주요 거래를 감독할 때 위험과 기회를 어떻게 고려하는지 공시한다. 이사회 안에 지속가능경영위원회 같은 기구를 두었다면 그 위원회가 공시 대상이 된다.","문단 27⑴㈒에 따라 목표 설정을 어떻게 감독하고 진척도를 어떻게 지켜보는지, 관련 성과지표가 보상정책에 들어가는지와 어떻게 들어가는지도 공시한다. 둘째 층은 경영진의 역할이다. 문단 27⑵에 따라 그 역할이 특정 임원 직책이나 경영진 위원회에 위임되는지, 위임받은 곳은 어떻게 감독되는지, 통제와 절차가 다른 내부 기능과 어떻게 통합되는지를 밝힌다. BC80은 이사회의 감독과 경영진의 운영상 결정을 구분해 보여 주라는 취지라고 설명한다."],"req":"감독기구·개인의 책임, 역량, 보고 빈도, 고려 방식, 목표 감독과 보상 연계, 그리고 경영진의 역할을 공시한다.","ex":{"k":"기아 보고서에서는","t":"기아는 이사회 산하 지속가능경영위원회를 연 1회 이상 정기 개최해 경영진으로부터 기후변화 대응 성과와 추진 현황을 보고받는다고 밝혔다. 또 CEO KPI가 지속경영지표(20%), 재무지표(35%), 사업 및 전략지표(45%)로 구성되고 지속경영지표에 탄소배출 감축 성과 등이 포함된다고 적어, 문단 27⑴㈒의 보상 연계를 보여 준다.","co":"kia","page":24},"terms":[{"t":"의사결정기구","d":"이사회, 이사회 위원회 등 지속가능성 위험과 기회의 감독 책임을 지는 기구다.","en":"governance body"}]},{"no":"30","label":"위험과 기회, 그리고 영향이 나타날 시기","pdfPage":13,"prose":["문단 28~29는 전략 공시의 목적과 다섯 갈래를 제시한다. 위험과 기회 자체, 사업모형과 가치사슬에 미치는 영향, 전략과 의사결정에 미치는 영향, 재무적 영향, 그리고 회복력이다. 이 중 첫 갈래를 다루는 문단 30은 회사가 위험과 기회를 기술하고, 각 영향이 단기·중기·장기 중 언제 나타날 것으로 합리적으로 예상되는지 명시하라고 한다.","문단 30⑶에 따라 회사는 단기, 중기, 장기를 어떻게 정의하는지, 그 정의가 전략적 의사결정에 쓰는 계획기간과 어떻게 이어지는지 설명해야 한다. 문단 31은 이 기간범위가 회사마다 다를 수 있다고 인정한다. 현금흐름, 투자와 사업주기, 산업에서 통용되는 계획기간, 투자자가 그 산업을 평가하는 기간에 따라 달라지기 때문이다. 그래서 IFRS S1은 기간을 회사가 스스로 정하게 한다."],"req":"위험·기회와 영향이 나타날 기간범위를 밝히고, 단기·중기·장기의 정의와 계획기간의 연결을 설명한다."},{"no":"31A","label":"KSSB가 정해 준 기간범위","pdfPage":14,"prose":["문단 31A는 KSSB에만 있는 규정이다. 문단 30⑶과 31에도 불구하고 회사는 보고기간 말부터 단기 1년 이내, 중기 1년 초과 5년 이내, 장기 5년 초과라는 정해진 기간범위를 쓸 수 있다. 이 기간을 쓰면 30⑶의 정의 설명 대신 기준서가 정의한 기간범위를 사용했다는 사실을 공시한다. 계획기간과의 연결을 따로 설명하지 않아도 된다는 점이 실무상 차이다.","BC82에 따르면 KSSB는 기간범위가 회사 상황에 따라 다를 수 있다는 점을 인정하면서도, 기준서가 정의를 제시하면 회사들이 같은 기간에 대한 정보를 공시해 비교가능성이 높아질 수 있다고 보았다. 그래서 정의를 주되 강제하지 않았고, 자체 정의를 쓰는 회사는 그 정의와 전략 계획의 연결을 설명하게 했다. 모든 기업이 같은 기간을 쓰자는 의견도 있었지만 선택을 허용하는 쪽으로 정해졌다.","문단 31B는 다른 기준서가 기간범위를 31A와 다르게 정의하면 그 기준서를 우선 적용한다고 정한다. 특정 주제에는 그 주제에 맞는 기간이 필요할 수 있기 때문이다. 따라서 기후 공시를 준비할 때는 제2호에 기간범위에 관한 별도 규정이 있는지 함께 확인해야 한다. 31A를 골랐더라도 주제별 기준서에 다른 정의가 있으면 그쪽을 따르는 것이다. 이 내용은 제2호 교재에서 다시 다룬다."],"req":"단기 1년 이내·중기 1년 초과 5년 이내·장기 5년 초과의 정의를 쓸 수 있고, 쓰면 그 사실을 공시한다.","quote":"다른 지속가능성 공시기준서에서 기간범위를 문단 31A와 다르게 정의한 경우, 해당 지속가능성 공시기준서를 우선 적용한다.","fig":{"cap":"문단 31A의 기간범위(보고기간 말 이후)","head":["구분","기간"],"rows":[["단기","1년 이내"],["중기","1년 초과 5년 이내"],["장기","5년 초과"]]},"ex":{"k":"기아 보고서에서는","t":"기아는 기후 관련 위험 및 기회의 영향 기간을 단기 1년 이내(2025~2026년), 중기 1년 초과 5년 이내(2027~2031년), 장기 5년 초과(2032~2045년)로 정하고, 단기의 근거를 ‘KSSB 1호 기준서에서 정의하는 단기 기간 차용’이라고 적었다. 중기와 장기는 탄소배출 감축 로드맵 중간 연도, 해외 사업장 RE100 달성 시점, 중장기 감축 목표 달성 시점에 맞췄다.","co":"kia","page":25},"terms":[{"t":"기간범위","d":"위험과 기회의 영향이 나타날 것으로 예상되는 시기를 단기·중기·장기로 나눈 것이다.","en":"time horizons"}],"qno":"31B"},{"no":"32","label":"사업모형과 가치사슬의 어디에 몰려 있나","pdfPage":14,"prose":["문단 32는 위험과 기회가 회사의 사업모형과 가치사슬에 미치는 현재 영향과 예상 영향을 기술하라고 한다. 부록 A는 사업모형을 회사 활동을 통해 투입물을 산출물과 성과로 바꾸는 회사의 시스템으로 정의한다. 또 위험과 기회가 집중된 부분을 밝혀야 하는데, 기준서는 지리적 영역과 시설·자산의 유형을 예로 든다. 투자자는 이 정보로 위험이 어디에 몰려 있는지 본다.","BC31은 물이 부족한 지역에서 물을 쓰는 음료 회사가 운영에 미치는 영향, 같은 수원에 기대는 주변 지역사회에 미치는 영향, 평판 손상과 고객 손실 위험, 과세나 사용 제한 가능성, 공급망 전반의 평가 방식을 공시할 수 있다고 예를 든다. 실무에서는 사업장별 표나 지도로 어느 공장이 어떤 위험에 많이 노출되는지 보여 주는 경우가 많다."],"req":"위험·기회가 사업모형과 가치사슬에 미치는 영향과 집중된 부분(지역, 시설·자산 유형)을 기술한다.","ex":{"k":"기아 보고서에서는","t":"기아는 법인별 태풍·폭우 노출도를 5단계로 평가해, 국내에서는 AutoLand광주와 AutoLand화성의 노출도가 상대적으로 높고 해외에서는 기아중국(KCN)과 기아멕시코(KMX)가 장기에 High~Highest 수준의 폭우 위험에 노출된다고 밝혔다.","co":"kia","page":27},"terms":[{"t":"사업모형","d":"회사 활동으로 투입물을 산출물과 성과로 바꾸어 가치를 만들고 현금흐름을 창출하는 시스템이다.","en":"business model"}]},{"no":"33","label":"전략과 의사결정에 미친 영향","pdfPage":15,"prose":["문단 33은 위험과 기회가 전략과 의사결정에 어떤 영향을 주었는지 공시하라고 한다. 회사가 어떻게 대응했고 앞으로 어떻게 대응할 계획인지, 과거 보고기간에 공시한 계획이 얼마나 진척되었는지를 양적·질적 정보로 밝힌다. 작년에 약속한 계획을 올해 다시 확인하게 하는 셈이다. 계획만 늘어놓고 결과를 말하지 않는 공시를 막는 장치이기도 하다.","문단 33⑶에 따라 회사가 고려한 위험과 기회 사이의 절충도 공시한다. 기준서는 새 사업장 위치를 정할 때 환경적 임팩트와 지역사회 고용 기회를 함께 고려했을 수 있다고 예를 든다. B44⑵는 전략을 세울 때 평가한 대안을 설명하라고 덧붙인다. 좋은 공시는 어떤 대안을 검토했고 왜 지금의 선택을 했는지 보여 준다. 절충을 숨기지 않고 보여 주면 투자자는 회사가 무엇을 얻고 무엇을 포기했는지 판단할 수 있다."],"req":"위험·기회에 대한 대응과 계획, 과거 공시 계획의 진척도, 위험·기회 간 절충을 공시한다."}],"write":{"q":"제1호 문단 31A의 기간범위 정의와, 이를 쓸 때 공시할 것을 한 문장으로 써 보자.","must":[["1년 이내","단기 1년"],["5년 이내","5년 초과","1~5년"],["사실","사용했다","사용하였음"]],"bonus":[["31B","다른 기준서"],["보고기간 말","보고기간말"]],"wrong":["반드시 써야","10년"],"model":"단기는 1년 이내, 중기는 1년 초과 5년 이내, 장기는 5년 초과로 쓸 수 있고, 이 정의를 쓰면 기준서의 기간범위를 사용했다는 사실을 공시한다.","src":"문단 31A"},"check":{"q":"문단 31A의 기간범위에 대한 설명으로 옳은 것은?","options":["모든 기업이 반드시 이 기간범위를 써야 한다","선택해서 쓸 수 있고, 다른 기준서가 다르게 정의하면 그 기준서가 우선한다","IFRS S1에도 똑같은 정의가 있다"],"ans":1,"why":"31A는 ‘사용할 수 있다’고 정해 선택을 허용하고, 31B는 다른 기준서의 정의를 우선한다. 이 정의는 KSSB가 비교가능성을 위해 더한 것이다(BC82)."},"summary":["제1호는 거버넌스, 전략, 위험관리, 지표 및 목표의 네 핵심요소로 공시를 짠다.","거버넌스는 감독기구와 경영진의 역할, 역량, 보고 빈도, 보상 연계를 보여 준다.","KSSB는 단기 1년 이내·중기 5년 이내·장기 5년 초과의 기간범위를 선택해 쓸 수 있게 했고(31A), 다른 기준서의 정의가 있으면 그것이 우선한다(31B)."]},{"id":"k1-6","title":"핵심요소 ② 재무적 영향과 회복력","range":"문단 34~42","pages":[15,18],"min":16,"intro":"이 회차는 위험과 기회가 회사의 돈에 어떤 영향을 주었고 앞으로 줄지, 그리고 불확실한 상황을 견딜 힘(회복력)이 있는지를 공시하는 부분을 읽는다. 숫자를 내기 어려울 때 무엇을 해야 하는지도 함께 본다.","blocks":[{"no":"34","label":"현재 재무적 영향과 예상 재무적 영향","pdfPage":15,"prose":["문단 34는 재무적 영향을 두 가지로 나눈다. 현재 재무적 영향은 이번 보고기간의 재무상태, 재무성과, 현금흐름에 이미 미친 영향이다. 예상 재무적 영향은 단기·중기·장기에 걸쳐 미칠 것으로 예상되는 영향으로, 위험과 기회가 회사의 재무계획에 어떻게 반영되는지를 고려해 쓴다. 지난 일과 앞으로의 일을 나누어 보여 주라는 뜻이다.","재무상태는 자산과 부채의 모습, 재무성과는 수익과 비용, 현금흐름은 실제 돈의 흐름이다. BC83에 따르면 이 요구는 지속가능성 위험·기회와 재무제표 숫자 사이의 연결을 보여 주어 재무제표 정보를 보완하려는 것이다. BC84는 경우에 따라 재무제표 주석의 정보로 이 요구를 채우고 상호참조할 수 있다고 설명한다. 같은 숫자를 두 번 쓸 필요는 없다는 뜻이다."],"req":"위험·기회가 이번 기간 재무상태·성과·현금흐름에 미친 영향과 단기·중기·장기의 예상 영향을 공시한다.","terms":[{"t":"현재 재무적 영향","d":"위험과 기회가 이번 보고기간의 재무상태, 재무성과, 현금흐름에 이미 준 영향이다.","en":"current financial effects"},{"t":"예상 재무적 영향","d":"위험과 기회가 앞으로 단기·중기·장기에 재무상태, 재무성과, 현금흐름에 줄 것으로 예상되는 영향이다.","en":"anticipated financial effects"}]},{"no":"35","label":"무엇을 써야 하나","pdfPage":16,"prose":["문단 35는 양적·질적 정보로 네 가지를 쓰라고 한다. 이번 기간에 어떤 영향을 미쳤는지, 그중 다음 회계연도에 자산과 부채의 장부금액(재무제표에 적힌 금액)을 크게 조정하게 할 유의적인 위험이 있는 것은 무엇인지, 그리고 전략을 감안할 때 재무상태와 재무성과·현금흐름이 단기·중기·장기에 어떻게 변할 것으로 예상하는지다. 앞의 두 가지는 지금의 숫자이고, 뒤의 두 가지는 앞으로의 숫자다.","문단 35⑶에 따라 재무상태 변화를 쓸 때는 설비투자, 인수와 매각, 사업전환, 퇴역자산 같은 투자·처분 계획과 전략을 이행하기 위한 자금조달 원천을 고려한다. 계약으로 약정되지 않은 계획도 포함된다는 점이 중요하다. 문단 36은 양적 정보를 단일값이나 범위로 공시할 수 있다고 한다. BC71은 어떤 경우에는 단일 추정값보다 가능한 결과의 범위가 더 유용할 수 있다고 설명한다."],"req":"이번 기간 영향, 다음 연도 장부금액 조정 위험, 재무상태·성과·현금흐름의 예상 변화를 양적·질적으로 공시한다.","ex":{"k":"기아 보고서에서는","t":"기아는 태풍으로 인한 유형자산 물리적 손상 및 복구·교체 비용이 단·중기간(5년) 내 536억 원 발생할 수 있고, 재고자산 피해는 장기적(5년 초과)으로 최대 1,834억 원의 누적 재무영향이 발생할 수 있다고 추정했다.","co":"kia","page":28}},{"no":"37","label":"가진 정보와 역량에 맞게","pdfPage":16,"prose":["문단 37은 예상 재무적 영향을 작성할 때 두 가지 원칙을 정한다. 보고일에 과도한 원가나 노력 없이 이용할 수 있는 합리적이고 뒷받침될 수 있는 모든 정보를 쓰고, 회사가 이용할 수 있는 기량·역량·자원 수준에 맞는 접근법을 쓰는 것이다. 작은 회사가 대기업 수준의 정교한 모델을 만들 필요는 없다는 뜻이다. 회사 규모에 맞는 방법이면 된다.","그렇다고 마음대로 줄일 수 있는 것은 아니다. BC86에 따르면 KSSB는 회사가 지금 기량이나 역량이 없더라도 그것을 확보하거나 개발할 자원이 있다면 양적 정보를 제공하기를 기대한다. 또 BC85는 근거 없는 정보로 영향을 부풀리거나 줄이는 것은 금지되고, 보고일 이후에야 알 수 있는 정보까지 쓸 필요는 없다고 정리한다. 정보 조사는 드는 원가와 노력에 비례하면 된다."],"req":"보고일에 무리 없이 구할 수 있는 근거 있는 정보를 모두 쓰고, 회사 역량에 맞는 방법으로 예상 재무적 영향을 작성한다."},{"no":"38","label":"숫자를 내지 못할 때","pdfPage":17,"prose":["문단 38은 현재 또는 예상 재무적 영향의 양적 정보를 내지 않아도 되는 경우를 정한다. 영향을 별도로 식별할 수 없거나, 측정불확실성이 너무 높아 산출된 숫자가 유용하지 않은 경우다. 문단 39는 예상 재무적 영향에 한해, 양적 정보를 낼 기량·역량·자원이 없는 경우를 더한다. 이 판단기준은 ISSB의 논의와 접근 방식을 그대로 따른 것이다.","하지만 숫자를 안 낸다고 끝나지 않는다. 문단 40에 따라 왜 양적 정보를 내지 않았는지 설명하고, 영향을 받았거나 받을 수 있는 재무제표의 계정과목, 총계, 소계를 짚는 질적 정보를 제공한다. 또 그 위험이나 기회를 다른 요인과 합친 영향의 양적 정보는 유용하지 않다고 판단하지 않는 한 제공한다. BC90은 숫자가 없을 때도 재무제표의 어디를 봐야 하는지 알려 주려는 것이라고 설명한다."],"req":"양적 정보를 생략하면 이유를 설명하고, 영향받는 재무제표 항목을 밝히는 질적 정보와 결합된 영향의 양적 정보를 제공한다.","quote":"또한 기업이 양적 정보를 제공하기 위한 기량, 역량 및 자원을 갖추고 있지 않은 경우, 지속가능성 관련 위험 또는 기회의 예상 재무적 영향에 대한 양적 정보를 제공할 필요가 없다.","ex":{"k":"기아 보고서에서는","t":"기아는 전환 위험·기회에 대해 직접 운영비용 증가, 매출 증가 같은 재무 영향 항목과 대응 방안을 표로 제시하면서, 각 위험 및 기회가 미칠 수 있는 정량적 재무 영향은 향후 분석할 예정이라고 밝혔다. KSSB 공시에서 이런 경우라면 문단 40에 따른 이유 설명과 관련 계정 식별이 필요하다.","co":"kia","page":30},"qno":"39"},{"no":"41","label":"회복력","pdfPage":18,"prose":["문단 41은 지속가능성 위험에서 생기는 불확실성에 대응하는 회사의 능력, 즉 전략과 사업모형의 회복력을 공시하라고 한다. 질적 평가는 항상, 양적 평가는 적용가능한 경우에 공시하며, 평가를 어떻게 했고 어떤 기간범위를 대상으로 했는지도 밝힌다. 양적 정보는 단일값이나 범위로 쓸 수 있다. 위험이 현실이 되었을 때 회사가 버틸 수 있는지를 보여 주는 부분이다.","문단 42는 시나리오 분석이 필요한지 등 구체적 방법은 다른 기준서가 정할 수 있다고 한다. 기후의 경우 제2호가 기후 관련 시나리오 분석을 요구한다. BC91은 회복력 공시와 재무적 영향 공시가 서로 다른 정보 수요를 위한 별개의 요구라고 설명한다. 재무적 영향을 구하려고 반드시 회복력 평가를 할 필요는 없지만, 평가를 했다면 그 결과를 재무적 영향 판단에 활용할 수 있다."],"req":"전략·사업모형의 회복력에 대한 질적 평가와 가능한 경우 양적 평가, 그 수행 방법과 기간범위를 공시한다.","ex":{"k":"기아 보고서에서는","t":"기아는 IPCC, IEA, NGFS의 기후변화 시나리오로 단기·중기·장기에 발생할 수 있는 물리적·전환 위험과 재무 영향을 도출한 뒤, 위험을 완화할 대응 전략과 그 완화 수준을 판단해 전략적 대응 역량과 회복력을 파악했다고 밝혔다.","co":"kia","page":26},"terms":[{"t":"회복력","d":"위험에서 생기는 불확실성에 대처하고 견디며 적응하는 회사 전략과 사업모형의 힘이다.","en":"resilience"}]}],"write":{"q":"예상 재무적 영향의 양적 정보를 내지 않기로 했다면 회사는 무엇을 해야 하나?","must":[["이유","사유"],["질적","서술"],["계정과목","재무제표 항목","총계"]],"bonus":[["결합","합친"]],"wrong":["아무것도 하지 않","공시에서 뺀다"],"model":"양적 정보를 제공하지 않은 이유를 설명하고, 영향을 받는 재무제표의 계정과목을 밝히는 질적 정보를 제공한다.","src":"문단 40"},"check":{"q":"다음 중 문단 38~39에 따라 양적 정보를 생략할 수 있는 경우가 아닌 것은?","options":["영향을 별도로 식별할 수 없는 경우","측정불확실성이 너무 높아 숫자가 유용하지 않은 경우","숫자가 회사에 불리하게 보일 경우"],"ans":2,"why":"생략 사유는 별도 식별 불가, 지나친 측정불확실성, 예상 영향에 한한 기량·역량·자원 부족뿐이다. 불리하게 보인다는 것은 사유가 아니다."},"summary":["재무적 영향은 이번 기간에 이미 준 현재 영향과 단기·중기·장기의 예상 영향으로 나누어 공시한다.","예상 영향은 보고일에 무리 없이 구할 수 있는 근거 있는 정보와 회사 역량에 맞는 방법으로 작성한다.","양적 정보를 생략하면 이유와 질적 정보를 공시해야 하며, 회복력은 재무적 영향과 별개로 공시한다."]},{"id":"k1-7","title":"핵심요소 ③ 위험관리, 지표 및 목표","range":"문단 43~53","pages":[18,21],"min":16,"intro":"이 회차는 위험과 기회를 찾고 관리하는 과정(위험관리)과, 그 성과를 숫자로 보여 주는 지표 및 목표를 읽는다. 산업별 지표를 공시할지 회사가 고를 수 있게 한 KSSB의 차이(문단 48)를 꼭 확인한다.","blocks":[{"no":"44","label":"위험관리 프로세스","pdfPage":18,"prose":["문단 43~44는 회사가 위험과 기회를 식별, 평가, 우선순위 설정, 모니터링하는 과정을 공시하라고 한다. 문단 44⑴에 따라 위험에 대해서는 더 자세히 쓴다. 어떤 데이터 원천과 사업 범위를 투입하는지, 시나리오 분석을 쓰는지, 성격·발생가능성·영향 크기를 어떻게 평가하는지, 다른 위험보다 우선시하는지, 어떻게 모니터링하는지, 직전 기간보다 과정이 바뀌었는지를 밝힌다.","기회는 문단 44⑵에 따라 그 과정을 공시하면 된다. BC95에 따르면 위험 쪽 요구가 더 자세한 것은 위험관리 실무가 더 성숙했고 투자자가 위험 과정을 알아야 할 필요가 크기 때문이다. 마지막으로 문단 44⑶에 따라 이 과정이 회사의 전반적인 위험관리 프로세스에 얼마나, 어떻게 통합되어 작동하는지 공시한다. 별도로 운영한다면 그 사실도 공시 대상이다."],"req":"위험·기회의 식별·평가·우선순위 설정·모니터링 과정과 정책, 변경 여부, 전반적 위험관리와의 통합을 공시한다.","ex":{"k":"현대차 보고서에서는","t":"현대차는 중대성 평가 프로세스가 이전 보고 기간 대비 중대하게 변경된 것이 없다고 밝히고, 평가 결과를 이사회 산하 지속가능경영위원회에 보고하며 선정된 중대 주제를 전사 리스크 관리 프로세스(ERM)에 반영해 운영한다고 적었다. 문단 44⑴㈓의 변경 여부와 44⑶의 통합에 해당하는 문장이다.","co":"hyundai","page":16},"terms":[{"t":"전사적 위험관리(ERM)","d":"회사 전체의 위험을 한 체계에서 찾고 평가하고 관리하는 방식이다.","en":"enterprise risk management"}]},{"no":"46","label":"어떤 지표를 공시하나","pdfPage":20,"prose":["문단 45~46은 지표 및 목표 공시의 목적과 범위를 정한다. 회사는 각 위험과 기회에 대해 두 종류의 지표를 공시한다. 하나는 적용되는 기준서가 요구하는 지표로, BC96이 밝히듯 회사가 평소에 쓰지 않더라도 공시한다. 다른 하나는 회사가 위험과 기회, 그리고 그와 관련된 성과를 측정하고 모니터링하는 데 실제로 쓰는 지표다.","두 번째 종류가 중요하다. 회사가 내부 경영회의에서 보는 지표가 있다면 기준서가 요구하지 않아도 공시 대상이 될 수 있다는 뜻이다. 투자자 입장에서는 경영진이 실제로 무엇을 보며 관리하는지가 가장 궁금한 정보이기 때문이다. 문단 47에 따라 구체적 기준서가 없는 위험이나 기회라면 문단 57~58의 지침의 원천을 적용해 적절한 지표를 찾는다."],"req":"기준서가 요구하는 지표와 회사가 실제로 측정·모니터링에 쓰는 지표를 위험·기회별로 공시한다."},{"no":"48","label":"산업별 지표는 공시 여부를 선택","pdfPage":20,"prose":["문단 48은 공시하는 지표에 회사가 속한 산업의 특징을 반영하는 사업모형, 활동, 공통 특성과 관련된 지표가 ‘포함될 수 있다’고 정한다. BC143의 비교표에 따르면 IFRS S1은 이런 지표가 포함되어야 한다고 정하지만, KSSB는 공시 여부를 기업이 선택하게 했다. 한 단어 차이지만 의무와 선택을 가르는 중요한 차이다.","KSSB는 공개초안 때부터 국제 동향과 기업의 수용가능성을 고려해 산업별 지표 공시를 선택으로 제안했다. BC8⑸에 따르면 대부분의 작성자는 동의했지만 일부 투자자, 학계, 시민단체는 산업 내 기업 간 비교가능성을 높이려면 반드시 공시하게 해야 한다고 했다. 산업별 지침의 대표인 SASB 기준을 반드시 고려하게 하지 않은 결정과 같은 흐름이며, 이는 다음 회차에서 본다.","선택이라고 해서 무시해도 된다는 뜻은 아니다. B24는 특정 정보를 투자자가 면밀히 살펴본다면 그 정보가 중요하다고 판단될 수 있다고 설명한다. 그래서 동종 업체 비교에 널리 쓰이는 지표라면 중요성 판단 결과 공시가 필요할 수 있다. 공시하지 않기로 했다면 그 판단 과정을 내부 근거로 남겨 두는 것이 안전하다. 선택권은 공시 부담을 덜어 주는 것이지 판단을 생략해도 된다는 뜻이 아니다."],"req":"산업 특성을 반영한 지표는 포함할 수 있으며, 공시 여부는 기업이 선택한다.","quote":"문단 45~46을 적용하는 기업이 공시하는 지표에는 기업이 속한 산업의 특징을 반영하는 사업모형, 활동, 또는 그 외의 공통적인 특성과 연관된 지표가 포함될 수 있다.","terms":[{"t":"산업기반 지표","d":"특정 산업의 사업모형과 활동 특성을 반영해, 같은 산업 회사끼리 비교할 수 있게 만든 지표다.","en":"industry-based metrics"}]},{"no":"50","label":"지표의 출처와 정의를 밝힌다","pdfPage":20,"prose":["문단 49는 기준서 밖에서 가져온 지표라면 그 원천과 지표가 무엇인지 밝히라고 한다. 문단 50은 회사가 직접 개발한 지표라면 더 많은 것을 요구한다. 지표의 정의와 다른 원천을 고쳐 만들었다면 어떻게 다른지, 절대·상대·질적 측정치 중 무엇인지, 제삼자가 검증했는지와 어느 기관인지, 계산 방법과 투입변수, 방법의 한계와 유의적 가정이다.","절대 측정치는 총배출량처럼 양 그 자체, 상대 측정치는 매출액당 배출량처럼 다른 값에 대한 비율, 질적 측정치는 빨강·노랑·초록 신호(RAG) 같은 상태 표시다. 같은 이름의 지표라도 정의가 다르면 비교가 무너지므로, 계산식과 가정을 밝히는 것이 이 문단의 핵심이다. 특히 회사마다 정의가 다른 ‘친환경 매출’ 같은 지표는 무엇을 포함했는지 꼭 적어야 한다."],"req":"기준서 밖 지표는 원천을 밝히고, 자체 개발 지표는 정의·측정 유형·검증 여부·계산 방법과 한계를 공시한다."},{"no":"51","label":"목표와 진척도","pdfPage":21,"prose":["문단 51은 회사가 스스로 정한 목표와 법률·규제로 지켜야 하는 목표를 공시하게 한다. 각 목표마다 쓰는 지표, 구체적 양적·질적 목표, 적용 기간, 진척도를 재는 기준기간, 주요 단계와 중간 목표, 목표 대비 성과와 추세 분석, 목표를 고쳤다면 그 내용과 설명을 밝힌다. BC96에 따르면 기준서가 목표를 세우라고 강제하지는 않지만, 세웠다면 공시해야 한다.","문단 52는 지표의 정의와 산출방식을 시간이 지나도 일관되게 유지하라고 하고, 재정의하거나 바꾸면 B52에 따라 수정된 비교값과 이유를 공시하게 한다. 문단 53은 지표와 목표에 의미 있고 명확하며 정확한 이름과 설명을 붙이라고 한다. 이름만 보고 무엇이 포함되는지 알 수 없다면 이 문단에 어긋날 수 있다. 목표는 숫자, 기간, 기준이 함께 있어야 읽힌다."],"req":"각 목표의 지표, 목표치, 기간, 기준기간, 중간 목표, 성과와 추세, 수정 내용을 공시하고 지표 정의를 일관되게 유지한다.","ex":{"k":"기아 보고서에서는","t":"기아는 2030년 글로벌 총 판매 413만 대 중 EV 100만 대 판매를 목표로 한다고 밝혔다. KSSB 공시에서는 이런 목표에 대해 기준기간, 중간 목표, 지금까지의 성과와 추세를 함께 보여 주어야 한다.","co":"kia","page":31}}],"write":{"q":"제1호 문단 48은 산업 특성을 반영한 지표에 대해 IFRS S1과 어떻게 다른가?","must":[["선택","고를"],["IFRS S1","IFRS"],["포함되어야","반드시","의무"]],"bonus":[["SASB"],["비교가능성","비교"]],"wrong":["KSSB도 반드시","공시할 수 없다"],"model":"KSSB는 산업 특성을 반영한 지표의 공시 여부를 기업이 선택하게 했지만, IFRS S1은 그런 지표가 반드시 포함되어야 한다.","src":"문단 48, BC143"},"check":{"q":"다음 중 문단 51이 목표에 대해 요구하지 않는 것은?","options":["진척도 측정의 기준기간","목표 대비 성과와 추세 분석","모든 목표를 2050년 이전에 달성하겠다는 약속"],"ans":2,"why":"문단 51은 목표에 관한 정보를 공시하게 할 뿐 특정 목표를 세우라고 정하지 않는다(BC96)."},"summary":["위험관리 공시는 위험·기회를 찾고 평가하고 지켜보는 과정과 그 변경, 전반적 위험관리와의 통합을 보여 준다.","지표는 기준서가 요구하는 것과 회사가 실제로 쓰는 것을 공시하며, KSSB에서는 산업별 지표의 공시 여부를 기업이 선택한다.","목표는 기준기간, 중간 목표, 성과와 추세를 함께 공시하고 지표 정의는 일관되게 유지한다."]},{"id":"k1-8","title":"지침의 원천과 공시 위치","range":"문단 54~63 (+부록 C)","pages":[22,50],"min":16,"intro":"구체적인 기준서가 아직 없는 주제는 무엇을 보고 공시할까. 이 회차는 참고할 수 있는 지침의 원천과 공시를 어디에 싣는지(공시의 위치)를 읽는다. SASB 기준을 ‘참고할 수 있다’로 바꾼 KSSB의 선택이 핵심이다.","blocks":[{"no":"55","label":"위험과 기회를 찾을 때 참고할 곳","pdfPage":22,"prose":["문단 54는 위험과 기회를 식별할 때 먼저 지속가능성 공시기준을 적용하라고 한다. 문단 55는 그 밖에 참고할 수 있는 원천으로 SASB 기준의 공시 주제, 물과 생물다양성에 관한 CDSB 프레임워크 적용지침, 투자자 정보수요를 위해 만든 다른 기준제정기구의 최신 발표문, 같은 산업이나 지역 회사들이 식별한 위험과 기회를 든다.","SASB 기준은 산업별로 투자자에게 중요한 지속가능성 주제와 지표를 정리한 기준이다. BC103에 따르면 IFRS S1은 SASB 기준을 참조하고 그 적용가능성을 반드시 고려하게 하지만, KSSB는 ‘참고할 수 있다’로 바꿨다. BC105는 ISSB가 SASB 기준 개정을 진행 중이고 SASB 기준이 포괄적인 국제화를 이루지 못했다는 점을 들어, 국내 적용에 아직 어려움이 있다고 설명한다."],"req":"위험·기회 식별에 공시기준을 적용하고, SASB 공시 주제 등 지침의 원천을 참고할 수 있다.","ex":{"k":"기아 보고서에서는","t":"기아는 기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 있는 기후 관련 위험 및 기회를 식별할 때 ISSB의 ‘IFRS S2 이행에 관한 산업기반 지침’ 가운데 ‘Automobiles’ 주제를 참고했다고 밝혔다.","co":"kia","page":25},"terms":[{"t":"SASB 기준","d":"산업별로 투자자에게 중요한 지속가능성 주제와 지표를 정리한 기준으로, 지금은 ISSB가 관리한다.","en":"SASB Standards"}]},{"no":"57","label":"구체적 기준서가 없을 때의 판단","pdfPage":22,"prose":["문단 56은 특정 위험이나 기회에 맞는 기준서가 있으면 그것을 적용하라고 한다. 문단 57은 그런 기준서가 없을 때 회사가 판단으로 정보를 찾게 하는데, 그 정보는 투자자의 의사결정에 목적적합하고 해당 위험이나 기회를 충실하게 표현해야 한다. 지금은 기후 외 주제에 KSSB 기준서가 없으므로, 기후 외 주제를 공시하는 회사는 이 판단을 하게 된다.","문단 58은 이 판단에 참고할 수 있는 것으로 SASB 공시 주제와 연관된 지표, 그리고 공시기준과 상충하지 않는 범위에서 CDSB 지침, 다른 기준제정기구의 발표문, 같은 산업·지역 회사가 공시한 정보, 부록 C의 원천을 든다. BC102에 따르면 이런 목록은 실무의 보고 방식이 제각각이 되는 것을 줄이고 비교가능성을 높이려는 것이다."],"req":"구체적 기준서가 없으면 목적적합하고 충실한 정보를 판단으로 찾고, 상충하지 않는 범위에서 지침의 원천을 참고한다."},{"no":"C2","label":"GRI와 ESRS는 공시할 정보를 찾을 때만","pdfPage":50,"prose":["부록 C의 문단 C2는 정보를 식별하는 판단을 할 때 GRI 기준과 유럽지속가능성보고기준(ESRS)을 참고할 수 있다고 정한다. 여기서 순서가 중요하다. BC107에 따르면 GRI와 ESRS는 위험과 기회를 ‘찾을 때’가 아니라, 이미 찾은 위험과 기회에 대해 ‘무엇을 공시할지’ 정할 때 참고한다. 위험과 기회를 고르는 단계에서는 쓰지 않는다.","BC108은 두 기준이 투자자보다 넓은 대상자의 정보수요를 위한 기준이라는 점을 그 이유로 든다. 이 기준으로 위험을 고르면 투자자 관심사와 상관없는 주제까지 들어올 수 있다. 문단 C3은 중요한 정보를 불분명하게 해서는 안 되고, 공시기준을 적용하지 않고 C2의 원천만 적용했다면 준수했다고 기재해서는 안 된다고 정한다. BC109는 GRI 보고서를 용도만 바꿔 KSSB 공시로 내는 것이 허용되지 않는다고 못 박는다."],"req":"GRI·ESRS는 이미 식별한 위험·기회에 대해 공시할 정보를 찾을 때만 참고하고, 중요한 정보를 가리지 않게 한다.","quote":"기업이 지속가능성 공시기준의 요구사항을 적용하지 않고 문단 C2에 명시된 지침의 원천을 적용하는 경우, 지속가능성 공시기준을 명시적이고 제한 없이 준수하였다고 기재하여서는 안 된다.","ex":{"k":"현대차 보고서에서는","t":"현대차 보고서는 GRI Standards에 따라 작성하고 TCFD와 SASB의 정보공개 가이드라인을 반영했다고 밝힌다. KSSB 공시로 옮길 때는 GRI 지표를 그대로 가져오기보다, 투자자 관점에서 식별한 위험·기회에 맞는 정보인지 다시 걸러야 한다.","co":"hyundai","page":162},"terms":[{"t":"GRI·ESRS","d":"GRI는 회사가 사람·환경·경제에 미치는 영향을 보고하는 국제 기준이고, ESRS는 유럽연합의 지속가능성 보고 기준이다.","en":"GRI Standards, European Sustainability Reporting Standards"}],"qno":"C3"},{"no":"59","label":"무엇을 참고했는지 밝힌다","pdfPage":23,"prose":["문단 59는 회사가 공시를 작성할 때 적용한 구체적 기준, 발표문, 산업 실무관행 등 지침의 원천을 식별하라고 한다. SASB 공시 주제를 식별할 때 쓴 원천도 포함한다. 또 적용가능한 지표를 정할 때 기준으로 삼은 산업, 예를 들어 SASB 기준의 어떤 산업을 적용했는지도 밝힌다. 여러 사업을 하는 회사라면 여러 산업을 밝혀야 할 수 있다.","어떤 원천을 쓸지 정하는 것 자체가 공시에 큰 영향을 주는 판단이다. 그래서 BC110이 설명하듯 문단 75의 판단 공시와 이어지며, 다른 원천도 검토했지만 적용하지 않았다는 사실을 밝혀야 할 수도 있다. 투자자는 이 정보로 같은 산업의 다른 회사와 공시를 견줄 수 있다. 원천을 밝히지 않으면 같은 이름의 지표라도 비교할 수 없게 된다."],"req":"적용한 지침의 원천과 기준으로 삼은 산업을 식별해 공시한다.","ex":{"k":"기아 보고서에서는","t":"기아는 보고서를 GRI Standards 2021에 부합하게 작성하고, 사업활동과 산업 특성에 부합하는 정보 공개를 위해 SASB 기준의 요구사항을 준수했으며 TCFD 권고안을 반영했다고 밝힌다.","co":"kia","page":2}},{"no":"60","label":"공시의 위치","pdfPage":23,"prose":["문단 60은 지속가능성 공시를 일반목적재무보고서의 일부로 제공하라고 한다. 문단 61은 회사가 따라야 하는 법률이나 규정이 공시 위치를 정하면 그것을 따른다고 한다. 국내에서는 금융위원회 최종안에 따라 의무 대상 기업이 자본시장법상 사업보고서를 통해 공시하게 된다. 지금의 지속가능경영보고서와 공시 위치가 달라지는 셈이다.","문단 62는 규제기관이 요구하는 다른 정보와 같은 곳에 실을 수 있지만, 지속가능성 공시를 명확히 식별할 수 있게 하고 다른 정보에 묻히지 않게 하라고 한다. 문단 63은 다른 보고서에 있는 정보를 상호참조로 포함할 수 있게 한다. B45와 B47에 따르면 참조한 정보는 같은 조건으로 동시에 이용가능해야 하고, 보고서와 그 안의 위치를 정확히 지정해야 한다.","B46에 따르면 상호참조로 포함한 정보도 공시의 일부가 되며, 공시를 승인하는 기구는 그 정보에도 직접 쓴 정보와 같은 책임을 진다. 실무에서 ‘자세한 내용은 지속가능경영보고서 참조’처럼 막연히 쓰면 정확한 부분을 지정하라는 요구를 채우지 못한다. 쪽 번호나 절 제목까지 특정해야 한다. 참조한 보고서가 공시와 같은 조건으로 동시에 공개되지 않으면 상호참조 자체를 쓸 수 없다."],"req":"일반목적재무보고서의 일부로 공시하고, 법령이 정한 위치를 따르며, 상호참조는 조건을 지켜 위치를 정확히 지정한다.","terms":[{"t":"상호참조","d":"공시 안에 내용을 다시 쓰지 않고 다른 보고서의 정확한 위치를 가리켜 그 내용을 포함시키는 방식이다.","en":"cross-reference"}]}],"write":{"q":"제1호에서 SASB 기준은 IFRS S1과 어떻게 다르게 다루어지나?","must":[["참고할 수","참고"],["반드시 고려","고려해야","의무"],["SASB","사스비"]],"bonus":[["IFRS S1"],["국제화","개정"]],"wrong":["SASB를 쓸 수 없다","KSSB도 반드시 고려"],"model":"KSSB는 위험·기회와 공시 요구사항을 식별할 때 SASB 기준을 참고할 수 있게만 했고, IFRS S1은 SASB 기준의 적용가능성을 반드시 고려해야 한다.","src":"문단 55, 58, BC105"},"check":{"q":"GRI 기준을 참고할 수 있는 단계는 언제인가?","options":["위험과 기회를 처음 식별할 때","이미 식별한 위험·기회에 대해 공시할 정보를 찾을 때","준수 문구를 작성할 때"],"ans":1,"why":"C2와 BC107에 따라 GRI와 ESRS는 위험·기회를 식별할 때가 아니라 제공할 정보를 식별할 때 참고한다."},"summary":["위험과 기회를 식별할 때 KSSB는 SASB 기준을 반드시 고려하게 하지 않고 참고할 수 있게 했다.","GRI와 ESRS는 이미 식별한 위험·기회에 대해 공시할 정보를 찾을 때만 참고할 수 있다.","공시는 일반목적재무보고서의 일부로 하되 법령이 정한 위치를 따르고, 적용한 지침의 원천과 산업을 밝힌다."]},{"id":"k1-9","title":"보고시기, 비교정보, 준수 문구","range":"문단 64~74","pages":[24,26],"min":16,"intro":"이 회차는 언제 보고하는지, 승인은 누가 했는지, 작년 숫자를 함께 보여 주는지, 그리고 ‘기준을 준수했다’고 말할 수 있는 조건을 읽는다. 발행승인일과 승인자 공시처럼 KSSB가 새로 넣은 요구도 있다.","blocks":[{"no":"64","label":"재무제표와 동시에, 같은 기간으로","pdfPage":24,"prose":["문단 64는 지속가능성 공시를 관련 재무제표와 동시에 보고하라고 한다. 다만 회사가 따라야 하는 법률이나 규정이 보고 시기를 다르게 정하면 그것을 따른다. 그리고 지속가능성 공시는 재무제표와 같은 보고기간을 다룬다. 보고 시기는 법령에 따라 달라질 수 있어도 다루는 기간은 같아야 한다는 뜻이다. 12월 결산 회사라면 1월부터 12월까지가 그 기간이다.","BC143에 따르면 IFRS S1도 동시 보고가 원칙이지만, 적용 첫해에는 재무제표 발행 뒤 일정 기간 안에 보고하는 것을 허용한다. KSSB는 BC117에서 국내 제도에 따른 온실가스 배출량 인증 시기 같은 국내 특유의 사정도 고려해야 한다며, 보고 시기를 관련 법률이나 규정이 정할 수 있게 했다. 배출량 검증이 끝나는 시점과 사업보고서 시점이 다를 수 있기 때문이다.","문단 65~66은 보고기간이 보통 12개월이지만 52주 기간도 금지하지 않는다고 정한다. 보고기간 종료일을 바꿔 12개월보다 길거나 짧아지면 적용한 기간, 그 이유, 공시된 값이 완전하게 비교가능하지 않다는 사실을 공시한다. 결산일을 바꾼 해의 숫자를 다른 해와 그대로 비교하면 오해가 생기기 때문이다. 이 경우에도 재무제표와 같은 기간을 다룬다는 원칙은 그대로다."],"req":"재무제표와 동시에, 같은 보고기간으로 보고하되 법령이 보고 시기를 정하면 그에 따른다.","ex":{"k":"기아 보고서에서는","t":"기아 보고서는 보고 기간을 2025년 1월 1일부터 12월 31일까지로 밝히고, 발행일은 2026년 6월 30일이다. 보고 기간이 끝나고 6개월 뒤에 나온 셈이다.","co":"kia","page":2}},{"no":"67","label":"발행승인일과 승인자","pdfPage":25,"prose":["문단 67은 지속가능성 공시의 발행승인일과 승인자를 공시하라고 한다. 발행승인일은 지속가능성 공시를 승인할 권한이 있는 자가 발행을 승인한 날이다. BC143의 비교표에 따르면 이는 IFRS S1에는 없는 KSSB의 추가 요구다. 짧은 문단이지만 국내 제도의 특성이 그대로 드러나는 곳이다. 따라서 IFRS S1 기준 공시만 준비해 온 회사도 국내 공시에서는 이 항목을 새로 챙겨야 한다.","이 요구가 생긴 이유는 문단 64의 예외 때문이다. 법령이 보고 시기를 재무제표와 다르게 정하면 승인일과 승인자도 재무제표와 달라질 수 있다. BC118에 따르면 KSSB는 공시가 어느 시점까지의 정보를 담고 있고 누가 승인했는지를 이용자에게 따로 알려야 한다고 보았다. 동시에 발행한다면 보통 재무제표의 승인일, 승인자와 같을 것이다.","실무에서 발행일과 발행승인일은 다를 수 있다. 보고서에 적힌 발간일은 게시 날짜일 뿐이므로, 이사회 등 권한 있는 기구가 승인한 날짜와 승인 주체를 따로 확인해 적어야 한다. 승인일은 뒤에서 볼 보고기간 후 사건(문단 68~69)을 어디까지 반영할지 정하는 기준일도 된다. 승인 절차가 정해져 있지 않다면 누가 승인할지부터 내부에서 정해야 한다."],"req":"지속가능성 공시의 발행승인일과 승인자를 공시한다.","quote":"기업은 지속가능성 관련 재무공시의 발행승인일과 승인자를 공시한다.","terms":[{"t":"발행승인일","d":"공시를 승인할 권한이 있는 사람이나 기구가 발행을 승인한 날로, 공시가 반영하는 정보의 마감 시점이 된다.","en":"date of authorisation for issue"}]},{"no":"69","label":"보고기간 뒤에 알게 된 일","pdfPage":25,"prose":["보고기간이 끝난 뒤 승인 전까지 새로운 정보를 알게 되는 경우가 있다. 문단 68은 보고기간 말에 이미 존재했던 상황에 대한 정보라면 새 정보를 고려해 관련 공시를 갱신하라고 한다. 예를 들어 연말에 이미 생긴 공장 피해의 규모가 새해에 확정되었다면 그 숫자를 고친다. 상황 자체는 보고기간 안에 있었기 때문이다. 새 정보가 상황을 새로 만든 것이 아니라 이미 있던 상황을 확인해 준 것이다.","문단 69는 보고기간 이후에 생긴 거래나 사건이라도, 공시하지 않으면 투자자의 의사결정에 영향을 줄 것으로 합리적으로 예상되면 공시하라고 한다. 이때는 지난 숫자를 고치는 것이 아니라 그 사건을 따로 알린다. 문단 70은 중간 공시의 대상, 주기, 기한을 이 기준서가 정하지 않는다고 밝힌다. B48에 따르면 중간 공시는 새 정보 중심으로 연차 공시보다 간결하게 할 수 있다."],"req":"보고기간 말에 있던 상황은 새 정보로 갱신하고, 이후 생긴 사건도 의사결정에 영향을 주면 공시한다."},{"no":"71","label":"비교정보","pdfPage":26,"prose":["문단 71은 다른 기준서가 달리 정하지 않는 한 당기에 공시한 모든 값에 대해 전기 비교정보를 공시하라고 한다. 문단 72와 BC119에 따르면 지표만이 아니라 재무적 영향 같은 모든 값이 대상이다. 서술적인 정보도 이번 기간 공시를 이해하는 데 유용하다면 비교정보를 공시한다. 투자자는 한 해 숫자보다 변화의 방향에서 더 많은 것을 읽기 때문이다.","B50에 따르면 추정값으로 공시한 지표에 대해 전기 상황을 보여 주는 새 정보를 알게 되면, 수정된 비교값, 전기 보고값과의 차이, 수정 이유를 공시한다. BC121은 재무제표에서는 추정치를 바꿔도 지난 숫자를 고치지 않지만, 지속가능성 지표는 자본에 영향을 주지 않으므로 지난 숫자를 고쳐 추세를 가장 잘 보여 주게 했다고 설명한다. B52에 따라 지표를 재정의하거나 대체해도 수정된 비교값과 이유를 공시한다."],"req":"모든 공시 값의 전기 비교정보를 공시하고, 추정 갱신이나 지표 변경 시 비교값을 수정해 차이와 이유를 밝힌다.","ex":{"k":"기아 보고서에서는","t":"기아는 사회공헌 투입 비용 지표에 ‘산정방식 변경(연결 기준)으로 2023~2024년 데이터 재산정’이라는 주석을 달고 3개년 값을 함께 제시했다. 지표 산정방식을 바꾸면서 지난 값도 새 방식으로 다시 계산해 보여 준 사례다.","co":"kia","page":143}},{"no":"73","label":"준수 문구와 면제","pdfPage":26,"prose":["문단 73은 기준의 요구사항을 모두 지킨 회사만 그 사실을 명시적이고 제한 없이 기재하게 한다. 모든 요구사항을 지키지 않았다면 기준을 준수했다고 써서는 안 된다. BC127에 따르면 제한을 단 준수 문구는 금지된다. 투자자는 이 문구로 회사가 골라서 공시했는지, 모든 요구사항을 적용했는지를 안다. 그래서 문구 하나가 공시 전체의 신뢰를 좌우한다.","문단 74는 두 가지 면제를 써도 준수를 주장할 수 있다고 정한다. 현지 법률이나 규정이 공시를 금지하는 정보, 그리고 상업적으로 민감한 기회 정보다. 각각의 조건은 앞 회차에서 본 B33과 B34~B37에 있다. BC128은 회사가 일부 위험을 관리하지 않거나 목표를 세우지 않았더라도 그 사실을 공시로 설명하면 준수를 주장할 수 있다고 덧붙인다."],"req":"모든 요구사항을 지켰을 때만 명시적이고 제한 없는 준수 문구를 쓴다.","quote":"지속가능성 공시기준의 모든 요구사항을 준수한 경우가 아니라면, 기업은 지속가능성 관련 재무공시가 지속가능성 공시기준을 준수하였다고 기술하지 아니한다.","terms":[{"t":"준수 문구","d":"공시가 지속가능성 공시기준의 모든 요구사항을 지켰다고 밝히는 문장이다.","en":"statement of compliance"}]}],"write":{"q":"KSSB가 IFRS S1에 없이 새로 요구한 발행 관련 공시는 무엇이고 왜 필요한가?","must":[["발행승인일","승인일"],["승인자","승인한 사람","승인 주체"],["보고시기","보고 시기","재무제표와 다르"]],"bonus":[["법령","법률","규정"]],"wrong":["발행일만","필요 없다"],"model":"보고시기를 법령이 재무제표와 다르게 정할 수 있어서, 공시가 언제까지의 정보를 담고 누가 승인했는지 알리도록 발행승인일과 승인자를 공시하게 했다.","src":"문단 67, BC118"},"check":{"q":"요구사항 일부를 지키지 못한 회사의 올바른 준수 문구는?","options":["‘KSSB 기준을 일부 준수하였다’고 쓴다","‘KSSB 기준을 준수하였다’고 쓰지 않는다","‘KSSB 기준을 원칙적으로 준수하였다’고 쓴다"],"ans":1,"why":"문단 73은 모든 요구사항을 준수한 경우에만 준수를 기술하게 하고, BC127은 제한된 준수 문구를 금지한다."},"summary":["지속가능성 공시는 재무제표와 같은 보고기간을 다루고 동시에 보고하되, 법령이 시기를 정하면 그에 따른다.","KSSB는 보고 시기가 재무제표와 달라질 수 있어 발행승인일과 승인자 공시를 추가로 요구한다.","모든 값의 전기 비교정보를 공시하고, 모든 요구사항을 지켰을 때만 제한 없는 준수 문구를 쓴다."]},{"id":"k1-10","title":"판단, 측정불확실성, 오류","range":"문단 75~87","pages":[27,29],"min":15,"intro":"지속가능성 공시에는 판단과 추정이 많이 들어간다. 이 회차는 어떤 판단을 했는지, 숫자가 얼마나 불확실한지, 그리고 지난 공시에서 틀린 것을 발견했을 때 어떻게 고치는지 읽는다.","blocks":[{"no":"75","label":"판단을 드러낸다","pdfPage":27,"prose":["문단 75는 공시를 작성하며 내린 판단 가운데 정보에 가장 유의적인 영향을 준 판단을 이용자가 이해할 수 있게 공시하라고 한다. 값을 추정하는 데 수반된 판단은 측정불확실성을 다루는 문단 78에서 따로 다룬다. BC129에 따르면 이 요구는 K-IFRS 제1001호의 판단 공시 원칙을 지속가능성 공시에 맞게 조정한 것이다.","문단 76은 판단의 예를 든다. 어떤 위험과 기회를 식별할지, 어떤 지침의 원천을 적용할지, 무엇을 중요한 정보로 볼지, 사건이나 상황 변화가 유의적이어서 가치사슬 범위를 다시 평가해야 하는지다. 실무에서는 어떤 주제를 중요하지 않다고 본 이유처럼, 공시에서 빠진 것에 대한 판단도 투자자에게 의미가 크다. 판단을 드러내면 투자자는 다른 회사와 결과가 다른 이유를 이해할 수 있다.","문단 77은 이런 판단 정보 일부를 다른 기준서가 요구할 수 있다고 한다. BC131에 따르면 그럴 때 제1호의 요구는 다른 기준서의 더 구체적인 요구를 보완한다. 다른 기준서에 판단에 관한 구체적 규정이 없다면, 제1호가 유의적인 판단을 공시하게 하는 기본 규칙이 된다. 그래서 어느 주제를 공시하든 이 문단은 늘 적용된다."],"req":"공시 정보에 가장 유의적인 영향을 준 판단을 이용자가 이해할 수 있게 공시한다.","terms":[{"t":"판단","d":"기준을 적용하며 여러 선택지 가운데 회사가 고른 결정으로, 위험·기회 식별이나 중요성 판단 등이 있다.","en":"judgements"}]},{"no":"79","label":"측정불확실성이 큰 값","pdfPage":28,"prose":["문단 78~79는 공시된 값에 영향을 주는 가장 유의적인 불확실성을 이해할 수 있게 하라고 한다. 회사는 측정불확실성이 높은 값을 골라내고, 각 값에 대해 불확실성의 원천과 측정에 쓴 가정, 근삿값, 판단을 공시한다. 원천의 예로는 미래 사건의 결과, 측정 기법, 가치사슬 데이터의 가용성과 품질에 값이 기대고 있다는 점이 있다.","가치사슬 데이터는 특히 불확실하다. 협력사 배출량을 평균 배출계수로 추정했다면 그 사실과 가정이 이 문단의 공시 대상이 될 수 있다. BC133에 따르면 이 요구는 지표에만 한정되지 않고 재무적 영향 같은 다른 값에도 적용된다. BC132는 기후 관련 산불 위험에 처한 자산의 손상 분석처럼 재무적 영향 추정에서도 측정불확실성이 생긴다고 예를 든다."],"req":"측정불확실성이 높은 값을 식별하고, 그 원천과 가정·근삿값·판단을 공시한다.","quote":"기업은 일반목적재무보고서의 이용자가 지속가능성 관련 재무공시에 보고된 값에 영향을 미치는 가장 유의적인 불확실성을 이해할 수 있도록 정보를 공시한다.","ex":{"k":"기아 보고서에서는","t":"기아 보고서의 미래 예측 진술 안내는 일부 지속가능성 관련 지표와 데이터가 측정 방법론, 가정 또는 추정에 기반할 수 있으며 향후 변경될 수 있다고 적고 있다. KSSB 공시에서는 이런 일반 안내를 넘어, 불확실성이 높은 값을 하나씩 짚고 그 원천과 가정을 밝혀야 한다.","co":"kia","page":2},"terms":[{"t":"측정불확실성","d":"값을 직접 잴 수 없어 추정해야 할 때 생기는, 실제 값과 다를 수 있는 정도다.","en":"measurement uncertainty"}],"qno":"78"},{"no":"80","label":"추정은 정상이다","pdfPage":28,"prose":["문단 80은 값을 직접 측정할 수 없어 추정해야 할 때 측정불확실성이 생긴다고 설명한다. 그리고 합리적인 추정값의 사용은 지속가능성 공시 작성에 필수적인 부분이며, 정확하게 기술되고 설명되는 한 정보의 유용성을 해치지 않는다고 말한다. 추정했다는 사실을 숨기는 것이 문제이지, 추정 자체는 문제가 아니라는 뜻이다. 실무에서 추정이 전혀 없는 지속가능성 공시는 거의 없다.","문단 81은 변수와 가정이 많을수록 판단이 더 주관적이고 복잡해져 불확실성도 커진다고 한다. 문단 82는 공시할 수 있는 정보 유형의 예로 가정의 성격, 계산 방법과 가정에 따른 민감도와 그 이유, 예상되는 불확실성 해소와 합리적으로 가능한 결과의 범위, 과거 가정의 변경 설명을 든다. 예를 들어 탄소가격 가정을 바꾸면 비용 추정이 얼마나 변하는지 보여 주는 것이 민감도다."],"req":"추정이 필요하면 합리적으로 추정하고, 가정의 성격·민감도·가능한 결과 범위 등을 설명한다.","quote":"측정불확실성이 높더라도 그러한 추정값이 유용한 정보를 반드시 제공하지 못하는 것은 아니다.","terms":[{"t":"민감도","d":"가정이나 계산 방법이 바뀔 때 결과 값이 얼마나 달라지는지를 나타낸 것이다.","en":"sensitivity"}]},{"no":"84","label":"오류는 지난 숫자를 고쳐서 바로잡는다","pdfPage":29,"prose":["문단 84는 실무적으로 적용할 수 없는 경우가 아니면 공시된 과거 기간의 비교값을 재작성해 중요한 전기오류를 수정하라고 한다. 문단 85에 따르면 전기오류는 과거 공시에서 생긴 누락이나 왜곡표시로, 당시 이용할 수 있었거나 얻어 고려했어야 할 신뢰할 만한 정보를 쓰지 않았거나 잘못 써서 생긴 것이다. 즉 당시에 알 수 있었던 것을 놓친 경우가 오류다.","B56은 오류의 예로 계산 실수, 지표나 목표 정의의 잘못된 적용, 사실의 간과나 해석 오류, 부정행위를 든다. B58에 따르면 중요한 오류를 찾으면 오류의 성격, 각 과거 기간의 수정 내용, 수정할 수 없다면 그 이유와 수정 방법을 공시한다. BC123은 ‘실무적으로 적용할 수 없는’의 기준을 높게 두어, 모든 합리적인 노력을 기울였는데도 적용할 수 없을 때만 해당한다고 설명한다."],"req":"중요한 전기오류는 비교값을 재작성해 수정하고, 오류의 성격과 수정 내용을 공시한다.","terms":[{"t":"전기오류","d":"과거 기간 공시에서 쓸 수 있었던 신뢰할 만한 정보를 쓰지 않거나 잘못 써서 생긴 누락이나 왜곡이다.","en":"prior period errors"}]},{"no":"86","label":"오류와 추정 변경은 다르다","pdfPage":29,"prose":["문단 86은 오류수정과 추정값 변경을 구별한다. 추정값은 원래 근삿값이라 추가 정보가 알려지면 바뀔 수 있다. 당시 쓸 수 있던 정보를 제대로 써서 추정했는데 나중에 더 나은 정보가 나온 것은 오류가 아니다. 반면 당시 이미 있던 정보를 빠뜨렸거나 계산을 틀렸다면 오류다. 둘을 가르는 기준은 당시 정보를 제대로 썼는가이다.","두 경우 모두 지난 숫자를 고칠 수 있지만 따르는 규정과 공시 내용이 다르다. 추정 갱신은 B50에 따라 수정된 비교값, 차이, 이유를 공시하고, 오류는 문단 87과 B55~B59에 따라 오류의 성격과 수정 내용을 공시한다. BC134도 두 요구사항이 구분된다고 설명한다. 예를 들어 배출계수를 더 정확한 최신 자료로 바꾼 것은 추정 갱신에 가깝고, 협력사 데이터를 두 번 더한 것은 오류다."],"req":"오류수정과 추정값 변경을 구별해 각각의 규정에 따라 처리한다."}],"write":{"q":"측정불확실성이 높은 값에 대해 회사가 공시할 것을 한 문장으로 써 보자.","must":[["원천","출처","이유"],["가정","전제"],["근삿값","판단","추정"]],"bonus":[["식별","골라"],["민감도"]],"wrong":["공시하지 않는다","숫자를 빼"],"model":"측정불확실성이 높은 값을 식별하고, 그 불확실성의 원천과 값을 측정할 때 쓴 가정, 근삿값 및 판단을 공시한다.","src":"문단 79"},"check":{"q":"작년 Scope 3를 당시 최선의 정보로 추정했는데, 올해 그 기간의 상황을 보여 주는 더 정확한 협력사 자료를 얻었다. 어떻게 처리하나?","options":["전기오류이므로 문단 84에 따라 재작성한다","추정값 갱신이므로 B50에 따라 수정된 비교값과 차이, 이유를 공시한다","지난 숫자는 고치지 않는다"],"ans":1,"why":"당시 정보를 제대로 쓴 추정은 오류가 아니다(문단 86). 전기 상황에 대한 새 정보가 생기면 B50에 따라 비교값을 수정하고 차이와 이유를 밝힌다."},"summary":["공시 정보에 가장 큰 영향을 준 판단을 공시해 투자자가 숫자 뒤의 선택을 알 수 있게 한다.","측정불확실성이 높은 값은 골라내어 원천과 가정, 근삿값, 판단을 밝히며, 합리적인 추정은 유용성을 해치지 않는다.","중요한 전기오류는 비교값을 재작성해 고치고, 오류수정과 추정값 변경은 구별해 처리한다."]},{"id":"k1-11","title":"시행일과 경과규정","range":"부록 E (+부록 F 자발적 적용)","pages":[59,61],"min":14,"intro":"마지막 회차는 기준서를 언제부터 어떻게 적용하는지 정한 부록 E(시행일과 경과규정)와 부록 F(자발적 적용)를 읽는다. 기후를 먼저 공시하게 한 경과규정에 KSSB가 끝나는 시점을 두지 않은 점이 IFRS S1과 크게 다르다.","blocks":[{"no":"E1","label":"시행일","pdfPage":59,"prose":["문단 E1은 이 기준서를 최초 공표일이 포함되는 회계연도부터 적용한다고 정한다. 다만 법률이나 규정이 이 기준에 따른 공시를 요구해 적용하는 경우에는 그 법률이나 규정이 정한 시행일을 따른다. 또 기업은 법령이 정한 시행일 전에 이 기준서를 자발적으로 적용할 수 있다. 기준서는 일찍 열어 두고, 의무는 법령이 정하는 구조다.","BC136에 따르면 KSSB는 시행일과 의무공시 시작 시기가 별개라는 점에 주목했다. BC135에서 보듯 정보이용자는 빠른 시행을, 일부 작성자는 충분한 준비 시간을 요구했는데, KSSB는 기준은 가능한 빨리 쓸 수 있게 하고 의무 시기는 법령에 맡기는 방식으로 정리했다. 의무 시기는 들어가며 회차에서 본 금융위원회 방안과 자본시장법 개정으로 정해진다."],"req":"최초 공표일이 포함된 회계연도부터 적용하되, 법령이 공시를 요구하면 법령의 시행일을 따른다."},{"no":"E3","label":"첫해에는 비교정보 면제","pdfPage":59,"prose":["문단 E2는 최초 적용일을 기준서를 처음 적용하는 회계연도의 개시일로 정한다. 문단 E3은 최초 적용일 전 기간에 대해서는 공시를 요구하지 않으므로, 처음 적용하는 회계연도에는 비교정보를 공시하지 않아도 된다고 정한다. 예를 들어 2027 회계연도에 처음 적용하면 2026 회계연도 값을 비교정보로 내지 않아도 된다. 첫해 공시에는 그해 숫자만 있어도 된다는 뜻이다.","BC120도 경과규정에 따라 처음 적용하는 회계연도에는 비교정보를 요구하지 않는다고 확인한다. 하지만 둘째 해부터는 문단 71에 따라 첫해 값을 비교정보로 보여 주어야 한다. 첫해 데이터의 정의와 산정 방식을 처음부터 제대로 정해 두지 않으면, 둘째 해에 수정된 비교값과 그 이유를 공시해야 하는 부담으로 돌아온다. 그래서 첫해는 면제의 해가 아니라 기준을 세우는 해로 보는 것이 좋다."],"req":"최초 적용 회계연도에는 비교정보를 공시하지 않아도 된다.","terms":[{"t":"최초 적용일","d":"기준서를 처음 적용하는 회계연도가 시작하는 날이다.","en":"date of initial application"}]},{"no":"E4","label":"기후 먼저, 기후 외는 선택","pdfPage":59,"prose":["문단 E4는 제2호에 따라 기후 관련 위험과 기회에 대한 정보만 공시하는 것을 허용하고, 기후 외 지속가능성 위험과 기회의 공시 여부는 기업이 선택하게 한다. 기후만 공시하면 기후 정보 공시와 관련된 범위에서 제1호 요구사항을 적용할 수 있다. 문단 E5는 기후 정보는 처음 적용하는 해에, 기후 외 정보는 그것을 처음 공시하는 해에 비교정보를 요구하지 않는다고 정한다.","IFRS S1도 비슷한 경과규정이 있지만 처음 적용하는 회계연도에 한해서만 허용한다. BC139에 따르면 KSSB는 기후 외 주제에 쓸 국제적으로 인정된 구체적 기준서가 없고 그 제정 일정도 확정되지 않았다는 이유로 유예기간을 정하지 않았다. 기후 외 사안의 의무 전환은 국제 동향, 투자자 요구, 기업의 준비 상황을 균형 있게 보며 추후 논의하기로 했다.","BC41에 따르면 KSSB가 기후를 먼저 택한 것은 기후 사안이 재무 안정성에 유의적인 영향을 주고, 재무보고에 직접 영향을 주어 정량화가 쉬운 면이 있기 때문이다. 반면 BC42에서 보듯 일부 의견제출자는 중요한 기후 외 정보가 공시되지 않을 수 있다고 우려했다. 실무에서는 기후 외 주제도 중요성 판단은 해 두어야 나중의 의무 전환에 대비할 수 있다."],"req":"기후 관련 정보만 공시할 수 있고, 기후 외 정보의 공시 여부는 기업이 선택한다(유예기간을 정하지 않음).","quote":"이 기준서를 적용할 때, 기업은 지속가능성 공시기준서 제2호에 따라 기후 관련 위험 및 기회에 대한 정보만을 공시하는 것이 허용되며, 기후 외 다른 지속가능성 관련 위험 및 기회에 대한 정보의 공시 여부는 기업이 선택할 수 있다."},{"no":"F1","label":"자발적 적용 기업의 완화 규정","pdfPage":61,"prose":["부록 F는 법령이 요구하기 전에 스스로 기준을 적용하는 기업을 위한 규정으로, BC143의 비교표에 따르면 IFRS S1에는 없다. 문단 F1⑴에 따라 자발적 적용 기업은 지속가능성 공시를 재무제표와 동시에 보고하지 않아도 된다. 다만 법령이 보고 시기를 정했다면 자발적 적용 기업이라도 그 시기를 넘겨 보고할 수 없다. BC141은 이것이 공시를 임의로 지나치게 늦추는 것을 막기 위한 장치라고 설명한다.","문단 F1⑵는 자발적으로 먼저 적용한 기업이 나중에 법령으로 적용을 요구받게 되면, 법령에 따라 처음 적용하는 회계연도의 개시일을 최초 적용일로 본다고 정한다. BC142에 따르면 그래서 일찍 시작한 기업도 의무 전환 때 경과규정을 다시 적용받을 수 있다. 먼저 해 본 기업이 오히려 불리해지지 않게 한 장치다. 자발적 적용 경험을 쌓은 회사도 의무 전환 첫해에 비교정보 면제를 다시 받을 수 있다는 뜻이다.","BC140에 따르면 KSSB는 자발적 적용이 지속가능성 정보의 확산과 실무 관행 정착에 도움이 된다고 보아 이를 막는 요소를 줄이려 했다. 이는 의무 대상이 아닌 상장기업도 KSSB 기준을 적용해 거래소를 통해 자율공시할 수 있게 한 금융위원회 방안과도 이어진다. 의무 대상이 되기 전에 미리 연습해 볼 길이 열려 있는 셈이다."],"req":"자발적 적용 기업은 동시 보고 의무가 완화되고(법정 기한 내), 의무 전환 시 최초 적용일을 다시 정한다.","terms":[{"t":"자발적 적용","d":"법령이 요구하기 전에 기업이 스스로 기준서를 적용해 공시하는 것이다.","en":"voluntary application"}]},{"no":"BC143","label":"IFRS S1과의 차이 한눈에 보기","pdfPage":139,"prose":["BC143은 제1호와 IFRS S1의 차이를 표로 정리한다. KSSB는 IFRS S1을 바탕으로 하되 국내 산업의 특성과 기업의 준비 상황, 역량을 충분히 고려했다고 밝힌다. 그리고 앞으로 작성자의 적용 상황, 투자자 요구, 국제 동향을 보며 국제 정합성을 점진적으로 강화해 나가겠다고 덧붙였다. 아래 표는 BC143의 표에 이 책에서 본 기간범위 정의(BC82)를 더한 것이다.","실무에서 이 표는 해외 공시와 국내 공시를 함께 준비하는 회사에 특히 쓸모 있다. IFRS S1에 따른 공시도 해야 하는 회사라면 SASB 기준 고려, 산업별 지표, 기후 외 주제처럼 KSSB에서는 선택인 항목을 IFRS 쪽에서는 채워야 한다. 반대로 발행승인일과 승인자처럼 KSSB에만 있는 요구는 국내 공시에서 빠뜨리지 않도록 따로 점검한다."],"req":"KSSB 제1호가 IFRS S1과 다른 점을 구분해 안다.","fig":{"cap":"KSSB 제1호와 IFRS S1의 주요 차이(BC143, BC82)","head":["구분","KSSB 제1호","IFRS S1"],"rows":[["공시 주제","기후는 공시, 기후 외는 선택(추후 논의)","적용 첫해만 기후 우선 허용, 이후 모든 주제"],["SASB 기준","참고할 수 있음","적용가능성을 반드시 고려"],["산업별 지표","포함할 수 있음(공시 여부 선택)","포함되어야 함"],["보고시기","재무제표와 동시, 법령이 달리 정하면 따름","재무제표와 동시, 적용 첫해는 발행 후 일정 기간 내 보고 허용"],["발행승인일·승인자","공시","요구 없음"],["자발적 적용 완화","동시 보고 면제(법정 기한 내), 경과규정 재적용","없음"],["기간범위 정의","단기 1년 이내·중기 5년 이내·장기 5년 초과 사용 가능","정의 없음(기업이 정함)"]]}}],"write":{"q":"제1호의 경과규정(E4)은 IFRS S1의 경과규정과 어떻게 다른가?","must":[["기후","기후 관련"],["선택","고를"],["유예기간","기한","끝나는 시점","첫해"]],"bonus":[["IFRS S1"],["추후 논의","나중에"]],"wrong":["모든 주제를 의무","2년 동안만"],"model":"KSSB는 기후 관련 정보만 공시하고 기후 외 정보는 기업이 선택하게 하면서 유예기간을 정하지 않았지만, IFRS S1은 적용 첫해에만 이를 허용한다.","src":"문단 E4, BC139"},"check":{"q":"자발적으로 먼저 KSSB 기준을 적용한 회사가 나중에 의무 대상이 되면 어떻게 되나?","options":["이미 적용했으므로 경과규정을 다시 쓸 수 없다","법령에 따라 처음 적용하는 회계연도 개시일을 최초 적용일로 보아 경과규정을 다시 쓸 수 있다","자발적 적용 첫해를 계속 최초 적용일로 본다"],"ans":1,"why":"문단 F1⑵와 BC142에 따라 의무 적용 첫해의 개시일을 최초 적용일로 보아 경과규정을 다시 적용할 수 있다."},"summary":["기준서는 최초 공표일이 포함된 회계연도부터 쓸 수 있지만, 의무 시기는 법령이 정한다.","처음 적용하는 해에는 비교정보가 면제되고, 기후만 공시하고 기후 외 주제는 선택하는 경과규정에는 끝나는 시점이 없다.","자발적 적용 기업은 동시 보고가 완화되고 의무 전환 때 경과규정을 다시 쓸 수 있으며, 이런 차이는 BC143 표에 정리되어 있다."]},{"id":"k2-1","title":"제2호 목적과 적용범위","range":"문단 1~4 (3A 포함)","pages":[5,6],"min":14,"intro":"제2호가 무엇을 위해 기후 정보를 요구하는지, 어떤 위험과 기회가 대상인지 읽는다. 특히 KSSB에만 있는 문단 3A는 공시할 정보가 없다고 판단한 기업도 그 사실과 근거를 밝히게 한다.","blocks":[{"no":"1","label":"목적: 돈을 대는 사람에게 쓸모 있는 기후 정보","pdfPage":5,"prose":["문단 1은 제2호가 왜 있는지를 한 문장으로 말한다. 기업이 맞닥뜨리는 기후 관련 위험과 기회를 공시하게 해서, 그 정보를 읽는 사람이 기업에 돈을 댈지 판단하는 데 쓰게 하려는 것이다. 이 독자를 '일반목적재무보고서의 주요이용자'라고 부른다. 말은 어렵지만 뜻은 단순하다. 지금 또는 앞으로 주식을 살 투자자, 돈을 빌려주는 은행, 채권을 가진 채권자가 주요이용자다.","일반목적재무보고서는 한 사람이 아니라 여러 투자자와 채권자가 함께 보도록 만든 보고서다. 재무제표가 대표적이고, 제2호에 따른 기후 공시도 여기에 들어간다. 그래서 제2호의 기후 공시는 지역 주민이나 환경 단체를 첫 독자로 두는 홍보용 보고서와 출발점이 다르다. '이 기후 문제가 회사의 돈에 어떤 영향을 주는가'를 투자자의 눈으로 보여 주는 것이 핵심이다.","실무에서 이 차이는 문장 하나하나에 드러난다. '나무를 몇 그루 심었다'보다 '태풍으로 공장이 멈추면 매출이 얼마 줄 수 있다'가 제2호의 목적에 더 가깝다. 보고서 초안을 검토할 때 '이 문장이 투자자의 판단에 쓸모가 있는가'를 먼저 물어보면 방향을 잡기 쉽다. 사회공헌 활동이 의미 없다는 뜻은 아니다. 그 활동이 회사의 위험이나 기회와 어떻게 이어지는지를 함께 보여 줄 때 제2호의 공시가 된다."],"req":"투자자·대여자·채권자가 자원 제공을 판단하는 데 유용한 기후 관련 위험·기회 정보를 공시하게 한다.","quote":"이 기준서 전반에서 ‘주요이용자’와 ‘이용자’라는 용어는 같은 의미를 가지며 상호 교환적으로 사용된다.","terms":[{"t":"일반목적재무보고서","d":"주요이용자가 기업에 자원을 제공할지 판단할 때 쓰는 보고서로, 재무제표와 지속가능성 관련 재무공시를 포함한다.","en":"general purpose financial reports"},{"t":"주요이용자","d":"현재 및 잠재적 투자자, 대여자와 그 밖의 채권자다.","en":"primary users"}]},{"no":"2","label":"기업 전망에 영향을 줄 것으로 합리적으로 예상되는 위험과 기회","pdfPage":5,"prose":["문단 2는 대상을 좁힌다. 모든 기후 이야기가 아니라 단기·중기·장기에 걸쳐 기업의 현금흐름, 자금조달 접근성, 자본비용에 영향을 줄 것으로 합리적으로 예상할 수 있는 위험과 기회만 다룬다. 현금흐름은 실제로 들고 나는 돈, 자금조달 접근성은 필요할 때 돈을 빌리거나 투자받을 수 있는 정도, 자본비용은 그 돈을 구하는 데 치르는 이자나 기대수익률이다. 세 가지 모두 투자자가 회사의 가치를 매길 때 직접 쓰는 요소다.","기준서는 이 긴 조건을 묶어 '기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 있는 기후 관련 위험 및 기회'라고 부른다. 제2호 곳곳에 반복되므로 '회사의 돈 사정에 실제로 닿을 만한 기후 위험·기회'라고 기억하면 된다. 문단 4는 반대로, 그렇게 예상할 수 없는 위험과 기회는 적용범위에서 빠진다고 정리한다. 그래서 실무자는 기후와 관련된 모든 것을 나열하기보다 회사 돈에 닿는 경로가 있는지부터 따진다."],"req":"현금흐름·자금조달 접근성·자본비용에 영향을 줄 것으로 합리적으로 예상되는 기후 위험·기회만 대상이며, 그렇지 않은 것은 제외된다(문단 4).","quote":"기업 전망에 영향을 미칠 것으로 합리적으로 예상할 수 없는 기후 관련 위험 및 기회는 이 기준서의 적용범위에서 제외된다.","terms":[{"t":"자본비용","d":"기업이 돈을 조달할 때 치르는 대가로, 이자나 투자자가 기대하는 수익률이다.","en":"cost of capital"},{"t":"자금조달 접근성","d":"필요할 때 대출이나 투자를 받을 수 있는 정도다.","en":"access to finance"}],"qno":"4"},{"no":"3","label":"적용범위: 물리적 위험, 전환 위험, 기회","pdfPage":5,"prose":["문단 3은 제2호가 다루는 세 가지를 나열한다. 기업이 노출된 물리적 위험과 전환 위험, 그리고 기업이 이용할 수 있는 기회다. 부록 A를 쉽게 풀면 물리적 위험은 기후변화 자체가 부딪혀 오는 위험이다. 태풍·홍수처럼 갑자기 닥치는 급성 위험과, 해수면 상승이나 강수 패턴 변화처럼 천천히 쌓이는 만성 위험으로 나뉜다. 급성인지 만성인지에 따라 대비하는 방법과 시간이 달라서 둘을 구분해 둔다.","전환 위험은 세상이 저탄소 경제로 바뀌는 과정에서 생기는 위험으로, 정책·법률·기술·시장·평판 위험을 포함한다. 새 규제로 운영비가 늘거나 소비자 취향이 바뀌는 경우가 여기에 든다. 기회는 기후변화를 완화하고 적응하려는 노력에서 기업에 생기는 긍정적 영향이다. 기아 보고서는 태풍·폭우를 급성 물리적 위험으로, 배출권거래제 강화와 연비 규제 강화를 전환 위험으로, 전동화 차량 수요 증가를 기회로 나누어 한 표에 정리했다."],"req":"제2호는 기업이 노출된 물리적 위험·전환 위험과 기업이 이용할 수 있는 기후 관련 기회에 적용된다.","fig":{"cap":"세 가지 대상 한눈에 보기(부록 A를 쉽게)","head":["구분","뜻","예"
