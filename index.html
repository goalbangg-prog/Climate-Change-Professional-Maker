const BANK=[{"id":"ifrs-j4","type":"judge","q":"CO2 환산 때 보고일 기준 최신 IPCC 평가보고서의 100년 지구온난화지수(GWP)를 썼는가?","ref":"적용지침 (GWP 환산)","why":"최신은 6차 보고서다. 5차 값도 함께 썼다면 어느 범위(예: 국내 배출권거래제 대상분)에 5차를 썼는지 밝혀야 하는데 그 설명이 없다.","trap":"'6차가 들어 있으니 됐다'로 넘기기 쉽다. 2025년 12월 개정(2027년부터 적용)으로 법령이 요구하는 GWP 값을 쓸 수 있는 경감이 새로 생겼다. 그래도 어느 범위에 어떤 값을 썼는지는 측정 방법·가정 설명(문단 29(a)(iii))으로 드러나야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"IPCC(Intergovernmental Panel on Climate Change) 제5차 및 제6차 평가보고서에서 제시한 100년 기준 지구온난화지수(GWP, Global Warming Potential)를 적용하여 이산화탄소 환산량(tCO₂-eq)으로 변환하여 수치 값을 산정하였습니다.","page":38,"co":"hyundai","look":"38쪽 '배출량 측정을 위한 접근법' 끝부분","src":{"label":"ISSB, IFRS S2 개정 발표 (2025.12)","url":"https://www.ifrs.org/news-and-events/news/2025/12/issb-issues-targeted-amendments-ifrs-s2/"}},{"id":"ifrs-j6","type":"judge","q":"Scope 1·2 배출량을 '연결 실체'와 '그 밖의 투자기업(관계기업·공동기업 등)'으로 나눠 공시하는가?","ref":"문단 29(a)(iv)","why":"같은 쪽에 경계 설명이 두 번 나온다. '연결기준' 문장대로라면 Scope 1·2는 모두 연결 실체 몫이고, 그 밖의 투자기업은 Category 15(투자)로 갔다고 읽을 수 있다. 그래서 '일부'로 본다. 하지만 운영통제 문장과 어떻게 맞물리는지 정리돼 있지 않고, 두 집단으로 나눈 숫자나 '그 밖의 투자기업 몫은 0'이라는 명시도 없다.","trap":"'숫자를 요구하는데 숫자가 없으니 없음'으로 볼 수도 있다. 경계 설명이 답을 간접적으로 주는지, 아닌지가 판단의 갈림길이다. 또 157~160쪽의 국내·해외 구분은 지역 구분이지 이 요구사항(연결 실체 대 그 밖의 투자기업)이 아니다. 둘을 헷갈리기 쉽다.","options":["있음","일부","없음"],"ans":1,"quote":"조직 경계 설정에 있어서는 통제력 기준(Control Approach) 중 운영통제력(Operational Control)을 사용하여, 회사가 운영을 통제하는 사업장과 활동에서 발생하는 온실가스 배출을 산정 범위에 포함하였습니다. / … 온실가스 관리의 정합성과 국제 기준 부합성을 제고하기 위해 조직경계를 연결기준으로 설정하였습니다.","page":38,"co":"hyundai","look":"38쪽 '배출량 측정을 위한 접근법'과 '배출량 차이에 대한 분석'"},{"id":"ifrs-j8","type":"judge","q":"Scope 3에 어떤 카테고리를 넣고 뺐는지, 뺀 이유를 밝히는가?","ref":"문단 29(a)(vi)","why":"15개 중 13개를 산정했고, 빠진 Category 8(Scope 1·2와 중복)과 Category 9(데이터 한계)의 이유를 각각 밝혔다.","trap":"사유를 밝히라는 요구는 충족했지만, Category 9를 2025년부터 빼서 전년(56.8만 t)과 범위가 달라진 건 별도의 비교 가능성 문제다. '있음'과 '문제없음'은 다른 말이다.","options":["있음","일부","없음"],"ans":0,"quote":"지역별 시장 구조의 차이와 데이터 가용성 및 신뢰성의 한계로 인해, 2025년부터 본 카테고리에 대한 배출량은 산정하지 않습니다. (Category 9)","page":40,"co":"hyundai","look":"38쪽 표, 40쪽 Category 8·9 설명"},{"id":"ifrs-j11","type":"judge","q":"당기 경영진 보상 중 기후와 연계된 비율(%)을 공시하는가? (문단 29(g)의 두 번째 요구)","ref":"문단 29(g)(ii)","why":"문단 29(g)는 두 가지를 요구한다. (i) 기후 고려사항이 경영진 보상에 반영되는지, 어떻게 반영되는지 설명하고, (ii) 그 비율(%)을 밝히라는 것. 23쪽은 연계 구조와 KPI(탄소중립 이행률, RE100 달성률 등)를 자세히 적어 (i)은 충족하지만, (ii)의 비율은 '연봉의 일정 비율'이라고만 해서 숫자가 없다.","trap":"질문이 (ii) 비율만 물었으니 답은 '없음'이다. 문단 29(g) 전체로 판정한다면 (i)은 있고 (ii)가 없으니 '일부'가 된다. 판정할 때는 요구사항을 하위 항목까지 쪼개서, 어느 조각이 있고 어느 조각이 없는지 먼저 나눠 보자.","options":["있음","일부","없음"],"ans":2,"quote":"매년 주요 지표에 대한 달성률 및 이행평가를 통하여 연봉의 일정 비율을 해당 성과에 대한 금전적 인센티브로 제공하고 있습니다.","page":23,"co":"hyundai","look":"23쪽 '보상'과 '기후변화 성과 연계 보상' 표"},{"id":"ifrs-j12","type":"judge","q":"목표의 지표, 목적, 적용 범위, 기간, 기준연도를 밝히는가?","ref":"문단 33","why":"지표(배출량), 목적(1.5℃ 감축), 범위(Scope 1+2, Category 11), 기간(2030·2035), 기준연도(2024)가 모두 있다.","trap":"'약 42%'의 '약'을 놓치지 말 것. 승인받은 목표값이 정확히 몇 %인지는 SBTi 공개 목록에서 확인할 수 있다.","options":["있음","일부","없음"],"ans":0,"quote":"사업장 운영 과정에서 발생하는 Scope 1+2 배출량은 기준연도인 2024년 대비 2030년까지 약 42% 감축하는 것을 목표로 설정하였습니다. / Scope 3 – Category 11은 기준연도인 2024년 대비 2035년까지 63% 감축하는 것을 목표로 SBTi의 승인을 받았습니다.","page":40,"co":"hyundai","look":"40쪽 '탄소중립 목표'"},{"id":"ifrs-j14","type":"judge","q":"목표 대비 성과와 추세를 분석해 보여주는가?","ref":"문단 35","why":"두 해의 숫자와 목표는 있지만, '목표까지 얼마나 왔는지', '경로보다 빠른지 느린지'를 설명한 문장은 없다. 읽는 사람이 직접 계산해야 한다.","trap":"숫자 표가 있다고 성과 분석이 있는 건 아니다. 계산 연습 4번과 6번에서 직접 진척률을 구해 보자.","options":["있음","일부","없음"],"ans":1,"quote":"Scope 1+2 합계 2,198,406 → 1,911,084 (38쪽 표) / 기준연도인 2024년 대비 2030년까지 약 42% 감축하는 것을 목표 (40쪽)","page":38,"co":"hyundai","look":"38쪽 표, 40쪽 목표"},{"id":"ifrs-j15","type":"judge","q":"목표가 총량(gross) 기준인지, 상쇄를 뺀 순량(net) 기준인지 밝히는가?","ref":"문단 36(c)","why":"2030·2035 감축 목표는 SBTi 성격상 총량 감축이지만, 그렇다고 쓴 문장이 없다. 2045 탄소중립은 상쇄를 포함하는 순량 개념인데 그 구분도 없다. 순량 목표가 있으면 짝이 되는 총량 목표도 따로 밝혀야 한다.","trap":"'SBTi니까 당연히 총량'이라고 넘기기 쉽다. 공시는 '당연함'이 아니라 '적혀 있음'을 본다.","options":["있음","일부","없음"],"ans":1,"quote":"목표연도인 2045년 잔여 탄소 배출을 처리하기 위해 탄소 포집과 활용 기술인 CCUS(…)에 투자하고, 폐배터리를 에너지저장장치로 재활용하거나 해양 생태계를 복원하는 등의 탄소 상쇄 활동을 지속적으로 추진할 것입니다.","page":40,"co":"hyundai","look":"40쪽 '탄소중립 목표' 마지막 문단"},{"id":"ifrs-j16","type":"judge","q":"목표 달성에 탄소 크레딧을 얼마나, 어떤 종류로 쓸 계획인지 밝히는가?","ref":"문단 36(e)","why":"상쇄 활동은 설명했지만, 크레딧에 얼마나 기댈지, 어떤 인증 체계인지, 흡수·제거형인지 감축형인지가 없다.","trap":"상쇄 '활동'을 하는 것과 목표 달성에 크레딧을 '쓸 계획'을 밝히는 것은 다르다.","options":["있음","일부","없음"],"ans":1,"quote":"해조류 기반 블루카본을 중심으로 바다숲 조성사업에 참여하여 해양 생태계 복원과 탄소흡수 기능을 동시에 확보하고 있으며, 유관 기관과의 협력을 통해 블루카본 확산 및 제도화를 지원하겠습니다.","page":41,"co":"hyundai","look":"41쪽 '탄소 상쇄 및 제거'"},{"id":"kssb-01","type":"mc","q":"금융위원회 최종안(2026년 7월 8일)에 따르면, 기후 공시를 가장 먼저 의무로 해야 하는 회사와 시기는 무엇인가?","ref":"금융위 최종안(2026.7.8) · 공시 대상","why":"최종안은 코스피 상장사 중 연결 자산총액 10조원 이상 회사부터 2027회계연도 정보를 2028년에 공시하게 한다. 이후 2029년 5조원 이상으로 넓히고, 2030년 2조원 이상 확대를 검토한다.","trap":"2월 초안의 '30조원 이상'을 그대로 외우는 실수가 많다. 7월 최종안에서 10조원으로 낮아져 첫해 대상(종속회사 포함 약 291개사)이 크게 늘었다.","options":["코스피 상장사 중 연결 자산총액 30조원 이상, 2026회계연도분부터","코스피 상장사 중 연결 자산총액 10조원 이상, 2027회계연도분(2028년 공시)부터","모든 상장사, 2028회계연도분부터","코스닥 포함 연결 자산총액 2조원 이상, 2027회계연도분부터"],"ans":1,"src":{"label":"금융위원회 보도자료 '지속가능성(ESG) 공시 제도화 방안' 최종안 (2026.7.8)","url":"https://www.fsc.go.kr/po010101/87280"}},{"id":"kssb-02","type":"mc","q":"최종안에서 Scope 3(회사 밖 가치사슬에서 나오는 간접 배출) 공시는 어떻게 다루는가? 연결 자산 10조원 이상 회사 기준으로 고르시오.","ref":"금융위 최종안 · Scope 3 유예","why":"최종안은 Scope 3를 공시대상별로 3년 늦춘다. 10조원 이상 회사는 2028년에 공시를 시작하므로 Scope 3는 3년 뒤인 2031년 공시(2030회계연도분)부터 적용된다.","trap":"'2031년'은 공시하는 해이고, 대상 데이터는 2030회계연도분이다. 또 IFRS S2의 첫해 Scope 3 면제(1년)와 헷갈려 '1년 유예'로 답하기 쉽다.","options":["처음부터 Scope 1·2와 함께 공시한다","공시대상별로 1년 유예하여 2029년 공시부터 한다","공시대상별로 3년 유예하여 2031년 공시(2030회계연도분)부터 한다","Scope 3는 영구히 자율 공시로 둔다"],"ans":2,"src":{"label":"금융위원회 보도자료 '지속가능성(ESG) 공시 제도화 방안' 최종안 (2026.7.8)","url":"https://www.fsc.go.kr/po010101/87280"}},{"id":"kssb-03","type":"mc","q":"최종안에서 의무 지속가능성(기후) 공시는 어디에 싣는가?","ref":"금융위 최종안 · 공시 방식","why":"최종안은 거래소 공시 단계를 건너뛰고 처음부터 사업보고서 기재사항(법정공시)으로 넣는다. 그래서 3월 말 사업보고서 일정에 맞춰 준비해야 한다.","trap":"2월 초안은 '거래소 공시 먼저, 나중에 법정공시'였다. 최종안에서 바뀐 점을 놓치면 공시 책임과 일정을 가볍게 보게 된다. 의무 대상이 아닌 회사는 거래소 자율공시를 계속 쓸 수 있다.","options":["자본시장법상 사업보고서(법정공시)에 바로 싣는다","먼저 거래소 자율공시로 시작하고 몇 년 뒤 사업보고서로 옮긴다","회사 홈페이지의 지속가능경영보고서에만 싣는다","환경부 온실가스 종합정보센터에 제출한다"],"ans":0,"src":{"label":"금융위원회 보도자료 '지속가능성(ESG) 공시 제도화 방안' 최종안 (2026.7.8)","url":"https://www.fsc.go.kr/po010101/87280"}},{"id":"kssb-04","type":"mc","q":"최종안에서 지속가능성 공시에 대한 제3자 인증(외부 기관이 내용을 확인해 주는 것)은 언제부터 의무인가?","ref":"금융위 최종안 · 인증","why":"시장에 인증 경험이 아직 부족하므로, 공시 의무화(2028년) 2년 뒤인 2030년부터 인증을 의무로 한다. 인증 범위·수준·인증기관 요건은 이후 시행령 등에서 정한다.","trap":"'2030년'을 회계연도로 착각하기 쉽다. 최종안은 '공시 의무화 2년 후인 2030년부터'라고만 했는데, 공시 의무화가 2028년 공시(2027회계연도분)부터이므로 2030년에 내는 공시(2029회계연도분)부터로 해석된다. 인증 수준(제한적 vs 합리적)은 아직 정해지지 않았다.","options":["공시 첫해인 2028년부터","공시 의무화 2년 후인 2030년부터","2035년 이후 검토","인증 의무는 없고 계속 자율이다"],"ans":1,"src":{"label":"금융위원회 보도자료 '지속가능성(ESG) 공시 제도화 방안' 최종안 (2026.7.8)","url":"https://www.fsc.go.kr/po010101/87280"}},{"id":"kssb-06","type":"mc","q":"KSSB 지속가능성 공시기준 제2호 '기후 관련 공시'에 대한 설명으로 옳은 것은?","ref":"KSSB 제1·2호 (2026.2.26 확정)","why":"KSSB(한국회계기준원 지속가능성기준위원회)는 ISSB 기준을 바탕으로 제1호(일반, IFRS S1 기반)와 제2호(기후, IFRS S2 기반)를 2026년 2월 26일 확정했다. 거버넌스·전략·위험관리·지표 및 목표의 4가지 틀도 같다. 초안에 있던 정책공시(제101호)는 빠졌다.","trap":"'IFRS S2 기반'이 '똑같다'는 뜻은 아니다. 선택공시 항목, 측정 방법별 구분 공시 같은 한국만의 차이가 있다.","options":["GRI 305를 바탕으로 만든 기준이다","IFRS S2를 바탕으로 만들었고 2026년 2월 26일 KSSB에서 최종 확정되었다","EU ESRS E1을 그대로 번역한 기준이다","아직 공개초안 단계이다"],"ans":1,"src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-07","type":"mc","q":"IFRS S2에서는 요구되지만, 확정된 KSSB 기준에서는 '선택 공시'로 허용된 항목은 무엇인가?","ref":"KSSB 제2호 국내 기준 선택 공시 항목","why":"KSSB는 국내 수용성을 고려해 산업기반 지표와 톤당 내부탄소가격을 선택 공시로 두었다. 기후 외 E·S·G 주제도 선택이다. Scope 1·2, 거버넌스, 위험·기회는 핵심 요구사항이다.","trap":"'선택'이라고 무시하면 안 된다. 투자자·평가기관은 여전히 이 정보를 찾으며, 자동차 회사라면 평균연비 같은 지표는 공시하는 편이 비교에 유리하다.","options":["Scope 1·2 온실가스 배출량","산업기반 지표(예: 자동차 평균연비)와 톤당 내부탄소가격","기후 관련 거버넌스(이사회 감독)","기후 관련 위험과 기회의 식별"],"ans":1,"src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-08","type":"mc","q":"한국 회사는 국내 사업장은 배출권거래제 지침으로, 해외 사업장은 GHG 프로토콜로 재는 것처럼 측정 방법을 섞어 쓰는 경우가 많다. 이렇게 스코프 1·2에 두 방법의 측정분이 섞여 있을 때 KSSB가 추가로 요구하는 것은?","ref":"KSSB 제2호 · 측정 방법","why":"IFRS S2는 원칙적으로 GHG 프로토콜을 쓰되, 관할 당국이나 거래소가 다른 방법을 요구하면 그 방법을 쓸 수 있게 한다. KSSB는 여기에 더해, 스코프 1·2에 GHG 프로토콜 측정분과 관할 당국·거래소 요구 방법 측정분이 섞여 있으면 사용한 방법별로 나눠 공시하게 한다(제2호 문단 29⑴㈒). 한 가지 방법만 썼다면 이 세분화는 적용되지 않는다.","trap":"배출권거래제 명세서 값(국내 사업장 중심)과 GHG 프로토콜 값(연결·운영통제 기준)은 범위가 달라 숫자가 다르다. 한 숫자만 내고 출처를 밝히지 않으면 요구사항을 못 채운다.","options":["GHG 프로토콜만 쓰고 국내 지침 값은 버린다","온실가스 배출량을 측정할 때 쓴 방법별로 배출량을 나누어 공시한다","국내 지침 값만 쓰고 측정 방법은 밝히지 않는다","두 값의 평균을 공시한다"],"ans":1,"src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-09","type":"judge","q":"현대자동차 2025년 보고서는 KSSB가 요구하는 '측정 방법별 배출량 구분 공시'를 충족할 준비가 되어 있는가?","ref":"KSSB 제2호 온실가스 측정 방법별 구분 공시","why":"38쪽은 쓴 기준(GHG 프로토콜, 배출권거래제 지침, IPCC)을 모두 밝히지만, 배출량 표는 하나(2025년 Scope 1+2 1,911,084 tCO2-eq)뿐이다. 배출권거래제 기준 국내 사업장 값(1,564,345 tCO2-eq 등)은 157쪽 검증의견서에만 따로 있어, 방법별로 나눈 표로 정리돼 있지는 않다.","trap":"'여러 기준을 적용했다'는 문장만 보고 '있음'으로 판단하기 쉽다. KSSB는 방법별로 숫자를 나눠 보여 주라는 것이므로 기준 목록만으로는 부족하다.","options":["있음","일부","없음"],"ans":1,"quote":"Scope 1 및 Scope 2 배출량은 「The Greenhouse Gas Protocol: A Corporate Accounting and Reporting Standard (Revised Edition)」과 「The Greenhouse Gas Protocol: Scope 2 Guidance」를 근거로 산정하였으며, 국내 「탄소중립기본법」 및 「온실가스 배출권거래제의 배출량 보고 및 인증에 관한 지침」을 준수하였습니다.","page":38,"co":"hyundai","look":"38쪽 '배출량 측정을 위한 접근법'과 157쪽 온실가스 검증의견서","src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-10","type":"judge","q":"KSSB에서 선택 공시인 '톤당 내부탄소가격'을 현대자동차 2025년 보고서는 공시하고 있는가?","ref":"KSSB 제2호 선택공시 — 톤당 내부탄소가격","why":"현대차는 Scope 1·2 배출량에 그림자 가격(Shadow Price) 방식의 내부 탄소 가격을 쓰고, 톤당 USD 7~84 범위와 의사결정 활용처를 밝힌다. 선택 항목이지만 이미 공시하고 있다.","trap":"가격이 하나가 아니라 범위(지역별 차등)로 나오므로, '톤당 가격'을 하나의 숫자로만 찾다가 '없음'으로 오판하기 쉽다.","options":["있음","일부","없음"],"ans":0,"quote":"2025년 기준의 내부 탄소 가격은 사업장이 위치한 지역의 온실가스 배출권 거래제(ETS) 거래 가격 기반으로 USD 7~84/tCO2-eq 범위 내에서 차등 적용됩니다.","page":41,"co":"hyundai","look":"41쪽 '내부 탄소 가격'","src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-11","type":"judge","q":"KSSB는 단기(1년 이내)·중기(1년 초과 5년 이내)·장기(5년 초과)를 기본 기간범위로 정해 두고, 기업이 이를 쓰거나 자체 정의를 쓸 수 있게 한다(제1호 문단 31A, 제2호 문단 10B). 현대자동차 보고서는 기후 위험·기회의 시간 범위를 정의하고 있는가?","ref":"KSSB 제2호 단기·중기·장기 정의","why":"현대차는 단기 0~3년, 중기 3~10년, 장기 10~25년으로 정의한다. KSSB 기본 기간범위보다 길지만, 기본 기간범위는 선택 사항이므로 자체 정의를 써도 된다. 자동차는 설비 수명과 제품 개발 주기가 길어 산업 특성에 맞춘 정의로 볼 수 있다.","trap":"KSSB 기본 기간범위(1년/1~5년/5년 초과)와 다르다고 '미충족'으로 보면 틀린다. 자체 정의를 쓰면 그 정의가 전략적 의사결정에 쓰는 계획기간과 어떻게 연결되는지 설명이 있는지는 따로 확인해야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"단기(0-3년) / 중기(3-10년) / 장기(10-25년)","page":23,"co":"hyundai","look":"23쪽 '기후 위험 및 기회 관리 적용기간 및 범위'","src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"ifrs-s1-01","type":"mc","q":"IFRS S1이 말하는 '주요 이용자(primary users)'는 누구인가?","ref":"IFRS S1 문단 1–2, IG1–IG6","why":"S1의 목적은 일반목적재무보고서 이용자가 회사에 자원을 제공할지 결정할 때 쓸 정보를 공시하게 하는 것이다. 그 이용자는 기존·잠재 투자자, 대여자, 그 밖의 채권자이며, 이들의 공통된 정보 수요를 맞추는 것이 목표다.","trap":"GRI처럼 '모든 이해관계자'를 떠올리면 틀린다. S1은 투자자 관점의 재무적 중요성 기준이다.","options":["기존·잠재 투자자, 대여자, 그 밖의 채권자","회사의 모든 이해관계자(임직원, 지역사회, NGO 포함)","정부와 금융감독 당국","회사의 이사회와 경영진"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-02","type":"mc","q":"IFRS S1 문단 18의 중요성(materiality) 정의로 옳은 것은?","ref":"IFRS S1 문단 18","why":"S1의 정의는 IFRS 회계기준의 중요성 정의와 같은 뼈대다. '빠뜨림·잘못 적음·흐리게 적음(omitting, misstating or obscuring)'이 주요 이용자의 결정에 영향을 줄 수 있는지가 기준이며, 고정된 숫자 임계값은 없다.","trap":"회계감사에서 쓰는 수치 기준(예: 매출의 5%)을 그대로 가져오면 안 된다. 중요성은 회사별·정보별로 성질과 크기를 함께 보고 판단한다.","options":["정보를 빠뜨리거나, 잘못 적거나, 흐리게 적었을 때 주요 이용자의 결정에 영향을 줄 수 있다고 합리적으로 예상되면 중요하다","회사가 환경·사회에 미치는 영향이 크면 중요하다","금액이 매출의 5%를 넘으면 중요하다","이해관계자 설문에서 상위 10위에 들면 중요하다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-03","type":"mc","q":"IFRS S1이 요구하는 공시의 4개 핵심 요소(core content)를 바르게 묶은 것은?","ref":"IFRS S1 문단 25–53","why":"S1은 TCFD 권고안의 4개 기둥을 그대로 가져왔다. 거버넌스(누가 감독하나), 전략(위험·기회가 사업과 재무에 어떤 영향을 주나), 위험관리(어떻게 찾고 평가하나), 지표 및 목표(어떻게 측정하고 진척을 보나)다.","trap":"ESRS의 '정책·행동·목표·지표' 구조나 GRI의 '영향' 중심 구조와 섞어 쓰면 보고서 목차부터 틀어진다.","options":["거버넌스, 전략, 위험관리, 지표 및 목표","환경, 사회, 지배구조, 경제","영향, 위험, 기회, 재무효과","정책, 행동, 목표, 성과"],"ans":0,"src":{"label":"IFRS S1 기준서 페이지 (ifrs.org)","url":"https://www.ifrs.org/issued-standards/ifrs-sustainability-standards-navigator/ifrs-s1-general-requirements/"}},{"id":"ifrs-s1-04","type":"mc","q":"모회사가 연결재무제표를 만든다. IFRS S1에 따른 지속가능성 공시의 보고실체는 어디까지인가?","ref":"IFRS S1 문단 20, B38","why":"문단 20은 지속가능성 공시가 관련 재무제표와 '같은 보고실체'를 대상으로 해야 한다고 정한다. 연결재무제표를 내는 모회사라면 자회사까지 포함한 연결 범위가 공시 범위다.","trap":"온실가스 산정 경계(지분법·운영통제)와 공시 보고실체를 혼동하기 쉽다. 보고실체는 재무제표를 따라 정하고, 배출량 산정 경계는 그 안에서 S2 요구에 따라 밝힌다.","options":["연결재무제표와 같은 범위, 즉 모회사와 자회사 전체","모회사 단독(별도재무제표 기준)","국내 사업장만","회사가 공시 범위를 자유롭게 정할 수 있다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-06","type":"mc","q":"IFRS S1 문단 3에서 '회사의 전망(prospects)에 합리적으로 영향을 줄 수 있다'는 말은 구체적으로 무엇에 대한 영향인가?","ref":"IFRS S1 문단 3","why":"S1은 전망을 '현금흐름, 자금조달 접근성(access to finance), 자본비용(cost of capital)'으로 풀어 쓰고, 시간 범위를 단기·중기·장기로 넓게 잡는다. 지금 돈이 안 들어도 장기적으로 자금조달 조건을 바꿀 수 있는 위험이면 범위에 들어온다.","trap":"'당기 손익에 숫자로 안 잡히니 공시 대상이 아니다'라고 끊으면 틀린다. 장기 현금흐름과 자본비용까지 봐야 한다.","options":["단기·중기·장기의 현금흐름, 자금조달 접근성, 자본비용","당기 매출과 영업이익","주가와 시가총액","브랜드 평판 점수"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-08","type":"mc","q":"IFRS S1 문단 64가 정한 지속가능성 공시의 보고 시점은?","ref":"IFRS S1 문단 64","why":"문단 64는 지속가능성 공시를 관련 재무제표와 '동시에(at the same time)' 내도록 한다. 투자자가 재무정보와 지속가능성 정보를 한 묶음으로 보게 하려는 취지다. 첫 적용연도에만 E4의 완화조치로 늦출 수 있다.","trap":"한국 관행처럼 6월에 지속가능경영보고서를 내는 일정은 S1의 기본 원칙과 맞지 않는다. 첫해 완화조치는 한 번만 쓸 수 있다.","options":["관련 재무제표와 같은 시점에 공시한다","재무제표 발표 후 6개월 이내에 공시한다","회계연도 종료 후 1년 이내 아무 때나 공시한다","주주총회 이후 공시한다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-09","type":"mc","q":"회사가 'IFRS 지속가능성 공시기준을 준수했다'는 선언을 하려면 어떤 조건이 필요한가?","ref":"IFRS S1 문단 72","why":"문단 72는 모든 요구사항을 충족할 때만 명시적이고 유보 없는 준수 선언을 허용한다. 일부만 따르면서 '참고하여 작성'이라고 쓰는 것은 준수 선언이 아니다. 단, 문단 73의 완화(법규 금지, 상업적 민감 정보)를 쓰더라도 선언은 가능하다.","trap":"'TCFD·SASB를 반영했다'는 문구를 ISSB 준수와 같은 뜻으로 보면 틀린다. 둘은 다른 수준의 진술이다.","options":["ISSB 기준의 모든 요구사항을 충족해야 하며, 선언은 명시적이고 유보 없이(explicit and unreserved) 해야 한다","S2의 핵심 지표(Scope 1·2)만 공시하면 된다","TCFD 권고안을 따랐다는 문구로 대체할 수 있다","제3자 인증을 받으면 자동으로 준수로 인정된다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-11","type":"mc","q":"한 회사가 인적자본(사람) 관련 공시를 준비한다. ISSB 기준서가 없는 이 주제에서 GRI 기준이나 유럽 ESRS를 쓰려면 IFRS S1은 어떤 조건을 두는가?","ref":"IFRS S1 문단 57–58, 부록 C","why":"문단 57은 회사가 판단으로 관련성 있고 충실하게 표현하는 정보를 찾도록 하고, 문단 58은 SASB 지표를 반드시 고려, 부록 C(C1–C2)는 GRI 기준과 ESRS를 '고려할 수 있다'로 둔다. 조건은 S1 목적에 부합하고 ISSB 기준과 충돌하지 않을 것이다.","trap":"GRI 지표를 그대로 옮기면서 '모든 이해관계자 영향' 관점까지 끌어오면 S1의 투자자 관점과 충돌한다. 지표는 빌려도 중요성 판단은 S1 방식으로 해야 한다. 참고: 영국 UK SRS S1 초안은 이 'shall'을 'may'로 낮추는 수정을 제안했다.","options":["S1의 목적을 달성하는 데 도움이 되고 ISSB 기준과 충돌하지 않는 범위에서 '고려할 수 있다'","GRI와 ESRS 중 하나를 반드시 그대로 적용해야 한다","ISSB 기준서가 없는 주제는 공시하지 않는다","ESRS는 EU 회사만 쓸 수 있다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문에 영국 수정 표시)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-12","type":"mc","q":"IFRS S1의 '연결된 정보(connected information)' 요구에 해당하지 않는 것은?","ref":"IFRS S1 문단 21–24, B39–B44","why":"문단 22는 관련 재무제표 식별, 문단 23은 데이터·가정의 일관성, 문단 24는 표시통화 일치를 요구한다. 보고실체는 문단 20에 따라 재무제표와 '같아야' 하므로 마지막 선택지는 정반대다. 연결된 정보는 위험·기회 사이, 4개 요소 사이, 공시와 재무제표 사이의 관계 설명을 뜻한다.","trap":"기후 시나리오 분석에 쓴 탄소가격·할인율이 재무제표의 손상검사 가정과 다르면 '연결' 요건 위반 소지가 있다. 두 팀의 가정을 맞추는 것이 컨설턴트의 일이다.","options":["지속가능성 공시가 어느 재무제표와 짝인지 밝힌다","지속가능성 공시의 데이터·가정은 가능한 한 재무제표 작성에 쓴 것과 일치시킨다","금액 단위로 통화를 쓸 때 재무제표의 표시통화를 쓴다","지속가능성 공시는 재무제표와 별도의 보고실체로 작성해 비교 가능성을 높인다"],"ans":3,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-13","type":"mc","q":"지난해 공시한 지표가 추정치였는데, 올해 새 정보로 지난해 상황을 더 잘 알게 되었다. IFRS S1에서 올바른 처리는?","ref":"IFRS S1 문단 70, B50–B51","why":"B50은 전기 추정치에 대해 새 정보가 생기면 수정 비교 금액·차이·이유를 공시하게 한다. B51은 실행 불가능하거나 미래지향 지표라 사후 판단이 필요한 경우 예외를 둔다. B54에 따라 수정할 수 없으면 그 사실을 밝힌다.","trap":"'추정 변경'을 '오류 수정'으로 처리하면 안 된다. 문단 85는 오류 수정과 추정 변경을 구별하도록 하며, 오류만 재작성(restatement)이다.","options":["수정한 전기 비교 금액, 차이, 이유를 공시한다. 단, 실행 불가능하거나 미래 예측 지표여서 사후 판단(hindsight)이 필요하면 수정하지 않아도 된다","전기 금액은 어떤 경우에도 바꾸지 않는다","전기 금액을 조용히 바꾸고 설명은 생략한다","비교정보 자체를 공시하지 않는다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-14","type":"mc","q":"IFRS S1 문단 77–78의 측정 불확실성 공시로 요구되는 것은?","ref":"IFRS S1 문단 74–81","why":"문단 77은 보고 금액에 영향을 주는 가장 중요한 불확실성을 이용자가 이해할 수 있게 하라고 하고, 문단 78은 측정 불확실성이 높은 금액을 식별해 원천·가정·근사치·판단을 설명하게 한다. Scope 3 추정치가 대표적이다. 문단 74는 공시 준비 과정의 중요한 판단도 밝히게 한다.","trap":"'불확실하니 빼자'는 완전성(공정한 표시) 위반이다. 불확실해도 공시하고, 어디가 왜 불확실한지 설명하는 것이 기준의 요구다.","options":["측정 불확실성이 높은 공시 금액을 식별하고, 그 불확실성의 원천과 쓴 가정·근사치·판단을 설명한다","모든 지표의 오차율을 %로 계산해 공시한다","불확실한 숫자는 공시에서 빼고 확실한 것만 적는다","제3자 인증을 받았으면 불확실성 공시를 생략할 수 있다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-15","type":"mc","q":"회사가 전기 지속가능성 공시에서 중요한 오류(예: 사업장 하나를 빼고 집계)를 발견했다. IFRS S1의 처리는?","ref":"IFRS S1 문단 83–86","why":"문단 83은 중요한 전기 오류를 비교 금액 재작성으로 고치되 실행 불가능하면 예외를 둔다. 문단 84는 오류를 '전기 공시의 누락·왜곡'으로 정의하고, 문단 85는 오류 수정과 추정 변경을 구별한다.","trap":"당기에 몰아서 조정(cumulative catch-up)하면 추세가 깨진다. 기준은 비교 금액 자체를 고치라고 요구한다.","options":["실행 불가능한 경우가 아니면 전기 비교 금액을 다시 적어(restating) 오류를 고치고 그 사실을 밝힌다","다음 보고서에서 당기 숫자에 합쳐서 조정한다","전기 숫자는 그대로 두고 각주로만 언급한다","오류가 10% 미만이면 수정하지 않아도 된다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-17","type":"mc","q":"첫 적용연도에 '기후 우선(E5)' 완화를 써서 기후 정보만 공시한 회사가 2년차에 기후 외 주제까지 공시를 넓힌다. 비교정보는 어떻게 되는가?","ref":"IFRS S1 부록 E5–E6","why":"E6에 따라 E5를 쓴 회사는 첫해에 기후 비교정보가 면제되고, 2년차에는 새로 추가한 기후 외 지속가능성 위험·기회의 비교정보가 면제된다. 기후 정보는 2년차부터 비교정보를 내야 한다. 완화를 썼다는 사실은 밝혀야 한다.","trap":"E5는 '기후만 공시해도 S1 준수'라는 뜻이지 S1을 적용하지 않는다는 뜻이 아니다. 중요성·연결된 정보·판단·불확실성 등 S1의 일반 요구사항은 기후 공시에 그대로 적용된다.","options":["2년차에는 기후 외 주제의 비교정보를 내지 않아도 된다(기후 비교정보는 필요)","2년차에도 모든 비교정보를 생략할 수 있다","2년차에 기후 외 주제의 2개년 비교정보를 모두 내야 한다","기후 우선을 쓰면 비교정보 의무가 영구히 면제된다"],"ans":0,"src":{"label":"AASB: IFRS S1 E4–E6 원문 발췌","url":"https://standards.aasb.gov.au/node/3835"}},{"id":"ifrs-s1-18","type":"mc","q":"여러 사업부를 가진 회사가 공급망 노동 위험을 한 줄로 합쳐 공시하려 한다. IFRS S1 B29–B30에 따른 판단은?","ref":"IFRS S1 문단 B29–B30, IE13–IE14","why":"B30은 중요한 정보를 가리는 합산을 금지한다. 부속 예시 IE13–IE14는 중앙 기능이 하나로 관리하는 위험은 합산하고, 원인이 다른 사업부는 따로 보여 주는 식으로 설명한다. 반대로 지나친 세분화로 중요 정보를 흐리는 것도 피해야 한다.","trap":"'그룹 전체 수치 하나면 충분하다'는 생각이 흔하다. 투자자가 어느 사업이 위험한지 알 수 없다면 합산이 정보를 가린 것이다.","options":["성격이 같고 하나의 중앙 기능이 관리하면 합산할 수 있지만, 원인·영향이 다른 사업부의 정보를 합쳐 중요한 정보를 가리게 되면 합산할 수 없다","항상 회사 전체로 합산해 공시해야 한다","항상 사업부별로 쪼개 공시해야 한다","합산 여부는 보고서 분량에 맞춰 정한다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-19","type":"mc","q":"회사가 '경쟁사에 알려지면 손해'라는 이유로 특정 기후 관련 '위험' 정보를 빼려 한다. IFRS S1 B34–B37에 따른 판단은?","ref":"IFRS S1 문단 B34–B37","why":"B34는 상업적으로 민감한 '기회' 정보에만 예외를 둔다. B35의 세 조건(아직 공개되지 않았고, 공개가 경제적 이익을 심각하게 해칠 것으로 합리적으로 예상되며, 합산 등 다른 방법으로도 목적을 달성할 수 없음)을 모두 충족해야 하고, B36은 예외 사용 사실의 공시와 매 보고일 재평가를, B37은 위험 정보나 광범위한 비공시에 쓰는 것을 금지한다.","trap":"'민감하다'는 느낌만으로 빼면 준수 선언을 할 수 없다. 조건 셋을 문서로 입증하고, 예외를 썼다는 사실 자체는 공시해야 한다.","options":["불가능하다. 이 예외는 '기회' 정보에만 쓸 수 있고, 위험 정보나 넓은 범위의 비공시 근거로는 쓸 수 없다","가능하다. 상업적으로 민감하면 위험·기회 모두 뺄 수 있다","가능하다. 이사회 결의만 있으면 된다","가능하다. 대신 제3자 인증을 받아야 한다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-21","type":"judge","q":"현대자동차 2026 보고서는 IFRS S1·S2(또는 KSSB 기준)에 대한 명시적이고 유보 없는 준수 선언을 하고 있는가?","ref":"IFRS S1 문단 72","why":"보고서는 GRI 기준에 따라 작성하고 TCFD·SASB 가이드라인을 '반영'했다고만 적는다. IFRS S1·S2나 KSSB 기준에 대한 준수 선언 문구는 없다. TCFD 반영은 S1 문단 72가 요구하는 수준의 선언이 아니다.","trap":"'TCFD Index가 있으니 ISSB 준수'라고 판단하면 틀린다. 준수 선언은 모든 요구사항 충족을 전제로 한 별도의 명시적 문장이어야 한다.","options":["있음","일부","없음"],"ans":2,"quote":"보고 기준 GRI Standards, TCFD, SASB","page":162,"co":"hyundai","look":"162쪽 '보고서 개요' 오른쪽 표 '보고 기준'","src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-27","type":"mc","q":"후배 컨설턴트가 '2025년 12월 ISSB 개정으로 IFRS S1도 2027년부터 바뀐다'고 고객에게 안내했다. 바른 정정은?","ref":"ISSB IFRS S2 개정(2025.12) 완료 프로젝트 페이지","why":"ifrs.org 완료 프로젝트 페이지는 2025년 12월 ISSB가 IFRS S2의 특정 온실가스 공시 요구사항 적용을 돕기 위한 개정을 냈고, 2027년 1월 1일 이후 개시 회계연도부터 시행하며 조기적용을 허용한다고 밝힌다. 함께 SASB 기준의 금융배출량 지표가 후속 수정되었다. S1에 대한 개정은 언급되지 않는다.","trap":"S1 기준서 페이지 머리말에 '2026 Issued'라고 표시된 것을 보고 S1이 개정되었다고 오해할 수 있다. 본문 발행일은 2023년 6월이고, 2025–2026년 S1 관련 변화는 교육자료 추가다.","options":["2025년 12월 개정은 IFRS S2의 온실가스 배출량 공시 요구사항을 손질한 것(및 SASB 기준의 후속 수정)이며, 2027년 1월 1일 이후 개시 회계연도부터 적용하고 조기적용이 가능하다. S1 본문은 개정되지 않았다","맞다. S1과 S2가 함께 전면 개정되었다","개정은 2026년 1월 1일부터 의무 적용되며 조기적용은 불가능하다","개정은 ESRS와의 통합 기준서를 새로 만든 것이다"],"ans":0,"src":{"label":"ISSB: IFRS S2 온실가스 공시 개정 (2025.12)","url":"https://www.ifrs.org/projects/completed-projects/2025/amendments-to-disclosure-of-greenhouse-gas-emissions-s2/"}},{"id":"ifrs-s1-30","type":"mc","q":"자원이 충분한 대기업이 '기후 위험의 예상 재무효과를 정량화할 전문 인력이 없다'며 금액 공시를 모두 생략하고 설명도 붙이지 않았다. IFRS S1 문단 38–40과 2025년 8월 교육자료에 따른 판단은?","ref":"IFRS S1 문단 38–40 · ISSB 교육자료(2025.8)","why":"문단 38은 효과를 따로 식별할 수 없거나 측정 불확실성이 너무 높을 때, 문단 39는 예상 효과에 한해 기술·역량·자원이 없을 때 정량 공시를 면제한다. 교육자료는 39의 완화가 자원 있는 회사의 초기 몇 해에 주로 해당하며, 역량을 개발할 자원이 있으면 회피 수단으로 쓸 수 없다고 본다. 문단 40은 대체 공시(이유, 정성 정보와 영향받는 항목, 결합 효과)를 요구하고, 금액은 단일 값 또는 범위로 낼 수 있다.","trap":"'정량 불가 → 공백'이 가장 흔한 실수다. 정량을 못 내면 더 많은 설명을 내야 한다.","options":["문단 39의 역량 부족 완화는 쓸 수 있어도, 역량을 갖출 자원이 있는 회사는 이를 회피 수단으로 쓸 수 없다. 또 생략 시 문단 40에 따라 이유 설명, 영향받을 재무제표 항목 식별 등 정성 정보, 유용하지 않다고 판단하지 않는 한 결합 효과의 정량 정보를 내야 한다","인력이 없다는 사유만 적으면 모든 재무효과 공시가 면제된다","재무효과는 항상 단일 금액으로 정량 공시해야 하므로 어떤 완화도 없다","정성 정보만 내면 되고 재무제표 항목은 특정하지 않아도 된다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s2x-01","type":"mc","q":"IFRS S2 문단 6(a)는 기후 위험·기회를 감독하는 기구에 대해 여러 항목을 공시하라고 한다. 다음 중 문단 6(a)가 요구하지 않는 것은?","ref":"IFRS S2 문단 6(a)","why":"문단 6(a)의 다섯 항목은 책임의 근거 문서, 기술·역량 확보 판단 방법, 보고 빈도와 방식, 전략·거래·위험관리 감독 시 고려 방법(절충 포함), 목표 설정·진척 감독과 보상 연계다. 개인의 탄소발자국은 요구 대상이 아니다.","trap":"이사회 구성원 명단과 회의 횟수만 적고 '기술·역량을 어떻게 판단하는지'와 '절충안을 어떻게 고려했는지'를 빼먹는 보고서가 많다.","options":["감독기구가 기후 대응 전략을 감독할 적절한 기술과 역량을 갖췄는지, 또는 키울지 어떻게 판단하는지","감독기구가 기후 위험·기회를 얼마나 자주, 어떻게 보고받는지","감독기구 구성원 개인의 가정 내 탄소발자국 측정 결과","기후 관련 성과지표가 보상정책에 포함되는지 여부"],"ans":2,"src":{"label":"IFRS S2 (2026 issued) ¶6","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-02","type":"mc","q":"IFRS S2 문단 6(b)가 '경영진의 역할'에 대해 공시하라고 하는 내용으로 맞는 것은?","ref":"IFRS S2 문단 6(b)","why":"문단 6(b)는 (i) 역할이 특정 직책·위원회에 위임됐는지와 그 감독 방법, (ii) 경영진이 통제·절차를 쓰는지와 그것이 다른 내부 기능과 어떻게 통합되는지를 묻는다.","trap":"'CEO가 책임진다'는 한 문장으로 끝내고 통제·절차와 내부 통합 방식을 설명하지 않는 경우가 많다.","options":["경영진 전원의 연봉 총액과 기후 성과 보너스 금액","기후 역할이 특정 경영진 직책이나 위원회에 위임되었는지와 그 감독 방법, 그리고 통제·절차를 쓰는지와 다른 내부 기능과의 통합 방식","경영진이 참석한 외부 기후 세미나 목록","경영진이 직접 산정한 Scope 1·2 배출량"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶6(b)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-03","type":"mc","q":"IFRS S2 부록 A 정의에 따를 때, 다음 중 '만성(chronic) 물리적 위험'에 해당하는 것은?","ref":"IFRS S2 문단 10(b), 부록 A","why":"물리적 위험은 사건형인 급성 위험(폭풍·홍수·가뭄·열파 등)과 장기 기후 패턴 변화형인 만성 위험(강수·기온 변화로 인한 해수면 상승, 물 가용량 감소 등)으로 나뉜다. 탄소세와 기술 경쟁은 전환 위험이다. 문단 10(b)는 각 위험을 물리적·전환 중 어느 쪽인지 밝히게 한다.","trap":"가뭄이나 폭염을 '장기 현상'이라며 만성 위험으로만 분류하기 쉬운데, 부록 A는 가뭄·열파 같은 사건을 급성 위험 예시로 든다.","options":["태풍으로 공장 지붕이 파손되는 것","강수 패턴과 기온의 장기적 변화로 물 가용량이 줄어드는 것","탄소세 도입으로 연료비가 오르는 것","저탄소 기술 경쟁에서 밀려 시장점유율이 떨어지는 것"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) Appendix A","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-04","type":"mc","q":"IFRS S2 문단 13(b)는 기후 위험·기회가 어디에 '집중'되어 있는지 공시하라고 한다. 기준이 예로 드는 집중 단위는?","ref":"IFRS S2 문단 13","why":"문단 13은 (a) 사업모형과 가치사슬에 미치는 현재·예상 영향과 (b) 위험·기회가 지리적 지역, 시설, 자산 유형 등 어디에 집중되는지를 설명하게 한다.","trap":"집중 위치를 '글로벌 전 사업장'처럼 넓게만 쓰면 요구를 충족하기 어렵다. 어느 지역·어느 공장·어떤 자산인지 특정해야 한다.","options":["지리적 지역, 시설, 자산 유형","주주 구성, 채권자, 신용등급","회계 계정과목, 세무 관할, 감사인","직원 수, 노조 가입률, 평균 근속연수"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶13","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-05","type":"mc","q":"IFRS S2에서 '기후 관련 전환계획(transition plan)'은 어떻게 다뤄지는가?","ref":"IFRS S2 문단 14(a)(iv), 부록 A","why":"문단 14(a)(iv)는 회사가 가진 전환계획과 그 핵심 가정·의존요소를 공시하게 한다. IFRS 재단은 2025년 6월 전환계획 공시 지침을 내면서 'IFRS S2는 전환계획을 가질 것을 요구하지 않는다'고 명확히 했다. 부록 A는 전환계획을 저탄소 경제로의 전환을 위한 목표·행동·자원을 담은 전략의 한 부분으로 정의한다.","trap":"전환계획이 없으면 공시 위반이라고 고객에게 말하는 것은 잘못이다. 다만 목표를 어떻게 달성할지(14(a)(v))는 어차피 써야 한다.","options":["모든 기업이 전환계획을 수립해 제출하는 것이 의무다","전환계획을 가지라고 요구하지는 않지만, 가지고 있다면 핵심 가정과 의존요소를 포함해 공시해야 한다","금융기관만 전환계획을 공시한다","전환계획은 IFRS S1에서만 다루고 S2에는 관련 요구가 없다"],"ans":1,"src":{"label":"IFRS Foundation news 2025-06-23","url":"https://www.ifrs.org/news-and-events/news/2025/06/ifrs-publishes-guidance-disclosures-transition-plans/"}},{"id":"ifrs-s2x-06","type":"mc","q":"IFRS S2 문단 22는 전략과 사업모형의 '기후 회복력'을 평가할 때 어떤 방법을 쓰라고 하는가?","ref":"IFRS S2 문단 22, 부록 A","why":"문단 22는 회사 상황에 맞는(commensurate) 기후 관련 시나리오 분석을 사용해 회복력을 평가하고, 평가 결과와 분석 방법을 공시하라고 한다. 회복력은 기후 변화·불확실성에 적응할 수 있는 능력으로 정의된다.","trap":"시나리오 분석 결과표만 넣고, 그 결과가 전략에 주는 함의와 단·중·장기 조정 능력(22(a))을 쓰지 않는 보고서가 많다.","options":["외부 신용평가기관의 ESG 등급","회사 상황에 맞는 기후 관련 시나리오 분석","과거 10년간 재해 손실액의 단순 평균","경쟁사 보고서와의 비교"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶22, Appendix A","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-07","type":"mc","q":"IFRS S2 문단 29(e) '자본 배치(capital deployment)' 지표로 공시해야 하는 것은?","ref":"IFRS S2 문단 29(e)","why":"29(e)는 기후 위험·기회에 투입(deployed)된 자본적 지출·금융·투자 금액을 묻는다. 29(b)~(d)가 '금액과 비율'을 함께 요구하는 것과 달리 29(e)는 금액이다.","trap":"배출권 구매비만 자본 배치로 적는 경우가 있다. 전동화 설비 투자, 재생에너지 PPA 관련 투자 등 기회 쪽 투자도 포함된다.","options":["기후 위험·기회에 투입한 자본적 지출, 금융 또는 투자의 금액","회사 전체 자본적 지출의 전년 대비 증가율","ESG 펀드가 보유한 자사 주식 비율","탄소배출권 매입에 쓴 금액만"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶29(b)–(e)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-09","type":"mc","q":"한 회사는 기후·물·인권 등 지속가능성 이슈를 하나의 ESG위원회가 통합 감독한다. IFRS S2 문단 7에 따른 올바른 처리는?","ref":"IFRS S2 문단 7","why":"문단 7은 IFRS S1에 따라 불필요한 중복을 피하도록 하며, 지속가능성 감독이 통합 운영되면 위험·기회별로 쪼개지 않고 통합 거버넌스 공시를 할 수 있다고 한다. 단, 문단 6의 요구 정보는 그대로 제공해야 한다.","trap":"'통합 공시 허용'을 '기후 거버넌스 내용 축소 허용'으로 오해하기 쉽다. 요구 항목은 그대로다.","options":["기후만 따로 떼어 별도의 거버넌스 장을 반드시 작성해야 한다","IFRS S1에 따라 중복을 피하기 위해 통합된 거버넌스 공시를 제공할 수 있지만, 문단 6의 정보는 여전히 담아야 한다","통합 감독이면 거버넌스 공시를 생략할 수 있다","기후 거버넌스는 재무제표 주석으로만 공시한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶7","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-10","type":"mc","q":"IFRS S2에서 단기·중기·장기의 시간 범위는 어떻게 정해지는가?","ref":"IFRS S2 문단 10(c)(d)","why":"문단 10(c)는 각 위험·기회가 단·중·장기 중 언제 발생할 수 있는지, 10(d)는 회사가 단·중·장기를 어떻게 정의하고 그 정의가 전략적 의사결정용 기획 기간과 어떻게 연결되는지 설명하게 한다. 기준은 연수를 고정하지 않는다.","trap":"연수만 표로 적고 '왜 이 구간인지, 회사 중장기 사업계획과 어떻게 맞물리는지'를 빠뜨리는 경우가 흔하다.","options":["기준이 단기 1년, 중기 5년, 장기 10년으로 고정한다","회사가 스스로 정의하되, 그 정의 방법과 전략적 의사결정에 쓰는 기획 기간과의 연결을 설명해야 한다","각국 감독당국이 매년 고시한다","TCFD가 정한 3·5·10년을 그대로 써야 한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶10","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-11","type":"mc","q":"IFRS S2 문단 11은 기후 위험·기회를 식별할 때 '합리적이고 뒷받침 가능한 정보(reasonable and supportable information)'를 쓰라고 한다. 이 정보에 포함되는 것은?","ref":"IFRS S2 문단 11","why":"문단 11은 보고일에 과도한 비용·노력 없이 이용 가능한 모든 합리적이고 뒷받침 가능한 정보를 쓰라고 하며, 여기에는 과거 사건, 현재 상황, 미래 상황 전망이 포함된다. 정량·정성, 내부·외부 정보가 모두 해당한다(B9).","trap":"'뒷받침 가능'을 '검증된 숫자'로 좁게 해석해 정성 정보나 외부 전망을 제외하는 실수가 있다.","options":["과거 사건, 현재 상황, 미래 전망에 관한 정보로서 보고일에 과도한 비용·노력 없이 얻을 수 있는 것","감사인이 서면으로 확인한 정보만","정부 공식 통계만","회사 내부에서 만든 정량 데이터만"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶11, B9","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-12","type":"mc","q":"한 회사가 지난해 보고서에 '2030년까지 전 공장 LED 전환' 계획을 공시했다. 올해 IFRS S2 문단 14(c)에 따라 써야 하는 것은?","ref":"IFRS S2 문단 14(c)","why":"문단 14(c)는 이전 보고기간에 공시한 계획에 대한 진척 상황을 정량·정성 정보로 공시하라고 한다. 계획을 공시한 이상 매년 그 이행 정도를 추적해 보여줘야 한다.","trap":"새 계획만 계속 발표하고 과거 계획의 달성률을 추적하지 않는 '목표 갈아타기'는 14(c) 위반 소지가 있다.","options":["계획이 바뀌지 않았으면 아무것도 쓰지 않아도 된다","전기에 공시한 계획 대비 진척 상황을 정량·정성 정보로 공시해야 한다","진척은 5년마다 한 번만 공시한다","계획 달성 후에만 결과를 공시한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶14(c)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-13","type":"mc","q":"IFRS S2 문단 19에 따라 현재 및 예상 재무영향에 대한 정량 정보를 모두 생략할 수 있는 조건은?","ref":"IFRS S2 문단 19","why":"문단 19는 (a) 영향이 분리 식별되지 않거나 (b) 측정 불확실성이 너무 높아 정량 정보가 유용하지 않다고 판단하면 현재·예상 재무영향의 정량 정보를 제공하지 않을 수 있다고 한다.","trap":"'어렵다'는 이유만으로 생략하면 안 된다. 두 조건 중 하나에 해당한다는 판단과 그 이유(¶21(a))를 공시해야 한다.","options":["회사가 상장기업이 아닐 때","영향을 따로 분리해 식별할 수 없거나, 측정 불확실성이 너무 커서 숫자가 유용하지 않을 때","전년도 감사의견이 적정일 때","경쟁사가 아직 숫자를 공시하지 않았을 때"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶19","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-14","type":"mc","q":"회사가 문단 19 또는 20에 따라 정량 재무영향을 생략했다. 문단 21에 따라 반드시 해야 하는 것이 아닌 것은?","ref":"IFRS S2 문단 21","why":"문단 21은 (a) 생략 이유 설명, (b) 영향받을 재무제표 항목·합계·소계를 포함한 정성 정보, (c) 다른 기후 위험·기회·요인과 결합한 재무영향의 정량 정보(유용하지 않다고 판단하면 제외)를 요구한다. 감사인 승인서는 요구사항이 아니다.","trap":"정량을 생략하면서 '어느 계정이 영향받는지'조차 쓰지 않는 경우가 많다. 정성 정보라도 재무제표 항목과 연결해야 한다.","options":["정량 정보를 제공하지 않은 이유 설명","영향받을 가능성이 있는 재무제표 항목(line item)·합계·소계를 포함한 정성 정보 제공","다른 기후 요인과 합친 결합 재무영향의 정량 정보(유용하지 않다고 판단한 경우 제외)","외부 감사인의 생략 승인서 첨부"],"ans":3,"src":{"label":"IFRS S2 (2026 issued) ¶21","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-15","type":"mc","q":"IFRS S2 문단 22(b)(i)에 따른 시나리오 분석 '입력값' 공시에 대해 맞는 설명은?","ref":"IFRS S2 문단 22(b)(i)","why":"22(b)(i)는 사용 시나리오와 출처, 다양한 시나리오 포함 여부, 전환·물리 위험 관련성, 최신 국제 기후협정에 부합하는 시나리오를 사용했는지 여부, 선택 이유, 시간 범위, 사업 범위를 공시하게 한다. 파리협정 정합 시나리오 사용 자체는 의무가 아니라 '여부 공시'다.","trap":"1.5°C 시나리오를 안 쓰면 위반이라고 생각하기 쉽다. 기준은 사용 여부를 투명하게 밝히라는 것이며, B12는 관할권 공약과 일치하는 시나리오를 예시로 들 뿐이다.","options":["최신 국제 기후협정(파리협정)에 부합하는 시나리오를 반드시 사용해야 한다","그런 시나리오를 '사용했는지 여부'를 공시해야 하며, 사용한 시나리오와 출처, 전환·물리 위험 관련성, 선택 이유, 기간, 사업 범위도 함께 공시한다","시나리오 이름만 공시하면 충분하다","시나리오 출처는 기업 비밀로 공시하지 않아도 된다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶22(b), B12","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-16","type":"mc","q":"IFRS S2 문단 25가 기후 위험관리 절차에 대해 요구하는 내용으로 맞는 것은?","ref":"IFRS S2 문단 25(a)(iv), 25(c)","why":"25(a)(iv)는 기후 위험을 다른 유형의 위험 대비 어떻게 우선순위화하는지, 25(c)는 기후 위험·기회 절차가 전사 위험관리 절차에 어느 정도 통합되고 정보를 제공하는지 공시하게 한다. 25(a)(i)~(vi)에는 입력값·변수, 시나리오 분석 사용 여부, 성격·가능성·규모 평가, 모니터링, 전기 대비 변경도 포함된다.","trap":"기후 위험끼리의 순위(예: 탄소가격 > 침수)만 쓰고, 신용·운영·시장 위험 같은 다른 위험과 비교해 어디쯤인지 쓰지 않는 보고서가 많다.","options":["기후 위험을 다른 종류의 위험과 비교해 어떻게 우선순위를 정하는지, 그리고 이 절차가 전사 위험관리에 어느 정도 통합되어 있는지","기후 위험만 별도 위험관리 체계로 분리해 운영하는 것","위험 식별은 외부 컨설팅사가 수행해야 한다는 것","위험 등록부(risk register) 전체를 공개하는 것"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶25","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-17","type":"mc","q":"IFRS S2 문단 32와 'IFRS S2 산업기반 지침(Industry-based Guidance)'의 관계로 맞는 설명은?","ref":"IFRS S2 문단 32, 산업기반 지침","why":"문단 32는 산업별 지표를 공시할 때 산업기반 지침을 참조하고 적용 가능성을 고려하라고 한다. ISSB 자료는 이 지침이 비의무 부록이며, 적용이 ISSB 기준 준수 주장에 필수는 아니라고 설명한다. 지침은 SASB 기준에서 기후 관련 내용이 확인된 68개 산업을 다룬다. ISSB는 2025~2026년 SASB 기준과 이 지침의 정합성을 유지하는 개정을 진행하고 있다.","trap":"'참조·고려'는 무시해도 된다는 뜻이 아니다. 적용하지 않기로 했다면 판단 과정이 있어야 하고, 그래도 산업별 지표 공시 의무(¶32)는 남는다.","options":["지침의 모든 지표를 그대로 공시하는 것이 의무다","지침을 '참조하고 적용 가능성을 고려'하는 것은 의무지만, 지침 적용 자체는 의무가 아니다. 지침은 SASB 기준에서 기후 관련 내용을 가져온 68개 산업용이다","지침은 금융업에만 적용된다","지침은 2025년에 폐지되었다"],"ans":1,"src":{"label":"ISSB — Industry-based guidance: applying ISSB Standards","url":"https://www.ifrs.org/content/dam/ifrs/supporting-implementation/issb-standards/issb-industry-based-guidance-applying-issb-standards.pdf"}},{"id":"ifrs-s2x-18","type":"mc","q":"IFRS S2 B40의 Scope 3 측정 프레임워크가 입력 데이터를 우선순위화할 때 쓰는 네 가지 특성에 해당하지 않는 것은?","ref":"IFRS S2 문단 B40","why":"B40은 특정 입력값을 강제하지 않되, 직접 측정, 가치사슬 특정 활동 데이터, 시의성·대표성, 검증된 데이터의 네 가지 특성을 기준으로 우선순위를 두라고 한다. 낮은 값을 고르는 것은 충실한 표현(B38)에 어긋난다.","trap":"프레임워크를 '1차 데이터 100% 의무'로 오해하는 경우가 있다. 우선순위이지 절대 조건이 아니다.","options":["직접 측정된 데이터","회사 가치사슬 내 특정 활동에서 나온 데이터","시의성이 있고 보고기간을 대표하는 데이터","가장 낮은 배출량 값을 주는 데이터"],"ans":3,"src":{"label":"IFRS S2 (2026 issued) B38–B40","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-20","type":"mc","q":"IFRS S2 문단 36에 따라 각 온실가스 배출 목표에 대해 공시해야 하는 항목으로 옳게 묶인 것은?","ref":"IFRS S2 문단 36(a)(b)(d)","why":"36(a)는 목표가 포함하는 온실가스, 36(b)는 Scope 1·2·3 중 어느 범위를 포함하는지, 36(d)는 섹터별 탈탄소화 접근법(SDA)으로 도출했는지를 공시하게 한다. 이 외에 총량·순량 구분(36(c))과 탄소크레딧 계획(36(e))도 있다.","trap":"'2045 탄소중립'처럼 한 줄 목표만 쓰고 어떤 가스·어떤 Scope가 포함되는지 밝히지 않으면 36(a)(b)를 충족하지 못한다.","options":["목표가 포함하는 온실가스 종류, Scope 1·2·3 중 포함 범위, 섹터별 탈탄소화 접근법 사용 여부","목표 담당 임원 이름, 목표 발표 기자회견 날짜, 목표 홍보 예산","목표 수립에 쓴 컨설팅사 이름과 계약 금액","경쟁사 목표와의 비교표"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶36","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-23","type":"judge","q":"IFRS S2 문단 6(a)(v)는 기후 관련 성과지표가 보상정책에 포함되는지, 어떻게 포함되는지 공시하라고 한다. 현대자동차 보고서 23쪽은 이 요구를 충족하는가?","ref":"IFRS S2 문단 6(a)(v)","why":"대상(CEO·권역본부장·공장장·직원)별 KPI(탄소중립 이행률, RE100 달성률, Scope 1&2 감축량 등)와 금전적 보상(상여금 산정 반영)이 표로 제시돼, 보상정책 포함 여부와 방식이 모두 드러난다.","trap":"'ESG 성과를 평가에 반영한다'는 일반 문구만으로 6(a)(v)를 충족했다고 보기 쉽다. 어떤 지표가 누구의 보상에 어떻게 연결되는지가 있어야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"CEO, 권역본부장, 공장장(생산법인장), 직원(유관 조직)의 성과평가 항목(KPIs)에 기후변화 관련 항목을 포함하고 있으며, 해당 성과평가 결과는 인센티브 및 연봉체계와 연동되어 있습니다.","page":23,"co":"hyundai","look":"23쪽 '보상' 단락과 '기후변화 성과 연계 보상' 표에서 성과평가 항목(KPI)과 인센티브·연봉 연동 서술을 확인한다.","src":{"label":"IFRS S2 (2026 issued) ¶6(a)(v)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-24","type":"judge","q":"IFRS S2 문단 10(d)는 단기·중기·장기를 어떻게 정의하는지와, 그 정의가 전략적 의사결정용 기획 기간과 어떻게 연결되는지 설명하라고 한다. 현대자동차 보고서 23쪽은 이를 충족하는가?","ref":"IFRS S2 문단 10(d)","why":"단·중·장기의 연수 정의(0–3년, 3–10년, 10–25년)는 명확히 제시되어 10(c)의 '언제'는 충족하지만, 이 구간이 회사의 전략기획 기간(중장기 사업계획 주기 등)과 어떻게 연결되는지에 대한 설명은 23쪽에 없다. 따라서 10(d)의 후반부가 빠진 '일부' 충족이다.","trap":"연수 표가 있으면 10(d)가 끝났다고 보기 쉽다. '왜 이 구간인가, 사업계획과 어떻게 연결되는가'까지 써야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"단기(0-3년) 중기(3-10년) 장기(10-25년)","page":23,"co":"hyundai","look":"23쪽 하단 '기후 위험 및 기회 관리 적용기간 및 범위' 표에서 연수 정의와, 그 구간을 왜 택했는지·전략기획과 어떻게 맞물리는지에 대한 설명이 있는지 본다.","src":{"label":"IFRS S2 (2026 issued) ¶10(d)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-25","type":"judge","q":"IFRS S2 문단 25(a)(iv)는 기후 위험을 '다른 종류의 위험과 비교해' 어떻게 우선순위를 정하는지 공시하라고 한다. 현대자동차 보고서 37쪽은 이를 충족하는가?","ref":"IFRS S2 문단 25(a)(iv)","why":"기후 동력요인들 사이의 우선순위(영향도·불확실성·적합성 평가)와 중대성에 따른 CEO·경영위원회·이사회 보고 경로는 설명돼 있으나, 기후 위험을 다른 종류의 전사 위험과 비교해 어떤 순위에 두는지는 37쪽에 서술되어 있지 않다. 식별·평가·모니터링 절차(25(a)(i)(iii)(v))는 비교적 충실하다.","trap":"기후 위험 내부의 우선순위 매트릭스를 25(a)(iv) 충족으로 간주하기 쉽다. 기준은 '다른 유형의 위험 대비(relative to other types of risk)'를 묻는다.","options":["있음","일부","없음"],"ans":1,"quote":"STEEP(Social, Technology, Economic, Environmental, Political) 구분별 동력요인(Driving Forces)을 식별했습니다. 이 중 영향도, 불확실성, 적합성 등을 평가하여 핵심 동력요인을 도출했습니다.","page":37,"co":"hyundai","look":"37쪽 '위험 및 기회 식별 및 평가방법' 단락에서 영향도·불확실성 평가가 기후 요인 간 비교인지, 전사 위험(신용·운영·시장 등)과의 비교인지 확인한다.","src":{"label":"IFRS S2 (2026 issued) ¶25(a)(iv)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-26","type":"mc","q":"한 중견 제조회사가 '정량 분석 인력이 없다'는 이유로 기후 위험이 올해 재무상태·성과에 미친 현재 영향과 미래 예상 영향 모두에 대해 정량 정보를 생략하고, 이유만 한 줄 적었다. 올바른 처리는?","ref":"IFRS S2 문단 19–21","why":"¶19의 두 조건(분리 식별 불가, 과도한 측정 불확실성)은 현재·예상 영향 모두에 적용되지만, ¶20의 기술·역량·자원 부족 사유는 예상 영향에만 적용된다. 어느 경우든 ¶21에 따라 이유 설명, 영향받을 항목·합계를 포함한 정성 정보, 가능하면 결합 재무영향 정량 정보를 제공해야 한다.","trap":"'역량 부족'을 만능 면제 사유로 쓰는 것이 가장 흔한 실수다. 이번 기간에 이미 발생한 탄소비용·재해 손실 같은 현재 영향은 역량 부족을 이유로 생략할 수 없다.","options":["기술·역량·자원 부족 사유는 두 영향 모두에 적용되므로 처리가 맞다","기술·역량·자원 부족 사유(¶20)는 '예상 영향'에만 쓸 수 있다. 현재 영향은 분리 식별 불가 또는 높은 측정 불확실성(¶19)에 해당해야 생략할 수 있고, 생략 시 ¶21에 따라 영향받을 재무제표 항목 등 정성 정보도 제공해야 한다","중견기업은 재무영향 공시 전체가 면제된다","현재 영향만 생략 가능하고 예상 영향은 반드시 숫자로 내야 한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶19–21","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-27","type":"mc","q":"한 회사는 2년 전 IEA 시나리오로 정량 시나리오 분석을 수행했고, 전략기획 주기는 5년이다. 올해 보고서에서 담당자가 '새 분석을 안 했으니 회복력 관련 공시를 통째로 전년도 문구로 복사하겠다'고 한다. 맞는 처리는?","ref":"IFRS S2 문단 22, B18","why":"B18은 시나리오 분석을 최소 전략기획 주기에 맞춰 갱신하도록 하면서도, 회복력 평가는 매년(각 보고일에) 수행하도록 한다. 새 분석이 없는 해에는 22(b)의 방법 공시가 전년과 같을 수 있지만, 22(a)의 평가 결과는 그해 상황(새 투자·규제 변화 등)을 반영해 갱신해야 하고, 분석이 수행된 보고기간을 밝혀야 한다.","trap":"'분석 갱신'과 '평가 갱신'을 같은 것으로 보는 실수다. 분석은 몇 년에 한 번일 수 있지만 평가와 공시는 매년이다.","options":["시나리오 분석은 매년 새로 수행해야 하므로 올해 다시 분석해야 한다","시나리오 분석 자체는 최소 전략기획 주기에 맞춰 갱신하면 되지만, 회복력 평가(¶22(a))는 매 보고일에 수행·갱신해야 하고, 분석을 수행한 보고기간(¶22(b)(iii))을 밝혀야 한다","5년마다 한 번 분석하면 그 사이에는 회복력 공시 전체를 생략할 수 있다","시나리오 분석은 최초 1회만 하면 영구히 유효하다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶22, B18","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-28","type":"mc","q":"석탄 화력 비중이 큰 대형 발전회사가 사내 리스크 분석팀과 충분한 예산을 갖고 있다. 담당자는 '기준이 상황에 맞게(commensurate) 하라고 했으니 정성적 서술 시나리오만 쓰겠다'고 한다. 맞는 판단은?","ref":"IFRS S2 문단 B1–B4, B17","why":"B2는 '상황'을 기후 위험·기회 노출 정도와 보유 기술·역량·자원으로 정의하고, B4는 노출이 클수록 정량적·기술적으로 정교한 접근이 필요할 가능성이 높다고 한다. B17은 노출이 크고 기술·자원에 접근할 수 있는 회사는 더 고급 정량 접근을 적용해야 한다고 명시한다. B15도 정량 정보가 보통 더 견고한 평가를 준다고 한다.","trap":"'비례성(proportionality)'을 '덜 해도 된다'는 쪽으로만 읽는 실수다. 노출이 크고 자원이 있으면 비례성은 '더 많이 하라'는 방향으로 작동한다.","options":["'상황에 맞게'는 회사 재량이므로 정성 서술만으로 충분하다","기후 위험 노출이 크고 필요한 기술·자원을 갖춘 회사는 더 고급의 정량적 시나리오 분석을 적용해야 한다(B17). 정성적 접근은 노출이 작거나 자원이 부족한 회사의 초기 단계에 적합하다","발전회사는 시나리오 분석이 면제된다","정량 분석은 금융기관에만 요구된다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) B1–B17","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-29","type":"mc","q":"한 은행이 2025년 12월 IFRS S2 개정을 조기 적용해 Scope 3 Category 15를 금융배출량으로 한정하고 파생상품 관련 배출을 제외하려 한다. 맞는 처리는?","ref":"IFRS S2 문단 29A–29C (2025년 12월 개정)","why":"2025년 12월 11일 발표된 개정은 Category 15를 대출·프로젝트파이낸스·채권·주식·미인출약정(자산운용은 운용자산 포함)에 귀속되는 금융배출량으로 한정하고 파생상품 귀속 배출을 제외하는 것을 허용한다. 사용 시 파생상품으로 취급한 것과 제외한 금융활동을 설명해야 하고, Category 15 포함 시 총량과 금융배출량 소계를 공시해야 한다. 2027년 1월 1일 이후 시작 보고기간부터 발효하며 조기 적용이 허용된다.","trap":"노출초안에 있던 '제외 금액의 정량 공시'는 최종안에서 삭제됐다. 반대로 '설명 의무'까지 없다고 생각하면 틀린다.","options":["개정은 2027년 1월 1일 이후 시작하는 보고기간부터만 적용 가능하고 조기 적용은 금지된다","한정·제외는 허용되며(¶29A), 무엇을 파생상품으로 봤는지와 Category 15에서 제외한 금융활동을 설명해야 하고(¶29B), Category 15를 포함했다면 Category 15 총량과 그 안의 금융배출량 소계를 공시해야 한다(¶29C). 조기 적용은 허용된다","파생상품 제외는 가능하지만 별도 설명 없이 조용히 빼면 된다","금융배출량 한정은 자산운용사에만 허용된다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶29A–29C","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-31","type":"mc","q":"한 식품회사가 ¶29(c) '물리적 위험에 취약한 자산 금액·비율'을 공시하면서, 분모는 재무제표 유형자산 장부금액을 쓰고 분자(침수 위험 공장 가치)는 보험사의 재조달가액 평가를 썼다. 또 어떤 시간 범위 기준으로 '취약'을 판단했는지는 쓰지 않았다. 맞는 지적은?","ref":"IFRS S2 문단 29(c), 30, B65","why":"¶29(c)는 물리적 위험에 취약한 자산·사업활동의 금액과 비율을 요구하고, ¶30은 합리적이고 뒷받침 가능한 정보를 쓰라고 한다. B65는 이 지표 작성 시 ¶10의 시간 범위, ¶13의 집중 위치, ¶16(a)(b)의 재무영향, ¶32의 산업별 지표로 충족 가능성, 그리고 관련 재무제표와의 연계(일관된 데이터·가정 사용)를 고려하라고 한다.","trap":"지표 장을 재무팀과 따로 만들어 장부금액과 평가액이 섞이는 경우가 많다. IFRS S1·S2의 핵심은 재무제표와의 연결성이다.","options":["기준이 산식을 정하지 않으므로 아무 문제가 없다","B65는 이 지표를 만들 때 재무제표와 일관된 데이터·가정을 쓰고(연계성), 단·중·장기 정의(¶10)와 집중 위치(¶13), 재무영향(¶16)과 연결하도록 한다. 분자·분모의 평가 기준 불일치와 시간 범위 미기재는 보완이 필요하다","29(c)는 비율만 공시하면 되고 금액은 필요 없다","물리적 위험 취약 자산은 보험 가입 자산만 포함한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶29–31, B64–B65","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-32","type":"mc","q":"한 정유회사가 시나리오 분석에서 특정 정제설비의 손상 가능성을 확인했지만, 재무영향 공시에는 '장기적으로 전환 위험이 있다'고만 썼다. IFRS S2 문단 16(b) 관점에서 보완해야 할 것은?","ref":"IFRS S2 문단 16(b)","why":"¶16(b)는 다음 연차 보고기간 내에 재무제표에 보고된 자산·부채의 장부금액에 중요한 조정을 초래할 상당한 위험이 있는 기후 위험·기회를 공시하게 한다. 시나리오 분석 결과와 재무제표의 손상 검토를 연결해, 어떤 자산이 어떤 위험에 노출됐는지 쓰는 것이 핵심이다.","trap":"'장기 위험'이라는 표현으로 뭉개는 것이다. 16(b)는 특히 '향후 1년 내' 장부금액 조정 가능성이라는 짧은 시간축을 묻는다.","options":["보완 불필요. 손상 여부는 회계기준(IAS 36)만의 문제다","다음 연차 보고기간 안에 자산·부채 장부금액에 중요한 조정이 생길 상당한 위험이 있는 기후 위험·기회를 식별해 정량·정성으로 공시해야 한다","손상 금액을 확정하기 전까지는 어떤 언급도 하면 안 된다","16(b)는 금융기관의 대출자산에만 적용된다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶16(b)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ghgp-01","type":"mc","q":"한 회사가 해외 소규모 창고 세 곳의 연료 사용 배출을 인벤토리에서 빼면서, 보고서에 그 사실과 이유를 적었다. 이 처리와 가장 직접 관련된 GHG 프로토콜 원칙은 무엇인가?","ref":"GHG 프로토콜 기업 표준 1장 (원칙)","why":"완전성 원칙은 경계 안의 모든 배출원을 넣는 것이 기본이고, 어쩔 수 없이 빼는 것이 있으면 '무엇을, 왜' 뺐는지 밝히라고 한다. 제외 자체를 금지하는 것이 아니라 투명한 제외를 요구한다.","trap":"초보자는 작은 배출원 제외를 '정확성'이나 '관련성' 문제로 보기 쉽지만, 표준은 제외의 공개·정당화를 완전성 원칙 아래 둔다.","options":["관련성 — 이용자의 판단에 필요한 정보만 담으면 된다","완전성 — 경계 안의 모든 배출원을 담고, 특정 제외는 밝히고 이유를 대야 한다","일관성 — 매년 같은 창고를 빼면 문제없다","정확성 — 작은 배출원은 정확성에 영향이 없으므로 자유롭게 뺄 수 있다"],"ans":1,"src":{"label":"GHG Protocol Corporate Standard ch.1","url":"https://ghgprotocol.org/sites/default/files/standards/ghg-protocol-revised.pdf"}},{"id":"ghgp-02","type":"mc","q":"GHG 프로토콜 기업 표준에서 '지분 접근법(equity share approach)'으로 조직 경계를 정하면 어떤 배출을 자기 것으로 세는가?","ref":"GHG 프로토콜 기업 표준 3장","why":"지분 접근법은 경제적 이익의 비율, 보통은 지분율대로 배출을 나눠 센다. 100% 또는 0%로 세는 것은 통제 접근법이다.","trap":"재무제표의 연결 범위(100% 연결)와 지분법 회계를 섞어 생각하면 틀린다. 지분 접근법은 재무 연결과 달리 지분율 비례로만 센다.","options":["운영 정책을 좌우하는 사업의 배출 100%","재무 정책을 좌우하는 사업의 배출 100%","각 사업에 가진 지분율(경제적 이익 비율)만큼의 배출","연결재무제표에 들어가는 자회사의 배출 100%와 관계회사 배출 50%"],"ans":2,"src":{"label":"GHG Protocol Corporate Standard ch.3","url":"https://ghgprotocol.org/sites/default/files/standards/ghg-protocol-revised.pdf"}},{"id":"ghgp-05","type":"mc","q":"회사가 전기를 구매해 쓴다. 다음 중 Scope 2가 아니라 Scope 3 Cat 3(연료·에너지 관련 활동)에 들어가는 배출은 무엇인가?","ref":"Scope 3 기술 지침 Cat 3 표 3.1","why":"구매 전기의 발전 연소 배출은 Scope 2이고, 그 연료를 캐고 운반하는 상류 배출과 송배전 손실분의 발전 배출은 Cat 3로 '최종 사용자'가 보고한다. 자기 설비·차량의 연료 연소는 Scope 1이다.","trap":"T&D 손실을 Scope 2에 더해 버리거나, 반대로 발전 배출 자체를 Cat 3에 넣어 이중 계산하는 실수가 흔하다. Cat 3는 'Scope 1·2에 아직 안 들어간' 에너지 관련 배출만 담는다.","options":["구매한 전기를 발전소에서 만들 때 나온 연소 배출","송배전 과정에서 손실된 전기를 만들 때 나온 배출(T&D 손실)","회사 보일러에서 LNG를 태울 때 나온 배출","회사 소유 차량이 쓴 경유의 연소 배출"],"ans":1,"src":{"label":"Scope 3 Technical Guidance Cat 3","url":"https://ghgprotocol.org/sites/default/files/standards/Scope3_Calculation_Guidance_0.pdf"}},{"id":"ghgp-07","type":"mc","q":"2015년 Scope 2 지침에 따라 지역 기반과 시장 기반 두 방법으로 모두 보고해야(shall) 하는 회사는 어떤 회사인가?","ref":"GHG 프로토콜 Scope 2 지침 (이중 보고 요건)","why":"이중 보고 의무는 '재생에너지를 샀는지'가 아니라 '시장에 계약 수단 정보가 있는지'로 정해진다. 재생에너지를 전혀 사지 않아도 공급사 계수나 잔여 믹스가 있는 시장이면 두 숫자를 다 내야 한다.","trap":"'우리는 REC를 안 샀으니 지역 기반 하나만 내면 된다'는 판단이 가장 흔한 오류다. 계약 정보가 없으면 시장 기반 숫자에 잔여 믹스나 지역 평균 계수를 쓰면 된다.","options":["재생에너지 인증서(REC)를 실제로 구매한 회사만","계약 수단(공급사 배출계수·인증서 등) 정보가 제공되는 시장에서 사업을 하는 모든 회사","연간 전력 사용량이 1GWh를 넘는 회사만","상장회사만"],"ans":1,"src":{"label":"GHG Protocol Scope 2 Guidance Executive Summary","url":"https://ghgprotocol.org/sites/default/files/Scope2_ExecSum_Final.pdf"}},{"id":"ghgp-10","type":"mc","q":"한 회사가 보고연도 7월 1일에 다른 회사의 공장을 인수했다. 이 인수가 유의성 기준을 넘는다면, 기준연도와 당해연도 배출량은 어떻게 처리해야 하는가?","ref":"GHG 프로토콜 기업 표준 5장","why":"연중 구조 변화가 있으면 기준연도와 당해연도 모두 '1년 전체'로 재산정하라고 권고한다. 그래야 다음 해에 또 재산정하는 일을 피하고 비교 일관성이 유지된다.","trap":"회계처럼 인수 시점 이후 기간만 더하면 기준연도와 당해연도의 경계가 어긋나 감축률이 왜곡된다.","options":["기준연도는 그대로 두고, 당해연도에는 7~12월 배출만 더한다","기준연도와 당해연도 모두 그 공장의 '1년 전체' 배출을 넣어 재산정한다","기준연도만 재산정하고 당해연도는 7~12월 배출만 넣는다","다음 연도부터 반영하고 당해연도는 반영하지 않는다"],"ans":1,"src":{"label":"GHG Protocol Corporate Standard ch.5","url":"https://ghgprotocol.org/sites/default/files/standards/ghg-protocol-revised.pdf"}},{"id":"ghgp-14","type":"mc","q":"운영통제 접근법을 쓰는 회사가 영업용 차량 300대를 리스로 빌려 직접 운행한다. 이 차량의 연료 연소 배출은 어디에 보고하는가?","ref":"GHG 프로토콜 Scope 3 FAQ (임차 자산)","why":"통제 접근법에서는 소유하지 않아도 통제하는 자산은 Scope 1·2에 들어간다. Cat 8은 조직 경계 때문에 Scope 1·2에서 빠진 임차 자산만 담는 자리다. 그래서 운영통제를 쓰는 회사의 Cat 8은 대개 0이거나 매우 작고, 그 사실을 밝히면 된다.","trap":"'리스 = 남의 자산 = Scope 3'로 단순화하면 Scope 1이 과소, Cat 8이 과대 계산된다. 먼저 조직 경계(통제 여부)를 보고, 거기서 빠진 것만 Cat 8로 보낸다.","options":["Scope 3 Cat 8(업스트림 임차 자산) — 소유하지 않으므로 항상 Scope 3이다","Scope 1 — 운영통제 접근법에서는 소유 여부가 아니라 통제 여부로 정해지므로 직접 운행하는 리스 차량은 Scope 1이다","Scope 3 Cat 13(다운스트림 임대 자산)","Scope 2 — 외부에서 빌린 자산의 배출은 간접 배출이다"],"ans":1,"src":{"label":"GHG Protocol Scope 3 FAQ","url":"https://ghgprotocol.org/scope-3-frequently-asked-questions"}},{"id":"ghgp-15","type":"mc","q":"의류 회사가 Cat 11(판매된 제품의 사용)을 산정한다. 옷을 세탁·건조할 때 소비자가 쓰는 전기·물 가열 배출은 Scope 3 표준에서 어떻게 다루는가?","ref":"Scope 3 기술 지침 Cat 11 표 11.1","why":"제품이 사용 중 연료·전기를 '직접' 소비하거나 온실가스를 내뿜으면 직접 사용 단계 배출로 필수다. 옷처럼 제품 자체는 에너지를 쓰지 않지만 사용 과정에서 세탁 등으로 에너지가 들어가면 간접 사용 단계 배출로 선택 사항이다.","trap":"자동차·가전은 직접, 의류·식품·세제는 간접이라는 구분을 놓치고 모두 필수로 보거나 모두 빼는 실수가 많다. 간접을 포함할 때는 '선택 포함'임을 밝혀야 비교 가능성이 유지된다.","options":["직접 사용 단계 배출이므로 최소 경계에 포함해 반드시 산정한다","간접 사용 단계 배출이므로 산정은 선택(optional)이며, 포함하면 전형적 사용 프로필을 만들어 계산한다","제품이 에너지를 직접 쓰지 않으므로 Cat 11은 해당 없음으로 처리한다","Cat 12(판매된 제품의 폐기)에 포함한다"],"ans":1,"src":{"label":"Scope 3 Technical Guidance ch.11 (Use of Sold Products)","url":"https://ghgprotocol.org/sites/default/files/standards_supporting/Chapter11.pdf"}},{"id":"ghgp-22","type":"judge","q":"Scope 3 표준은 최소 경계 안의 배출을 빼려면 그 사실과 이유를 밝히라고 한다. 현대자동차 2026 지속가능성 보고서는 Cat 8(임차 자산)을 '-'로 표시했는데, 그 이유를 조직 경계 원칙과 연결해 설명하고 있는가?","ref":"GHG 프로토콜 Scope 3 표준 (제외의 공개·정당화)","why":"운영통제 접근법을 쓰면 직접 운영하는 임차 자산은 Scope 1·2에 들어가므로 Cat 8이 비는 것이 정상이다. 보고서는 그 논리(조직 경계 원칙, 중복 산정 방지)를 명시해 '제외의 공개·정당화' 요건을 충족한다.","trap":"Cat 8이 '-'인 것을 '누락'으로 지적하면 틀린 리뷰다. 먼저 조직 경계 접근법(p.38: 운영통제)을 확인하고 그 논리와 맞는지 보아야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"현대자동차가 임차하여 운영하는 자산에서 발생하는 배출량은 회사의 조직 경계 설정 원칙에 따라 이미 Scope 1 및 Scope 2에 포함되어 있으므로, 중복 산정을 방지하기 위해 본 카테고리에서는 제외하였습니다.","page":40,"co":"hyundai","look":"p.40 '투입변수 및 가정 – Scope 3'의 Category 8 설명","src":{"label":"GHG Protocol Scope 3 FAQ","url":"https://ghgprotocol.org/scope-3-frequently-asked-questions"}},{"id":"ghgp-26","type":"mc","q":"한 제조회사가 운영통제 접근법으로 Scope 1·2를 보고한다. 이 회사는 합작회사 J(지분 45%, 파트너가 운영)와 상장 관계회사 K(지분 20%)를 갖고 있다. Cat 15 처리로 맞는 것은?","ref":"Scope 3 기술 지침 Cat 15","why":"통제 접근법을 쓰면 통제 밖 지분 투자는 Scope 1·2에서 빠지므로 Cat 15에 '피투자회사 Scope 1+2 × 지분율'로 넣는다. Cat 15가 금융기관을 '주로' 겨냥한 것은 맞지만, 투자 자산이 있는 모든 회사에 적용된다. 피투자회사의 Scope 3가 유의하면 포함을 검토해야 한다.","trap":"반대로 지분 접근법을 쓰는 회사는 지분 투자가 이미 Scope 1·2에 지분율로 들어가므로 같은 것을 Cat 15에 또 넣으면 회사 내 이중 계산이다. 조직 경계 접근법에 따라 Cat 15의 내용이 달라진다.","options":["J·K 모두 Scope 1·2에 지분율만큼 넣고 Cat 15는 보고하지 않는다","J·K의 Scope 1+2에 각각 45%·20%를 곱해 Cat 15에 넣고, 유의하면 피투자회사의 Scope 3도 포함을 검토한다","Cat 15는 금융기관 전용이므로 제조회사는 해당 없음으로 표시한다","J는 지분이 45%로 크므로 Scope 1·2에 100% 넣고, K만 Cat 15에 넣는다"],"ans":1,"src":{"label":"Scope 3 Technical Guidance ch.15 (Investments)","url":"https://ghgprotocol.org/sites/default/files/standards_supporting/Chapter15.pdf"}},{"id":"ghgp-27","type":"mc","q":"운영통제 접근법을 쓰는 회사가 본사 건물의 3개 층을 외부 회사에 임대했다. 임차인이 자기 사무실의 전기 계약과 운영을 직접 한다. 이 3개 층의 전기 사용 배출은 임대인 회사의 어디에 보고하는가?","ref":"GHG 프로토콜 Scope 3 FAQ (임대 자산)","why":"통제 접근법에서는 소유해도 운영을 통제하지 않으면 Scope 1·2에서 빠지고, 빌려준 쪽(lessor)이므로 Cat 13에 들어간다. 임차인이 같은 배출을 Scope 2로 보고하는 것은 회사 간 중복으로 허용된다. 현대차도 임대 면적 비율로 Scope 1·2를 할당해 Cat 13을 산정한다.","trap":"'소유 = Scope 1·2'로 보는 것이 가장 흔한 실수다. 통제 접근법은 소유가 아니라 통제를 묻는다. 반대로 임대인이 공용 설비(중앙 냉난방)를 직접 운영하면 그 부분은 임대인의 Scope 1·2다.","options":["Scope 2 — 건물 소유자이므로 건물 전체 전기가 Scope 2다","Scope 3 Cat 13(다운스트림 임대 자산) — 소유하지만 운영을 통제하지 않는 자산의 배출이다","Scope 3 Cat 8(업스트림 임차 자산)","보고하지 않는다 — 임차인이 자기 Scope 2로 보고하므로 이중 계산이다"],"ans":1,"src":{"label":"GHG Protocol Scope 3 FAQ","url":"https://ghgprotocol.org/scope-3-frequently-asked-questions"}},{"id":"ghgp-32","type":"judge","q":"Scope 3 표준은 최소 경계 안의 활동을 빼려면 제외 사실과 이유를 밝히라고 한다. 현대자동차는 2024년 568,043 tCO2e를 보고했던 Cat 9(다운스트림 운송·유통)를 2025년부터 산정하지 않는다. 보고서에 그 제외와 이유가 적혀 있는가?","ref":"GHG 프로토콜 Scope 3 표준 (최소 경계 제외의 공개·정당화)","why":"제외 사실과 이유(시장 구조 차이, 데이터 가용성·신뢰성)가 명시되어 공개 요건은 충족한다. 다만 컨설턴트는 이 제외가 2024년 기준 Scope 3 총량의 약 0.3% 수준이라는 규모 정보와, 데이터 한계가 '산정 불가'가 아니라 '추정 가능'은 아닌지(평균 데이터·지출 기반 등)를 함께 검토·권고해야 한다.","trap":"'제외 사유가 적혀 있으니 끝'으로 보는 것과, 반대로 '최소 경계 제외는 무조건 위반'으로 보는 것 둘 다 틀리다. 표준은 공개·정당화를 조건으로 제외를 허용하되, 특정 카테고리의 선택적 제외가 반복되면 완전성 원칙 문제로 지적한다.","options":["있음","일부","없음"],"ans":0,"quote":"지역별 시장 구조의 차이와 데이터 가용성 및 신뢰성의 한계로 인해, 2025년부터 본 카테고리에 대한 배출량은 산정하지 않습니다.","page":40,"co":"hyundai","look":"p.40 Category 9. 다운스트림 운송 및 유통 설명 (수치는 p.38 표)","src":{"label":"GHG Protocol Scope 3 Standard §5.4","url":"https://ghgprotocol.org/sites/default/files/standards/Corporate-Value-Chain-Accounting-Reporing-Standard_041613_2.pdf"}},{"id":"physical-02","type":"mc","q":"IFRS S2 부록 A의 정의에 따를 때 '만성 물리적 위험'에 해당하는 것은?","ref":"IFRS S2 부록 A 정의","why":"IFRS S2는 물리적 위험을 사건 중심의 급성 위험(폭풍·홍수·가뭄·폭염)과 장기 기후 패턴 변화에서 오는 만성 위험(해수면 상승, 물 가용성 감소, 생물다양성 손실, 토양 생산성 변화)으로 나눈다. 탄소가격은 전환 위험이다.","trap":"가뭄과 폭염을 만성으로 분류하는 실수가 잦다. IFRS S2 정의문은 가뭄·폭염을 급성 위험의 예로 든다(다만 '장기적 기온 상승 추세'는 만성이다).","options":["태풍으로 공장 지붕이 파손되는 위험","집중호우로 창고가 침수되는 위험","해수면 상승으로 해안 부지의 사용 가능성이 줄어드는 위험","탄소가격 도입으로 비용이 늘어나는 위험"],"ans":2,"src":{"label":"AASB S2 Appendix A (IFRS S2 동일 정의)","url":"https://standards.aasb.gov.au/node/7236"}},{"id":"scenario-03","type":"mc","q":"IFRS S2 부록 A의 정의에 따를 때, 다음 중 '만성(chronic)' 물리 리스크에 해당하는 것은?","ref":"IFRS S2 부록 A 정의","why":"부록 A는 급성 리스크를 폭풍·홍수·가뭄·폭염 같은 '사건 중심' 리스크로, 만성 리스크를 강수·기온 패턴의 장기 변화로 해수면 상승이나 물 가용량 감소를 낳는 리스크로 정의한다. 장기 패턴 변화가 핵심 구분점이다.","trap":"'폭염=만성'이라고 외우는 실수가 있다. 폭염 사건 자체는 급성이고, 평균기온이 장기적으로 오르는 것이 만성이다.","options":["태풍으로 공장 지붕이 파손되는 것","집중호우로 생산라인이 침수되는 것","강수 패턴이 장기적으로 바뀌어 공장 지역의 물 가용량이 줄어드는 것","폭염 사건으로 하루 작업이 중단되는 것"],"ans":2,"src":{"label":"AASB S2 Appendix A (IFRS S2 정의 동일)","url":"https://standards.aasb.gov.au/node/3846"}},{"id":"scenario-09","type":"mc","q":"IFRS S2는 기후 회복력 평가에 어떤 시나리오를 쓰라고 요구하는가?","ref":"IFRS S2 문단 22(b), B11–B13","why":"ISSB 자료는 S2가 '사용할 시나리오를 규정하지 않는다'고 분명히 한다. 대신 문단 22(b)(i)에서 사용 시나리오와 출처, 다양한 범위인지, 전환·물리 관련성, 최신 국제협정 부합 시나리오 사용 여부, 선택 이유, 시간 범위, 적용 사업 범위를 공시하게 한다. B11–B13은 회사 활동·위치에 맞는 합리적 근거가 있으면 된다고 설명한다.","trap":"'최신 국제협정 부합 시나리오를 써야 한다'로 읽는 실수다. 요구는 '썼는지 여부를 밝히는 것'이며, 안 썼으면 안 썼다고 공시하면 된다.","options":["반드시 1.5°C 시나리오와 4°C 시나리오 두 개를 써야 한다","특정 시나리오를 지정하지 않는다. 다만 어떤 시나리오를 어디서 가져왔는지, 전환·물리 중 무엇과 관련되는지, 최신 국제 기후협정에 부합하는 시나리오를 썼는지 여부, 왜 그 시나리오가 적절한지 등을 공시해야 한다","IEA NZE 하나만 쓰면 된다","NGFS 7개 시나리오를 모두 써야 한다"],"ans":1,"src":{"label":"ISSB 웹캐스트 슬라이드: 기후 회복력","url":"https://www.ifrs.org/content/dam/ifrs/supporting-implementation/ifrs-s2/webcast-slides-climate-resilience-scenario-analysis.pdf"}},{"id":"scenario-10","type":"mc","q":"한 회사가 예상 재무영향을 정량으로 내기에 측정 불확실성이 너무 크다고 판단해 IFRS S2 문단 19를 적용하려 한다. 이때 반드시 함께 해야 하는 것은?","ref":"IFRS S2 문단 19–21","why":"문단 19(따로 식별 불가 또는 측정 불확실성 과다)나 20(기술·역량·자원 부족)에 의존하면 문단 21에 따라 (a) 이유 설명, (b) 영향받는 재무제표 항목을 밝힌 정성 정보, (c) 결합 효과의 정량 정보(유용하지 않으면 제외)를 제공해야 한다. 정량 생략은 '면제'가 아니라 '대체 공시'다.","trap":"문단 19·20을 '정량 안 해도 된다'로 끝내는 실수다. 2025년 8월 ISSB 글은 정량 정보가 투자자에게 핵심이며, 정성만으로는 유용성이 떨어진다고 강조한다.","options":["아무 설명 없이 해당 항목을 비워 두면 된다","정량 정보를 내지 않는 이유를 설명하고, 영향받을 재무제표 항목·합계·소계를 짚어 정성 정보를 제공하며, 다른 요인과 합친 결합 효과의 정량 정보는 유용하지 않은 경우가 아니면 제공해야 한다","외부 감사인의 확인서를 첨부해야 한다","다음 연도부터는 반드시 정량으로 공시하겠다고 약속해야 한다"],"ans":1,"src":{"label":"AASB S2 본문 (IFRS S2 동일)","url":"https://standards.aasb.gov.au/node/3844"}},{"id":"scenario-25","type":"judge","q":"IFRS S2 문단 22(b)(ii)는 시나리오 분석의 핵심 가정(기후정책, 거시경제 추세, 지역 변수, 에너지 사용·믹스, 기술 가정 등)을 공시하도록 한다. 현대자동차의 전환 시나리오 분석(배출권거래제 배출부채 추정)은 사용한 핵심 가정을 구체적으로 밝혔는가?","ref":"IFRS S2 문단 22(b)(ii)","why":"무상할당 70%와 '집약도 유지'라는 가정은 밝혔지만, 시나리오별 배출권 가격 전망치, 생산량·판매량 가정, 적용 환율 등 결과를 재현하는 데 필요한 숫자는 없다. 가정의 방향은 알 수 있으나 투자자가 959억–3,318억이라는 폭을 검증할 수는 없으므로 '일부'다.","trap":"'가정'이라는 단어가 한 번 나오면 요건을 채웠다고 보는 실수다. 22(b)(ii)의 취지는 결과를 이해·검증할 수 있을 만큼의 입력값 공개다.","options":["있음","일부","없음"],"ans":1,"quote":"향후 배출권 가격 전망에 따라 기존 집약도(대당 배출량)를 유지할 경우, 2035년 기준(70% 무상할당 가정) 약 최소 959억 원에서 최대 3,318억 원의 배출부채 발생이 예상됩니다.","page":34,"co":"hyundai","look":"p.34 '배출권 거래제 규제 강화' 위험 요인 설명","src":{"label":"AASB S2 본문 22(b) (IFRS S2 동일)","url":"https://standards.aasb.gov.au/node/3844"}},{"id":"scenario-27","type":"mc","q":"연안 저지대에 대형 생산시설 여럿을 두고 배출권거래제 대상이기도 한 대기업이, 전담 ESG팀과 외부 컨설팅 예산을 갖고 있으면서도 '시나리오 분석은 정성적 서술로만 수행했다'고 IFRS S2 보고서에 썼다. 맞는 판단은?","ref":"IFRS S2 B2–B7, B17","why":"B2–B7은 접근법이 회사의 노출도와 기술·역량·자원에 비례해야 한다고 하고, B17은 노출도가 높고 필요한 역량·자원에 접근할 수 있는 회사는 더 진전된 정량적 접근을 '적용해야 한다(is required)'고 명시한다. 비례성은 아래로만 열려 있는 문이 아니다.","trap":"'합리적이고 뒷받침되는 정보'와 '과도한 비용·노력 없이'라는 문구를 면제 조항처럼 쓰는 실수다. 공개된 권위 있는 시나리오는 과도한 비용 없이 얻을 수 있는 정보로 간주된다(B11–B13).","options":["IFRS S2는 정성 분석도 허용하므로 문제없다","노출도가 높고 기술·역량·자원도 있는 회사는 B17에 따라 '더 진전된 정량적 접근'을 적용해야 한다. 정성만 쓰는 선택은 노출도가 낮거나 역량이 부족한 회사에 허용되는 것이며, 역량이 없다면 그 사실과 향후 계획을 밝혀야 한다","물리 리스크만 정량으로 하고 전환 리스크는 정성으로 해도 된다","외부 컨설턴트를 쓰면 정성 분석도 정량으로 인정된다"],"ans":1,"src":{"label":"AASB S2 Appendix B B1, B17 (IFRS S2 동일)","url":"https://standards.aasb.gov.au/node/3847"}},{"id":"korea-03","type":"mc","q":"배출권거래제 할당대상업체로 의무 지정되는 기준은?","ref":"배출권거래법 제8조","why":"배출권거래법 제8조는 최근 3년 연평균 배출량 12만 5,000 tCO2-eq 이상인 업체, 또는 2만 5,000 tCO2-eq 이상인 사업장을 하나라도 가진 업체를 계획기간 시작 5개월 전까지 지정·고시하도록 한다. 작은 사업장 여러 개를 가진 회사도 합계가 12만 5,000톤을 넘으면 대상이 된다.","trap":"'사업장 하나가 2만 5,000톤 미만이면 안전하다'고 보고 업체 합계 기준(12만 5,000톤)을 빠뜨리는 실수가 흔하다.","options":["최근 1년 배출량이 업체 10만 톤 이상","최근 3년 연평균 배출량이 업체 12만 5,000톤 이상이거나, 2만 5,000톤 이상인 사업장을 가진 업체","최근 3년 연평균 배출량이 업체 5만 톤 이상이거나 사업장 1만 5,000톤 이상","에너지 사용량이 연 500 TJ 이상인 업체"],"ans":1,"src":{"label":"배출권거래법 제8조(법률 제21071호)","url":"https://www.taxcanvas.kr/core/law/0116122025102821071/history/2026-04-29"}},{"id":"korea-04","type":"mc","q":"제4차 계획기간부터 배출권거래제의 할당 부문 구분은 어떻게 바뀌었나?","ref":"제4차 배출권거래제 기본계획(2024.12)","why":"제4차 기본계획은 기존 6개 부문을 '발전'과 '발전 외' 2개 부문으로 단순화했다. 4차 계획기간(2026~2030)은 이 두 부문에 각각 다른 유상할당 비율과 감축 경로를 적용한다.","trap":"3차 계획기간 자료(6개 부문 표)를 그대로 쓰면 4차 할당계획의 부문별 캡 숫자와 맞지 않는다.","options":["전환·산업·건물·수송·폐기물·공공기타 6개 부문을 유지한다","발전 부문과 발전 외 부문 2개로 단순화됐다","제조업과 비제조업 2개로 나뉜다","부문 구분을 없애고 업체별로만 할당한다"],"ans":1,"src":{"label":"정책브리핑 — 제4차 배출권거래제 기본계획","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148938103"}},{"id":"korea-17","type":"mc","q":"2025년 2월 7일 시행된 배출권거래법 시행령 개정으로 할당취소 기준은 어떻게 바뀌었나?","ref":"배출권거래법 시행령 개정(2025.2.7 시행)","why":"개정 전에는 배출량이 할당량의 50% 이하로 떨어져야 취소할 수 있었다. 개정으로 15% 이상 감소 시 취소가 가능해졌고, 감소 폭 15~25%는 할당의 50%, 25~50%는 75%, 50% 이상은 100%를 취소한다. 2022년 태풍으로 제철소가 멈춘 뒤 남은 배출권을 판 사례가 배경이다.","trap":"'생산이 줄면 남는 배출권을 팔아 이익'이라고 조언하면 틀린다. 15% 이상 감소분은 상당 부분 취소된다.","options":["배출량이 할당량의 50% 이하로 떨어진 경우에만 취소 가능(변경 없음)","배출량이 할당량보다 15% 이상 줄면 취소 가능하고, 감소 폭에 따라 50%·75%·100%를 단계적으로 취소","배출량이 조금이라도 줄면 그만큼 전부 취소","할당취소 제도가 폐지됐다"],"ans":1,"src":{"label":"법무법인 화우 — 시행령 개정안 해설(할당취소 단계)","url":"https://www.hwawoo.com/newsletter/2024_09_19_1/240919_k_e.pdf"}},{"id":"korea-19","type":"mc","q":"2025년 2월 7일 시행된 시행령 개정으로 배출권 시장에 새로 참여할 수 있게 된 주체는?","ref":"배출권거래법 시행령 개정(2025.2.7 시행)","why":"기존 참여자는 할당대상업체, 시장조성자, 배출권거래중개회사 정도였는데, 개정으로 집합투자업자·은행·보험사·기금관리자 등이 추가됐고 개인 참여의 근거도 마련됐다. 다만 2026년 5월 기준 금융기관 참여는 아직 제한적이라는 평가다.","trap":"'개인도 바로 참여 가능'이라고 말하면 틀린다. 개인은 근거만 마련된 단계다.","options":["개인 투자자 누구나","집합투자업자(자산운용사), 은행, 보험사, 기금관리자","외국 정부","할당대상업체의 임직원 개인"],"ans":1,"src":{"label":"법무법인 화우 — 시행령 개정안(참여자 확대)","url":"https://www.hwawoo.com/newsletter/2024_09_19_1/240919_k_e.pdf"}},{"id":"korea-27","type":"mc","q":"한 철강회사 재무팀이 '2026년 4월 29일 시행된 배출권거래법 개정으로 무상할당이 바로 폐지되는 것 아니냐'고 묻는다. 맞는 설명은?","ref":"배출권거래법 개정(법률 제21071호, 2026.4.29 시행)","why":"개정 법 제12조는 '배출권의 할당은 유상으로 함을 원칙'으로 하고 무상할당비율은 '직전 계획기간의 무상할당비율을 초과할 수 없다'고 정했다. 이는 방향을 못 박은 것이고, 실제 비율은 할당계획이 정한다. 4차 할당계획은 철강·석유화학·시멘트 등을 100% 무상으로 두었으며, 5차(2031~)에서 탄소누출 업종의 유상 전환을 검토한다.","trap":"법 조문의 '원칙'과 할당계획의 실제 비율을 구분하지 않고 고객에게 즉시 비용 발생을 경고하거나, 반대로 '우리는 무상이니 영원히 안전'이라고 안심시키는 양쪽 실수가 모두 있다.","options":["모든 무상할당이 2026년부터 즉시 폐지된다","유상할당이 '원칙'이 되고 계획기간마다 '총 무상할당비율'을 정하되 직전 계획기간보다 높일 수 없게 됐을 뿐, 4차 할당계획상 철강 등 탄소누출 업종은 100% 무상이 유지된다","법 개정은 발전부문에만 적용된다","무상할당 비율은 각 기업이 신청해 정한다"],"ans":1,"src":{"label":"배출권거래법 제12조(법률 제21071호, 2026.4.29 시행)","url":"https://www.taxcanvas.kr/core/law/0116122025102821071/history/2026-04-29"}},{"id":"korea-28","type":"mc","q":"한 할당대상업체가 2026년 주력 사업장을 매각해 2026년 배출량이 2,400톤으로 급감했다. 2027년 이후 이 회사의 K-ETS 의무에 대해 맞는 조언은?","ref":"배출권거래법 시행령 개정(2026.4.29 시행)","why":"개정 전에는 계획기간 중간에 빠질 근거가 없어 배출이 거의 없어도 5년 내내 MRV 의무를 졌다. 2026년 4월 29일 시행 시행령은 사업장 폐쇄·매각 등으로 전년 배출량이 3,000 tCO2-eq 미만이 되면 제외할 수 있게 했다. 한편 남은 배출권은 할당취소(15% 이상 감소 시 단계적 취소) 대상이 되므로 '전부 매각'은 틀린 조언이다.","trap":"","options":["계획기간(2030년)까지는 무조건 명세서 보고·배출권 제출 의무가 남는다","2026년 4월 29일 시행된 시행령에 따라 전년 배출량이 3,000톤 미만이면 계획기간 중에도 할당대상에서 제외될 수 있으므로 제외 절차를 검토한다","배출량이 줄었으니 할당받은 배출권을 전부 팔아도 된다","목표관리제로 자동 전환된다"],"ans":1,"src":{"label":"헤럴드경제 — 3,000톤 미만 급감 시 제외(2026.4.20)","url":"https://www.heraldk.com/article/2026042017520851772"}},{"id":"korea-30","type":"mc","q":"현대자동차의 2025년 국내 Scope 2는 지역기반 1,084,648 tCO2-eq, 시장기반 1,084,521 tCO2-eq로 공시됐다. 두 숫자가 다른 이유와 K-ETS 명세서에 들어가는 값에 대한 맞는 설명은?","ref":"현대자동차 온실가스 검증의견서(2025년도)","why":"검증의견서는 '지역기반은 국가 전력망을 기준으로 한 Scope 2', '시장기반은 GHG 프로토콜을 적용하며 PPA 재생에너지 전력량을 반영'하고, 공표된 잔여배출계수가 없어 잔여 전력에는 국내 전력배출계수를 적용했다고 설명한다. K-ETS 명세서는 국가 계수 기반(지역기반)이므로, 기후공시에서 시장기반 숫자를 내려면 명세서 숫자와의 차이(127 t)를 설명해야 한다.","trap":"공시의 시장기반 Scope 2를 명세서 값과 '같다'고 쓰거나, PPA를 K-ETS 명세서에서도 차감할 수 있다고 오해하는 실수가 있다.","options":["시장기반이 K-ETS 명세서 값이고, 지역기반은 참고용이다","지역기반은 국가 전력망 계수를 적용한 값으로 K-ETS 명세서 기준이며, 시장기반은 GHG 프로토콜에 따라 재생에너지 PPA 전력량을 반영한 값이다","둘의 차이는 해외 법인 배출량 때문이다","둘의 차이는 검증기관이 달라서 생긴 오차다"],"ans":1},{"id":"korea-31","type":"judge","q":"기후공시 기준은 규제(배출권거래제 등)로 인한 전환위험과 예상 재무영향을 설명하도록 요구한다. 현대자동차 2026 지속가능성 보고서는 K-ETS로 인한 비용 위험을 금액과 가정을 붙여 공시했는가?","ref":"IFRS S2 전략 — 기후 관련 위험이 재무에 미치는 영향","why":"보고서는 K-ETS 대상임을 밝히고, 70% 무상할당 가정과 배출권 가격 시나리오를 붙여 2035년 배출부채를 959억~3,318억 원으로 범위 공시했다. 반대로 감축 로드맵 이행 시 잉여 배출권 판매로 287억~992억 원의 기회도 같은 페이지에서 제시한다.","trap":"금액이 있다는 것만 보고 넘기지 말고, 가정(무상 70%)이 4차 할당계획의 실제 유상 비율(발전 외 15%, 탄소누출 업종 100% 무상)과 어떻게 이어지는지 따져 보는 것이 컨설턴트의 일이다.","options":["있음","일부","없음"],"ans":0,"quote":"현대자동차는 국내 배출권거래제(K-ETS) 대상으로서, 할당된 연간 배출 허용량을 초과할 경우 배출권 구매 비용이 발생할 수 있습니다. 향후 배출권 가격 전망에 따라 기존 집약도(대당 배출량)를 유지할 경우, 2035년 기준(70% 무상할당 가정) 약 최소 959억 원에서 최대 3,318억 원의 배출부채 발생이 예상됩니다.","page":34,"co":"hyundai","look":"기후변화 시나리오 분석 표의 '배출권 거래제 — 규제 강화' 위험 요인과 2035년 배출부채 추정치, 가정(무상할당 비율)"},{"id":"markets-10","type":"mc","q":"2025년 CBAM 옴니버스 개정으로 도입된 '50톤 기준'을 바르게 설명한 것은?","ref":"규정(EU) 2025/2083 제2a조·부속서 VII","why":"기준은 '건당'이 아니라 '수입자당 연간 누적 순중량'이며, CN코드를 합산한다. 전력과 수소에는 이 조항이 적용되지 않는다. 기존 150유로 소액 화물 면제는 폐지됐다. 집행위는 이 기준으로 수입자의 약 90%가 의무에서 벗어나지만 배출량의 99%는 여전히 포괄된다고 설명한다. 이 면제는 전력·수소에는 적용되지 않는다.","trap":"'50톤'을 배출량(tCO2)으로 읽는 실수가 잦다. 제품의 질량(톤)이다. 또 전력·수소 수입은 아무리 적어도 면제가 없다.","options":["수입자 1곳이 1년간 들여오는 철강·알루미늄·시멘트·비료의 순중량 합계가 50톤 이하면 면제되며","수입 건당 50톤 이하인 화물은 품목과 상관없이 면제된다","수입자 1곳이 1년간 수입하는 내재배출량이 50톤CO2 이하면 면제된다","수입 금액이 150유로 이하인 소액 화물만 면제된다"],"ans":0,"src":{"label":"규정(EU) 2025/2083 원문","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32025R2083"}},{"id":"markets-29","type":"mc","q":"한 자동차 부품사가 '2026년부터 EU로 수출하는 모든 철강 부품에 CBAM 인증서를 사야 한다'는 소식을 듣고 급히 대응을 요청했다. 2026년 10월 기준 컨설턴트의 바른 설명은?","ref":"EU 집행위 CBAM 확대 법안(2025.12.17)","why":"집행위는 2025년 12월 16~17일 이행 패키지와 함께 철강·알루미늄 집약 하류 제품 약 180개 카테고리(자동차 부품, 가전, 건설자재, 변압기, 케이블, 농기계 등)를 2028년 1월 1일부터 포함하는 법안을 발표했다. 약 7,500개 수입자가 추가될 것으로 추정되며 스크랩을 전구체로 보는 우회 방지 조항도 담겼다. 아직 입법 절차 중이므로 '현행 의무'로 설명하면 틀리다. 현대자동차 보고서도 1·2차 협력사 25개사에 CBAM 대응 컨설팅을 지원한다고 적고 있다.","trap":"제안(proposal)과 시행 중인 법을 구분하지 않는 것이 가장 흔한 실수다. 반대로 '제안이니 무시'도 틀리다. 2028년 시행 시 부품 단위 배출 데이터가 바로 필요하다.","options":["현재 CBAM은 철강 원자재·반제품(CN 72·73류 등) 중심이며, 자동차 부품 등 약 180개 하류 제품으로 넓히는 것은 2025년 12월 집행위가 낸 '법안'으로 2028년 1월 1일 시행을 목표로 의회·이사회 심의 중이다. 따라서 지금은 부품의 철강 함량과 공급망 배출 데이터를 미리 정비할 때다","2026년 1월 1일부터 모든 철강 함유 제품이 이미 CBAM 대상이므로 즉시 인증서를 사야 한다","자동차 부품은 영구히 CBAM 대상에서 제외되므로 아무 준비도 필요 없다","하류 제품 확대는 이미 2027년 시행이 확정됐다"],"ans":0,"src":{"label":"CMS: CBAM 이행 패키지와 확대 제안","url":"https://cms.law/en/gbr/legal-updates/cbam-implementation-package-published-and-proposals-for-future-expansion"}},{"id":"markets-32","type":"judge","q":"현대자동차 2026 지속가능성 보고서가 EU CBAM을 자사 가치사슬의 전환 위험(규제 위험)으로 명시적으로 식별하고 영향(비용) 경로를 적었는지 확인하라.","ref":"IFRS S2 기후 관련 위험 식별(전환 위험)","why":"보고서 19쪽은 기후변화 완화 영역의 업스트림 규제 위험으로 CBAM과 EUDR을 함께 들고, 원재료 구매비 상승과 과징금이라는 비용 경로, 중기~장기 시간대까지 명시한다. 23쪽에서는 CBAM 본격 시행에 따른 유럽 수출품 탄소비용 부담 증가를 '신규 규제'로, 30쪽에서는 협력사 25개사에 CBAM 대응 컨설팅 지원을 적어 위험 식별과 대응이 연결된다.","trap":"'CBAM'이라는 단어가 있는지만 보고 끝내면 안 된다. 위험 식별은 원인(규제)-경로(원재료비·과징금)-시간대(중·장기)-대응(협력사 지원)이 이어져야 완결된 공시다. 다만 이 보고서는 CBAM 비용을 금액으로 추정하지는 않았다.","options":["있음","일부","없음"],"ans":0,"quote":"규제: EU 탄소국경조정제도(CBAM), EU 산림전용방지규정(EUDR) • 원재료의 가격 상승 또는 대체 원재료 확보로 인한 구매 비용이 상승할 수 있으며, 관련 규제 위반 시 과징금 등의 금전적 페널티를 부과받을 수 있습니다.","page":19,"co":"hyundai","look":"기후 위험·기회 표에서 '업스트림' 구간의 규제 항목과 그 재무 영향 설명"},{"id":"targets-08","type":"mc","q":"IFRS S2에서 기후 전환계획에 대한 요구를 가장 정확히 설명한 것은?","ref":"IFRS S2 문단 14(a)(iv), 부록 A","why":"IFRS 재단 자료는 IFRS S2가 '전환계획을 가질 것을 요구하지 않는다'고 밝히면서, 문단 14(a)(iv)에 따라 회사가 가진 전환계획이 있으면 개발에 쓴 핵심 가정과 계획이 의존하는 요소를 공시하도록 한다고 설명한다. 부록 A는 전환계획을 '저탄소 경제로의 전환을 위한 목표·행동·자원을 담은 전략의 한 부분'으로 정의한다.","trap":"'IFRS S2가 전환계획을 의무화했다'고 고객에게 말하면 틀린 조언이다. 의무는 '있는 계획에 대한 정보 공시'다.","options":["전환계획을 '가질 것'을 요구하지는 않지만, 가지고 있다면 핵심 가정과 의존성을 포함해 공시해야 한다","모든 기업이 전환계획을 수립해 공시해야 한다","전환계획은 금융회사만 공시한다","전환계획 공시는 완전히 자발적이며 어떤 기준도 없다"],"ans":0,"src":{"label":"IFRS 재단 브리핑 노트 (2025.2)","url":"https://ifrs.org/content/dam/ifrs/events-and-conferences/2025/february/stakeholder-event/briefing-note.pdf"}},{"id":"targets-32","type":"judge","q":"IFRS S2 문단 14(a)(iv)는 전환계획 공시에 '핵심 가정'과 '의존성'을 담으라고 한다. 현대자동차 보고서의 '목표 달성 계획'이 감축 수단과 함께, 그 수단이 의존하는 외부 조건(예: 전력망 탈탄소, 그린수소 공급, 전기차 수요)을 가정·의존성으로 명시하는지 보라.","ref":"IFRS S2 문단 14(a)(iv)","why":"감축 수단(재생에너지 전환, 그린수소, 전동화 확대, 협력사 지원)은 구체적으로 적혀 있지만, 그 수단이 성립하기 위한 전제(재생에너지·그린수소 조달 가능성, 각국 전력망 배출계수, 전기차 수요와 보조금 정책 등)를 '가정'이나 '의존성'이라는 이름으로 따로 정리해 보여주지는 않는다. 따라서 '일부'다.","trap":"수단 목록이 길면 '전환계획이 충실하다'고 판단하기 쉽다. IFRS S2는 수단뿐 아니라 '무엇이 깨지면 계획이 흔들리는가'를 적도록 요구한다.","options":["있음","일부","없음"],"ans":1,"quote":"단기적으로는 RE100 로드맵과 연계하여 제조 과정에서 사용하는 전기에너지부터 우선 재생에너지로의 전환을 추진할 계획이며, 장기적으로는 수소사회 구현과 연계하여 주요 제조 공정에 그린수소 적용을 확대하고자 합니다.","page":41,"co":"hyundai","look":"'목표 달성 계획' 단락(사업장 탄소 배출 감축·전동화·협력사 지원)에서 수단은 있는지, 그 수단의 전제 조건이 '가정' 또는 '의존성'으로 적혀 있는지 확인한다.","src":{"label":"IFRS 재단 브리핑 노트 (2025.2)","url":"https://ifrs.org/content/dam/ifrs/events-and-conferences/2025/february/stakeholder-event/briefing-note.pdf"}},{"id":"finance-24","type":"mc","q":"한 시중은행이 2026년 회계연도 IFRS S2 기반 보고서를 준비하면서 '파생상품 포지션과 채권 인수 주선 건은 배출량 계산이 어렵다'고 호소한다. 2025년 12월 ISSB 개정에 따른 올바른 처리는?","ref":"IFRS S2 개정 '온실가스 배출 공시 개정'(2025.12)","why":"2025년 12월 11일 발표된 개정은 2027년 1월 1일 이후 시작하는 회계연도부터 시행되고 조기적용이 허용된다. 금융활동 기업은 카테고리 15를 금융배출량(대출·프로젝트금융·채권·주식·미인출 약정·운용자산)으로 한정하고 파생상품을 제외할 수 있으나, 제외한 금융활동과 파생상품 정의를 설명하고 카테고리 15 총량 및 그 안의 금융배출량 소계를 공시해야 한다. 산업 분류는 GICS 의무가 없어지고 다른 체계를 선택해 근거를 밝힐 수 있다.","trap":"초안에 있던 '제외 금액의 정량 공시'는 최종안에서 빠졌지만, 정성 설명 의무는 남았다. '제외하면 아무 설명도 필요 없다'고 하면 틀린다.","options":["개정은 2027년 1월 1일 이후 회계연도부터 시행되지만 조기적용이 가능하므로, 조기적용 시 카테고리 15를 금융배출량으로 한정하고 파생상품을 제외할 수 있으며, 제외한 활동과 파생상품의 정의를 설명하고 카테고리 15 총량과 금융배출량 소계를 공시한다","개정에 따라 은행은 Scope 3 전체를 공시하지 않아도 된다","파생상품은 제외할 수 있지만 그 사실을 설명할 필요는 없다","개정은 자동 적용되어 2026년부터 반드시 GICS를 써야 한다"],"ans":0,"src":{"label":"BDO IFRS S2 개정 해설(2025.12)","url":"https://www.bdo.global/en-gb/insights/ifrs-and-corporate-reporting/2025/issb-publishes-amendments-to-ifrs-s2-%E2%80%93-amendments-to-greenhouse-gas-emissions-disclosures"}},{"id":"practice-29","type":"mc","q":"한 제조회사가 IFRS S2 기반 기후공시 준비 중, 전년도 Scope 2 배출량 계산에 전력 사용량 파일 한 사업장 분이 빠졌던 것을 발견했다. 그 파일은 전년도 공시 승인 시점에 이미 사내에 있었다. 올바른 처리는?","ref":"IFRS S1 문단 83–85","why":"IFRS S1 문단 84는 '공시 승인 시점에 이용 가능했고 합리적으로 입수·고려할 수 있었던 신뢰성 있는 정보'를 쓰지 못한 누락·오기를 전기 오류로 정의하고, 문단 83은 중요한 전기 오류를 비교 수치 재작성으로 수정하라고 한다. 문단 85는 오류 수정과 추정 변경을 구분한다.","trap":"모든 재산정을 '추정 변경'으로 묶어 올해만 고치는 것이다. 이미 있던 자료를 빠뜨린 것은 추정 변경이 아니라 오류다.","options":["중요한 전기 오류이므로 전년도 비교 수치를 재작성(restate)하고 오류의 성격을 공시한다(실무적으로 불가능한 경우 제외)","추정의 변경이므로 올해 숫자에만 반영하고 전년도는 그대로 둔다","검증기관이 이미 승인했으니 수정하지 않는다","올해 배출량에서 그만큼 빼서 상쇄한다"],"ans":0,"src":{"label":"AASB S1(IFRS S1 동일 문단) 83–86 Errors","url":"https://standards.aasb.gov.au/node/3823"}},{"id":"kia-j07","type":"judge","q":"Scope 2를 지역 기반으로 공시하고, 재생에너지 계약(PPA·인증서) 정보도 주는가?","ref":"IFRS S2 문단 29(a)(v)","why":"지역 기반 수치는 156쪽 검증의견서 표에 사업장별로만 있고, 130쪽 본 데이터표에는 어느 방식인지 표시 없이 한 숫자(697.9천 톤, 시장 기반 합계와 일치)만 있다. PPA·REC·자가발전 MWh는 131쪽에 있다.","trap":"130쪽 Scope 2를 지역 기반으로 읽으면 틀린다. 156쪽 지역 기반 합계는 약 861.7천 톤으로 130쪽 숫자보다 16만 톤 이상 크다.","options":["있음","일부","없음"],"ans":1,"quote":"Note 1: Scope 2의 지역 기반 및 시장 기반은 GHG Protocol Scope 2 Guidance (2015)에 따른 용어임.","page":156,"co":"kia","look":"검증의견서 Scope 2 표(지역기반/시장기반), 에너지 사용 표(REC·PPA)"},{"id":"kia-j10","type":"judge","q":"내부탄소가격을 쓰는지, 어떻게 쓰는지, 톤당 가격이 얼마인지 밝히는가?","ref":"IFRS S2 문단 29(f)","why":"Shadow Price 방식이고 HMG 경영연구원 전망 탄소가격을 기준으로 매년 설정해 생산공장 투자심의에 쓴다고 설명했다. 그러나 톤당 가격(원/tCO2e)은 적지 않았다.","trap":"'매년 설정'이라는 말을 보고 가격이 공시됐다고 착각하기 쉽다. 쓰는지와 어떻게 쓰는지는 있지만 '얼마'가 없다.","options":["있음","일부","없음"],"ans":1,"quote":"내부탄소가격은 Shadow Price1을 기반으로 하며,","page":33,"co":"kia","look":"④ 데이터 기반 탄소관리 > 내부탄소가격제도"},{"id":"kia-j11","type":"judge","q":"당기 경영진 보상 중 기후와 연계된 비율(%)을 공시하는가?","ref":"IFRS S2 문단 29(g)(ii)","why":"CEO KPI 중 지속경영지표가 20%이고 그 안에 탄소배출 감축 성과가 포함된다고 했다. 하지만 20% 전체가 기후는 아니므로 기후만의 비율은 알 수 없다.","trap":"'20%'를 기후 연계 비율로 옮겨 쓰면 과장이다. 지속경영지표에는 기후 외 ESG 과제도 들어간다.","options":["있음","일부","없음"],"ans":1,"quote":"CEO KPI는 지속경영지표(20%), 재무지표(35%), 사업 및 전략지표(45%)로","page":24,"co":"kia","look":"기후변화 Governance > 경영진 보상"},{"id":"kia-j13","type":"judge","q":"목표를 제3자가 검토·검증했는가?","ref":"IFRS S2 문단 34(a)","why":"2025년 10월 SBTi가 단기 목표를 공식 승인했다고 밝혔다. 2045년 탄소중립(장기 목표)은 SBTi 넷제로 승인 대상이 아니다.","trap":"SBTi 승인은 '단기 목표'에 한정된다. 2045년 장기 목표까지 검증받았다고 읽으면 틀린다.","options":["있음","일부","없음"],"ans":0,"quote":"이러한 노력의 일환으로 기아는 글로벌 스탠다드인 SBTi로부터 단기 온실가스 감축목표에 대한 공식 승인을","page":32,"co":"kia","look":"③ 탄소배출 감축 로드맵 구축"},{"id":"kia-j15","type":"judge","q":"목표가 총량(gross) 기준인지, 상쇄를 뺀 순량(net) 기준인지 밝히는가?","ref":"IFRS S2 문단 36(c)","why":"63% 감축 목표와 2045년 탄소중립이 상쇄를 포함하는지, 총량 기준인지 어디에도 적지 않았다. '상쇄'나 '순배출'이라는 단어 자체가 보고서에 없다.","trap":"SBTi 단기 목표는 규정상 총량 기준이지만, 그것은 SBTi 규칙에서 추론한 것이고 보고서가 밝힌 것은 아니다.","options":["있음","일부","없음"],"ans":2,"quote":"Scope 1·2                                                      단위: 천 톤    Scope 3","page":32,"co":"kia","look":"③ 탄소배출 감축 로드맵, 42쪽 목표"},{"id":"kia-j18","type":"judge","q":"IFRS S2 문단 6(a)(v)는 기후 관련 성과지표가 보상정책에 포함되는지, 어떻게 포함되는지 공시하라고 한다. 기아 보고서 24쪽은 이 요구를 충족하는가?","ref":"IFRS S2 문단 6(a)(v)","why":"CEO KPI 구성(지속경영지표 20%)과 온실가스 감축 목표 준수 여부에 따라 연간 인센티브를 지급한다는 방식, 사업부문장·권역장 KPI에 CO2 규제 대응과 감축목표 달성률이 들어간다는 설명이 있다.","trap":"포함 여부와 방식은 있지만 비율(29(g))은 없다. 6(a)(v)와 29(g)(ii)는 다른 요구라는 점을 구분해야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"기아는 CEO 및 주요 임원, 조직장에 대해 기후변화 대응 실적과 연계된","page":24,"co":"kia","look":"기후변화 Governance > 경영진 보상"},{"id":"kia-j19","type":"judge","q":"IFRS S2 문단 10(d)는 단기·중기·장기를 어떻게 정의하는지와, 그 정의가 전략적 의사결정용 기획 기간과 어떻게 연결되는지 설명하라고 한다. 기아 보고서 25쪽은 이를 충족하는가?","ref":"IFRS S2 문단 10(d)","why":"단기 1년 이내(2025~2026), 중기 1~5년(2027~2031), 장기 5년 초과(2032~2045)를 연수로 정의하고, 근거 열에 KSSB 1호 차용·RE100 달성 시점·감축 목표 달성 시점을 적어 전략 기획과 연결했다.","trap":"단기 정의의 각주(원자료는 2024~2025년이지만 2025~2026년으로 설정)를 놓치면 분석 기준 연도를 잘못 읽는다.","options":["있음","일부","없음"],"ans":0,"quote":"장기          5년 초과(2032년~2045년)                   중장기 탄소배출 감축 목표 달성 시점","page":25,"co":"kia","look":"기후 관련 위험 및 기회의 영향 기간 표"},{"id":"kia-j20","type":"judge","q":"IFRS S2 문단 25(a)(iv)는 기후 위험을 '다른 종류의 위험과 비교해' 어떻게 우선순위를 정하는지 공시하라고 한다. 기아 보고서 41쪽은 이를 충족하는가?","ref":"IFRS S2 문단 25(a)(iv)","why":"기후 위험이 전사 통합 리스크 관리 프로세스에 들어가고 규모·발생가능성·취약성으로 우선순위를 정한다고 했다. 그러나 다른 위험(재무·안전 등)과 비교해 기후 위험이 어떤 순위인지는 나오지 않는다.","trap":"'통합 관리'라는 말만으로 상대적 우선순위 공시가 된 것으로 보면 안 된다. 비교 결과(예: 전사 Top 리스크 목록 내 위치)가 있어야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"프로세스에 포함하여 전사 통합 관점으로 관리되고 있으며, 기후변화 리스크 분석과 관련한 계획, 분석 결과 및 대응방안 등 주요 사항은 매년 이사회에 정기적으로 보고되어 최고 의사결정기구의 관리·감독 하에 운영되고 있습니다.","page":41,"co":"kia","look":"Risk Management > 통합 관리 프로세스"},{"id":"kia-j21","type":"judge","q":"기후 관련 위험·기회가 당기 재무상태·성과에 미친 영향을 금액으로 밝히는가?","ref":"IFRS S2 문단 16","why":"당기 탄소배출부채(0.3십억 원, 국내)와 2025년 에너지 절감 투자 73.7억 원·연 30억 원 절감 효과(36쪽)는 금액으로 있다. 하지만 전동화 매출이나 규제 비용 등 기후 관련 당기 재무영향을 종합한 공시는 없다.","trap":"탄소배출부채 비율 0.00375%의 분모가 무엇인지 보고서에 없다. 영업이익이나 부채총계로 나눠 봐도 맞지 않으니 그대로 인용만 해야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"탄소배출부채                     십억 원                  0.6               0.2               0.3","page":129,"co":"kia","look":"재무 데이터 > 탄소배출부채, 에너지 효율화 투자"},{"id":"kia-j23","type":"judge","q":"IFRS S2 문단 22(b)(ii)는 시나리오 분석의 핵심 가정(기후정책, 거시경제, 에너지 믹스, 기술 등)을 공시하도록 한다. 기아의 전환 시나리오 분석은 사용한 핵심 가정을 구체적으로 밝혔는가?","ref":"IFRS S2 문단 22(b)(ii)","why":"배출권 가격·유상할당 비율, 재생에너지 단가·전력 요금 경로, 전동화 전환 경로 등 어떤 가정을 썼는지 항목은 적었다. 그러나 가정의 숫자(예: 2030년 배출권 가격)와 결과 금액은 없다.","trap":"가정 '항목'을 나열한 것과 가정 '값'을 공시한 것은 다르다. 항목만 있으면 '일부'다.","options":["있음","일부","없음"],"ans":1,"quote":"기아는 IEA의 Net Zero Emissions(NZE) 시나리오와 NGFS Phase 5 시나리오를 적용하여 전환 위험 및 기회를 분석하였습니다.","page":29,"co":"kia","look":"전환 위험 및 기회 > Stage 2. 시나리오별 가정"},{"id":"kia-j38","type":"judge","q":"기아 2026 보고서는 KSSB가 요구하는 '측정 방법별 배출량 구분 공시'를 충족할 준비가 되어 있는가?","ref":"KSSB 제2호 온실가스 측정 방법별 구분 공시","why":"Scope 2는 지역/시장 기반을 사업장별로 나눴고, 국내 Scope 1·2는 K-ETS 산정 결과를 쓴다고 밝혔다. 그러나 직접 측정·계산·추정 등 측정 방법별로 배출량을 구분한 표는 없다.","trap":"K-ETS 검증 수치를 썼다는 말은 '측정 방법별 구분'이 아니다. KSSB가 요구하는 것은 방법(측정/계산/추정)별 배출량 구분이다.","options":["있음","일부","없음"],"ans":1,"quote":"1. 국내 생산법인 및 비생산시설의 Scope1및 Scope2 배출량은 한국 배출권거래제(K-ETS)에 따라 로이드인증원에 의해 별도 검증된 결과가 반영됨.","page":156,"co":"kia","look":"검증의견서 Scope 2 표, 데이터표"},{"id":"kia-j39","type":"judge","q":"KSSB에서 선택 공시인 '톤당 내부탄소가격'을 기아 2026 보고서는 공시하고 있는가?","ref":"KSSB 제2호 선택공시 — 톤당 내부탄소가격","why":"산식(탄소변화량 × 내부탄소가격)과 용도는 있지만 톤당 가격 숫자가 없다. KSSB 선택공시를 채운 것은 아니다.","trap":"산식이 적혀 있으면 가격이 공시된 느낌이 든다. 산식의 변수값이 없으면 공시가 아니다.","options":["있음","일부","없음"],"ans":2,"quote":"‘탄소변화량 × 내부탄소가격’으로 산출되는 내부 가격을 투자비용과","page":33,"co":"kia","look":"내부탄소가격제도"},{"id":"kia-j40","type":"judge","q":"KSSB 기준은 단기·중기·장기 예시를 주되 산업 특성에 따라 다르게 정할 수 있게 한다. 기아 보고서는 기후 위험·기회의 시간 범위를 정의하고 있는가?","ref":"KSSB 제2호 단기·중기·장기 정의","why":"단기는 KSSB 1호 정의를 차용(1년 이내), 중기는 1~5년(RE100 해외 달성 시점), 장기는 5년 초과(감축 목표 달성 시점)로 연수와 근거를 함께 적었다.","trap":"KSSB 1호를 인용했다고 KSSB 준수 선언으로 보면 안 된다. 정의 차용과 기준 준수는 다르다.","options":["있음","일부","없음"],"ans":0,"quote":"KSSB 1호 기준서에서 정의하는 단기 기간 차용","page":25,"co":"kia","look":"기후 관련 위험 및 기회의 영향 기간"},{"id":"kia-j61","type":"judge","q":"장기 목표(2045 탄소중립) 사이에 연도별 또는 중간 목표(예: 2030년)를 숫자로 제시하는가?","ref":"IFRS S2 문단 33(e) / 중간목표","why":"2035년(63%, 442천 톤)이 중간 지점이고 RE100은 2026년 32%·2030년 66%·2040년 100%, 집약도는 2026년 0.36 등 연도별 목표가 있다. 그러나 Scope 1·2 절대량의 2030년 중간 목표나 2035~2045년 사이 경로는 없다.","trap":"RE100 중간 목표를 배출량 중간 목표로 혼동하기 쉽다. 재생에너지 비중과 배출량 절대량은 다른 지표다.","options":["있음","일부","없음"],"ans":1,"quote":"탄소배출 감축                                                                         탄소배출 감축","page":32,"co":"kia","look":"로드맵 그림, RE100 계획, 42쪽 목표표"},{"id":"kia-j68","type":"judge","q":"기아 보고서가 사업장 탄소 감축을 위한 금액·기간이 있는 투자계획을 공시하는가?","ref":"IFRS S2 문단 14; TPT 실행 전략","why":"연간 예산·자본지출 계획을 수립해 관리한다고 했고, 2025년 에너지 절감 60건에 73.7억 원 투자(36쪽), 2028년까지 태양광 100MW 구축(35쪽) 같은 개별 실적·계획은 있다. 그러나 감축 목표 달성에 필요한 총 투자액과 기간은 없다.","trap":"개별 사업 금액을 모아 '투자계획 공시'로 보면 과하다. 전환계획에는 목표 달성까지의 총 소요 자금이 있어야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"자본지출 계획을 수립하고, 이를 체계적으로 관리하고 있습니다. 주요 예산","page":24,"co":"kia","look":"경영진 보상·예산 감독, 에너지 효율화, RE100 자체발전"}];
const DIAG=[{"id":"d1","area":"기초","q":"'Scope 2'는 무엇을 뜻하나?","options":["회사 공장 보일러에서 직접 나온 배출","회사가 사서 쓴 전기·열을 만들 때 발전소에서 나온 배출","협력사와 고객이 내는 배출"],"ans":1,"why":"Scope 1은 직접 배출, Scope 2는 구매 전기·열·스팀의 간접 배출, Scope 3은 그 밖의 가치사슬 배출이다."},{"id":"d2","area":"기초","q":"'기준연도(base year)'는 왜 두나?","options":["감축 목표와 성과를 비교할 출발점을 고정하려고","가장 배출이 적었던 해를 보여 주려고","보고서를 처음 낸 해를 기념하려고"],"ans":0,"why":"목표(예: 2030년 −42%)는 기준연도 배출량에 대한 비율이다. 조직 경계가 바뀌면 기준연도를 다시 계산한다."},{"id":"d3","area":"기초","q":"tCO2e(이산화탄소 환산톤)에서 'e'가 뜻하는 것은?","options":["에너지(energy)","환산(equivalent) — 다른 온실가스를 CO2 기준으로 바꾼 값","추정(estimate)"],"ans":1,"why":"메탄·아산화질소 같은 가스를 GWP(지구온난화지수)로 곱해 CO2와 같은 단위로 만든 것이다."},{"id":"d4","area":"공시","q":"IFRS S2는 무엇에 관한 기준인가?","options":["제품 전과정 환경영향 평가 방법","투자자에게 기후 관련 위험·기회를 공시하는 국제 기준","공장 온실가스 명세서 작성 지침"],"ans":1,"why":"ISSB가 만든 기후 공시 기준이다. 한국 KSSB 제2호가 이를 바탕으로 한다."},{"id":"d5","area":"공시","q":"한국에서 지속가능성 공시 기준을 만드는 기구는?","options":["KSSB(한국지속가능성기준위원회)","KCGS(한국ESG기준원)","GIR(온실가스종합정보센터)"],"ans":0,"why":"KSSB가 기준을 만들고, 금융위가 의무화 일정을 정한다. KCGS는 평가기관, GIR은 국가 통계·배출권 운영 지원 기관이다."},{"id":"d6","area":"산정","q":"공장에서 LNG 보일러를 땠을 때 배출량은 어떻게 구하나?","options":["연료 사용량 × 배출계수 (× GWP)","전기요금 × 탄소가격","제품 생산량 × 업종 평균"],"ans":0,"why":"활동자료(연료량)에 배출계수를 곱하는 것이 기본 산정식이다."},{"id":"d7","area":"산정","q":"'지역기반'과 '시장기반' Scope 2의 차이는?","options":["국내 공장과 해외 공장의 차이","전력망 평균 계수로 계산하느냐, 재생에너지 계약(REC·PPA)을 반영하느냐의 차이","전기와 열의 차이"],"ans":1,"why":"GHG 프로토콜 Scope 2 지침은 두 방식을 모두 보고하라고 한다."},{"id":"d8","area":"검증","q":"'제한적 보증'과 '합리적 보증' 중 더 엄격한 것은?","options":["제한적 보증","합리적 보증","둘은 같다"],"ans":1,"why":"합리적 보증은 재무제표 감사에 가까운 수준으로 증거를 더 많이 모은다. KSSB는 2030년부터 인증 의무화 예정(금융위 최종안)."},{"id":"d9","area":"LCA","q":"LCA에서 '기능단위'는 무엇인가?","options":["제품 1개","비교의 기준이 되는 기능의 양 (예: 승용차 1대로 20만 km 주행)","공장 1곳"],"ans":1,"why":"같은 기능을 기준으로 놓아야 제품끼리 비교할 수 있다."},{"id":"d10","area":"제도","q":"배출권거래제(K-ETS)에서 회사가 받는 '할당량'은?","options":["정부가 정한, 그 해 내도 되는 배출량의 한도","작년에 실제로 낸 배출량","회사가 스스로 정한 목표"],"ans":0,"why":"할당량보다 많이 배출하면 배출권을 사거나 과징금을 내고, const ALL=[];Object.entries(DATA).forEach(([bid,ss])=>ss.forEach(x=>{x.book=bid;ALL.push(x)}));
let SESS=DATA.kssb,BID="kssb";
const useBook=bid=>{BID=DATA[bid]?bid:"kssb";SESS=DATA[BID];return BID};
const sessOf=id=>ALL.find(x=>x.id===id);
const sn=x=>/(^k0|-0)$/.test(DATA[x.book][0].id)?x.i:x.i+1;
const PART=id=>/^m-/.test(id)?"배출량 보고·인증 지침":/^v-/.test(id)?"검증지침":/^b\d-/.test(id)?"공통 기초":id==="k0"||id==="s2-0"?"들어가며":id.startsWith("k1")?"제1호 일반 요구사항":id.startsWith("k2")?"제2호 기후 관련 공시":id==="s2-11"?"정리":"IFRS S2 본문";
const DIFF={same:"KSSB와 같다",differs:"KSSB와 다르다",s2only:"IFRS S2에만 있다",kssbonly:"KSSB에만 있다"};
const TERMS={};
const CO={kia:"기아 지속가능경영보고서",hyundai:"현대자동차 지속가능성 보고서",bmw:"BMW Group Report",mb:"Mercedes-Benz Group Annual Report",porsche:"Porsche Annual and Sustainability Report"};
const sref=t=>String(t).replace(/\b(k0|k[12]-\d+)\b/g,m=>{const x=DATA.kssb.find(z=>z.id===m);return x?`KSSB ${x.i}회차`:m});
function initData(){
  DATA.kssb.forEach((s,i)=>s.i=i);
  ALL.forEach(s=>{s.intro=sref(s.intro);s.summary=s.summary.map(sref);s.blocks.forEach(b=>{b.prose=b.prose.map(sref);b.req=sref(b.req)})});
  ALL.forEach(s=>s.blocks.forEach(b=>(b.terms||[]).forEach(t=>{if(!TERMS[t.t])TERMS[t.t]={d:t.d,en:t.en||""}})));
  Object.values(DATA).forEach(ss=>ss.forEach((s,i)=>{s.i=i;s.part=PART(s.id);
    s.paras=s.blocks.map((b,j)=>{const tl=(b.terms||[]).map(t=>t.t);let done=new Set();
      const prose=b.prose.map(x=>{let h=esc(x);tl.forEach(t=>{if(done.has(t))return;const e=esc(t);const k=h.indexOf(e);if(k<0)return;done.add(t);h=h.slice(0,k)+`<span class='term' data-t='${e.replace(/'/g,"&#39;")}'>${e}</span>`+h.slice(k+e.length)});return h});
      return {id:s.id+"_"+j,num:b.no,lab:b.label,req:b.req,quote:b.quote,fig:b.fig,ex:b.ex,page:b.pdfPage,src:b.src,kssb:b.kssb,diff:b.diff,qno:b.qno,prose}})}))}

try{NOTES=JSON.parse(localStorage.getItem("kssb-notes")||"[]");WRITES=JSON.parse(localStorage.getItem("kssb-writes")||"[]");DONE=JSON.parse(localStorage.getItem("kssb-done")||"[]");LAST=localStorage.getItem("kssb-last")||"";DIAGR=JSON.parse(localStorage.getItem("kssb-diag")||"null")}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const dots=b=>`<span class="dots" aria-hidden="true">${Array.from({length:b.n},(_,i)=>`<i class="${i<b.d?"on":""}"></i>`).join("")}</span>`;

const hm=m=>m>=60?`${Math.floor(m/60)}시간${m%60?" "+m%60+"분":""}`:`${m}분`;
