기간마다","매 보고기간"],["회복력 평가","평가 결과","22(a)"]],"bonus":[["3~5년"]],"wrong":["시나리오 분석을 매년 새로 해야 한다","회복력 평가도 3~5년마다 하면 된다"],"model":"시나리오 분석은 전략 계획 주기에 맞춰 할 수 있지만, 회복력 평가 결과(22(a))는 매년 보고기간마다 갱신해야 한다.","src":"문단 B18"},"check":{"q":"B17에 따라 더 발전된 정량적 시나리오 분석이 요구되는 기업은?","options":["모든 상장기업","노출이 크고 필요한 역량에 접근할 수 있는 기업","노출이 작은 기업"],"ans":1,"why":"B17은 기후 위험·기회 노출이 크고 필요한 기량·역량·자원에 접근할 수 있는 기업이 더 발전된 정량적 방법을 적용해야 한다고 한다."},"summary":["문단 22는 상황에 걸맞은 시나리오 분석으로 회복력을 평가하고, 평가 결과(22(a))와 분석 방법·시점(22(b))을 공시하게 한다.","B2~B17은 노출 정도와 역량으로 방법을 정하게 하고, B18은 분석은 계획 주기마다, 평가 결과는 매년 갱신하게 한다.","문단 23은 산업기반 지표까지 '고려해야 한다'고 해서 '참고할 수 있다'는 KSSB 23과 다르다."]},{"id":"s2-7","title":"위험관리","range":"문단 24~26","pages":[14,14],"min":10,"intro":"기후 위험과 기회를 식별·평가·우선순위 설정·모니터링하는 프로세스를 묻는 위험관리 문단을 읽는다. KSSB 제2호와 같은 문장이므로 짧게 확인한다. KSSB에서는 k2-7에서 읽었다.","blocks":[{"no":"24","label":"위험관리 공시의 목적","pdfPage":14,"kssb":"24","diff":"same","prose":["문단 24는 위험관리 공시의 목적을 이용자가 기후 위험과 기회를 식별, 평가, 우선순위 설정, 모니터링하는 프로세스와, 그 프로세스가 전사 위험관리에 통합되어 작동하는지를 이해하게 하는 것이라고 한다. 영문 'identify, assess, prioritise and monitor' 네 동사가 이 회차의 뼈대다. 네 단계마다 어떤 절차가 있는지 보여 주라는 요구다.","전략 회차가 '어떤 위험이 있는가'를 묻는다면, 위험관리 회차는 '그 위험을 어떤 절차로 찾고 관리하는가'를 묻는다. 그래서 같은 위험을 두 곳에서 다르게 설명하지 않도록 연결해 쓰는 것이 좋다. B5도 문단 10과 25의 정보가 시나리오 분석 방법을 정할 때 노출 정도를 판단하는 데 쓰일 수 있다고 한다. 두 공시를 함께 쓰면 일관성이 높아진다."],"req":"기후 위험·기회의 식별·평가·우선순위 설정·모니터링 프로세스와 전사 위험관리와의 통합 여부를 이해할 수 있게 한다.","quote":"The objective of climate-related financial disclosures on risk management is to enable users of general purpose financial reports to understand an entity’s processes to identify, assess, prioritise and monitor climate-related risks and opportunities, including whether and how those processes are integrated into and inform the entity’s overall risk management process."},{"no":"25(a)","label":"위험 관리 프로세스의 여섯 항목","pdfPage":14,"kssb":"25⑴","diff":"same","prose":["문단 25(a)는 기후 위험을 다루는 프로세스와 정책에 대해 여섯 가지를 묻는다. (i) 데이터 원천과 사업 범위 같은 투입변수와 매개변수, (ii) 위험 식별에 시나리오 분석을 쓰는지와 방법, (iii) 성격·발생가능성·영향의 크기를 어떻게 평가하는지, (iv) 다른 위험과 비교해 우선순위를 어떻게 두는지, (v) 어떻게 모니터링하는지, (vi) 전기 대비 프로세스가 바뀌었는지다.","(iii)의 예로 정성적 요소, 정량적 임계치, 그 밖의 판단기준을 든다. 실무에서는 '발생가능성 × 영향' 표를 쓰는 회사가 많은데, 그 임계치가 무엇인지까지 밝혀야 (iii)이 충족된다. (vi)은 작년과 무엇이 달라졌는지를 묻는 항목이라 비교 검토 때 놓치기 쉽다. KSSB 25⑴㈎~㈓와 같다. 바뀐 점이 없다면 없다고 적는 편이 독자에게 분명하다."],"req":"기후 위험 관리 프로세스의 투입변수, 시나리오 분석 사용, 평가 방법, 우선순위, 모니터링, 전기 대비 변경을 공시한다."},{"no":"25(c)","label":"기회의 프로세스, 전사 통합, 중복 회피 (25(b)~26)","pdfPage":14,"kssb":"25⑶","diff":"same","prose":["문단 25(b)는 기후 기회를 식별·평가·우선순위 설정·모니터링하는 프로세스를 묻고, 기회 식별에 시나리오 분석을 쓰는지도 묻는다. 25(c)는 위험과 기회 프로세스가 전사 위험관리 프로세스에 어느 정도, 어떻게 통합되어 작동하는지를 묻는다. 기후만 따로 관리하는지, 회사 전체 위험 체계 안에서 함께 다루는지를 보여 주라는 것이다.","문단 26은 거버넌스의 문단 7처럼 IFRS S1(문단 B42(b))에 따라 불필요한 중복을 피하고, 통합 관리하는 경우 통합된 위험관리 공시를 할 수 있게 한다. KSSB 25⑵·⑶과 26도 같은 내용이다. 검토할 때는 기회에 대한 프로세스(25(b))가 위험에 비해 빠져 있지 않은지 확인하면 좋다. 기회는 위험보다 짧게 쓰이기 쉬워서다."],"req":"기회의 관리 프로세스와, 위험·기회 프로세스의 전사 위험관리 통합 정도와 방식을 공시하며, 중복은 피한다."}],"write":{"q":"IFRS S2 문단 25(c)는 무엇을 묻는가?","must":[["통합"],["전사","전반적인 위험관리","overall"],["위험","기회"]],"bonus":[["26"]],"wrong":["기후 위험은 반드시 별도 체계로 관리해야 한다","기회는 위험관리 공시 대상이 아니다"],"model":"문단 25(c)는 기후 위험과 기회를 다루는 프로세스가 전사 위험관리 프로세스에 어느 정도, 어떻게 통합되어 작동하는지를 묻는다.","src":"문단 25(c)"},"check":{"q":"문단 25(a)(vi)이 묻는 것은?","options":["경쟁사의 위험관리 방식","직전 보고기간 대비 프로세스 변경 여부와 방식","위험관리 담당자의 이름"],"ans":1,"why":"25(a)(vi)은 기업이 사용하는 프로세스가 직전 보고기간과 비교해 바뀌었는지와 어떻게 바뀌었는지를 묻는다."},"summary":["위험관리 공시는 기후 위험·기회의 식별·평가·우선순위 설정·모니터링 프로세스를 묻는다.","25(a)는 위험 프로세스의 여섯 항목을, 25(b)는 기회 프로세스를, 25(c)는 전사 위험관리와의 통합을 묻는다.","위험관리 문단 24~26은 KSSB 제2호와 같다."]},{"id":"s2-8","title":"지표 ① 온실가스 배출량","range":"문단 27~29(a) (+B19~B63, 2025년 개정 29A~29C·B21·B24·B62A)","pages":[15,40],"min":15,"intro":"산업전반 지표의 핵심인 온실가스 배출량(문단 29(a))을 읽는다. 2023년 원문과 2025년 12월 개정 문단을 구분해 보고, KSSB에만 있는 측정 방법별 세분화(KSSB 29⑴㈒)가 IFRS S2에서는 어떻게 다뤄지는지 짚는다. KSSB에서는 k2-8에서 읽었다.","blocks":[{"no":"29(a)(i)","label":"스코프 1·2·3 총배출량과 연결실체 구분, 스코프 2","pdfPage":15,"kssb":"29⑴㈎","diff":"same","prose":["문단 27~28은 지표 및 목표를 산업전반 지표(29~31), 산업기반 지표(32), 목표(33~37)로 나눈다. 문단 29(a)(i)은 보고기간의 온실가스 절대 총배출량을 이산화탄소환산톤으로, 스코프 1·2·3으로 나눠 공시하게 한다. 부록 A는 온실가스를 교토의정서의 일곱 가지(CO2, CH4, N2O, HFCs, NF3, PFCs, SF6)로 정의한다.","B19는 가치사슬 기업과 보고기간이 다르면, 가장 최근 데이터를 쓰고 기간 길이가 같으며 그 사이의 유의적 사건을 공시한다는 조건으로 다른 기간의 정보를 쓰게 한다. 29(a)(iii)은 측정 접근법·투입변수·가정과 그 변경을, 29(a)(iv)는 스코프 1·2를 회계상 연결실체와 그 밖의 피투자자로 나눠 공시하게 한다.","29(a)(v)는 스코프 2를 지역기반으로 공시하고 필요한 계약 상품 정보를 주라고 한다. B31은 시장기반 스코프 2를 공시할 수도 있다고 해서, 지역기반은 필수이고 시장기반은 선택이다. 여기까지 KSSB 29⑴㈎·㈐·㈑·㈓와 같다. KSSB 교재 k2-8에서 본 기아·현대자동차 수치도 이 틀로 읽으면 된다. 다만 IFRS S2 기준으로 읽을 때는 지역기반 수치가 분명히 표시되었는지 먼저 본다."],"req":"보고기간 절대 총배출량을 tCO2e로 스코프 1·2·3별 공시하고, 측정 접근법, 연결실체·피투자자 구분, 지역기반 스코프 2를 공시한다.","quote":"For the avoidance of doubt, an entity is required to disclose its Scope 2 greenhouse gas emissions using a location-based approach","terms":[{"t":"이산화탄소환산톤","d":"여러 온실가스를 CO2 기준으로 환산해 합친 단위다.","en":"metric tonnes of CO2 equivalent"}],"qno":"B30"},{"no":"29(a)(ii)","label":"관할권 완화: 기업의 일부에도, GWP 값에도 (2025년 개정)","pdfPage":5,"doc":"amend","amend2025":true,"src":"https://www.ifrs.org/content/dam/ifrs/publications/amendments/english/2025/issb-2025-1-amendments-ifrs-s2.pdf","kssb":"29⑴㈏","diff":"same","prose":["2023년 원문 29(a)(ii)는 배출량을 GHG 프로토콜 기업 기준(2004)으로 측정하되, 관할 당국이나 상장 거래소가 다른 방법을 요구하면 그 방법을 쓸 수 있게 했다. 이 완화가 기업의 일부에만 요구가 있을 때도 적용되는지 질문이 나오자, 2025년 개정은 '전체 또는 일부'(in whole or in part)라는 말을 넣었다. 개정 B24는 요구가 적용되는 부분에, 요구가 계속되는 동안만 그 방법을 쓰게 한다.","개정 BC97B는 여기서 '부분'이 종속기업, 지점, 발전설비 같은 특정 자산일 수 있고 나머지 부분은 GHG 프로토콜로 측정해야 한다고 설명한다. 개정 B28은 다른 방법을 썼다면 대체 방법마다(for each alternative method) 방법과 선택 이유를 공시하게 했다. 개정 BC88의 각주는 한국을 국가 측정 체계를 요구하는 관할권의 예로 든 문단에 이 명확화를 덧붙였다.","개정 B21~B22는 같은 완화를 지구온난화지수(GWP)에도 넓혔다. 원래는 보고일 현재 최신 IPCC 평가보고서의 100년 기준 값을 써야 했지만, 관할권이 다른 값을 요구하면 그 부분에 그 값을 쓸 수 있다. KSSB BC144는 국내 배출권거래제가 제2차 IPCC 평가보고서 값을 쓰게 해서 이 개정이 국내 기업의 부담을 줄인다고 설명한다. KSSB 29⑴㈏, B21~B22, B24, B28은 개정과 같은 내용이다."],"req":"관할권이나 거래소가 기업 전체 또는 일부에 다른 측정 방법이나 GWP 값을 요구하면 그 부분에, 요구가 있는 동안 그 방법·값을 쓸 수 있고, 대체 방법마다 방법과 이유를 공시한다.","quote":"An entity is required to use the Greenhouse Gas Protocol: A Corporate Accounting and Reporting Standard (2004) unless the entity is required, in whole or in part, by a jurisdictional authority or an exchange on which it is listed to use a different method for measuring its greenhouse gas emissions.","terms":[{"t":"관할권 완화","d":"관할 당국이나 거래소가 요구하는 방법을 GHG 프로토콜 대신 쓸 수 있게 한 규정이다.","en":"jurisdictional relief"}]},{"no":"BC97D","label":"방법이 섞였을 때 나눠 공시? IFRS S2는 S1 원칙으로 (KSSB 29⑴㈒와 비교, 2025년 개정 BC)","pdfPage":20,"doc":"amend","amend2025":true,"src":"https://www.ifrs.org/content/dam/ifrs/publications/amendments/english/2025/issb-2025-1-amendments-ifrs-s2.pdf","kssb":"29⑴㈒","diff":"kssbonly","prose":["KSSB 29⑴㈒는 스코프 1·2에 GHG 프로토콜로 측정한 배출량과 관할 당국·거래소가 요구한 방법으로 측정한 배출량이 섞여 있으면 방법별로 나눠 공시하라고 명시한다. 개정된 IFRS S2에도 이런 요구사항 문단은 없다. 개정이 바꾼 문단 목록(C1A)에도 들어 있지 않고, KSSB BC179 표도 이 항목의 IFRS S2 칸을 비워 두었다.","다만 개정 결론도출근거 BC97D는 IFRS S1의 세분화 원칙(S1 문단 B29~B30)이 적용된다고 설명한다. 관할권 완화를 쓰는 기업은 S1에 따라, 중요하다면 GHG 프로토콜로 측정한 양과 대체 방법으로 측정한 양을 나눠 공시하게 될 것이라는 내용이다. 결론도출근거는 기준서 본문이 아니므로, IFRS S2에서는 '중요할 때 S1 원칙으로' 나뉘고 KSSB에서는 '섞이면 명시적으로' 나뉜다고 정리할 수 있다.","실무에서 국내 사업장은 배출권거래제 지침으로, 해외 사업장은 GHG 프로토콜로 측정하는 한국 기업은 두 기준 모두에서 방법별 숫자를 준비해 두는 것이 안전하다. KSSB BC7⑶은 공개초안 단계에서 이런 세분화가 이용자에게 유용하다고 보고 제안했다고 설명한다. 개정 B28의 '대체 방법마다' 공시는 방법의 설명이지 배출량 숫자의 분리는 아니라는 점도 구분한다."],"req":"IFRS S2에는 측정 방법별 배출량 세분화 요구 문단이 없고, 관할권 완화를 쓰면 IFRS S1의 세분화 원칙에 따라 중요한 경우 나눠 공시한다(KSSB 29⑴㈒는 명시적 요구).","quote":"Applying IFRS S1, an entity choosing to use the jurisdictional relief would disaggregate its greenhouse gas emissions information, for example, between the amount measured using the GHG Protocol Corporate Standard and the amount measured using an alternative measurement method, or methods, if material."},{"no":"29(a)(vi)","label":"스코프 3: 카테고리와 측정 체계 (B32~B57)","pdfPage":16,"kssb":"29⑴㈔","diff":"same","prose":["문단 29(a)(vi)은 스코프 3 측정에 포함한 카테고리를 GHG 프로토콜 스코프 3 기준(2011)의 15개 카테고리에 따라 밝히고, 자산운용·상업은행·보험 활동이 있으면 금융배출량 추가 정보를 공시하게 한다. B32는 업스트림과 다운스트림 전체를 보고 15개를 모두 고려하라고 하고, B33은 어떤 측정 방법을 쓰든 포함한 카테고리는 밝혀야 한다고 한다.","B40은 투입변수와 가정의 우선순위를 정하는 네 특성을 든다. 직접 측정, 가치사슬 특정 활동에서 얻은 일차 데이터, 관할권과 기술을 잘 나타내는 적시성 있는 데이터, 검증된 데이터다. B41은 관할권 방법을 쓰더라도 이 측정 체계를 적용하라고 하고, B56은 일차 데이터와 검증 데이터로 측정한 정도를 밝히게 한다. 이용자가 숫자의 품질을 가늠하게 하려는 것이다.","B57은 스코프 3가 이차 데이터와 산업 평균으로 신뢰성 있게 추정될 수 있다고 전제하고, 추정이 실무적으로 불가능한 드문 경우에는 스코프 3를 어떻게 관리하는지 공시하게 한다. 이 구조는 KSSB 29⑴㈔, B32~B57과 같다. 다른 점은 처음 적용할 때의 유예 기간(IFRS S2 첫해, KSSB 3년)이며 s2-11에서 다룬다."],"req":"스코프 3에 포함한 카테고리를 밝히고, 측정 체계(B40) 우선순위에 따른 투입변수 정보와 금융 활동 기업의 금융배출량 추가 정보를 공시한다.","quote":"This Standard includes the presumption that Scope 3 greenhouse gas emissions can be estimated reliably using secondary data and industry averages.","terms":[{"t":"일차 데이터","d":"공급업체 등 가치사슬의 특정 활동에서 직접 얻은 데이터다.","en":"primary data"},{"t":"이차 데이터","d":"산업 평균, 공개 데이터베이스처럼 특정 활동에서 직접 얻지 않은 데이터다.","en":"secondary data"}],"qno":"B57"},{"no":"29A","label":"카테고리 15를 금융배출량으로 한정 (2025년 개정 29A~29C, B62A)","pdfPage":6,"doc":"amend","amend2025":true,"src":"https://www.ifrs.org/content/dam/ifrs/publications/amendments/english/2025/issb-2025-1-amendments-ifrs-s2.pdf","kssb":"29A","diff":"same","prose":["개정으로 추가된 문단 29A는 카테고리 15(투자) 배출량의 측정 범위를 금융배출량, 곧 피투자자나 거래상대방에 준 대출과 투자에 귀속되는 배출량으로 한정할 수 있게 한다. 대출과 투자에는 대출, 프로젝트 파이낸싱, 채권, 지분투자, 미사용 대출한도약정이 들어가고, 자산운용 기업은 운용자산 귀속분도 포함한다. 파생상품 관련 배출량은 뺄 수 있다.","29B는 한정을 쓰면 무엇을 파생상품으로 보았는지 설명하고(29B(a)), 제외한 금융활동을 기술하게 한다(29B(b)). 29C는 카테고리 15를 포함하면 그 총계와 안에 든 금융배출량 소계를 공시하게 한다. 개정 BC121I~BC121J에 따르면 공개초안은 제외한 금액을 숫자로 공시하게 제안했지만, 최종 개정은 질적 기술로 바꿨다. KSSB 29B⑵의 질적 설명과 결과가 같아진 것이다.","같은 개정은 상업은행·보험 금융배출량을 산업별로 나눌 때 GICS(글로벌 산업분류기준) 6자리 코드를 쓰라는 B62(a)(i)·B63(a)(i)을 지우고 B62A·B63A를 넣었다. 이제는 전환 위험 노출을 이해하게 하는 분류체계를 고르되 다른 조건이 같으면 널리 쓰이는 체계를 우선하고, 쓴 체계와 선택 이유를 공시한다. KSSB B62A·B63A도 같은 내용이며, 개정 BC121H는 이 한정이 목표 공시까지 면제하지는 않는다고 강조한다."],"req":"카테고리 15를 금융배출량으로 한정할 수 있고(파생상품 제외 가능), 한정하면 파생상품 판단과 제외 활동을 설명하며, 카테고리 15를 포함하면 총계와 금융배출량 소계를 공시한다.","quote":"If an entity has included Category 15 greenhouse gas emissions in its measure of Scope 3 greenhouse gas emissions disclosed in accordance with paragraph 29(a)(i)(3), the entity shall disclose the total Category 15 greenhouse gas emissions and the subtotal of financed emissions included in that total.","fig":{"cap":"카테고리 15·금융배출량 관련 2025년 개정과 KSSB 비교","head":["IFRS S2(2025년 개정)","내용","KSSB 제2호"],"rows":[["29A","카테고리 15를 금융배출량으로 한정 가능, 파생상품 제외 가능","29A (같음)"],["29B(a)","파생상품으로 본 항목 설명","29B⑴ (같음)"],["29B(b)","제외한 금융활동 기술(공개초안의 금액 공시는 최종안에서 빠짐)","29B⑵ 질적 설명 (같음)"],["29C","카테고리 15 총계와 금융배출량 소계","29C (같음)"],["B62A, B63A","GICS 의무 대신 분류체계 선택, 널리 쓰이는 체계 우선","B62A, B63A (같음)"]]},"terms":[{"t":"금융배출량","d":"피투자자나 거래상대방의 총배출량 중 기업이 준 대출과 투자에 귀속되는 부분이다.","en":"financed emissions"}]}],"write":{"q":"스코프 1·2를 서로 다른 측정 방법으로 측정했을 때 IFRS S2와 KSSB는 어떻게 다른가?","must":[["섞","혼재","여러 방법"],["세분화","나눠","나누어"],["중요","명시"]],"bonus":[["BC97D"],["29⑴㈒"]],"wrong":["IFRS S2도 방법별 세분화를 명시적으로 요구하는 문단이 있다","KSSB는 한 가지 방법만 허용한다"],"model":"KSSB 29⑴㈒는 방법이 섞이면 방법별 세분화를 명시적으로 요구하지만, IFRS S2에는 그런 문단이 없고 IFRS S1 원칙에 따라 중요한 경우 나눠 공시하는 것으로 설명된다(BC97D).","src":"KSSB 문단 29⑴㈒, 2025년 개정 BC97D"},"check":{"q":"2025년 개정 문단 29A~29C에 대한 설명으로 옳은 것은?","options":["모든 기업이 카테고리 15를 금융배출량으로 한정해야 한다","한정하면 제외한 금융활동을 기술하고, 카테고리 15를 포함하면 총계와 금융배출량 소계를 공시한다","제외한 금융활동의 금액을 반드시 숫자로 공시한다"],"ans":1,"why":"29A의 한정은 선택이다. 29B(b)는 제외한 금융활동의 기술을 요구하며, 공개초안의 금액 공시 제안은 최종 개정에서 질적 기술로 바뀌었다(BC121J). 29C는 총계와 소계를 요구한다."},"summary":["문단 29(a)는 스코프 1·2·3 총배출량, 측정 접근법, 연결실체 구분, 지역기반 스코프 2, 스코프 3 카테고리를 요구하며 KSSB와 같다.","2025년 개정은 관할권 완화를 기업의 일부와 GWP 값에도 적용되게 하고, 카테고리 15를 금융배출량으로 한정할 수 있게 했으며(29A~29C), KSSB는 이를 같은 내용으로 반영했다.","측정 방법별 배출량 세분화는 KSSB 29⑴㈒에만 명시되어 있고, IFRS S2는 IFRS S1의 세분화 원칙으로 중요한 경우 나누게 한다(BC97D)."]},{"id":"s2-9","title":"지표 ② 나머지 산업전반 지표와 산업기반 지표","range":"문단 29(b)~(g), 30~32 (+B64~B65)","pages":[16,41],"min":13,"intro":"온실가스 외의 산업전반 지표 여섯 가지와 산업기반 지표를 읽는다. IFRS S2는 내부 탄소 가격의 톤당 가격과 산업기반 지표를 모두 '공시해야 한다'고 해서, 선택으로 둔 KSSB와 가장 크게 갈리는 회차다. KSSB에서는 k2-9에서 읽었다.","blocks":[{"no":"29(b)","label":"위험·기회에 걸린 자산과 자본 배치 (29(b)~(e), 30~31)","pdfPage":16,"kssb":"29⑵","diff":"same","prose":["문단 29(b)~(d)는 전환 위험에 취약한, 물리적 위험에 취약한, 기후 기회에 부합하는 자산이나 사업활동의 금액과 비율을 공시하게 한다. 29(e)는 기후 위험과 기회에 투입한 자본적 지출, 자금조달, 투자 금액이다. 문단 30은 (b)~(d)를 준비할 때 합리적이고 뒷받침될 수 있는 정보를 쓰라고 하고, 문단 31은 B64~B65를 참조하게 한다.","B65는 이 지표를 준비할 때 기간범위(문단 10), 위험이 집중된 곳(13), 재무적 영향(16(a)~(b)), 산업기반 지표로 요구를 채울 수 있는지(32), 재무제표 금액과의 연결을 고려하라고 한다. 이 가운데 산업기반 지표 항목을 KSSB B65⑷는 '참고할 수 있다'로 바꿨다. 나머지 지표 요구는 KSSB 29⑵~⑸와 같다."],"req":"전환·물리적 위험에 취약한 자산·사업활동, 기회에 부합하는 자산·사업활동의 금액과 비율, 기후 관련 자본 배치 금액을 공시한다.","quote":"climate-related physical risks—the amount and percentage of assets or business activities vulnerable to climate-related physical risks;","qno":"29(c)"},{"no":"29(f)","label":"내부 탄소 가격: 톤당 가격까지 공시","pdfPage":16,"kssb":"29⑹","diff":"differs","prose":["문단 29(f)는 (i) 의사결정(투자 결정, 이전가격, 시나리오 분석 등)에 탄소 가격을 적용하는지와 방법을 설명하고, (ii) 배출 원가를 평가할 때 쓰는 온실가스 톤당 가격을 공시하라고 한다. 부록 A는 내부 탄소 가격의 두 가지로, 실제로 부과하지 않는 이론상 가격인 잠재 가격(shadow price)과 사업부에 실제로 부과하는 내부 세금·수수료를 든다.","KSSB 29⑹㈏는 톤당 가격 공시를 기업이 선택할 수 있게 했다. KSSB BC149~BC151은 내부 탄소 가격의 결정 방법과 실무가 아직 성숙하지 않았고, 이제 막 시작한 기업에 톤당 가격을 요구하면 불필요한 부담이 될 수 있다는 의견을 반영했다고 설명한다. IFRS S2에서는 (i)과 (ii)가 모두 의무다. 이 차이는 BC179 표에도 올라 있다.","BMW 그룹 2025 보고서(ESRS 기준)는 차량 프로젝트 개발 단계에서 사용단계 감축 조치를 평가하는 잠재 가격으로 내부 탄소 가격을 쓴다고 밝히고, 이 가격은 재무보고 목적에는 쓰지 않는다고 적었다. IFRS S2 관점에서는 이런 설명(i)에 더해 톤당 금액(ii)이 숫자로 있는지를 확인해야 한다. 내부 탄소 가격을 쓰지 않는 기업이라면 쓰지 않는다는 사실을 밝히는 것이 이용자에게 분명하다."],"req":"의사결정에 탄소 가격을 적용하는지와 방법을 설명하고, 배출 원가 평가에 쓰는 톤당 가격을 공시한다(KSSB는 톤당 가격이 선택).","quote":"the price for each metric tonne of greenhouse gas emissions the entity uses to assess the costs of its greenhouse gas emissions;","ex":{"k":"BMW 보고서(ESRS 기준)에서는","t":"내부 탄소 가격을 차량 프로젝트 개발 단계에서 사용단계 탄소 감축 조치를 평가하는 잠재 가격(shadow price)으로 쓰며, 재무보고 목적에는 쓰지 않는다고 밝혔다.","co":"bmw","page":131},"terms":[{"t":"잠재 가격","d":"실제로 부과하지 않지만 투자나 사업의 경제적 영향을 따져 보려고 쓰는 이론상 탄소 가격이다.","en":"shadow price"}]},{"no":"29(g)","label":"보상: 설명과 비율","pdfPage":17,"kssb":"29⑺","diff":"same","prose":["문단 29(g)는 (i) 기후 관련 사항이 경영진 보상에 반영되는지와 방법을 기술하고(문단 6(a)(v) 참조), (ii) 당기에 인식한 경영진 보상 가운데 기후 관련 사항과 연계된 보상의 비율을 공시하라고 한다. 거버넌스 회차의 보상정책 질문이 여기서 숫자로 이어진다. 6(a)(v)에서 연계 여부와 방법을 설명했다면, 29(g)에서는 그 연계가 실제 보상에서 얼마만큼인지 보여 준다.","(ii)는 비율이라 계산 기준을 같이 밝혀야 비교가 가능하다. 예를 들어 단기 성과급만 기준으로 했는지, 장기 보상까지 포함했는지에 따라 같은 회사도 비율이 크게 달라질 수 있다. 이 요구는 KSSB 29⑺과 같고, IFRS S2와 KSSB 모두 비율 공시를 선택으로 두지 않았다. 그래서 연계가 없다면 0%라고 밝히는 것도 의미 있는 공시가 된다."],"req":"기후 관련 사항이 경영진 보상에 반영되는지와 방법, 당기 인식 경영진 보상 중 기후 연계 비율을 공시한다."},{"no":"32","label":"산업기반 지표는 공시해야 한다","pdfPage":17,"kssb":"32","diff":"differs","prose":["문단 28(b)와 32는 산업의 사업모형, 활동, 공통 특성과 연관된 산업기반 지표를 공시하라고 한다. 어떤 지표를 공시할지 정할 때는 'IFRS S2 이행에 관한 산업기반 지침'의 공시 주제에 연관된 지표를 참조하고 적용가능성을 고려해야 한다. 지침 자체는 따라야 할 의무 문서가 아니지만, 산업기반 지표를 공시하는 것은 의무다.","KSSB는 28⑵에 '공시 여부를 선택할 수 있다'를 붙이고, 32를 '공시할 수 있다'와 '참고할 수 있다'로 바꿨다. KSSB BC155는 공통으로 적용할 산업별 기준이 아직 없고, 지침의 바탕인 SASB 기준이 개선 작업 중이라는 점을 이유로 들며, 앞으로 의무화를 다시 검토하겠다고 밝혔다. 그래서 BC179 표에서 IFRS S2는 '공시', KSSB는 '공시할 수 있음'이다.","실무에서 이 차이는 비교 가능성의 차이로 이어진다. IFRS S2를 적용하는 같은 산업의 기업들은 비슷한 산업기반 지표를 내놓게 되지만, KSSB를 적용하는 기업은 산업기반 지표가 없어도 기준 위반이 아니다. 해외 투자자가 국내 보고서를 IFRS S2 기준으로 비교할 때 가장 먼저 비어 보이는 칸이 될 수 있다. 국내 기업도 미리 준비해 두면 좋다."],"req":"산업 특성과 연관된 산업기반 지표를 공시하며, 산업기반 지침의 지표를 참조하고 적용가능성을 고려해 정한다(KSSB는 공시 선택).","quote":"An entity shall disclose industry-based metrics that are associated with one or more particular business models, activities or other common features that characterise participation in an industry."}],"write":{"q":"내부 탄소 가격과 산업기반 지표에서 IFRS S2와 KSSB는 어떻게 다른가?","must":[["톤당","톤당 가격"],["산업기반"],["선택","할 수 있"]],"bonus":[["BC179"],["29(f)"]],"wrong":["IFRS S2도 톤당 가격을 선택 공시로 둔다","KSSB는 산업기반 지표 공시를 금지한다"],"model":"IFRS S2는 내부 탄소 가격의 톤당 가격과 산업기반 지표를 모두 공시하게 하지만, KSSB는 둘 다 기업이 공시 여부를 선택할 수 있게 했다.","src":"문단 29(f)(ii)·32, KSSB 29⑹㈏·32·BC179"},"check":{"q":"IFRS S2 부록 A가 든 내부 탄소 가격의 두 유형은?","options":["잠재 가격과 내부 세금·수수료","시장 가격과 정부 가격","배출권 가격과 탄소세"],"ans":0,"why":"부록 A는 실제로 부과하지 않는 이론상 가격인 잠재 가격(shadow price)과 사업 단위에 실제로 부과하는 내부 세금·수수료를 든다."},"summary":["문단 29(b)~(e)의 위험·기회 자산, 자본 배치 지표와 29(g) 보상 지표는 KSSB와 같다.","29(f)(ii)는 톤당 내부 탄소 가격을 의무로 공시하게 하지만, KSSB는 이를 선택으로 두었다(BC149~BC151).","IFRS S2 문단 32는 산업기반 지표를 공시하게 하지만, KSSB는 공시할 수 있다로 두고 의무화를 나중에 다시 검토한다(BC155)."]},{"id":"s2-10","title":"목표","range":"문단 33~37 (+B66~B71)","pages":[17,43],"min":12,"intro":"기업이 세운 기후 목표와 법규상 목표, 온실가스 목표, 탄소 크레딧 공시를 읽는다. 문단 33~36은 KSSB와 같고, 목표 지표를 고를 때 산업기반 지표를 다루는 문단 37(과 B67)만 다르다. KSSB에서는 k2-10에서 읽었다.","blocks":[{"no":"33","label":"목표마다 밝힐 여덟 가지","pdfPage":17,"kssb":"33","diff":"same","prose":["문단 33은 스스로 세운 양적·질적 기후 목표와 법규상 충족해야 하는 목표를 공시하고, 목표마다 (a) 지표, (b) 목적(완화, 적응, 과학기반 이니셔티브 부합 등), (c) 적용 범위, (d) 적용 기간, (e) 기준기간, (f) 주요 단계와 중간 목표, (g) 절대량인지 집약도인지, (h) 최신 국제 협약과 관할권 약속이 목표에 어떻게 작용했는지를 밝히라고 한다.","B66은 절대량 목표를 측정치의 총량이나 그 변화로, 집약도 목표를 사업 지표 대비 비율이나 그 변화로 정의한다. (h)의 '최신 국제 협약'에 대해 KSSB BC161은 제정 당시 파리협정이 이에 해당한다고 설명한다. 목표를 협약과 일치시키라는 요구가 아니라, 협약이 목표에 어떻게 작용했는지를 설명하라는 요구다. KSSB 33⑴~⑻과 같다."],"req":"기후 목표마다 지표, 목적, 적용 범위, 기간, 기준기간, 중간 목표, 절대량·집약도 여부, 최신 국제 협약의 작용을 공시한다.","terms":[{"t":"집약도 목표","d":"매출이나 생산량 같은 사업 지표 대비 비율로 정한 목표다.","en":"intensity target"}]},{"no":"34","label":"목표 설정·검토, 진척과 성과 (34~35)","pdfPage":18,"kssb":"34","diff":"same","prose":["문단 34는 목표를 설정하고 검토하는 접근법과 진척을 모니터링하는 방법을 묻는다. (a) 목표와 설정 방법론을 제3자가 검증했는지, (b) 목표 검토 프로세스, (c) 진척을 모니터링하는 지표, (d) 목표 수정과 그 이유다. 문단 35는 목표별 성과와 추세·변화 분석을 공시하게 한다. 목표를 세운 뒤의 관리 과정을 묻는 것이다.","(a)의 제3자 검증은 SBTi 같은 이니셔티브의 승인을 떠올리면 쉽다. 다만 기준서는 검증을 받으라고 요구하지 않고, 받았는지를 밝히라고 한다. (d)는 목표를 바꿨다면 왜 바꿨는지 설명하라는 것으로, 기준연도 재산정이나 목표 상향이 여기에 해당한다. KSSB 34·35와 같다. 수정 이력이 쌓이면 이용자가 목표의 신뢰도를 판단하기 쉬워진다."],"req":"목표 설정·검토 접근법(제3자 검증 여부, 검토 프로세스, 모니터링 지표, 수정과 이유)과 목표별 성과·추세를 공시한다."},{"no":"36(c)","label":"온실가스 목표: 총량 목표를 가리지 말 것 (36(a)~(d))","pdfPage":18,"kssb":"36⑶","diff":"same","prose":["문단 36은 온실가스 목표마다 (a) 대상 온실가스, (b) 대상 스코프, (c) 총배출량 목표인지 순배출량 목표인지, (d) 부문별 탈탄소화 접근법으로 도출했는지를 묻는다. (c)는 순배출량 목표를 공시하면 연관된 총배출량 목표도 따로 공시하라고 한다. B68은 순배출량 목표를 총배출량 목표에서 탄소 크레딧 같은 상쇄 계획을 뺀 것으로 정의한다.","B69는 순배출량 목표가 총배출량 목표 정보를 가려서는 안 된다고 못 박는다. '2040년 탄소중립'처럼 순배출량 목표만 크게 내세우는 보고서에서, 자체 감축분이 얼마인지 보이지 않으면 이 요구를 충족하지 못한다. 검토할 때는 총량 목표가 별도 숫자로 있는지부터 확인한다. KSSB 36⑴~⑷와 같다. 순량 목표와 총량 목표는 한 표에 나란히 두는 것이 읽기 쉽다."],"req":"온실가스 목표마다 대상 가스·스코프, 총량·순량 여부(순량이면 총량 목표 별도 공시), 부문별 탈탄소화 접근법 사용 여부를 공시한다.","quote":"For the avoidance of doubt, if the entity discloses a net greenhouse gas emissions target, this target cannot obscure information about its gross greenhouse gas emissions targets.","qno":"B69"},{"no":"36(e)","label":"탄소 크레딧 사용 계획 (B70~B71)","pdfPage":18,"kssb":"36⑸","diff":"same","prose":["문단 36(e)는 순배출량 목표 달성을 위한 탄소 크레딧 사용 계획을 묻는다. (i) 목표 달성이 크레딧에 얼마나, 어떻게 의존하는지, (ii) 어떤 제3자 제도가 크레딧을 검증·인증하는지, (iii) 자연 기반인지 기술적 제거인지, 감축인지 제거인지 같은 크레딧 유형, (iv) 영구성 가정 같은 신뢰성과 무결성 판단 요소다.","B71은 계획된 사용만 공시하면 되지만, 이미 사서 목표에 쓸 계획인 크레딧 정보도 이해에 도움이 되면 포함할 수 있다고 한다. 부록 A는 탄소 크레딧을 크레딧 프로그램이 발행하고 전자 등록부로 일련번호를 붙여 추적·소각하는 배출 단위로 정의한다. 이 부분도 KSSB 36⑸, B70~B71과 같다. 실무에서는 크레딧 비중이 숫자로 드러나는지가 핵심 확인 사항이다."],"req":"순배출량 목표에 쓸 탄소 크레딧의 의존 정도, 검증·인증 제도, 유형, 신뢰성·무결성 판단 요소를 공시한다.","terms":[{"t":"탄소 크레딧","d":"크레딧 프로그램이 발행하고 전자 등록부로 추적·소각하는, 감축이나 제거를 나타내는 배출 단위다.","en":"carbon credit"}]},{"no":"37","label":"목표 지표를 고를 때 산업기반 지표도 '고려' (37, B67)","pdfPage":19,"kssb":"37","diff":"differs","prose":["문단 37은 목표 설정과 진척 모니터링에 쓸 지표를 정할 때 산업전반 지표(29)와 산업기반 지표(32)를 모두 참조하고 적용가능성을 고려하라고 한다. B67도 목표 지표를 정할 때 산업전반 지표와 산업기반 지표를 고려하라고 하고, 기업이 직접 개발한 지표라면 IFRS S1 문단 50에 따라 그 지표 정보를 공시하게 한다.","KSSB 37과 B67은 산업전반 지표는 똑같이 고려하게 하면서, 산업기반 지표는 '참고할 수 있다'로 바꿨다. 문단 12, 23, 32에서 본 차이가 목표 회차까지 일관되게 이어진 것이다. 이 네 곳을 묶어 '산업기반은 S2는 고려, KSSB는 참고'로 기억하면 된다. 반대로 산업전반 지표를 고려하라는 요구는 두 기준서 모두 같다."],"req":"목표 지표를 정할 때 산업전반 지표와 산업기반 지표를 모두 참조·고려한다(KSSB는 산업기반 지표를 참고할 수 있다).","quote":"In identifying and disclosing the metrics used to set and monitor progress towards reaching a target described in paragraphs 33–34, an entity shall refer to and consider the applicability of cross-industry metrics (see paragraph 29) and industry-based metrics (see paragraph 32), including those described in an applicable IFRS Sustainability Disclosure Standard, or metrics that otherwise satisfy the requirements in IFRS S1."}],"write":{"q":"IFRS S2 문단 36(c)와 B69는 순배출량 목표에 대해 무엇을 요구하나?","must":[["순배출량","순량"],["총배출량","총량"],["별도","따로","가려"]],"bonus":[["B68"],["탄소 크레딧"]],"wrong":["순배출량 목표만 공시하면 된다","총배출량 목표는 선택이다"],"model":"순배출량 목표를 공시하면 연관된 총배출량 목표를 별도로 공시해야 하고, 순배출량 목표가 총배출량 목표 정보를 가려서는 안 된다.","src":"문단 36(c), B69"},"check":{"q":"IFRS S2와 KSSB의 목표 문단 중 서로 다른 것은?","options":["문단 33의 목표 특성 여덟 가지","문단 36(e)의 탄소 크레딧 정보","문단 37의 산업기반 지표 고려"],"ans":2,"why":"33과 36은 같다. 37(과 B67)에서 IFRS S2는 산업기반 지표를 고려하게 하고, KSSB는 참고할 수 있다고 한다."},"summary":["문단 33~35는 목표의 특성, 설정·검토 방법, 성과와 추세를 묻고 KSSB와 같다.","문단 36은 온실가스 목표의 대상, 총량·순량 구분, 탄소 크레딧 사용 계획을 묻고, 순량 목표가 총량 목표를 가려서는 안 된다(B69).","문단 37과 B67에서 IFRS S2는 산업기반 지표를 고려하게 하지만 KSSB는 참고할 수 있다로 두었다."]},{"id":"s2-11","title":"시행일·경과규정과 KSSB와의 차이 총정리","range":"부록 C (C1~C5, 2025년 개정 C1A~C1B·C4(b)·C6) + 전체 차이표","pages":[44,44],"min":14,"intro":"IFRS S2가 언제부터 적용되고 처음 적용할 때 어떤 완화가 있는지(부록 C), 2025년 개정의 시행일과 경과규정까지 읽는다. 마지막으로 이 책에서 본 KSSB 제2호와의 차이를 한 표로 정리한다. KSSB에서는 k2-11에서 읽었다.","blocks":[{"no":"C1","label":"시행일: 2024년 1월 1일, S1과 함께 (C1~C3)","pdfPage":44,"kssb":"C1","diff":"differs","prose":["문단 C1은 IFRS S2를 2024년 1월 1일 이후 시작하는 연차 보고기간부터 적용하고, 일찍 적용할 수 있되 그 사실을 밝히고 IFRS S1을 같은 때 적용하라고 한다. C2는 최초 적용일을 처음 적용하는 연차 보고기간의 시작일로 정하고, C3은 최초 적용일 이전 기간의 공시를 요구하지 않아 첫해에는 비교정보가 필요 없다고 한다.","KSSB C1은 날짜를 박지 않았다. 최초 공표일이 포함된 회계연도부터 적용하되, 법령이 공시를 요구하면 법령의 시행일을 따른다. 2024년은 기준서에 적힌 날짜이고, 기업에 언제 의무가 되는지는 관할권의 제도가 정한다(개정 BC164A도 관할권별 의무 시행일을 언급한다). 한국은 금융위원회 일정에 따른다(KSSB 교재 k0). C2·C3은 KSSB와 같다."],"req":"2024-01-01 이후 시작하는 연차 보고기간부터 적용하고(조기 적용 시 사실 공시와 IFRS S1 동시 적용), 첫해 비교정보는 요구되지 않는다.","quote":"An entity shall apply this Standard for annual reporting periods beginning on or after 1 January 2024. Earlier application is permitted."},{"no":"C4","label":"첫해 완화 두 가지: 측정 방법과 스코프 3","pdfPage":44,"kssb":"C4","diff":"differs","prose":["문단 C4는 처음 적용하는 연차 보고기간에 두 완화를 하나 또는 둘 다 쓰게 한다. (a) 직전 연도에 GHG 프로토콜 외의 방법으로 배출량을 측정했다면 그 방법을 계속 쓸 수 있다. (b) 스코프 3 배출량을 공시하지 않아도 되며, 금융 활동 기업은 금융배출량 추가 정보도 공시하지 않아도 된다. 2025년 개정은 (b)의 참조를 B58~B63A로 고쳤을 뿐 내용은 같다.","KSSB C4⑴은 (a)와 같지만, C4⑵는 최초 적용일 이후 3년간 스코프 3를 공시하지 않을 수 있게 했다. KSSB BC175는 제조업 중심 산업구조라 가치사슬이 복잡하고 협력업체가 많아 데이터 확보에 현실적 제약이 있다는 점을 이유로 든다. IFRS S2는 첫해 한 번, KSSB는 세 해다. 이것이 두 기준서의 경과규정에서 가장 큰 차이다."],"req":"첫해에는 기존 측정 방법을 계속 쓸 수 있고 스코프 3(금융배출량 추가 정보 포함)를 공시하지 않아도 된다(KSSB는 스코프 3 3년).","quote":"In the first annual reporting period in which an entity applies this Standard, the entity is permitted to use one or both of these reliefs:"},{"no":"C6","label":"2025년 개정을 처음 적용할 때 비교정보 조정 (2025년 개정)","pdfPage":13,"doc":"amend","amend2025":true,"src":"https://www.ifrs.org/content/dam/ifrs/publications/amendments/english/2025/issb-2025-1-amendments-ifrs-s2.pdf","kssb":"없음","diff":"s2only","prose":["2025년 개정은 C1B에 시행일(2027년 1월 1일 이후 시작 보고기간, 조기 적용 가능)을 두고, C6에 개정 전 IFRS S2를 이미 적용하던 기업을 위한 경과규정을 넣었다. 개정을 처음 적용하는 해에는 실무적으로 불가능하지 않다면 직전 기간 비교정보를 조정해야 한다. 바뀐 측정 방법, 29C의 카테고리 15 총계와 소계, 새로 고른 산업분류체계를 직전 기간에도 쓴 것처럼 고친다.","KSSB에는 C6에 해당하는 문단이 없다. KSSB 제2호는 처음부터 개정 내용을 담고 제정되었기 때문에, '개정 전 기준을 쓰던 기업'이 생기지 않는다. 개정 BC176은 대부분 관할권의 의무 시행 전에 개정이 나와 영향받는 기업이 적을 것이라고 보았다. 해외 자회사가 IFRS S2를 이미 적용 중이라면 C6에 따른 전기 수치 조정 여부를 확인해야 한다."],"req":"개정 전 IFRS S2를 적용하던 기업은 개정을 처음 적용하는 해에 측정 방법 변경, 카테고리 15 총계·소계, 산업분류체계를 반영해 직전 기간 비교정보를 조정한다(실무적으로 불가능한 경우 제외).","quote":"If an entity previously applied IFRS S2, in the first annual reporting period in which the entity applies Amendments to Greenhouse Gas Emissions Disclosures, the entity shall—unless it is impracticable to do so—adjust comparative information for the preceding period as follows:"},{"no":"C5","label":"완화의 연장 사용과 차이 총정리","pdfPage":44,"kssb":"C5","diff":"same","prose":["문단 C5는 C4(a)나 C4(b)의 완화를 썼다면, 다음 보고기간에 그 정보를 비교정보로 보여 줄 때도 완화를 계속 쓸 수 있게 한다. 예를 들어 첫해에 스코프 3를 공시하지 않았다면, 둘째 해 보고서에서 첫해 스코프 3 비교정보를 내지 않아도 된다. KSSB C5와 같은 구조이며, KSSB는 이를 3년 유예와 함께 적용한다.","아래 표는 이 책에서 확인한 차이를 모은 것이다. 차이는 세 방향이다. KSSB가 더 요구하는 것(3A, 29⑴㈒), KSSB가 부담을 덜어 준 것(스코프 3 3년, 톤당 가격 선택, 산업기반 지표·지침 '참고'), KSSB가 선택지를 더한 것(10B, D1)이다. 2025년 개정 사항(29A~29C, B21~B22, B24, B62A·B63A)은 두 기준서가 같은 내용이다.","IFRS S2에만 있는 것은 2025년 개정 경과규정 C6, 그리고 2024년이라는 시행일 정도다. 정리하면 IFRS S2를 적용한 해외 보고서는 톤당 가격과 산업기반 지표가 있어야 하고, KSSB 보고서는 3A와 방법별 세분화를 확인해야 한다. 두 기준을 오가며 검토할 때 이 표를 점검표로 쓰면 된다. 다만 2025년 개정 이후 문단 번호는 개정본 기준으로 확인한다."],"req":"C4 완화를 쓴 정보는 이후 비교정보로 보여 줄 때도 완화를 계속 쓸 수 있으며, KSSB와의 차이는 추가 요구, 부담 완화, 선택지 추가로 정리된다.","quote":"If an entity uses the relief in paragraph C4(a) or paragraph C4(b), the entity is permitted to continue to use that relief for the purposes of presenting that information as comparative information in subsequent reporting periods.","fig":{"cap":"IFRS S2와 KSSB 제2호 차이 총정리 (이 책 s2-1~s2-11, KSSB BC179)","head":["항목","IFRS S2","KSSB 제2호","방향"],"rows":[["미공시 사실·근거","규정 없음","공시를 생략하면 사실과 근거 공시(3A)","KSSB 추가"],["측정 방법별 세분화","요구 문단 없음, S1 원칙으로 중요하면 구분(개정 BC97D)","방법이 섞이면 방법별 세분화(29⑴㈒)","KSSB 추가"],["기간범위 정의","정의 없음, 기업이 정의·설명(10(d))","1년·5년 기준 기간 사용 가능(10A·10B)","KSSB 선택지"],["산업기반 공시 주제·지표 고려","참조하고 적용가능성 고려(12, 23, 37, B65, B67)","참고할 수 있음","KSSB 완화"],["산업기반 지표","공시(28(b), 32)","공시할 수 있음(28⑵, 32)","KSSB 완화"],["내부 탄소 톤당 가격","공시(29(f)(ii))","공시 선택(29⑹㈏)","KSSB 완화"],["시행일","2024-01-01 이후 시작 보고기간(C1)","공표일 포함 회계연도, 법령 시 법령 시행일(C1)","다름"],["스코프 3 경과 완화","적용 첫해(C4(b))","최초 적용일 이후 3년(C4⑵)","KSSB 완화"],["자발적 적용 기업","규정 없음","법령상 첫 적용연도에 경과규정 재적용(D1)","KSSB 선택지"],["2025년 개정 경과규정","개정 첫 적용 시 비교정보 조정(C6)","해당 없음(처음부터 반영)","S2에만"],["2025년 개정 내용","29A~29C, B21~B22, B24, B28, B62A, B63A","같은 내용 반영(BC125~BC129)","같음"]]}}],"write":{"q":"IFRS S2와 비교해 KSSB 제2호의 스코프 3 경과규정은 어떻게 다른가?","must":[["3년","세 해"],["첫해","1년"],["스코프 3","Scope 3"]],"bonus":[["C4"],["BC175"]],"wrong":["KSSB도 첫해만 면제한다","IFRS S2는 스코프 3를 3년 면제한다"],"model":"IFRS S2는 적용 첫해에만 스코프 3 공시를 면제하지만, KSSB 제2호는 최초 적용일 이후 3년간 스코프 3를 공시하지 않을 수 있게 했다.","src":"문단 C4(b), KSSB 문단 C4⑵"},"check":{"q":"다음 중 IFRS S2에만 있고 KSSB 제2호에는 없는 것은?","options":["카테고리 15를 금융배출량으로 한정하는 문단 29A","2025년 개정을 처음 적용할 때 비교정보를 조정하는 문단 C6","순배출량 목표와 별도로 총배출량 목표를 공시하는 요구"],"ans":1,"why":"29A와 총배출량 목표 공시는 두 기준서에 모두 있다. C6은 개정 전 IFRS S2를 쓰던 기업을 위한 경과규정이라, 처음부터 개정을 반영한 KSSB에는 없다."},"summary":["IFRS S2는 2024년 1월 1일 이후 시작 보고기간부터 IFRS S1과 함께 적용하며, 첫해 비교정보·측정 방법·스코프 3 완화를 둔다.","2025년 개정은 2027년 1월 1일 이후 시작 보고기간부터 적용하고, 이미 적용하던 기업은 C6에 따라 비교정보를 조정한다.","KSSB와의 차이는 추가 요구(3A, 29⑴㈒), 부담 완화(스코프 3 3년, 톤당 가격·산업기반 지표 선택), 선택지 추가(10B, D1)로 정리된다."]}],"b1":[{"id":"b1-1","title":"온실가스란 무엇이고 왜 이산화탄소로 환산하나","range":"7대 온실가스 · GWP · tCO2e · AR5와 AR6","min":13,"intro":"보고서의 배출량 숫자는 모두 ‘tCO2e’라는 하나의 단위로 적혀 있다. 이 회차에서는 서로 다른 기체를 어떻게 한 단위로 더하는지, 그때 쓰는 GWP 값이 왜 문서마다 다른지를 정리한다.","blocks":[{"no":"온실가스","label":"열을 붙잡는 기체, 일곱 가지","src":"https://unfccc.int/sites/default/files/2025-12/The%20Republic%20of%20Koreas%202035%20NDC.pdf","prose":["온실가스는 땅에서 나가는 열을 붙잡아 지구를 덥히는 기체다. 국제적으로 세는 기본 목록은 교토의정서에 적힌 일곱 가지로, 이산화탄소(CO2), 메탄(CH4), 아산화질소(N2O), 수소불화탄소(HFCs), 과불화탄소(PFCs), 육불화황(SF6), 삼불화질소(NF3)다. 한국이 2025년 12월 유엔에 낸 2035 국가 감축목표(NDC) 문서도 이 일곱 가지를 대상 가스로 적었다.","가스마다 나오는 곳이 다르다. 이산화탄소는 연료를 태울 때, 메탄은 천연가스 누출이나 매립지에서, 아산화질소는 비료와 일부 화학 공정에서 많이 나온다. 수소불화탄소는 에어컨 냉매, 육불화황은 전기 설비의 절연 가스, 삼불화질소는 반도체와 디스플레이 공정에서 쓰인다. 양이 적어도 열을 붙잡는 힘이 아주 센 가스가 있어서 빠뜨리면 숫자가 크게 틀린다.","국내 기업 보고서에서는 앞의 여섯 가지만 적힌 경우가 자주 보인다. 오랫동안 ‘6대 온실가스’라는 말을 써 왔기 때문이다. KSSB 제2호 부록 A도 온실가스를 교토의정서의 일곱 가지로 정의하므로, 공시를 준비할 때는 NF3를 넣었는지, 뺐다면 왜인지를 먼저 확인한다. 대상 가스 목록은 보통 보고서의 ‘산정 기준’이나 ‘배출량 측정 접근법’ 쪽에 적혀 있다."],"req":"배출량을 셀 때는 교토의정서의 일곱 가지 온실가스를 모두 대상으로 하고, 빠진 가스가 있으면 이유를 밝힌다.","ex":{"k":"현대차 보고서에서는","t":"38쪽은 ‘이산화탄소(CO₂), 메탄(CH₄), 아산화질소(N₂O), 수소불화탄소(HFCs), 과불화탄소(PFCs), 육불화황(SF6)의 6대 온실가스를 대상으로’ 했다고 적었다. 일곱 가지 목록과 비교하면 NF3가 빠져 있다.","co":"hyundai","page":38},"terms":[{"t":"온실가스","d":"지구에서 나가는 열을 붙잡아 기온을 높이는 기체로, 공시에서는 교토의정서의 일곱 가지를 기본으로 센다.","en":"greenhouse gases (GHG)"},{"t":"교토의정서","d":"1997년 채택된 기후변화협약의 의정서로, 감축 대상 온실가스 목록을 처음 정한 국제 조약이다.","en":"Kyoto Protocol"}]},{"no":"GWP","label":"기체마다 다른 힘을 하나의 잣대로","src":"https://ghgprotocol.org/sites/default/files/2024-08/Global-Warming-Potential-Values%20(August%202024).pdf","prose":["같은 1톤이라도 기체마다 지구를 덥히는 힘이 다르다. 그래서 이산화탄소 1톤이 일으키는 온난화를 1로 놓고, 다른 기체 1톤이 그보다 몇 배인지를 숫자로 정해 둔다. 이 배수가 지구온난화지수(GWP)다. 기체마다 대기에 머무는 시간이 다르기 때문에 몇 년 동안의 효과로 볼지도 정해야 하는데, 공시 기준과 국가 감축목표는 100년 기준을 쓴다.","GWP 값은 기후과학을 정리하는 국제기구 IPCC의 평가보고서에서 나온다. GHG 프로토콜이 정리한 표를 보면 아산화질소는 5차 보고서(AR5)에서 265, 6차 보고서(AR6)에서 273이다. 육불화황은 AR5 23,500, AR6 24,300이다. 메탄은 AR6에서 화석 연료에서 나온 것 29.8, 그 밖의 것 27.0으로 나뉜다. 냉매로 흔한 HFC-134a는 AR6 값이 1,530이다.","표를 보면 왜 ‘CO2만 세면 된다’는 생각이 위험한지 알 수 있다. 자동차 공장 에어컨에서 HFC-134a 1톤이 새면 이산화탄소 1,530톤을 내보낸 것과 같다. 반대로 GWP가 큰 가스를 줄이면 적은 양으로도 감축 효과가 크다. 그래서 산정 담당자는 가스별 사용량과 누출량을 따로 관리한다. 작은 냉매 누출도 기록해야 하는 이유가 여기에 있다."],"req":"서로 다른 온실가스는 100년 기준 GWP를 곱해 이산화탄소 기준으로 바꾼 뒤 더한다.","fig":{"cap":"100년 기준 GWP (GHG 프로토콜 정리표, 2024.8)","head":["가스","AR5","AR6"],"rows":[["CO2","1","1"],["CH4 (화석 기원)","30","29.8"],["CH4 (비화석 기원)","28","27.0"],["N2O","265","273"],["HFC-134a","1,300","1,530"],["SF6","23,500","24,300"],["NF3","16,100","17,400"]]},"terms":[{"t":"지구온난화지수","d":"어떤 기체 1톤이 100년 동안 이산화탄소 1톤보다 몇 배 지구를 덥히는지 나타낸 숫자다.","en":"global warming potential (GWP)"},{"t":"IPCC","d":"기후변화에 관한 정부 간 협의체로, 발표된 연구를 모아 평가보고서를 내는 국제기구다.","en":"Intergovernmental Panel on Climate Change"}]},{"no":"tCO2e","label":"환산 톤을 직접 계산해 보기","src":"https://ghgprotocol.org/sites/default/files/2024-08/Global-Warming-Potential-Values%20(August%202024).pdf","prose":["tCO2e는 ‘이산화탄소 환산 톤’이라고 읽는다. 끝의 e는 equivalent, 즉 ‘환산’이라는 뜻이다. 메탄이나 아산화질소 같은 기체의 양에 GWP를 곱해 이산화탄소 몇 톤과 같은지로 바꾼 값이라는 표시다. 보고서에 따라 tCO2-eq, tCO2eq처럼 다르게 쓰지만 모두 같은 단위다. 에너지(energy)나 추정(estimate)의 e가 아니다.","계산은 곱하기 한 번이다. 아산화질소 2톤을 AR5 값으로 바꾸면 2 × 265 = 530 tCO2e다. 같은 2톤을 AR6 값으로 바꾸면 2 × 273 = 546 tCO2e가 된다. 실제 배출량은 그대로인데 어느 보고서의 GWP를 썼느냐에 따라 16톤 차이가 난다. 가스별로 이렇게 바꾼 값을 모두 더하면 회사 전체의 tCO2e가 된다.","그래서 tCO2e 숫자만 보고는 무엇을 셌는지 알 수 없다. 단위는 어떤 가스를 넣었는지도, 어느 판의 GWP를 썼는지도 알려 주지 않는다. 숫자를 읽을 때는 표 아래 각주나 ‘산정 방법’ 쪽에서 대상 가스와 GWP 출처를 함께 찾는 습관을 들인다. 이 두 가지가 적혀 있지 않다면 그것이 첫 질문이 된다. 대상 가스와 GWP 판은 숫자에 붙은 이름표와 같다."],"req":"tCO2e는 각 가스의 양에 GWP를 곱해 이산화탄소 기준으로 바꾼 값이며, 대상 가스와 GWP 출처를 함께 밝혀야 뜻이 분명해진다.","ex":{"k":"현대차 보고서에서는","t":"38쪽은 IPCC ‘제5차 및 제6차 평가보고서에서 제시한 100년 기준 지구온난화지수(GWP)를 적용하여 이산화탄소 환산량(tCO₂-eq)으로 변환’했다고 적었다. 두 판을 함께 언급했으므로 어느 배출원에 어느 판을 썼는지는 따로 확인해야 한다.","co":"hyundai","page":38},"terms":[{"t":"tCO2e","d":"여러 온실가스를 GWP로 곱해 이산화탄소 양으로 바꿔 합친 단위다.","en":"tonnes of CO2 equivalent"}]},{"no":"AR5·AR6","label":"어느 판의 GWP를 쓰나: 국내 적용","src":"https://unfccc.int/sites/default/files/2025-12/The%20Republic%20of%20Koreas%202035%20NDC.pdf","prose":["IPCC 평가보고서는 몇 년마다 새로 나오고, 그때마다 GWP 값도 조금씩 바뀐다. 2차 보고서(SAR) 값은 메탄 21, 아산화질소 310, 육불화황 23,900이었다. 문제는 문서마다 쓰는 판이 다르다는 것이다. 한국의 2030 NDC는 2018년 배출량에 SAR의 GWP를 썼고, 2035 NDC 문서는 AR5의 100년 GWP를 쓴다고 밝혔다.","공시 기준은 원칙과 예외를 함께 둔다. KSSB 제2호 문단 B21은 보고일에 쓸 수 있는 최신 IPCC 평가의 100년 GWP를 쓰되, 관할 당국이나 상장된 거래소가 다른 값을 요구하면 그 범위와 기간에는 그 값을 써도 된다고 한다. ISSB도 2025년 12월 IFRS S2를 고쳐 같은 취지의 경감을 넣었다. 국내 배출권거래제 지침이 정한 값은 지침 원문의 표에서 직접 확인해야 한다.","실무의 결론은 간단하다. 어느 판을 쓰든 ‘어떤 값을 어느 범위에 썼는지’를 적어 두는 것이다. 국내 사업장은 배출권거래제 명세서 값, 해외 사업장은 다른 판의 값을 쓰는 일이 실제로 생긴다. 판을 바꾸면 과거 연도와 비교가 흔들리므로, 바꾼 사실과 영향도 함께 밝힌다. 이 이야기는 4회차의 재산정에서 다시 나온다. 검증기관도 이 기록을 가장 먼저 찾는다."],"req":"적용한 GWP의 판(SAR·AR5·AR6)과 적용 범위를 밝히고, 관할 당국 값을 쓰면 그 범위와 기간을 적는다.","fig":{"cap":"문서별로 쓰는 GWP","head":["문서","GWP","근거"],"rows":[["한국 2030 NDC (2021 갱신)","IPCC 2차(SAR) 100년","유엔 제출 NDC 문서"],["한국 2035 NDC (2025.12 제출)","IPCC 5차(AR5) 100년","유엔 제출 NDC 문서"],["KSSB 제2호 · IFRS S2","최신 IPCC 100년 원칙, 관할 당국 값 허용","제2호 B21, IFRS S2 2025.12 개정"],["현대차 2026 보고서","AR5와 AR6 100년","보고서 38쪽"]]},"terms":[{"t":"평가보고서","d":"IPCC가 몇 년마다 기후과학 연구를 종합해 내는 보고서로, 5차는 AR5, 6차는 AR6라고 줄여 부른다.","en":"assessment report (AR)"}]}],"write":{"q":"tCO2e에서 e는 무엇을 뜻하고, 이 값은 어떻게 만들어지나?","must":[["환산","equivalent","동등"],["GWP","지구온난화지수"],["CO2","이산화탄소"]],"bonus":[["곱","×"],["100년"]],"wrong":["에너지","energy","추정치","estimate"],"model":"tCO2e의 e는 환산(equivalent)이라는 뜻으로, 메탄 같은 가스의 양에 GWP(지구온난화지수)를 곱해 CO2 기준으로 바꾼 값이다.","src":"GHG 프로토콜 GWP 정리표(2024.8)"},"check":{"q":"아산화질소(N2O) 2톤을 AR5의 100년 GWP로 환산하면 얼마인가?","options":["530 tCO2e","546 tCO2e","2 tCO2e"],"ans":0,"why":"AR5의 N2O 값은 265이므로 2 × 265 = 530 tCO2e다. 546은 AR6 값 273을 쓴 결과이고, 2는 환산하지 않은 무게 그대로다."},"summary":["공시에서 세는 온실가스는 교토의정서의 일곱 가지이며, 국내 보고서에서는 NF3가 빠진 경우가 많다.","tCO2e는 각 가스의 양에 100년 기준 GWP를 곱해 이산화탄소 기준으로 바꾼 값이고, e는 환산(equivalent)이다.","GWP는 IPCC 보고서 판마다 다르므로(2030 NDC는 SAR, 2035 NDC는 AR5), 어떤 값을 어느 범위에 썼는지 밝혀야 한다."]},{"id":"b1-2","title":"조직 경계: 무엇까지 우리 배출인가","range":"GHG 프로토콜 기업 표준 3장 · 배출권거래법 제8조","min":12,"intro":"배출량을 세기 전에 ‘어느 회사, 어느 사업장까지가 우리인가’부터 정해야 한다. 이 회차에서는 GHG 프로토콜의 세 가지 경계 설정 방법과 국내 배출권거래제의 사업장 경계를 비교한다.","blocks":[{"no":"조직 경계","label":"어디까지가 ‘우리 회사’인가","src":"https://ghgprotocol.org/sites/default/files/ghgp/standards/ghg-protocol-revised.pdf","prose":["대기업은 법인 하나로 움직이지 않는다. 자회사, 해외 법인, 다른 회사와 함께 세운 합작회사가 얽혀 있다. 이 가운데 어디까지의 배출을 ‘우리 배출’로 셀지 정하는 것이 조직 경계다. GHG 프로토콜 기업 표준은 이를 정하는 방법으로 지분 접근법과 통제 접근법을 두고, 통제 접근법을 다시 재무통제와 운영통제로 나눈다. 결국 세 가지 가운데 하나를 고르는 셈이다.","왜 이것부터 정할까. 경계가 바뀌면 같은 회사라도 배출량이 크게 달라지기 때문이다. 공장 하나를 경계 안에 넣으면 그 공장의 연료와 전기가 모두 우리 숫자가 되고, 밖에 두면 빠진다. 그래서 회사는 한 가지 방법을 골라 모든 사업에 똑같이 적용하고, 어떤 방법을 골랐는지 보고서에 밝혀야 한다. 해마다 방법을 바꾸면 비교가 불가능해진다.","경계는 Scope 분류와도 이어진다. 경계 안에 있는 설비에서 직접 나온 배출은 Scope 1, 경계 안 설비가 산 전기의 배출은 Scope 2가 된다. 경계 밖이지만 우리 사업과 관련된 배출은 Scope 3로 간다. 그래서 배출량 표를 읽을 때는 숫자보다 먼저 ‘경계를 어떻게 잡았나’를 찾는다. 경계 설정 방법은 보통 산정 기준 쪽이나 검증의견서에 한 줄로 적혀 있다."],"req":"배출량을 세기 전에 조직 경계 설정 방법을 하나 고르고, 모든 사업에 일관되게 적용한 뒤 그 방법을 밝힌다.","terms":[{"t":"조직 경계","d":"어떤 법인과 사업장의 배출을 회사 배출로 포함할지 정한 범위다.","en":"organizational boundary"}]},{"no":"지분·통제","label":"지분 접근법과 두 가지 통제 접근법","src":"https://ghgprotocol.org/sites/default/files/ghgp/standards/ghg-protocol-revised.pdf","prose":["지분 접근법은 가진 지분만큼만 센다. 지분 30%를 가진 회사의 배출이 100톤이면 30톤을 우리 몫으로 넣는다. 통제 접근법은 지분율 대신 ‘통제하느냐’를 본다. 통제하는 사업은 배출의 100%를 세고, 통제하지 못하는 사업은 지분이 있어도 0%로 둔다. 통제는 무엇을 기준으로 보느냐에 따라 재무통제와 운영통제로 나뉜다.","재무통제는 회사가 그 사업의 재무·운영 정책을 좌우해 경제적 이익을 얻을 수 있는 경우다. 보통 회계에서 연결 자회사로 묶는 범위와 비슷하다. 운영통제는 회사나 그 자회사가 그 사업의 운영 방침을 정하고 실행할 완전한 권한이 있는 경우다. 같은 합작회사라도 지분 50%면 지분 접근법으로 50%, 우리가 운영하지 않으면 운영통제로 0%가 된다.","흔한 오해는 ‘지분이 있으면 무조건 센다’는 생각이다. 통제 접근법에서 통제하지 못하는 회사의 배출은 Scope 1·2에 넣지 않는다. 대신 그 지분 투자의 배출은 Scope 3 카테고리 15(투자)로 갈 수 있다. 경계에서 빠진 배출이 사라지는 것이 아니라 다른 칸으로 옮겨 간다는 점을 기억한다. 그래서 경계 밖으로 둔 배출이 Scope 3에 제대로 들어갔는지도 함께 확인한다."],"req":"지분 접근법은 지분율만큼, 통제 접근법은 통제하는 사업을 100% 센다. 통제는 재무통제와 운영통제로 나뉜다.","fig":{"cap":"같은 합작회사(지분 50%, 운영은 상대 회사)를 세는 법","head":["방법","무엇을 보나","우리 몫"],"rows":[["지분 접근법","지분율","50%"],["재무통제","재무·운영 정책을 좌우하나","통제 여부에 따라 0% 또는 100%"],["운영통제","운영 방침을 정하고 실행할 권한","0% (운영하지 않으므로)"]]},"terms":[{"t":"지분 접근법","d":"사업에 가진 지분율만큼 그 사업의 배출을 회사 몫으로 세는 방법이다.","en":"equity share approach"},{"t":"재무통제","d":"사업의 재무·운영 정책을 좌우해 경제적 이익을 얻을 수 있을 때 그 사업 배출을 100% 세는 방법이다.","en":"financial control"}]},{"no":"운영통제","label":"자동차 회사들이 고른 방법","src":"https://ghgprotocol.org/sites/default/files/ghgp/standards/ghg-protocol-revised.pdf","prose":["실무에서는 운영통제 접근법이 가장 흔하다. 회사가 직접 운영하는 공장과 사무실은 에너지 사용량과 연료 기록을 바로 얻을 수 있고, 감축 설비 투자도 직접 결정할 수 있기 때문이다. 운영통제는 회사가 운영 방침을 정하고 실행할 완전한 권한이 있는 사업장의 배출을 100% 센다. 현대차와 기아 모두 이 방법을 썼다고 밝혔다.","운영통제를 골라도 판단이 필요한 곳이 있다. 빌려 쓰는 건물이나 설비(임차자산)를 우리가 운영한다면 경계 안에 넣고, 그 전기 사용은 Scope 2가 된다. 경계 밖으로 두면 같은 배출이 Scope 3 카테고리 8로 간다. 기아 보고서는 2024년부터 Scope 3 카테고리 8로 분류하던 임차자산 배출을 Scope 1&2에 포함해 산정했다고 각주에 적었다. 경계 판단이 바뀐 실제 예다."],"req":"운영통제 접근법은 회사가 운영 방침을 정하고 실행할 권한이 있는 사업장의 배출을 100% 센다.","ex":{"k":"기아 보고서에서는","t":"155쪽 LRQA 검증의견서는 ‘기아의 주요 활동은 자동차 제조이며 온실가스 배출은 운영통제접근법을 사용하여 통합되었습니다’라고 적었다. 130쪽 각주는 2024년부터 임차자산 배출량을 Scope 1&2로 포함해 산정했다고 밝힌다.","co":"kia","page":155},"terms":[{"t":"운영통제","d":"회사가 운영 방침을 정하고 실행할 완전한 권한이 있는 사업장의 배출을 100% 포함하는 방법이다.","en":"operational control"},{"t":"임차자산","d":"회사가 빌려 쓰는 건물·설비로, 경계 판단에 따라 Scope 1·2 또는 Scope 3 카테고리 8에 들어간다.","en":"leased assets"}]},{"no":"사업장","label":"배출권거래제의 경계는 사업장 단위다","src":"https://www.taxcanvas.kr/core/law/0116122025102821071/history/2026-04-29","prose":["국내 규제에는 또 다른 경계가 있다. 배출권거래법 제8조는 최근 3년간 연평균 배출량이 업체 전체로 12만 5천 tCO2e 이상이거나, 2만 5천 tCO2e 이상인 사업장을 하나 이상 가진 업체를 할당대상업체로 정한다. 대상이 되면 국내 사업장별로 배출량을 산정해 명세서를 내고, 제24조에 따라 이행연도가 끝난 뒤 3개월 안에 보고한다.","이 경계는 GHG 프로토콜 경계와 다르다. 국내 사업장만 다루므로 해외 공장은 명세서에 없다. 또 법인 전체가 아니라 사업장과 배출시설 목록이 기본 단위다. 그래서 한 회사의 숫자가 두 갈래로 나뉜다. 국내 사업장은 명세서 숫자를 그대로 가져오고, 해외 사업장과 Scope 3는 GHG 프로토콜로 따로 산정해 합치는 식이다. 보고서에 검증의견서가 두 장 붙어 있는 이유다. 공시 담당자는 두 경계가 어떻게 다른지 표로 정리해 두고, 숫자마다 어느 경계에서 왔는지 표시한다."],"req":"국내 할당대상업체는 배출권거래법에 따라 사업장 단위로 배출량을 산정·보고하며, 이 경계는 GHG 프로토콜 경계와 다를 수 있다.","ex":{"k":"현대차 보고서에서는","t":"157쪽 DNV 검증의견서는 조직경계를 ‘현대자동차 주식회사의 국내 사업장’, 운영경계를 ‘Scope 1(직접배출), Scope 2(간접배출)’로 적었다. 해외 사업장과 글로벌 Scope 3는 159쪽 LRQA 의견서가 따로 검증했다.","co":"hyundai","page":157},"terms":[{"t":"할당대상업체","d":"배출권거래법 기준 이상을 배출해 정부로부터 배출권을 할당받는 업체다.","en":"allocated entity"}]}],"write":{"q":"운영통제 접근법에서는 어떤 사업장의 배출을 얼마나 세나?","must":[["운영","운영 방침","운영통제"],["권한","통제"],["100%","전부","모두"]],"bonus":[["실행","시행"]],"wrong":["지분율만큼","지분만큼"],"model":"운영통제 접근법은 회사가 운영 방침을 정하고 실행할 권한이 있는 사업장의 배출을 100% 센다.","src":"GHG 프로토콜 기업 표준 3장"},"check":{"q":"지분 30%를 가졌지만 운영은 상대 회사가 하는 합작회사를 운영통제 접근법으로 세면 Scope 1·2에 넣는 몫은?","options":["30%","0%","100%"],"ans":1,"why":"운영통제는 우리가 운영 방침을 정하고 실행할 권한이 있는 사업만 100% 세고 나머지는 0%다. 지분만큼 세는 것(30%)은 지분 접근법이다."},"summary":["조직 경계는 어느 법인·사업장의 배출을 우리 배출로 셀지 정하는 것이며, 지분·재무통제·운영통제 가운데 하나를 골라 일관되게 쓴다.","운영통제는 우리가 운영 방침을 정하고 실행할 권한이 있는 사업장을 100% 세며, 두 자동차 회사 모두 이 방법을 썼다.","배출권거래제는 국내 사업장 단위의 별도 경계를 쓰므로, 공시 숫자는 명세서 숫자와 해외·Scope 3 숫자를 합친 것일 수 있다."]},{"id":"b1-3","title":"Scope 1·2·3","range":"GHG 프로토콜 기업 표준 4장 · Scope 2 지침 · Scope 3 표준","min":14,"intro":"경계 안의 배출을 ‘누가 굴뚝을 가졌나’에 따라 세 칸으로 나눈 것이 Scope다. 이 회차에서는 세 칸의 뜻, Scope 2를 두 방식으로 세는 이유, Scope 3의 15개 카테고리를 실제 보고서 숫자로 본다.","blocks":[{"no":"Scope 1","label":"우리 굴뚝에서 바로 나온 배출","src":"https://ghgprotocol.org/sites/default/files/ghgp/standards/ghg-protocol-revised.pdf","prose":["Scope 1은 회사가 소유하거나 통제하는 배출원에서 바로 나오는 직접 배출이다. 공장 보일러에서 LNG를 태울 때, 회사 차량이 경유를 쓸 때, 도장 공정에서 연료를 태울 때가 여기에 든다. 연소가 아니어도 된다. 에어컨과 냉동기에서 새는 냉매, 화학 반응으로 생기는 공정 배출도 우리 설비에서 대기로 바로 나가므로 Scope 1이다.","Scope 1은 회사가 가장 직접 줄일 수 있는 칸이다. 연료를 바꾸거나, 설비 효율을 높이거나, 냉매 누출을 막으면 숫자가 바로 준다. 그래서 검증기관도 이 칸의 배출원을 빠짐없이 찾았는지 꼼꼼히 본다. 현대차 해외 사업장을 검증한 LRQA는 공조 시스템 냉매 누출, 하폐수처리장 운영 같은 배출원의 산정 절차를 개선하라고 권고했다. 눈에 덜 띄는 배출원이 빠지기 쉽다는 뜻이다."],"req":"회사가 소유·통제하는 설비에서 직접 나오는 배출(연소, 공정, 냉매 누출 등)을 Scope 1로 센다.","ex":{"k":"기아 보고서에서는","t":"130쪽 표에서 2025년 직접 배출량(Scope 1)은 398.5천 tCO2e로, 국내 255.7천 톤과 해외 142.9천 톤으로 나뉜다.","co":"kia","page":130},"terms":[{"t":"직접 배출","d":"회사가 소유하거나 통제하는 배출원에서 대기로 바로 나가는 배출로, Scope 1이라고 부른다.","en":"direct emissions"}]},{"no":"Scope 2","label":"우리가 산 전기의 발전소 굴뚝","src":"https://ghgprotocol.org/sites/default/files/ghgp/standards/ghg-protocol-revised.pdf","prose":["Scope 2는 회사가 사서 쓴 전기, 열, 스팀을 만들 때 나온 간접 배출이다. 굴뚝은 발전소에 있지만, 그 전기를 쓴 회사의 몫으로 센다. 전기를 쓰는 결정은 회사가 했기 때문이다. 공장 안 보일러에서 직접 태운 LNG는 Scope 1이고, 한국전력에서 사 온 전기의 배출은 Scope 2다. 같은 에너지라도 ‘누가 태웠나’로 칸이 갈린다.","자동차 공장은 전기를 많이 쓰므로 Scope 2가 Scope 1보다 큰 경우가 많다. 그래서 재생에너지 전환이 감축 계획의 중심이 된다. 회사 사이에서는 같은 배출이 여러 번 보고되는 것이 정상이다. 발전사의 Scope 1은 그 전기를 산 자동차 회사의 Scope 2가 된다. 한 회사 안에서만 세 칸이 겹치지 않으면 된다. 재생에너지 목표가 Scope 2 감축 계획과 함께 나오는 이유도 여기에 있다."],"req":"회사가 구매해 쓴 전기·열·스팀의 생산 과정 배출을 Scope 2로 센다.","ex":{"k":"기아 보고서에서는","t":"130쪽 표에서 2025년 간접 배출량(Scope 2)은 697.9천 tCO2e로, 같은 해 Scope 1(398.5천 톤)보다 크다.","co":"kia","page":130},"terms":[{"t":"간접 배출","d":"회사 활동 때문에 생기지만 다른 회사의 배출원에서 나오는 배출로, Scope 2와 Scope 3가 여기에 든다.","en":"indirect emissions"}]},{"no":"지역·시장기반","label":"Scope 2를 두 가지로 세는 이유","src":"https://ghgprotocol.org/sites/default/files/2023-03/Scope%202%20Guidance.pdf","prose":["Scope 2는 두 방식으로 센다. 지역기반은 그 지역 전력망의 평균 배출계수를 쓴다. 재생에너지를 따로 샀든 안 샀든 같은 나라의 공장이면 같은 계수다. 시장기반은 회사가 계약으로 고른 전기의 배출계수를 쓴다. 재생에너지 인증서(REC)를 사거나 재생에너지 발전사와 직접 전력구매계약(PPA)을 맺으면 그만큼 배출이 낮게 잡힌다.","GHG 프로토콜 Scope 2 지침(2015)은 이런 계약 수단이 있는 시장에서 활동하는 회사에게 두 숫자를 모두 보고하라고 한다. 지역기반은 회사가 있는 곳의 전력망 현실을, 시장기반은 회사의 구매 선택을 보여 준다. 그래서 두 숫자의 차이가 곧 재생에너지 조달의 효과다. 이 지침은 지금 개정 중이며 GHG 프로토콜은 2028년 4분기 ISO와 함께 새 기업 표준을 낼 계획이라고 밝혔다.","보고서를 읽을 때는 총배출량이 어느 방식으로 합쳐졌는지 확인한다. 현대차 38쪽의 2025년 Scope 1+2 합계 1,911,084톤은 Scope 1 720,642톤에 시장기반 Scope 2 1,190,442톤을 더한 값이다. 기아 130쪽의 Scope 2 697.9천 톤도 156쪽 사업장별 시장기반 값을 더한 것과 같고, 지역기반으로 더하면 약 861.7천 톤이다."],"req":"Scope 2는 전력망 평균 계수(지역기반)와 계약을 반영한 계수(시장기반) 두 방식으로 산정해 보고한다.","fig":{"cap":"기아 2025년 Scope 2 사업장별 비교 (tCO2e, 156쪽)","head":["사업장","지역기반","시장기반"],"rows":[["화성(국내)","278,317","277,418"],["United States","54,873","45,372"],["Slovakia","19,074","2,365"],["China","132,013","7,920"],["India","115,652","115,652"]]},"terms":[{"t":"지역기반","d":"전력망 평균 배출계수로 계산한 Scope 2다.","en":"location-based method"},{"t":"시장기반","d":"재생에너지 인증서나 전력구매계약 등 회사가 고른 전기의 배출계수로 계산한 Scope 2다.","en":"market-based method"},{"t":"전력구매계약","d":"회사가 발전사와 직접 맺는 장기 전력 구매 계약으로, 재생에너지 조달에 많이 쓴다.","en":"power purchase agreement (PPA)"}]},{"no":"Scope 3","label":"가치사슬의 15개 칸","src":"https://ghgprotocol.org/sites/default/files/standards/Corporate-Value-Chain-Accounting-Reporing-Standard_041613_2.pdf","prose":["Scope 3는 Scope 2에 들지 않는 그 밖의 모든 간접 배출이다. GHG 프로토콜 Scope 3 표준(2011)은 이를 15개 카테고리로 나눈다. 1~8번은 우리 회사 앞쪽(업스트림)으로 구매한 제품, 자본재, 운송, 폐기물, 출장, 통근 등이다. 9~15번은 뒤쪽(다운스트림)으로 판매 제품의 운송, 가공, 사용, 폐기, 그리고 투자 등이다.","자동차 회사는 카테고리 11(판매된 제품의 사용)이 압도적으로 크다. 고객이 차를 몰며 내는 배출이 여기에 들기 때문이다. 현대차 2025년 Scope 3 199,704,253톤 가운데 카테고리 11이 157,799,559톤으로 약 79%다. 기아도 142,060.7천 톤 가운데 114,663.1천 톤으로 약 81%다. 그래서 전기차 전환이 자동차 회사 감축 전략의 중심이 된다.","흔한 오해는 ‘Scope 3는 선택이라 안 봐도 된다’는 생각이다. KSSB 제2호는 Scope 3 공시를 요구하고, 금융위원회 최종안은 시작 시점만 3년 늦췄을 뿐이다. 어떤 카테고리를 넣고 뺐는지, 뺐다면 왜인지도 밝혀야 한다. 기아 130쪽은 자본재, 출장, 직원 통근을 ‘당사 중요성 기준 이하로 2025년부터 산정 대상 제외’했다고 적었다."],"req":"가치사슬의 그 밖의 간접 배출을 15개 카테고리로 나눠 산정하고, 포함·제외한 카테고리와 이유를 밝힌다.","fig":{"cap":"현대차 2025년 Scope 3 주요 카테고리 (tCO2-eq, 38쪽)","head":["카테고리","배출량","비중"],"rows":[["1 구매한 제품 및 서비스","30,976,380","15.5%"],["4 업스트림 운송 및 유통","2,345,209","1.2%"],["11 판매된 제품의 사용","157,799,559","79.0%"],["12 판매된 제품의 폐기","1,711,368","0.9%"],["15 투자","1,506,134","0.8%"],["Scope 3 합계","199,704,253","100%"]]},"terms":[{"t":"Scope 3 카테고리","d":"가치사슬 간접 배출을 활동 종류별로 나눈 15개 칸으로, 1~8은 업스트림, 9~15는 다운스트림이다.","en":"Scope 3 categories"},{"t":"가치사슬","d":"원재료를 사 오는 앞쪽부터 제품을 쓰고 버리는 뒤쪽까지 회사 사업과 이어진 활동 전체다.","en":"value chain"}]}],"write":{"q":"Scope 2의 지역기반과 시장기반은 무엇이 다른가?","must":[["지역기반","지역 기반"],["시장기반","시장 기반"],["전력망","평균 배출계수","평균 계수"]],"bonus":[["재생에너지","REC","PPA","계약"],["둘 다","두 방식","모두"]],"wrong":["국내 공장과 해외","전기와 열"],"model":"지역기반은 전력망 평균 배출계수로, 시장기반은 회사가 맺은 재생에너지 계약(REC·PPA)을 반영한 계수로 Scope 2를 계산한다.","src":"GHG 프로토콜 Scope 2 지침(2015)"},"check":{"q":"기아 중국 공장의 2025년 Scope 2가 지역기반 132,013톤, 시장기반 7,920톤으로 크게 다른 까닭으로 가장 알맞은 것은?","options":["시장기반은 회사가 계약으로 산 재생에너지 전기를 반영하기 때문","중국 공장이 그해 문을 닫았기 때문","두 숫자에 서로 다른 GWP를 썼기 때문"],"ans":0,"why":"두 방식은 같은 전기 사용량에 다른 배출계수를 곱한다. 지역기반은 전력망 평균, 시장기반은 계약한 전기의 계수를 쓰므로 재생에너지 계약이 많을수록 시장기반이 작아진다."},"summary":["Scope 1은 우리 설비의 직접 배출, Scope 2는 사서 쓴 전기·열의 간접 배출, Scope 3는 그 밖의 가치사슬 배출이다.","Scope 2는 전력망 평균 계수(지역기반)와 재생에너지 계약을 반영한 계수(시장기반) 두 방식으로 세고, 총계가 어느 방식인지 확인한다.","Scope 3는 15개 카테고리로 나뉘며, 자동차 회사는 판매 차량 사용(카테고리 11)이 약 80%를 차지한다."]},{"id":"b1-4","title":"숫자를 만드는 법: 활동자료 × 배출계수, 기준연도와 재산정","range":"GHG 프로토콜 기업 표준 5·6장","min":13,"intro":"배출량 숫자 대부분은 굴뚝에서 직접 잰 것이 아니라 계산한 것이다. 이 회차에서는 기본 산정식과, 해마다 숫자를 비교할 수 있게 해 주는 기준연도와 재산정 규칙을 익힌다.","blocks":[{"no":"산정식","label":"활동자료 × 배출계수","src":"https://ghgprotocol.org/sites/default/files/ghgp/standards/ghg-protocol-revised.pdf","prose":["가장 흔한 산정 방법은 곱하기다. 활동자료에 배출계수를 곱한다. 활동자료는 배출을 일으킨 활동의 양으로, LNG 사용량(㎥ 또는 TJ), 경유 사용량(L), 전기 사용량(MWh) 같은 것이다. 배출계수는 그 활동 한 단위당 나오는 온실가스 양이다. GHG 프로토콜 기업 표준도 문서로 확인된 배출계수를 활동자료에 곱하는 방법을 가장 일반적인 방법으로 설명한다.","공장 LNG 보일러라면 순서가 이렇다. 먼저 한 해 동안 쓴 LNG 양을 가스 요금 고지서나 계량기로 확인한다. 여기에 이산화탄소, 메탄, 아산화질소 각각의 배출계수를 곱해 가스별 배출량을 구한다. 마지막으로 가스별 값에 GWP를 곱해 tCO2e로 바꾼 뒤 더한다. 전기는 사용량에 전력 배출계수를 곱하면 Scope 2가 된다.","굴뚝에 측정기를 달아 배출을 직접 재는 방법도 있지만, 많은 배출원은 이렇게 계산으로 구한다. 그래서 숫자의 정확도는 활동자료가 얼마나 정확한지, 배출계수가 그 활동을 얼마나 잘 나타내는지에 달려 있다. 구매 금액에 계수를 곱하는 방법도 있지만 이는 주로 Scope 3를 거칠게 추정할 때 쓴다. 그래서 산정 시트에는 활동자료의 출처와 계수의 출처를 나란히 적는다."],"req":"배출량은 기본적으로 활동자료(연료·전기 사용량 등)에 배출계수를 곱하고, 가스별 값에 GWP를 곱해 tCO2e로 합쳐 구한다.","fig":{"cap":"LNG 보일러 배출량을 구하는 순서","head":["단계","하는 일","예"],"rows":[["1","활동자료 확인","연간 LNG 사용량"],["2","가스별 배출계수 곱하기","CO2, CH4, N2O 각각"],["3","GWP 곱해 환산","CH4·N2O를 CO2 기준으로"],["4","더하기","보일러 배출량(tCO2e)"]]},"terms":[{"t":"활동자료","d":"배출을 일으킨 활동의 양으로, 연료 사용량이나 전기 사용량 같은 값이다.","en":"activity data"},{"t":"배출계수","d":"활동 한 단위당 나오는 온실가스 양으로, 활동자료에 곱해 배출량을 구한다.","en":"emission factor"}]},{"no":"국내 지침","label":"국내 사업장은 정해진 규칙으로 센다","src":"https://www.taxcanvas.kr/core/law/0116122025102821071/history/2026-04-29","prose":["국내 할당대상업체는 산정 방법을 마음대로 고를 수 없다. 배출권거래제의 고시인 ‘온실가스 배출권거래제의 배출량 보고 및 인증에 관한 지침’이 배출시설별 산정 방법과 계수를 정해 두었다. 현대차 2025년도 명세서를 검증한 DNV는 이 지침(환경부고시 제2025-64호)에 근거해 명세서를 준비할 책임이 회사에 있다고 적었다. 이 지침은 국내 사업장에 적용되므로, 해외 사업장은 GHG 프로토콜 같은 다른 규칙으로 센다.","이 규칙은 단위 환산까지 정해 둔다. 현대차 158쪽 각주는 전력의 경우 한국 배출권거래제 기준 순발열량 9.6 TJ/GWh를 적용했고, 기타 에너지에는 일반 전환계수 3.6 TJ/GWh를 적용했다고 밝힌다. 같은 전기 사용량도 어떤 규칙으로 바꾸느냐에 따라 에너지 숫자가 2배 넘게 달라진다. 그래서 숫자를 옮겨 쓸 때는 어느 규칙으로 계산한 값인지 함께 적는다."],"req":"국내 할당대상업체는 배출량 보고 및 인증 지침이 정한 방법과 계수로 산정하며, 다른 규칙으로 산정한 숫자와 섞을 때는 출처를 표시한다.","ex":{"k":"현대차 보고서에서는","t":"38쪽은 Scope 1·2를 GHG 프로토콜 기업 표준과 Scope 2 지침을 근거로 산정하면서 「탄소중립기본법」 및 「온실가스 배출권거래제의 배출량 보고 및 인증에 관한 지침」을 준수했다고 적었다.","co":"hyundai","page":38},"terms":[{"t":"명세서","d":"할당대상업체가 이행연도마다 사업장별 배출량을 적어 정부에 내는 보고서다.","en":"GHG emissions statement"}]},{"no":"기준연도","label":"비교의 출발점을 고정한다","src":"https://ghgprotocol.org/sites/default/files/ghgp/standards/ghg-protocol-revised.pdf","prose":["감축 목표는 언제나 ‘몇 년 대비 몇 %’로 말한다. 그 ‘몇 년’이 기준연도다. 기준연도 배출량을 출발점으로 고정해 두어야 올해 숫자가 줄었는지, 목표에 얼마나 다가갔는지 잴 수 있다. GHG 프로토콜 기업 표준 5장은 검증 가능한 배출량 자료가 있는 해를 기준연도로 고르고, 고른 이유를 밝히라고 한다. 기준연도가 정해져야 그 뒤 해마다의 숫자가 비로소 성과로 읽힌다.","기준연도는 가장 배출이 적었던 해나 보고서를 처음 낸 해를 기념하려는 것이 아니다. 목표의 분모다. 기아는 2024년 대비 Scope 1·2와 Scope 3 사용 단계를 2035년까지 63% 줄이는 목표를 세웠다. 이때 2024년 배출량이 흔들리면 목표 숫자도 함께 흔들린다. 그래서 기준연도 숫자는 목표 쪽과 데이터 표 쪽에서 같은 값인지 대조해야 한다."],"req":"감축 목표와 성과를 비교할 출발점으로 기준연도를 정하고, 고른 이유와 그 해의 배출량을 밝힌다.","ex":{"k":"기아 보고서에서는","t":"32쪽은 SBTi 승인을 바탕으로 ‘2024년 대비 Scope 1, 2 및 Scope 3 사용 단계 모두 2035년까지 63%를 감축하는 목표’를 세웠다고 적었다. 로드맵의 2024년 Scope 1·2는 ‘SBTi 기준 적용’ 1,194천 톤이고, 130쪽 표의 2024년 값은 ‘SBTi 기준 미적용’ 1,178.5천 톤이다.","co":"kia","page":32},"terms":[{"t":"기준연도","d":"감축 목표와 성과를 비교하는 출발점이 되는 해다.","en":"base year"}]},{"no":"재산정","label":"기준연도를 다시 계산해야 할 때","src":"https://ghgprotocol.org/sites/default/files/ghgp/standards/ghg-protocol-revised.pdf","prose":["회사의 모습이 바뀌면 기준연도 숫자도 다시 계산한다. GHG 프로토콜이 꼽는 경우는 세 가지다. 인수·합병·매각처럼 구조가 바뀔 때, 산정 방법이나 배출계수가 바뀌어 숫자가 크게 달라질 때, 큰 오류를 발견했을 때다. 무엇이 ‘크다’인지는 회사가 유의성 기준으로 미리 정해 두고, 검증기관은 그 정책을 지켰는지 본다. 그래서 재산정 정책은 미리 문서로 정해 두는 것이 좋다.","반대로 생산량이 늘거나 줄어 생긴 변화는 재산정하지 않는다. 그것은 실제 배출 변화이기 때문이다. 신규 공장 가동으로 배출이 늘었다면 기준연도는 그대로 두고 늘어난 숫자를 그대로 보여 준다. 흔한 실수는 반대로, 계산 방법을 바꾸고도 과거 숫자를 그대로 두는 것이다. 그러면 추세 그래프가 실제 변화인지 계산 방식 변화인지 구별할 수 없다.","현대차는 SBTi 가입에 따라 조직경계를 연결기준으로 설정하고 2024년을 기준연도로 재산정했다고 밝혔다. 기아는 2025년부터 사용 단계 주행거리 가정을 20만 km에서 22만 km로 올렸다고 각주에 적었지만, 2023·2024년은 20만 km 값 그대로다. 같은 표 안에서 계산 규칙이 다른 해가 섞인 예다. 이런 표에서 연도 간 증감을 그대로 실제 성과로 읽으면 안 된다."],"req":"구조 변화, 산정 방법 변화, 유의한 오류가 있으면 기준연도 배출량을 재산정하고, 생산량 증감 같은 실제 변화는 재산정하지 않는다.","ex":{"k":"현대차 보고서에서는","t":"38쪽 각주 1)은 ‘2024년 온실가스 배출량은 SBTi 승인 기준과 연계하여 기준년도(2024년) 배출량을 재산정함에 따라 직전년도 보고 데이터와 차이가 발생함’이라고 적었다.","co":"hyundai","page":38},"terms":[{"t":"재산정","d":"구조·방법 변화나 오류가 생겼을 때 기준연도와 과거 배출량을 다시 계산하는 일이다.","en":"base year recalculation"},{"t":"유의성 기준","d":"재산정을 할 만큼 큰 변화인지 가르는, 회사가 미리 정한 비율이다.","en":"significance threshold"}]}],"write":{"q":"공장에서 LNG 보일러를 땠을 때 배출량은 어떻게 구하나?","must":[["사용량","활동자료","연료량"],["배출계수","배출 계수"],["곱","×"]],"bonus":[["GWP","지구온난화지수"],["tCO2e","CO2e","환산"]],"wrong":["전기요금","탄소가격","매출"],"model":"연료 사용량(활동자료)에 배출계수를 곱하고, 가스별 값에 GWP를 곱해 tCO2e로 합친다.","src":"GHG 프로토콜 기업 표준 6장"},"check":{"q":"다음 중 기준연도를 재산정해야 하는 경우는?","options":["판매가 늘어 생산량이 20% 증가했다","다른 회사의 공장을 인수했다","신규 공장을 지어 가동했다"],"ans":1,"why":"인수는 구조 변화이므로 인수한 공장의 기준연도 배출을 더해 재산정한다. 생산량 증가나 자체 신규 공장은 실제 배출 변화(유기적 성장)이므로 재산정하지 않는다."},"summary":["배출량은 기본적으로 활동자료 × 배출계수(× GWP)로 계산하며, 국내 사업장은 배출권거래제 지침이 정한 방법을 따른다.","기준연도는 감축 목표와 성과를 비교할 출발점으로, 목표의 분모 역할을 한다.","구조 변화, 방법 변화, 유의한 오류가 있으면 재산정하고, 생산량 증감 같은 실제 변화는 재산정하지 않는다."]},{"id":"b1-5","title":"숫자를 믿게 하는 법: 데이터 품질, 검증·인증, 보고서 숫자 읽기","range":"GHG 프로토콜 5원칙 · 검증의견서 · 단위","min":14,"intro":"숫자를 만들었다면 남이 믿을 수 있어야 한다. 이 회차에서는 좋은 배출량 자료의 원칙, 제3자 검증과 보증 수준, 그리고 보고서 숫자를 읽을 때 흔히 걸리는 단위 함정을 정리한다.","blocks":[{"no":"데이터 품질","label":"좋은 인벤토리의 다섯 원칙","src":"https://ghgprotocol.org/sites/default/files/ghgp/standards/ghg-protocol-revised.pdf","prose":["GHG 프로토콜 기업 표준은 모든 산정의 바탕이 되는 다섯 원칙을 둔다. 관련성은 숫자가 회사의 실제 배출을 잘 보여 주고 쓰는 사람의 판단에 쓸모 있어야 한다는 뜻이다. 완전성은 경계 안의 배출원을 모두 넣고, 뺀 것은 밝히고 이유를 대라는 것이다. 일관성은 해마다 같은 방법을 써서 비교가 되게 하라는 것이다. 나머지 두 원칙은 투명성과 정확성이다.","투명성은 남이 따라가며 확인할 수 있게 근거 자료를 남기라는 것이고, 정확성은 일부러 많게 또는 적게 잡지 말고 불확실성을 줄이라는 것이다. 이 다섯 가지는 검증기관이 숫자를 볼 때의 질문 목록이기도 하다. 예를 들어 출장 배출을 일부 교통수단만 셌다면 완전성 문제이고, 올해만 다른 계수를 썼다면 일관성 문제다. 원칙의 이름보다 각 원칙이 묻는 질문을 기억하는 편이 실무에 쓸모 있다.","실무에서 데이터 품질은 산정 시트에서 결정된다. 활동자료의 출처(고지서, 계량기, 추정), 계수의 출처와 판, 담당자와 확인일을 시트에 함께 적어 두면 다섯 원칙을 대부분 지킬 수 있다. 현대차 해외 사업장을 검증한 LRQA는 산정 시트에서 오류 가능성을 높이는 약점을 찾아 고치고, 담당 인원 교육 체계를 개선하라고 권고했다."],"req":"배출량 자료는 관련성, 완전성, 일관성, 투명성, 정확성의 다섯 원칙에 맞게 만들고 근거를 남긴다.","ex":{"k":"현대차 보고서에서는","t":"159쪽 LRQA 의견서는 ‘Scope 3 배출 중 Category 6 출장 및 Category 7 직원 출퇴근에 대한 배출 보고의 완전성과 정확성을 제고하기 위해 일부 제외된 교통 수단에 대한 모니터링 절차를 개선할 것’을 권고했다.","co":"hyundai","page":159},"terms":[{"t":"완전성","d":"정한 경계 안의 모든 배출원을 포함하고, 제외한 것은 밝히고 이유를 대는 원칙이다.","en":"completeness"},{"t":"불확실성","d":"산정한 숫자가 실제 값과 얼마나 다를 수 있는지의 정도다.","en":"uncertainty"}]},{"no":"검증","label":"제3자가 숫자를 확인한다","src":"https://www.iaasb.org/news-events/2025-05/iaasb-announces-withdrawal-isae-3410-assurance-engagements-greenhouse-gas-statements","prose":["검증은 회사 밖의 전문기관이 배출량 숫자와 산정 과정을 확인해 의견을 내는 절차다. 보고서 뒤쪽의 ‘검증의견서’가 그 결과다. 의견서에서 먼저 볼 것은 세 가지다. 무엇을 검증했나(범위), 어떤 기준으로 했나(검증 기준), 얼마나 엄격하게 했나(보증 수준과 중요성 기준)다. 이 세 줄로 숫자를 얼마나 믿을지 정한다. 의견서가 붙지 않은 숫자는 회사가 스스로 낸 값이라는 점도 기억한다.","검증 기준은 여러 가지다. 기아의 LRQA 의견서는 ISO 14064-3:2019 절차를 썼고, 현대차 해외 사업장 의견서는 ISAE 3000과 ISAE 3410을 썼다. 국내 명세서는 배출권거래제 검증지침을 따른다. 국제감사인증기준위원회(IAASB)는 온실가스 전용 기준인 ISAE 3410을 2026년 12월 15일에 폐지하고, 지속가능성 정보 전체를 다루는 ISSA 5000으로 대신한다고 발표했다."],"req":"검증의견서에서 검증 범위, 검증 기준, 보증 수준과 중요성 기준을 확인한다.","ex":{"k":"기아 보고서에서는","t":"155쪽 LRQA 의견서는 ‘ISO14064-3:2019 … 의 검증 절차를 활용하여 제한적 보증 수준 및 5%의 중요성 기준으로’ 검증했고, 국내 사업장 배출량은 한국 배출권거래제를 통해 검증받은 데이터가 반영되었는지 확인했다고 적었다.","co":"kia","page":155},"terms":[{"t":"검증의견서","d":"외부 검증기관이 배출량 숫자를 확인한 범위, 기준, 결론을 적은 문서다.","en":"verification statement"},{"t":"중요성 기준","d":"오류가 검증 결론을 바꿀 만큼 큰지 가르는 기준으로, 보통 총배출량 대비 비율로 정한다.","en":"materiality threshold"}]},{"no":"보증 수준","label":"제한적 보증과 합리적 보증","src":"https://www.fsc.go.kr/po010101/87280","prose":["보증 수준은 두 가지다. 합리적 보증은 재무제표 감사에 가까운 수준으로, 사업장의 원시데이터까지 확인하며 증거를 많이 모은다. 결론도 ‘적정하게 산정되었다’처럼 적극적으로 쓴다. 제한적 보증은 모은 데이터를 중심으로 증거를 덜 모으고, 결론도 ‘잘못되었다고 의심할 사항을 발견하지 못했다’처럼 소극적으로 쓴다. 더 엄격한 것은 합리적 보증이다.","한 회사 안에서도 두 수준이 섞인다. 현대차 국내 사업장 명세서는 DNV가 합리적 보증 수준, 중요성 2.5%로 검증했고, 해외 사업장과 글로벌 Scope 3는 LRQA가 제한적 보증 수준, 중요성 5%로 검증했다. 같은 표의 숫자라도 칸마다 믿을 수 있는 정도가 다른 셈이다. 그래서 숫자를 인용할 때는 어느 의견서가 어떤 수준으로 확인한 값인지 함께 적는다.","공시 인증도 같은 질문을 받는다. 금융위원회 최종안은 의무공시 2년 뒤인 2030년부터 인증을 의무화하기로 했다. 다만 인증의 범위와 수준은 자본시장법령 개정 과정에서 정하기로 해, 아직 확정되지 않았다. 그래서 지금 준비하는 회사는 숫자마다 현재 보증 수준을 적어 두고, 합리적 보증에 대비해 원시데이터를 남긴다. 고지서, 계량 기록, 계수 출처가 그 원시데이터다."],"req":"합리적 보증이 제한적 보증보다 증거를 더 많이 모으는 엄격한 수준이며, 숫자마다 어떤 수준의 보증을 받았는지 확인한다.","quote":"제한적 보증 수준의 검증은 합리적 보증 수준의 검증보다 보증 수준이 현저히 낮습니다.","fig":{"cap":"현대차 2025년도 온실가스 검증 비교 (157·159쪽)","head":["구분","국내 Scope 1·2","해외 Scope 1·2, 글로벌 Scope 3"],"rows":[["검증기관","DNV","LRQA"],["보증 수준","합리적","제한적"],["중요성 기준","2.5%","5%"],["근거","배출권거래제 보고·인증 지침, 검증지침","ISAE 3000, ISAE 3410"]]},"terms":[{"t":"합리적 보증","d":"원시데이터까지 확인하며 증거를 많이 모아 적극적인 결론을 내는, 더 엄격한 보증 수준이다.","en":"reasonable assurance"},{"t":"제한적 보증","d":"취합된 데이터를 중심으로 증거를 덜 모아 소극적인 결론을 내는 보증 수준이다.","en":"limited assurance"}]},{"no":"단위","label":"보고서 숫자 읽기: 단위 함정","src":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html","prose":["IFRS S2와 KSSB 제2호는 온실가스 절대 총배출량을 이산화탄소 환산 톤으로 표시하라고 한다. 그런데 회사마다 표의 단위가 다르다. 기아 130쪽 표의 단위는 ‘천tCO2e’다. Scope 1이 398.5로 적혀 있으면 398,500톤이다. 현대차 38쪽 표는 ‘tCO2-eq’ 단위로 720,642처럼 톤을 그대로 적는다. 단위 칸을 놓치면 1,000배를 틀린다.","같은 회사 안에서도 쪽마다 단위가 바뀐다. 기아 130쪽의 판매된 제품의 사용 114,663.1천 톤은 156쪽 검증의견서 표에서 114,663,082톤으로 적혀 있다. 두 숫자는 같은 값이다. 집약도도 조심한다. 기아의 Scope 1&2 집약도 0.39는 ‘tCO2e/대’, 즉 차 한 대를 만들 때의 톤이다. 총량과 집약도를 섞어 비교하면 안 된다.","숫자를 옮겨 적을 때는 세 가지를 함께 적는다. 단위, Scope 2 방식(지역기반 또는 시장기반), 그리고 출처 쪽수다. 예를 들어 ‘기아 2025 Scope 1+2 1,096.4천 tCO2e(시장기반, 130쪽)’처럼 쓰면 나중에 다른 사람이 확인할 수 있다. 이 습관 하나가 공시 진단의 실수 대부분을 막는다. 특히 두 회사를 비교할 때는 단위를 먼저 맞춘 뒤 숫자를 본다."],"req":"보고서 숫자를 읽을 때는 단위(톤·천 톤·집약도), Scope 2 방식, 출처 쪽수를 함께 확인하고 적는다.","ex":{"k":"기아 보고서에서는","t":"130쪽 표는 2025년 총 배출량(Scope1&2)을 1,096.4 ‘천tCO2e’, 온실가스 배출량 집약도를 0.39 ‘tCO2e/대’로 적었다. 같은 표 안에 두 단위가 함께 있다.","co":"kia","page":130},"terms":[{"t":"배출 집약도","d":"생산량이나 매출 같은 한 단위당 배출량으로, 총량과 다른 지표다.","en":"emissions intensity"}]}],"write":{"q":"제한적 보증과 합리적 보증 중 더 엄격한 것은 무엇이고, 왜 그런가?","must":[["합리적"],["증거","원시데이터","원시 데이터"],["많이","더 많","폭넓","넓게"]],"bonus":[["감사","재무제표"],["제한적"]],"wrong":["둘은 같다","제한적 보증이 더 엄격"],"model":"합리적 보증이 더 엄격하며, 사업장의 원시데이터까지 확인하며 증거를 더 많이 모은다.","src":"기아·현대차 검증의견서, 금융위원회 2026-07-08 최종안"},"check":{"q":"기아 130쪽 표에서 2025년 Scope 1이 ‘398.5’, 단위가 ‘천tCO2e’로 적혀 있다. 몇 톤인가?","options":["398.5톤","398,500톤","398,500,000톤"],"ans":1,"why":"천tCO2e는 1,000톤 단위이므로 398.5 × 1,000 = 398,500톤이다. 156쪽 검증의견서의 사업장별 Scope 1을 더해도 약 398,548톤이 된다."},"summary":["좋은 배출량 자료는 관련성, 완전성, 일관성, 투명성, 정확성의 다섯 원칙을 지키고 근거를 남긴다.","검증의견서에서는 범위, 기준, 보증 수준을 보며, 합리적 보증이 제한적 보증보다 증거를 더 많이 모으는 엄격한 수준이다.","보고서 숫자는 단위(천 톤 등), Scope 2 방식, 출처 쪽수를 함께 확인해야 1,000배 같은 실수를 막는다."]}],"b2":[{"id":"b2-1","title":"국제: 기후변화협약, 파리협정, NDC, IPCC","range":"UNFCCC · 파리협정 · 한국 NDC · IPCC","min":12,"intro":"한국의 감축 목표와 기업의 공시는 모두 국제 약속에서 출발한다. 이 회차에서는 기후변화협약과 파리협정이 무엇을 정했고, 나라별 목표(NDC)와 IPCC가 기업 실무와 어떻게 이어지는지 정리한다.","blocks":[{"no":"UNFCCC","label":"기후변화협약: 모든 약속의 바탕","src":"https://unfccc.int/process-and-meetings/united-nations-framework-convention-on-climate-change","prose":["유엔기후변화협약(UNFCCC)은 1992년 5월 9일 뉴욕 유엔 본부에서 채택되어 1994년 3월 21일 발효되었다. 지금 당사국은 197개 나라와 유럽연합을 합쳐 198개다. 협약의 최종 목표는 대기 중 온실가스 농도를 사람이 기후 체계에 위험한 영향을 주지 않을 수준으로 안정시키는 것이다. 당사국은 해마다 당사국총회(COP)를 열어 세부 규칙을 정한다. 뉴스에 나오는 ‘COP30’ 같은 이름이 이 회의다.","협약은 방향을 정한 틀이고, 구체적인 감축 의무는 그 아래 의정서와 협정이 정한다. 1997년 12월 11일 채택되어 2005년 발효된 교토의정서는 37개 선진국과 유럽공동체에 구속력 있는 감축 목표를 지웠다. 공시에서 ‘교토의정서의 온실가스’라는 말이 나오는 것도 이 의정서가 감축 대상 가스를 정했기 때문이다. 2015년 파리협정은 선진국만이 아니라 모든 당사국이 스스로 목표를 내도록 방식을 바꿨다.","기업 실무와 협약은 멀어 보이지만 연결 고리가 분명하다. 나라가 협약에 따라 국가 배출 통계를 내고 감축 목표를 세우면, 그 목표를 이루려고 국내 법과 배출권거래제가 생긴다. 그리고 투자자는 그 규제가 회사의 비용에 어떤 영향을 줄지 공시로 묻는다. 국제 약속에서 회사 보고서까지 이어지는 이 사슬을 기억해 두면 제도 이름이 덜 헷갈린다."],"req":"기후변화협약은 온실가스 농도 안정화를 최종 목표로 하는 기본 틀이며, 의정서와 협정이 구체적 약속을 정한다.","terms":[{"t":"유엔기후변화협약","d":"1992년 채택되어 1994년 발효된, 온실가스 농도를 안정시키려는 국제 기본 조약이다.","en":"UNFCCC"},{"t":"당사국총회","d":"협약 당사국이 해마다 모여 세부 규칙을 정하는 최고 의사결정 회의다.","en":"Conference of the Parties (COP)"}]},{"no":"파리협정","label":"모든 나라가 목표를 내는 방식","src":"https://unfccc.int/process-and-meetings/the-paris-agreement","prose":["파리협정은 2015년 12월 12일 프랑스 파리의 COP21에서 195개 당사국이 채택했고, 2016년 11월 4일 발효되었다. 핵심 목표는 지구 평균기온 상승을 산업화 이전 대비 2°C보다 훨씬 낮게 유지하고, 1.5°C로 제한하도록 노력하는 것이다. 기업 보고서의 ‘1.5°C 시나리오’, ‘2°C 시나리오’라는 말이 여기서 나온다.","파리협정의 특징은 위에서 의무를 나눠 주지 않고 각 나라가 스스로 목표를 정해 내게 한 것이다. 대신 5년 주기로 점점 더 높은 목표를 내도록 했다. 또 2024년부터 각 나라가 감축 행동과 진척을 투명하게 보고하게 하는 강화된 투명성 체계를 두었다. 이 보고 내용은 전 지구적 진척을 점검하는 전지구적 이행점검(Global Stocktake)에 쓰인다.","기업에게 파리협정은 목표의 기준선이 된다. 현대차 보고서는 ‘파리협정의 방향성과 목표를 적극 지지’한다고 적었다. 기업 보고서의 시나리오 분석이 1.5°C나 2°C 같은 온도를 기준으로 삼는 것도 이 때문이다. 그래서 회사 목표나 시나리오를 읽을 때는 그것이 어느 온도 경로에 맞춰졌는지를 함께 본다. 온도 숫자가 빠진 목표는 비교하기 어렵다."],"req":"파리협정은 2°C보다 훨씬 낮게, 1.5°C로 제한하도록 노력한다는 목표 아래 각 나라가 5년 주기로 스스로 목표를 내게 한다.","quote":"hold the increase in the global average temperature to well below 2°C above pre-industrial levels","terms":[{"t":"파리협정","d":"2015년 채택된 기후 협정으로, 모든 당사국이 스스로 정한 감축 목표를 5년마다 내게 한다.","en":"Paris Agreement"},{"t":"전지구적 이행점검","d":"파리협정 목표를 향한 세계 전체의 진척을 주기적으로 점검하는 절차다.","en":"Global Stocktake"}]},{"no":"NDC","label":"나라별 감축 목표와 한국의 두 숫자","src":"https://unfccc.int/sites/default/files/2025-12/The%20Republic%20of%20Koreas%202035%20NDC.pdf","prose":["NDC는 ‘국가가 스스로 정한 기여’라는 뜻으로, 파리협정에 따라 각 나라가 유엔에 내는 감축 목표다. 한국의 2030 NDC는 2018년 총배출량 727.6백만 톤 대비 40%를 줄여 2030년 436.6백만 톤으로 낮추는 것이다. 2025년 12월 낸 2035 NDC는 2018년 순배출량 742.3백만 톤 대비 53~61%를 줄여 348.9~289.5백만 톤으로 낮추는 범위 목표다.","두 목표의 2018년 숫자가 다른 것은 계산 규칙이 달라서다. 2030 NDC는 흡수량을 빼지 않은 총배출량을 1996 IPCC 지침과 2차 평가보고서(SAR)의 GWP로 셌다. 2035 NDC는 숲 같은 흡수원을 반영한 순배출량을 2006 IPCC 지침과 5차 평가보고서(AR5)의 GWP로 셌다. 같은 해라도 규칙이 다르면 숫자가 다르다는 「온실가스와 Scope」의 교훈이 국가 단위에서도 그대로 나타난다.","NDC는 국내 제도의 출발점이다. 2035 NDC 문서는 배출권거래제가 국가 배출량의 70% 이상을 다룬다고 적었다. 정부는 NDC를 이루려고 업종별 감축 경로와 배출권 할당량을 정하고, 그 결과가 회사의 배출권 비용이 된다. 그래서 회사의 전환 위험을 분석할 때 NDC 숫자가 가정으로 자주 쓰인다. NDC가 높아지면 배출권 공급이 줄고 회사가 사야 할 배출권이 늘 수 있다."],"req":"NDC는 각 나라가 파리협정에 따라 내는 감축 목표이며, 한국은 2030년 40%(2018년 총배출 대비), 2035년 53~61%(2018년 순배출 대비)를 냈다.","fig":{"cap":"한국의 두 NDC 비교 (유엔 제출 문서)","head":["구분","2030 NDC","2035 NDC"],"rows":[["2018년 기준값","총배출 727.6백만 톤","순배출 742.3백만 톤"],["감축률","40%","53~61%"],["목표 배출량","436.6백만 톤","348.9~289.5백만 톤"],["산정 지침","1996 IPCC 지침","2006 IPCC 지침"],["GWP","SAR 100년","AR5 100년"]]},"terms":[{"t":"NDC","d":"각 나라가 파리협정에 따라 스스로 정해 유엔에 내는 온실가스 감축 목표다.","en":"nationally determined contribution"},{"t":"순배출량","d":"총배출량에서 숲 같은 흡수원이 흡수한 양을 뺀 배출량이다.","en":"net emissions"}]},{"no":"IPCC","label":"과학을 정리하는 기구","src":"https://www.ipcc.ch/site/assets/uploads/2024/04/IPCCFactSheet_WhatisIPCC.pdf","prose":["IPCC(기후변화에 관한 정부 간 협의체)는 1988년 세계기상기구(WMO)와 유엔환경계획(UNEP)이 만들었고 회원국은 195개다. 정책 결정자에게 기후변화의 과학, 영향과 위험, 적응과 감축 방안을 정기적으로 평가해 주는 것이 임무다. IPCC는 직접 연구를 하지 않고, 이미 발표된 연구를 모아 평가한다. 평가는 정책에 쓸모 있게 하되 특정 정책을 처방하지는 않는다.","IPCC에는 세 개의 실무그룹과 국가 온실가스 인벤토리 태스크포스(TFI)가 있다. 1실무그룹은 기후과학, 2실무그룹은 영향·적응·취약성, 3실무그룹은 감축을 다룬다. TFI는 나라들이 배출 통계를 만들 때 쓰는 산정 지침을 만든다. 「온실가스와 Scope」에서 본 GWP 값은 평가보고서에서, 2035 NDC가 쓴 2006 IPCC 지침은 TFI에서 나온다.","지금은 7차 평가 주기로, 2023년 7월 시작했다. IPCC 누리집은 첫 7차 산출물인 도시 특별보고서를 2027년 3월에, 종합보고서를 2029년 말까지 낸다고 안내한다. 세 실무그룹 보고서의 일정은 2026년 10월 총회에서 정하기로 되어 있었다. 7차 보고서가 나오면 GWP 값도 바뀔 수 있으므로, 공시 담당자는 IPCC 일정도 눈여겨본다."],"req":"IPCC는 발표된 연구를 평가해 보고서를 내는 기구이며, 그 평가보고서의 GWP와 TFI의 산정 지침이 배출량 계산의 바탕이 된다.","terms":[{"t":"TFI","d":"IPCC 안에서 국가 온실가스 인벤토리 산정 지침을 만드는 태스크포스다.","en":"Task Force on National Greenhouse Gas Inventories"},{"t":"인벤토리","d":"정해진 범위에서 일정 기간 배출·흡수한 온실가스를 배출원별로 정리한 목록이다.","en":"GHG inventory"}]}],"write":{"q":"IPCC는 무슨 일을 하고, 배출량 산정 실무와 어떻게 이어지나?","must":[["평가","검토","종합"],["GWP","지구온난화지수"],["지침","인벤토리","산정 지침"]],"bonus":[["직접 연구","연구하지"],["과학"]],"wrong":["규제 기관","배출권을 할당"],"model":"IPCC는 직접 연구하지 않고 발표된 연구를 평가해 보고서를 내며, 그 평가보고서의 GWP와 국가 인벤토리 지침이 배출량 산정에 쓰인다.","src":"IPCC 팩트시트(2024)"},"check":{"q":"파리협정에서 각 나라가 감축 목표(NDC)를 새로 내는 주기는?","options":["매년","5년","10년"],"ans":1,"why":"파리협정은 5년 주기로 점점 더 높은 목표를 내도록 한다. 한국은 2030 NDC에 이어 2025년에 2035 NDC를 냈다."},"summary":["기후변화협약(1992년 채택, 1994년 발효)은 기본 틀이고, 파리협정(2015년 채택, 2016년 발효)은 모든 나라가 5년마다 목표를 내게 했다.","한국의 NDC는 2030년 40%(2018년 총배출 대비)와 2035년 53~61%(2018년 순배출 대비)이며, 두 목표는 산정 지침과 GWP가 다르다.","IPCC는 발표된 연구를 평가하는 기구로, GWP 값과 국가 인벤토리 지침의 출처다."]},{"id":"b2-2","title":"한국: 탄소중립기본법, NDC, 배출권거래제, 목표관리제","range":"탄소중립기본법 · 배출권거래법 · 목표관리제 (2026-10 기준)","min":14,"intro":"국제 약속은 국내 법과 제도로 내려와 회사의 의무가 된다. 이 회차에서는 한국의 목표를 정하는 법, 큰 배출 기업에 값을 매기는 배출권거래제, 그보다 작은 기업을 관리하는 목표관리제를 2026년 10월 기준으로 정리한다.","blocks":[{"no":"탄소중립기본법","label":"국가 목표를 법으로 정한다","src":"국가법령정보센터 「기후위기 대응을 위한 탄소중립·녹색성장 기본법」(법률 제21122호, 시행 2026.11.12.; 제8조 개정분 시행 2027.3.9.) 및 시행령 제3조; https://www.mcee.go.kr/home/web/board/read.do?pagerOffset=0&maxPageItems=10&maxIndexPages=10&menuId=10598&boardId=1886480&boardMasterId=939","prose":["‘기후위기 대응을 위한 탄소중립·녹색성장 기본법’(줄여서 탄소중립기본법)은 한국 감축 정책의 뼈대다. 이 법과 시행령은 2030년까지 2018년 대비 40%를 줄이는 목표를 두었다. 법은 35% 이상의 범위에서 정하게 했고, 시행령이 40%로 정했다. 그런데 헌법재판소는 2024년 8월, 2031년부터 2049년까지의 목표가 비어 있다는 이유로 헌법불합치 결정을 내렸다. 2030년 40% 목표 자체는 문제가 없다고 보았다.","그 결과 2026년 8월 26일 국회 본회의에서 개정안이 통과되었다. 기후에너지환경부에 따르면 개정 법은 목표를 범위로 정한다. 2035년은 53~61%, 2040년은 69% 이상~80% 수준, 2045년은 84% 이상~90% 수준이다. 개정 법률은 2026년 9월 8일 공포되었다. 국가법령정보센터의 법령 본문을 보면, 새 목표를 담은 제8조는 2027년 3월 9일부터 시행된다. 그 전까지는 종전 제8조(2030년 35% 이상, 시행령으로 40%)가 그대로 적용된다. 새 제8조는 2035년 이후 목표를 하한과 상한의 범위로 정하되, 하한은 배출권거래제 같은 규제가 적용되는 목표로 삼는다고 못 박았다. 2040년과 2045년의 정확한 수치는 각각 69% 이상·80% 수준, 84% 이상·90% 수준의 범위에서 대통령령으로 정한다. 참고로 2026년 11월 12일 시행되는 법률(제21122호)은 2025년 11월 개정분으로, 국가기후위기대응위원회 등 조직 관련 조문이 바뀐 것이며 감축 목표 조문은 아직 종전 그대로다.","제도를 맡는 정부 조직도 바뀌었다. 2025년 10월 환경부가 기후에너지환경부로 출범해 기후와 에너지 정책을 함께 맡는다. 그래서 2025년 이전 자료에는 ‘환경부고시’, 그 뒤 자료에는 기후에너지환경부 이름이 보인다. 국가 온실가스 통계는 온실가스종합정보센터(GIR)가 총괄 관리하며, 해마다 국가 인벤토리 보고서를 낸다. 공시 기준을 만드는 KSSB와는 하는 일이 다르다."],"req":"탄소중립기본법은 2030년 40% 목표(법 35% 이상 + 시행령 40%)를 두고, 2026년 9월 개정(2027년 3월 9일 시행)으로 2035년 53~61%, 2040·2045년 범위 목표를 제8조에 넣었다.","fig":{"cap":"개정 탄소중립기본법의 감축 목표 (2018년 대비, 기후에너지환경부 2026.8.26)","head":["연도","하한","상한","확정 방식"],"rows":[["2030년","40%","-","현행 유지"],["2035년","53%","61%","2035 NDC와 같음"],["2040년","69% 이상","80% 수준","2031.6.30까지 대통령령"],["2045년","84% 이상","90% 수준","2036.6.30까지 대통령령"]]},"terms":[{"t":"헌법불합치","d":"법이 헌법에 맞지 않지만 바로 무효로 하지 않고 국회가 고칠 때까지 효력을 유지하게 하는 결정이다.","en":"constitutional nonconformity"},{"t":"온실가스종합정보센터","d":"국가 온실가스 통계를 총괄 관리하고 국가 인벤토리 보고서를 해마다 내는 기관이다.","en":"Greenhouse Gas Inventory and Research Center (GIR)"}],"quote":"정부는 2035년 이후의 중장기감축목표를 하한 및 상한의 범위 형태로 설정한다. 이 경우 하한은 「온실가스 배출권의 할당 및 거래에 관한 법률」에 따른 배출권거래제 등의 규제가 적용되는 목표로 한다.","qno":"제8조제3항(2027.3.9. 시행)"},{"no":"배출권거래제","label":"배출에 값을 매기는 제도","src":"국가법령정보센터 「온실가스 배출권의 할당 및 거래에 관한 법률」(법률 제21071호, 시행 2026.4.29.) 제8조; https://mcee.go.kr/eng/web/board/read.do?boardCategoryId=&boardId=1820110&boardMasterId=522&decorator=&maxIndexPages=10&maxPageItems=10&menuId=461&orgCd=&pagerOffset=0&searchKey=&searchValue=","prose":["배출권거래제(K-ETS)는 정부가 큰 배출 기업마다 한 해에 배출해도 되는 양의 한도, 즉 할당량을 정해 주는 제도다. 1톤을 배출할 권리가 배출권 1개다. 기업은 실제 배출량만큼 배출권을 내야 한다. 할당량보다 많이 배출했다면 남는 회사에서 배출권을 사야 하고, 다 내지 못하면 과징금이 붙는다. 적게 배출했다면 남은 배출권을 팔거나 다음 해로 넘길(이월) 수 있다. 그래서 할당량은 작년에 실제로 낸 양이나 회사가 스스로 정한 목표와 다른 개념이다.","누가 대상인지는 배출권거래법 제8조가 정한다. 최근 3년 연평균 배출량이 업체 전체로 12만 5천 tCO2e 이상이거나, 2만 5천 tCO2e 이상인 사업장을 하나 이상 가진 업체다. 지금은 제4차 계획기간(2026~2030)이다. 정부는 배출허용총량을 25억 3,730만 톤으로 정했고, 2025년 12월 772개 업체에 23억 6,299만 톤을 할당했다. 2035 NDC 문서는 이 제도가 국가 배출량의 70% 이상을 다룬다고 적었다.","4차의 큰 변화는 돈을 내고 사야 하는 몫(유상할당)이다. 발전 부문은 유상할당 비율을 2030년까지 단계적으로 50%로 올린다. 발전 외 업종 가운데 수출 비중이 높은 업종은 100% 무상이고, 나머지는 10%에서 15%로 오른다. 기아는 보고서에서 ‘배출권 할당 축소 및 탄소가격 상승에 따른 배출권 구매 비용 증가 가능성’을 전환 위험으로 꼽았다."],"req":"배출권거래제는 할당대상업체에 배출 한도(할당량)를 주고 실제 배출량만큼 배출권을 내게 하며, 남거나 모자란 배출권은 사고팔거나 이월한다.","fig":{"cap":"제4차 계획기간(2026~2030) 할당 결과 (2025.12.26 발표)","head":["구분","업체 수","할당량"],"rows":[["발전 부문","59개","7억 9,575만 톤"],["발전 외 부문","713개","15억 6,724만 톤"],["합계","772개","23억 6,299만 톤"]]},"ex":{"k":"기아 보고서에서는","t":"30쪽은 ‘2015년부터 배출권 거래제에 참여했으며’ 국내 AutoLand 사업장의 에너지 관리 시스템으로 주요 에너지원별 탄소배출량을 관리한다고 적었다. 같은 쪽 위험 표는 ‘국내 및 유럽 배출권거래제 유상할당 비율 확대’를 정책·규제 위험으로 꼽았다.","co":"kia","page":30},"terms":[{"t":"할당량","d":"정부가 할당대상업체에 정해 준, 그 이행연도에 배출해도 되는 양의 한도다.","en":"allocation"},{"t":"유상할당","d":"배출권 가운데 경매 등으로 돈을 내고 사야 하는 몫이다.","en":"auctioning"},{"t":"계획기간","d":"배출권을 할당하고 이행 결과를 관리하는 5년 단위 기간이다.","en":"commitment period"}],"quote":"최근 3년간 온실가스 배출량의 연평균 총량이 125,000 이산화탄소상당량톤(tCO₂-eq) 이상인 업체이거나 25,000 이산화탄소상당량톤(tCO₂-eq) 이상인 사업장을 하나 이상 보유한 업체","qno":"배출권거래법 제8조제1항제1호"},{"no":"목표관리제","label":"거래제보다 작은 업체의 의무","src":"https://www.keco.or.kr/en/lay1/S295T295C306/sublink.do","prose":["배출권거래제 기준에는 못 미치지만 배출이 적지 않은 업체는 목표관리제로 관리한다. 정부가 관리업체를 지정해 감축 목표를 정해 주고, 업체는 이행 계획을 세워 실적을 보고한다. 배출권을 사고파는 시장은 없다. 한국환경공단 자료에 따르면 지정 기준은 2014년부터 업체 전체 5만 tCO2e 이상 또는 사업장 1만 5천 tCO2e 이상이고, 2022년 3월 25일 이후에도 같다.","처음에는 기준이 더 높았다. 2011년까지 업체 12만 5천 톤·사업장 2만 5천 톤이었고, 2012년부터 8만 7,500톤·2만 톤으로 낮아진 뒤 2014년에 지금 기준이 되었다. 에너지 사용량 기준도 함께 있었지만 2022년 3월 25일 이후로는 배출량 기준만 남았다. 컨설턴트가 고객사를 처음 만나면 업체 전체와 사업장별 배출량을 두 제도의 기준에 대어 보고, 어느 쪽 의무가 걸리는지부터 확인한다.","두 제도 모두 배출량을 정해진 지침으로 산정하고 외부 검증을 받아 보고하는 점은 같다. 그래서 목표관리제 업체도 언젠가 배출권거래제로 넘어갈 수 있다는 전제로 데이터를 관리하는 것이 좋다. 공시 의무가 생기는 상장사라면 이 국내 명세서 숫자가 공시 숫자의 출발점이 된다. 제도가 무엇이든 숫자를 만드는 방법은 「온실가스와 Scope」에서 본 활동자료 × 배출계수 원리와 같다."],"req":"목표관리제는 업체 5만 tCO2e 또는 사업장 1만 5천 tCO2e 이상인 관리업체에 감축 목표를 주고 이행 실적을 관리한다.","fig":{"cap":"관리업체 지정 기준의 변화 (tCO2e, 한국환경공단)","head":["적용 시기","업체 기준","사업장 기준"],"rows":[["~2011.12.31","125,000","25,000"],["2012.1.1~","87,500","20,000"],["2014.1.1~","50,000","15,000"],["2022.3.25~현재","50,000","15,000"]]},"terms":[{"t":"목표관리제","d":"배출권거래제 대상이 아닌 일정 규모 이상 업체에 정부가 감축 목표를 정해 주고 관리하는 제도다.","en":"GHG target management system"},{"t":"관리업체","d":"목표관리제 기준 이상을 배출해 정부가 지정한 업체다.","en":"controlled entity"}]}],"write":{"q":"배출권거래제에서 회사가 받는 할당량이란 무엇인가?","must":[["한도","허용","상한"],["정부","국가","주무관청"],["배출량","배출"]],"bonus":[["이행연도","그 해","한 해"],["사고","팔","이월"]],"wrong":["작년에 실제로","스스로 정한"],"model":"할당량은 정부가 정해 준, 그 이행연도에 배출해도 되는 배출량의 한도다.","src":"배출권거래법 제2조·제8조"},"check":{"q":"한 업체의 최근 3년 연평균 배출량이 7만 tCO2e이고, 2만 5천 톤 이상인 사업장이 없다. 어느 제도에 해당하나?","options":["배출권거래제 할당대상업체","목표관리제 관리업체","둘 다 해당하지 않는다"],"ans":1,"why":"배출권거래제는 업체 12만 5천 톤 또는 사업장 2만 5천 톤 이상이 기준이므로 해당하지 않는다. 목표관리제는 업체 5만 톤 이상이 기준이므로 관리업체가 된다."},"summary":["탄소중립기본법은 2030년 40% 목표를 두고, 2026년 9월 개정(2027년 3월 9일 시행)으로 2035년 53~61%, 2040년 69~80%, 2045년 84~90% 범위 목표를 정했다.","배출권거래제는 업체 12만 5천 톤·사업장 2만 5천 톤 이상 업체에 할당량을 주며, 지금은 4차 계획기간(2026~2030)이다.","그보다 작은 업체 5만 톤·사업장 1만 5천 톤 이상은 목표관리제로 감축 목표와 이행 실적을 관리한다."]},{"id":"b2-3","title":"공시 기준의 지도: TCFD에서 KSSB까지","range":"TCFD · ISSB · KSSB · ESRS · GRI · SASB · CDP","min":15,"intro":"기후 공시에는 이름이 비슷한 기준이 많다. 이 회차에서는 각 기준을 누가 누구를 위해 만들었는지, 재무 중요성과 이중 중요성이 무엇이 다른지로 지도를 그린다.","blocks":[{"no":"TCFD","label":"모든 기후 공시의 출발점","src":"https://www.ifrs.org/news-and-events/news/2023/07/foundation-welcomes-tcfd-responsibilities-from-2024/","prose":["TCFD(기후 관련 재무정보 공개 협의체)는 금융안정위원회(FSB)의 요청으로 만들어진 협의체다. TCFD 권고안은 기후 정보를 거버넌스, 전략, 위험관리, 지표 및 목표의 네 기둥으로 나눠 공개하라고 했다. 기후를 환경 홍보가 아니라 회사의 재무 위험과 기회로 보게 했다는 점이 가장 큰 변화였다. 지금의 IFRS S2와 KSSB 제2호도 이 네 기둥 구조를 그대로 쓴다.","TCFD의 일은 끝났다. IFRS 재단은 IFRS S1·S2가 TCFD 권고안을 완전히 담았다고 밝혔고, 2024년부터 TCFD의 이행 점검 업무를 넘겨받았다. 그래서 새로 공시를 준비한다면 TCFD 권고안을 따로 적용할 필요 없이 ISSB 기준이나 KSSB 기준을 쓰면 된다. 다만 많은 보고서가 여전히 ‘TCFD Index’를 싣고 있어 이름은 계속 보인다."],"req":"TCFD는 거버넌스·전략·위험관리·지표 및 목표의 네 기둥을 만들었고, 그 내용은 IFRS S1·S2에 완전히 담겼다.","ex":{"k":"기아 보고서에서는","t":"2쪽 보고서 개요는 GRI Standards 2021에 부합하게 작성했고, SASB 기준의 요구사항을 준수했으며, TCFD 권고안을 반영했다고 적었다. 한 보고서가 여러 기준을 함께 쓰는 예다.","co":"kia","page":2},"terms":[{"t":"TCFD","d":"금융안정위원회 요청으로 만들어져 기후 관련 재무정보 공개 권고안을 낸 협의체다.","en":"Task Force on Climate-related Financial Disclosures"}]},{"no":"ISSB·KSSB","label":"투자자를 위한 국제 기준과 한국 기준","src":"https://www.fsc.go.kr/po010101/87280","prose":["IFRS 재단은 2021년 11월 3일 글래스고 COP26에서 국제지속가능성기준위원회(ISSB) 설립을 발표했고, ISSB는 2023년 6월 첫 기준인 IFRS S1(일반 요구사항)과 S2(기후 관련 공시)를 냈다. IFRS S2는 투자자에게 기후 관련 위험과 기회를 공시하는 국제 기준이다. 독자는 투자자, 대여자, 그 밖의 채권자이고, 기후가 회사의 현금흐름과 자금 조달에 줄 영향을 묻는다.","한국에서 기준을 만드는 곳은 한국회계기준원 안에 2022년 11월 세워진 지속가능성기준위원회(KSSB)다. KSSB는 IFRS S1·S2를 출발점으로 삼아 2026년 2월 26일 제1호와 제2호를 의결했다. 기준은 KSSB가 만들지만 누가 언제 공시해야 하는지는 금융위원회가 정한다. 회계기준을 만드는 곳에 맡긴 것은 이 공시가 재무보고의 한 부분이라는 뜻이다.","금융위원회는 2026년 7월 8일 최종안에서 2028년(2027 회계연도분)부터 연결자산총액 10조원 이상 코스피 상장사가 사업보고서로 공시하게 했다. Scope 3는 3년 유예해 10조원 이상 기업은 2031년부터 공시한다. 제3자 인증은 2030년부터 의무화하되, 범위와 수준은 자본시장법령 개정 과정에서 정하기로 했다."],"req":"IFRS S2는 투자자를 위한 국제 기후 공시 기준이고, KSSB가 이를 바탕으로 한국 기준을 만들며 금융위원회가 의무화 일정을 정한다.","fig":{"cap":"한국 의무공시 일정 (금융위원회 2026.7.8 최종안)","head":["공시 연도","대상(코스피, 연결자산총액)","Scope 3"],"rows":[["2028년(FY27)","10조원 이상","2031년부터"],["2029년","5조원 이상","2032년부터"],["2030년","2조원 이상(확대 검토)","2033년부터(잠정)"]]},"terms":[{"t":"ISSB","d":"IFRS 재단이 만든 국제지속가능성기준위원회로, IFRS S1·S2를 제정했다.","en":"International Sustainability Standards Board"},{"t":"KSSB","d":"한국회계기준원 안에 있는 지속가능성기준위원회로, 한국 지속가능성 공시기준을 만든다.","en":"Korea Sustainability Standards Board"},{"t":"재무 중요성","d":"정보가 투자자의 판단에 영향을 줄 수 있는지를 기준으로 공시 여부를 정하는 관점이다.","en":"financial materiality"}]},{"no":"ESRS","label":"유럽의 이중 중요성","src":"https://eur-lex.europa.eu/eli/reg_del/2023/2772/oj/eng","prose":["ESRS(유럽 지속가능성 보고 기준)는 EU 기업지속가능성보고지침(CSRD)에 따른 기준으로, 위임규정 (EU) 2023/2772로 채택되었다. 가장 큰 특징은 이중 중요성이다. ESRS 1 문단 37은 이중 중요성이 ‘영향 중요성’과 ‘재무 중요성’ 두 차원이라고 한다. 회사가 사람과 환경에 주는 영향이 크면, 회사 재무에 대한 영향이 작아도 공시 대상이 된다.","그래서 ESRS는 투자자뿐 아니라 이해관계자 전체를 독자로 삼는다. 재무 중요성만 보는 IFRS S2·KSSB보다 공시 대상이 넓어질 수 있다. ESRS는 지금 바뀌는 중이다. 2차 자료에 따르면 유럽 집행위원회는 2026년 7월 3일 의무 데이터 항목을 크게 줄인 개정 ESRS 위임법을 채택했고, 이중 중요성은 그대로 유지했다. 2027 회계연도부터 적용될 것으로 예상된다.","한국 회사도 ESRS와 무관하지 않다. 유럽에 큰 자회사가 있거나 유럽 고객이 요구하면 ESRS 기준 정보가 필요하다. 기아와 현대차는 이미 ESRS의 지속가능성 주제를 써서 이중 중대성 평가를 했다고 보고서에 적었다. 같은 단어라도 기준마다 ‘중대성’, ‘중요성’으로 번역이 다르니 원어(materiality)를 함께 기억한다."],"req":"ESRS는 회사가 사람·환경에 주는 영향과 회사 재무에 대한 영향을 함께 보는 이중 중요성으로 공시 대상을 정한다.","ex":{"k":"기아 보고서에서는","t":"16쪽은 ‘유럽재무보고자문그룹(EFRAG)에서 제시하는 유럽지속가능성공시기준(ESRS)의 지속가능성 이슈 풀을 구성하고, 각 이슈가 유발하는 환경·사회 영향 및 재무적 위험과 기회를 파악’하는 이중 중대성 평가를 했다고 적었다.","co":"kia","page":16},"terms":[{"t":"이중 중요성","d":"회사가 사람·환경에 주는 영향과 회사 재무에 대한 영향 두 방향을 모두 보고 공시 대상을 정하는 관점이다.","en":"double materiality"}]},{"no":"GRI","label":"영향을 알리는 기준","src":"https://globalreporting.org/media/qadh4mpf/gri-102-climate-change-2025-frequently-asked-questions-faqs.pdf","prose":["GRI(글로벌 리포팅 이니셔티브) 기준은 회사가 사람과 환경에 주는 영향을 넓은 이해관계자에게 알리는 기준이다. 기아 보고서도 GRI Standards 2021에 부합하게 작성했다고 밝힌다. 독자가 투자자로 한정되지 않고, 회사가 어떤 영향을 주는지가 출발점이라는 점에서 IFRS S2와 방향이 다르다. 배출량 숫자는 같아도 그 숫자를 설명하는 이유가 다르다.","GRI도 기후 기준을 새로 냈다. GRI 102: Climate Change 2025는 2027년 1월 1일 이후 발간되는 기후 보고에 의무로 쓰인다. 이때 기존 GRI 305: Emissions 2016의 305-1부터 305-5까지는 폐지된다. GRI 102에도 Scope 1(102-5), Scope 2(102-6), Scope 3(102-7) 공시가 있다. 다만 회사의 기후 영향과 관련 없는 공시는 보고하지 않아도 된다. 2027년 이후 보고서에서는 GRI 색인에 102번 공시가 보이기 시작할 것이다.","실무에서는 같은 데이터를 한 번 모아 여러 기준의 칸에 나누어 싣는다. 배출량 산정은 GHG 프로토콜로 한 번 하고, 투자자용 KSSB 공시, 이해관계자용 GRI 색인, 유럽용 ESRS 색인에 같은 숫자를 건다. 그래서 보고서 뒤쪽의 GRI Index를 보면 회사가 어느 쪽에 무엇을 실었는지 한눈에 보인다. 색인은 기준별 목차 역할을 하는 셈이다."],"req":"GRI는 회사가 경제·환경·사람에 주는 영향을 이해관계자에게 알리는 기준이며, 2027년부터 기후 공시는 GRI 102로 바뀐다.","terms":[{"t":"GRI","d":"회사가 사람과 환경에 주는 영향을 이해관계자에게 알리는 보고 기준을 만드는 국제기구다.","en":"Global Reporting Initiative"}]},{"no":"SASB·CDP","label":"산업별 지표와 평가","src":"https://www.cdp.net/en/about/framework-alignment","prose":["SASB 기준은 산업마다 투자자에게 중요한 지속가능성 주제와 지표를 정리한 기준이다. 2022년 IFRS 재단에 완전히 통합되었고, IFRS S2의 산업별 지침이 이 SASB 기준을 바탕으로 한다. KSSB 제2호는 산업기반 지표 공시를 기업이 선택할 수 있게 했다. 현대차 보고서는 GRI Index, TCFD Index와 함께 SASB Index를 따로 싣고 있다.","CDP는 기준을 만드는 곳이 아니라 스스로를 독립적인 환경 공시 시스템이라고 소개하는 기관이다. 기업이 CDP 질문서에 답하면, CDP는 답변을 D-부터 A까지의 점수로 평가한다. CDP는 2024년부터 질문서를 IFRS S2와 맞췄다고 밝혔다. 국내에서는 한국ESG기준원(KCGS) 같은 평가기관이 기업의 ESG 수준을 평가해 등급을 낸다.","정리하면 기준(무엇을 어떻게 알릴지)과 평가(얼마나 잘했는지 점수 매기기)는 다른 일이다. 기준은 KSSB, ISSB, ESRS, GRI가 만들고, 평가는 CDP, KCGS 같은 기관이 한다. 국가 배출 통계를 관리하는 GIR은 공시 기준과도 평가와도 다른, 정부 쪽 통계 기관이다. 이 구분이 서면 보고서의 ‘인증·수상’ 쪽이 덜 헷갈린다."],"req":"SASB는 IFRS S2 산업별 지침의 바탕이 된 산업별 기준이고, CDP·KCGS는 기준이 아니라 기업을 평가하는 기관이다.","ex":{"k":"기아 보고서에서는","t":"12쪽 ESG 평가·수상 목록에 ‘CDP Climate Change/Water … 탄소경영 섹터 아너스 7년 연속 수상’이 들어 있다. 공시 기준이 아니라 평가 결과로 실린 것이다.","co":"kia","page":12},"terms":[{"t":"SASB 기준","d":"산업별로 투자자에게 중요한 지속가능성 주제와 지표를 정한 기준으로, IFRS 재단이 관리한다.","en":"SASB Standards"},{"t":"CDP","d":"기업에 환경 질문서를 보내 답변을 받고 D-부터 A까지 점수를 매기는 공시·평가 시스템이다.","en":"CDP"}]}],"write":{"q":"IFRS S2(KSSB)와 GRI는 독자와 중요성 관점이 어떻게 다른가?","must":[["투자자","주요이용자","채권자"],["재무"],["이해관계자","영향","임팩트"]],"bonus":[["이중","ESRS"],["사람","환경"]],"wrong":["같은 내용","이름만 다르"],"model":"IFRS S2와 KSSB는 투자자를 위해 재무 영향 중심으로, GRI는 이해관계자를 위해 회사가 사람과 환경에 주는 영향 중심으로 정보를 묻는다.","src":"IFRS S2, GRI 102 FAQ"},"check":{"q":"한국에서 지속가능성 공시 기준을 만드는 기구는?","options":["KSSB(지속가능성기준위원회)","KCGS(한국ESG기준원)","GIR(온실가스종합정보센터)"],"ans":0,"why":"KSSB가 기준을 만들고 금융위원회가 의무화 일정을 정한다. KCGS는 기업을 평가하는 기관이고, GIR은 국가 온실가스 통계를 총괄하는 기관이다."},"summary":["TCFD가 만든 네 기둥(거버넌스·전략·위험관리·지표 및 목표)은 IFRS S1·S2에 완전히 담겼고, KSSB가 이를 바탕으로 한국 기준을 만들었다.","IFRS S2·KSSB는 투자자를 위한 재무 중요성, ESRS는 영향과 재무를 함께 보는 이중 중요성, GRI는 이해관계자를 위한 영향 보고다.","SASB는 산업별 지표의 바탕이고, CDP와 KCGS는 기준이 아니라 기업을 평가하는 기관이다."]},{"id":"b2-4","title":"측정 표준의 지도: 공시 기준과 어떻게 맞물리나","range":"GHG 프로토콜 · ISO 14064 · IPCC 지침 · 국내 지침 · LCA","min":13,"intro":"공시 기준은 무엇을 알릴지 정하지만, 숫자를 어떻게 셀지는 대부분 다른 표준에 맡긴다. 이 회차에서는 배출량을 재는 표준, 검증하는 표준, 제품 단위로 재는 LCA 표준이 공시 기준과 어떻게 이어지는지 본다.","blocks":[{"no":"GHG 프로토콜","label":"회사 배출량을 재는 세계 공통 규칙","src":"https://ghgprotocol.org/blog/scope-2-market-based-method-update-2025-2026-public-consultation-current-status","prose":["GHG 프로토콜은 세계자원연구소(WRI)와 세계지속가능발전기업협의회(WBCSD)가 만든 기업 온실가스 산정 규칙이다. 기업 표준(2004 개정판)이 조직 경계와 Scope 1·2를, Scope 2 지침(2015)이 전기 배출 산정 방식을, Scope 3 표준(2011)이 15개 카테고리를 다룬다. 1권에서 배운 경계, Scope, 기준연도 규칙이 모두 여기서 나왔다.","공시 기준은 이 규칙을 빌려 쓴다. KSSB 제2호와 IFRS S2는 온실가스 배출량을 GHG 프로토콜 기업 표준(2004)에 따라 측정하라고 하고, 관할 당국이 다른 방법을 요구하면 그 방법을 쓸 수 있게 한다. 그래서 공시 담당자는 공시 기준 문단보다 GHG 프로토콜 규칙을 먼저 익혀야 숫자를 판단할 수 있다. 공시 기준은 그릇이고, 측정 표준은 그 안에 담을 숫자를 만드는 조리법이다.","GHG 프로토콜도 바뀌는 중이다. Scope 2 개정 공개 의견수렴이 2025년 10월 20일부터 2026년 1월 31일까지 열렸고, 다음 통합 의견수렴은 2027년 2분기로 잡혀 있다. GHG 프로토콜은 ISO와 함께 만드는 새 기업 표준을 2028년 4분기에 낼 계획이라고 밝혔다. 그 전까지는 지금의 표준이 기준이며, 개정 방향은 공시 담당자가 미리 살펴 둘 거리다."],"req":"공시 기준은 배출량 측정을 GHG 프로토콜에 맡기므로, 경계·Scope·기준연도 판단은 GHG 프로토콜 규칙으로 한다.","fig":{"cap":"세 층으로 보는 기준 지도","head":["층","하는 일","예"],"rows":[["알리는 규칙(공시 기준)","무엇을 누구에게 알릴지","KSSB, IFRS S2, ESRS, GRI"],["재는 규칙(측정 표준)","숫자를 어떻게 셀지","GHG 프로토콜, ISO 14064-1, IPCC 지침, 배출권거래제 보고·인증 지침"],["확인하는 규칙(검증 표준)","숫자를 어떻게 확인할지","ISO 14064-3, ISAE 3410→ISSA 5000, 배출권거래제 검증지침"],["제품 단위 규칙(LCA)","제품 하나의 일생 배출","ISO 14040·14044, ISO 14067"]]},"terms":[{"t":"GHG 프로토콜","d":"WRI와 WBCSD가 만든 기업 온실가스 산정·보고 규칙으로, 공시 기준이 측정 방법으로 빌려 쓴다.","en":"Greenhouse Gas Protocol"}]},{"no":"ISO 14064","label":"국제표준으로 재고 확인한다","src":"https://committee.iso.org/sites/tc207sc7/home/projects/published/mitigation-standards.html","prose":["ISO도 온실가스 표준을 낸다. ISO 14064-1:2018은 조직 단위로 온실가스 배출과 흡수를 산정하고 보고하는 규격이고, ISO 14064-2:2019는 감축 사업 단위, ISO 14064-3:2019는 온실가스 주장을 검증하고 타당성을 평가하는 규격이다. 검증기관이 갖춰야 할 요건은 ISO 14065:2020이 정한다. 내용은 GHG 프로토콜과 많이 겹치며, 검증의견서에서 검증 절차의 근거로 자주 인용된다.","ISO 14064-1은 지금 개정 중이다. ISO 누리집은 2018년판이 현행이지만 ‘개정될 국제표준’ 단계에 있고, 새 초안이 개발 중이라고 표시한다. GHG 프로토콜도 ISO와 함께 새 기업 표준을 준비하고 있어, 지금 쓰는 두 규칙이 몇 년 안에 가까워질 수 있다. 그러므로 산정 시트에는 어느 판을 따랐는지 적어 둔다."],"req":"ISO 14064-1은 조직 단위 산정, ISO 14064-3은 검증 규격이며, 검증의견서에 어떤 규격을 썼는지 적힌다.","ex":{"k":"기아 보고서에서는","t":"155쪽 LRQA 의견서는 ‘ISO14064-3:2019 온실가스 성명서에 대한 타당성평가 및 검증을 위한 사용규칙 및 지침’의 검증 절차를 썼고, 자신들이 ISO 14065의 인정 요구사항을 만족한다고 적었다.","co":"kia","page":155},"terms":[{"t":"ISO 14064","d":"조직 산정(1부), 사업 산정(2부), 검증(3부)으로 이루어진 온실가스 국제표준이다.","en":"ISO 14064 series"}]},{"no":"IPCC·국내 지침","label":"나라 통계의 규칙과 국내 사업장의 규칙","src":"https://unfccc.int/sites/default/files/2025-12/The%20Republic%20of%20Koreas%202035%20NDC.pdf","prose":["나라 전체 배출 통계는 IPCC 지침으로 만든다. 한국 2035 NDC는 2006 IPCC 지침을 쓰고, 일부 배출원에는 2019 개정판을, 연안 습지에는 2013 습지 보충 지침을 쓴다고 밝혔다. 기업은 이 지침을 직접 쓰지 않는 경우가 많지만, 배출계수와 산정 방법의 상당수가 여기서 나온다. 현대차는 IPCC 지침과 관련 도구를 활용했다고 적었다.","국내 할당대상업체에는 별도의 법정 규칙이 있다. 배출량은 ‘온실가스 배출권거래제의 배출량 보고 및 인증에 관한 지침’으로 산정하고, 검증은 ‘온실가스 배출권거래제 운영을 위한 검증지침’으로 받는다. 현대차 국내 명세서 검증의견서는 각각 환경부고시 제2025-64호와 제2025-165호를 근거로 들었다. 이 숫자가 공시의 국내 Scope 1·2로 그대로 들어간다.","그래서 한 보고서 안에 여러 규칙이 섞인다. 현대차 38쪽은 GHG 프로토콜, 국내 탄소중립기본법과 배출권거래제 지침, IPCC 지침, 기타 관할 당국과 거래소 기준을 함께 반영했다고 적었다. 공시 기준이 관할 당국 방법을 허용하므로 문제는 아니다. 다만 숫자마다 어느 규칙을 탔는지 표시해 두어야 검증과 비교가 가능하다."],"req":"국가 통계는 IPCC 지침, 국내 사업장은 배출권거래제 보고·인증 지침과 검증지침으로 산정·검증하며, 공시에서는 숫자마다 적용 규칙을 밝힌다.","ex":{"k":"현대차 보고서에서는","t":"157쪽 DNV 의견서는 ‘온실가스 배출권거래제의 배출량 보고 및 인증에 관한 지침(환경부고시 제2025-64호)’과 ‘온실가스 배출권거래제 운영을 위한 검증지침(환경부고시 제2025-165호)’의 원칙과 기준에 따라 합리적 보증수준에서 검증했다고 적었다.","co":"hyundai","page":157},"terms":[{"t":"IPCC 지침","d":"나라별 온실가스 인벤토리를 만들 때 쓰는 IPCC의 산정 지침으로, 지금은 2006년판과 2019년 개정판이 쓰인다.","en":"IPCC Guidelines for National GHG Inventories"}]},{"no":"LCA","label":"제품 하나의 일생을 재는 표준","src":"https://www.iso.org/standard/37456.html","prose":["회사 단위가 아니라 제품 하나의 배출을 재는 방법이 전과정평가(LCA)다. 원료를 캐는 단계부터 부품 제조, 조립, 사용, 폐기까지 제품 일생의 환경영향을 센다. 원칙과 틀은 ISO 14040:2006, 요구사항은 ISO 14044가 정하고, 온실가스만 보는 제품 탄소발자국은 ISO 14067:2018이 정한다. 회사 배출량이 ‘1년 동안 회사 전체’를 세는 것과 달리, LCA는 ‘제품 한 개의 일생’을 센다.","LCA에서 가장 먼저 정하는 것이 기능단위다. 기능단위는 비교의 기준이 되는 기능의 양이다. 자동차라면 ‘차량 1대’가 아니라 ‘승용차 1대로 20만 km를 주행하는 것’처럼 제품이 해 주는 일을 숫자로 적는다. 같은 기능을 기준으로 놓아야 전기차와 내연기관차를 공정하게 비교할 수 있다. 주행거리를 15만 km로 잡느냐 25만 km로 잡느냐에 따라 결론의 크기가 달라진다.","LCA와 회사 공시는 이어져 있다. 회사의 Scope 3 카테고리 11은 판매한 차들의 사용 단계 배출을 더한 것이므로, LCA의 주행거리 가정이 회사 숫자를 움직인다. 기아는 사용 단계 배출을 22만 km 주행 기준으로 산정했다고 130쪽에 적었다. 그래서 LCA 담당자와 공시 담당자는 같은 가정표를 공유해야 한다. 주행거리 같은 가정은 결과표 바로 옆에 적어야 독자가 확인할 수 있다."],"req":"LCA는 ISO 14040·14044와 ISO 14067로 제품 일생의 배출을 재며, 비교의 기준인 기능단위를 먼저 정한다.","ex":{"k":"기아 보고서에서는","t":"40쪽은 EV5와 내연기관 모델 스포티지를 LCA로 비교해 EV5의 GWP가 35.3tCO₂e로 스포티지 57.2tCO₂e보다 약 38% 낮다고 적었다. 원소재 채취부터 차량 폐기까지 전 생애주기를 고려한 결과라고 밝혔다.","co":"kia","page":40},"terms":[{"t":"전과정평가","d":"원료 채취부터 폐기까지 제품 일생 동안의 환경영향을 정량적으로 평가하는 방법이다.","en":"life cycle assessment (LCA)"},{"t":"기능단위","d":"비교의 기준이 되는 제품 기능의 양으로, 예를 들어 승용차 1대로 20만 km를 주행하는 것이다.","en":"functional unit"}]}],"write":{"q":"LCA에서 ‘기능단위’란 무엇인가? 예를 들어 설명해 보자.","must":[["기능","하는 일"],["기준","비교"],["양","km","주행"]],"bonus":[["20만","같은 기능"]],"wrong":["제품 1개","공장 1곳"],"model":"기능단위는 비교의 기준이 되는 기능의 양으로, 예를 들어 승용차 1대로 20만 km를 주행하는 것이다.","src":"ISO 14040:2006"},"check":{"q":"기아 155쪽 LRQA 검증의견서가 검증 절차로 쓴 표준은?","options":["ISO 14064-3:2019","ISO 14067:2018","GRI 305"],"ans":0,"why":"155쪽은 ISO14064-3:2019의 검증 절차를 활용했다고 적었다. ISO 14067은 제품 탄소발자국 산정 표준이고, GRI 305는 배출량 공시 기준이다."},"summary":["공시 기준은 무엇을 알릴지 정하고, 숫자를 세는 방법은 GHG 프로토콜·ISO 14064·IPCC 지침·국내 지침 같은 측정 표준에 맡긴다.","국내 사업장 숫자는 배출권거래제 보고·인증 지침과 검증지침을 거쳐 공시의 Scope 1·2로 들어가므로, 숫자마다 적용 규칙을 표시한다.","LCA는 ISO 14040·14044·14067로 제품 일생을 재며, 비교의 기준인 기능단위(예: 승용차 1대로 20만 km 주행)를 먼저 정한다."]}]};
