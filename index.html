히 읽는다."],"req":"검증은 개요 파악·계획 수립(1단계), 문서검토·현장검증(2단계), 결과 정리·내부심의·보고서 제출(3단계)로 진행한다.","fig":{"cap":"별표 1 온실가스 배출량 등의 검증절차 (15쪽)","head":["단계","절차","수행주체"],"rows":[["1단계","검증개요 파악 → 검증계획 수립(리스크 분석, 데이터 샘플링 계획)","검증팀 + 피검증자"],["2단계","문서검토 → 현장검증","검증팀 + 피검증자"],["3단계","검증결과 정리 및 평가 → 내부심의 → 검증보고서 제출","검증팀 / 내부심의팀 / 검증팀"]]}}],"write":{"q":"제2조의 정의를 바탕으로, 명세서 검증은 어떤 수준의 보증으로 무엇을 확인하는 활동인가?","must":[["합리적 보증","합리적보증","합리적"],["절차","기준","검증기준"],["문서화","기록","체계적"]],"bonus":[["리스크"],["적극적"]],"wrong":["제한적 보증 수준으로 한다"],"model":"명세서 검증은 배출량 산정이 지침의 절차와 기준에 맞는지 기록을 남기며 체계적으로 확인하는 활동이며, 합리적 보증 수준으로 수행한다.","src":"제2조 제1호·제15호, 제7조 제4호"},"check":{"q":"별표 1에서 내부심의를 수행하는 주체는?","options":["검증을 수행한 검증팀","검증에 참여하지 않은 검증기관 소속 내부심의팀","피검증자의 온실가스 담당 부서"],"ans":1,"why":"별표 1은 내부심의의 수행주체를 내부심의팀으로 적고, 제11조는 해당 검증에 참여한 자는 내부심의팀에 포함될 수 없다고 정한다."},"summary":["이 지침은 명세서를 외부가 확인하는 검증 절차와 검증기관·검증심사원의 자격·관리를 정한 고시다.","명세서 검증은 증거에 근거해 기록을 남기며 합리적 보증 수준으로 수행하고, 오류는 중요성 기준과 비교해 판단한다.","검증은 개요 파악·계획, 문서검토·현장검증, 결과 정리·내부심의·보고서 제출의 3단계로 진행하며, 검증기관 관리는 국립환경과학원이 맡는다."]},{"id":"v-2","title":"검증팀과 내부심의","range":"제9~11조, 제18~19조, 별지 제1호","pages":[3,6],"min":14,"intro":"검증의 품질은 사람에서 나온다. 이 회차에서는 검증팀을 몇 명으로 어떻게 짜는지, 누가 들어올 수 없는지, 기술전문가는 무엇을 하는지, 그리고 검증팀의 결론을 다시 보는 내부심의가 어떻게 돌아가는지를 읽는다.","blocks":[{"no":"제9조","label":"검증팀은 2인 이상, 분야 자격을 갖춘 사람이 있어야 한다","doc":"ver","pdfPage":3,"prose":["제9조 제1항은 검증팀을 2인 이상의 검증심사원으로 구성하고 그중 1인을 검증팀장으로 선임하도록 한다. 혼자 하는 검증은 없다. 제2항은 검증대상이 속하는 분야의 자격을 갖춘 검증심사원이 1인 이상 포함되어야 한다고 정한다. 분야는 제28조 제2항의 광물산업, 화학, 철강·금속, 전기·전자, 폐기물, 농축산·임업, 공통의 7개다. 시멘트 공장을 검증하려면 광물산업 분야 자격자가 팀에 있어야 한다.","검증대상 분야가 여럿이면 각 분야 자격자가 각각 있어야 하되, 한 사람이 여러 분야 자격을 갖추었으면 그 사람으로 충족된 것으로 본다. 제3항은 검증심사원보가 검증심사원을 보조하기 위해 팀에 포함될 수 있고, 이때 심사원보의 인적사항을 검증보고서에 적어야 한다고 정한다. 검증심사원보는 아직 심사원이 아닌 교육 이수자다. 7회차에서 보듯 심사원보가 이 참여 실적을 쌓아 심사원이 된다."],"req":"검증팀은 2인 이상의 검증심사원으로 꾸리고 팀장 1인을 두며, 검증대상 분야의 자격을 갖춘 심사원이 1인 이상 있어야 한다.","terms":[{"t":"검증심사원","d":"검증 업무를 수행할 능력과 실무경력을 갖추어 제28조에 따라 등록된 사람이다.","en":"verifier"},{"t":"검증심사원보","d":"자격 요건을 갖추고 양성교육을 이수해 등록된, 검증심사원을 보조하는 사람이다.","en":"assistant verifier"}]},{"no":"제9조 제4항","label":"독립성: 2년 안에 그 회사 직원이었거나 컨설팅했으면 안 된다","doc":"ver","pdfPage":3,"prose":["제9조 제4항은 검증팀에 들어올 수 없는 사람을 셋 든다. 피검증자의 임직원으로 근무한 뒤 2년이 지나지 않은 자, 피검증자에 대한 컨설팅에 참여한 뒤 2년이 지나지 않은 자, 그 밖에 검증의 독립성을 해칠 수 있는 사항에 연관된 자다. 자기가 만든 명세서를 자기가 검증하면 검증이 아니기 때문이다. 제5항은 국립환경과학원장이 이런 사람이 팀에 있으면 제외나 교체를 요구할 수 있다고 정한다.","이 조항은 컨설턴트에게 직접 영향을 준다. 어느 회사의 산정이나 명세서 작성을 도왔다면 2년 동안은 그 회사의 검증팀에 들어갈 수 없다. 거꾸로 검증심사원 경력을 쌓다가 컨설팅으로 옮기는 길도 있는데, 그때는 7회차에서 보는 제24조 제5항이 검증기관 쪽의 금지 범위를 정한다.","독립성 확인은 계약 전에 문서로 한다. 제12조·제13조 제2항은 계약 전에 별지 제1호 서식의 공평성 위반 여부 자가진단표를 작성해 계약서에 첨부하도록 한다. 76~78쪽의 이 표는 최근 2년간 검증기관과 피검증자 사이에 동업·재무 대행·내부감사 관계가 있었는지, 검증팀이나 내부심의팀 심사원 중 그 회사에서 근무한 사람이 있는지 등을 묻고, 모든 항목이 적합할 때만 적합으로 판정한다."],"req":"피검증자의 임직원 또는 컨설턴트였던 사람은 종료 후 2년이 지나야 그 회사 검증팀에 들어갈 수 있고, 계약 전에 공평성 자가진단표를 작성한다.","quote":"피검증자에 대한 컨설팅에 참여한 자로써 참여를 종료한 날로부터 2년이 경과되지 아니한 자","terms":[{"t":"공평성","d":"검증기관이 피검증자 등 이해관계자로부터 어떤 영향도 받지 않고 객관적 증거와 사실에 근거해 검증하는 것이다(제2조 제5호).","en":"impartiality"}]},{"no":"제10조","label":"기술전문가는 정보만 준다","doc":"ver","pdfPage":3,"prose":["제10조는 검증팀장이 검증의 전문성을 보완하기 위해 검증대상에 전문지식을 갖춘 사람을 기술전문가로 선임할 수 있다고 정한다. 기술전문가는 피검증자의 공정·운영체계에 대한 기술적 이해, 배출량 산정·보고·검증 방법, 데이터 중요성 판단과 리스크 분석에 관한 지식을 갖추어야 한다. 예를 들어 반도체 공정의 불소화합물 배출처럼 심사원이 공정을 다 알기 어려운 경우에 쓴다.","다만 제4항은 기술전문가의 업무를 검증팀장이 요청하는 전문분야 정보를 제공하는 것에 한정한다. 검증의견을 정하거나 검증절차를 수행하는 사람이 아니다. 책임은 검증심사원에게 남는다. 제3항은 기술전문가 선임에도 제9조 제4항의 독립성 규정을 그대로 적용한다. 그 회사에서 2년 안에 근무했거나 컨설팅한 사람은 기술전문가로도 들어올 수 없다."],"req":"기술전문가는 검증팀장의 요청에 따라 전문분야 정보만 제공하며, 독립성 규정은 검증심사원과 같이 적용된다."},{"no":"제11조","label":"내부심의팀: 검증에 참여하지 않은 사람이 다시 본다","doc":"ver","pdfPage":4,"prose":["제11조는 검증기관이 검증팀의 검증에 대한 내부심의를 위해 1인 이상의 소속 검증심사원으로 내부심의팀을 구성하도록 한다. 조건이 하나 있다. 심의 대상 검증에 참여한 사람은 내부심의팀에 들어갈 수 없다. 같은 기관 안에서 '한 번 더 보는 눈'을 두는 것이다. 제2조 제7호는 내부심의를 검증보고서를 최종 확정하기 전에 검증과정과 결과를 재검토하는 과정이라고 정의한다.","제2항은 내부심의팀 구성에도 제9조 제4항의 독립성 규정과 제10조 제2항의 지식 요건을 준용한다. 내부심의팀도 그 회사와 2년 안에 관계가 있었으면 안 되고, 기술적 이해와 중요성 판단 능력을 갖추어야 한다. 심의하는 사람이 검증하는 사람보다 모르면 심의가 되지 않기 때문이다."],"req":"내부심의팀은 해당 검증에 참여하지 않은 소속 검증심사원 1인 이상으로 구성하고, 독립성·지식 요건을 똑같이 적용한다.","terms":[{"t":"내부심의","d":"검증기관이 검증보고서를 확정하기 전에 검증과정과 결과를 다시 검토하는 과정이다.","en":"internal review"}]},{"no":"제18조","label":"내부심의는 어떻게 진행되고 언제 보고서를 내나","doc":"ver","pdfPage":6,"prose":["제18조는 내부심의의 순서를 정한다. 검증팀장은 검증보고서 작성이 끝나면 내부심의팀에 검증절차 준수 여부와 최종 검증의견에 대한 심의를 요청한다. 이때 검증 수행계획서·체크리스트·검증보고서, 발견된 오류와 시정조치 이행결과, 배출량 산정계획서, 명세서 등을 함께 제출한다. 내부심의팀은 문제점을 발견하면 즉시 검증팀장에게 알리고, 검증팀장은 이를 반영해 보고서를 고친다.","내부심의팀은 수정된 보고서에 심의 결과가 적절히 반영되었다고 판단되면 심의를 끝내고 검증팀장에게 통보한다. 제19조는 내부심의가 끝난 검증의 보증수준이 합리적 보증 수준 이상이라고 판단될 때 최종 검증보고서를 피검증자에게 제출하도록 한다. 즉 보고서는 검증팀이 쓰고, 내부심의팀이 확인하고, 기관이 합리적 보증을 확인한 뒤에야 회사에 전달된다.","회사 입장에서 이 절차는 일정에 영향을 준다. 현장검증이 끝났다고 바로 보고서가 나오지 않는다. 내부심의에서 지적이 나오면 검증팀이 회사에 추가 자료를 요청할 수도 있다. 명세서 제출기한(이행연도 종료 후 3개월)을 지키려면 내부심의 기간까지 넣어 검증 일정을 잡아야 한다."],"req":"검증팀장이 보고서와 근거자료를 내부심의팀에 제출하고, 지적사항을 반영해 심의가 종료된 뒤 합리적 보증 수준 이상일 때 보고서를 피검증자에게 제출한다."}],"write":{"q":"제9조에 따르면 검증팀은 어떻게 구성해야 하고, 누가 들어올 수 없는가?","must":[["2인","2명","두 명","둘 이상"],["팀장","검증팀장"],["2년","2년이","두 해"]],"bonus":[["분야","전문분야"],["컨설팅","임직원"]],"wrong":["검증심사원 1인으로 구성할 수 있다"],"model":"검증팀은 2인 이상의 검증심사원으로 구성하고 팀장 1인을 두며 검증대상 분야 자격자가 포함되어야 하고, 피검증자의 임직원이나 컨설팅 참여자는 종료 후 2년이 지나지 않으면 들어올 수 없다.","src":"제9조 제1항·제2항·제4항"},"check":{"q":"기술전문가의 역할로 옳은 것은?","options":["검증팀장 대신 최종 검증의견을 결정한다","검증팀장이 요청하는 전문분야 정보를 제공하는 데 한정된다","내부심의팀장을 겸한다"],"ans":1,"why":"제10조 제4항은 기술전문가의 업무를 검증팀장이 요청하는 해당 전문분야 정보 제공에 한정한다."},"summary":["검증팀은 2인 이상의 검증심사원과 팀장 1인으로 구성하고, 검증대상 분야의 자격자가 포함되어야 한다.","피검증자의 임직원이나 컨설턴트였던 사람은 2년이 지나야 검증팀·기술전문가·내부심의팀에 들어올 수 있으며, 계약 전 공평성 자가진단표로 확인한다.","검증에 참여하지 않은 소속 심사원이 내부심의를 하고, 합리적 보증 수준이 확인된 뒤에야 검증보고서가 피검증자에게 간다."]},{"id":"v-3","title":"산정계획서 검증","range":"제12조, 별표 2","pages":[4,28],"min":16,"intro":"명세서를 검증하기 전에 먼저 검증받는 문서가 있다. 배출량을 어떻게 재고 계산할지를 적은 배출량 산정계획서(모니터링 계획)다. 이 회차에서는 산정계획서 검증이 왜 따로 있는지와 별표 2의 세부 방법을 읽는다.","blocks":[{"no":"제12조","label":"산정계획서 검증은 계획을 검증한다","doc":"ver","pdfPage":4,"prose":["배출량 산정계획서는 할당대상업체가 '우리 사업장의 배출시설은 이것이고, 활동자료는 이렇게 모으고, 이 등급(Tier)과 계수로 계산하겠다'고 미리 적어 주무관청에 내는 문서다. 제12조는 이 산정계획서의 검증 절차를 정한다. 할당대상업체는 검증기관이 산정계획서 검증업무를 할 수 있는지 확인해 계약하고, 검증기관은 계약 전에 별지 제1호 공평성 자가진단표를 작성해 첨부한다.","제3항은 산정계획서 검증이 별표 1의 절차를 따르고 세부 방법은 별표 2에 따른다고 정한다. 제4항은 합리적 보증을 위해 필요하면 별표 1 외의 추가 절차를 할 수 있게 한다. 제5항은 소규모 배출시설의 산정계획서 검증은 시설항목관리 등으로 단순화할 수 있다고 한다. 작은 보일러 수십 대의 계획을 하나하나 다 보지 않고 목록으로 관리해도 된다는 뜻이다.","명세서 검증과의 차이를 먼저 잡아 둘 필요가 있다. 명세서 검증은 '지난 1년 숫자가 맞나'를 보고, 산정계획서 검증은 '앞으로 이렇게 재면 맞는 숫자가 나오나'를 본다. 그래서 별표 2에는 데이터 샘플링 계획이 없고, 대신 모니터링 방법과 측정기기 관리 계획의 타당성을 본다. 산정계획서가 한 번 승인되면 그 뒤 몇 년의 명세서가 모두 그 계획을 기준으로 검증되므로, 계획 단계의 검증이 뒤의 검증 부담을 정한다."],"req":"산정계획서 검증은 계약 전 공평성 자가진단 후 별표 1 절차와 별표 2 방법으로 하되, 소규모 배출시설은 단순화할 수 있다.","terms":[{"t":"배출량 산정계획서","d":"배출시설, 활동자료 수집 방법, 산정등급과 계수를 미리 정해 주무관청에 내는 계획 문서로, 모니터링 계획이라고도 부른다.","en":"monitoring plan"}]},{"no":"별표 2-1","label":"검증 개요 파악: 회사를 먼저 안다","doc":"ver","pdfPage":16,"prose":["별표 2 제1호는 검증팀이 피검증자의 사업장 운영현황, 공정 전반, 배출원의 모니터링 현황을 파악하고, 검증 목적·기준·범위를 알리고 일정을 협의하며, 필요한 문서를 모으는 단계다. 모으는 자료는 조직의 소유·지배구조, 생산 제품과 고객, 사용 원자재와 에너지, 공정·설비 현황, 주요 배출원의 산정계획과 측정장치 위치, Tier 3 산정방법론이나 사업장 고유 배출계수 현황 등이다.","검증범위 확인에서는 부지경계가 식별되었는지, 배출활동이 직접·간접으로 분류되었는지, 산정계획 변경이 있었다면 파악되었는지를 본다. 앞 책의 조직경계(m-3)와 산정 대상 배출활동(m-2)이 여기서 검증 항목이 된다. 또 회사의 온실가스 산정기준 개요와 데이터 관리시스템, 그것이 ERP 같은 기존 시스템과 어떻게 연결되는지, 누가 운영하는지도 파악한다.","컨설턴트가 이 단계에서 준비할 것은 '한 장짜리 설명'이다. 조직도, 공정 흐름도, 배출시설 목록과 측정기기 위치를 표시한 배치도, 데이터가 계량기에서 명세서까지 흘러가는 그림이 있으면 개요 파악이 빨리 끝난다. 이 자료는 뒤의 리스크 분석에서 검증팀이 어디를 집중해 볼지 정하는 바탕이 된다."],"req":"검증팀은 회사의 조직·공정·배출원·측정장치·데이터 관리시스템을 파악하고 검증범위를 확인한 뒤 계획을 세운다."},{"no":"별표 2-2","label":"리스크 분석과 검증계획: 1주일 전에 알린다","doc":"ver","pdfPage":18,"prose":["별표 2 제2호는 개요 파악을 바탕으로 데이터 관리상의 취약점과 오류 발생 가능성을 평가해 대응 절차를 정하는 단계다. 리스크는 세 가지로 나눈다. 고유리스크는 업종 자체가 가진 리스크(업종 특성, 산정방법의 특수성), 통제리스크는 회사 내부 관리구조가 오류를 잡지 못할 리스크다. 이 둘은 피검증자에게서 나온다. 검출리스크는 검증팀이 검증으로 오류를 잡지 못할 리스크다.","리스크 평가에서는 예상 배출량의 적절성과 배출시설별 비율, 경영시스템과 운영의 복잡성, 데이터 관리환경의 적절성, 이전 검증에서 나온 증거를 고려한다. 검증팀장은 평가 결과를 체크리스트에 기록하고 현장검증에서 중점 확인한다. 검증계획에는 검증대상·관점, 수행방법, 정보의 중요성, 인터뷰 대상 부서, 일정이 들어가며, 검증팀장은 수립된 계획을 최소 1주일 전에 피검증자에게 통보해야 한다.","20쪽의 '검증대상과 검증관점' 표가 산정계획서 검증의 질문 목록이다. 배출시설별 모니터링 방법은 완전성(모든 시설이 들어갔나)과 적절성, 활동자료 모니터링 방법은 측정기기 관리 계획의 적절성, 산정등급 적용 계획은 정확성(지침의 등급을 적용하는지, 못 하면 사유가 타당한지), 사업장 고유 배출계수 등 Tier 3 개발 계획은 산정식·분석의 적절성을 본다. 검증 기법은 열람, 실사, 관찰, 인터뷰 네 가지다."],"req":"리스크를 고유·통제·검출로 나눠 평가하고, 검증대상·관점과 일정을 담은 검증계획을 세워 최소 1주일 전에 피검증자에게 통보한다.","fig":{"cap":"별표 2 산정계획서 검증의 검증대상과 검증관점 (20쪽)","head":["검증대상","검증관점","확인 내용"],"rows":[["배출시설별 모니터링 방법","완전성·적절성","모든 배출시설 포함 여부, 산정방법론의 적절성·타당성"],["활동자료의 모니터링 방법","적절성","설치된 측정기기 관리 계획의 적절성"],["산정등급 적용 계획","정확성","지침에 따른 산정등급 적용 여부, 미충족 사유의 타당성"],["사업장 고유 배출계수 등 Tier 3 개발 계획","적절성","산정식·개발계획의 타당성, 분석의 적절성"]]},"terms":[{"t":"고유리스크","d":"업종의 특성이나 산정방법의 특수성처럼 검증대상 자체가 가진 오류 위험이다.","en":"inherent risk"},{"t":"통제리스크","d":"회사 내부의 관리구조가 오류를 잡아내지 못할 위험이다.","en":"control risk"},{"t":"검출리스크","d":"검증팀이 검증을 통해 오류를 잡아내지 못할 위험이다.","en":"detection risk"}]},{"no":"별표 2-3","label":"문서검토: 주요배출시설 95%와 데이터 관리 약점","doc":"ver","pdfPage":21,"prose":["별표 2 제3호 문서검토는 산정기준과 산정계획을 정밀하게 분석하는 단계다. 산정기준 평가에서는 배출활동별 운영경계 분류, 산정방법, 매개변수 사용, 데이터 관리시스템, 모니터링 실시 여부, 데이터 품질관리 방안을 확인한다. 산정계획 평가에서는 배출시설과 흡수원 파악, 활동자료 모니터링 방법과 배출계수 선택의 타당성, 계산법의 정확성, 실측법이면 측정기 형식승인서와 정도검사 계획을 본다.","22쪽에 중요한 숫자가 있다. 검증팀은 주요배출시설, 즉 예상 배출량 총량 대비 누적합계가 100분의 95를 차지하는 배출시설의 산정계획을 식별해 따로 관리하고 현장검증 시간을 우선 배분한다. 배출량이 큰 시설부터 더해 95%에 이르는 시설들이 주요배출시설이다. 나머지 5%의 작은 시설은 상대적으로 가볍게 본다.","데이터 관리 및 보고시스템 평가에서는 주요 리스크가 높다고 보는 네 상황을 든다. 데이터 산출·관리시스템이 문서화되지 않은 경우, 데이터 관리 책임·권한이 명확하지 않은 경우, 별도 정보시스템으로 산정 데이터를 따로 만든 경우(예: 배출량 시스템이 일반 자산관리시스템과 분리된 경우), 산정·분석·확인·보고를 같은 사람이 하는 경우다. 담당자 한 사람이 엑셀로 모든 일을 하는 회사가 여기에 그대로 걸린다."],"req":"문서검토에서 산정기준과 산정계획을 분석하고, 누적 95%를 차지하는 주요배출시설과 데이터 관리 약점을 식별해 현장검증 시간을 우선 배분한다.","quote":"검증팀은 주요배출시설(온실가스 예상 배출량의 총량 대비 누적합계가 100분의 95를 차지하는 배출시설)의 배출량 산정계획을 식별하여 구분 관리한다.","terms":[{"t":"주요배출시설","d":"배출량이 큰 시설부터 더해 총량의 95%에 이르는 배출시설들로, 검증 시간을 우선 배분하는 대상이다.","en":"major emission facilities"}]},{"no":"별표 2-4","label":"현장검증과 결과 정리: 조치요구와 개선권고","doc":"ver","pdfPage":23,"prose":["별표 2 제4호 현장검증은 산정계획에 적은 내용과 현장이 일치하는지 확인하는 단계다. 리스크 분석에서 중대한 오류가 예상된 부분을 집중 확인하고, 발견사항은 객관적 증거를 확보한 뒤 체크리스트에 기록한다. 활동자료 모니터링 방법의 검증에서는 발열량·배출계수 등 매개변수가 지침과 일치하는지, 계획에 적은 연료와 폐기물이 실제 쓰이는지, 자체 개발 계수가 타당한지, 구매기준·실측기준·근사법 등 모니터링 유형이 현장에서 적용 가능한지를 본다.","측정기기 검교정 관리에서는 측정장비별 검교정 기준과 주기, 책임과 권한, 고장 시 데이터 관리방안, 검교정 성적서 관리, 검교정 결과가 규정된 불확도를 만족하는지를 확인한다. 시스템 관리상태 확인에서는 업무 절차의 표준화, 문서·기록 관리, 담당자 교육훈련, 내부심사 체계를 본다. 담당자가 바뀌어도 같은 숫자가 나오는 체계인지가 질문이다.","제5호 결과 정리에서 발견사항은 두 종류로 나눈다. 조치요구 사항은 산정지침과 산정계획 작성 방법 기준에 맞지 않는 발견사항으로, 즉시 통보하고 수정조치를 요구한다. 개선권고사항은 데이터 관리·보고시스템의 개선을 위한 요구로, 즉각적인 조치를 요구하지 않고 조직 차원에서 개선활동을 추진하면 된다. 검증팀장은 이를 반영한 최종 검증의견이 담긴 보고서를 쓰고, 제6·7호의 내부심의와 제출은 2회차에서 본 것과 같다."],"req":"현장에서 산정계획과 실제의 일치, 측정기기 검교정, 관리체계를 확인하고, 발견사항을 즉시 고쳐야 할 조치요구 사항과 개선권고사항으로 나눈다.","terms":[{"t":"검교정","d":"측정기기가 정확한 값을 내는지 기준기와 비교해 확인(검정)하고 맞추는(교정) 일이다.","en":"calibration"},{"t":"조치요구 사항","d":"지침 기준에 맞지 않아 즉시 수정을 요구하는 발견사항이다.","en":"corrective action request"}]}],"write":{"q":"별표 2에서 주요배출시설은 어떻게 정하고, 검증에서 어떻게 다루나?","must":[["95","100분의 95","95%"],["누적","누적합계","합계"],["현장검증","검증시간","우선"]],"bonus":[["구분 관리","식별"]],"wrong":["배출량의 50%를 차지하는 시설"],"model":"예상 배출량 총량 대비 누적합계가 95%를 차지하는 배출시설을 주요배출시설로 식별해 구분 관리하고, 현장검증 시 검증시간 배분에 우선 반영한다.","src":"별표 2 제3호 다목 2)"},"check":{"q":"별표 2의 리스크 분류에서 '검증팀의 검증 과정에서 발생하는 리스크'는?","options":["고유리스크","통제리스크","검출리스크"],"ans":2,"why":"고유리스크와 통제리스크는 피검증자에게서 발생하는 리스크이고, 검출리스크는 검증팀이 오류를 적발하지 못할 리스크다."},"summary":["산정계획서 검증은 '앞으로 이렇게 재면 맞는 숫자가 나오나'를 보는 검증으로, 별표 1 절차와 별표 2 방법을 따른다.","리스크는 고유·통제·검출로 나누어 평가하고, 검증계획은 최소 1주일 전에 피검증자에게 알린다.","누적 95%의 주요배출시설과 데이터 관리 약점에 검증시간을 우선 배분하고, 발견사항은 조치요구 사항과 개선권고사항으로 나눈다."]},{"id":"v-4","title":"배출량 검증 절차 ① 개요 파악·리스크 분석·검증계획","range":"제13조, 별표 3 제1~2호","pages":[4,35],"min":16,"intro":"이제 본 무대인 명세서 검증이다. 별표 3은 별표 2와 뼈대가 같지만 '지난 1년 숫자'를 보기 때문에 데이터 샘플링 계획이 더해지고 검증 기법도 늘어난다. 이 회차에서는 계약부터 검증계획까지, 현장에 가기 전 단계를 읽는다.","blocks":[{"no":"제13조","label":"명세서 검증의 출발: 계약, 자가진단표, 체크리스트","doc":"ver","pdfPage":4,"prose":["제13조는 명세서 검증의 큰 틀이다. 할당대상업체는 검증기관이 배출량 검증업무를 수행할 수 있는지 확인해 계약하고, 검증기관은 계약 전에 별지 제1호 공평성 자가진단표를 작성해 첨부한다. 검증은 별표 1의 절차와 별표 3의 세부 방법을 따르며, 합리적 보증을 위해 필요하면 추가 절차를 할 수 있다. 제5항은 검증기관이 별지 제2호 서식을 참고해 검증 체크리스트를 만들어 쓸 수 있다고 한다.","'검증업무를 수행할 수 있는지 확인'은 7회차에서 보는 지정 분야 문제다. 검증기관은 소속 심사원이 자격을 갖춘 분야만 검증할 수 있으므로(제20조 제2항), 회사는 계약 전에 그 기관이 자기 업종 분야로 지정되어 있는지 확인해야 한다. 79쪽부터 시작되는 별지 제2호 체크리스트는 검증 개요, 문서검토 및 리스크 분석, 현장검증 항목을 미리 정리한 양식이다. 검증팀이 무엇을 물을지 미리 보려면 이 서식을 읽으면 된다."],"req":"명세서 검증은 지정 분야를 확인해 계약하고, 계약 전 공평성 자가진단표를 붙이며, 별표 1·3과 체크리스트에 따라 수행한다."},{"no":"별표 3-1","label":"검증 개요 파악: 무엇이 바뀌었나까지","doc":"ver","pdfPage":29,"prose":["별표 3 제1호는 별표 2와 거의 같다. 사업장 운영현황과 공정, 배출원 현황을 파악하고, 검증 목적·기준·범위를 알리고 일정을 협의하고, 문서를 모은다. 모으는 자료도 소유·지배구조, 제품과 고객, 원자재와 에너지, 공정·설비, 주요 배출원과 측정장치 위치, Tier 3 방법론이나 고유 계수 현황으로 같다.","다른 점은 검증범위 확인의 세 번째 항목이다. 산정계획서 검증은 '산정계획의 변경'을 보지만, 명세서 검증은 '산정 기간 중 할당대상업체 부지 및 설비의 변경'이 파악되었는지를 본다. 지난 1년 동안 공장을 새로 지었거나 설비를 폐쇄했거나 사업장을 인수했다면 그 변경이 명세서에 반영되어야 한다는 뜻이다. 산정기준과 데이터 관리시스템, ERP 연계, 운영 조직 파악은 같다."],"req":"명세서 검증의 개요 파악은 산정계획서 검증과 같되, 산정 기간 중 부지·설비 변경이 명세서에 반영되었는지를 확인한다."},{"no":"별표 3-2 나","label":"리스크 분석: 주무관청이 검토한 산정계획이 기준","doc":"ver","pdfPage":31,"prose":["별표 3 제2호의 리스크 분류는 고유·통제·검출 셋으로 같다. 통제리스크의 정의가 '검증대상 내부의 데이터 관리구조상 오류를 적발하지 못할 리스크'로 '데이터'가 붙은 점만 다르다. 리스크 평가에서는 명세서의 중요한 오류 가능성과 함께 '주무관청이 검토한 배출량 산정계획과 관련된 부적합 리스크'를 평가한다. 산정계획서는 이미 검증과 주무관청 검토를 거쳤으므로, 명세서 검증의 기준점이 된다.","고려 사항은 배출량의 적절성과 시설별 비율, 경영시스템과 운영의 복잡성, 데이터 흐름·관리시스템·관리환경의 적절성, 주무관청이 검토한 산정계획, 이전 검증의 증거다. 검증팀장은 결과를 체크리스트에 기록하고, 현장에서 중점 확인하거나 객관적 자료로 중요한 오류가 없음을 확인해야 한다.","실무로 옮기면, 명세서가 산정계획서와 다르게 계산되어 있으면 그 자체가 리스크다. 계획에는 Tier 2 계수를 쓰겠다고 했는데 명세서는 Tier 1 기본값을 썼다면 검증팀은 그 부분을 집중해서 본다. 그래서 컨설턴트는 명세서를 쓰기 전에 산정계획서를 옆에 두고 항목마다 맞춰 본다."],"req":"리스크 평가는 명세서의 오류 가능성과 함께 주무관청이 검토한 산정계획과의 불일치 리스크를 보고, 결과를 체크리스트에 기록해 현장에서 중점 확인한다."},{"no":"별표 3-2 다","label":"데이터 샘플링 계획: 다 못 보면 어떻게 뽑나","doc":"ver","pdfPage":32,"prose":["1년치 데이터를 전부 볼 수는 없다. 별표 3 제2호 다목은 데이터 샘플링을 '검증기간의 제한 및 자료의 방대함으로 인해 전체 자료를 확인하기 어려운 경우, 모집단을 충분히 대표할 수 있도록 표본을 추출하는 것'이라고 설명하고, 리스크 기반 접근법을 방법론으로 든다. 회사의 특성·규모·복잡성을 이해하고, 주요 보고 리스크(불완전성, 부정확성, 비일관성, 데이터 관리·통제 약점)를 식별하고, 관리시스템을 이해해 남는 잔여 리스크 영역을 샘플링 계획에 넣는 흐름이다.","샘플링 계획의 고려사항에 숫자가 있다. 첫째, 보증수준은 합리적 보증이 가능하도록 세운다. 둘째, 업체 전체 배출량의 5% 미만이면서 유사한 공정과 배출시설을 가진 사업장을 다수 보유한 경우, 전체 사업장 수에 제곱근을 한 숫자를 최소 방문 사업장 샘플 수로 할 수 있다. 예를 들어 비슷한 지점 25개가 있고 그 합이 전체의 5% 미만이면 최소 5곳을 방문하면 된다. 셋째, 누적 95%의 주요배출시설과 데이터 관리 리스크가 높은 항목, 리스크 분석에서 오류 가능성이 높게 평가된 항목은 샘플 수를 늘려 우선 반영한다.","넷째, 추출한 데이터에서 오류가 없으면 확인을 마무리할 수 있지만, 오류가 발견되면 샘플 수를 확대해 추가 확인해야 한다. 다섯째, 데이터 관리시스템이 효율적일수록 리스크가 줄어 샘플 수가 줄고, 수작업 전환처럼 리스크가 높은 부분일수록 샘플 수가 늘어난다. 자동으로 집계되는 데이터는 적게 뽑고, 사람이 옮겨 적은 데이터는 많이 뽑는다는 뜻이다. 회사가 데이터 자동화에 투자하면 검증 부담이 줄어드는 이유가 여기 있다."],"req":"샘플링은 리스크 기반으로 합리적 보증이 가능하게 세우고, 소규모 유사 사업장은 사업장 수의 제곱근을 최소 방문 수로 할 수 있으며, 오류가 나오면 샘플을 늘린다.","quote":"업체 전체 배출량의 5% 미만이며, 유사한 공정 및 배출시설을 가진 사업장을 다수 보유한 경우, 전체 사업장 수에 제곱근을 하여 산출된 숫자를 최소한의 방문사이트에 대한 샘플 수로 산정하여 진행할 수 있다.","terms":[{"t":"데이터 샘플링","d":"전체 자료를 다 확인하기 어려울 때 모집단을 대표할 수 있도록 표본을 뽑아 확인하는 것이다.","en":"data sampling"},{"t":"잔여 리스크","d":"회사의 관리시스템으로도 걸러지지 않고 남는 오류 위험 영역이다.","en":"residual risk"}]},{"no":"별표 3-2 라","label":"검증계획과 일곱 가지 검증 기법","doc":"ver","pdfPage":34,"prose":["검증계획에는 검증대상·관점, 수행방법과 절차, 데이터 샘플링 계획, 정보의 중요성, 인터뷰 대상 부서·담당자, 현장검증을 포함한 일정이 들어간다. 별표 2와 비교하면 데이터 샘플링 계획이 추가되었다. 검증팀장은 이 계획을 최소 1주일 전에 피검증자에게 통보하고, 현장검증 일정은 주관부서장과 협의하되 문서검토 결과에 따라 조정할 수 있다.","35쪽의 검증대상·관점 표는 명세서 검증의 질문 목록이다. 배출원은 산정계획과 지침 범위의 시설이 들어갔는지(적절성)와 모든 시설이 들어갔는지(완전성), 산정식은 시설별로 적절한 식을 썼는지, 활동데이터는 산정식과 Tier에 맞는지(적절성), 측정·집계·데이터 처리와 계산이 정확한지(정확성), 모든 활동자료가 들어갔는지(완전성), 매개변수(배출계수·발열량)도 적절성·정확성·완전성, 계산은 정확성을 본다.","검증 기법은 별표 2의 네 가지(열람, 실사, 관찰, 인터뷰)에 세 가지가 더해져 일곱 가지다. 재계산은 심사원이 직접 계산해 기록의 정확성을 확인하는 것, 분석은 활동자료 사이의 관계로 추정치를 만들어 산출량과 비교하는 것, 역추적은 대표 자료나 배출시설을 골라 원시데이터 발생부터 배출량 산정까지의 흐름을 근거자료로 거슬러 따라가는 것이다. 현장에서 '이 숫자 어디서 나왔어요?'라고 묻고 고지서까지 따라가는 것이 역추적이다."],"req":"검증계획에 샘플링 계획과 중요성을 넣어 1주일 전에 알리고, 열람·실사·관찰·인터뷰·재계산·분석·역추적 일곱 기법으로 배출원·산정식·활동데이터·매개변수·계산을 본다.","fig":{"cap":"별표 3 검증 기법 (35쪽)","head":["기법","무엇을 하나"],"rows":[["열람","문서와 기록을 확인"],["실사","측정기기 등을 통해 수집된 데이터·정보를 확인"],["관찰","업무 처리과정과 절차를 확인"],["인터뷰","책임자·담당자(외부 관계자 포함)에게 질의하고 설명을 요구"],["재계산","기록과 문서의 정확성을 판단하기 위해 심사원이 직접 계산"],["분석","활동자료 간 관계로 추정치를 만들어 산출량과 비교·검토"],["역추적","대표 자료나 시설을 골라 원시데이터 발생부터 배출량 산정까지 흐름을 추적"]]},"terms":[{"t":"역추적","d":"최종 배출량에서 거꾸로 원시데이터까지 근거자료를 따라가 확인하는 검증 기법이다.","en":"trace-back"}]}],"write":{"q":"별표 3의 데이터 샘플링 계획에서, 추출한 데이터에 오류가 발견되면 검증팀은 어떻게 해야 하나?","must":[["샘플","표본"],["확대","늘려","늘린다","증가"],["추가","추가적인 확인","추가 확인"]],"bonus":[["정확도","계산의 정확도"]],"wrong":["오류를 기록하고 확인을 마무리한다"],"model":"오류가 발견되면 계산의 정확도를 확인하기 위해 샘플 수를 확대하여 추가적인 확인을 실시해야 한다.","src":"별표 3 제2호 다목 2)"},"check":{"q":"유사한 공정의 소규모 사업장 36개(합계 배출량이 전체의 5% 미만)가 있을 때 별표 3이 허용하는 최소 방문 사업장 수는?","options":["36개 모두","6개","1개"],"ans":1,"why":"전체 사업장 수에 제곱근을 한 숫자를 최소 방문 샘플 수로 할 수 있으므로 √36 = 6개다."},"summary":["명세서 검증은 지정 분야 확인과 공평성 자가진단으로 시작하고, 개요 파악에서 산정 기간 중 부지·설비 변경까지 확인한다.","리스크는 고유·통제·검출로 나누되 주무관청이 검토한 산정계획과의 불일치가 핵심 기준이다.","샘플링은 리스크 기반으로 세우고(소규모 유사 사업장은 제곱근, 오류 발견 시 확대), 검증 기법은 재계산·분석·역추적을 더해 일곱 가지다."]},{"id":"v-5","title":"배출량 검증 절차 ② 문서검토·현장검증·중요성","range":"별표 3 제3~5호","pages":[36,44],"min":18,"intro":"검증의 한가운데다. 책상에서 명세서를 뜯어보는 문서검토, 사업장에서 데이터를 거슬러 확인하는 현장검증, 그리고 발견한 오류를 모아 '적정'인지 가르는 중요성 기준을 읽는다. 중요성 기준의 숫자는 그대로 외운다.","blocks":[{"no":"별표 3-3","label":"문서검토: 명세서를 산정계획과 전년 명세서에 맞춰 본다","doc":"ver","pdfPage":36,"prose":["별표 3 제3호 문서검토는 명세서와 산정계획을 정밀하게 분석하는 단계다. 산정기준 평가 항목은 운영경계 분류, 산정방법, 매개변수, 데이터 관리시스템, 모니터링 실시 여부, 데이터 품질관리로 별표 2와 같다. 명세서 평가에서는 배출시설과 흡수원, 주무관청이 검토한 산정계획과의 부합성, 활동자료 선택·수집의 타당성, 배출계수 선택의 타당성, 계산법의 정확성, 실측법이면 측정기 형식승인서와 정도검사 합격 여부를 본다.","명세서 검증에만 있는 항목이 '전년 대비 운영상황 및 배출시설의 변경사항 확인'이다. 검증팀은 전년도 명세서와 비교해 운영상황과 배출시설·배출량 데이터의 변경을 파악하고, 장비·시설의 신축·폐쇄, 모니터링·보고과정 변경, 배출시설과 배출량 변경, 데이터 관리시스템·품질관리 절차 변경, 그리고 이전 연도 검증보고서에 언급된 개선 요구사항을 확인한다. 작년에 받은 개선권고를 올해 어떻게 했는지 묻는다는 뜻이다. 문서검토에서 발견된 문제는 피검증자에게 통보해 자료와 설명을 요구하고, 확인되지 않은 것은 현장검증 계획에 넣는다."],"req":"문서검토에서 명세서를 산정계획과 맞춰 보고, 누적 95% 주요배출시설을 식별하며, 전년 명세서와 비교해 변경사항과 전년 검증보고서의 개선 요구사항 이행을 확인한다."},{"no":"별표 3-4 다","label":"현장검증의 데이터 검증: 회계자료에서 전력량까지","doc":"ver","pdfPage":39,"prose":["별표 3 제4호 현장검증은 명세서에 적은 내용과 근거 데이터의 정확성을 확인하기 위해 검증계획에 따라 사업장에서 하는 절차다. 먼저 산정계획과 현장이 일치하게 모니터링하고 불확도를 관리하는지 확인한다. 그다음이 데이터 검증이다. 활동자료 추적검증에서는 해당연도 회계자료 등을 검토해 전력·스팀·유류·가스의 구매량, 재고 관리기록, 유류·가스 배달기록부, 전력량을 확인하고, 필요하면 생산 데이터나 물질수지를 맞추기 위한 원료 소비 데이터도 본다.","연료 사용량은 구매 전표와 재고 변동으로 맞아야 하고(기초 재고 + 구매량 − 기말 재고 = 사용량), 전력은 고지서와 계량기 값이 맞아야 한다. 샘플링 계획에 따라 뽑은 데이터의 정확성을 확인하고, 발열량·배출계수 등 매개변수가 산정계획과 명세서에서 일치하는지, 명세서의 연료·폐기물이 실제 쓰이는지, 자체 개발 계수가 타당한지, 성분 분석기록 등 근원데이터가 적절한지도 본다.","40쪽의 표는 모니터링 유형별로 무엇을 보는지 정리한다. 구매기준이면 신뢰할 수 있는 원장 데이터 근거, 데이터 처리 정확성, 측정방법·출처 변경, 수집기간과 산정기간의 일치, 재고량 변화를 본다. 실측기준이면 계측기의 검교정 상태, 산정계획과 같은 측정방법 사용 여부, 기록의 정확성과 단위 조작·유효숫자 처리를 본다. 근사법이면 산정계획과 같은 계산방법 사용과 기초 데이터의 적절성·합리성을 본다."],"req":"현장에서 회계자료·구매량·재고·배달기록·전력량으로 활동자료를 추적검증하고, 모니터링 유형(구매기준·실측기준·근사법)별 검토사항을 확인한다.","fig":{"cap":"별표 3 모니터링 유형에 따른 검토사항 (40쪽)","head":["모니터링 유형","주요 검토사항"],"rows":[["구매기준","신뢰할 수 있는 원장 데이터 근거, 데이터 처리 정확성, 측정방법·출처 변경, 수집기간과 산정기간 일치, 재고량 변화"],["실측기준","계측기 검교정 상태, 산정계획과 동일한 측정방법 사용, 기록 정확성·단위 조작·유효숫자 처리"],["근사법","산정계획과 동일한 계산방법 사용, 기초 데이터의 적절성·합리성"]]},"terms":[{"t":"물질수지","d":"들어간 원료와 나온 제품·부산물의 양이 맞아야 한다는 원리로, 활동자료의 합리성을 확인하는 데 쓴다.","en":"mass balance"}]},{"no":"별표 3-4 라","label":"측정기기, 관리체계, 이전 검증결과","doc":"ver","pdfPage":40,"prose":["현장검증의 나머지 세 항목이다. 측정기기 검교정 관리에서는 측정장비별 검교정 관리기준과 주기, 검교정 책임과 권한, 고장 시 데이터 관리방안, 검교정 성적서 관리, 검교정 결과가 규정된 불확도를 만족하는지를 확인한다. 성적서가 없거나 주기를 넘긴 계량기는 그 자체로 발견사항이 된다.","시스템 관리상태 확인에서는 온실가스 관리업무가 지속적으로 운영되는지를 본다. 업무 절차의 표준화와 책임권한, 문서·기록 관리 체계, 담당자 교육훈련, 지속적 개선을 위한 내부심사 체계가 항목이다. 이전 검증결과 및 변경사항 확인에서는 이전 연도 명세서와 검증보고서를 참고해 중요한 배출시설 변화 요인, 배출량 변화 상태를 확인하고, 그에 따른 배출량 변화가 타당하게 반영되었는지 본다. 작년보다 배출량이 20% 줄었는데 생산량은 그대로라면 설명이 필요하다."],"req":"현장에서 측정기기 검교정 성적서와 불확도 충족, 관리체계의 지속 운영, 전년 대비 배출량 변화의 타당성을 확인한다."},{"no":"별표 3-5 나","label":"오류의 평가와 잠재오류","doc":"ver","pdfPage":41,"prose":["별표 3 제5호는 결과 정리다. 먼저 수집된 증거가 검증의견을 내기에 충분하고 적절한지 평가하고, 미흡하면 추가 증거수집을 한다. 그다음 오류의 평가다. 증거에 오류가 있으면 그 영향을 평가하는데, 42쪽 표는 오류 발생분야를 입력(기록 카운트 시험, 유효 특성 시험, 소실데이터 시험), 변환(바탕시험, 일관성 시험), 결과(결과분산 관리, 입출력 시험)로 나누어 점검 방법을 든다. 숫자가 들어올 때, 계산될 때, 나올 때 각각 틀릴 수 있다는 뜻이다.","측정기기 불확도와 관련해 불확도 관리가 되지 않은 계량기를 쓴 경우, 산정계획과 실제 모니터링 방법이 다른 경우(측정기기 누락, 계획과 다른 측정기기 사용, 검교정 미실시)가 발견되면 배출량에 끼치는 영향을 종합 평가해 검증보고서에 반영한다. 그리고 중요한 문장이 있다. 샘플링된 데이터에서 오류를 발견하면 실제 데이터에도 같은 오류(잠재적 오류)가 있을 수 있으므로, 잠재오류가 허용 가능한 수준으로 낮아질 때까지 점검을 통해 수정을 요구한다.","잠재오류 개념이 실무에서 중요한 이유가 있다. 12개월 중 3개월을 뽑아 봤는데 1건이 틀렸다면, 검증팀은 '나머지 9개월에도 비슷한 오류가 있을 것'이라고 본다. 그래서 오류 하나가 전체 데이터 재확인으로 이어진다. 제16조의 '적정' 의견도 '불확도와 오류(잠재 오류, 미수정된 오류 및 기타 오류를 포함한다)'를 합쳐 중요성 기준과 비교한다."],"req":"발견된 오류는 입력·변환·결과 단계별로 영향을 평가하고, 샘플에서 나온 오류는 전체에 있을 잠재오류로 보아 허용 수준까지 수정을 요구한다.","terms":[{"t":"잠재오류","d":"샘플에서 발견된 오류가 확인하지 않은 나머지 데이터에도 있을 것으로 추정한 오류다.","en":"potential (projected) error"}]},{"no":"별표 3-5 다","label":"중요성 기준: 2.0%, 2.5%, 5.0%","doc":"ver","pdfPage":43,"prose":["이 책에서 가장 중요한 숫자다. 별표 3 제5호 다목은 중요성의 양적 기준치를 할당대상업체의 배출량 수준에 따라 차등화한다. 총 배출량이 500만 tCO2eq 이상인 할당대상업체는 총 배출량의 2.0%, 50만 tCO2eq 이상 500만 tCO2eq 미만이면 2.5%, 50만 tCO2eq 미만이면 5.0%다. 배출량이 클수록 허용 비율은 작아지지만, 톤수로는 더 크다. 100만 톤 회사의 2.5%는 2만 5천 톤이고, 10만 톤 회사의 5.0%는 5천 톤이다.","이 기준은 제16조의 검증의견을 가르는 선이다. 불확도와 오류(잠재오류 포함) 평가 결과가 이 기준 미만이면 '적정' 또는 '조건부 적정', 이상이면 '부적정'이다. 그러니 검증은 '오류 0'을 요구하는 것이 아니라 '중요성 기준 미만'을 요구한다. 작은 오류는 수정을 요구하되 의견을 바꾸지는 않는다. 같은 숫자가 별표 7의 검증소요일수에서 공정배출시설을 셀 때의 기준(2.0%·2.5%·5.0%)으로도 쓰인다.","실제 보고서에서 이 숫자를 확인할 수 있다. 현대자동차 2025년도 국내 사업장 명세서를 검증한 DNV 의견서는 이 검증지침(제2025-165호)에 따라 합리적 보증 수준에서 중요성 평가 기준 2.5%를 적용했다고 적었고, 총 배출량은 1,564,345 tCO2-eq였다. 50만 이상 500만 미만 구간이니 2.5%가 맞다. 같은 회사의 해외 사업장을 본 LRQA 의견서의 5%는 이 지침이 아니라 ISO 14064-3을 적용한 자발적 검증의 기준이다."],"req":"중요성 기준은 총 배출량 500만 tCO2eq 이상 2.0%, 50만 이상 500만 미만 2.5%, 50만 미만 5.0%이며, 오류 합계가 이 기준 미만이면 적정 의견이 가능하다.","quote":"총 배출량이 500만 tCO2eq 이상인 할당대상업체는 총 배출량의 2.0%, 50만 tCO2eq 이상 500만 tCO2eq 미만인 할당대상업체에서는 총 배출량의 2.5%, 50만 tCO2eq 미만인 할당대상업체는 총 배출량의 5.0%로 한다.","fig":{"cap":"별표 3 제5호 다목 중요성의 양적 기준 (43쪽)","head":["할당대상업체 총 배출량","중요성 기준"],"rows":[["500만 tCO2eq 이상","총 배출량의 2.0%"],["50만 tCO2eq 이상 ~ 500만 tCO2eq 미만","총 배출량의 2.5%"],["50만 tCO2eq 미만","총 배출량의 5.0%"]]},"ex":{"k":"현대차 보고서에서는","t":"157쪽 DNV 온실가스 검증의견서는 '온실가스 배출권거래제 운영을 위한 검증지침(환경부고시 제2025-165호)의 검증 원칙과 기준에 따라 합리적 보증수준 하에서 수행'하고 '중요성 평가 기준 2.5%를 적용'했다고 적었다. 국내 사업장 총 배출량은 1,564,345 tCO2-eq(지역기반)로 50만~500만 구간이다.","co":"hyundai","page":157}},{"no":"별표 3-5 라","label":"조치요구 사항과 개선권고사항, 그리고 보고서","doc":"ver","pdfPage":43,"prose":["발견사항은 둘로 나눈다. 조치요구 사항은 온실가스 배출량과 에너지 소비량, 그 산정에 영향을 미치는 오류로서 총배출량 산정에 직접적인 영향을 끼칠 수 있는 발견사항이다. 즉시 통보하고 수정조치를 요구한다. 개선권고사항은 데이터 관리 및 보고시스템의 개선과 효율적 운영을 위한 요구사항으로, 즉각적인 조치를 요구하지 않고 조직 차원에서 개선활동을 추진할 수 있다.","별표 2와 비교하면 조치요구 사항의 정의가 바뀌었다. 산정계획서 검증에서는 '기준에 맞지 않는 발견사항'이었지만, 명세서 검증에서는 '총배출량 산정에 직접 영향을 끼칠 수 있는 오류'다. 숫자를 바꾸는 것이 조치요구, 체계를 좋게 하는 것이 개선권고라고 기억하면 된다. 검증팀장은 검증개요와 내용, 발견사항과 조치내용을 고려한 최종 검증의견이 담긴 검증보고서를 쓰고, 내부심의와 제출은 앞서 본 것과 같다."],"req":"총배출량에 직접 영향을 주는 오류는 조치요구 사항으로 즉시 수정을 요구하고, 데이터 관리체계 개선은 개선권고사항으로 분류해 다음 연도 검증에서 이행을 확인한다."}],"write":{"q":"총 배출량이 120만 tCO2eq인 할당대상업체의 명세서 검증에서 중요성 기준은 몇 %이고, 톤으로는 얼마인가?","must":[["2.5","2.5%","2.5퍼센트"],["3만","30,000","30000","3만 톤"],["50만","500만","구간","이상"]],"bonus":[["미만"]],"wrong":["5.0%","2.0%"],"model":"총 배출량 50만 이상 500만 tCO2eq 미만 구간이므로 중요성 기준은 2.5%이고, 120만 톤의 2.5%인 3만 tCO2eq가 기준이 된다.","src":"별표 3 제5호 다목"},"check":{"q":"샘플링한 데이터에서 오류가 발견되었을 때 별표 3이 요구하는 조치는?","options":["발견된 오류만 수정하면 의견에 반영하지 않는다","실제 데이터에도 같은 잠재오류가 있을 수 있으므로 허용 수준으로 낮아질 때까지 점검·수정을 요구한다","곧바로 부적정 의견을 낸다"],"ans":1,"why":"별표 3 제5호 나목 3)은 잠재오류가 허용 가능한 수준으로 낮아질 때까지 점검을 통해 수정을 요구한다고 정한다."},"summary":["문서검토는 명세서를 산정계획과 전년 명세서에 맞춰 보고, 전년 검증보고서의 개선 요구사항 이행까지 확인한다.","현장검증은 회계자료·구매량·재고·전력량으로 활동자료를 추적하고, 모니터링 유형별 검토와 측정기기 검교정, 전년 대비 변화의 타당성을 본다.","중요성 기준은 총 배출량 500만 이상 2.0%, 50만~500만 2.5%, 50만 미만 5.0%이며, 잠재오류까지 합쳐 이 기준 미만이면 적정 의견이 가능하다."]},{"id":"v-6","title":"시정조치와 검증의견, 검증보고서","range":"제15~17조, 제19조, 별지 제3호·제4호","pages":[5,110],"min":15,"intro":"검증의 결과물은 네 가지 중 하나의 검증의견과 그것을 담은 검증보고서다. 이 회차에서는 발견사항을 고치는 시정조치, 네 가지 의견의 기준, 보고서에 들어가는 내용과 별지 제4호 서식의 실제 구조를 읽는다.","blocks":[{"no":"제15조","label":"시정조치: 고치고, 증빙을 내고, 기록을 남긴다","doc":"ver","pdfPage":5,"prose":["제15조 제1항은 검증기관이 검증 중 발견한 검증기준 미준수 사항과 배출량 산정에 영향을 미치는 오류(조치 요구사항)에 대해 피검증자에게 시정을 요구하도록 한다. 제2항에 따라 피검증자는 시정내용이 반영된 산정계획서 또는 명세서와 그에 대한 객관적인 증빙자료(시정결과)를 검증기관에 제출해야 한다. 말로 고쳤다고 하는 것이 아니라, 고친 명세서와 그 근거를 함께 내는 것이다.","외부사업 감축량 검증에는 기한이 따로 있다. 시정을 요구받은 날로부터 30일 이내에 시정결과를 제출해야 하고, 3회까지 제출할 수 있다. 명세서 검증에는 이런 횟수 제한이 없지만, 명세서 제출기한이 사실상의 기한이다. 제3항은 검증기관이 조치 요구사항과 시정결과 내역을 별지 제3호 서식으로 작성해 검증보고서와 함께 기후에너지환경부장관에게 제출하도록 한다.","86쪽 별지 제3호 '배출량(감축량) 검증결과 조치 요구사항 목록'은 번호, 날짜, 조치 요구사항, 시정내용, 시정조치의 효과성 검증, 검증심사원 칸으로 된 표다. 검증팀이 무엇을 지적했고 회사가 어떻게 고쳤고 그 결과가 효과적이었는지가 한 줄씩 남아 주무관청까지 간다. 회사가 받은 지적이 그대로 행정기관에 전달된다는 점을 기억해야 한다."],"req":"피검증자는 조치 요구사항을 반영한 명세서와 객관적 증빙을 시정결과로 제출하고, 검증기관은 그 내역을 별지 제3호로 작성해 검증보고서와 함께 주무관청에 낸다.","terms":[{"t":"시정결과","d":"조치 요구사항을 반영해 고친 산정계획서·명세서와 그에 대한 객관적인 증빙자료다.","en":"corrective action result"}]},{"no":"제16조","label":"네 가지 검증의견: 적정, 조건부 적정, 부적정, 검증 불가","doc":"ver","pdfPage":5,"prose":["제16조 제1항은 검증팀장이 모든 검증절차와 시정조치가 완료되면 최종 검증의견을 확정하도록 한다. 제2항의 명세서 검증의견은 네 가지다. '적정'은 검증기준에 따라 배출량이 산정되었고, 불확도와 오류(잠재오류, 미수정된 오류, 기타 오류 포함) 및 수집된 정보의 평가결과가 별표 3 제5호 다목의 중요성 기준 미만인 경우다. '조건부 적정'은 중요한 정보 등이 산정·보고 기준을 따르지 않았으나 불확도와 오류 평가결과가 중요성 기준 미만인 경우다.","'부적정'은 불확도와 오류 평가결과가 중요성 기준 이상인 경우다. '검증 불가'는 피검증자가 검증에 필요한 정보를 충분히 제공하지 않아 검증을 완료할 수 없는 경우다. 적정과 조건부 적정의 차이는 숫자가 아니라 절차다. 숫자 오류는 기준 미만이지만 산정·보고 기준을 지키지 않은 중요한 사항이 있으면 조건부 적정이 된다. 예를 들어 산정계획과 다른 방법으로 계산했지만 그 차이가 기준 미만인 경우다.","검증 불가는 회사가 자료를 내지 않아 생기는 의견이므로, 사실상 가장 피해야 할 결과다. 제8조가 자료 제출 요구에 따라야 한다고 못 박은 이유와 이어진다. 제3항의 외부사업 감축량 검증의견은 적정과 부적정 둘뿐이고, 부적정은 조치 요구사항을 제15조 제2항의 기간(30일, 3회) 안에 시정하지 못한 경우다. 현대자동차 2025년도 국내 명세서는 DNV로부터 '적정' 의견을 받았다."],"req":"명세서 검증의견은 적정·조건부 적정·부적정·검증 불가 넷이며, 오류 합계가 중요성 기준 미만인지와 산정·보고 기준 준수 여부로 가른다.","fig":{"cap":"제16조 제2항 온실가스 배출량 검증의견 (5쪽)","head":["의견","조건"],"rows":[["적정","검증기준에 따라 산정, 불확도·오류(잠재·미수정·기타 포함) 평가결과가 중요성 기준 미만"],["조건부 적정","중요한 정보 등이 산정·보고 기준을 따르지 않았으나 불확도·오류 평가결과는 중요성 기준 미만"],["부적정","불확도·오류 평가결과가 중요성 기준 이상"],["검증 불가","피검증자가 필요한 정보를 충분히 제공하지 않아 검증을 완료할 수 없음"]]},"ex":{"k":"현대차 보고서에서는","t":"157쪽 DNV 의견서는 결론에서 '회사의 온실가스 명세서와 관련하여 정보가 보고기준에 따라 적절하게 산정 및 보고되었음을 확인하였습니다'라며 '온실가스 배출량에 대한 적정 의견을 제시합니다'라고 적었다.","co":"hyundai","page":157},"terms":[{"t":"조건부 적정","d":"오류 합계는 중요성 기준 미만이지만 중요한 정보가 산정·보고 기준을 따르지 않은 경우의 검증의견이다.","en":"qualified opinion"}]},{"no":"제17조","label":"검증보고서에 꼭 들어가는 다섯 가지","doc":"ver","pdfPage":5,"prose":["제17조 제1항은 검증팀장이 최종 검증의견을 확정한 뒤 별지 제3호의2(산정계획서), 제4호(명세서), 제6호(외부사업) 서식에 따라 검증보고서를 작성하도록 한다. 제2항은 보고서에 들어가야 하는 다섯 가지를 든다. 검증 개요 및 검증의 내용, 검증과정에서 발견된 사항 및 그에 따른 조치내용, 최종 검증의견 및 결론, 내부심의 과정 및 결과, 기타 검증과 관련된 사항이다.","이 다섯 가지는 별지 제4호 서식의 장 구성과 그대로 대응한다. 사업장별 정보와 세부 검증내용(개요·내용), 발견사항(조치 요구사항·권고사항), 검증결론과 검증의견, 내부심의 과정 및 결과, 기타 사항(인터뷰 명단·검증자료)이다. 즉 제17조는 목차를 정한 조문이고, 별지 제4호는 그 목차를 채우는 양식이다. 서식을 읽으면 검증팀이 어떤 순서로 무엇을 확인하는지 전부 보인다."],"req":"검증보고서에는 검증 개요·내용, 발견사항과 조치내용, 최종 검증의견·결론, 내부심의 과정·결과, 기타 사항 다섯 가지가 들어가야 한다."},{"no":"별지 4","label":"명세서 검증보고서 서식 읽기: 검증 전과 검증 후","doc":"ver","pdfPage":99,"prose":["99쪽부터 시작하는 별지 제4호 '명세서에 대한 검증보고서'는 표지, 사업장별 정보, 세부 검증내용, 발견사항, 검증결론, 검증의견, 내부심의, 기타의 순서다. 표지에는 검증대상 업체와 검증기관, 검증심사원(보유 전문분야와 상근·비상근 표시), 검증심사원보, 기술전문가가 들어간다. 2회차에서 본 팀 구성 규칙이 여기서 확인된다. 사업장별 정보에는 각 사업장의 문서검토·현장검증 여부와 검증기간, 수행 심사원이 적힌다.","세부 검증내용은 부지 경계 및 배출원, 산정 대상 범위(제외된 시설의 합리성), Tier 1·2 매개변수, Tier 3 매개변수, 활동자료 및 배출량 산정, 기타 모니터링 계획 및 산정·보고 규정 준수 여부 항목마다 사업장별 세부내용과 심사원을 적는다. 앞 책에서 읽은 조직경계·Tier·배출계수·활동자료가 그대로 검증 항목이다. 발견사항 장에는 조치 요구사항과 시정내용 평가(배출량 변경내용 등), 권고사항이 들어간다.","검증결론 장이 이 서식의 핵심이다. '검증 전 온실가스 배출량 및 에너지 소비량'과 '검증 후 확정 온실가스 배출량 및 에너지 소비량' 표가 나란히 있다. 사업장별로 직접배출(Scope 1), 간접배출(Scope 2), 총량과 연료·전기·스팀 사용량(TJ)을 적고, 온실가스 종류별(CO2, CH4, N2O, PFCs, HFCs, SF6)로도 운영경계(고정연소, 이동연소, 공정배출, 탈루배출, 폐기물, 전기, 스팀)별 표를 검증 전·후로 만든다. 검증으로 숫자가 얼마나 바뀌었는지가 한눈에 보이게 한 구조다. 108쪽 검증의견 장에는 검증 대상·기준·절차·한계, 중요한 예외사항, 검증의견(적정, 조건부 적정, 부적정)과 종합 의견을 간단명료하게 쓰고 검증기관 대표가 서명한다."],"req":"별지 제4호 검증보고서는 검증 전과 검증 후 확정 배출량을 Scope와 가스 종류별로 나란히 보여 주고, 검증의견과 내부심의 결과를 담는다.","fig":{"cap":"별지 제4호 명세서에 대한 검증보고서의 구성 (99~110쪽)","head":["장","내용"],"rows":[["표지","검증대상 업체, 검증기관, 검증팀(심사원 전문분야·상근 여부, 심사원보, 기술전문가)"],["1 사업장별 정보","사업장별 문서검토·현장검증 여부, 검증기간, 수행 심사원"],["2 세부 검증내용","부지경계·배출원, 산정 대상 범위, Tier 1·2 및 Tier 3 매개변수, 활동자료·배출량 산정, 규정 준수"],["3 발견사항","조치 요구사항과 시정내용 평가, 권고사항"],["4 검증결론","검증 전·후 배출량(Scope 1·2, 에너지 TJ)과 가스 종류별·운영경계별 표"],["5 검증의견","대상·기준·절차·한계·예외사항·의견(적정/조건부 적정/부적정), 대표 서명"],["6·7 내부보관용","내부심의 과정·결과, 인터뷰 명단, 검증자료 목록"]]}},{"no":"제19조","label":"보고서는 합리적 보증이 확인된 뒤 나간다","doc":"ver","pdfPage":6,"prose":["제19조는 검증기관이 제18조의 내부심의가 종료된 검증의 보증수준이 합리적 보증 수준 이상이라고 판단되는 경우에 최종 검증보고서를 피검증자에게 제출하도록 한다. 별표 3 제7호도 같은 문장을 반복한다. 내부심의가 끝났다고 자동으로 나가는 것이 아니라, 기관이 한 번 더 '이 검증이 합리적 보증에 이르렀나'를 판단한다.","회사는 이 보고서를 명세서와 함께 주무관청에 낸다. 보고서 안의 '검증 후 확정 배출량'이 인증(앞 책 m-12)의 출발점이 되고, 그 숫자만큼 배출권을 제출해야 한다. 그래서 검증보고서의 검증 전·후 표는 회사의 1년 성적표이자 비용 계산서다. 컨설턴트는 보고서를 받으면 검증 전·후 차이가 어디서 났는지, 권고사항이 무엇인지, 심사원 구성이 지침에 맞는지를 확인하고 다음 연도 과제로 옮긴다."],"req":"내부심의 종료 후 합리적 보증 수준 이상임이 판단될 때 최종 검증보고서를 피검증자에게 제출하고, 그 확정 배출량이 명세서와 함께 주무관청에 간다."}],"write":{"q":"제16조에서 '적정'과 '조건부 적정'은 무엇이 같고 무엇이 다른가?","must":[["중요성 기준","중요성","기준 미만"],["미만","낮"],["산정·보고 기준","산정 기준","보고 기준","기준을 따르지"]],"bonus":[["잠재","잠재오류"]],"wrong":["조건부 적정은 오류가 중요성 기준 이상인 경우다"],"model":"둘 다 불확도와 오류 평가결과가 중요성 기준 미만이라는 점은 같지만, 조건부 적정은 중요한 정보 등이 산정·보고 기준을 따르지 않은 경우다.","src":"제16조 제2항 제1호·제2호"},"check":{"q":"피검증자가 검증에 필요한 정보를 충분히 제공하지 않아 검증을 끝낼 수 없을 때의 검증의견은?","options":["부적정","조건부 적정","검증 불가"],"ans":2,"why":"제16조 제2항 제4호는 정보 미제공으로 검증 수행을 완료할 수 없는 경우를 '검증 불가'로 정한다. 부적정은 오류가 중요성 기준 이상인 경우다."},"summary":["조치 요구사항은 고친 명세서와 객관적 증빙을 시정결과로 내고, 그 내역은 별지 제3호로 주무관청까지 전달된다.","검증의견은 적정·조건부 적정·부적정·검증 불가 넷이며, 오류 합계가 중요성 기준 미만인지와 산정·보고 기준 준수 여부로 가른다.","검증보고서는 검증 전·후 확정 배출량을 Scope와 가스별로 나란히 보여 주고, 내부심의 후 합리적 보증이 확인된 뒤에야 피검증자에게 제출된다."]},{"id":"v-7","title":"검증기관과 검증심사원","range":"제20~31조, 별표 6·7·8","pages":[6,74],"min":18,"intro":"검증을 할 수 있는 기관과 사람은 어떻게 정해지나. 이 회차에서는 검증기관의 지정 요건과 지켜야 할 것, 검증에 들여야 하는 최소 일수(MD), 검증심사원과 검증심사원보가 되는 길을 읽는다. 온실가스 분야에서 일하려는 사람에게는 진로 지도이기도 하다.","blocks":[{"no":"제21조","label":"검증기관 지정: 3년마다, 컨설팅업은 안 된다","doc":"ver","pdfPage":6,"prose":["제21조는 검증기관이 되려는 자(지정신청인)가 별표 6의 지정요건을 충족함을 증명하는 서류를 붙여 국립환경과학원장에게 신청하도록 한다. 국립환경과학원장은 서면심사와 현장조사를 거쳐 지정하고 지정서를 주며, 명칭·소재지, 지정일과 만료일, 지정 분야를 관보에 고시한다. 제6항에 따라 지정의 유효기간은 지정일로부터 3년이고, 재지정을 받으려면 만료일 3개월 전까지 신청해야 한다.","제4항은 지정하지 않을 수 있는 경우를 든다. 임원 중 피성년후견인이 있는 경우, 지정 취소 후 3년이 지나지 않은 경우, 최근 3년간 영업비밀 보호 관련 벌금형 이상을 받은 경우, 할당대상업체와 동일 법인인 경우, 법에 따른 권한을 위임·위탁받은 경우, 그리고 온실가스 또는 에너지 관련 컨설팅업, 저감시설 설치·관리 등의 업무를 수행하는 법인 및 개인이다. 컨설팅 회사는 검증기관이 될 수 없다는 뜻이다."],"req":"검증기관은 국립환경과학원장이 3년 유효기간으로 지정하고 매년 평가하며, 온실가스·에너지 컨설팅업을 하는 법인은 지정받을 수 없다."},{"no":"별표 6","label":"지정요건: 법인, 상근 심사원 5명, ISO 기준","doc":"ver","pdfPage":61,"prose":["별표 6은 검증기관 지정요건이다. 일반사항에서 검증기관은 법인이어야 하고, 정관이나 등기부의 사업내용에 검증 업무가 명시되어야 한다. 고객과 법적 구속력 있는 계약을 맺고 검증 활동과 보고서에 대한 권한과 책임을 가져야 하며, 총괄 책임을 지는 최고경영자를 두고, 공평하게 활동하며 이해상충을 막는 조치를 하고, 책임보험 가입 등 리스크에 대한 재정적 보상 대책이 있어야 한다.","인력 및 조직에서 핵심 숫자는 상근 검증심사원 5명 이상이며, 국제항공 탄소 배출량 검증기관은 3명 이상이다. 검증심사팀은 배출권거래제 세부 지식, 조직경계를 평가할 전문지식, 배출원 식별과 정량화·모니터링에 관한 기술 지식, 정보시스템 평가·샘플링·리스크 분석·오류 판별·중요성 평가 능력을 갖추어야 한다. 검증기관은 소속 심사원이 보유한 전문분야에 한해 검증할 수 있고, 검증심사를 다른 기관에 외주처리할 수 없다.","운영체계에서는 별표 1 절차의 세부 운영 매뉴얼, 피검증자 의견수렴과 이의제기 해소 절차, 정보 유출 방지 절차, 문서·기록 관리와 내부심사·시정조치·경영검토를 담은 문서화된 운영체계를 요구한다. 국제 운영기준으로는 KS I ISO 14064-1·2·3, ISO 14065, ISO 14066, ISO/IEC 17029와 CORSIA 관련 문서를 충족해야 한다. 공통 기초 책에서 본 ISO 14064-3이 국내 검증기관의 요건으로 들어와 있다."],"req":"검증기관은 법인으로서 상근 검증심사원 5명 이상과 책임보험, 문서화된 운영체계를 갖추고 ISO 14064·14065·14066·17029 기준을 충족해야 하며 검증을 외주할 수 없다.","quote":"검증기관은 상근 검증심사원을 5명 이상 갖추어야하며, 심사원을 선정, 교육훈련 및 주기적으로 업무 능력을 평가하기 위한 절차를 구비하여야 한다.","terms":[{"t":"ISO 14065","d":"온실가스 검증·타당성평가 기관이 갖추어야 할 일반 원칙과 요구사항을 정한 국제표준이다.","en":"ISO 14065"},{"t":"ISO/IEC 17029","d":"계획검증·결과검증 기관에 대한 적합성평가의 일반 원칙과 요구사항을 정한 국제표준이다.","en":"ISO/IEC 17029"}]},{"no":"제24조","label":"검증기관의 준수사항: 5년 보관, 자문 금지, 2년","doc":"ver","pdfPage":8,"prose":["제24조는 지정받은 뒤 지켜야 할 것들이다. 검증결과보고서와 업무 수행내역 등 관련 자료를 5년 이상 보관해야 하고(국제항공은 10년), 반기별 검증업무 수행내역을 별지 제9호로 작성해 매 반기 종료일로부터 30일 이내에 국립환경과학원장에게 제출해야 한다. 소속 심사원의 적격성을 주기적으로 평가·관리해야 하고, 위탁받은 검증업무를 다른 검증기관에 재위탁하거나 수탁할 수 없다.","제5항이 컨설턴트에게 중요하다. 검증기관은 같은 법인 내에서 네 가지 자문·서비스를 제공할 수 없다. 온실가스 인벤토리의 설계·개발과 감축 이행·관리, 프로젝트 설계가 첫째, 배출량·에너지 산정·보고·관리를 위한 정보시스템 설계·개발이 둘째, Tier 4 연속측정 등 측정·분석기기의 설치·관리와 특정 할당대상업체만을 위한 매뉴얼·핸드북·절차 작성이 셋째, 탄소자산관리·감축사업 경제성 평가·배출권 할당과 거래 자문 또는 중개가 넷째다. 이런 자문에 참여한 검증심사원은 자문 종료 후 2년 이내에 그 피검증자의 검증을 할 수 없다."],"req":"검증기관은 자료를 5년 이상 보관하고 반기별 내역을 보고하며, 재위탁과 인벤토리 설계·정보시스템·측정기기·탄소자산 관련 자문을 할 수 없고, 자문 참여 심사원은 2년간 그 회사를 검증할 수 없다."},{"no":"별표 7","label":"검증소요일수(MD): 기본 5일에 더해 간다","doc":"ver","pdfPage":65,"prose":["제27조는 검증기관이 별표 7의 검증소요일수를 준수하도록 한다. 별표 7 제1호에 따르면 명세서 검증의 소요일수(Man·Day, MD)는 5MD 이상이어야 하고, 이 5MD를 기본 MD라 한다. 기본 MD는 단일 사업장으로서 연간 배출량이 5만 tCO2eq 미만이며 공정배출과 Tier 3·Tier 4가 없는 단년도 검증의 경우다. 여기에 다섯 가지 요인으로 일수를 더한다.","배출량 규모는 5만 톤 미만이 기본이고, 5만 이상 50만 미만은 1MD, 50만 이상은 2MD를 더한다. 방문 사업장은 2개부터 사업장당 1.5MD를 더한다. 공정배출은 1개 늘 때마다 0.5MD를 더하는데, 단일 공정배출시설이 총 배출량의 2.0%(500만 톤 이상)·2.5%(50만~500만)·5.0%(50만 미만) 이상일 때 적용하고 그 미만이면 총 1MD만 더한다. Tier 3 산정방식이 3개 늘 때마다 0.5MD, Tier 4가 있으면 2MD, 검증대상 연차가 1년 늘 때마다 1MD를 더한다.","가상의 회사로 예를 하나 계산해 본다. 연간 배출량 120만 tCO2eq, 방문 사업장 3개, 서로 다른 공정배출 2개(각각 2.5% 이상), Tier 3 산정방식 4개, Tier 4 없음, 단년도 검증이라면 기본 5 + 배출량 2 + 사업장 (3−1)×1.5=3 + 공정배출 2×0.5=1 + Tier 3 (4개는 '4~6' 구간) 1.0 + 연차 0 = 12MD다. 라목에 따라 출장일수·거리 등을 고려해 산정일수의 2배 이내에서 더할 수 있다. 제2호의 산정계획서 검증은 기본 3MD에서 시작한다."],"req":"명세서 검증은 기본 5MD에 배출량 규모·방문 사업장 수·공정배출수·Tier 수준·검증 연차에 따라 일수를 더하고, 2배 이내에서 가산할 수 있다.","fig":{"cap":"별표 7 제1호 명세서 검증소요일수 가산 기준 (65~67쪽)","head":["요인","기본","추가 MD"],"rows":[["배출량 규모(연간)","5만 톤 미만","5만~50만 미만 +1, 50만 이상 +2"],["방문 사업장 수","1개","2개부터 사업장당 +1.5"],["공정배출수","없음","1개 증가마다 +0.5 (기준 비율 미만이면 총 +1)"],["Tier 수준","Tier 1~2","Tier 3 방식 3개마다 +0.5, Tier 4 있으면 +2"],["검증대상 연차","1년","1년 증가마다 +1"]]},"terms":[{"t":"MD(Man·Day)","d":"한 사람이 하루 일하는 양을 1로 세는 단위로, 검증에 들여야 하는 최소 인력·일수를 나타낸다.","en":"man-day"}]},{"no":"제28조","label":"검증심사원이 되는 길: 분야별 참여 횟수와 교육","doc":"ver","pdfPage":9,"prose":["제28조 제1항에 따라 검증심사원보는 별표 8의 학력·경력 기준에 맞는 사람이 기후에너지환경부장관이 정한 교육과정을 이수한 사람이다. 제31조에 따라 검증심사원보 양성교육은 이론·실습·평가를 포함해 총 40시간 이상, 보수교육은 매 2년마다 16시간 이상, 전문분야 추가 과정은 16시간 이상이며, 제32조에 따라 교육기관은 국립환경인재개발원이다.","심사원보가 심사원이 되려면 제2항의 참여 실적이 필요하다. 검증기관에서 검증실적 신고일 기준 최근 3년 이내에 해당 분야 검증에 정해진 횟수 이상 참여해야 한다. 광물산업, 화학, 철강·금속, 전기·전자 분야는 5회, 폐기물 분야와 농축산·임업 분야는 3회, 공통 분야(연소, 전기·열·스팀 사용, 수송, 탈루)는 전문분야에 관계없이 5회다. 제3항에 따라 별표 1의 2~3단계만 참여한 경우는 해당 단계의 모든 세부절차에 참여한 사람만 1회로 인정하고, 실적 분야는 가장 주된 배출활동 분야로 인정한다.","등록된 심사원은 제30조에 따라 매 2년마다 보수교육을 받아야 하고, 받지 않으면 해당 분야 자격이 정지된다. 길을 정리하면 '별표 8 자격 → 40시간 양성교육 → 심사원보 등록 → 검증기관 소속으로 3년 내 분야별 3~5회 참여 → 심사원 등록 → 2년마다 보수교육'이다."],"req":"검증심사원보는 40시간 양성교육을 이수하고, 최근 3년 내 해당 분야 검증에 5회(광물·화학·철강금속·전기전자·공통) 또는 3회(폐기물·농축산임업) 이상 참여하면 검증심사원이 되며, 2년마다 보수교육을 받는다.","fig":{"cap":"제28조 제2항 분야별 검증심사원 자격 참여 횟수 (10쪽)","head":["분야","최근 3년 내 참여 횟수"],"rows":[["광물산업(시멘트·석회·유리 등)","5회"],["화학(암모니아·질산·석유화학·불소화합물 등)","5회"],["철강·금속(철강·합금철·아연 등)","5회"],["전기·전자","5회"],["폐기물(폐기물, 하·폐수처리, 바이오매스 등)","3회"],["농축산 및 임업","3회"],["공통(연소, 전기·열·스팀 사용, 수송, 탈루)","전문분야 관계없이 5회"]]}},{"no":"별표 8","label":"검증심사원보 자격: 온실가스관리기사는 경력 2년","doc":"ver","pdfPage":71,"prose":["별표 8은 검증심사원보가 되기 위한 학력·경력 기준이다. 전문학사 이상(또는 동등 학력)이면 3년 이상, 고등학교 졸업이면 5년 이상의 실무경력이 필요하다. 다만 중앙행정기관 등에서 환경·에너지 진단 업무에 종사한 경력(제2호 아목)으로 자격을 얻으려면 7년 이상이어야 하고, 국가기술자격 기사·산업기사·기능사 소지자로 그 자격 분야에서 종사한 경력(제2호 사목)이면 3년 이상이되, 온실가스관리기사·산업기사 자격 소지자는 실무경력을 2년 이상으로 한다.","실무경력은 제2호의 인정범위 안에서만 센다. CDM 사업 타당성평가·검증, 에너지 진단, 환경산업과 환경성적표지인증, 1~3종 사업장 환경관리인, 국가기술자격 분야 종사, 중앙행정기관의 환경·에너지 업무, 환경경영체제 인증, ISO 14064에 따른 인벤토리 구축·검증, 국내 지속가능보고서 작성·검증, 공인회계사의 회계감사 등이다."],"req":"검증심사원보는 전문학사 이상 3년(고졸 5년)의 인정범위 내 실무경력이 필요하고, 온실가스관리기사·산업기사 소지자는 2년으로 줄어든다.","quote":"단, 온실가스관리기사ㆍ산업기사 자격 소지자의 경우 실무경력을 2년 이상으로 함","fig":{"cap":"별표 8 제1호 검증심사원보 학력·경력 기준 (71쪽)","head":["구분","실무경력"],"rows":[["전문학사 이상 또는 동등 학력","3년 이상"],["고등학교 졸업","5년 이상"],["중앙행정기관 등 환경·에너지 진단 업무 경력(제2호 아목)","7년 이상"],["기사·산업기사·기능사 등 자격 분야 종사(제2호 사목)","3년 이상"],["온실가스관리기사·산업기사 소지자","2년 이상"]]}}],"write":{"q":"별표 7에 따라 단일 사업장, 연간 배출량 30만 tCO2eq, 공정배출 없음, Tier 1~2만 적용, 단년도 명세서 검증의 최소 검증소요일수는 몇 MD인가? 계산 과정을 쓰라.","must":[["5MD","기본 5","5일","기본"],["1MD","1일","+1","1 추가","1을 더"],["6MD","6일","6"]],"bonus":[["5만","50만"]],"wrong":["5MD로 충분하다","7MD"],"model":"기본 5MD에 배출량이 5만 이상 50만 미만이므로 1MD를 더해 최소 6MD다.","src":"별표 7 제1호 가목·다목 ㉠"},"check":{"q":"온실가스관리기사 자격을 가진 전문학사 이상 학력자가 검증심사원보 교육을 신청하려면 인정범위 내 실무경력이 최소 몇 년 필요한가?","options":["2년","3년","5년"],"ans":0,"why":"별표 8 제1호 라목은 기사 등 자격 분야 종사자의 경력을 3년으로 하되, 온실가스관리기사·산업기사 소지자는 2년 이상으로 한다."},"summary":["검증기관은 법인으로서 상근 심사원 5명 이상, 책임보험, ISO 14064·14065·14066·17029 충족 등 별표 6 요건으로 국립환경과학원장이 3년 단위로 지정하며, 컨설팅업 법인은 지정받을 수 없다.","검증기관은 자료 5년 보관, 재위탁 금지, 인벤토리 설계·정보시스템·측정기기·탄소자산 자문 금지를 지키고, 명세서 검증은 기본 5MD에 규모·사업장·공정·Tier·연차로 일수를 더한다.","검증심사원보는 별표 8 경력(온실가스관리기사는 2년)과 40시간 교육으로 등록하고, 3년 내 분야별 3~5회 참여로 심사원이 되어 2년마다 보수교육을 받는다."]},{"id":"v-8","title":"컨설턴트의 검증 대응 체크리스트 + KSSB 인증과의 관계","range":"책 전체 정리, 기아·현대차 검증의견서, KSSB 교재 k0 연결","pages":[2,43],"min":16,"intro":"마지막 회차는 지침을 회사 쪽에서 다시 읽는다. 검증을 받는 컨설턴트가 단계마다 무엇을 준비하고, 스스로 중요성을 어떻게 계산하고, 어떤 선을 지켜야 하는지 정리한다. 그리고 이 검증이 지속가능경영보고서와 KSSB 공시의 인증과 어떻게 이어지는지를 본다.","blocks":[{"no":"별표 1","label":"1년 일정으로 다시 보는 3단계","doc":"ver","pdfPage":15,"prose":["배출권거래법 제24조에 따라 명세서는 이행연도 종료일부터 3개월 이내에 내야 한다. 1월부터 3월 말까지 산정, 검증, 내부심의, 제출이 모두 끝나야 한다는 뜻이다. 별표 1의 3단계를 이 일정에 얹으면 컨설턴트의 달력이 된다. 1단계(개요 파악·검증계획)는 전년 말이나 1월 초에 시작하는 것이 좋다. 조직도, 공정도, 배출시설 목록, 측정기기 위치, 데이터 흐름도, 전년 명세서와 검증보고서를 이때 넘긴다.","2단계 문서검토는 명세서 초안이 나오는 1~2월이다. 산정 시트, 산정계획서와의 대조표, 전년 대비 변경사항 목록, 전년 권고사항 이행 내역을 준비한다. 검증계획은 최소 1주일 전에 통보되므로(별표 3 제2호), 현장검증 날짜가 정해지면 그 1주일 안에 인터뷰 담당자와 자료를 맞춘다. 현장검증 뒤 조치 요구사항이 오면 고친 명세서와 증빙을 시정결과로 낸다. 3단계 내부심의는 검증기관 안에서 돌지만 추가 자료 요청이 올 수 있으므로 3월에 여유를 둔다."],"req":"명세서 제출기한(이행연도 종료 후 3개월) 안에 3단계가 끝나도록, 단계별 준비물과 검증소요일수를 넣어 전년부터 일정을 짠다.","fig":{"cap":"컨설턴트의 단계별 준비물 (별표 1·3 기준으로 정리)","head":["단계","준비물"],"rows":[["1단계 개요 파악·계획","조직도, 공정도, 배출시설 목록과 측정기기 위치, 데이터 흐름도, 전년 명세서·검증보고서, 산정계획서"],["2단계 문서검토","명세서 초안, 산정 시트, 산정계획서 대조표, 전년 대비 변경사항 목록, 전년 권고사항 이행 내역"],["2단계 현장검증","구매 전표·고지서·재고 기록·배달기록부, 계량기 검교정 성적서, 성분 분석 성적서, 업무 절차서·교육 기록, 인터뷰 담당자 일정"],["3단계 결과 정리","조치 요구사항별 수정 명세서와 증빙(시정결과), 권고사항 과제 목록"]]}},{"no":"별표 3-4","label":"현장검증 날의 질문에 답할 자료","doc":"ver","pdfPage":39,"prose":["현장검증에서 검증팀이 쓰는 기법은 별표 3 제2호의 열람, 실사, 관찰, 인터뷰, 재계산, 분석, 역추적 일곱 가지다. 각 기법에 대응하는 준비가 있다. 열람과 역추적에는 명세서 숫자 하나를 고르면 산정 시트, 월별 집계표, 계량기 기록, 고지서나 전표까지 끊김 없이 따라갈 수 있는 근거 묶음이 필요하다. 재계산에는 산정 시트의 수식이 열려 있어야 하고, 분석에는 생산량이나 가동시간처럼 배출량과 함께 움직이는 데이터가 있으면 좋다.","별표 3 제4호의 데이터 검증 항목을 그대로 체크리스트로 쓴다. 전력·스팀·유류·가스의 구매량과 회계자료 일치, 재고 관리기록, 배달기록부, 전력량, 필요하면 생산 데이터와 물질수지다. 구매기준이면 수집기간·산정기간의 일치와 재고 변화, 실측기준이면 검교정 상태와 단위·유효숫자 처리, 근사법이면 기초 데이터의 합리성을 미리 점검한다.","측정장비별 검교정 기준·주기, 고장 시 데이터 처리 방안, 검교정 성적서, 불확도 충족 여부도 항목이다. 업무 절차서와 교육 기록은 '담당자가 바뀌어도 같은 숫자가 나오나'라는 질문에 답하는 자료다. 전년 검증보고서의 권고사항을 어떻게 처리했는지는 반드시 묻는 항목이니 답을 준비한다."],"req":"현장검증 전에 숫자 하나를 고지서까지 역추적할 수 있는 근거 묶음, 모니터링 유형별 점검 항목, 검교정 성적서와 관리체계 자료, 전년 권고사항 처리 내역을 준비한다."},{"no":"별표 3-5 다","label":"스스로 중요성을 계산해 둔다","doc":"ver","pdfPage":43,"prose":["검증 전에 회사가 자기 중요성 기준을 계산해 두면 검증팀과 같은 눈으로 숫자를 볼 수 있다. 별표 3 제5호 다목의 기준은 총 배출량 500만 tCO2eq 이상 2.0%, 50만 이상 500만 미만 2.5%, 50만 미만 5.0%다. 가상의 예로 총 배출량 80만 tCO2eq인 회사라면 2.5%, 즉 2만 tCO2eq가 기준이다. 발견된 오류와 잠재오류, 불확도의 합이 이 아래여야 적정 의견이 가능하다.","이 숫자를 알면 우선순위가 정해진다. 2만 톤 기준에서 연간 50톤짜리 비상발전기 연료 오류는 의견을 바꾸지 못하지만, 전력 사용량을 한 달 빼먹으면 수천 톤이 움직여 기준에 가까워진다. 그래서 누적 95% 주요배출시설(별표 3 제3호)부터 두 번 확인하고, 작은 시설은 누락 여부(완전성)만 챙긴다. 다만 작은 오류도 조치 요구사항이면 고쳐야 하고, 산정·보고 기준을 어기면 금액이 작아도 조건부 적정이 될 수 있다는 점(제16조)은 잊지 않는다."],"req":"총 배출량 구간에 맞는 중요성 비율(2.0·2.5·5.0%)로 허용 톤수를 미리 계산해 주요배출시설부터 점검하되, 발견된 오류는 크기와 상관없이 고친다."},{"no":"제9조·제24조","label":"컨설턴트가 지켜야 할 선","doc":"ver","pdfPage":8,"prose":["이 지침은 명세서를 만드는 사람과 확인하는 사람을 여러 겹으로 분리한다. 사람 쪽에서는 제9조 제4항이 피검증자의 임직원 또는 컨설팅 참여자가 종료 후 2년 안에 그 회사 검증팀에 들어가는 것을 막고, 제10조·제11조가 기술전문가와 내부심의팀에도 같은 규정을 적용한다. 회사 쪽에서는 제21조 제4항이 온실가스·에너지 컨설팅업을 하는 법인의 검증기관 지정을 막고, 제24조 제5항이 검증기관의 인벤토리 설계·정보시스템·측정기기·탄소자산 자문을 막는다.","컨설턴트에게 실무 의미는 세 가지다. 첫째, 자기가 산정을 도운 회사의 검증기관에서 일할 수 없고, 거꾸로 검증을 한 회사에 2년 안에 그 자문을 할 수 없다. 둘째, 검증기관을 추천하거나 선정을 도울 때 그 기관이 그 회사에 자문을 한 적이 있는지(별지 제1호 자가진단표의 질문들)를 확인해야 한다. 셋째, 검증 중 검증팀이 '이렇게 고치면 된다'고 설계를 해 주는 것은 제24조 제5항 위반 소지가 있으므로, 고치는 방법은 회사와 컨설턴트가 정하고 검증팀은 결과만 확인한다."],"req":"컨설팅과 검증은 사람(2년)과 회사(지정 불가·자문 금지) 양쪽에서 분리되며, 검증팀은 고치는 방법을 설계하지 않고 결과만 확인한다."},{"no":"제13조","label":"K-ETS 검증은 지속가능경영보고서 어디에 나타나나","doc":"ver","pdfPage":4,"prose":["이 지침에 따른 명세서 검증은 할당대상업체의 국내 사업장 Scope 1·2에만 적용된다. 그런데 지속가능경영보고서는 해외 사업장과 Scope 3까지 다룬다. 그래서 큰 회사의 보고서에는 검증이 두 겹으로 나타난다. 기아 지속가능경영보고서 2026의 156쪽 LRQA 검증의견서 표는 주석 1에서 '국내 생산법인 및 비생산시설의 Scope 1 및 Scope 2 배출량은 한국 배출권거래제(K-ETS)에 따라 로이드인증원에 의해 별도 검증된 결과가 반영됨'이라고 적었다.","155쪽의 같은 의견서는 글로벌 인벤토리 전체를 ISO 14064-3:2019 절차로 제한적 보증 수준과 5% 중요성 기준으로 검증했다고 밝히고, 검증 활동의 하나로 국내 사업장 배출량에 대해 '한국의 배출권거래제를 통하여 로이드인증원으로부터 검증받은 데이터가 적절히 반영되었는지 확인'했다고 적었다. 즉 국내 Scope 1·2는 이 지침에 따라 합리적 보증으로 검증된 숫자를 가져오고, 그 위에 해외와 Scope 3를 제한적 보증으로 덮은 구조다. 현대자동차는 국내 명세서를 DNV가 이 지침으로 검증(157쪽)하고 해외는 LRQA가 따로 검증했다."],"req":"지속가능경영보고서에서 국내 Scope 1·2는 이 지침에 따른 합리적 보증 검증값이고 해외·Scope 3는 별도의 제한적 보증 검증값이므로, 숫자마다 어느 검증을 거쳤는지 구분한다.","ex":{"k":"기아 보고서에서는","t":"156쪽 LRQA 검증의견서 표의 주석 1은 '국내 생산법인 및 비생산시설의 Scope1및 Scope2 배출량은 한국 배출권거래제(K-ETS)에 따라 로이드인증원에 의해 별도 검증된 결과가 반영됨'이라고 적었다. 국내 광명·화성·광주 사업장 Scope 1은 각 57,070·128,509·66,682 tCO2e다.","co":"kia","page":156}},{"no":"제2조 제15호","label":"KSSB 인증과의 관계: 이미 합리적 보증을 받은 숫자","doc":"ver","pdfPage":2,"prose":["KSSB 교재 k0에서 본 대로, 금융위원회 2026년 7월 8일 최종안은 지속가능성 공시의 제3자 인증을 공시 의무화 2년 뒤인 2030년부터 의무화하되, 인증의 범위와 수준은 자본시장법령 개정 과정에서 정하기로 했다. 공통 기초 책 b1-5에서 본 대로 보증 수준은 제한적 보증과 합리적 보증 둘이고, 국제 지속가능성 공시 인증은 제한적 보증으로 시작하는 경우가 많다. 아직 국내 공시 인증이 어느 수준이 될지는 정해지지 않았다.","이 책의 지침은 그 질문에 부분적인 답을 이미 갖고 있다. 제2조 제15호와 제7조 제4호에 따라 국내 할당대상업체의 Scope 1·2 명세서는 매년 합리적 보증 수준으로 검증되고, 별표 3의 중요성 기준(2.0·2.5·5.0%)과 샘플링·역추적 절차를 거친다. 즉 KSSB 제2호 문단 29⑴에 따라 공시하는 Scope 1·2 가운데 국내 사업장 부분은 공시 인증이 어떤 수준으로 정해지든 이미 그 이상의 검증을 받은 숫자다. 다만 KSSB 공시는 연결 기준이라 해외 사업장과 Scope 3가 더해지고, 그 부분은 명세서 검증 밖이다.","컨설턴트의 준비는 두 갈래다. 국내 Scope 1·2는 명세서 확정값과 공시값을 일치시키고, 조직경계나 GWP 차이로 다르면 이유를 적어 둔다. 해외와 Scope 3는 이 지침의 절차(산정계획과의 대조, 역추적 가능한 근거 묶음, 검교정 기록, 전년 대비 변화 설명)를 빌려 와 합리적 보증에 대비한다. 명세서 검증을 한 번 제대로 치른 회사는 공시 인증의 절반을 이미 연습한 셈이다."],"req":"국내 Scope 1·2는 이 지침으로 매년 합리적 보증 검증을 받으므로 KSSB 공시 인증(2030년 의무화, 수준 미정)에 이미 대비된 숫자이며, 해외·Scope 3는 같은 절차를 빌려 준비한다.","terms":[{"t":"인증(공시)","d":"회사가 공시한 지속가능성 정보를 외부 전문기관이 확인해 주는 절차로, 금융위원회 최종안은 2030년부터 의무화한다.","en":"assurance"}]}],"write":{"q":"지속가능경영보고서의 온실가스 숫자를 공시 자료로 옮길 때, 국내 Scope 1·2와 해외·Scope 3는 검증 측면에서 무엇이 다른가?","must":[["합리적","합리적 보증"],["제한적","제한적 보증"],["검증지침","배출권거래제","K-ETS","명세서"]],"bonus":[["중요성","2.5%","5%"],["ISO 14064"]],"wrong":["모든 숫자가 같은 수준으로 검증된다"],"model":"국내 Scope 1·2는 배출권거래제 검증지침에 따라 합리적 보증 수준으로 검증된 명세서 값이고, 해외와 Scope 3는 ISO 14064-3 등으로 제한적 보증 수준에서 따로 검증된 값이다.","src":"제2조 제15호, 제7조 제4호; 기아 155~156쪽"},"check":{"q":"KSSB 공시의 제3자 인증 수준(제한적·합리적)에 대한 설명으로 옳은 것은?","options":["검증지침 제2조에 따라 합리적 보증으로 확정되었다","금융위원회 최종안은 2030년부터 인증을 의무화했지만 범위와 수준은 자본시장법령 개정 과정에서 정하기로 했다","제한적 보증으로 확정되어 명세서 검증보다 낮다"],"ans":1,"why":"검증지침의 합리적 보증은 명세서 검증에 적용되는 것이고, KSSB 공시 인증의 수준은 금융위원회 최종안에서 아직 정해지지 않았다(KSSB 교재 k0)."},"summary":["명세서 제출기한(이행연도 종료 후 3개월) 안에 3단계가 끝나도록 단계별 준비물과 검증소요일수를 넣어 전년부터 일정을 짜고, 현장검증 전에 역추적 가능한 근거 묶음과 검교정·관리체계 자료를 갖춘다.","총 배출량 구간별 중요성 비율로 허용 톤수를 계산해 주요배출시설부터 점검하되 발견된 오류는 모두 고치며, 컨설팅과 검증은 사람(2년)과 회사(지정 불가·자문 금지) 양쪽에서 분리한다.","국내 Scope 1·2는 이 지침으로 매년 합리적 보증 검증을 받는 숫자이고 해외·Scope 3는 제한적 보증 검증값이므로, KSSB 공시 인증(2030년 의무화, 수준 미정)에는 국내 값을 맞추고 나머지는 같은 절차를 빌려 준비한다."]}]};

const BANK=[{"id":"ifrs-j4","type":"judge","q":"CO2 환산 때 보고일 기준 최신 IPCC 평가보고서의 100년 지구온난화지수(GWP)를 썼는가?","ref":"적용지침 (GWP 환산)","why":"최신은 6차 보고서다. 5차 값도 함께 썼다면 어느 범위(예: 국내 배출권거래제 대상분)에 5차를 썼는지 밝혀야 하는데 그 설명이 없다.","trap":"'6차가 들어 있으니 됐다'로 넘기기 쉽다. 2025년 12월 개정(2027년부터 적용)으로 법령이 요구하는 GWP 값을 쓸 수 있는 경감이 새로 생겼다. 그래도 어느 범위에 어떤 값을 썼는지는 측정 방법·가정 설명(문단 29(a)(iii))으로 드러나야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"IPCC(Intergovernmental Panel on Climate Change) 제5차 및 제6차 평가보고서에서 제시한 100년 기준 지구온난화지수(GWP, Global Warming Potential)를 적용하여 이산화탄소 환산량(tCO₂-eq)으로 변환하여 수치 값을 산정하였습니다.","page":38,"co":"hyundai","look":"38쪽 '배출량 측정을 위한 접근법' 끝부분","src":{"label":"ISSB, IFRS S2 개정 발표 (2025.12)","url":"https://www.ifrs.org/news-and-events/news/2025/12/issb-issues-targeted-amendments-ifrs-s2/"}},{"id":"ifrs-j6","type":"judge","q":"Scope 1·2 배출량을 '연결 실체'와 '그 밖의 투자기업(관계기업·공동기업 등)'으로 나눠 공시하는가?","ref":"문단 29(a)(iv)","why":"같은 쪽에 경계 설명이 두 번 나온다. '연결기준' 문장대로라면 Scope 1·2는 모두 연결 실체 몫이고, 그 밖의 투자기업은 Category 15(투자)로 갔다고 읽을 수 있다. 그래서 '일부'로 본다. 하지만 운영통제 문장과 어떻게 맞물리는지 정리돼 있지 않고, 두 집단으로 나눈 숫자나 '그 밖의 투자기업 몫은 0'이라는 명시도 없다.","trap":"'숫자를 요구하는데 숫자가 없으니 없음'으로 볼 수도 있다. 경계 설명이 답을 간접적으로 주는지, 아닌지가 판단의 갈림길이다. 또 157~160쪽의 국내·해외 구분은 지역 구분이지 이 요구사항(연결 실체 대 그 밖의 투자기업)이 아니다. 둘을 헷갈리기 쉽다.","options":["있음","일부","없음"],"ans":1,"quote":"조직 경계 설정에 있어서는 통제력 기준(Control Approach) 중 운영통제력(Operational Control)을 사용하여, 회사가 운영을 통제하는 사업장과 활동에서 발생하는 온실가스 배출을 산정 범위에 포함하였습니다. / … 온실가스 관리의 정합성과 국제 기준 부합성을 제고하기 위해 조직경계를 연결기준으로 설정하였습니다.","page":38,"co":"hyundai","look":"38쪽 '배출량 측정을 위한 접근법'과 '배출량 차이에 대한 분석'"},{"id":"ifrs-j8","type":"judge","q":"Scope 3에 어떤 카테고리를 넣고 뺐는지, 뺀 이유를 밝히는가?","ref":"문단 29(a)(vi)","why":"15개 중 13개를 산정했고, 빠진 Category 8(Scope 1·2와 중복)과 Category 9(데이터 한계)의 이유를 각각 밝혔다.","trap":"사유를 밝히라는 요구는 충족했지만, Category 9를 2025년부터 빼서 전년(56.8만 t)과 범위가 달라진 건 별도의 비교 가능성 문제다. '있음'과 '문제없음'은 다른 말이다.","options":["있음","일부","없음"],"ans":0,"quote":"지역별 시장 구조의 차이와 데이터 가용성 및 신뢰성의 한계로 인해, 2025년부터 본 카테고리에 대한 배출량은 산정하지 않습니다. (Category 9)","page":40,"co":"hyundai","look":"38쪽 표, 40쪽 Category 8·9 설명"},{"id":"ifrs-j11","type":"judge","q":"당기 경영진 보상 중 기후와 연계된 비율(%)을 공시하는가? (문단 29(g)의 두 번째 요구)","ref":"문단 29(g)(ii)","why":"문단 29(g)는 두 가지를 요구한다. (i) 기후 고려사항이 경영진 보상에 반영되는지, 어떻게 반영되는지 설명하고, (ii) 그 비율(%)을 밝히라는 것. 23쪽은 연계 구조와 KPI(탄소중립 이행률, RE100 달성률 등)를 자세히 적어 (i)은 충족하지만, (ii)의 비율은 '연봉의 일정 비율'이라고만 해서 숫자가 없다.","trap":"질문이 (ii) 비율만 물었으니 답은 '없음'이다. 문단 29(g) 전체로 판정한다면 (i)은 있고 (ii)가 없으니 '일부'가 된다. 판정할 때는 요구사항을 하위 항목까지 쪼개서, 어느 조각이 있고 어느 조각이 없는지 먼저 나눠 보자.","options":["있음","일부","없음"],"ans":2,"quote":"매년 주요 지표에 대한 달성률 및 이행평가를 통하여 연봉의 일정 비율을 해당 성과에 대한 금전적 인센티브로 제공하고 있습니다.","page":23,"co":"hyundai","look":"23쪽 '보상'과 '기후변화 성과 연계 보상' 표"},{"id":"ifrs-j12","type":"judge","q":"목표의 지표, 목적, 적용 범위, 기간, 기준연도를 밝히는가?","ref":"문단 33","why":"지표(배출량), 목적(1.5℃ 감축), 범위(Scope 1+2, Category 11), 기간(2030·2035), 기준연도(2024)가 모두 있다.","trap":"'약 42%'의 '약'을 놓치지 말 것. 승인받은 목표값이 정확히 몇 %인지는 SBTi 공개 목록에서 확인할 수 있다.","options":["있음","일부","없음"],"ans":0,"quote":"사업장 운영 과정에서 발생하는 Scope 1+2 배출량은 기준연도인 2024년 대비 2030년까지 약 42% 감축하는 것을 목표로 설정하였습니다. / Scope 3 – Category 11은 기준연도인 2024년 대비 2035년까지 63% 감축하는 것을 목표로 SBTi의 승인을 받았습니다.","page":40,"co":"hyundai","look":"40쪽 '탄소중립 목표'"},{"id":"ifrs-j14","type":"judge","q":"목표 대비 성과와 추세를 분석해 보여주는가?","ref":"문단 35","why":"두 해의 숫자와 목표는 있지만, '목표까지 얼마나 왔는지', '경로보다 빠른지 느린지'를 설명한 문장은 없다. 읽는 사람이 직접 계산해야 한다.","trap":"숫자 표가 있다고 성과 분석이 있는 건 아니다. 계산 연습 4번과 6번에서 직접 진척률을 구해 보자.","options":["있음","일부","없음"],"ans":1,"quote":"Scope 1+2 합계 2,198,406 → 1,911,084 (38쪽 표) / 기준연도인 2024년 대비 2030년까지 약 42% 감축하는 것을 목표 (40쪽)","page":38,"co":"hyundai","look":"38쪽 표, 40쪽 목표"},{"id":"ifrs-j15","type":"judge","q":"목표가 총량(gross) 기준인지, 상쇄를 뺀 순량(net) 기준인지 밝히는가?","ref":"문단 36(c)","why":"2030·2035 감축 목표는 SBTi 성격상 총량 감축이지만, 그렇다고 쓴 문장이 없다. 2045 탄소중립은 상쇄를 포함하는 순량 개념인데 그 구분도 없다. 순량 목표가 있으면 짝이 되는 총량 목표도 따로 밝혀야 한다.","trap":"'SBTi니까 당연히 총량'이라고 넘기기 쉽다. 공시는 '당연함'이 아니라 '적혀 있음'을 본다.","options":["있음","일부","없음"],"ans":1,"quote":"목표연도인 2045년 잔여 탄소 배출을 처리하기 위해 탄소 포집과 활용 기술인 CCUS(…)에 투자하고, 폐배터리를 에너지저장장치로 재활용하거나 해양 생태계를 복원하는 등의 탄소 상쇄 활동을 지속적으로 추진할 것입니다.","page":40,"co":"hyundai","look":"40쪽 '탄소중립 목표' 마지막 문단"},{"id":"ifrs-j16","type":"judge","q":"목표 달성에 탄소 크레딧을 얼마나, 어떤 종류로 쓸 계획인지 밝히는가?","ref":"문단 36(e)","why":"상쇄 활동은 설명했지만, 크레딧에 얼마나 기댈지, 어떤 인증 체계인지, 흡수·제거형인지 감축형인지가 없다.","trap":"상쇄 '활동'을 하는 것과 목표 달성에 크레딧을 '쓸 계획'을 밝히는 것은 다르다.","options":["있음","일부","없음"],"ans":1,"quote":"해조류 기반 블루카본을 중심으로 바다숲 조성사업에 참여하여 해양 생태계 복원과 탄소흡수 기능을 동시에 확보하고 있으며, 유관 기관과의 협력을 통해 블루카본 확산 및 제도화를 지원하겠습니다.","page":41,"co":"hyundai","look":"41쪽 '탄소 상쇄 및 제거'"},{"id":"kssb-01","type":"mc","q":"금융위원회 최종안(2026년 7월 8일)에 따르면, 기후 공시를 가장 먼저 의무로 해야 하는 회사와 시기는 무엇인가?","ref":"금융위 최종안(2026.7.8) · 공시 대상","why":"최종안은 코스피 상장사 중 연결 자산총액 10조원 이상 회사부터 2027회계연도 정보를 2028년에 공시하게 한다. 이후 2029년 5조원 이상으로 넓히고, 2030년 2조원 이상 확대를 검토한다.","trap":"2월 초안의 '30조원 이상'을 그대로 외우는 실수가 많다. 7월 최종안에서 10조원으로 낮아져 첫해 대상(종속회사 포함 약 291개사)이 크게 늘었다.","options":["코스피 상장사 중 연결 자산총액 30조원 이상, 2026회계연도분부터","코스피 상장사 중 연결 자산총액 10조원 이상, 2027회계연도분(2028년 공시)부터","모든 상장사, 2028회계연도분부터","코스닥 포함 연결 자산총액 2조원 이상, 2027회계연도분부터"],"ans":1,"src":{"label":"금융위원회 보도자료 '지속가능성(ESG) 공시 제도화 방안' 최종안 (2026.7.8)","url":"https://www.fsc.go.kr/po010101/87280"}},{"id":"kssb-02","type":"mc","q":"최종안에서 Scope 3(회사 밖 가치사슬에서 나오는 간접 배출) 공시는 어떻게 다루는가? 연결 자산 10조원 이상 회사 기준으로 고르시오.","ref":"금융위 최종안 · Scope 3 유예","why":"최종안은 Scope 3를 공시대상별로 3년 늦춘다. 10조원 이상 회사는 2028년에 공시를 시작하므로 Scope 3는 3년 뒤인 2031년 공시(2030회계연도분)부터 적용된다.","trap":"'2031년'은 공시하는 해이고, 대상 데이터는 2030회계연도분이다. 또 IFRS S2의 첫해 Scope 3 면제(1년)와 헷갈려 '1년 유예'로 답하기 쉽다.","options":["처음부터 Scope 1·2와 함께 공시한다","공시대상별로 1년 유예하여 2029년 공시부터 한다","공시대상별로 3년 유예하여 2031년 공시(2030회계연도분)부터 한다","Scope 3는 영구히 자율 공시로 둔다"],"ans":2,"src":{"label":"금융위원회 보도자료 '지속가능성(ESG) 공시 제도화 방안' 최종안 (2026.7.8)","url":"https://www.fsc.go.kr/po010101/87280"}},{"id":"kssb-03","type":"mc","q":"최종안에서 의무 지속가능성(기후) 공시는 어디에 싣는가?","ref":"금융위 최종안 · 공시 방식","why":"최종안은 거래소 공시 단계를 건너뛰고 처음부터 사업보고서 기재사항(법정공시)으로 넣는다. 그래서 3월 말 사업보고서 일정에 맞춰 준비해야 한다.","trap":"2월 초안은 '거래소 공시 먼저, 나중에 법정공시'였다. 최종안에서 바뀐 점을 놓치면 공시 책임과 일정을 가볍게 보게 된다. 의무 대상이 아닌 회사는 거래소 자율공시를 계속 쓸 수 있다.","options":["자본시장법상 사업보고서(법정공시)에 바로 싣는다","먼저 거래소 자율공시로 시작하고 몇 년 뒤 사업보고서로 옮긴다","회사 홈페이지의 지속가능경영보고서에만 싣는다","환경부 온실가스 종합정보센터에 제출한다"],"ans":0,"src":{"label":"금융위원회 보도자료 '지속가능성(ESG) 공시 제도화 방안' 최종안 (2026.7.8)","url":"https://www.fsc.go.kr/po010101/87280"}},{"id":"kssb-04","type":"mc","q":"최종안에서 지속가능성 공시에 대한 제3자 인증(외부 기관이 내용을 확인해 주는 것)은 언제부터 의무인가?","ref":"금융위 최종안 · 인증","why":"시장에 인증 경험이 아직 부족하므로, 공시 의무화(2028년) 2년 뒤인 2030년부터 인증을 의무로 한다. 인증 범위·수준·인증기관 요건은 이후 시행령 등에서 정한다.","trap":"'2030년'을 회계연도로 착각하기 쉽다. 최종안은 '공시 의무화 2년 후인 2030년부터'라고만 했는데, 공시 의무화가 2028년 공시(2027회계연도분)부터이므로 2030년에 내는 공시(2029회계연도분)부터로 해석된다. 인증 수준(제한적 vs 합리적)은 아직 정해지지 않았다.","options":["공시 첫해인 2028년부터","공시 의무화 2년 후인 2030년부터","2035년 이후 검토","인증 의무는 없고 계속 자율이다"],"ans":1,"src":{"label":"금융위원회 보도자료 '지속가능성(ESG) 공시 제도화 방안' 최종안 (2026.7.8)","url":"https://www.fsc.go.kr/po010101/87280"}},{"id":"kssb-06","type":"mc","q":"KSSB 지속가능성 공시기준 제2호 '기후 관련 공시'에 대한 설명으로 옳은 것은?","ref":"KSSB 제1·2호 (2026.2.26 확정)","why":"KSSB(한국회계기준원 지속가능성기준위원회)는 ISSB 기준을 바탕으로 제1호(일반, IFRS S1 기반)와 제2호(기후, IFRS S2 기반)를 2026년 2월 26일 확정했다. 거버넌스·전략·위험관리·지표 및 목표의 4가지 틀도 같다. 초안에 있던 정책공시(제101호)는 빠졌다.","trap":"'IFRS S2 기반'이 '똑같다'는 뜻은 아니다. 선택공시 항목, 측정 방법별 구분 공시 같은 한국만의 차이가 있다.","options":["GRI 305를 바탕으로 만든 기준이다","IFRS S2를 바탕으로 만들었고 2026년 2월 26일 KSSB에서 최종 확정되었다","EU ESRS E1을 그대로 번역한 기준이다","아직 공개초안 단계이다"],"ans":1,"src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-07","type":"mc","q":"IFRS S2에서는 요구되지만, 확정된 KSSB 기준에서는 '선택 공시'로 허용된 항목은 무엇인가?","ref":"KSSB 제2호 국내 기준 선택 공시 항목","why":"KSSB는 국내 수용성을 고려해 산업기반 지표와 톤당 내부탄소가격을 선택 공시로 두었다. 기후 외 E·S·G 주제도 선택이다. Scope 1·2, 거버넌스, 위험·기회는 핵심 요구사항이다.","trap":"'선택'이라고 무시하면 안 된다. 투자자·평가기관은 여전히 이 정보를 찾으며, 자동차 회사라면 평균연비 같은 지표는 공시하는 편이 비교에 유리하다.","options":["Scope 1·2 온실가스 배출량","산업기반 지표(예: 자동차 평균연비)와 톤당 내부탄소가격","기후 관련 거버넌스(이사회 감독)","기후 관련 위험과 기회의 식별"],"ans":1,"src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-08","type":"mc","q":"한국 회사는 국내 사업장은 배출권거래제 지침으로, 해외 사업장은 GHG 프로토콜로 재는 것처럼 측정 방법을 섞어 쓰는 경우가 많다. 이렇게 스코프 1·2에 두 방법의 측정분이 섞여 있을 때 KSSB가 추가로 요구하는 것은?","ref":"KSSB 제2호 · 측정 방법","why":"IFRS S2는 원칙적으로 GHG 프로토콜을 쓰되, 관할 당국이나 거래소가 다른 방법을 요구하면 그 방법을 쓸 수 있게 한다. KSSB는 여기에 더해, 스코프 1·2에 GHG 프로토콜 측정분과 관할 당국·거래소 요구 방법 측정분이 섞여 있으면 사용한 방법별로 나눠 공시하게 한다(제2호 문단 29⑴㈒). 한 가지 방법만 썼다면 이 세분화는 적용되지 않는다.","trap":"배출권거래제 명세서 값(국내 사업장 중심)과 GHG 프로토콜 값(연결·운영통제 기준)은 범위가 달라 숫자가 다르다. 한 숫자만 내고 출처를 밝히지 않으면 요구사항을 못 채운다.","options":["GHG 프로토콜만 쓰고 국내 지침 값은 버린다","온실가스 배출량을 측정할 때 쓴 방법별로 배출량을 나누어 공시한다","국내 지침 값만 쓰고 측정 방법은 밝히지 않는다","두 값의 평균을 공시한다"],"ans":1,"src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-09","type":"judge","q":"현대자동차 2025년 보고서는 KSSB가 요구하는 '측정 방법별 배출량 구분 공시'를 충족할 준비가 되어 있는가?","ref":"KSSB 제2호 온실가스 측정 방법별 구분 공시","why":"38쪽은 쓴 기준(GHG 프로토콜, 배출권거래제 지침, IPCC)을 모두 밝히지만, 배출량 표는 하나(2025년 Scope 1+2 1,911,084 tCO2-eq)뿐이다. 배출권거래제 기준 국내 사업장 값(1,564,345 tCO2-eq 등)은 157쪽 검증의견서에만 따로 있어, 방법별로 나눈 표로 정리돼 있지는 않다.","trap":"'여러 기준을 적용했다'는 문장만 보고 '있음'으로 판단하기 쉽다. KSSB는 방법별로 숫자를 나눠 보여 주라는 것이므로 기준 목록만으로는 부족하다.","options":["있음","일부","없음"],"ans":1,"quote":"Scope 1 및 Scope 2 배출량은 「The Greenhouse Gas Protocol: A Corporate Accounting and Reporting Standard (Revised Edition)」과 「The Greenhouse Gas Protocol: Scope 2 Guidance」를 근거로 산정하였으며, 국내 「탄소중립기본법」 및 「온실가스 배출권거래제의 배출량 보고 및 인증에 관한 지침」을 준수하였습니다.","page":38,"co":"hyundai","look":"38쪽 '배출량 측정을 위한 접근법'과 157쪽 온실가스 검증의견서","src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-10","type":"judge","q":"KSSB에서 선택 공시인 '톤당 내부탄소가격'을 현대자동차 2025년 보고서는 공시하고 있는가?","ref":"KSSB 제2호 선택공시 — 톤당 내부탄소가격","why":"현대차는 Scope 1·2 배출량에 그림자 가격(Shadow Price) 방식의 내부 탄소 가격을 쓰고, 톤당 USD 7~84 범위와 의사결정 활용처를 밝힌다. 선택 항목이지만 이미 공시하고 있다.","trap":"가격이 하나가 아니라 범위(지역별 차등)로 나오므로, '톤당 가격'을 하나의 숫자로만 찾다가 '없음'으로 오판하기 쉽다.","options":["있음","일부","없음"],"ans":0,"quote":"2025년 기준의 내부 탄소 가격은 사업장이 위치한 지역의 온실가스 배출권 거래제(ETS) 거래 가격 기반으로 USD 7~84/tCO2-eq 범위 내에서 차등 적용됩니다.","page":41,"co":"hyundai","look":"41쪽 '내부 탄소 가격'","src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"kssb-11","type":"judge","q":"KSSB는 단기(1년 이내)·중기(1년 초과 5년 이내)·장기(5년 초과)를 기본 기간범위로 정해 두고, 기업이 이를 쓰거나 자체 정의를 쓸 수 있게 한다(제1호 문단 31A, 제2호 문단 10B). 현대자동차 보고서는 기후 위험·기회의 시간 범위를 정의하고 있는가?","ref":"KSSB 제2호 단기·중기·장기 정의","why":"현대차는 단기 0~3년, 중기 3~10년, 장기 10~25년으로 정의한다. KSSB 기본 기간범위보다 길지만, 기본 기간범위는 선택 사항이므로 자체 정의를 써도 된다. 자동차는 설비 수명과 제품 개발 주기가 길어 산업 특성에 맞춘 정의로 볼 수 있다.","trap":"KSSB 기본 기간범위(1년/1~5년/5년 초과)와 다르다고 '미충족'으로 보면 틀린다. 자체 정의를 쓰면 그 정의가 전략적 의사결정에 쓰는 계획기간과 어떻게 연결되는지 설명이 있는지는 따로 확인해야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"단기(0-3년) / 중기(3-10년) / 장기(10-25년)","page":23,"co":"hyundai","look":"23쪽 '기후 위험 및 기회 관리 적용기간 및 범위'","src":{"label":"삼일PwC, 지속가능성 공시 제도 로드맵 초안 및 확정 공시기준 주요 내용 (2026.3)","url":"https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_esg-disclosure-roadmap.pdf"}},{"id":"ifrs-s1-01","type":"mc","q":"IFRS S1이 말하는 '주요 이용자(primary users)'는 누구인가?","ref":"IFRS S1 문단 1–2, IG1–IG6","why":"S1의 목적은 일반목적재무보고서 이용자가 회사에 자원을 제공할지 결정할 때 쓸 정보를 공시하게 하는 것이다. 그 이용자는 기존·잠재 투자자, 대여자, 그 밖의 채권자이며, 이들의 공통된 정보 수요를 맞추는 것이 목표다.","trap":"GRI처럼 '모든 이해관계자'를 떠올리면 틀린다. S1은 투자자 관점의 재무적 중요성 기준이다.","options":["기존·잠재 투자자, 대여자, 그 밖의 채권자","회사의 모든 이해관계자(임직원, 지역사회, NGO 포함)","정부와 금융감독 당국","회사의 이사회와 경영진"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-02","type":"mc","q":"IFRS S1 문단 18의 중요성(materiality) 정의로 옳은 것은?","ref":"IFRS S1 문단 18","why":"S1의 정의는 IFRS 회계기준의 중요성 정의와 같은 뼈대다. '빠뜨림·잘못 적음·흐리게 적음(omitting, misstating or obscuring)'이 주요 이용자의 결정에 영향을 줄 수 있는지가 기준이며, 고정된 숫자 임계값은 없다.","trap":"회계감사에서 쓰는 수치 기준(예: 매출의 5%)을 그대로 가져오면 안 된다. 중요성은 회사별·정보별로 성질과 크기를 함께 보고 판단한다.","options":["정보를 빠뜨리거나, 잘못 적거나, 흐리게 적었을 때 주요 이용자의 결정에 영향을 줄 수 있다고 합리적으로 예상되면 중요하다","회사가 환경·사회에 미치는 영향이 크면 중요하다","금액이 매출의 5%를 넘으면 중요하다","이해관계자 설문에서 상위 10위에 들면 중요하다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-03","type":"mc","q":"IFRS S1이 요구하는 공시의 4개 핵심 요소(core content)를 바르게 묶은 것은?","ref":"IFRS S1 문단 25–53","why":"S1은 TCFD 권고안의 4개 기둥을 그대로 가져왔다. 거버넌스(누가 감독하나), 전략(위험·기회가 사업과 재무에 어떤 영향을 주나), 위험관리(어떻게 찾고 평가하나), 지표 및 목표(어떻게 측정하고 진척을 보나)다.","trap":"ESRS의 '정책·행동·목표·지표' 구조나 GRI의 '영향' 중심 구조와 섞어 쓰면 보고서 목차부터 틀어진다.","options":["거버넌스, 전략, 위험관리, 지표 및 목표","환경, 사회, 지배구조, 경제","영향, 위험, 기회, 재무효과","정책, 행동, 목표, 성과"],"ans":0,"src":{"label":"IFRS S1 기준서 페이지 (ifrs.org)","url":"https://www.ifrs.org/issued-standards/ifrs-sustainability-standards-navigator/ifrs-s1-general-requirements/"}},{"id":"ifrs-s1-04","type":"mc","q":"모회사가 연결재무제표를 만든다. IFRS S1에 따른 지속가능성 공시의 보고실체는 어디까지인가?","ref":"IFRS S1 문단 20, B38","why":"문단 20은 지속가능성 공시가 관련 재무제표와 '같은 보고실체'를 대상으로 해야 한다고 정한다. 연결재무제표를 내는 모회사라면 자회사까지 포함한 연결 범위가 공시 범위다.","trap":"온실가스 산정 경계(지분법·운영통제)와 공시 보고실체를 혼동하기 쉽다. 보고실체는 재무제표를 따라 정하고, 배출량 산정 경계는 그 안에서 S2 요구에 따라 밝힌다.","options":["연결재무제표와 같은 범위, 즉 모회사와 자회사 전체","모회사 단독(별도재무제표 기준)","국내 사업장만","회사가 공시 범위를 자유롭게 정할 수 있다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-06","type":"mc","q":"IFRS S1 문단 3에서 '회사의 전망(prospects)에 합리적으로 영향을 줄 수 있다'는 말은 구체적으로 무엇에 대한 영향인가?","ref":"IFRS S1 문단 3","why":"S1은 전망을 '현금흐름, 자금조달 접근성(access to finance), 자본비용(cost of capital)'으로 풀어 쓰고, 시간 범위를 단기·중기·장기로 넓게 잡는다. 지금 돈이 안 들어도 장기적으로 자금조달 조건을 바꿀 수 있는 위험이면 범위에 들어온다.","trap":"'당기 손익에 숫자로 안 잡히니 공시 대상이 아니다'라고 끊으면 틀린다. 장기 현금흐름과 자본비용까지 봐야 한다.","options":["단기·중기·장기의 현금흐름, 자금조달 접근성, 자본비용","당기 매출과 영업이익","주가와 시가총액","브랜드 평판 점수"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-08","type":"mc","q":"IFRS S1 문단 64가 정한 지속가능성 공시의 보고 시점은?","ref":"IFRS S1 문단 64","why":"문단 64는 지속가능성 공시를 관련 재무제표와 '동시에(at the same time)' 내도록 한다. 투자자가 재무정보와 지속가능성 정보를 한 묶음으로 보게 하려는 취지다. 첫 적용연도에만 E4의 완화조치로 늦출 수 있다.","trap":"한국 관행처럼 6월에 지속가능경영보고서를 내는 일정은 S1의 기본 원칙과 맞지 않는다. 첫해 완화조치는 한 번만 쓸 수 있다.","options":["관련 재무제표와 같은 시점에 공시한다","재무제표 발표 후 6개월 이내에 공시한다","회계연도 종료 후 1년 이내 아무 때나 공시한다","주주총회 이후 공시한다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-09","type":"mc","q":"회사가 'IFRS 지속가능성 공시기준을 준수했다'는 선언을 하려면 어떤 조건이 필요한가?","ref":"IFRS S1 문단 72","why":"문단 72는 모든 요구사항을 충족할 때만 명시적이고 유보 없는 준수 선언을 허용한다. 일부만 따르면서 '참고하여 작성'이라고 쓰는 것은 준수 선언이 아니다. 단, 문단 73의 완화(법규 금지, 상업적 민감 정보)를 쓰더라도 선언은 가능하다.","trap":"'TCFD·SASB를 반영했다'는 문구를 ISSB 준수와 같은 뜻으로 보면 틀린다. 둘은 다른 수준의 진술이다.","options":["ISSB 기준의 모든 요구사항을 충족해야 하며, 선언은 명시적이고 유보 없이(explicit and unreserved) 해야 한다","S2의 핵심 지표(Scope 1·2)만 공시하면 된다","TCFD 권고안을 따랐다는 문구로 대체할 수 있다","제3자 인증을 받으면 자동으로 준수로 인정된다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-11","type":"mc","q":"한 회사가 인적자본(사람) 관련 공시를 준비한다. ISSB 기준서가 없는 이 주제에서 GRI 기준이나 유럽 ESRS를 쓰려면 IFRS S1은 어떤 조건을 두는가?","ref":"IFRS S1 문단 57–58, 부록 C","why":"문단 57은 회사가 판단으로 관련성 있고 충실하게 표현하는 정보를 찾도록 하고, 문단 58은 SASB 지표를 반드시 고려, 부록 C(C1–C2)는 GRI 기준과 ESRS를 '고려할 수 있다'로 둔다. 조건은 S1 목적에 부합하고 ISSB 기준과 충돌하지 않을 것이다.","trap":"GRI 지표를 그대로 옮기면서 '모든 이해관계자 영향' 관점까지 끌어오면 S1의 투자자 관점과 충돌한다. 지표는 빌려도 중요성 판단은 S1 방식으로 해야 한다. 참고: 영국 UK SRS S1 초안은 이 'shall'을 'may'로 낮추는 수정을 제안했다.","options":["S1의 목적을 달성하는 데 도움이 되고 ISSB 기준과 충돌하지 않는 범위에서 '고려할 수 있다'","GRI와 ESRS 중 하나를 반드시 그대로 적용해야 한다","ISSB 기준서가 없는 주제는 공시하지 않는다","ESRS는 EU 회사만 쓸 수 있다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문에 영국 수정 표시)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-12","type":"mc","q":"IFRS S1의 '연결된 정보(connected information)' 요구에 해당하지 않는 것은?","ref":"IFRS S1 문단 21–24, B39–B44","why":"문단 22는 관련 재무제표 식별, 문단 23은 데이터·가정의 일관성, 문단 24는 표시통화 일치를 요구한다. 보고실체는 문단 20에 따라 재무제표와 '같아야' 하므로 마지막 선택지는 정반대다. 연결된 정보는 위험·기회 사이, 4개 요소 사이, 공시와 재무제표 사이의 관계 설명을 뜻한다.","trap":"기후 시나리오 분석에 쓴 탄소가격·할인율이 재무제표의 손상검사 가정과 다르면 '연결' 요건 위반 소지가 있다. 두 팀의 가정을 맞추는 것이 컨설턴트의 일이다.","options":["지속가능성 공시가 어느 재무제표와 짝인지 밝힌다","지속가능성 공시의 데이터·가정은 가능한 한 재무제표 작성에 쓴 것과 일치시킨다","금액 단위로 통화를 쓸 때 재무제표의 표시통화를 쓴다","지속가능성 공시는 재무제표와 별도의 보고실체로 작성해 비교 가능성을 높인다"],"ans":3,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-13","type":"mc","q":"지난해 공시한 지표가 추정치였는데, 올해 새 정보로 지난해 상황을 더 잘 알게 되었다. IFRS S1에서 올바른 처리는?","ref":"IFRS S1 문단 70, B50–B51","why":"B50은 전기 추정치에 대해 새 정보가 생기면 수정 비교 금액·차이·이유를 공시하게 한다. B51은 실행 불가능하거나 미래지향 지표라 사후 판단이 필요한 경우 예외를 둔다. B54에 따라 수정할 수 없으면 그 사실을 밝힌다.","trap":"'추정 변경'을 '오류 수정'으로 처리하면 안 된다. 문단 85는 오류 수정과 추정 변경을 구별하도록 하며, 오류만 재작성(restatement)이다.","options":["수정한 전기 비교 금액, 차이, 이유를 공시한다. 단, 실행 불가능하거나 미래 예측 지표여서 사후 판단(hindsight)이 필요하면 수정하지 않아도 된다","전기 금액은 어떤 경우에도 바꾸지 않는다","전기 금액을 조용히 바꾸고 설명은 생략한다","비교정보 자체를 공시하지 않는다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-14","type":"mc","q":"IFRS S1 문단 77–78의 측정 불확실성 공시로 요구되는 것은?","ref":"IFRS S1 문단 74–81","why":"문단 77은 보고 금액에 영향을 주는 가장 중요한 불확실성을 이용자가 이해할 수 있게 하라고 하고, 문단 78은 측정 불확실성이 높은 금액을 식별해 원천·가정·근사치·판단을 설명하게 한다. Scope 3 추정치가 대표적이다. 문단 74는 공시 준비 과정의 중요한 판단도 밝히게 한다.","trap":"'불확실하니 빼자'는 완전성(공정한 표시) 위반이다. 불확실해도 공시하고, 어디가 왜 불확실한지 설명하는 것이 기준의 요구다.","options":["측정 불확실성이 높은 공시 금액을 식별하고, 그 불확실성의 원천과 쓴 가정·근사치·판단을 설명한다","모든 지표의 오차율을 %로 계산해 공시한다","불확실한 숫자는 공시에서 빼고 확실한 것만 적는다","제3자 인증을 받았으면 불확실성 공시를 생략할 수 있다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-15","type":"mc","q":"회사가 전기 지속가능성 공시에서 중요한 오류(예: 사업장 하나를 빼고 집계)를 발견했다. IFRS S1의 처리는?","ref":"IFRS S1 문단 83–86","why":"문단 83은 중요한 전기 오류를 비교 금액 재작성으로 고치되 실행 불가능하면 예외를 둔다. 문단 84는 오류를 '전기 공시의 누락·왜곡'으로 정의하고, 문단 85는 오류 수정과 추정 변경을 구별한다.","trap":"당기에 몰아서 조정(cumulative catch-up)하면 추세가 깨진다. 기준은 비교 금액 자체를 고치라고 요구한다.","options":["실행 불가능한 경우가 아니면 전기 비교 금액을 다시 적어(restating) 오류를 고치고 그 사실을 밝힌다","다음 보고서에서 당기 숫자에 합쳐서 조정한다","전기 숫자는 그대로 두고 각주로만 언급한다","오류가 10% 미만이면 수정하지 않아도 된다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-17","type":"mc","q":"첫 적용연도에 '기후 우선(E5)' 완화를 써서 기후 정보만 공시한 회사가 2년차에 기후 외 주제까지 공시를 넓힌다. 비교정보는 어떻게 되는가?","ref":"IFRS S1 부록 E5–E6","why":"E6에 따라 E5를 쓴 회사는 첫해에 기후 비교정보가 면제되고, 2년차에는 새로 추가한 기후 외 지속가능성 위험·기회의 비교정보가 면제된다. 기후 정보는 2년차부터 비교정보를 내야 한다. 완화를 썼다는 사실은 밝혀야 한다.","trap":"E5는 '기후만 공시해도 S1 준수'라는 뜻이지 S1을 적용하지 않는다는 뜻이 아니다. 중요성·연결된 정보·판단·불확실성 등 S1의 일반 요구사항은 기후 공시에 그대로 적용된다.","options":["2년차에는 기후 외 주제의 비교정보를 내지 않아도 된다(기후 비교정보는 필요)","2년차에도 모든 비교정보를 생략할 수 있다","2년차에 기후 외 주제의 2개년 비교정보를 모두 내야 한다","기후 우선을 쓰면 비교정보 의무가 영구히 면제된다"],"ans":0,"src":{"label":"AASB: IFRS S1 E4–E6 원문 발췌","url":"https://standards.aasb.gov.au/node/3835"}},{"id":"ifrs-s1-18","type":"mc","q":"여러 사업부를 가진 회사가 공급망 노동 위험을 한 줄로 합쳐 공시하려 한다. IFRS S1 B29–B30에 따른 판단은?","ref":"IFRS S1 문단 B29–B30, IE13–IE14","why":"B30은 중요한 정보를 가리는 합산을 금지한다. 부속 예시 IE13–IE14는 중앙 기능이 하나로 관리하는 위험은 합산하고, 원인이 다른 사업부는 따로 보여 주는 식으로 설명한다. 반대로 지나친 세분화로 중요 정보를 흐리는 것도 피해야 한다.","trap":"'그룹 전체 수치 하나면 충분하다'는 생각이 흔하다. 투자자가 어느 사업이 위험한지 알 수 없다면 합산이 정보를 가린 것이다.","options":["성격이 같고 하나의 중앙 기능이 관리하면 합산할 수 있지만, 원인·영향이 다른 사업부의 정보를 합쳐 중요한 정보를 가리게 되면 합산할 수 없다","항상 회사 전체로 합산해 공시해야 한다","항상 사업부별로 쪼개 공시해야 한다","합산 여부는 보고서 분량에 맞춰 정한다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-19","type":"mc","q":"회사가 '경쟁사에 알려지면 손해'라는 이유로 특정 기후 관련 '위험' 정보를 빼려 한다. IFRS S1 B34–B37에 따른 판단은?","ref":"IFRS S1 문단 B34–B37","why":"B34는 상업적으로 민감한 '기회' 정보에만 예외를 둔다. B35의 세 조건(아직 공개되지 않았고, 공개가 경제적 이익을 심각하게 해칠 것으로 합리적으로 예상되며, 합산 등 다른 방법으로도 목적을 달성할 수 없음)을 모두 충족해야 하고, B36은 예외 사용 사실의 공시와 매 보고일 재평가를, B37은 위험 정보나 광범위한 비공시에 쓰는 것을 금지한다.","trap":"'민감하다'는 느낌만으로 빼면 준수 선언을 할 수 없다. 조건 셋을 문서로 입증하고, 예외를 썼다는 사실 자체는 공시해야 한다.","options":["불가능하다. 이 예외는 '기회' 정보에만 쓸 수 있고, 위험 정보나 넓은 범위의 비공시 근거로는 쓸 수 없다","가능하다. 상업적으로 민감하면 위험·기회 모두 뺄 수 있다","가능하다. 이사회 결의만 있으면 된다","가능하다. 대신 제3자 인증을 받아야 한다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-21","type":"judge","q":"현대자동차 2026 보고서는 IFRS S1·S2(또는 KSSB 기준)에 대한 명시적이고 유보 없는 준수 선언을 하고 있는가?","ref":"IFRS S1 문단 72","why":"보고서는 GRI 기준에 따라 작성하고 TCFD·SASB 가이드라인을 '반영'했다고만 적는다. IFRS S1·S2나 KSSB 기준에 대한 준수 선언 문구는 없다. TCFD 반영은 S1 문단 72가 요구하는 수준의 선언이 아니다.","trap":"'TCFD Index가 있으니 ISSB 준수'라고 판단하면 틀린다. 준수 선언은 모든 요구사항 충족을 전제로 한 별도의 명시적 문장이어야 한다.","options":["있음","일부","없음"],"ans":2,"quote":"보고 기준 GRI Standards, TCFD, SASB","page":162,"co":"hyundai","look":"162쪽 '보고서 개요' 오른쪽 표 '보고 기준'","src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s1-27","type":"mc","q":"후배 컨설턴트가 '2025년 12월 ISSB 개정으로 IFRS S1도 2027년부터 바뀐다'고 고객에게 안내했다. 바른 정정은?","ref":"ISSB IFRS S2 개정(2025.12) 완료 프로젝트 페이지","why":"ifrs.org 완료 프로젝트 페이지는 2025년 12월 ISSB가 IFRS S2의 특정 온실가스 공시 요구사항 적용을 돕기 위한 개정을 냈고, 2027년 1월 1일 이후 개시 회계연도부터 시행하며 조기적용을 허용한다고 밝힌다. 함께 SASB 기준의 금융배출량 지표가 후속 수정되었다. S1에 대한 개정은 언급되지 않는다.","trap":"S1 기준서 페이지 머리말에 '2026 Issued'라고 표시된 것을 보고 S1이 개정되었다고 오해할 수 있다. 본문 발행일은 2023년 6월이고, 2025–2026년 S1 관련 변화는 교육자료 추가다.","options":["2025년 12월 개정은 IFRS S2의 온실가스 배출량 공시 요구사항을 손질한 것(및 SASB 기준의 후속 수정)이며, 2027년 1월 1일 이후 개시 회계연도부터 적용하고 조기적용이 가능하다. S1 본문은 개정되지 않았다","맞다. S1과 S2가 함께 전면 개정되었다","개정은 2026년 1월 1일부터 의무 적용되며 조기적용은 불가능하다","개정은 ESRS와의 통합 기준서를 새로 만든 것이다"],"ans":0,"src":{"label":"ISSB: IFRS S2 온실가스 공시 개정 (2025.12)","url":"https://www.ifrs.org/projects/completed-projects/2025/amendments-to-disclosure-of-greenhouse-gas-emissions-s2/"}},{"id":"ifrs-s1-30","type":"mc","q":"자원이 충분한 대기업이 '기후 위험의 예상 재무효과를 정량화할 전문 인력이 없다'며 금액 공시를 모두 생략하고 설명도 붙이지 않았다. IFRS S1 문단 38–40과 2025년 8월 교육자료에 따른 판단은?","ref":"IFRS S1 문단 38–40 · ISSB 교육자료(2025.8)","why":"문단 38은 효과를 따로 식별할 수 없거나 측정 불확실성이 너무 높을 때, 문단 39는 예상 효과에 한해 기술·역량·자원이 없을 때 정량 공시를 면제한다. 교육자료는 39의 완화가 자원 있는 회사의 초기 몇 해에 주로 해당하며, 역량을 개발할 자원이 있으면 회피 수단으로 쓸 수 없다고 본다. 문단 40은 대체 공시(이유, 정성 정보와 영향받는 항목, 결합 효과)를 요구하고, 금액은 단일 값 또는 범위로 낼 수 있다.","trap":"'정량 불가 → 공백'이 가장 흔한 실수다. 정량을 못 내면 더 많은 설명을 내야 한다.","options":["문단 39의 역량 부족 완화는 쓸 수 있어도, 역량을 갖출 자원이 있는 회사는 이를 회피 수단으로 쓸 수 없다. 또 생략 시 문단 40에 따라 이유 설명, 영향받을 재무제표 항목 식별 등 정성 정보, 유용하지 않다고 판단하지 않는 한 결합 효과의 정량 정보를 내야 한다","인력이 없다는 사유만 적으면 모든 재무효과 공시가 면제된다","재무효과는 항상 단일 금액으로 정량 공시해야 하므로 어떤 완화도 없다","정성 정보만 내면 되고 재무제표 항목은 특정하지 않아도 된다"],"ans":0,"src":{"label":"UK SRS S1 공개초안(2025.6, IFRS S1 본문 전재)","url":"https://assets.publishing.service.gov.uk/media/685aded6454906840a44d649/draft_uk_srs_s1_standard_with_amendments.pdf"}},{"id":"ifrs-s2x-01","type":"mc","q":"IFRS S2 문단 6(a)는 기후 위험·기회를 감독하는 기구에 대해 여러 항목을 공시하라고 한다. 다음 중 문단 6(a)가 요구하지 않는 것은?","ref":"IFRS S2 문단 6(a)","why":"문단 6(a)의 다섯 항목은 책임의 근거 문서, 기술·역량 확보 판단 방법, 보고 빈도와 방식, 전략·거래·위험관리 감독 시 고려 방법(절충 포함), 목표 설정·진척 감독과 보상 연계다. 개인의 탄소발자국은 요구 대상이 아니다.","trap":"이사회 구성원 명단과 회의 횟수만 적고 '기술·역량을 어떻게 판단하는지'와 '절충안을 어떻게 고려했는지'를 빼먹는 보고서가 많다.","options":["감독기구가 기후 대응 전략을 감독할 적절한 기술과 역량을 갖췄는지, 또는 키울지 어떻게 판단하는지","감독기구가 기후 위험·기회를 얼마나 자주, 어떻게 보고받는지","감독기구 구성원 개인의 가정 내 탄소발자국 측정 결과","기후 관련 성과지표가 보상정책에 포함되는지 여부"],"ans":2,"src":{"label":"IFRS S2 (2026 issued) ¶6","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-02","type":"mc","q":"IFRS S2 문단 6(b)가 '경영진의 역할'에 대해 공시하라고 하는 내용으로 맞는 것은?","ref":"IFRS S2 문단 6(b)","why":"문단 6(b)는 (i) 역할이 특정 직책·위원회에 위임됐는지와 그 감독 방법, (ii) 경영진이 통제·절차를 쓰는지와 그것이 다른 내부 기능과 어떻게 통합되는지를 묻는다.","trap":"'CEO가 책임진다'는 한 문장으로 끝내고 통제·절차와 내부 통합 방식을 설명하지 않는 경우가 많다.","options":["경영진 전원의 연봉 총액과 기후 성과 보너스 금액","기후 역할이 특정 경영진 직책이나 위원회에 위임되었는지와 그 감독 방법, 그리고 통제·절차를 쓰는지와 다른 내부 기능과의 통합 방식","경영진이 참석한 외부 기후 세미나 목록","경영진이 직접 산정한 Scope 1·2 배출량"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶6(b)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-03","type":"mc","q":"IFRS S2 부록 A 정의에 따를 때, 다음 중 '만성(chronic) 물리적 위험'에 해당하는 것은?","ref":"IFRS S2 문단 10(b), 부록 A","why":"물리적 위험은 사건형인 급성 위험(폭풍·홍수·가뭄·열파 등)과 장기 기후 패턴 변화형인 만성 위험(강수·기온 변화로 인한 해수면 상승, 물 가용량 감소 등)으로 나뉜다. 탄소세와 기술 경쟁은 전환 위험이다. 문단 10(b)는 각 위험을 물리적·전환 중 어느 쪽인지 밝히게 한다.","trap":"가뭄이나 폭염을 '장기 현상'이라며 만성 위험으로만 분류하기 쉬운데, 부록 A는 가뭄·열파 같은 사건을 급성 위험 예시로 든다.","options":["태풍으로 공장 지붕이 파손되는 것","강수 패턴과 기온의 장기적 변화로 물 가용량이 줄어드는 것","탄소세 도입으로 연료비가 오르는 것","저탄소 기술 경쟁에서 밀려 시장점유율이 떨어지는 것"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) Appendix A","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-04","type":"mc","q":"IFRS S2 문단 13(b)는 기후 위험·기회가 어디에 '집중'되어 있는지 공시하라고 한다. 기준이 예로 드는 집중 단위는?","ref":"IFRS S2 문단 13","why":"문단 13은 (a) 사업모형과 가치사슬에 미치는 현재·예상 영향과 (b) 위험·기회가 지리적 지역, 시설, 자산 유형 등 어디에 집중되는지를 설명하게 한다.","trap":"집중 위치를 '글로벌 전 사업장'처럼 넓게만 쓰면 요구를 충족하기 어렵다. 어느 지역·어느 공장·어떤 자산인지 특정해야 한다.","options":["지리적 지역, 시설, 자산 유형","주주 구성, 채권자, 신용등급","회계 계정과목, 세무 관할, 감사인","직원 수, 노조 가입률, 평균 근속연수"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶13","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-05","type":"mc","q":"IFRS S2에서 '기후 관련 전환계획(transition plan)'은 어떻게 다뤄지는가?","ref":"IFRS S2 문단 14(a)(iv), 부록 A","why":"문단 14(a)(iv)는 회사가 가진 전환계획과 그 핵심 가정·의존요소를 공시하게 한다. IFRS 재단은 2025년 6월 전환계획 공시 지침을 내면서 'IFRS S2는 전환계획을 가질 것을 요구하지 않는다'고 명확히 했다. 부록 A는 전환계획을 저탄소 경제로의 전환을 위한 목표·행동·자원을 담은 전략의 한 부분으로 정의한다.","trap":"전환계획이 없으면 공시 위반이라고 고객에게 말하는 것은 잘못이다. 다만 목표를 어떻게 달성할지(14(a)(v))는 어차피 써야 한다.","options":["모든 기업이 전환계획을 수립해 제출하는 것이 의무다","전환계획을 가지라고 요구하지는 않지만, 가지고 있다면 핵심 가정과 의존요소를 포함해 공시해야 한다","금융기관만 전환계획을 공시한다","전환계획은 IFRS S1에서만 다루고 S2에는 관련 요구가 없다"],"ans":1,"src":{"label":"IFRS Foundation news 2025-06-23","url":"https://www.ifrs.org/news-and-events/news/2025/06/ifrs-publishes-guidance-disclosures-transition-plans/"}},{"id":"ifrs-s2x-06","type":"mc","q":"IFRS S2 문단 22는 전략과 사업모형의 '기후 회복력'을 평가할 때 어떤 방법을 쓰라고 하는가?","ref":"IFRS S2 문단 22, 부록 A","why":"문단 22는 회사 상황에 맞는(commensurate) 기후 관련 시나리오 분석을 사용해 회복력을 평가하고, 평가 결과와 분석 방법을 공시하라고 한다. 회복력은 기후 변화·불확실성에 적응할 수 있는 능력으로 정의된다.","trap":"시나리오 분석 결과표만 넣고, 그 결과가 전략에 주는 함의와 단·중·장기 조정 능력(22(a))을 쓰지 않는 보고서가 많다.","options":["외부 신용평가기관의 ESG 등급","회사 상황에 맞는 기후 관련 시나리오 분석","과거 10년간 재해 손실액의 단순 평균","경쟁사 보고서와의 비교"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶22, Appendix A","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-07","type":"mc","q":"IFRS S2 문단 29(e) '자본 배치(capital deployment)' 지표로 공시해야 하는 것은?","ref":"IFRS S2 문단 29(e)","why":"29(e)는 기후 위험·기회에 투입(deployed)된 자본적 지출·금융·투자 금액을 묻는다. 29(b)~(d)가 '금액과 비율'을 함께 요구하는 것과 달리 29(e)는 금액이다.","trap":"배출권 구매비만 자본 배치로 적는 경우가 있다. 전동화 설비 투자, 재생에너지 PPA 관련 투자 등 기회 쪽 투자도 포함된다.","options":["기후 위험·기회에 투입한 자본적 지출, 금융 또는 투자의 금액","회사 전체 자본적 지출의 전년 대비 증가율","ESG 펀드가 보유한 자사 주식 비율","탄소배출권 매입에 쓴 금액만"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶29(b)–(e)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-09","type":"mc","q":"한 회사는 기후·물·인권 등 지속가능성 이슈를 하나의 ESG위원회가 통합 감독한다. IFRS S2 문단 7에 따른 올바른 처리는?","ref":"IFRS S2 문단 7","why":"문단 7은 IFRS S1에 따라 불필요한 중복을 피하도록 하며, 지속가능성 감독이 통합 운영되면 위험·기회별로 쪼개지 않고 통합 거버넌스 공시를 할 수 있다고 한다. 단, 문단 6의 요구 정보는 그대로 제공해야 한다.","trap":"'통합 공시 허용'을 '기후 거버넌스 내용 축소 허용'으로 오해하기 쉽다. 요구 항목은 그대로다.","options":["기후만 따로 떼어 별도의 거버넌스 장을 반드시 작성해야 한다","IFRS S1에 따라 중복을 피하기 위해 통합된 거버넌스 공시를 제공할 수 있지만, 문단 6의 정보는 여전히 담아야 한다","통합 감독이면 거버넌스 공시를 생략할 수 있다","기후 거버넌스는 재무제표 주석으로만 공시한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶7","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-10","type":"mc","q":"IFRS S2에서 단기·중기·장기의 시간 범위는 어떻게 정해지는가?","ref":"IFRS S2 문단 10(c)(d)","why":"문단 10(c)는 각 위험·기회가 단·중·장기 중 언제 발생할 수 있는지, 10(d)는 회사가 단·중·장기를 어떻게 정의하고 그 정의가 전략적 의사결정용 기획 기간과 어떻게 연결되는지 설명하게 한다. 기준은 연수를 고정하지 않는다.","trap":"연수만 표로 적고 '왜 이 구간인지, 회사 중장기 사업계획과 어떻게 맞물리는지'를 빠뜨리는 경우가 흔하다.","options":["기준이 단기 1년, 중기 5년, 장기 10년으로 고정한다","회사가 스스로 정의하되, 그 정의 방법과 전략적 의사결정에 쓰는 기획 기간과의 연결을 설명해야 한다","각국 감독당국이 매년 고시한다","TCFD가 정한 3·5·10년을 그대로 써야 한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶10","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-11","type":"mc","q":"IFRS S2 문단 11은 기후 위험·기회를 식별할 때 '합리적이고 뒷받침 가능한 정보(reasonable and supportable information)'를 쓰라고 한다. 이 정보에 포함되는 것은?","ref":"IFRS S2 문단 11","why":"문단 11은 보고일에 과도한 비용·노력 없이 이용 가능한 모든 합리적이고 뒷받침 가능한 정보를 쓰라고 하며, 여기에는 과거 사건, 현재 상황, 미래 상황 전망이 포함된다. 정량·정성, 내부·외부 정보가 모두 해당한다(B9).","trap":"'뒷받침 가능'을 '검증된 숫자'로 좁게 해석해 정성 정보나 외부 전망을 제외하는 실수가 있다.","options":["과거 사건, 현재 상황, 미래 전망에 관한 정보로서 보고일에 과도한 비용·노력 없이 얻을 수 있는 것","감사인이 서면으로 확인한 정보만","정부 공식 통계만","회사 내부에서 만든 정량 데이터만"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶11, B9","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-12","type":"mc","q":"한 회사가 지난해 보고서에 '2030년까지 전 공장 LED 전환' 계획을 공시했다. 올해 IFRS S2 문단 14(c)에 따라 써야 하는 것은?","ref":"IFRS S2 문단 14(c)","why":"문단 14(c)는 이전 보고기간에 공시한 계획에 대한 진척 상황을 정량·정성 정보로 공시하라고 한다. 계획을 공시한 이상 매년 그 이행 정도를 추적해 보여줘야 한다.","trap":"새 계획만 계속 발표하고 과거 계획의 달성률을 추적하지 않는 '목표 갈아타기'는 14(c) 위반 소지가 있다.","options":["계획이 바뀌지 않았으면 아무것도 쓰지 않아도 된다","전기에 공시한 계획 대비 진척 상황을 정량·정성 정보로 공시해야 한다","진척은 5년마다 한 번만 공시한다","계획 달성 후에만 결과를 공시한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶14(c)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-13","type":"mc","q":"IFRS S2 문단 19에 따라 현재 및 예상 재무영향에 대한 정량 정보를 모두 생략할 수 있는 조건은?","ref":"IFRS S2 문단 19","why":"문단 19는 (a) 영향이 분리 식별되지 않거나 (b) 측정 불확실성이 너무 높아 정량 정보가 유용하지 않다고 판단하면 현재·예상 재무영향의 정량 정보를 제공하지 않을 수 있다고 한다.","trap":"'어렵다'는 이유만으로 생략하면 안 된다. 두 조건 중 하나에 해당한다는 판단과 그 이유(¶21(a))를 공시해야 한다.","options":["회사가 상장기업이 아닐 때","영향을 따로 분리해 식별할 수 없거나, 측정 불확실성이 너무 커서 숫자가 유용하지 않을 때","전년도 감사의견이 적정일 때","경쟁사가 아직 숫자를 공시하지 않았을 때"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶19","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-14","type":"mc","q":"회사가 문단 19 또는 20에 따라 정량 재무영향을 생략했다. 문단 21에 따라 반드시 해야 하는 것이 아닌 것은?","ref":"IFRS S2 문단 21","why":"문단 21은 (a) 생략 이유 설명, (b) 영향받을 재무제표 항목·합계·소계를 포함한 정성 정보, (c) 다른 기후 위험·기회·요인과 결합한 재무영향의 정량 정보(유용하지 않다고 판단하면 제외)를 요구한다. 감사인 승인서는 요구사항이 아니다.","trap":"정량을 생략하면서 '어느 계정이 영향받는지'조차 쓰지 않는 경우가 많다. 정성 정보라도 재무제표 항목과 연결해야 한다.","options":["정량 정보를 제공하지 않은 이유 설명","영향받을 가능성이 있는 재무제표 항목(line item)·합계·소계를 포함한 정성 정보 제공","다른 기후 요인과 합친 결합 재무영향의 정량 정보(유용하지 않다고 판단한 경우 제외)","외부 감사인의 생략 승인서 첨부"],"ans":3,"src":{"label":"IFRS S2 (2026 issued) ¶21","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-15","type":"mc","q":"IFRS S2 문단 22(b)(i)에 따른 시나리오 분석 '입력값' 공시에 대해 맞는 설명은?","ref":"IFRS S2 문단 22(b)(i)","why":"22(b)(i)는 사용 시나리오와 출처, 다양한 시나리오 포함 여부, 전환·물리 위험 관련성, 최신 국제 기후협정에 부합하는 시나리오를 사용했는지 여부, 선택 이유, 시간 범위, 사업 범위를 공시하게 한다. 파리협정 정합 시나리오 사용 자체는 의무가 아니라 '여부 공시'다.","trap":"1.5°C 시나리오를 안 쓰면 위반이라고 생각하기 쉽다. 기준은 사용 여부를 투명하게 밝히라는 것이며, B12는 관할권 공약과 일치하는 시나리오를 예시로 들 뿐이다.","options":["최신 국제 기후협정(파리협정)에 부합하는 시나리오를 반드시 사용해야 한다","그런 시나리오를 '사용했는지 여부'를 공시해야 하며, 사용한 시나리오와 출처, 전환·물리 위험 관련성, 선택 이유, 기간, 사업 범위도 함께 공시한다","시나리오 이름만 공시하면 충분하다","시나리오 출처는 기업 비밀로 공시하지 않아도 된다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶22(b), B12","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-16","type":"mc","q":"IFRS S2 문단 25가 기후 위험관리 절차에 대해 요구하는 내용으로 맞는 것은?","ref":"IFRS S2 문단 25(a)(iv), 25(c)","why":"25(a)(iv)는 기후 위험을 다른 유형의 위험 대비 어떻게 우선순위화하는지, 25(c)는 기후 위험·기회 절차가 전사 위험관리 절차에 어느 정도 통합되고 정보를 제공하는지 공시하게 한다. 25(a)(i)~(vi)에는 입력값·변수, 시나리오 분석 사용 여부, 성격·가능성·규모 평가, 모니터링, 전기 대비 변경도 포함된다.","trap":"기후 위험끼리의 순위(예: 탄소가격 > 침수)만 쓰고, 신용·운영·시장 위험 같은 다른 위험과 비교해 어디쯤인지 쓰지 않는 보고서가 많다.","options":["기후 위험을 다른 종류의 위험과 비교해 어떻게 우선순위를 정하는지, 그리고 이 절차가 전사 위험관리에 어느 정도 통합되어 있는지","기후 위험만 별도 위험관리 체계로 분리해 운영하는 것","위험 식별은 외부 컨설팅사가 수행해야 한다는 것","위험 등록부(risk register) 전체를 공개하는 것"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶25","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-17","type":"mc","q":"IFRS S2 문단 32와 'IFRS S2 산업기반 지침(Industry-based Guidance)'의 관계로 맞는 설명은?","ref":"IFRS S2 문단 32, 산업기반 지침","why":"문단 32는 산업별 지표를 공시할 때 산업기반 지침을 참조하고 적용 가능성을 고려하라고 한다. ISSB 자료는 이 지침이 비의무 부록이며, 적용이 ISSB 기준 준수 주장에 필수는 아니라고 설명한다. 지침은 SASB 기준에서 기후 관련 내용이 확인된 68개 산업을 다룬다. ISSB는 2025~2026년 SASB 기준과 이 지침의 정합성을 유지하는 개정을 진행하고 있다.","trap":"'참조·고려'는 무시해도 된다는 뜻이 아니다. 적용하지 않기로 했다면 판단 과정이 있어야 하고, 그래도 산업별 지표 공시 의무(¶32)는 남는다.","options":["지침의 모든 지표를 그대로 공시하는 것이 의무다","지침을 '참조하고 적용 가능성을 고려'하는 것은 의무지만, 지침 적용 자체는 의무가 아니다. 지침은 SASB 기준에서 기후 관련 내용을 가져온 68개 산업용이다","지침은 금융업에만 적용된다","지침은 2025년에 폐지되었다"],"ans":1,"src":{"label":"ISSB — Industry-based guidance: applying ISSB Standards","url":"https://www.ifrs.org/content/dam/ifrs/supporting-implementation/issb-standards/issb-industry-based-guidance-applying-issb-standards.pdf"}},{"id":"ifrs-s2x-18","type":"mc","q":"IFRS S2 B40의 Scope 3 측정 프레임워크가 입력 데이터를 우선순위화할 때 쓰는 네 가지 특성에 해당하지 않는 것은?","ref":"IFRS S2 문단 B40","why":"B40은 특정 입력값을 강제하지 않되, 직접 측정, 가치사슬 특정 활동 데이터, 시의성·대표성, 검증된 데이터의 네 가지 특성을 기준으로 우선순위를 두라고 한다. 낮은 값을 고르는 것은 충실한 표현(B38)에 어긋난다.","trap":"프레임워크를 '1차 데이터 100% 의무'로 오해하는 경우가 있다. 우선순위이지 절대 조건이 아니다.","options":["직접 측정된 데이터","회사 가치사슬 내 특정 활동에서 나온 데이터","시의성이 있고 보고기간을 대표하는 데이터","가장 낮은 배출량 값을 주는 데이터"],"ans":3,"src":{"label":"IFRS S2 (2026 issued) B38–B40","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-20","type":"mc","q":"IFRS S2 문단 36에 따라 각 온실가스 배출 목표에 대해 공시해야 하는 항목으로 옳게 묶인 것은?","ref":"IFRS S2 문단 36(a)(b)(d)","why":"36(a)는 목표가 포함하는 온실가스, 36(b)는 Scope 1·2·3 중 어느 범위를 포함하는지, 36(d)는 섹터별 탈탄소화 접근법(SDA)으로 도출했는지를 공시하게 한다. 이 외에 총량·순량 구분(36(c))과 탄소크레딧 계획(36(e))도 있다.","trap":"'2045 탄소중립'처럼 한 줄 목표만 쓰고 어떤 가스·어떤 Scope가 포함되는지 밝히지 않으면 36(a)(b)를 충족하지 못한다.","options":["목표가 포함하는 온실가스 종류, Scope 1·2·3 중 포함 범위, 섹터별 탈탄소화 접근법 사용 여부","목표 담당 임원 이름, 목표 발표 기자회견 날짜, 목표 홍보 예산","목표 수립에 쓴 컨설팅사 이름과 계약 금액","경쟁사 목표와의 비교표"],"ans":0,"src":{"label":"IFRS S2 (2026 issued) ¶36","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/
