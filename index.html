issbs2.html"}},{"id":"ifrs-s2x-23","type":"judge","q":"IFRS S2 문단 6(a)(v)는 기후 관련 성과지표가 보상정책에 포함되는지, 어떻게 포함되는지 공시하라고 한다. 현대자동차 보고서 23쪽은 이 요구를 충족하는가?","ref":"IFRS S2 문단 6(a)(v)","why":"대상(CEO·권역본부장·공장장·직원)별 KPI(탄소중립 이행률, RE100 달성률, Scope 1&2 감축량 등)와 금전적 보상(상여금 산정 반영)이 표로 제시돼, 보상정책 포함 여부와 방식이 모두 드러난다.","trap":"'ESG 성과를 평가에 반영한다'는 일반 문구만으로 6(a)(v)를 충족했다고 보기 쉽다. 어떤 지표가 누구의 보상에 어떻게 연결되는지가 있어야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"CEO, 권역본부장, 공장장(생산법인장), 직원(유관 조직)의 성과평가 항목(KPIs)에 기후변화 관련 항목을 포함하고 있으며, 해당 성과평가 결과는 인센티브 및 연봉체계와 연동되어 있습니다.","page":23,"co":"hyundai","look":"23쪽 '보상' 단락과 '기후변화 성과 연계 보상' 표에서 성과평가 항목(KPI)과 인센티브·연봉 연동 서술을 확인한다.","src":{"label":"IFRS S2 (2026 issued) ¶6(a)(v)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-24","type":"judge","q":"IFRS S2 문단 10(d)는 단기·중기·장기를 어떻게 정의하는지와, 그 정의가 전략적 의사결정용 기획 기간과 어떻게 연결되는지 설명하라고 한다. 현대자동차 보고서 23쪽은 이를 충족하는가?","ref":"IFRS S2 문단 10(d)","why":"단·중·장기의 연수 정의(0–3년, 3–10년, 10–25년)는 명확히 제시되어 10(c)의 '언제'는 충족하지만, 이 구간이 회사의 전략기획 기간(중장기 사업계획 주기 등)과 어떻게 연결되는지에 대한 설명은 23쪽에 없다. 따라서 10(d)의 후반부가 빠진 '일부' 충족이다.","trap":"연수 표가 있으면 10(d)가 끝났다고 보기 쉽다. '왜 이 구간인가, 사업계획과 어떻게 연결되는가'까지 써야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"단기(0-3년) 중기(3-10년) 장기(10-25년)","page":23,"co":"hyundai","look":"23쪽 하단 '기후 위험 및 기회 관리 적용기간 및 범위' 표에서 연수 정의와, 그 구간을 왜 택했는지·전략기획과 어떻게 맞물리는지에 대한 설명이 있는지 본다.","src":{"label":"IFRS S2 (2026 issued) ¶10(d)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-25","type":"judge","q":"IFRS S2 문단 25(a)(iv)는 기후 위험을 '다른 종류의 위험과 비교해' 어떻게 우선순위를 정하는지 공시하라고 한다. 현대자동차 보고서 37쪽은 이를 충족하는가?","ref":"IFRS S2 문단 25(a)(iv)","why":"기후 동력요인들 사이의 우선순위(영향도·불확실성·적합성 평가)와 중대성에 따른 CEO·경영위원회·이사회 보고 경로는 설명돼 있으나, 기후 위험을 다른 종류의 전사 위험과 비교해 어떤 순위에 두는지는 37쪽에 서술되어 있지 않다. 식별·평가·모니터링 절차(25(a)(i)(iii)(v))는 비교적 충실하다.","trap":"기후 위험 내부의 우선순위 매트릭스를 25(a)(iv) 충족으로 간주하기 쉽다. 기준은 '다른 유형의 위험 대비(relative to other types of risk)'를 묻는다.","options":["있음","일부","없음"],"ans":1,"quote":"STEEP(Social, Technology, Economic, Environmental, Political) 구분별 동력요인(Driving Forces)을 식별했습니다. 이 중 영향도, 불확실성, 적합성 등을 평가하여 핵심 동력요인을 도출했습니다.","page":37,"co":"hyundai","look":"37쪽 '위험 및 기회 식별 및 평가방법' 단락에서 영향도·불확실성 평가가 기후 요인 간 비교인지, 전사 위험(신용·운영·시장 등)과의 비교인지 확인한다.","src":{"label":"IFRS S2 (2026 issued) ¶25(a)(iv)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-26","type":"mc","q":"한 중견 제조회사가 '정량 분석 인력이 없다'는 이유로 기후 위험이 올해 재무상태·성과에 미친 현재 영향과 미래 예상 영향 모두에 대해 정량 정보를 생략하고, 이유만 한 줄 적었다. 올바른 처리는?","ref":"IFRS S2 문단 19–21","why":"¶19의 두 조건(분리 식별 불가, 과도한 측정 불확실성)은 현재·예상 영향 모두에 적용되지만, ¶20의 기술·역량·자원 부족 사유는 예상 영향에만 적용된다. 어느 경우든 ¶21에 따라 이유 설명, 영향받을 항목·합계를 포함한 정성 정보, 가능하면 결합 재무영향 정량 정보를 제공해야 한다.","trap":"'역량 부족'을 만능 면제 사유로 쓰는 것이 가장 흔한 실수다. 이번 기간에 이미 발생한 탄소비용·재해 손실 같은 현재 영향은 역량 부족을 이유로 생략할 수 없다.","options":["기술·역량·자원 부족 사유는 두 영향 모두에 적용되므로 처리가 맞다","기술·역량·자원 부족 사유(¶20)는 '예상 영향'에만 쓸 수 있다. 현재 영향은 분리 식별 불가 또는 높은 측정 불확실성(¶19)에 해당해야 생략할 수 있고, 생략 시 ¶21에 따라 영향받을 재무제표 항목 등 정성 정보도 제공해야 한다","중견기업은 재무영향 공시 전체가 면제된다","현재 영향만 생략 가능하고 예상 영향은 반드시 숫자로 내야 한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶19–21","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-27","type":"mc","q":"한 회사는 2년 전 IEA 시나리오로 정량 시나리오 분석을 수행했고, 전략기획 주기는 5년이다. 올해 보고서에서 담당자가 '새 분석을 안 했으니 회복력 관련 공시를 통째로 전년도 문구로 복사하겠다'고 한다. 맞는 처리는?","ref":"IFRS S2 문단 22, B18","why":"B18은 시나리오 분석을 최소 전략기획 주기에 맞춰 갱신하도록 하면서도, 회복력 평가는 매년(각 보고일에) 수행하도록 한다. 새 분석이 없는 해에는 22(b)의 방법 공시가 전년과 같을 수 있지만, 22(a)의 평가 결과는 그해 상황(새 투자·규제 변화 등)을 반영해 갱신해야 하고, 분석이 수행된 보고기간을 밝혀야 한다.","trap":"'분석 갱신'과 '평가 갱신'을 같은 것으로 보는 실수다. 분석은 몇 년에 한 번일 수 있지만 평가와 공시는 매년이다.","options":["시나리오 분석은 매년 새로 수행해야 하므로 올해 다시 분석해야 한다","시나리오 분석 자체는 최소 전략기획 주기에 맞춰 갱신하면 되지만, 회복력 평가(¶22(a))는 매 보고일에 수행·갱신해야 하고, 분석을 수행한 보고기간(¶22(b)(iii))을 밝혀야 한다","5년마다 한 번 분석하면 그 사이에는 회복력 공시 전체를 생략할 수 있다","시나리오 분석은 최초 1회만 하면 영구히 유효하다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶22, B18","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-28","type":"mc","q":"석탄 화력 비중이 큰 대형 발전회사가 사내 리스크 분석팀과 충분한 예산을 갖고 있다. 담당자는 '기준이 상황에 맞게(commensurate) 하라고 했으니 정성적 서술 시나리오만 쓰겠다'고 한다. 맞는 판단은?","ref":"IFRS S2 문단 B1–B4, B17","why":"B2는 '상황'을 기후 위험·기회 노출 정도와 보유 기술·역량·자원으로 정의하고, B4는 노출이 클수록 정량적·기술적으로 정교한 접근이 필요할 가능성이 높다고 한다. B17은 노출이 크고 기술·자원에 접근할 수 있는 회사는 더 고급 정량 접근을 적용해야 한다고 명시한다. B15도 정량 정보가 보통 더 견고한 평가를 준다고 한다.","trap":"'비례성(proportionality)'을 '덜 해도 된다'는 쪽으로만 읽는 실수다. 노출이 크고 자원이 있으면 비례성은 '더 많이 하라'는 방향으로 작동한다.","options":["'상황에 맞게'는 회사 재량이므로 정성 서술만으로 충분하다","기후 위험 노출이 크고 필요한 기술·자원을 갖춘 회사는 더 고급의 정량적 시나리오 분석을 적용해야 한다(B17). 정성적 접근은 노출이 작거나 자원이 부족한 회사의 초기 단계에 적합하다","발전회사는 시나리오 분석이 면제된다","정량 분석은 금융기관에만 요구된다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) B1–B17","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-29","type":"mc","q":"한 은행이 2025년 12월 IFRS S2 개정을 조기 적용해 Scope 3 Category 15를 금융배출량으로 한정하고 파생상품 관련 배출을 제외하려 한다. 맞는 처리는?","ref":"IFRS S2 문단 29A–29C (2025년 12월 개정)","why":"2025년 12월 11일 발표된 개정은 Category 15를 대출·프로젝트파이낸스·채권·주식·미인출약정(자산운용은 운용자산 포함)에 귀속되는 금융배출량으로 한정하고 파생상품 귀속 배출을 제외하는 것을 허용한다. 사용 시 파생상품으로 취급한 것과 제외한 금융활동을 설명해야 하고, Category 15 포함 시 총량과 금융배출량 소계를 공시해야 한다. 2027년 1월 1일 이후 시작 보고기간부터 발효하며 조기 적용이 허용된다.","trap":"노출초안에 있던 '제외 금액의 정량 공시'는 최종안에서 삭제됐다. 반대로 '설명 의무'까지 없다고 생각하면 틀린다.","options":["개정은 2027년 1월 1일 이후 시작하는 보고기간부터만 적용 가능하고 조기 적용은 금지된다","한정·제외는 허용되며(¶29A), 무엇을 파생상품으로 봤는지와 Category 15에서 제외한 금융활동을 설명해야 하고(¶29B), Category 15를 포함했다면 Category 15 총량과 그 안의 금융배출량 소계를 공시해야 한다(¶29C). 조기 적용은 허용된다","파생상품 제외는 가능하지만 별도 설명 없이 조용히 빼면 된다","금융배출량 한정은 자산운용사에만 허용된다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶29A–29C","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-31","type":"mc","q":"한 식품회사가 ¶29(c) '물리적 위험에 취약한 자산 금액·비율'을 공시하면서, 분모는 재무제표 유형자산 장부금액을 쓰고 분자(침수 위험 공장 가치)는 보험사의 재조달가액 평가를 썼다. 또 어떤 시간 범위 기준으로 '취약'을 판단했는지는 쓰지 않았다. 맞는 지적은?","ref":"IFRS S2 문단 29(c), 30, B65","why":"¶29(c)는 물리적 위험에 취약한 자산·사업활동의 금액과 비율을 요구하고, ¶30은 합리적이고 뒷받침 가능한 정보를 쓰라고 한다. B65는 이 지표 작성 시 ¶10의 시간 범위, ¶13의 집중 위치, ¶16(a)(b)의 재무영향, ¶32의 산업별 지표로 충족 가능성, 그리고 관련 재무제표와의 연계(일관된 데이터·가정 사용)를 고려하라고 한다.","trap":"지표 장을 재무팀과 따로 만들어 장부금액과 평가액이 섞이는 경우가 많다. IFRS S1·S2의 핵심은 재무제표와의 연결성이다.","options":["기준이 산식을 정하지 않으므로 아무 문제가 없다","B65는 이 지표를 만들 때 재무제표와 일관된 데이터·가정을 쓰고(연계성), 단·중·장기 정의(¶10)와 집중 위치(¶13), 재무영향(¶16)과 연결하도록 한다. 분자·분모의 평가 기준 불일치와 시간 범위 미기재는 보완이 필요하다","29(c)는 비율만 공시하면 되고 금액은 필요 없다","물리적 위험 취약 자산은 보험 가입 자산만 포함한다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶29–31, B64–B65","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ifrs-s2x-32","type":"mc","q":"한 정유회사가 시나리오 분석에서 특정 정제설비의 손상 가능성을 확인했지만, 재무영향 공시에는 '장기적으로 전환 위험이 있다'고만 썼다. IFRS S2 문단 16(b) 관점에서 보완해야 할 것은?","ref":"IFRS S2 문단 16(b)","why":"¶16(b)는 다음 연차 보고기간 내에 재무제표에 보고된 자산·부채의 장부금액에 중요한 조정을 초래할 상당한 위험이 있는 기후 위험·기회를 공시하게 한다. 시나리오 분석 결과와 재무제표의 손상 검토를 연결해, 어떤 자산이 어떤 위험에 노출됐는지 쓰는 것이 핵심이다.","trap":"'장기 위험'이라는 표현으로 뭉개는 것이다. 16(b)는 특히 '향후 1년 내' 장부금액 조정 가능성이라는 짧은 시간축을 묻는다.","options":["보완 불필요. 손상 여부는 회계기준(IAS 36)만의 문제다","다음 연차 보고기간 안에 자산·부채 장부금액에 중요한 조정이 생길 상당한 위험이 있는 기후 위험·기회를 식별해 정량·정성으로 공시해야 한다","손상 금액을 확정하기 전까지는 어떤 언급도 하면 안 된다","16(b)는 금융기관의 대출자산에만 적용된다"],"ans":1,"src":{"label":"IFRS S2 (2026 issued) ¶16(b)","url":"https://www.ifrs.org/content/dam/ifrs/publications/html-standards-issb/english/2026/issued/issbs2.html"}},{"id":"ghgp-01","type":"mc","q":"한 회사가 해외 소규모 창고 세 곳의 연료 사용 배출을 인벤토리에서 빼면서, 보고서에 그 사실과 이유를 적었다. 이 처리와 가장 직접 관련된 GHG 프로토콜 원칙은 무엇인가?","ref":"GHG 프로토콜 기업 표준 1장 (원칙)","why":"완전성 원칙은 경계 안의 모든 배출원을 넣는 것이 기본이고, 어쩔 수 없이 빼는 것이 있으면 '무엇을, 왜' 뺐는지 밝히라고 한다. 제외 자체를 금지하는 것이 아니라 투명한 제외를 요구한다.","trap":"초보자는 작은 배출원 제외를 '정확성'이나 '관련성' 문제로 보기 쉽지만, 표준은 제외의 공개·정당화를 완전성 원칙 아래 둔다.","options":["관련성 — 이용자의 판단에 필요한 정보만 담으면 된다","완전성 — 경계 안의 모든 배출원을 담고, 특정 제외는 밝히고 이유를 대야 한다","일관성 — 매년 같은 창고를 빼면 문제없다","정확성 — 작은 배출원은 정확성에 영향이 없으므로 자유롭게 뺄 수 있다"],"ans":1,"src":{"label":"GHG Protocol Corporate Standard ch.1","url":"https://ghgprotocol.org/sites/default/files/standards/ghg-protocol-revised.pdf"}},{"id":"ghgp-02","type":"mc","q":"GHG 프로토콜 기업 표준에서 '지분 접근법(equity share approach)'으로 조직 경계를 정하면 어떤 배출을 자기 것으로 세는가?","ref":"GHG 프로토콜 기업 표준 3장","why":"지분 접근법은 경제적 이익의 비율, 보통은 지분율대로 배출을 나눠 센다. 100% 또는 0%로 세는 것은 통제 접근법이다.","trap":"재무제표의 연결 범위(100% 연결)와 지분법 회계를 섞어 생각하면 틀린다. 지분 접근법은 재무 연결과 달리 지분율 비례로만 센다.","options":["운영 정책을 좌우하는 사업의 배출 100%","재무 정책을 좌우하는 사업의 배출 100%","각 사업에 가진 지분율(경제적 이익 비율)만큼의 배출","연결재무제표에 들어가는 자회사의 배출 100%와 관계회사 배출 50%"],"ans":2,"src":{"label":"GHG Protocol Corporate Standard ch.3","url":"https://ghgprotocol.org/sites/default/files/standards/ghg-protocol-revised.pdf"}},{"id":"ghgp-05","type":"mc","q":"회사가 전기를 구매해 쓴다. 다음 중 Scope 2가 아니라 Scope 3 Cat 3(연료·에너지 관련 활동)에 들어가는 배출은 무엇인가?","ref":"Scope 3 기술 지침 Cat 3 표 3.1","why":"구매 전기의 발전 연소 배출은 Scope 2이고, 그 연료를 캐고 운반하는 상류 배출과 송배전 손실분의 발전 배출은 Cat 3로 '최종 사용자'가 보고한다. 자기 설비·차량의 연료 연소는 Scope 1이다.","trap":"T&D 손실을 Scope 2에 더해 버리거나, 반대로 발전 배출 자체를 Cat 3에 넣어 이중 계산하는 실수가 흔하다. Cat 3는 'Scope 1·2에 아직 안 들어간' 에너지 관련 배출만 담는다.","options":["구매한 전기를 발전소에서 만들 때 나온 연소 배출","송배전 과정에서 손실된 전기를 만들 때 나온 배출(T&D 손실)","회사 보일러에서 LNG를 태울 때 나온 배출","회사 소유 차량이 쓴 경유의 연소 배출"],"ans":1,"src":{"label":"Scope 3 Technical Guidance Cat 3","url":"https://ghgprotocol.org/sites/default/files/standards/Scope3_Calculation_Guidance_0.pdf"}},{"id":"ghgp-07","type":"mc","q":"2015년 Scope 2 지침에 따라 지역 기반과 시장 기반 두 방법으로 모두 보고해야(shall) 하는 회사는 어떤 회사인가?","ref":"GHG 프로토콜 Scope 2 지침 (이중 보고 요건)","why":"이중 보고 의무는 '재생에너지를 샀는지'가 아니라 '시장에 계약 수단 정보가 있는지'로 정해진다. 재생에너지를 전혀 사지 않아도 공급사 계수나 잔여 믹스가 있는 시장이면 두 숫자를 다 내야 한다.","trap":"'우리는 REC를 안 샀으니 지역 기반 하나만 내면 된다'는 판단이 가장 흔한 오류다. 계약 정보가 없으면 시장 기반 숫자에 잔여 믹스나 지역 평균 계수를 쓰면 된다.","options":["재생에너지 인증서(REC)를 실제로 구매한 회사만","계약 수단(공급사 배출계수·인증서 등) 정보가 제공되는 시장에서 사업을 하는 모든 회사","연간 전력 사용량이 1GWh를 넘는 회사만","상장회사만"],"ans":1,"src":{"label":"GHG Protocol Scope 2 Guidance Executive Summary","url":"https://ghgprotocol.org/sites/default/files/Scope2_ExecSum_Final.pdf"}},{"id":"ghgp-10","type":"mc","q":"한 회사가 보고연도 7월 1일에 다른 회사의 공장을 인수했다. 이 인수가 유의성 기준을 넘는다면, 기준연도와 당해연도 배출량은 어떻게 처리해야 하는가?","ref":"GHG 프로토콜 기업 표준 5장","why":"연중 구조 변화가 있으면 기준연도와 당해연도 모두 '1년 전체'로 재산정하라고 권고한다. 그래야 다음 해에 또 재산정하는 일을 피하고 비교 일관성이 유지된다.","trap":"회계처럼 인수 시점 이후 기간만 더하면 기준연도와 당해연도의 경계가 어긋나 감축률이 왜곡된다.","options":["기준연도는 그대로 두고, 당해연도에는 7~12월 배출만 더한다","기준연도와 당해연도 모두 그 공장의 '1년 전체' 배출을 넣어 재산정한다","기준연도만 재산정하고 당해연도는 7~12월 배출만 넣는다","다음 연도부터 반영하고 당해연도는 반영하지 않는다"],"ans":1,"src":{"label":"GHG Protocol Corporate Standard ch.5","url":"https://ghgprotocol.org/sites/default/files/standards/ghg-protocol-revised.pdf"}},{"id":"ghgp-12","type":"mc","q":"회사의 동남아 공장이 있는 나라에는 공급사 배출계수도, 공식 잔여 믹스(residual mix)도 없다. 이 공장의 시장 기반 Scope 2는 어떻게 보고해야 하는가?","ref":"GHG 프로토콜 Scope 2 지침 (잔여 믹스)","why":"품질 기준 8은 잔여 믹스가 제공되어야 하되, 없으면 그 '부재를 공개'하라고 한다. 이 경우 지역 평균 계수를 시장 기반 계산에 써도 지침 위반이 아니며, 두 방법 결과가 같아지는 것은 잔여 믹스가 갖춰지기 전의 과도기 현상으로 본다.","trap":"잔여 믹스가 없으니 시장 기반 보고 의무가 사라진다고 보거나, 다른 나라 잔여 믹스를 임의로 가져다 쓰는 것은 모두 틀린 처리다.","options":["시장 기반 숫자를 비워 두고 지역 기반만 보고한다","잔여 믹스가 없다는 사실을 밝히고, 지역 평균(grid average) 배출계수를 시장 기반 계산에 쓴다","인접 국가의 잔여 믹스를 가져다 쓴다","배출계수 0을 적용한다"],"ans":1,"src":{"label":"Top ten questions about Scope 2 Guidance","url":"https://ghgprotocol.org/blog/top-ten-questions-about-scope-2-guidance"}},{"id":"ghgp-14","type":"mc","q":"운영통제 접근법을 쓰는 회사가 영업용 차량 300대를 리스로 빌려 직접 운행한다. 이 차량의 연료 연소 배출은 어디에 보고하는가?","ref":"GHG 프로토콜 Scope 3 FAQ (임차 자산)","why":"통제 접근법에서는 소유하지 않아도 통제하는 자산은 Scope 1·2에 들어간다. Cat 8은 조직 경계 때문에 Scope 1·2에서 빠진 임차 자산만 담는 자리다. 그래서 운영통제를 쓰는 회사의 Cat 8은 대개 0이거나 매우 작고, 그 사실을 밝히면 된다.","trap":"'리스 = 남의 자산 = Scope 3'로 단순화하면 Scope 1이 과소, Cat 8이 과대 계산된다. 먼저 조직 경계(통제 여부)를 보고, 거기서 빠진 것만 Cat 8로 보낸다.","options":["Scope 3 Cat 8(업스트림 임차 자산) — 소유하지 않으므로 항상 Scope 3이다","Scope 1 — 운영통제 접근법에서는 소유 여부가 아니라 통제 여부로 정해지므로 직접 운행하는 리스 차량은 Scope 1이다","Scope 3 Cat 13(다운스트림 임대 자산)","Scope 2 — 외부에서 빌린 자산의 배출은 간접 배출이다"],"ans":1,"src":{"label":"GHG Protocol Scope 3 FAQ","url":"https://ghgprotocol.org/scope-3-frequently-asked-questions"}},{"id":"ghgp-15","type":"mc","q":"의류 회사가 Cat 11(판매된 제품의 사용)을 산정한다. 옷을 세탁·건조할 때 소비자가 쓰는 전기·물 가열 배출은 Scope 3 표준에서 어떻게 다루는가?","ref":"Scope 3 기술 지침 Cat 11 표 11.1","why":"제품이 사용 중 연료·전기를 '직접' 소비하거나 온실가스를 내뿜으면 직접 사용 단계 배출로 필수다. 옷처럼 제품 자체는 에너지를 쓰지 않지만 사용 과정에서 세탁 등으로 에너지가 들어가면 간접 사용 단계 배출로 선택 사항이다.","trap":"자동차·가전은 직접, 의류·식품·세제는 간접이라는 구분을 놓치고 모두 필수로 보거나 모두 빼는 실수가 많다. 간접을 포함할 때는 '선택 포함'임을 밝혀야 비교 가능성이 유지된다.","options":["직접 사용 단계 배출이므로 최소 경계에 포함해 반드시 산정한다","간접 사용 단계 배출이므로 산정은 선택(optional)이며, 포함하면 전형적 사용 프로필을 만들어 계산한다","제품이 에너지를 직접 쓰지 않으므로 Cat 11은 해당 없음으로 처리한다","Cat 12(판매된 제품의 폐기)에 포함한다"],"ans":1,"src":{"label":"Scope 3 Technical Guidance ch.11 (Use of Sold Products)","url":"https://ghgprotocol.org/sites/default/files/standards_supporting/Chapter11.pdf"}},{"id":"ghgp-17","type":"mc","q":"자동차 부품사 A의 Scope 1 배출이 완성차사 B의 Scope 3 Cat 1에도 들어간다. 고객사가 '이중 계산 아니냐'고 묻는다. Scope 3 표준의 입장은?","ref":"GHG 프로토콜 Scope 3 표준 5.1절","why":"Scope 1·2·3는 '한 회사 안에서' 서로 배타적일 뿐, 회사 사이에서는 같은 배출이 한쪽의 Scope 1, 다른 쪽의 Scope 3로 보고되는 것이 설계 의도다. 그래서 여러 회사 Scope 3를 합산하면 안 되고, 감축 '실적·크레딧'을 서로 주장할 때만 이중 주장이 문제가 된다.","trap":"회사 간 이중 계산을 없애려고 Cat 1에서 공급사 Scope 1을 빼면 표준 위반이다. 조심해야 할 것은 '회사 내' 카테고리 간 중복(예: Cat 1과 Cat 2)이다.","options":["이중 계산이므로 B는 A가 보고한 배출을 Cat 1에서 빼야 한다","회사 간에 같은 배출이 여러 번 보고되는 것은 가치사슬 회계에서 정상이며, 다만 여러 회사의 Scope 3를 더해 지역 총량을 구하면 안 된다","A와 B가 합의해 한쪽만 보고해야 한다","B는 Cat 1을 A의 Scope 1을 뺀 Scope 2·3 부분만 보고한다"],"ans":1,"src":{"label":"GHG Protocol Scope 3 Standard §5.1","url":"https://ghgprotocol.org/sites/default/files/standards/Corporate-Value-Chain-Accounting-Reporing-Standard_041613_2.pdf"}},{"id":"ghgp-22","type":"judge","q":"Scope 3 표준은 최소 경계 안의 배출을 빼려면 그 사실과 이유를 밝히라고 한다. 현대자동차 2026 지속가능성 보고서는 Cat 8(임차 자산)을 '-'로 표시했는데, 그 이유를 조직 경계 원칙과 연결해 설명하고 있는가?","ref":"GHG 프로토콜 Scope 3 표준 (제외의 공개·정당화)","why":"운영통제 접근법을 쓰면 직접 운영하는 임차 자산은 Scope 1·2에 들어가므로 Cat 8이 비는 것이 정상이다. 보고서는 그 논리(조직 경계 원칙, 중복 산정 방지)를 명시해 '제외의 공개·정당화' 요건을 충족한다.","trap":"Cat 8이 '-'인 것을 '누락'으로 지적하면 틀린 리뷰다. 먼저 조직 경계 접근법(p.38: 운영통제)을 확인하고 그 논리와 맞는지 보아야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"현대자동차가 임차하여 운영하는 자산에서 발생하는 배출량은 회사의 조직 경계 설정 원칙에 따라 이미 Scope 1 및 Scope 2에 포함되어 있으므로, 중복 산정을 방지하기 위해 본 카테고리에서는 제외하였습니다.","page":40,"co":"hyundai","look":"p.40 '투입변수 및 가정 – Scope 3'의 Category 8 설명","src":{"label":"GHG Protocol Scope 3 FAQ","url":"https://ghgprotocol.org/scope-3-frequently-asked-questions"}},{"id":"ghgp-26","type":"mc","q":"한 제조회사가 운영통제 접근법으로 Scope 1·2를 보고한다. 이 회사는 합작회사 J(지분 45%, 파트너가 운영)와 상장 관계회사 K(지분 20%)를 갖고 있다. Cat 15 처리로 맞는 것은?","ref":"Scope 3 기술 지침 Cat 15","why":"통제 접근법을 쓰면 통제 밖 지분 투자는 Scope 1·2에서 빠지므로 Cat 15에 '피투자회사 Scope 1+2 × 지분율'로 넣는다. Cat 15가 금융기관을 '주로' 겨냥한 것은 맞지만, 투자 자산이 있는 모든 회사에 적용된다. 피투자회사의 Scope 3가 유의하면 포함을 검토해야 한다.","trap":"반대로 지분 접근법을 쓰는 회사는 지분 투자가 이미 Scope 1·2에 지분율로 들어가므로 같은 것을 Cat 15에 또 넣으면 회사 내 이중 계산이다. 조직 경계 접근법에 따라 Cat 15의 내용이 달라진다.","options":["J·K 모두 Scope 1·2에 지분율만큼 넣고 Cat 15는 보고하지 않는다","J·K의 Scope 1+2에 각각 45%·20%를 곱해 Cat 15에 넣고, 유의하면 피투자회사의 Scope 3도 포함을 검토한다","Cat 15는 금융기관 전용이므로 제조회사는 해당 없음으로 표시한다","J는 지분이 45%로 크므로 Scope 1·2에 100% 넣고, K만 Cat 15에 넣는다"],"ans":1,"src":{"label":"Scope 3 Technical Guidance ch.15 (Investments)","url":"https://ghgprotocol.org/sites/default/files/standards_supporting/Chapter15.pdf"}},{"id":"ghgp-27","type":"mc","q":"운영통제 접근법을 쓰는 회사가 본사 건물의 3개 층을 외부 회사에 임대했다. 임차인이 자기 사무실의 전기 계약과 운영을 직접 한다. 이 3개 층의 전기 사용 배출은 임대인 회사의 어디에 보고하는가?","ref":"GHG 프로토콜 Scope 3 FAQ (임대 자산)","why":"통제 접근법에서는 소유해도 운영을 통제하지 않으면 Scope 1·2에서 빠지고, 빌려준 쪽(lessor)이므로 Cat 13에 들어간다. 임차인이 같은 배출을 Scope 2로 보고하는 것은 회사 간 중복으로 허용된다. 현대차도 임대 면적 비율로 Scope 1·2를 할당해 Cat 13을 산정한다.","trap":"'소유 = Scope 1·2'로 보는 것이 가장 흔한 실수다. 통제 접근법은 소유가 아니라 통제를 묻는다. 반대로 임대인이 공용 설비(중앙 냉난방)를 직접 운영하면 그 부분은 임대인의 Scope 1·2다.","options":["Scope 2 — 건물 소유자이므로 건물 전체 전기가 Scope 2다","Scope 3 Cat 13(다운스트림 임대 자산) — 소유하지만 운영을 통제하지 않는 자산의 배출이다","Scope 3 Cat 8(업스트림 임차 자산)","보고하지 않는다 — 임차인이 자기 Scope 2로 보고하므로 이중 계산이다"],"ans":1,"src":{"label":"GHG Protocol Scope 3 FAQ","url":"https://ghgprotocol.org/scope-3-frequently-asked-questions"}},{"id":"ghgp-32","type":"judge","q":"Scope 3 표준은 최소 경계 안의 활동을 빼려면 제외 사실과 이유를 밝히라고 한다. 현대자동차는 2024년 568,043 tCO2e를 보고했던 Cat 9(다운스트림 운송·유통)를 2025년부터 산정하지 않는다. 보고서에 그 제외와 이유가 적혀 있는가?","ref":"GHG 프로토콜 Scope 3 표준 (최소 경계 제외의 공개·정당화)","why":"제외 사실과 이유(시장 구조 차이, 데이터 가용성·신뢰성)가 명시되어 공개 요건은 충족한다. 다만 컨설턴트는 이 제외가 2024년 기준 Scope 3 총량의 약 0.3% 수준이라는 규모 정보와, 데이터 한계가 '산정 불가'가 아니라 '추정 가능'은 아닌지(평균 데이터·지출 기반 등)를 함께 검토·권고해야 한다.","trap":"'제외 사유가 적혀 있으니 끝'으로 보는 것과, 반대로 '최소 경계 제외는 무조건 위반'으로 보는 것 둘 다 틀리다. 표준은 공개·정당화를 조건으로 제외를 허용하되, 특정 카테고리의 선택적 제외가 반복되면 완전성 원칙 문제로 지적한다.","options":["있음","일부","없음"],"ans":0,"quote":"지역별 시장 구조의 차이와 데이터 가용성 및 신뢰성의 한계로 인해, 2025년부터 본 카테고리에 대한 배출량은 산정하지 않습니다.","page":40,"co":"hyundai","look":"p.40 Category 9. 다운스트림 운송 및 유통 설명 (수치는 p.38 표)","src":{"label":"GHG Protocol Scope 3 Standard §5.4","url":"https://ghgprotocol.org/sites/default/files/standards/Corporate-Value-Chain-Accounting-Reporing-Standard_041613_2.pdf"}},{"id":"assurance-01","type":"mc","q":"제한적 보증(limited assurance) 검증의견서의 결론 문장 형태로 맞는 것은?","ref":"ISSA 5000 / ISAE 3000 보증수준 개념","why":"제한적 보증은 질문과 분석 절차 중심으로 증거를 덜 모으므로, 결론도 '잘못되었다고 볼 사항을 발견하지 못했다'는 부정형으로 표현한다. 합리적 보증은 더 많은 증거를 바탕으로 '적정하게 작성되었다'는 긍정형으로 쓴다.","trap":"초급자는 두 결론을 글자 차이로만 보고 같은 뜻으로 읽는다. 부정형은 '확인한 범위에서 문제가 안 보였다'는 뜻이라 보증 강도가 상당히 낮다.","options":["'보고된 배출량이 기준에 따라 적정하게 산정되었다'는 긍정형 문장","'보고된 배출량이 잘못 산정되었다고 볼 사항을 발견하지 못했다'는 부정형 문장","'보고된 배출량이 정확하다는 것을 보증한다'는 단정형 문장","결론 문장 없이 발견사항 목록만 제시"],"ans":1,"src":{"label":"ICPAK – ISSA 5000 Bulletin 1","url":"https://www.icpak.com/wp-content/uploads/2025/10/ISSA-5000-BULLETIN-1.pdf"}},{"id":"assurance-08","type":"mc","q":"국내 배출권거래제 명세서 검증의 일반적인 절차 순서로 맞는 것은?","ref":"한국표준협회 배출권거래제 검증 절차 안내","why":"검증은 사전조사·공평성 검토(착수), 문서검토와 현장평가 계획 수립, 현장평가, 발견된 오류의 시정조치, 검증기관 내부심의를 거쳐 검증보고서를 발행하는 순서로 진행된다. 내부심의는 검증팀과 별개의 검토자가 결론을 다시 보는 단계다.","trap":"현장을 먼저 가고 문서를 나중에 보는 것으로 생각하기 쉽지만, 문서검토 결과를 바탕으로 현장에서 무엇을 볼지 계획을 세운다.","options":["현장평가 → 문서검토 → 착수 → 검증보고서 발행","착수(검증개요 파악) → 문서검토 → 현장평가 → 시정조치 → 내부심의 → 검증보고서 발행","내부심의 → 현장평가 → 문서검토 → 시정조치","검증보고서 발행 → 현장평가 → 시정조치"],"ans":1,"src":{"label":"한국표준협회 – 배출권거래제 검증","url":"https://ksa.or.kr/ksa_kr/881/subview.do"}},{"id":"assurance-12","type":"mc","q":"제한적 보증 수준 검증의 증거 수집 방식에 대한 설명으로 가장 적절한 것은?","ref":"현대자동차 LRQA 검증의견서 Note / ISSA 5000","why":"LRQA 의견서의 주석처럼 제한적 보증은 '사업장에서 원시데이터를 직접 확인하기보다 취합된 데이터에 초점'을 두며, 증거 수집 범위가 합리적 보증보다 작다. ISSA 5000 해설에서도 제한적 보증은 질문과 분석 절차에 더 비중을 둔다고 설명한다.","trap":"'절차는 같고 문구만 다르다'는 오해가 많다. 절차의 성격·시기·범위 자체가 다르고, 그래서 보증 수준이 '현저히 낮다'고 의견서가 직접 밝힌다.","options":["모든 사업장을 방문해 원시 데이터를 전부 재계산한다","사업장의 원시 데이터를 직접 확인하기보다 취합된 데이터에 초점을 두며, 질문과 분석 절차에 더 의존한다","회사 경영진의 서면 확인서만 받으면 충분하다","합리적 보증과 절차는 같고 보고서 문구만 다르다"],"ans":1,"src":{"label":"ICPAK – ISSA 5000 Bulletin 1","url":"https://www.icpak.com/wp-content/uploads/2025/10/ISSA-5000-BULLETIN-1.pdf"}},{"id":"assurance-13","type":"mc","q":"ISSA 5000에서 중요성(materiality)을 다루는 방식으로 맞는 것은?","ref":"ISSA 5000 중요성 요구사항(해설)","why":"ISSA 5000은 정량(숫자) 공시에 대해 검증인이 중요성과 수행 중요성을 결정하도록 하고, 정성(서술) 공시에 대해서는 중요성을 고려하도록 한다. 고정된 %는 없으며, 여러 개의 중요성 기준을 두는 것이 보통이다.","trap":"온실가스 검증 관행인 5%를 '기준이 정한 숫자'로 알면 틀린다. 5%는 예시일 뿐이고, 기준이 요구하는 것은 검증인의 판단과 그 문서화다.","options":["모든 지속가능성 정보에 총배출량 5%라는 단일 기준을 적용한다","정량 공시에는 중요성과 수행 중요성(performance materiality)을 '결정'하고, 정성 공시에는 중요성을 '고려'한다","정성 공시는 중요성 개념을 적용하지 않는다","중요성 기준은 회사가 정해 검증인에게 통보한다"],"ans":1,"src":{"label":"KPMG India – ISSA 5000 Chapter 2","url":"https://assets.kpmg.com/content/dam/kpmgsites/in/pdf/2024/12/chapter-2-issa5000-general-requirements-for-sustainability-assurance-engagements.pdf.coredownload.inline.pdf"}},{"id":"assurance-15","type":"mc","q":"온실가스 명세서 전용 기준인 ISAE 3410의 현재 상태로 맞는 것은?","ref":"IAASB 2025-05-08 발표","why":"IAASB는 2025년 5월 8일 ISAE 3410 철회를 발표했고, 'ISSA 5000이 온실가스 배출량을 포함한 모든 지속가능성 정보의 인증을 다루므로' 철회는 ISSA 5000 발효일부터 적용된다고 밝혔다. 그 전까지는 현대차 LRQA 의견서처럼 ISAE 3000·3410을 쓸 수 있다.","trap":"2026년 발행된 검증의견서에 ISAE 3410이 적혀 있으면 '구기준 사용'으로 지적하기 쉽지만, 2025년 보고기간은 아직 ISSA 5000 의무 적용 전이므로 정상이다.","options":["ISSA 5000과 함께 계속 병행 사용되며 철회 계획이 없다","2024년 11월 ISSA 5000 공표와 동시에 즉시 철회되었다","IAASB가 2025년 5월 철회를 승인했고, 철회는 ISSA 5000 발효일(2026-12-15 이후 시작 기간)부터 효력이 생긴다","ISO 14064-3으로 대체되어 2023년에 철회되었다"],"ans":2,"src":{"label":"IAASB – ISAE 3410 철회 발표","url":"https://www.iaasb.org/news-events/2025-05/iaasb-announces-withdrawal-isae-3410-assurance-engagements-greenhouse-gas-statements"}},{"id":"assurance-16","type":"mc","q":"현대자동차 보고서를 DNV가 'AA1000AS v3 Type 2, 제한적 수준'으로 검증했다. Type 2 업무가 Type 1과 다른 점은?","ref":"AA1000AS v3 / 현대차 DNV 검증의견서","why":"DNV 의견서는 검증 범위를 '보고서에 대한 제한적 검증(원칙 준수)'과 'Scope 1·2 배출량, LTIFR, 원자재 사용량, 육아휴직 등 특정 성과 정보의 신뢰성 검증' 두 축으로 적고 있다. 뒤쪽 축이 Type 2를 Type 1과 구분하는 부분이다.","trap":"Type 1/2(검증 범위)와 제한적/합리적(보증 수준)은 서로 다른 축이다. 'Type 2 = 합리적'으로 외우면 틀린다. 현대차는 Type 2이면서 제한적 수준이다.","options":["Type 2는 4원칙 준수 여부만 보고, Type 1은 성과 데이터까지 본다","Type 2는 4원칙 준수 여부에 더해 '특정 지속가능성 성과 정보의 신뢰성'까지 검토한다","Type 2는 합리적 보증을 뜻하고 Type 1은 제한적 보증을 뜻한다","Type 2는 재무정보까지 검증 범위에 넣는다"],"ans":1,"src":{"label":"AccountAbility – AA1000 Assurance Standard","url":"https://www.accountability.org/standards/aa1000-assurance-standard/"}},{"id":"assurance-17","type":"judge","q":"현대자동차 국내 사업장 온실가스 검증의견서가 명세서 작성 기준과 검증 기준(고시 명칭·번호)을 명시하고 있는지 판단해 보자.","ref":"검증의견서 기본 요소(적용 기준·보증수준 명시)","why":"검증의견서는 어떤 보고기준으로 숫자가 만들어졌고 어떤 검증기준으로 확인했는지를 밝혀야 이용자가 결론의 의미를 해석할 수 있다. 현대차 국내 의견서는 보고 지침과 검증 지침을 고시 번호까지 적고 보증수준도 명시했다.","trap":"고시 번호가 매년 바뀌므로(2025-64호, 2025-165호), 전년도 의견서를 복사해 쓰면 번호가 틀린다. 컨설턴트는 최신 고시 번호를 확인해야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"본 검증은 “온실가스 배출권거래제의 배출량 보고 및 인증에 관한 지침(환경부고시 제 2025-64 호)” 및 “온실가스 배출권거래제 운영을 위한 검증지침(환경부 고시 제 2025-165 호)”의 검증 원칙과 기준에 따라 합리적 보증수준 하에서 수행되었습니다.","page":157,"co":"hyundai","look":"온실가스 검증의견서(국내 사업장)의 '검증 방식' 부분에서 환경부 고시 명칭과 번호, 보증수준이 함께 적혀 있는지 확인한다."},{"id":"assurance-18","type":"judge","q":"현대자동차 해외 법인·Scope 3 검증의견서(LRQA)가 검증 범위에서 빠진 배출원이나 제한사항을 공개하고 있는지 판단해 보자.","ref":"검증의견서의 범위 제한 공개","why":"검증의견서는 '모든 중요 측면에서 … 제한 사항에 의한 영향을 제외하고'라는 식으로 결론을 쓰고, 어떤 배출이 빠졌는지 적어야 한다. LRQA는 연구 법인 시험차량 배출 미보고와, 판매 부문 Scope 3 일부 카테고리가 권역별 본사만 포함된 점을 밝혔다.","trap":"결론 문장만 읽고 '깨끗한 의견'으로 판단하면 놓친다. 제한 사항과 각주가 실제 경계 불일치(boundary mismatch)를 알려주는 자리다.","options":["있음","일부","없음"],"ans":0,"quote":"일부 연구 법인들의 시험 차량 운행으로 인한 온실가스 배출 및 에너지 사용은 보고되지 않았습니다.","page":159,"co":"hyundai","look":"LRQA 의견서의 '로이드인증원의 의견' 아래에 '하기 제한 사항'으로 적힌 문장과, 주석에 적힌 판매 부문 Scope 3 범위 설명을 찾는다."},{"id":"assurance-19","type":"judge","q":"현대자동차 보고서의 LRQA 온실가스 검증의견서가 검증기관의 자격(인정 기준)과 독립성을 진술하고 있는지 판단해 보자.","ref":"ISO 14065 / IESBA 윤리강령 독립성 진술","why":"검증기관은 어떤 인정 요건(ISO 14065 등)과 품질·윤리 기준(ISQC1, IESBA 윤리강령)을 따르는지, 그리고 피검증 회사와 다른 이해관계가 없는지를 의견서에 밝혀야 한다. LRQA는 이 세 가지를 모두 적었다.","trap":"자격 진술이 있다고 끝이 아니다. 같은 보고서에서 DNV는 온실가스 검증과 보고서 검증을 함께 했다고 밝히며 독립성에 영향이 없다고 '판단'했는데, 이런 자기검토 위협 평가가 적혀 있는지도 함께 봐야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"로이드인증원은 현대자동차 주식회사에 대해 본 검증 심사만을 수행하였으므로 독립성 및 공평성에 위배되지 않습니다.","page":160,"co":"hyundai","look":"LRQA 의견서의 '로이드인증원의 자격 및 독립성' 단락에서 ISO 14065, ISO/IEC 17021, ISQC1, IESBA 윤리강령 언급과 독립성 문장을 확인한다."},{"id":"assurance-20","type":"mc","q":"2026년 2월 EU 관보에 공표된 옴니버스 I 지침 이후, CSRD 지속가능성 보고서의 제3자 보증 요건은?","ref":"EU 옴니버스 I 지침(2026/470, OJ 2026-02-26)","why":"원래 CSRD는 제한적 보증으로 시작하고 집행위가 2026년 10월까지 제한적 보증 기준, 2028년 10월까지(타당성 검토 후) 합리적 보증 기준을 채택할 계획이었다. 옴니버스 I(2026년 3월 18일 발효)은 보증 의무를 유지하되 제한적 보증에 머물도록 하고 합리적 보증 요구를 삭제했다. 제한적 보증 기준 채택 시한은 2027년 7월 1일로 미뤄졌다.","trap":"'옴니버스로 보증이 없어졌다'는 과장이 돌지만 틀렸다. 적용 대상 기업(종업원 1,000명 초과 + 매출 4.5억 유로 초과)에는 여전히 제한적 보증이 필요하다.","options":["제3자 보증 의무가 완전히 폐지되었다","제한적 보증으로 시작해 2028년부터 합리적 보증으로 올라가는 원래 계획이 유지된다","제3자 보증 의무는 유지되지만 제한적 보증에 머물며, 합리적 보증으로 올리는 요구는 삭제되었다","처음부터 합리적 보증이 의무화되었다"],"ans":2,"src":{"label":"Arthur Cox – Omnibus I Directive published","url":"https://www.arthurcox.com/insights/omnibus-i-directive-published-revised-scope-and-reduced-obligations-under-csrd-and-csddd/"}},{"id":"assurance-21","type":"mc","q":"2026년 7월 금융위원회 '지속가능성 공시 제도화 방안(최종안)'의 제3자 인증 관련 내용으로 맞는 것은?","ref":"금융위 지속가능성 공시 제도화 방안(최종안) 2026-07-08","why":"최종안은 자본시장법 개정 시 제3자 인증도 제도화하되 '공시 의무화 2년 후인 2030년부터 인증을 의무화할 방침'이라고 했다. 인증 수준(제한적/합리적)과 누가 인증업자가 될지는 국내외 인증 실무가 아직 충분히 쌓이지 않았다는 이유로 뒤에 정하기로 했다.","trap":"회계법인 대 검증기관 논쟁이 언론에 많이 나오지만, 정부 공식 문서는 아직 어느 쪽으로도 정하지 않았다. 고객에게 '회계법인만 가능'이라고 단정해 말하면 안 된다.","options":["공시 의무화 첫해(FY2027)부터 합리적 보증 인증을 의무화한다","인증은 공시 의무화 2년 후인 2030년부터 의무화하고, 인증 범위·수준과 인증업자 진입규제는 자본시장법령 개정 과정에서 구체화한다","인증은 회계법인만 수행하도록 확정했다","인증 의무화 계획은 최종안에서 삭제되었다"],"ans":1,"src":{"label":"금융위원회 보도자료 2026-07-08","url":"https://www.fsc.go.kr/no010101/87280"}},{"id":"assurance-22","type":"mc","q":"LRQA가 현대자동차 2025년 Scope 3 검증에서 '완전성과 정확성 제고'를 권고한 카테고리는?","ref":"현대자동차 LRQA 권고사항","why":"LRQA는 출장(Cat 6)과 출퇴근(Cat 7)에서 '일부 제외된 교통 수단에 대한 모니터링 절차를 개선'하라고 권고했다. 활동 데이터를 전부 모으기 어려운 카테고리에서 완전성(빠진 것 없음) 지적이 나오는 전형적 사례다.","trap":"배출량이 큰 카테고리(Cat 11)에서만 지적이 나올 것으로 생각하기 쉽다. 작은 카테고리라도 수집 체계가 허술하면 '완전성' 지적을 받고, 이는 다음 해 검증에서 다시 확인된다.","options":["Category 1 구매한 상품 및 서비스","Category 11 판매된 제품의 사용","Category 6 출장 및 Category 7 직원 출퇴근(일부 제외된 교통수단 모니터링)","Category 15 투자"],"ans":2},{"id":"assurance-24","type":"mc","q":"한 제조회사가 투자자 요구로 '내년부터 Scope 3 전체를 합리적 보증으로 받겠다'고 한다. 현재 Scope 3는 협력사 설문과 산업평균 계수로 추정하며, 원시 데이터는 본사에 취합된 엑셀만 있다. 컨설턴트의 가장 적절한 조언은?","ref":"ISSA 5000 보증수준별 절차 / LRQA 의견서 Note","why":"합리적 보증은 위험을 충분히 낮은 수준까지 줄여야 하므로 통제 테스트와 원시 자료 확인 등 더 포괄적인 절차가 필요하다. 추정과 산업평균 계수에 의존하는 카테고리는 검증인이 충분한 증거를 얻기 어려워 범위 제한이나 변형 의견이 날 수 있다. 현대차도 Scope 3는 제한적 보증(5%)으로 받았다.","trap":"'보증 수준 = 검증기관이 써 주는 문구'로 보는 고객이 많다. 보증 수준은 회사 데이터의 추적 가능성과 통제 수준이 뒷받침되어야 올릴 수 있다.","options":["합리적 보증은 보고서 문구만 바뀌므로 현재 데이터로 바로 가능하다","합리적 보증은 취합 데이터가 아니라 사업장·공급사 수준의 원시 자료와 통제까지 확인해야 하므로, 먼저 1차 데이터 비중이 높은 카테고리부터 범위를 정하고 데이터 추적 체계를 만든 뒤 단계적으로 올려야 한다","Scope 3는 어떤 기준으로도 합리적 보증이 불가능하다","검증기관을 회계법인으로 바꾸면 자동으로 합리적 보증이 된다"],"ans":1,"src":{"label":"ICPAK – ISSA 5000 Bulletin 1","url":"https://www.icpak.com/wp-content/uploads/2025/10/ISSA-5000-BULLETIN-1.pdf"}},{"id":"assurance-25","type":"mc","q":"12월 결산 회사가 2027년 1월 1일~12월 31일 온실가스 명세서에 대해 2028년 상반기 국제기준 기반 검증을 받으려 한다. ISSA 5000을 채택한 관할에서 검증인이 적용해야 하는 기준은?","ref":"IAASB ISSA 5000 발효 규정·ISAE 3410 철회","why":"FY2027은 2026년 12월 15일 이후 시작하는 기간이므로 ISSA 5000 적용 대상이며, ISAE 3410 철회도 같은 시점부터 효력이 생긴다. IAASB는 ISSA 5000이 '온실가스 배출량을 포함한 모든 지속가능성 정보'를 다룬다고 밝혔다. ISO 14064-3은 별도 체계로 병행될 수 있지만 '국제감사기준 기반' 검증이라면 ISSA 5000이다.","trap":"FY2026(2026-01-01 시작)은 아직 ISAE 3000·3410 적용이 가능하고 ISSA 5000은 조기 적용 선택지다. 보고기간의 '시작일'을 기준으로 판단해야 한다.","options":["ISAE 3410 (온실가스 전용 기준이므로 계속 우선 적용)","ISSA 5000 (2026년 12월 15일 이후 시작하는 기간이므로 적용 대상이고, 같은 시점부터 ISAE 3410은 철회됨)","ISAE 3000(개정) 단독","ISO 14064-3 (국제감사기준은 적용 불가)"],"ans":1,"src":{"label":"IAASB – ISAE 3410 철회 발표","url":"https://www.iaasb.org/news-events/2025-05/iaasb-announces-withdrawal-isae-3410-assurance-engagements-greenhouse-gas-statements"}},{"id":"assurance-26","type":"mc","q":"한 검증법인이 2027년 보고기간 Scope 3 인증을 위해 고객사 주요 협력사(가치사슬 구성요소)에서 직접 절차를 수행하려 한다. IESSA의 가치사슬 관련 독립성 규정(5405·5406절) 적용에 대한 설명으로 맞는 것은?","ref":"IESSA 5405·5406절 발효 유예","why":"IESSA는 2026년 12월 15일 발효되지만, 가치사슬 구성요소에서 수행하는 업무를 다루는 5405·5406절은 2028년 7월까지 발효가 미뤄졌고 그 전 기간에는 경과 규정이 적용된다. 공급사와 검증법인 사이의 이해관계를 파악하는 데 시간이 필요하다는 현실을 반영한 것이다.","trap":"'IESSA 발효 = 모든 조문 발효'로 생각하기 쉽다. 가치사슬 조문만 별도 시점이라는 점이 시험과 실무 모두에서 자주 묻는 예외다.","options":["IESSA 전체가 2026년 12월 15일 발효되므로 5405·5406절도 즉시 전면 적용된다","5405·5406절은 2028년 7월부터 발효되며, 그 전까지는 경과 규정이 적용된다","가치사슬 구성요소에는 어떤 독립성 요건도 적용되지 않는다","5405·5406절은 EU CSRD 대상 기업에만 적용된다"],"ans":1,"src":{"label":"ICAS – IESBA publishes its sustainability standards","url":"https://www.icas.com/news-insights-events/news/ethics/iesba-publishes-its-sustainability-standards"}},{"id":"assurance-28","type":"mc","q":"ESRS(이중 중대성)로 보고하는 EU 자회사의 지속가능성 보고서를 ISSA 5000으로 인증한다. 고객이 '인증은 재무적 중요성 정보만 보면 된다'고 주장한다. 맞는 처리는?","ref":"ISSA 5000 중요성·기준(criteria) 요구사항(해설)","why":"ISSA 5000은 보고 기준이나 회사의 기준이 이중 중대성을 요구하면 검증인이 재무적·영향 두 측면을 모두 고려하도록 한다. 또한 모든 지속가능성 정보에 적합한 기준(criteria)이 있는지, 일관되게 측정·평가될 수 있는지 평가해야 하므로 서술형 공시도 범위에 들어온다. 다만 검증인이 회사 대신 중대성 평가를 수행하는 것은 독립성에 어긋난다.","trap":"IFRS S2(재무적 중요성)에 익숙한 컨설턴트가 ESRS 인증에도 같은 범위를 적용하려 한다. 인증 범위는 '어떤 보고 기준으로 썼는가'에 따라 달라진다.","options":["고객 주장이 맞다. 인증은 투자자용 재무적 중요성 정보에만 적용된다","적용 보고 기준이 이중 중대성을 요구하면 검증인은 재무적 중요성과 영향 중요성 둘 다 고려해야 하며, 서술형 공시도 기준(criteria)에 따라 평가 가능한지 확인해야 한다","영향 중요성 정보는 수치가 아니므로 인증 대상에서 자동 제외된다","검증인이 중대성 평가를 직접 다시 수행해 보고 내용을 정해 준다"],"ans":1,"src":{"label":"KPMG India – ISSA 5000 Chapter 2","url":"https://assets.kpmg.com/content/dam/kpmgsites/in/pdf/2024/12/chapter-2-issa5000-general-requirements-for-sustainability-assurance-engagements.pdf.coredownload.inline.pdf"}},{"id":"assurance-29","type":"mc","q":"한 검증법인이 고객사의 배출량 집계 시스템 통제를 2027년에 테스트했고, 이후 시스템이 바뀌지 않았다. ISSA 5000 아래에서 이 증거를 어떻게 재사용할 수 있는가?","ref":"ISSA 5000 통제 운영 효과성 증거(해설)","why":"ISSA 5000은 전기 업무에서 얻은 통제 운영 효과성 증거를 변경이 없음을 확인한 뒤 재사용할 수 있게 하되, '최소 3번째 업무마다 한 번(at least once in every third engagement)'은 다시 테스트하도록 한다. 재무제표 감사기준(ISA 330)과 같은 논리다.","trap":"'통제가 안 바뀌었으니 증거도 그대로'라는 효율 논리가 매년 반복되면 통제가 실제로 작동하는지 아무도 확인하지 않게 된다. 그래서 상한을 둔다.","options":["시스템이 바뀌지 않았다면 기한 없이 계속 재사용할 수 있다","통제가 변하지 않았음을 확인하더라도 최소 3번째 업무마다 한 번은 다시 테스트해야 한다","전기 증거는 어떤 경우에도 재사용할 수 없다","제한적 보증에서는 통제 테스트가 금지된다"],"ans":1,"src":{"label":"KPMG India – ISSA 5000 Chapter 2","url":"https://assets.kpmg.com/content/dam/kpmgsites/in/pdf/2024/12/chapter-2-issa5000-general-requirements-for-sustainability-assurance-engagements.pdf.coredownload.inline.pdf"}},{"id":"assurance-30","type":"mc","q":"한 회사가 비용 절감을 위해 '온실가스 명세서 검증, 지속가능성 보고서 검증, 그리고 Scope 3 산정 컨설팅'을 모두 같은 검증기관에 맡기려 한다. 컨설턴트의 가장 적절한 판단은?","ref":"IESSA/IESBA 윤리강령 독립성 원칙 / 현대차 DNV 의견서","why":"현대차 보고서에서 DNV는 2025년 온실가스 배출량 검증과 보고서 검증을 함께 수행했음을 밝히고 '독립성이나 공정성에 영향을 미치지 않는다고 판단'한다고 적었다. 두 검증 업무의 병행은 가능하지만 위협 평가와 공개가 필요하다. 반면 자신이 만든 숫자를 자신이 검증하는 것은 IESSA가 다루는 자기검토 위협의 전형이라 검증기관이 맡을 수 없다.","trap":"'한 기관에 몰아주면 싸고 편하다'는 요청을 그대로 받아들이면 나중에 인증 의무화 시점에 검증기관을 교체해야 하는 더 큰 비용이 생긴다.","options":["세 업무 모두 같은 기관이 하면 일관성이 높아져 독립성에도 도움이 된다","온실가스 검증과 보고서 검증을 한 기관이 하는 것은 가능하나 의견서에 독립성 판단을 밝혀야 하고, 자기가 산정한 Scope 3를 스스로 검증하는 것은 자기검토 위협이므로 산정 컨설팅은 다른 곳에 맡겨야 한다","검증기관은 어떤 경우에도 한 회사에 한 가지 업무만 할 수 있다","컨설팅과 검증을 같은 기관이 해도 계약서에 비밀유지 조항만 있으면 문제없다"],"ans":1,"src":{"label":"ICAS – IESBA publishes its sustainability standards","url":"https://www.icas.com/news-insights-events/news/ethics/iesba-publishes-its-sustainability-standards"}},{"id":"physical-02","type":"mc","q":"IFRS S2 부록 A의 정의에 따를 때 '만성 물리적 위험'에 해당하는 것은?","ref":"IFRS S2 부록 A 정의","why":"IFRS S2는 물리적 위험을 사건 중심의 급성 위험(폭풍·홍수·가뭄·폭염)과 장기 기후 패턴 변화에서 오는 만성 위험(해수면 상승, 물 가용성 감소, 생물다양성 손실, 토양 생산성 변화)으로 나눈다. 탄소가격은 전환 위험이다.","trap":"가뭄과 폭염을 만성으로 분류하는 실수가 잦다. IFRS S2 정의문은 가뭄·폭염을 급성 위험의 예로 든다(다만 '장기적 기온 상승 추세'는 만성이다).","options":["태풍으로 공장 지붕이 파손되는 위험","집중호우로 창고가 침수되는 위험","해수면 상승으로 해안 부지의 사용 가능성이 줄어드는 위험","탄소가격 도입으로 비용이 늘어나는 위험"],"ans":2,"src":{"label":"AASB S2 Appendix A (IFRS S2 동일 정의)","url":"https://standards.aasb.gov.au/node/7236"}},{"id":"scenario-03","type":"mc","q":"IFRS S2 부록 A의 정의에 따를 때, 다음 중 '만성(chronic)' 물리 리스크에 해당하는 것은?","ref":"IFRS S2 부록 A 정의","why":"부록 A는 급성 리스크를 폭풍·홍수·가뭄·폭염 같은 '사건 중심' 리스크로, 만성 리스크를 강수·기온 패턴의 장기 변화로 해수면 상승이나 물 가용량 감소를 낳는 리스크로 정의한다. 장기 패턴 변화가 핵심 구분점이다.","trap":"'폭염=만성'이라고 외우는 실수가 있다. 폭염 사건 자체는 급성이고, 평균기온이 장기적으로 오르는 것이 만성이다.","options":["태풍으로 공장 지붕이 파손되는 것","집중호우로 생산라인이 침수되는 것","강수 패턴이 장기적으로 바뀌어 공장 지역의 물 가용량이 줄어드는 것","폭염 사건으로 하루 작업이 중단되는 것"],"ans":2,"src":{"label":"AASB S2 Appendix A (IFRS S2 정의 동일)","url":"https://standards.aasb.gov.au/node/3846"}},{"id":"scenario-09","type":"mc","q":"IFRS S2는 기후 회복력 평가에 어떤 시나리오를 쓰라고 요구하는가?","ref":"IFRS S2 문단 22(b), B11–B13","why":"ISSB 자료는 S2가 '사용할 시나리오를 규정하지 않는다'고 분명히 한다. 대신 문단 22(b)(i)에서 사용 시나리오와 출처, 다양한 범위인지, 전환·물리 관련성, 최신 국제협정 부합 시나리오 사용 여부, 선택 이유, 시간 범위, 적용 사업 범위를 공시하게 한다. B11–B13은 회사 활동·위치에 맞는 합리적 근거가 있으면 된다고 설명한다.","trap":"'최신 국제협정 부합 시나리오를 써야 한다'로 읽는 실수다. 요구는 '썼는지 여부를 밝히는 것'이며, 안 썼으면 안 썼다고 공시하면 된다.","options":["반드시 1.5°C 시나리오와 4°C 시나리오 두 개를 써야 한다","특정 시나리오를 지정하지 않는다. 다만 어떤 시나리오를 어디서 가져왔는지, 전환·물리 중 무엇과 관련되는지, 최신 국제 기후협정에 부합하는 시나리오를 썼는지 여부, 왜 그 시나리오가 적절한지 등을 공시해야 한다","IEA NZE 하나만 쓰면 된다","NGFS 7개 시나리오를 모두 써야 한다"],"ans":1,"src":{"label":"ISSB 웹캐스트 슬라이드: 기후 회복력","url":"https://www.ifrs.org/content/dam/ifrs/supporting-implementation/ifrs-s2/webcast-slides-climate-resilience-scenario-analysis.pdf"}},{"id":"scenario-10","type":"mc","q":"한 회사가 예상 재무영향을 정량으로 내기에 측정 불확실성이 너무 크다고 판단해 IFRS S2 문단 19를 적용하려 한다. 이때 반드시 함께 해야 하는 것은?","ref":"IFRS S2 문단 19–21","why":"문단 19(따로 식별 불가 또는 측정 불확실성 과다)나 20(기술·역량·자원 부족)에 의존하면 문단 21에 따라 (a) 이유 설명, (b) 영향받는 재무제표 항목을 밝힌 정성 정보, (c) 결합 효과의 정량 정보(유용하지 않으면 제외)를 제공해야 한다. 정량 생략은 '면제'가 아니라 '대체 공시'다.","trap":"문단 19·20을 '정량 안 해도 된다'로 끝내는 실수다. 2025년 8월 ISSB 글은 정량 정보가 투자자에게 핵심이며, 정성만으로는 유용성이 떨어진다고 강조한다.","options":["아무 설명 없이 해당 항목을 비워 두면 된다","정량 정보를 내지 않는 이유를 설명하고, 영향받을 재무제표 항목·합계·소계를 짚어 정성 정보를 제공하며, 다른 요인과 합친 결합 효과의 정량 정보는 유용하지 않은 경우가 아니면 제공해야 한다","외부 감사인의 확인서를 첨부해야 한다","다음 연도부터는 반드시 정량으로 공시하겠다고 약속해야 한다"],"ans":1,"src":{"label":"AASB S2 본문 (IFRS S2 동일)","url":"https://standards.aasb.gov.au/node/3844"}},{"id":"scenario-25","type":"judge","q":"IFRS S2 문단 22(b)(ii)는 시나리오 분석의 핵심 가정(기후정책, 거시경제 추세, 지역 변수, 에너지 사용·믹스, 기술 가정 등)을 공시하도록 한다. 현대자동차의 전환 시나리오 분석(배출권거래제 배출부채 추정)은 사용한 핵심 가정을 구체적으로 밝혔는가?","ref":"IFRS S2 문단 22(b)(ii)","why":"무상할당 70%와 '집약도 유지'라는 가정은 밝혔지만, 시나리오별 배출권 가격 전망치, 생산량·판매량 가정, 적용 환율 등 결과를 재현하는 데 필요한 숫자는 없다. 가정의 방향은 알 수 있으나 투자자가 959억–3,318억이라는 폭을 검증할 수는 없으므로 '일부'다.","trap":"'가정'이라는 단어가 한 번 나오면 요건을 채웠다고 보는 실수다. 22(b)(ii)의 취지는 결과를 이해·검증할 수 있을 만큼의 입력값 공개다.","options":["있음","일부","없음"],"ans":1,"quote":"향후 배출권 가격 전망에 따라 기존 집약도(대당 배출량)를 유지할 경우, 2035년 기준(70% 무상할당 가정) 약 최소 959억 원에서 최대 3,318억 원의 배출부채 발생이 예상됩니다.","page":34,"co":"hyundai","look":"p.34 '배출권 거래제 규제 강화' 위험 요인 설명","src":{"label":"AASB S2 본문 22(b) (IFRS S2 동일)","url":"https://standards.aasb.gov.au/node/3844"}},{"id":"scenario-27","type":"mc","q":"연안 저지대에 대형 생산시설 여럿을 두고 배출권거래제 대상이기도 한 대기업이, 전담 ESG팀과 외부 컨설팅 예산을 갖고 있으면서도 '시나리오 분석은 정성적 서술로만 수행했다'고 IFRS S2 보고서에 썼다. 맞는 판단은?","ref":"IFRS S2 B2–B7, B17","why":"B2–B7은 접근법이 회사의 노출도와 기술·역량·자원에 비례해야 한다고 하고, B17은 노출도가 높고 필요한 역량·자원에 접근할 수 있는 회사는 더 진전된 정량적 접근을 '적용해야 한다(is required)'고 명시한다. 비례성은 아래로만 열려 있는 문이 아니다.","trap":"'합리적이고 뒷받침되는 정보'와 '과도한 비용·노력 없이'라는 문구를 면제 조항처럼 쓰는 실수다. 공개된 권위 있는 시나리오는 과도한 비용 없이 얻을 수 있는 정보로 간주된다(B11–B13).","options":["IFRS S2는 정성 분석도 허용하므로 문제없다","노출도가 높고 기술·역량·자원도 있는 회사는 B17에 따라 '더 진전된 정량적 접근'을 적용해야 한다. 정성만 쓰는 선택은 노출도가 낮거나 역량이 부족한 회사에 허용되는 것이며, 역량이 없다면 그 사실과 향후 계획을 밝혀야 한다","물리 리스크만 정량으로 하고 전환 리스크는 정성으로 해도 된다","외부 컨설턴트를 쓰면 정성 분석도 정량으로 인정된다"],"ans":1,"src":{"label":"AASB S2 Appendix B B1, B17 (IFRS S2 동일)","url":"https://standards.aasb.gov.au/node/3847"}},{"id":"korea-03","type":"mc","q":"배출권거래제 할당대상업체로 의무 지정되는 기준은?","ref":"배출권거래법 제8조","why":"배출권거래법 제8조는 최근 3년 연평균 배출량 12만 5,000 tCO2-eq 이상인 업체, 또는 2만 5,000 tCO2-eq 이상인 사업장을 하나라도 가진 업체를 계획기간 시작 5개월 전까지 지정·고시하도록 한다. 작은 사업장 여러 개를 가진 회사도 합계가 12만 5,000톤을 넘으면 대상이 된다.","trap":"'사업장 하나가 2만 5,000톤 미만이면 안전하다'고 보고 업체 합계 기준(12만 5,000톤)을 빠뜨리는 실수가 흔하다.","options":["최근 1년 배출량이 업체 10만 톤 이상","최근 3년 연평균 배출량이 업체 12만 5,000톤 이상이거나, 2만 5,000톤 이상인 사업장을 가진 업체","최근 3년 연평균 배출량이 업체 5만 톤 이상이거나 사업장 1만 5,000톤 이상","에너지 사용량이 연 500 TJ 이상인 업체"],"ans":1,"src":{"label":"배출권거래법 제8조(법률 제21071호)","url":"https://www.taxcanvas.kr/core/law/0116122025102821071/history/2026-04-29"}},{"id":"korea-04","type":"mc","q":"제4차 계획기간부터 배출권거래제의 할당 부문 구분은 어떻게 바뀌었나?","ref":"제4차 배출권거래제 기본계획(2024.12)","why":"제4차 기본계획은 기존 6개 부문을 '발전'과 '발전 외' 2개 부문으로 단순화했다. 4차 계획기간(2026~2030)은 이 두 부문에 각각 다른 유상할당 비율과 감축 경로를 적용한다.","trap":"3차 계획기간 자료(6개 부문 표)를 그대로 쓰면 4차 할당계획의 부문별 캡 숫자와 맞지 않는다.","options":["전환·산업·건물·수송·폐기물·공공기타 6개 부문을 유지한다","발전 부문과 발전 외 부문 2개로 단순화됐다","제조업과 비제조업 2개로 나뉜다","부문 구분을 없애고 업체별로만 할당한다"],"ans":1,"src":{"label":"정책브리핑 — 제4차 배출권거래제 기본계획","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148938103"}},{"id":"korea-05","type":"mc","q":"할당대상업체가 전년도 실제 배출량 명세서를 주무관청에 보고해야 하는 기한은?","ref":"배출권거래법 제24조","why":"배출권거래법 제24조는 '매 이행연도 종료일부터 3개월 이내' 명세서를 보고하도록 한다. 그래서 실무에서 매년 3월 말이 명세서 마감이고, 그 전에 외부 검증기관의 검증을 끝내야 한다.","trap":"배출권 '제출' 기한(그 뒤에 오는 별도 기한)과 명세서 '보고' 기한(3개월)을 섞어서 일정표를 짜는 실수가 많다.","options":["이행연도 종료일부터 1개월 이내","이행연도 종료일부터 3개월 이내","이행연도 종료일부터 6개월 이내","다음 계획기간 시작 전까지"],"ans":1,"src":{"label":"배출권거래법 제24조(법률 제21071호)","url":"https://www.taxcanvas.kr/core/law/0116122025102821071/history/2026-04-29"}},{"id":"korea-07","type":"mc","q":"제4차 계획기간 발전부문의 유상할당 비율 경로로 맞는 것은?","ref":"제4차 계획기간 국가 배출권 할당계획(2025.11)","why":"할당계획은 발전부문 유상할당을 2026년 15%에서 20%, 30%, 40%로 매년 올려 2030년 50%에 이르게 했다. 발전 외 부문은 15%이고, 철강·석유화학·시멘트 등 탄소누출 업종은 100% 무상이다. 3차 계획기간의 유상 비율은 10%(1·2차는 3%)였다.","trap":"'유상할당 50%'만 기억해 2026년부터 발전사가 절반을 사야 한다고 보고 비용을 과대 추정하는 실수가 있다.","options":["2026년 10% → 2030년 30%","2026년 15% → 2027년 20% → 2028년 30% → 2029년 40% → 2030년 50%","2026년부터 2030년까지 일정하게 15%","2026년 50% → 2030년 100%"],"ans":1,"src":{"label":"헤럴드경제 — 발전 15%→2030년 50%","url":"https://www.heraldk.com/article/2025111000481339526"}},{"id":"korea-08","type":"mc","q":"2025년 12월 18일 공표된 국가 전력배출계수(2023년 기준)와 그 뜻으로 맞는 것은?","ref":"기후에너지환경부 전력배출계수 공표(2025.12.18)","why":"전력배출계수는 전기 사용 1단위당 발전 과정에서 나온 온실가스로, 2023년 데이터 기준 0.4173 tCO2eq/MWh가 공표됐다. 직전 계수는 2020~2022년 3년 평균인 0.4541(2025년 3월 공표)이었고, 2025년 12월부터 3년 주기 대신 1년 주기로 발표한다.","trap":"단위를 kWh와 MWh로 헷갈리면 1,000배 틀린다. 또 어떤 연도 계수를 쓸지 지침이 정하는 적용 연도를 확인하지 않고 최신 값을 바로 쓰는 실수가 있다.","options":["0.4541 tCO2eq/MWh — 발전소가 연료를 태울 때 나오는 직접배출 계수","0.4173 tCO2eq/MWh — 전기 1MWh를 쓸 때 간접적으로 나오는 온실가스 양","0.4567 tCO2eq/MWh — 송전 손실만 반영한 계수","0.4173 tCO2eq/kWh — 전기 1kWh당 배출량"],"ans":1,"src":{"label":"쿠키뉴스 — 전력배출계수 0.4173, 1년 주기 공표","url":"https://www.kukinews.com/article/view/kuk202512180131"}},{"id":"korea-09","type":"mc","q":"배출권거래제 명세서에 대한 외부 검증의 보증 수준은?","ref":"온실가스 배출권거래제 운영을 위한 검증지침(환경부고시 제2025-16…","why":"현대자동차 2025년도 명세서 검증의견서(DNV)와 네이버 명세서 검증의견서(한국표준협회)는 모두 '합리적 보증수준'으로 수행됐다고 밝힌다. 이는 Scope 3 등에 흔히 쓰는 '제한적 보증'보다 높은 수준으로, K-ETS 명세서가 기후공시의 Scope 1·2 숫자 중 가장 신뢰도 높은 출발점이 되는 이유다.","trap":"지속가능성보고서의 제3자 검증(대개 제한적 보증)과 K-ETS 명세서 검증(합리적 보증)을 같은 수준으로 소개하는 실수가 있다.","options":["제한적 보증 — 자료를 훑어보고 이상 징후가 없음을 확인","합리적 보증 — 자료를 깊이 확인해 적정하다고 적극적으로 의견을 냄","보증 없음 — 검증기관은 자문만 한다","절대적 보증 — 모든 오류가 없음을 보장"],"ans":1,"src":{"label":"네이버 온실가스 명세서 검증의견서(한국표준협회)","url":"https://www.navercorp.com/static/NAVER_Greenhouse_Gas_Verification_KOR.pdf"}},{"id":"korea-17","type":"mc","q":"2025년 2월 7일 시행된 배출권거래법 시행령 개정으로 할당취소 기준은 어떻게 바뀌었나?","ref":"배출권거래법 시행령 개정(2025.2.7 시행)","why":"개정 전에는 배출량이 할당량의 50% 이하로 떨어져야 취소할 수 있었다. 개정으로 15% 이상 감소 시 취소가 가능해졌고, 감소 폭 15~25%는 할당의 50%, 25~50%는 75%, 50% 이상은 100%를 취소한다. 2022년 태풍으로 제철소가 멈춘 뒤 남은 배출권을 판 사례가 배경이다.","trap":"'생산이 줄면 남는 배출권을 팔아 이익'이라고 조언하면 틀린다. 15% 이상 감소분은 상당 부분 취소된다.","options":["배출량이 할당량의 50% 이하로 떨어진 경우에만 취소 가능(변경 없음)","배출량이 할당량보다 15% 이상 줄면 취소 가능하고, 감소 폭에 따라 50%·75%·100%를 단계적으로 취소","배출량이 조금이라도 줄면 그만큼 전부 취소","할당취소 제도가 폐지됐다"],"ans":1,"src":{"label":"법무법인 화우 — 시행령 개정안 해설(할당취소 단계)","url":"https://www.hwawoo.com/newsletter/2024_09_19_1/240919_k_e.pdf"}},{"id":"korea-18","type":"mc","q":"배출권 가격이 급락할 때 정부가 시장안정화 조치를 할 수 있는 가격 기준은 2025년 시행령 개정으로 어떻게 바뀌었나?","ref":"배출권거래법 제23조·시행령 제38조","why":"기존에는 직전 2년 연평균 가격의 60% 이하로 떨어져야 발동할 수 있었지만, 개정으로 최근 2년 이동평균의 70% 이하면 발동할 수 있게 되어 개입 시점이 앞당겨졌다. 법 제23조는 예비분 활용, 보유한도 설정, 유상할당 공급량 조정 등을 안정화 수단으로 정한다.","trap":"'60%'를 아직 기준으로 말하거나, 발동 기준이 연평균인지 이동평균인지 구분하지 않는 실수가 있다.","options":["직전 2년 평균가격의 60% 이하 → 70% 이하(최근 2년 이동평균)","직전 1년 평균가격의 50% 이하 → 60% 이하","기준 가격 제도가 없어지고 정부 재량으로만 발동","70% 이하 → 60% 이하로 더 엄격해졌다"],"ans":0,"src":{"label":"법무법인 화우 — 시행령 개정안(제38조 60%→70%)","url":"https://www.hwawoo.com/newsletter/2024_09_19_1/240919_k_e.pdf"}},{"id":"korea-19","type":"mc","q":"2025년 2월 7일 시행된 시행령 개정으로 배출권 시장에 새로 참여할 수 있게 된 주체는?","ref":"배출권거래법 시행령 개정(2025.2.7 시행)","why":"기존 참여자는 할당대상업체, 시장조성자, 배출권거래중개회사 정도였는데, 개정으로 집합투자업자·은행·보험사·기금관리자 등이 추가됐고 개인 참여의 근거도 마련됐다. 다만 2026년 5월 기준 금융기관 참여는 아직 제한적이라는 평가다.","trap":"'개인도 바로 참여 가능'이라고 말하면 틀린다. 개인은 근거만 마련된 단계다.","options":["개인 투자자 누구나","집합투자업자(자산운용사), 은행, 보험사, 기금관리자","외국 정부","할당대상업체의 임직원 개인"],"ans":1,"src":{"label":"법무법인 화우 — 시행령 개정안(참여자 확대)","url":"https://www.hwawoo.com/newsletter/2024_09_19_1/240919_k_e.pdf"}},{"id":"korea-23","type":"mc","q":"배출권거래법 제24조의2에 따라 검증기관으로 지정받을 수 없는 경우는?","ref":"배출권거래법 제24조의2","why":"법은 할당대상업체와 계열 관계인 곳, 제40조에 따라 권한을 위탁받은 곳, 온실가스·에너지 컨설팅이나 설비 설치 서비스를 하는 곳 등은 검증기관 지정을 거부할 수 있게 하고, 지정 취소 후 3년이 안 된 경우도 거부 사유다. 검증의 독립성을 지키기 위한 규정이다. 시행령 개정안은 지정 유효기간을 3년으로 둔다.","trap":"컨설팅 회사가 자기 고객의 명세서를 검증해 주는 '원스톱 서비스'를 제안하면 법 위반이 된다.","options":["직원이 10명 미만인 기관","할당대상업체의 동일 법인이거나, 온실가스·에너지 관련 컨설팅이나 설비 설치 업무를 하는 기관","서울 외 지역에 본사가 있는 기관","외국계 지분이 있는 기관"],"ans":1,"src":{"label":"배출권거래법 제24조의2(법률 제21071호)","url":"https://www.taxcanvas.kr/core/law/0116122025102821071/history/2026-04-29"}},{"id":"korea-24","type":"mc","q":"GIR의 2025년 배출권거래제 운영결과(2026년 2월 보도)에 따른 3차 계획기간 말 시장 상황으로 맞는 것은?","ref":"GIR 2025년 배출권거래제 운영결과 보고서","why":"2025년 평균가는 9,461원(2024년 9,575원), 거래량은 1억 1,170만 톤에서 6,760만 톤으로 39.5% 줄었다. 2024년 최종 할당 5억 8,160만 톤 중 96.5%가 무상이었고, 조사 응답 기업의 57.9%는 거래 없이 할당량만으로 의무를 채웠다. 이 '과잉 할당'이 4차에서 캡 축소와 유상 확대로 이어진 배경이다.","trap":"EU 가격(약 10만 원대)과 비교할 때 한국 가격이 낮은 이유를 '수요 부족'으로만 설명하고 무상 비율과 할당 과잉을 빼놓는 실수가 있다.","options":["2025년 평균 가격은 약 3만 원, 거래량은 전년보다 늘었다","2025년 평균 가격 9,461원, 거래량 6,760만 톤(전년 대비 −39.5%), 2024년 할당의 96.5%가 무상","유상할당 비중이 이미 30%를 넘었다","대상 기업의 대부분이 배출권을 사야 했다"],"ans":1,"src":{"label":"세계일보 — 할당 과잉 속 96% 무상 제공(2026.2.2)","url":"https://www.segye.com/newsView/20260202515372"}},{"id":"korea-26","type":"mc","q":"K-ETS 명세서에서 전력 사용량(MWh)을 에너지 사용량(TJ)으로 바꿀 때 쓰는 계수는?","ref":"현대자동차 온실가스 검증의견서(2025년도)","why":"현대자동차 2025년도 검증의견서는 '전력의 경우 한국 배출권거래제(K-ETS) 기준 순발열량인 9.6 TJ/GWh를 적용하였으며, 기타 에너지 항목에 대해서는 일반 전환계수인 3.6 TJ/GWh를 적용'했다고 밝힌다. 9.6은 발전 과정의 1차 에너지를 반영한 값이라 물리 환산값(3.6)의 약 2.7배다.","trap":"3.6으로 환산한 에너지 사용량을 명세서 수치와 비교하면 전력분이 크게 어긋난다. 보고서의 'TJ' 숫자가 어떤 계수로 나온 것인지 꼭 확인해야 한다.","options":["일반 물리 환산계수 3.6 TJ/GWh","K-ETS 기준 순발열량 9.6 TJ/GWh","국가 전력배출계수 0.4173","환산하지 않고 MWh로만 보고한다"],"ans":1},{"id":"korea-27","type":"mc","q":"한 철강회사 재무팀이 '2026년 4월 29일 시행된 배출권거래법 개정으로 무상할당이 바로 폐지되는 것 아니냐'고 묻는다. 맞는 설명은?","ref":"배출권거래법 개정(법률 제21071호, 2026.4.29 시행)","why":"개정 법 제12조는 '배출권의 할당은 유상으로 함을 원칙'으로 하고 무상할당비율은 '직전 계획기간의 무상할당비율을 초과할 수 없다'고 정했다. 이는 방향을 못 박은 것이고, 실제 비율은 할당계획이 정한다. 4차 할당계획은 철강·석유화학·시멘트 등을 100% 무상으로 두었으며, 5차(2031~)에서 탄소누출 업종의 유상 전환을 검토한다.","trap":"법 조문의 '원칙'과 할당계획의 실제 비율을 구분하지 않고 고객에게 즉시 비용 발생을 경고하거나, 반대로 '우리는 무상이니 영원히 안전'이라고 안심시키는 양쪽 실수가 모두 있다.","options":["모든 무상할당이 2026년부터 즉시 폐지된다","유상할당이 '원칙'이 되고 계획기간마다 '총 무상할당비율'을 정하되 직전 계획기간보다 높일 수 없게 됐을 뿐, 4차 할당계획상 철강 등 탄소누출 업종은 100% 무상이 유지된다","법 개정은 발전부문에만 적용된다","무상할당 비율은 각 기업이 신청해 정한다"],"ans":1,"src":{"label":"배출권거래법 제12조(법률 제21071호, 2026.4.29 시행)","url":"https://www.taxcanvas.kr/core/law/0116122025102821071/history/2026-04-29"}},{"id":"korea-28","type":"mc","q":"한 할당대상업체가 2026년 주력 사업장을 매각해 2026년 배출량이 2,400톤으로 급감했다. 2027년 이후 이 회사의 K-ETS 의무에 대해 맞는 조언은?","ref":"배출권거래법 시행령 개정(2026.4.29 시행)","why":"개정 전에는 계획기간 중간에 빠질 근거가 없어 배출이 거의 없어도 5년 내내 MRV 의무를 졌다. 2026년 4월 29일 시행 시행령은 사업장 폐쇄·매각 등으로 전년 배출량이 3,000 tCO2-eq 미만이 되면 제외할 수 있게 했다. 한편 남은 배출권은 할당취소(15% 이상 감소 시 단계적 취소) 대상이 되므로 '전부 매각'은 틀린 조언이다.","trap":"","options":["계획기간(2030년)까지는 무조건 명세서 보고·배출권 제출 의무가 남는다","2026년 4월 29일 시행된 시행령에 따라 전년 배출량이 3,000톤 미만이면 계획기간 중에도 할당대상에서 제외될 수 있으므로 제외 절차를 검토한다","배출량이 줄었으니 할당받은 배출권을 전부 팔아도 된다","목표관리제로 자동 전환된다"],"ans":1,"src":{"label":"헤럴드경제 — 3,000톤 미만 급감 시 제외(2026.4.20)","url":"https://www.heraldk.com/article/2026042017520851772"}},{"id":"korea-30","type":"mc","q":"현대자동차의 2025년 국내 Scope 2는 지역기반 1,084,648 tCO2-eq, 시장기반 1,084,521 tCO2-eq로 공시됐다. 두 숫자가 다른 이유와 K-ETS 명세서에 들어가는 값에 대한 맞는 설명은?","ref":"현대자동차 온실가스 검증의견서(2025년도)","why":"검증의견서는 '지역기반은 국가 전력망을 기준으로 한 Scope 2', '시장기반은 GHG 프로토콜을 적용하며 PPA 재생에너지 전력량을 반영'하고, 공표된 잔여배출계수가 없어 잔여 전력에는 국내 전력배출계수를 적용했다고 설명한다. K-ETS 명세서는 국가 계수 기반(지역기반)이므로, 기후공시에서 시장기반 숫자를 내려면 명세서 숫자와의 차이(127 t)를 설명해야 한다.","trap":"공시의 시장기반 Scope 2를 명세서 값과 '같다'고 쓰거나, PPA를 K-ETS 명세서에서도 차감할 수 있다고 오해하는 실수가 있다.","options":["시장기반이 K-ETS 명세서 값이고, 지역기반은 참고용이다","지역기반은 국가 전력망 계수를 적용한 값으로 K-ETS 명세서 기준이며, 시장기반은 GHG 프로토콜에 따라 재생에너지 PPA 전력량을 반영한 값이다","둘의 차이는 해외 법인 배출량 때문이다","둘의 차이는 검증기관이 달라서 생긴 오차다"],"ans":1},{"id":"korea-31","type":"judge","q":"기후공시 기준은 규제(배출권거래제 등)로 인한 전환위험과 예상 재무영향을 설명하도록 요구한다. 현대자동차 2026 지속가능성 보고서는 K-ETS로 인한 비용 위험을 금액과 가정을 붙여 공시했는가?","ref":"IFRS S2 전략 — 기후 관련 위험이 재무에 미치는 영향","why":"보고서는 K-ETS 대상임을 밝히고, 70% 무상할당 가정과 배출권 가격 시나리오를 붙여 2035년 배출부채를 959억~3,318억 원으로 범위 공시했다. 반대로 감축 로드맵 이행 시 잉여 배출권 판매로 287억~992억 원의 기회도 같은 페이지에서 제시한다.","trap":"금액이 있다는 것만 보고 넘기지 말고, 가정(무상 70%)이 4차 할당계획의 실제 유상 비율(발전 외 15%, 탄소누출 업종 100% 무상)과 어떻게 이어지는지 따져 보는 것이 컨설턴트의 일이다.","options":["있음","일부","없음"],"ans":0,"quote":"현대자동차는 국내 배출권거래제(K-ETS) 대상으로서, 할당된 연간 배출 허용량을 초과할 경우 배출권 구매 비용이 발생할 수 있습니다. 향후 배출권 가격 전망에 따라 기존 집약도(대당 배출량)를 유지할 경우, 2035년 기준(70% 무상할당 가정) 약 최소 959억 원에서 최대 3,318억 원의 배출부채 발생이 예상됩니다.","page":34,"co":"hyundai","look":"기후변화 시나리오 분석 표의 '배출권 거래제 — 규제 강화' 위험 요인과 2035년 배출부채 추정치, 가정(무상할당 비율)"},{"id":"markets-10","type":"mc","q":"2025년 CBAM 옴니버스 개정으로 도입된 '50톤 기준'을 바르게 설명한 것은?","ref":"규정(EU) 2025/2083 제2a조·부속서 VII","why":"기준은 '건당'이 아니라 '수입자당 연간 누적 순중량'이며, CN코드를 합산한다. 전력과 수소에는 이 조항이 적용되지 않는다. 기존 150유로 소액 화물 면제는 폐지됐다. 집행위는 이 기준으로 수입자의 약 90%가 의무에서 벗어나지만 배출량의 99%는 여전히 포괄된다고 설명한다. 이 면제는 전력·수소에는 적용되지 않는다.","trap":"'50톤'을 배출량(tCO2)으로 읽는 실수가 잦다. 제품의 질량(톤)이다. 또 전력·수소 수입은 아무리 적어도 면제가 없다.","options":["수입자 1곳이 1년간 들여오는 철강·알루미늄·시멘트·비료의 순중량 합계가 50톤 이하면 면제되며","수입 건당 50톤 이하인 화물은 품목과 상관없이 면제된다","수입자 1곳이 1년간 수입하는 내재배출량이 50톤CO2 이하면 면제된다","수입 금액이 150유로 이하인 소액 화물만 면제된다"],"ans":0,"src":{"label":"규정(EU) 2025/2083 원문","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32025R2083"}},{"id":"markets-29","type":"mc","q":"한 자동차 부품사가 '2026년부터 EU로 수출하는 모든 철강 부품에 CBAM 인증서를 사야 한다'는 소식을 듣고 급히 대응을 요청했다. 2026년 10월 기준 컨설턴트의 바른 설명은?","ref":"EU 집행위 CBAM 확대 법안(2025.12.17)","why":"집행위는 2025년 12월 16~17일 이행 패키지와 함께 철강·알루미늄 집약 하류 제품 약 180개 카테고리(자동차 부품, 가전, 건설자재, 변압기, 케이블, 농기계 등)를 2028년 1월 1일부터 포함하는 법안을 발표했다. 약 7,500개 수입자가 추가될 것으로 추정되며 스크랩을 전구체로 보는 우회 방지 조항도 담겼다. 아직 입법 절차 중이므로 '현행 의무'로 설명하면 틀리다. 현대자동차 보고서도 1·2차 협력사 25개사에 CBAM 대응 컨설팅을 지원한다고 적고 있다.","trap":"제안(proposal)과 시행 중인 법을 구분하지 않는 것이 가장 흔한 실수다. 반대로 '제안이니 무시'도 틀리다. 2028년 시행 시 부품 단위 배출 데이터가 바로 필요하다.","options":["현재 CBAM은 철강 원자재·반제품(CN 72·73류 등) 중심이며, 자동차 부품 등 약 180개 하류 제품으로 넓히는 것은 2025년 12월 집행위가 낸 '법안'으로 2028년 1월 1일 시행을 목표로 의회·이사회 심의 중이다. 따라서 지금은 부품의 철강 함량과 공급망 배출 데이터를 미리 정비할 때다","2026년 1월 1일부터 모든 철강 함유 제품이 이미 CBAM 대상이므로 즉시 인증서를 사야 한다","자동차 부품은 영구히 CBAM 대상에서 제외되므로 아무 준비도 필요 없다","하류 제품 확대는 이미 2027년 시행이 확정됐다"],"ans":0,"src":{"label":"CMS: CBAM 이행 패키지와 확대 제안","url":"https://cms.law/en/gbr/legal-updates/cbam-implementation-package-published-and-proposals-for-future-expansion"}},{"id":"markets-32","type":"judge","q":"현대자동차 2026 지속가능성 보고서가 EU CBAM을 자사 가치사슬의 전환 위험(규제 위험)으로 명시적으로 식별하고 영향(비용) 경로를 적었는지 확인하라.","ref":"IFRS S2 기후 관련 위험 식별(전환 위험)","why":"보고서 19쪽은 기후변화 완화 영역의 업스트림 규제 위험으로 CBAM과 EUDR을 함께 들고, 원재료 구매비 상승과 과징금이라는 비용 경로, 중기~장기 시간대까지 명시한다. 23쪽에서는 CBAM 본격 시행에 따른 유럽 수출품 탄소비용 부담 증가를 '신규 규제'로, 30쪽에서는 협력사 25개사에 CBAM 대응 컨설팅 지원을 적어 위험 식별과 대응이 연결된다.","trap":"'CBAM'이라는 단어가 있는지만 보고 끝내면 안 된다. 위험 식별은 원인(규제)-경로(원재료비·과징금)-시간대(중·장기)-대응(협력사 지원)이 이어져야 완결된 공시다. 다만 이 보고서는 CBAM 비용을 금액으로 추정하지는 않았다.","options":["있음","일부","없음"],"ans":0,"quote":"규제: EU 탄소국경조정제도(CBAM), EU 산림전용방지규정(EUDR) • 원재료의 가격 상승 또는 대체 원재료 확보로 인한 구매 비용이 상승할 수 있으며, 관련 규제 위반 시 과징금 등의 금전적 페널티를 부과받을 수 있습니다.","page":19,"co":"hyundai","look":"기후 위험·기회 표에서 '업스트림' 구간의 규제 항목과 그 재무 영향 설명"},{"id":"targets-08","type":"mc","q":"IFRS S2에서 기후 전환계획에 대한 요구를 가장 정확히 설명한 것은?","ref":"IFRS S2 문단 14(a)(iv), 부록 A","why":"IFRS 재단 자료는 IFRS S2가 '전환계획을 가질 것을 요구하지 않는다'고 밝히면서, 문단 14(a)(iv)에 따라 회사가 가진 전환계획이 있으면 개발에 쓴 핵심 가정과 계획이 의존하는 요소를 공시하도록 한다고 설명한다. 부록 A는 전환계획을 '저탄소 경제로의 전환을 위한 목표·행동·자원을 담은 전략의 한 부분'으로 정의한다.","trap":"'IFRS S2가 전환계획을 의무화했다'고 고객에게 말하면 틀린 조언이다. 의무는 '있는 계획에 대한 정보 공시'다.","options":["전환계획을 '가질 것'을 요구하지는 않지만, 가지고 있다면 핵심 가정과 의존성을 포함해 공시해야 한다","모든 기업이 전환계획을 수립해 공시해야 한다","전환계획은 금융회사만 공시한다","전환계획 공시는 완전히 자발적이며 어떤 기준도 없다"],"ans":0,"src":{"label":"IFRS 재단 브리핑 노트 (2025.2)","url":"https://ifrs.org/content/dam/ifrs/events-and-conferences/2025/february/stakeholder-event/briefing-note.pdf"}},{"id":"targets-32","type":"judge","q":"IFRS S2 문단 14(a)(iv)는 전환계획 공시에 '핵심 가정'과 '의존성'을 담으라고 한다. 현대자동차 보고서의 '목표 달성 계획'이 감축 수단과 함께, 그 수단이 의존하는 외부 조건(예: 전력망 탈탄소, 그린수소 공급, 전기차 수요)을 가정·의존성으로 명시하는지 보라.","ref":"IFRS S2 문단 14(a)(iv)","why":"감축 수단(재생에너지 전환, 그린수소, 전동화 확대, 협력사 지원)은 구체적으로 적혀 있지만, 그 수단이 성립하기 위한 전제(재생에너지·그린수소 조달 가능성, 각국 전력망 배출계수, 전기차 수요와 보조금 정책 등)를 '가정'이나 '의존성'이라는 이름으로 따로 정리해 보여주지는 않는다. 따라서 '일부'다.","trap":"수단 목록이 길면 '전환계획이 충실하다'고 판단하기 쉽다. IFRS S2는 수단뿐 아니라 '무엇이 깨지면 계획이 흔들리는가'를 적도록 요구한다.","options":["있음","일부","없음"],"ans":1,"quote":"단기적으로는 RE100 로드맵과 연계하여 제조 과정에서 사용하는 전기에너지부터 우선 재생에너지로의 전환을 추진할 계획이며, 장기적으로는 수소사회 구현과 연계하여 주요 제조 공정에 그린수소 적용을 확대하고자 합니다.","page":41,"co":"hyundai","look":"'목표 달성 계획' 단락(사업장 탄소 배출 감축·전동화·협력사 지원)에서 수단은 있는지, 그 수단의 전제 조건이 '가정' 또는 '의존성'으로 적혀 있는지 확인한다.","src":{"label":"IFRS 재단 브리핑 노트 (2025.2)","url":"https://ifrs.org/content/dam/ifrs/events-and-conferences/2025/february/stakeholder-event/briefing-note.pdf"}},{"id":"finance-24","type":"mc","q":"한 시중은행이 2026년 회계연도 IFRS S2 기반 보고서를 준비하면서 '파생상품 포지션과 채권 인수 주선 건은 배출량 계산이 어렵다'고 호소한다. 2025년 12월 ISSB 개정에 따른 올바른 처리는?","ref":"IFRS S2 개정 '온실가스 배출 공시 개정'(2025.12)","why":"2025년 12월 11일 발표된 개정은 2027년 1월 1일 이후 시작하는 회계연도부터 시행되고 조기적용이 허용된다. 금융활동 기업은 카테고리 15를 금융배출량(대출·프로젝트금융·채권·주식·미인출 약정·운용자산)으로 한정하고 파생상품을 제외할 수 있으나, 제외한 금융활동과 파생상품 정의를 설명하고 카테고리 15 총량 및 그 안의 금융배출량 소계를 공시해야 한다. 산업 분류는 GICS 의무가 없어지고 다른 체계를 선택해 근거를 밝힐 수 있다.","trap":"초안에 있던 '제외 금액의 정량 공시'는 최종안에서 빠졌지만, 정성 설명 의무는 남았다. '제외하면 아무 설명도 필요 없다'고 하면 틀린다.","options":["개정은 2027년 1월 1일 이후 회계연도부터 시행되지만 조기적용이 가능하므로, 조기적용 시 카테고리 15를 금융배출량으로 한정하고 파생상품을 제외할 수 있으며, 제외한 활동과 파생상품의 정의를 설명하고 카테고리 15 총량과 금융배출량 소계를 공시한다","개정에 따라 은행은 Scope 3 전체를 공시하지 않아도 된다","파생상품은 제외할 수 있지만 그 사실을 설명할 필요는 없다","개정은 자동 적용되어 2026년부터 반드시 GICS를 써야 한다"],"ans":0,"src":{"label":"BDO IFRS S2 개정 해설(2025.12)","url":"https://www.bdo.global/en-gb/insights/ifrs-and-corporate-reporting/2025/issb-publishes-amendments-to-ifrs-s2-%E2%80%93-amendments-to-greenhouse-gas-emissions-disclosures"}},{"id":"practice-29","type":"mc","q":"한 제조회사가 IFRS S2 기반 기후공시 준비 중, 전년도 Scope 2 배출량 계산에 전력 사용량 파일 한 사업장 분이 빠졌던 것을 발견했다. 그 파일은 전년도 공시 승인 시점에 이미 사내에 있었다. 올바른 처리는?","ref":"IFRS S1 문단 83–85","why":"IFRS S1 문단 84는 '공시 승인 시점에 이용 가능했고 합리적으로 입수·고려할 수 있었던 신뢰성 있는 정보'를 쓰지 못한 누락·오기를 전기 오류로 정의하고, 문단 83은 중요한 전기 오류를 비교 수치 재작성으로 수정하라고 한다. 문단 85는 오류 수정과 추정 변경을 구분한다.","trap":"모든 재산정을 '추정 변경'으로 묶어 올해만 고치는 것이다. 이미 있던 자료를 빠뜨린 것은 추정 변경이 아니라 오류다.","options":["중요한 전기 오류이므로 전년도 비교 수치를 재작성(restate)하고 오류의 성격을 공시한다(실무적으로 불가능한 경우 제외)","추정의 변경이므로 올해 숫자에만 반영하고 전년도는 그대로 둔다","검증기관이 이미 승인했으니 수정하지 않는다","올해 배출량에서 그만큼 빼서 상쇄한다"],"ans":0,"src":{"label":"AASB S1(IFRS S1 동일 문단) 83–86 Errors","url":"https://standards.aasb.gov.au/node/3823"}},{"id":"kia-j07","type":"judge","q":"Scope 2를 지역 기반으로 공시하고, 재생에너지 계약(PPA·인증서) 정보도 주는가?","ref":"IFRS S2 문단 29(a)(v)","why":"지역 기반 수치는 156쪽 검증의견서 표에 사업장별로만 있고, 130쪽 본 데이터표에는 어느 방식인지 표시 없이 한 숫자(697.9천 톤, 시장 기반 합계와 일치)만 있다. PPA·REC·자가발전 MWh는 131쪽에 있다.","trap":"130쪽 Scope 2를 지역 기반으로 읽으면 틀린다. 156쪽 지역 기반 합계는 약 861.7천 톤으로 130쪽 숫자보다 16만 톤 이상 크다.","options":["있음","일부","없음"],"ans":1,"quote":"Note 1: Scope 2의 지역 기반 및 시장 기반은 GHG Protocol Scope 2 Guidance (2015)에 따른 용어임.","page":156,"co":"kia","look":"검증의견서 Scope 2 표(지역기반/시장기반), 에너지 사용 표(REC·PPA)"},{"id":"kia-j10","type":"judge","q":"내부탄소가격을 쓰는지, 어떻게 쓰는지, 톤당 가격이 얼마인지 밝히는가?","ref":"IFRS S2 문단 29(f)","why":"Shadow Price 방식이고 HMG 경영연구원 전망 탄소가격을 기준으로 매년 설정해 생산공장 투자심의에 쓴다고 설명했다. 그러나 톤당 가격(원/tCO2e)은 적지 않았다.","trap":"'매년 설정'이라는 말을 보고 가격이 공시됐다고 착각하기 쉽다. 쓰는지와 어떻게 쓰는지는 있지만 '얼마'가 없다.","options":["있음","일부","없음"],"ans":1,"quote":"내부탄소가격은 Shadow Price1을 기반으로 하며,","page":33,"co":"kia","look":"④ 데이터 기반 탄소관리 > 내부탄소가격제도"},{"id":"kia-j11","type":"judge","q":"당기 경영진 보상 중 기후와 연계된 비율(%)을 공시하는가?","ref":"IFRS S2 문단 29(g)(ii)","why":"CEO KPI 중 지속경영지표가 20%이고 그 안에 탄소배출 감축 성과가 포함된다고 했다. 하지만 20% 전체가 기후는 아니므로 기후만의 비율은 알 수 없다.","trap":"'20%'를 기후 연계 비율로 옮겨 쓰면 과장이다. 지속경영지표에는 기후 외 ESG 과제도 들어간다.","options":["있음","일부","없음"],"ans":1,"quote":"CEO KPI는 지속경영지표(20%), 재무지표(35%), 사업 및 전략지표(45%)로","page":24,"co":"kia","look":"기후변화 Governance > 경영진 보상"},{"id":"kia-j13","type":"judge","q":"목표를 제3자가 검토·검증했는가?","ref":"IFRS S2 문단 34(a)","why":"2025년 10월 SBTi가 단기 목표를 공식 승인했다고 밝혔다. 2045년 탄소중립(장기 목표)은 SBTi 넷제로 승인 대상이 아니다.","trap":"SBTi 승인은 '단기 목표'에 한정된다. 2045년 장기 목표까지 검증받았다고 읽으면 틀린다.","options":["있음","일부","없음"],"ans":0,"quote":"이러한 노력의 일환으로 기아는 글로벌 스탠다드인 SBTi로부터 단기 온실가스 감축목표에 대한 공식 승인을","page":32,"co":"kia","look":"③ 탄소배출 감축 로드맵 구축"},{"id":"kia-j15","type":"judge","q":"목표가 총량(gross) 기준인지, 상쇄를 뺀 순량(net) 기준인지 밝히는가?","ref":"IFRS S2 문단 36(c)","why":"63% 감축 목표와 2045년 탄소중립이 상쇄를 포함하는지, 총량 기준인지 어디에도 적지 않았다. '상쇄'나 '순배출'이라는 단어 자체가 보고서에 없다.","trap":"SBTi 단기 목표는 규정상 총량 기준이지만, 그것은 SBTi 규칙에서 추론한 것이고 보고서가 밝힌 것은 아니다.","options":["있음","일부","없음"],"ans":2,"quote":"Scope 1·2                                                      단위: 천 톤    Scope 3","page":32,"co":"kia","look":"③ 탄소배출 감축 로드맵, 42쪽 목표"},{"id":"kia-j18","type":"judge","q":"IFRS S2 문단 6(a)(v)는 기후 관련 성과지표가 보상정책에 포함되는지, 어떻게 포함되는지 공시하라고 한다. 기아 보고서 24쪽은 이 요구를 충족하는가?","ref":"IFRS S2 문단 6(a)(v)","why":"CEO KPI 구성(지속경영지표 20%)과 온실가스 감축 목표 준수 여부에 따라 연간 인센티브를 지급한다는 방식, 사업부문장·권역장 KPI에 CO2 규제 대응과 감축목표 달성률이 들어간다는 설명이 있다.","trap":"포함 여부와 방식은 있지만 비율(29(g))은 없다. 6(a)(v)와 29(g)(ii)는 다른 요구라는 점을 구분해야 한다.","options":["있음","일부","없음"],"ans":0,"quote":"기아는 CEO 및 주요 임원, 조직장에 대해 기후변화 대응 실적과 연계된","page":24,"co":"kia","look":"기후변화 Governance > 경영진 보상"},{"id":"kia-j19","type":"judge","q":"IFRS S2 문단 10(d)는 단기·중기·장기를 어떻게 정의하는지와, 그 정의가 전략적 의사결정용 기획 기간과 어떻게 연결되는지 설명하라고 한다. 기아 보고서 25쪽은 이를 충족하는가?","ref":"IFRS S2 문단 10(d)","why":"단기 1년 이내(2025~2026), 중기 1~5년(2027~2031), 장기 5년 초과(2032~2045)를 연수로 정의하고, 근거 열에 KSSB 1호 차용·RE100 달성 시점·감축 목표 달성 시점을 적어 전략 기획과 연결했다.","trap":"단기 정의의 각주(원자료는 2024~2025년이지만 2025~2026년으로 설정)를 놓치면 분석 기준 연도를 잘못 읽는다.","options":["있음","일부","없음"],"ans":0,"quote":"장기          5년 초과(2032년~2045년)                   중장기 탄소배출 감축 목표 달성 시점","page":25,"co":"kia","look":"기후 관련 위험 및 기회의 영향 기간 표"},{"id":"kia-j20","type":"judge","q":"IFRS S2 문단 25(a)(iv)는 기후 위험을 '다른 종류의 위험과 비교해' 어떻게 우선순위를 정하는지 공시하라고 한다. 기아 보고서 41쪽은 이를 충족하는가?","ref":"IFRS S2 문단 25(a)(iv)","why":"기후 위험이 전사 통합 리스크 관리 프로세스에 들어가고 규모·발생가능성·취약성으로 우선순위를 정한다고 했다. 그러나 다른 위험(재무·안전 등)과 비교해 기후 위험이 어떤 순위인지는 나오지 않는다.","trap":"'통합 관리'라는 말만으로 상대적 우선순위 공시가 된 것으로 보면 안 된다. 비교 결과(예: 전사 Top 리스크 목록 내 위치)가 있어야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"프로세스에 포함하여 전사 통합 관점으로 관리되고 있으며, 기후변화 리스크 분석과 관련한 계획, 분석 결과 및 대응방안 등 주요 사항은 매년 이사회에 정기적으로 보고되어 최고 의사결정기구의 관리·감독 하에 운영되고 있습니다.","page":41,"co":"kia","look":"Risk Management > 통합 관리 프로세스"},{"id":"kia-j21","type":"judge","q":"기후 관련 위험·기회가 당기 재무상태·성과에 미친 영향을 금액으로 밝히는가?","ref":"IFRS S2 문단 16","why":"당기 탄소배출부채(0.3십억 원, 국내)와 2025년 에너지 절감 투자 73.7억 원·연 30억 원 절감 효과(36쪽)는 금액으로 있다. 하지만 전동화 매출이나 규제 비용 등 기후 관련 당기 재무영향을 종합한 공시는 없다.","trap":"탄소배출부채 비율 0.00375%의 분모가 무엇인지 보고서에 없다. 영업이익이나 부채총계로 나눠 봐도 맞지 않으니 그대로 인용만 해야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"탄소배출부채                     십억 원                  0.6               0.2               0.3","page":129,"co":"kia","look":"재무 데이터 > 탄소배출부채, 에너지 효율화 투자"},{"id":"kia-j23","type":"judge","q":"IFRS S2 문단 22(b)(ii)는 시나리오 분석의 핵심 가정(기후정책, 거시경제, 에너지 믹스, 기술 등)을 공시하도록 한다. 기아의 전환 시나리오 분석은 사용한 핵심 가정을 구체적으로 밝혔는가?","ref":"IFRS S2 문단 22(b)(ii)","why":"배출권 가격·유상할당 비율, 재생에너지 단가·전력 요금 경로, 전동화 전환 경로 등 어떤 가정을 썼는지 항목은 적었다. 그러나 가정의 숫자(예: 2030년 배출권 가격)와 결과 금액은 없다.","trap":"가정 '항목'을 나열한 것과 가정 '값'을 공시한 것은 다르다. 항목만 있으면 '일부'다.","options":["있음","일부","없음"],"ans":1,"quote":"기아는 IEA의 Net Zero Emissions(NZE) 시나리오와 NGFS Phase 5 시나리오를 적용하여 전환 위험 및 기회를 분석하였습니다.","page":29,"co":"kia","look":"전환 위험 및 기회 > Stage 2. 시나리오별 가정"},{"id":"kia-j38","type":"judge","q":"기아 2026 보고서는 KSSB가 요구하는 '측정 방법별 배출량 구분 공시'를 충족할 준비가 되어 있는가?","ref":"KSSB 제2호 온실가스 측정 방법별 구분 공시","why":"Scope 2는 지역/시장 기반을 사업장별로 나눴고, 국내 Scope 1·2는 K-ETS 산정 결과를 쓴다고 밝혔다. 그러나 직접 측정·계산·추정 등 측정 방법별로 배출량을 구분한 표는 없다.","trap":"K-ETS 검증 수치를 썼다는 말은 '측정 방법별 구분'이 아니다. KSSB가 요구하는 것은 방법(측정/계산/추정)별 배출량 구분이다.","options":["있음","일부","없음"],"ans":1,"quote":"1. 국내 생산법인 및 비생산시설의 Scope1및 Scope2 배출량은 한국 배출권거래제(K-ETS)에 따라 로이드인증원에 의해 별도 검증된 결과가 반영됨.","page":156,"co":"kia","look":"검증의견서 Scope 2 표, 데이터표"},{"id":"kia-j39","type":"judge","q":"KSSB에서 선택 공시인 '톤당 내부탄소가격'을 기아 2026 보고서는 공시하고 있는가?","ref":"KSSB 제2호 선택공시 — 톤당 내부탄소가격","why":"산식(탄소변화량 × 내부탄소가격)과 용도는 있지만 톤당 가격 숫자가 없다. KSSB 선택공시를 채운 것은 아니다.","trap":"산식이 적혀 있으면 가격이 공시된 느낌이 든다. 산식의 변수값이 없으면 공시가 아니다.","options":["있음","일부","없음"],"ans":2,"quote":"‘탄소변화량 × 내부탄소가격’으로 산출되는 내부 가격을 투자비용과","page":33,"co":"kia","look":"내부탄소가격제도"},{"id":"kia-j40","type":"judge","q":"KSSB 기준은 단기·중기·장기 예시를 주되 산업 특성에 따라 다르게 정할 수 있게 한다. 기아 보고서는 기후 위험·기회의 시간 범위를 정의하고 있는가?","ref":"KSSB 제2호 단기·중기·장기 정의","why":"단기는 KSSB 1호 정의를 차용(1년 이내), 중기는 1~5년(RE100 해외 달성 시점), 장기는 5년 초과(감축 목표 달성 시점)로 연수와 근거를 함께 적었다.","trap":"KSSB 1호를 인용했다고 KSSB 준수 선언으로 보면 안 된다. 정의 차용과 기준 준수는 다르다.","options":["있음","일부","없음"],"ans":0,"quote":"KSSB 1호 기준서에서 정의하는 단기 기간 차용","page":25,"co":"kia","look":"기후 관련 위험 및 기회의 영향 기간"},{"id":"kia-j61","type":"judge","q":"장기 목표(2045 탄소중립) 사이에 연도별 또는 중간 목표(예: 2030년)를 숫자로 제시하는가?","ref":"IFRS S2 문단 33(e) / 중간목표","why":"2035년(63%, 442천 톤)이 중간 지점이고 RE100은 2026년 32%·2030년 66%·2040년 100%, 집약도는 2026년 0.36 등 연도별 목표가 있다. 그러나 Scope 1·2 절대량의 2030년 중간 목표나 2035~2045년 사이 경로는 없다.","trap":"RE100 중간 목표를 배출량 중간 목표로 혼동하기 쉽다. 재생에너지 비중과 배출량 절대량은 다른 지표다.","options":["있음","일부","없음"],"ans":1,"quote":"탄소배출 감축                                                                         탄소배출 감축","page":32,"co":"kia","look":"로드맵 그림, RE100 계획, 42쪽 목표표"},{"id":"kia-j68","type":"judge","q":"기아 보고서가 사업장 탄소 감축을 위한 금액·기간이 있는 투자계획을 공시하는가?","ref":"IFRS S2 문단 14; TPT 실행 전략","why":"연간 예산·자본지출 계획을 수립해 관리한다고 했고, 2025년 에너지 절감 60건에 73.7억 원 투자(36쪽), 2028년까지 태양광 100MW 구축(35쪽) 같은 개별 실적·계획은 있다. 그러나 감축 목표 달성에 필요한 총 투자액과 기간은 없다.","trap":"개별 사업 금액을 모아 '투자계획 공시'로 보면 과하다. 전환계획에는 목표 달성까지의 총 소요 자금이 있어야 한다.","options":["있음","일부","없음"],"ans":1,"quote":"자본지출 계획을 수립하고, 이를 체계적으로 관리하고 있습니다. 주요 예산","page":24,"co":"kia","look":"경영진 보상·예산 감독, 에너지 효율화, RE100 자체발전"}];

   ${body||`<div class="empty">아직 남긴 것이 없다. <a href="#shelf">서재</a>에서 책을 골라 읽으며 문장을 탭해 보자.</div>`}</section>`;
  document.querySelectorAll(".ntabs button").forEach(b=>b.onclick=()=>{nf=b.dataset.f;notes()});
  document.querySelectorAll(".nitem .del").forEach(b=>b.onclick=()=>{const n=NOTES.find(x=>x.id===b.dataset.n);NOTES=NOTES.filter(x=>x!==n);persist();notes();toast("지웠다",()=>{NOTES.push(n);persist();notes()})});
}
let dq=0,dans=[];
function diag(){
  if(dq>=DIAG.length){const score=dans.filter((a,i)=>a===DIAG[i].ans).length;DIAGR={score,n:DIAG.length,t:Date.now()};persist();
    $("#app").innerHTML=`<section class="view wrap narrow"><span class="eyebrow">진단 결과</span><h1 class="ph">${score}/${DIAG.length}점</h1>
    <p class="lede">${score>=8?"기초는 충분하다. 바로 KSSB 제1·2호부터 읽자.":(DATA.b1?"Scope, 기준연도 같은 기초가 아직 흔들린다. 공통 기초 「온실가스와 Scope」부터 읽고 KSSB로 가자.":"Scope, 기준연도 같은 기초가 아직 흔들린다. 공통 기초 책이 준비되기 전까지는, KSSB를 읽으면서 밑줄 친 용어를 눌러 뜻을 확인하며 천천히 가자.")}</p>
    <div class="dlist">${DIAG.map((x,i)=>`<div class="ditem"><p class="dq"><span class="dn">${dans[i]===x.ans?"✓":"✕"}</span>${esc(x.q)}</p><p class="why"><b>${esc(x.options[x.ans])}</b> — ${esc(x.why)}</p></div>`).join("")}</div>
    <div class="navrow"><button class="btn line sm" type="button" id="dAgain">다시 풀기</button>${score<8&&DATA.b1?`<a class="btn sm" href="#read/${curS(DATA.b1).id}">기초부터 읽기 →</a>`:`<a class="btn sm" href="#read/${curS(DATA.kssb).id}">KSSB 읽기 →</a>`}</div></section>`;
    $("#dAgain").onclick=()=>{dq=0;dans=[];diag()};dq=0;dans=[];return}
  const x=DIAG[dq];
  $("#app").innerHTML=`<section class="view wrap narrow"><span class="eyebrow">진단 ${dq+1}/${DIAG.length}${x.area?" · "+esc(x.area):""}</span><div class="dbar"><i style="width:${dq/DIAG.length*100}%"></i></div>
   <h2 class="dqh">${esc(x.q)}</h2><div class="check"><div class="opts">${x.options.map((o,i)=>`<button type="button" data-i="${i}">${esc(o)}</button>`).join("")}<button type="button" data-i="-1" class="skip">모르겠다</button></div></div>
   <div class="navrow"><a class="btn line sm" href="#shelf">그만두기</a><span></span></div></section>`;
  document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{dans[dq]=+b.dataset.i;dq++;diag()});
}
let rq="",rt="terms";
function ref(){
  const terms=Object.entries(TERMS).map(([t,v])=>({t,d:v.d,en:v.en}));
  const q=rq.trim().toLowerCase();
  const AL={"스코프":"scope","scope":"스코프","온실가스":"ghg","ghg":"온실가스"};const qs=[q,...Object.keys(AL).filter(k=>q.includes(k)).map(k=>q.replace(k,AL[k]))];
  const scored=q?terms.map(x=>{const t=x.t.toLowerCase(),en=(x.en||"").toLowerCase();const sc=Math.max(...qs.map(q=>t===q?100:t.startsWith(q)?80:t.includes(q)?60:en.includes(q)?40:x.d.toLowerCase().includes(q)?10:0));return {x,sc}}).filter(o=>o.sc).sort((a,b)=>b.sc-a.sc||a.x.t.localeCompare(b.x.t,"ko")).map(o=>o.x):terms.sort((a,b)=>a.t.localeCompare(b.t,"ko"));
  const map=DATA.s2.flatMap(s=>s.blocks.filter(b=>b.kssb).map(b=>({s,b})));
  $("#app").innerHTML=`<section class="view wrap narrow"><span class="eyebrow">참고</span><h1 class="ph">참고</h1>
   <div class="ntabs" role="group">${[["terms","용어집"],["map","KSSB ↔ IFRS S2"],["about","만든 방법"]].map(([k,l])=>`<button type="button" data-t="${k}" aria-pressed="${rt===k}">${l}</button>`).join("")}</div>
   ${rt==="terms"?`<input class="search" id="rq" type="search" placeholder="용어 검색 (예: 스코프 3, 중요성)" value="${esc(rq)}"><p class="rcount">${scored.length}개 · 제목이 맞는 항목이 먼저 나온다</p><dl class="glos">${scored.map(x=>`<div><dt>${esc(x.t)}${x.en?`<small>${esc(x.en)}</small>`:""}</dt><dd>${esc(x.d)}</dd></div>`).join("")}</dl>`:""}
   ${rt==="map"?`<p class="rcount">IFRS S2 교재의 블록마다 대응하는 KSSB 문단. 색이 있는 줄이 두 기준이 다른 곳이다.</p><div class="tw"><table class="mapt"><thead><tr><th>IFRS S2</th><th>KSSB</th><th>관계</th><th>내용</th></tr></thead><tbody>${map.map(({s,b})=>`<tr class="${b.diff}"><td><a href="#read/${s.id}">${esc(b.no)}</a></td><td>${esc(b.kssb)}</td><td>${esc(DIFF[b.diff]||"")}</td><td>${esc(b.label)}</td></tr>`).join("")}</tbody></table></div>`:""}
   ${rt==="about"?`<div class="about"><p>본문은 각 기준서 원문(KSSB 2025 공표본, IFRS S2 2023년 6월판과 2025년 12월 개정 문서)을 문단 순서대로 읽고 쉬운 말로 풀어 썼다. 원문 인용은 블록마다 두 문장 이하로 줄였다.</p><p>예시는 기아·현대자동차 보고서에 실제로 있는 문장과 숫자만 썼고, 쪽수를 달았다.</p><p>검토 단계: 원문 대조까지 마쳤다. 전문가 검토는 아직이다. 틀린 곳을 찾으면 알려 달라.</p><p>예전 문제 풀이 버전(v4.5)은 <a href="legacy.html">여기</a>에 남겨 두었다.</p><p class="srcl">빌드 2026-10-24</p></div>`:""}</section>`;
  document.querySelectorAll(".ntabs button").forEach(b=>b.onclick=()=>{rt=b.dataset.t;ref()});
  const inp=$("#rq");if(inp){inp.oninput=()=>{rq=inp.value;const p=inp.selectionStart;ref();const n=$("#rq");n.focus();n.setSelectionRange(p,p)}}
}

let view="shelf";
function route(){const [h,arg]=(location.hash||"#shelf").slice(1).split("/");view=["shelf","book","read","notes","ref","diag"].includes(h)?h:"shelf";hideSel();closeSheet();$("#progress").hidden=view!=="read";$("#progressBar").style.width="0";
  document.querySelectorAll(".bar nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===view||(a.dataset.v==="shelf"&&["book","read"].includes(view))?"page":"false"));
  if(h==="soon"){toast("이 책은 아직 준비 중이다");history.replaceState(null,"","#shelf");view="shelf"}
  if(view==="read"){CUR=null;read(arg)}else if(view==="book")book(arg||BID);else if(view==="diag"){dq=0;dans=[];diag()}else ({shelf,notes,ref})[view]();window.scrollTo(0,0)}
addEventListener("hashchange",route);
function themeLabel(){const r=document.documentElement.getAttribute("data-theme");const dark=r?r==="dark":matchMedia("(prefers-color-scheme: dark)").matches;$("#themeL").textContent=dark?"밤":"종이"}
$("#theme").onclick=()=>{const r=document.documentElement,cur=r.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.setAttribute("data-theme",dark?"light":"dark");try{localStorage.setItem("proto-theme",dark?"light":"dark")}catch(e){}themeLabel()};
try{const t=localStorage.getItem("proto-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
initData();Object.keys(DATA).forEach(k=>kb(k));themeLabel();route();
</script>
